investigation_notes:
  - 来源观察：source-kimi-code-repo e12cad1a4b9b3e7befbb0703a3b8b68a5c6e9fe5 →
    9a82686b0e91c532f4d49da0bc088a0eac9bdede（42 commits / 583
    files）；source-kimi-code-npm 2.7.2 → 2.7.3
    仅身份前移（未下载包字节，不产生映射或章节影响）；source-kimi-code-legacy-repo 未变。triage 只读取
    /tmp/gitdiff/kimi-code--source-kimi-code-repo.diff 中 7 个 cited 文件的
    hunk，并按需读取同一轮变更的 docs/en/customization/mcp.md 与 3 个 changeset。
  - docs/en/configuration/env-vars.md：删除 KIMI_CODE_EXPERIMENTAL_SUBAGENT_FORK 与
    KIMI_CODE_EXPERIMENTAL_TOOL_SELECT 两行；KIMI_CODE_SESSION_LOCK
    行新增「异主机名锁自动回收」以及跨机器/容器共享会话目录时只允许一个写者或关闭开关的提示。configuration-v2
    正文不逐项枚举这些开关，config.defaults/config.runtime 的机制答案不变，配置章不新建 edition；受影响结论落在
    MCP 与 local_transcripts 章。
  - packages/agent-core-v2/src/agent/tools/agent/agentTool.ts：删除
    SUBAGENT_FORK_FLAG_ID 分支、agent-fork.md 描述、fork 参数校验与 fork 遥测字段，parameters
    恒返回完整 schema；SelectTools 只按 dynamically_loaded_tools + tool_use 能力过滤，不再检查
    TOOL_SELECT_FLAG_ID。判定为 custom_agents 与 mcp 的知识变化。
  - packages/agent-core-v2/src/session/subagent/subagentService.ts：planSpawn 无
    fork 分支，requestedProfileName 缺省 DEFAULT_PROFILE_NAME，绑定走
    resolveSubagentBinding；spawn 恒走 agentLifecycle.create 并继承权限/用户工具。与 agentTool
    的删除属同一语义变化（agents.invocation/agents.limits）。
  - packages/agent-core-v2/src/persistence/backends/node-fs/sessionLockService.ts：claim
    仅在同一 hostname（或空 hostname）且 alive() 时返回 occupied；reclaim 对 hostname
    非空且不同的锁直接 unlinkSilent；alive() 对异主机仍返回 true，但不再是判定占用的充分条件。判定为
    transcripts.cleanup/transcripts.diagnostics 的知识变化（跨机共享数据目录不再互斥）。
  - "packages/agent-core-v2/src/workspace/sessionLifecycle/sessionLifecycleServ\
    ice.ts：构造函数由注入 IWorkspaceMcpService 改为 acquireMcp():
    Promise<ProgramMcpLease>；新增 openWorkdir() 在打开会话工作目录时获取 MCP lease，dispose
    链同时释放 mcp 与 workdir。判定为 mcp.lifecycle 的机制变化；其余 session 创建/恢复流程无答案变化。"
  - "packages/agent-core-v2/docs/wire-manifest.d.ts：TurnEndedPayload 新增可选
    replyModel {provider, model} 与 modelSteps[]（step、role:
    step|subagent、model、provider、isKfc、requestId?）；65 个 durable 记录类型与协议版本未变。判定为
    transcripts.schema 的增量，该题保持 partial（isKfc 判定来源、turn.prompt/turn.cancel
    字段仍未固定）。"
  - packages/agent-core-v2/test/session/subagent/forkParity.test.ts：fork
    用例移除、describe 改为 btw parity；新增 expectForkBaselineParity 断言启动前连接的 MCP
    工具进入父子共享的 baselineTools 与请求工具列表，启动后连接则仅注册表可解析而请求列表仍为 ['Read']。作为
    mcp.lifecycle/exposure 的测试证据；测试重命名本身不计知识变化。
  - docs/en/customization/mcp.md（同一 existing reference 指向的文档小节）：Loading tools on
    demand 改为仅要求模型声明 dynamically_loaded_tools，并描述 ToolSelect 解析器移除 deferred
    顶层条目、初始提醒与 delta、select_tools 注入 system message、无动态加载能力时按普通声明发送。旧
    ref-kimi-code-mcp-deferred 与其 21406fb 快照保持不动，新 edition 改用
    ref-kimi-code-mcp-dynamic-loading-9a82686。
  - 选择：仅 custom_agents、mcp、local_transcripts 新建完整
    edition（kimi-code-cli-custom_agents-v5、kimi-code-cli-mcp-v4、kimi-code-local_transcripts-v3）并更新
    registry/chapter-current.yaml。configuration、hooks、skills、custom_providers、native_plugins
    无固定问题答案变化。排除：内部依赖注入重构、MCP 认证 UI 文案、2.7.3 release notes、测试重命名、依赖与性能改动。
  - 独立复核：reviewer ReviewKimiCode 返回 changes_requested，5 项均已按指定原文应用。(1) MCP 生命周期改为 program 级引用计数租约：会话工作目录持 lease、最后一个 lease 释放才停 server（新增 ref-kimi-code-mcp-program-lease-9a82686，固定 packages/agent-core-v2/src/program/programMcp.ts:38-53）。(2) 锁的异主机回收限定为能取得 .reclaim 时；异主机 .reclaim 残留被 alive() 视为存活，回收不删除，两次认领尝试后以 session.occupied 失败，需手工删除（新增 ref-kimi-code-lt-src-session-lock-alive-9a82686 与 ref-kimi-code-lt-src-session-lock-occupied-9a82686）。(3) 删除无固定证据的 same-turn select_tools 表述，并补充子 Agent 侧 SelectTools 需同时满足 dynamically_loaded_tools 与 tool_use（ref-kimi-code-agents-select-tools-ungated-9a82686）。(4) turn-ended-models 摘录改为逐字缩进；baseline 共享另加 ref-kimi-code-mcp-baseline-shared-9a82686；layout 节补 reclaim 引用。(5) 本审计 reviewed_by 合并记录该独立复核，覆盖两项高影响触发（tool-select 前置步骤被推翻、跨机锁互斥语义变化），复核后未发现新冲突。
