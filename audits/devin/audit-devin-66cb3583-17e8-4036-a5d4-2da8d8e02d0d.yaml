investigation_notes:
  - 本轮 31 个来源全部报 changed。以本 Agent 自己运行的 pnpm sources:scan devin 为准，30 个
    official_documentation 页面的 observed hash 与父进程 sources:check 导出的 observed 逐个一致，
    新字节已由扫描器按 archived_document 候选落在 archive/devin/artifact-<source-id>-<hash12>/source.md。
  - 复核方法：把新取回原件与本产品既有 206 条文档引用摘录做空白归一后逐行逐字比对，205 条全部命中。
    唯一未命中的是 ref-devin-plug-metadata 一行：上游把 "Only `name` is used for the plugin's
    identity and namespace" 收紧为 "Only `name` is used for the plugin's namespace"（cli/extensibility/plugins/overview.md
    的 Metadata 小节）。语义未变，`name` 仍是唯一决定命名空间的字段，plugins.package 的答案不变，
    因此不改写章节正文；该引用仍锚定它声明的旧快照，不改摘录以免与所声明的原件不符。
  - 字节变化的主体是文档站渲染样板：30 个页面页尾都新增了一行 Mintlify 署名
    "This documentation is built and hosted on [Mintlify](https://mintlify.com), a developer documentation
    platform."，这是站点样板，不构成任何机制证据。cli/reference/configuration/global-vs-local.md 的
    Configuration Layers 小节里 MCP 专用文件那条 Note 本轮补上了 "In CLI versions before v3000.3 (the Local
    3.6 release)" 的版本边界，该事实在 mcp 与 configuration 两章已由 ref-devin-mcpc-file 与
    ref-devin-precedence-layers 覆盖并写明 v3000.3 前后边界，无需新增正文。
  - source-devin-npm 无 baseline 字段，扫描器因此按 observed≠baseline 报 changed；observed
    3000.6.11@sha512-q4oSmCGmnlOcUhJU9RyPRk7hAvR96A+uW0aggBQbRExGP4vcYeyM+V3Z6aEFWfG5PB/889V3+sRfPx3egQkYFw==
    与 knowledge/devin/artifacts/artifact-devin-npm.yaml 记录的版本与 integrity 完全相同，身份未变。
    按规则 npm 版本身份本身不构成章节变化或源码到包的映射，本轮不新建 mappings/。
  - 七章正文均无需改写：53 个受影响问题在七个主题上逐一按新原件复核，已发布答案与新观察一致，
    故 pending_question_ids 清空，章节仍为 v1，registry/chapter-current.yaml 不动。
  - 无 Git 来源，本轮未调用 sources:workspace，无工作区需要关闭。
  - 未触发独立复核三类条件：来源之间无冲突（唯一差异是上游自身措辞收紧），没有新来源推翻已发布的
    配置步骤，也没有跨主题关键加载机制变化。
  - 遗留缺口（不属本轮可写范围）：docs.devin.ai/llms.txt 的 38 个 /cli/ 页面里有 8 个未登记为来源
    （cli/acp/jetbrains、cli/acp/xcode、cli/acp/zed、cli/changelog/stable、cli/enterprise/windsurf-auth、
    cli/reference/keyboard-shortcuts、cli/reference/terminal-compatibility、cli/ssh）。已登记的 30 个页面
    全部仍在索引内。抽查结论：cli/ssh 只是 SSH 接入说明，无配置机制；cli/enterprise/windsurf-auth 提到
    "CLI access" 的按用户设置优先于团队默认策略，现有 ref-devin-auth-access 只覆盖了 RBAC 角色侧。
    登记新来源要写 registry/sources/，超出本轮 knowledge/devin 与 audits/devin 的写入范围，留给下一轮。
  - 留存缺口：30 个 artifact 记录声明的 archive_path（archive/devin/artifact-<source-id>/raw.md）在本工作树
    均不存在。核对后确认是工作树级的现象而非本产品缺陷——全仓 685 个声明的 archive_path 有 640 个缺失，
    因为 archive/ 被 .gitignore 排除，本监控工作树从未包含既往原件。因此本轮无法对旧原件做逐字节 diff，
    结论建立在"既有引用摘录是否仍逐字存在于新原件"之上，而非新旧全文比对。
  - 本轮向父进程交付的改动只有 audits/devin/ 下的审计 YAML 与同名 .md 报告；knowledge/devin/ 未改动。
