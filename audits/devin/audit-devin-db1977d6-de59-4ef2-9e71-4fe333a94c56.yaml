investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 custom_agents 的固定问题。
  - docs/cli-essential 与 docs/cli-subagents 两个来源内容哈希变化，但上一版原件未被 archive
    保留，无法逐行比对；只能以当前原件对照章节已登记结论核实是否仍成立。
  - 已读入口：archive/devin/artifact-source-devin-cli-subagents-22a8a7142ddf/source.md
    （章节 How Subagents Work、Which Model Does a Subagent Use?、Influencing the
    Model、 Enterprise Controls、Enabling and Disabling Subagents、Subagent
    Profiles、Tool Permissions、Monitoring Subagents、Foreground / Background
    Switching、Interrupting a Turn、Cancelling Subagents、Resuming
    Subagents、Nesting Depth、Custom Subagents 及其子节 Creating a Custom Subagent /
    Definition File Format / Frontmatter Fields / How Custom Subagents Are Used
    /
    Examples）；archive/devin/artifact-source-devin-cli-essential-5732ff4937eb/source.md
    （Essential Commands、Starting Devin CLI、Running shell commands、Modes、Session
    History、 Devin Cloud、Slash Commands、Keyboard Shortcuts）。另只读参照未变来源
    archive/devin/artifact-source-devin-cli-config-file-2d49f48a2677/source.md 的
    Options Reference / agent 段，确认 agent.subagent_model 尚未登记进配置选项表。
  - 逐条结论（对当前保留原件）：agents.entry 成立——Creating a Custom Subagent 段仍写
    agents/<name>.md 与 agents/<name>/AGENT.md 两种布局、AGENT.md > AGENTS.md >
    agent.md > agents.md 优先级、frontmatter 的 name
    字段覆盖路径推导标识，.devin/agents/、.agents/agents/、 ~/.config/devin/agents/（Windows
    %APPDATA%\devin\agents\）路径与已发布结论一致。 agents.format 成立——Definition File Format
    仍写与 skill 相同的 YAML frontmatter 加 系统提示，Frontmatter Fields 表仍是
    name/description/model/allowed-tools/max-nesting 五字段且默认值与 ask_user_question
    不可授予的说明未变。 agents.invocation 不再完全成立——Influencing the Model 段由"两个手段"改为"三个手段"，
    新增 `agent.subagent_model` 用户配置杠杆，已发布 ref-devin-sub-influence 摘录只含前两个，
    故新建完整版次 devin-cli-custom_agents-v2 并新增 ref-devin-sub-influence-user-model、
    artifact-source-devin-cli-subagents-22a8a7142ddf 与
    snapshot-devin-lt-subagents-22a8a7142ddf； v1 原样保留。
  - 诚实限制：本轮只能确认当前原件仍支持上述已发布答案，**不能排除**这两个页面的其他部分 也发生了变化——旧一版原件（essential 基线
    c303b347…、subagents 基线 eecfc36f…）未被 archive 保留，逐行 diff 不可能。archive 内虽另有更早的
    8db93ee1…/673dfc4e… 两版，但它们既非 本轮基线也非当前版，只能作为参考、不能充当基线比对。因此本审计不写"无变化"。
  - 超出本轮入口、留待协调者决定的观察：(1) 同一次 subagents 页变化还把 Cancelling Subagents
    的前台取消键由"Ctrl+C 或 Esc"改为"空输入时 Ctrl+C，或连按两次 Esc；非空草稿时 Ctrl+C 先清草稿"， 触及
    agents.limits / agents.diagnostics；v2 已按当前原件更正该句（原句写作"Ctrl+C 或 Esc"， 与
    pinned 原件矛盾），agents.diagnostics 的答案相应由 answered 降为 partial，问题保持 pending；(2)
    同一次变化新增 Foreground / Background Switching 与"面板 f 键拉前台"的表述，与
