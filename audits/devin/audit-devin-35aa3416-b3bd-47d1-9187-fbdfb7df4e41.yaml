investigation_notes:
  - "观察与窗口：本轮 checks 全部取 2026-11-25 的只读观察（30 个文档来源 changed，npm 3000.6.11 身份未变）。devin 的最新已登记 snapshot 多为 2026-09-30，早于冻结基线（多数 2026-10-04）；archive/ 另保留冻结基线原件与更晚副本。本轮逐页用「该来源最新的既有原件 → 2026-11-25 观察」做语义 diff，窗口起点写在各来源笔记里，不把 2026-09-30 到该起点之间的变化归因本轮。"
  - "逐来源笔记（窗口起点 → 2026-11-25）：adaptive 10-23，仅措辞与 Enterprise/Desktop 设置名；auth 10-04，仅链接；cloud 10-04，新增 Use your local machine，cloud 页移除 /archive 但 commands 页仍保留；commands 10-04，新增 drs secret-create 取值来源、devin connect、/resume picker、/rename 别名、/recap、/vim、/codex、/fusion、/undo-add-dir，删除 /loop；config-ext 10-04，排版；config-file 10-23，新增 permission_mode/pinned_models/local_tools_bypass_permissions/codex/kiro，show_path 默认改 true；controls 10-04，页面重写，Limitations（Memories/Workflows/App Deploys/Arena）与 App Deploys 不支持项被移除；essential 10-23，Smart 措辞、Esc Esc、resume picker、add-dir、/loop 删除；ext-index 10-04，新增 Codex/Kiro 行；fusion 10-04，默认 pairing 改为 Opus 5.5 Medium + SWE-2 Medium；handoff 10-04，外部 handoff 改为 Devin API/prompt；hooks-lifecycle 10-04，新增 surfaces、SessionStart 恢复/云端语义、SessionEnd 云端不触发、ask_user_question；hooks 10-04，同事件表措辞与超时/不可读输出按错误；import 10-23，新增 Codex/Kiro 与 .codeium/skills，Claude commands-as-skills 行移除；index 10-04，安装/Quickstart 排版；mcp-config 10-04，新增 oauthScopes/disabledTools 与插件 MCP 链接；mcp-overview 10-04，排版；models 10-04，新增 Pinned Models；permissions 10-04，批准选项改为 once/session/project/always 并链到 permission_mode、Smart 可用性改为组织策略/沙箱条件、命令审批的 Describe 选项移除；plugins-quickstart 10-04，链接；plugins 10-04，hooks 覆盖 cloud、platforms/logo、list/update 与 Required/Offered、MCP 凭据占位符；precedence 10-04，排版；rules 10-04，排版；sandbox 10-04，链接；skills-create 10-04，链接；skills-overview 10-04，新增 .kiro 位置与第三方来源句；subagents 10-14，排版/图片；system-config 10-04，proxy 新增 gzip；team-settings 10-04，链接与 Desktop controls 引用；troubleshooting 10-04，accordion 化。"
  - "语义结论：真正改变读者答案的是 config-file/models/fusion/adaptive/import/skills-overview/mcp-config/hooks-lifecycle/hooks/plugins/permissions/system-config。其余 changed 页剔除 MDX→Markdown 改写（[!NOTE]/Tabs/Card/Accordion、链接改为 .md 绝对 URL）后与上一版逐字相同。"
  - "排除：permissions 的命令审批改为按 e 编辑、Local Hands 说明与 cloud 页的 devin connect 属 config.trust/plugins 范围；commands 的 drs secret-create 与 /vim 等属产品操作面，不在八主题内；本轮不改这些章节。controls 页移除 Limitations 字样不构成「机制不存在」的新断言，旧引用仍锚定其自身 snapshot，章节不改。"
  - "保留：custom_agents 与 local_transcripts 未出 edition。custom_agents 的 subagents 页无实质变化；local_transcripts 的新增命令不改变存储/格式/清理答案，且 /archive 仍有 commands 页证据。"
  - "历史 pending：旧审计中的 configuration 云端账号来源（read_config_from.cloud 只读用户配置、组织策略优先）与 custom_agents 的 agent.subagent_model/诊断取消键句仍未完成高影响独立复核；本轮没有新证据也不重开，pending_audit_refs 清空只表示本审计不依赖它们结案，旧审计的未完成项保持历史待办。"
  - "复核：本轮为来源级知识维护，无来源冲突、未推翻已发布配置步骤、未改变加载顺序/优先级机制；插件 platforms 与 hooks 的 cloud 语义属附加条件，不触发独立复核。作者已对六个新 edition 逐节核对引用、问题、surface 与版本边界（全部 version_applicability: unknown）。"
