    unchanged（controls、plugins-quickstart），npm 身份 3000.6.11 未变。
  - 逐页把新页与 archive/ 下基线条目做语义比对（剔除 MDX→Markdown 的
    <Note>/<Tabs>/<Card>/<Accordion> 改写后再比）：8 页有实质新增，其中 7 页落在本轮派发主题——
    config-file 参考的当前页面包含 agent.subagent_model、local_tools_bypass_permissions、
    read_config_from.cloud 三个键（本轮直接基线 5d2d8bfb9896 未被 archive 保留，可比的只有 2 周前副本
    2d49f48a2677，故只记"当前页面包含"，不归因本轮）；import 新增 Devin Cloud 配置来源与 cloud=false
    开关；permissions 与 cloud 新增 Local Hands/云会话沿用本机权限规则的说明；commands 新增 devin
    connect；essential 新增 /billing；adaptive 新增"Adaptive 不可用"的模型限制排查提示，并删除了原
    "Use Adaptive as your default" 提示——Fusion 推荐在 2 周前副本 ecd296435968:31 已存在，本轮只是
    <Tip>→[!TIP] 的标记改写，不算新增；plugins 页新增 `devin plugins list`/update 与 Required/Offered
    差异，属 native_plugins 主题、本轮未派发（登记在该 topic 的 impact）。其余 changed 页
    （mcp-config、mcp-overview、precedence、hooks、hooks-lifecycle、skills-overview、skills-create、
    subagents、rules、ext-index、system-config、team-settings、troubleshooting、sandbox、models、
    fusion、handoff、auth、index）只改排版、代码块语言标注或链接。
  - mcp-config 语义核对结论：MCP server 迁到各层独立 mcp_config.json、v3000.3 自动迁移、远程默认
    Streamable HTTP 并在非认证 4xx 时回退 SSE，这些都已在基线条目与已发布 mcp 章节里写明，本轮页面只是 把 MDX 组件改成
    Markdown 提示块，不构成机制变化。
  - 复核中仍有 26 条引用在剥离标记后不逐字命中（上游报告口径 34 条），逐页语义比对确认它们只属 排版或措辞改写；相应结论仍成立，因此保留旧引用（其
    snapshot 仍指向归档基线），不改写摘录。
  - 改写范围：custom_providers、mcp 出新 edition（v2）并切换 registry/chapter-current.yaml；
    configuration 与 custom_agents 的 v2 已写好，但本轮含跨主题关键加载机制变化（Devin Cloud 账号来源、
    只读用户配置的 read_config_from.cloud、以及优先于 router 与管理员团队默认的 agent.subagent_model），
    独立复核为 changes_requested，因此 registry 暂保持指向已发布的 v1；skills 与 hooks 的小节只受排版
    影响、结论未变，保持 v1。引用与 snapshot/artifact 只绑定归档原件：复用了 10-13 轮已归档的
    artifact-source-devin-cli-subagents-22a8a7142ddf（raw_sha256 22a8a7142…），另新增 4 个绑定本轮
    观察 hash 的 snapshot/artifact；原件路径按 sources:scan 的命名登记，本轮 monitor 只做只读检查未落
    原件，集成后需要时由 sources:scan 保留原件。
  - 排除：permissions/cloud/commands 中新增的云会话（Local Hands）与 devin connect 行为属
    config.trust（本轮未派发）与 plugins 范围；只把与派发问题直接相关的 local_tools_bypass_permissions
    默认值写进 configuration 的 config.defaults，不扩写到未派发问题。
