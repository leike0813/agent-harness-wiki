investigation_notes:
  - "扫描范围：source-zoo-code-repo 的 bf3bc781b813a2a6cbdb29dfd7c86f423589090e → 72143527fd33306e5541116093c2cbf803cce9e0，共 158 个 changed_paths（受管工作区 ws-72143527fd33-21fa13c0-1d31-46c2-95f3-5c39d6014236，owner-pid 2935516，读完已关闭）。extension 清单版本由 3.84.0 升到 3.86.0。"
  - "输入文件与本次观察的差异：父进程 sources:check（2026-10-03T14:50:15Z）记录 source-zoo-code-docs 为 blocked（git ls-remote 失败，fatal: Failure when receiving data from the peer）、source-zoo-code-repo 为 changed（observed 7186191a62ee816d93bae18d34810f1e6ddf1905），整体 status=blocked。本轮两次扫描（19:42:47Z、19:43:04Z）中三个来源全部 unchanged：docs 仓库已可达且 HEAD 仍为 dfd2628c31073ec6b111bfedbcd071d197d37ad2，docs 站点 hash 未变，仓库 HEAD 为 72143527…。因此 docs 来源在本轮不再构成阻塞；其失败方式为一次性传输层故障，未取得新身份，也未阻塞任何固定问题。"
  - "上游在两次观察之间继续前进：父进程观察到的 7186191a… 已不是 HEAD，本轮实际观察到 72143527…，调查以本轮观察到的精确提交为准。"
  - "基线链接效应：同一 session 内第二次扫描（audit-zoo-code-39551cf6-cccf-427c-9b3e-e554581f2c83）报 no_change，是因为扫描器以「上一份审计的 observed」作为基线（src/sources/scan.ts:522-527），基线已由本审计推进到 72143527…。该 no_change 不得读作本轮无变化；承载变化的是本审计。"
  - "实际影响面（对照 changed_paths 逐目录复查）：custom_providers 与 configuration 受影响；custom_agents、mcp、native_plugins、skills 四个主题无相关源码改动。src/services/mcp/**、src/services/skills/**、src/core/modes/**、src/core/roomodes/** 在该区间内零改动，src/core/modes 与 src/core/roomodes 目录在固定提交中已不存在。"
  - "configuration：新增全局开关 alwaysDenyUnapprovedCommands（globalSettingsSchema 布尔项，DEFAULT_ALWAYS_DENY_UNAPPROVED_COMMANDS = false，只在 autoApprovalEnabled + alwaysAllowExecute 已开时生效），设置界面在 Auto-Approve 区提供独立复选框。命令判定新增结构化自动拒绝原因（denylist / not_allowlisted / dangerous_substitution / malformed_command / dcg / guard_unavailable），并新增 getCommandDecisionDetailed 返回命中的子命令与拒绝前缀。已发布 v2 章节：zoo-code-vscode-configuration-v2.md，覆盖 config.sources、config.runtime、config.defaults、config.diagnostics 四个小节。"
  - "custom_providers：内置模型表变更——新增 gpt-6.1-sol（OpenAI 原生路径 contextWindow 1,050,000、reasoningEffort 默认 medium、带 longContextPricing 272,000 阈值与 flex/priority 分层；OpenAI Codex 订阅路径 contextWindow 872,000、默认 low、价格 0）与 deepseek-v4.1-flash（OpenCode Go，1,000,000 上下文、384,000 最大输出、允许 reasoningEffort=disable）；claude-opus-5-5 移除 supportsReasoningBudget 并去掉 maxTokens 被下调到 8k 的注释，改为固定 adaptive thinking。已发布 v2 章节：zoo-code-vscode-custom_providers-v2.md，覆盖 providers.models、providers.metadata（providers-models 小节）。"
  - "hooks：hooks-entry 把「自动批准（Auto-Approve）」列为常被误认为 Hook 的机制，理由是「只是跳过确认，不注入回调」。新增 blanket deny 分支后该判定仍成立——它依旧是一个布尔设置在 ask 与 deny 之间切换，不引入事件注册或回调分发，hooks.events 与 hooks.entry 的 not_applicable 结论不受影响，故不改写该章节。"
  - "记录分歧（不构成高影响分歧，未推翻已发布步骤）：固定提交 README 的 “What's New in v3.86.0” 提到 “enforce MCP tool policy”，但 bf3bc781…→72143527… 区间内没有任何 src/services/mcp/** 改动，src/core/prompts/tools/effective-tool-policy.ts 也未变。可用版本/发布边界解释：README 描述整个 v3.86.0 发布，而本轮固定的只是一个提交区间；该 MCP 工具策略的证据仍以已发布的 ref-zoo-code-src-tool-policy（commit bf3bc781…）为准，mcp 章节不改写。"
  - "未建立任何软件版本映射：本轮只观察源码提交身份，zoo-code 未登记 npm 来源，也没有证据把扩展清单版本 3.86.0 绑定到已发布章节。"
  - "独立复核判定：按 harness-maintenance 第 5 节三类高影响条件自查——来源之间无冲突（repo 与 docs 一致，docs 站点 hash 未变）；新来源未推翻任何已发布配置步骤（新开关默认关闭，模型条目为新增或元数据修正）；无跨主题关键加载机制变化（MCP/skills/modes 零改动）。三类条件均未触发，故本轮自检后置为 reviewed。附带说明：本子代理在本会话内没有原生 subagent 委派入口，若父进程判定上述任一条件成立，需另行委派只读复核。"
  - "本轮未运行 pnpm ahw publish、pnpm chapters:update、pnpm managed:packages，未切换任何发布指针，未做受管二进制核对（delivery=pr）。未修改 registry/chapter-current.yaml。"
