investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 custom_providers 的固定问题。
  - "仓库单提交 1d37994（fix(openai): preserve reasoning for local OpenAI-compatible
    models via R1 toggle，71 个文件），与章节已引证据文件重合的有
    src/api/providers/{base-provider,openai,deepseek,zoo-gateway}.ts、src/api/pr\
    oviders/fetchers/modelCache.ts、src/core/webview/{ClineProvider,webviewMessa\
    geHandler}.ts。"
  - 先核实 OpenAI 兼容 provider 的 reasoning 传递与模型目录缓存是否改变已登记的 provider 字段或发现规则。
  - "已检查并纳入（章节已引证据文件）：src/api/providers/openai.ts（+21/-4，R1 判定收敛为 usesR1Format(modelId)，createMessage 第 101 行改调该方法；getModel() 第 322-332 行在 R1 成立时把 info 覆盖为 preserveReasoning: true）；src/api/providers/base-provider.ts（+9/-1，新增 getModelCacheScope() 默认三项全 false，第 154-160 行）；src/api/providers/fetchers/modelCache.ts（+88/-168，删除 URL_SCOPED/KEY_SCOPED/AUTH_SCOPED 三个 provider 名单与 fetcher switch，改为读 handler.getModelCacheScope() 与 handler.fetchModels()，缺 fetchModels 时抛 Provider <id> does not expose a dynamic model catalog）；src/api/providers/deepseek.ts（+15/-2，新增 override getModelCacheScope urlScoped 与 fetchModels）；src/api/providers/zoo-gateway.ts（+19/-3，同上且三项全 true）；src/api/providers/openai-compatible.ts（+10/-8，processUsageMetrics 改读 inputTokenDetails.cacheReadTokens 与 outputTokenDetails.reasoningTokens）；src/api/index.ts（+26，ApiHandler 新增可选 fetchModels 与必需 getModelCacheScope，新增 ModelCacheScope 接口）；src/core/webview/webviewMessageHandler.ts（+55/-13，新增 handlerFor() 用 buildApiHandler 构造 handler 并透传给 getModels/flushModels）；src/core/webview/ClineProvider.ts（+1，forceFullModelDetailsLoad 多传一个 lmstudio handler）。"
  - "扩到未直接引用但被上面机制拉动的文件（依据：这三处是 R1 判定与 adaptive thinking 的实际生效点，且与已引证据文件同一提交）：src/api/transform/reasoning.ts（第 127-136 行 getAnthropicProviderReasoning 在 supportsReasoningBinary 分支返回 { type: \"adaptive\", display: \"summarized\" }，并新增类型注释说明 display 的取值原因）；src/core/task/Task.ts（第 6106-6115 行以 requestModelInfo.preserveReasoning 决定推理块是否随请求回传）；packages/types/src/provider-settings/openai.ts（第 88-96 行 openAiR1FormatEnabled 字段，位于 openAiProviderDefinition schema）；webview-ui/src/components/settings/R1FormatSetting.tsx（第 10-24 行该开关的复选框 UI）。"
  - "已检查并排除（同一提交内、与已发布 provider 机制无关）：src/api/providers/anthropic-vertex.ts 与 src/api/providers/anthropic.ts 只把 output_tokens_details.thinking_tokens 映射成 usage 里的 reasoningTokens，不改请求体；src/api/providers/{kenari,lite-llm,nanogpt,requesty,vercel-ai-gateway,unbound}.ts 与 openrouter、poe、lm-studio 只机械补 getModelCacheScope()/fetchModels() 并把 this 透传给 getModels，scope 取值与被删除的旧名单逐项一致（lite-llm/poe/requesty 为 url+key，moonshot/nanogpt 依旧名单，kimi-code 为 key+auth，openrouter/vercel-ai-gateway/unbound/kenari/opencode-go 三项全 false）；src/api/providers/fetchers/lmstudio.ts 与 modelEndpointCache.ts 只增加 handler 形参；src/core/task/__tests__/reasoning-preservation.test.ts 及其余 __tests__ 为测试；extract-text*、image-cleaning、package.json、AGENTS.md、eslint-suppressions、.github workflow 等 71 文件清单中的其余项与 provider 无关。"
  - "逐问题结论：providers.protocol 变（R1 判定入口与 adaptive thinking 的 display 参数进入请求体）；providers.forwarding 变（openAiR1FormatEnabled 这一用户可写档案字段现在同时决定消息转换与推理保留）；providers.models 变（目录抓取与缓存分键的归属从 modelCache 内的 provider 名单移到 handler 契约）；providers.metadata 变（preserveReasoning 可在运行时合成，adaptive thinking 的显示方式由 metadata 决定）。据此新建完整 edition zoo-code-vscode-custom_providers-v5，v4 保留不改。"
  - "范围外未受影响：providers.entry、providers.auth、providers.responses、providers.diagnostics 四条结论所依赖的文件（档案字段、严格工具 schema 的四处请求拼装点、handleProviderError、rateLimitSeconds、Codex 重试与取消）在 1d37994 的 71 个文件里没有被改动，维持原结论并保留 pending。"
  - "结论改动了已发布机制（R1 开关的作用范围、模型目录缓存的归属），按维护契约保持 review_status 为 pending，交付独立复核；本审计仍引用两个未结旧审计 audit-zoo-code-f9720bc5-ced6-4b53-8895-f2f811b13824 与 audit-zoo-code-583abb97-bedb-4196-abc0-054e4fe26037，不代为关闭。"
