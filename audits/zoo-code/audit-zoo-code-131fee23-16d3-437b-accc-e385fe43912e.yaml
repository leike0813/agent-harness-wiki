    与 source-zoo-code-docs-site 均 unchanged。
  - 纳入 custom_providers：`src/api/transform/reasoning.ts` 的 `getGeminiReasoning`
    增加三条规则——`GEMINI_THINKING_LEVELS` 增加 `xhigh`（第 37
    行）；`model.supportsReasoningEffort` 缺失时直接返回 `undefined`，档案里残留的
    `reasoningEffort` 不再产生 thinking 配置（第 190-193 行）；选择值改用
    `isGeminiThinkingLevel` 过滤，最终取值（档案值，缺省时取模型默认值）不是五个已知等级之一（含 `disable`
    与未知字符串）就不发送（第 199-204 行），不在模型能力数组内的选择退回 `model.reasoningEffort`（第 206-219
    行）。这改变 providers.metadata 的答案（推理强度元数据如何生效），故新建 edition
    zoo-code-vscode-custom_providers-v7 并在 providers-models 增加一条带三个新引用的条目；新引用固定在
