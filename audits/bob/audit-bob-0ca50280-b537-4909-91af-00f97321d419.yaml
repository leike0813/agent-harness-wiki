investigation_notes:
  - bob 的 28 个官方文档来源全部被扫描报告为 changed，但字节身份不稳定：重复抓取同一 URL 会得到不同 sha256，差异只出现在页面内嵌的 BUILD_ID 字段（server-transports 页面两次抓取仅 16 个字符不同，位置为 BUILD_ID 1790927525239 与 1790807397867），正文文本完全一致。因此本轮按正文语义判断变化，而不是按字节 hash 判断。
  - 语义变化只出现在 5 个页面：configuration/mcp/mcp-bobshell、configuration/mcp/server-transports、configuration/mcp/mcp-oauth、configuration/configuring、features/skills。其余 23 页重新抓取后，已发布引用的每一条短摘录仍逐行出现在页面正文中，判定为无语义变化。
  - MCP 全局配置文件路径存在官方页面冲突：MCP 页写 ~/.bob/settings/mcp.json，OAuth 页写 ~/.bob/mcp_settings.json；OAuth 页示例仍在使用已被 MCP 页声明移除的 url 键。两处分歧都可用 changelog 2.0.0 的设置目录迁移解释（MCP 页随新布局，OAuth 页停留在 2.0.0 之前），因此不触发跨 Agent 独立复核；章节按 conflict 状态并列两方说法与适用边界。
  - 独立 HTTP+SSE 传输的移除由 MCP 页与传输页两处独立来源一致给出，不是来源冲突，属普通更新，未触发独立复核。
  - 已复查但未改写：custom_agents、custom_providers、hooks 三个主题的已发布引用在新页面上仍逐字成立（上下文窗口仍为 270,000 token、约 190,000 token 开始压缩，仅术语由 condensing 改为 compacting），故未新建 edition。
  - 本轮归档的 5 份原件写在 Git 忽略的 archive/bob/artifact-*-20261003/source.md；其中 configuring、mcp、skills 三份的 sha256 与本轮扫描观察值一致，mcp-transports 与 mcp-oauth 因站点重新部署（BUILD_ID 变化）与观察值不同，快照记录的是实际归档字节的 hash。
