investigation_notes:
  - 本轮 triage 分类：maintain；范围按父进程冻结为 hooks 的 hooks.input、hooks.diagnostics、hooks.events 三道固定问题。
  - docs/hooks 逐行比对：抓取原件 archive/bob/artifact-source-bob-docs-hooks-3862e039c21c/source.md（sha256
    3862e039c21ca4627d9900822c0b8a336800c0d87eea0b0e077e7bff3ffa337b）与基线 d33f6d592287 的差异集中在 Hook reference
    各事件的 Stdin schema 与 Example payload，以及 Examples 里“Block a matched tool”脚本的一处字段名。
  - 事件名单本身没有变化：Supported hooks 表格、Hook reference 目录、Exit codes and blocking 表、
    Command details、Current limitations、Configuration 与 Hook schema 段落与基线逐行相同。因此
    hooks.events 的答案（七个第一方事件及其触发时点/可否阻断/stdout 处理）保持 answered 不变。
  - hooks.output 未变但同处一个 section：stdout 注入规则、退出码 0/2/其它非零的语义、以及仅
    UserPromptSubmit、PreToolUse、PreCompact 可阻断的规则与基线逐行相同；已发布引用 ref-bob-hooks-exit、
    ref-bob-hooks-command、ref-bob-hooks-limits 的摘录在新原件中仍逐行命中，故继续沿用。
  - 需换新的摘录只有引用了旧载荷的两条：ref-bob-hooks-payloads（Hook reference 的 SessionStart 与
    UserPromptSubmit stdin/示例，含 event 与 ses_01abc123）与 ref-bob-hooks-fields（Configuration fields 表之后
    顺带抄了 Hook reference 开头的 event 字段）。二者的出处表格本身未变，因此新建引用
    ref-bob-hooks-schema 继续覆盖 Hook schema 与 Configuration fields，旧的两条引用保留不改。
  - hooks.diagnostics 的入口不变（/hooks 对话框、通用 stdin 落盘脚本、stderr 与 ~/.bob/logs/shell/ 日志），
    变化在于排查脚本读取的字段名：正文补写按 hook_event_name / tool_name / tool_input / tool_response /
    trigger / last_assistant_message 取值，并说明按旧字段名取值会拿到空值。
  - 排除的 24 页：acp、api-keys、approval、builtin-modes、changelog、configuring、context、custom-modes、home、
    ignoring、install、mcp、mcp-oauth、mcp-transports、mcp-understanding、rules、run、skills、slash、subagents、
    team、telemetry、tools、troubleshoot、trusted。逐页把新抓取的归档原件与本轮基线做去标签正文比对，
    正文逐行相同，差异只在站点构建指纹（/assets/*.js 文件名与 manifest version），按无知识影响结案，
    不改这些页面对应主题的章节与映射。
  - docs/chat 的唯一正文改动是把改行快捷键由 Ctrl+F/Alt+F 改为 Ctrl+Y，属交互说明，按父进程排除范围不进入固定问题。
  - "bob 的官方文档字节身份仍不可用作变更信号：站点重新部署即让全部 25 个来源报 changed。本轮沿用
    去标签正文比对判定语义变化，未改扫描器。"
  - "载荷字段清单属已发布的 payload/field list，按维护 Skill 第 5 节需要独立复核；本审计保持
    review_status: pending 并列出三道待复核问题，bob-cli-hooks-v2 在复核批准前不得进入 current 选择或发布。"
