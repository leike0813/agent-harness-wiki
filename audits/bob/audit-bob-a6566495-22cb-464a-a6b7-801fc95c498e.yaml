      换成 32 位十六进制串；官方阻断示例由读 input 改为读 tool_input。hooks-io 与 hooks-diagnostics
      的字段清单被推翻，新建章节版本 bob-cli-hooks-v2 与 8 条绑定新快照的引用。事件名单本身未变，
      hooks-events 仅补一条指明差异只在载荷。"
