  - "All six snapshots carry version_applicability unknown, so no conclusion is bound to an installed Bob Shell version. The only version-bounded statement is the documentation's own tasks.retentionDays = 0 caveat for 2.0.1 and later."
  - "transcripts.database remains pending: the fixed sources document no database, index or auxiliary state store for session records. Absent evidence was not reported as unsupported."
