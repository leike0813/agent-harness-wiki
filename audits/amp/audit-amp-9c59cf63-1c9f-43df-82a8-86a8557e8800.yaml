investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:52:48.930Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。全部 20 个派发问题已按冻结的文档页面核对完毕，
    未重扫、未重新抓取上游。
  - 章节结论：新建 6 个
    edition（amp-cli-mcp-v3、amp-cli-configuration-v4、amp-cli-custom_agents-v3、
    amp-cli-custom_providers-v4、amp-cli-hooks-v2、amp-cli-native_plugins-v3），旧
    edition 文件未改动； local_transcripts 的 transcripts.naming 维持 v1。
  - mcp：mcp.auth 变了——远程定义新增自定义 header 与 Secret 头（加密保存、改 URL 需重录 secret、
    Paste Headers）、CLI `--headers`/`--secret-headers` 及其替换语义、local OAuth 支持 CIMD 并回落
    dynamic client registration。Copy to Workspace 在服务端复制凭据、workload identity 要求配置者
    与每个线程所有者都被授权、设置界面无法测试连接三项在上一基线 7d3394f5 已存在，不属于本轮新增；
    mcp.transport 的 stdio/URL 两种形态未变，答态保持 partial。
  - configuration：config.runtime 撤下「Claude Code 在 runner 上运行」的安装/登录前提（本轮 runners
    页面删除了该节与对应故障排查条目）；config.diagnostics 撤下对应排查行，新增托管设置 JSON Schema
    校验、`amp.mcpPermissions.matches` 必须是对象、工作区编辑器拒绝非法策略三项；config.overrides
    的托管设置入口由 Workspace Settings → Advanced 改为 Workspace Settings → Managed Settings 页
    （旧引用中「workspace 文档正在向 Enterprise 工作区推出」一句在上一基线 a40c9538 已不存在，本轮一并删除）。
  - custom_agents：agents.roles 的 Tune Modes「Subagents」角色清单删去「code review
    checks」； agents.entry/agents.overrides/agents.diagnostics 复查后答案不变（AGENTS.md
    的 Includes/UI 入口与 absolute path 变更、dial-tune 摘录漂移都不影响这些答案的主张），故只更新 roles 小节。
  - custom_providers：providers.entry 更正 ChatGPT 多账户入口为 Add → ChatGPT
    Subscription (Legacy) （含 `add-chatgpt-subscription --legacy`），云平台加入
    Microsoft Foundry (Azure AI Foundry)， 新增 GitHub Copilot 连接（device
    authorization、Copilot CLI 开关、模型发现、逐人凭据、 *.ghe.com
    暂不支持）；providers.models/metadata 记录「Amp 不认识的模型」与 Model Metadata
    Overrides（Input/Output Tokens、Tools=Yes，仅 web 可写），Painter 入口改为 Mode Dial →
    Tune Modes → Painter（Auto · Amp / Nano Banana
    2，不支持透明背景）；providers.diagnostics 增加 Copilot Check Access 只验证发现、推理期缓存 5 分钟，以及
    Overrides/Painter 入口。
  - hooks：hooks.input 增加 `ctx.tools`（`call(name, input)` 直调内置/插件/MCP 工具、权限与确认照常、
    不写 transcript、5 分钟上限、连接丢失不重试、不支持子代理工具与持久等待）与无 UI 时 `ui.input/confirm/select`
    抛错的语义；hooks.events/output/order/conditions/diagnostics 复查后答案不变
