  - 本轮以冻结观察 triage：审计 checked_at 2026-11-23T18:00:49.697Z；只读 documents 下
    baseline/observed 原件逐字 diff，未重扫来源。两个官方文档有语义变化，npm 仅为开发构建身份变化。
  - source-amp-docs-customize-mcp（94e0d295… → b3322115…）：唯一正文变化在「MCP Servers in
    Orbs」的批准段落，新增 「A multiplayer thread offers only Allow Once」及其理由。同页 Workspace
    MCP Server Trust、Remote MCP Definitions、OAuth、Workload Identity
    等被现有引用引用的段落逐字未变。已按冻结 observed bytes 固定
    snapshot-amp-docs-customize-mcp-20261123（artifact-source-amp-docs-customize-mcp-b33221159c72，archive
    raw.md 已按 observed sha256 保留）与 ref-amp-mcp-orb-approval，并把 orb 批准选项、多人线程限制与
    Allowed Repository MCP Servers 的复核/移除写进 amp-cli-mcp-v4 的
    mcp-capabilities；mcp.exposure answer 追加该引用，其余 mcp 小节与答案未改。
  - mcp.entry / mcp.definition / mcp.transport / mcp.auth / mcp.lifecycle /
    mcp.diagnostics 逐题核对：这些答案引用的 Trust、Remote
    Definitions、IDs、Headers、OAuth、Workload 段落与冻结 baseline 逐字相同，变化只在 orb 批准对话框，
    不改变答案，未改章节。
  - config.trust / config.diagnostics：引用的 ref-amp-mcp-trust 所在「Workspace MCP
    Server Trust」段（含 `amp mcp doctor` / `amp mcp approve`）本轮逐字未变；新的多人线程限制只收窄 orb
    对话框的批准选项，不改变 workspace MCP 批准要求或诊断入口，故两题无答案变化，未改 configuration
    章节。config.defaults / config.overrides 未被本轮审计列入 pending；config.defaults
    的已发布答案基于 settings 清单键，模型选择器的 Top Models / New Threads Start On 不在其
    已引用入口内，未扩写。
  - source-amp-docs-the-dial（b1dab6d0… → e84fa1e1…）：4 处正文变化仅在「Pick a Model」「Top
    Models」「Threads That Agents Start」与 Space 的 Thread Model。内容为 Top Models
    现在排在列表最前且 Staff Pick 在其中（除非用户或工作区移除）、 Puck/Space 起的线程回退链（指定的模型 → New Threads
    Start On → 未设置时的 Claude/ChatGPT 订阅模型 → Puck/Space 正在 运行的模型）、以及 Space 设定
    Thread Model 后强制该 Space 起的每个线程使用它（留 Any Model 才允许逐请求选择）。当前 选中章节对 the-dial
    的引用只落在
    first-message、off-dial、custom-modes、build、tune、tune-subagents、preset-follow、
    preset-role-override、auto、system-models、chatgpt-* 等未变段落；变化段落讲的是 web
    端模型选择器排序、Puck/Space 线程默认模型和 Space Thread Model，选中章节的 cli surface
    未对其作任何已发布声明，因此发布措辞实质未变，不新建章节、 快照或引用。
