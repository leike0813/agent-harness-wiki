investigation_notes:
  - 本轮 triage 分类：maintain；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：maintain；范围限 custom_agents 与 custom_providers 的固定问题。
  - docs/customize/plugins、docs/the-dial、docs/models-and-subagents
    三页新增并改写模型固定语义：createAgent 的 `model` 只固定主代理，Oracle 与其他子代理仍走 Amp
    自动路由；要整体固定须同时设置 `oracle` 与 `subagents`（各自含 model 与
    effort，二者独立覆盖，模型不可用时回落自动路由）；Tune Modes 不改变插件代理的路由；系统模型（图像生成、线程命名）另行路由。
  - docs/index 与 docs/manual 新增 Decision Models 页面入口；docs/cli/runners 的 Terminal
    能力补 Mac app 的 Allow Terminal Access 条件；plugins 页新增 amp.ai.decide 决策模型对照链接。
  - docs/cli 原件上一版未被 archive 保留，无法逐行比对，按 the-dial 与 models-and-subagents
    的对应改写限定调查入口。
  - 本轮 worker 范围限定在 custom_agents 与
    custom_providers（agents.format、agents.overrides、
    agents.roles、providers.forwarding）；这四个问题在本轮已产出候选章节版本，pending_question_ids
    为空。其余主题（config、hooks、mcp、plugins、skills、transcripts）由本轮其它任务处理，不在本 审计的 impact
    中登记。
  - "customize/plugins: fbebb8b34b73 → 31d12c64894d（原件
    archive/amp/artifact-source-amp-docs-customize-plugins-31d12c64894d/source.\
    md）。 *Define a Custom Agent Mode* 新增两段：(1) 主代理 pin 不传播——`model`
    只固定主代理，Oracle 与 其他子代理（Task worker、代码库检索、Read Thread、Librarian）保持 Amp
    自动路由，所继承内置模式的 Tune Modes 固定也不改变该路由，要固定须在 `createAgent` 设 `oracle` 与
    `subagents`，两字段独立覆盖， 被固定模型不可用时回退自动路由；(2) 这些 pin 只覆盖代理角色，supporting system
    models（图像生成、 线程命名）保持各自路由。同节已存在的\"继承内置模式的 agent 是独立模式，省略 `model` 取插件加载时 Amp
    对该模式的默认模型，Tune Modes 与工作区固定不改变它\"一段是 v2 未覆盖的既有歧义（原文该节 前一段仍写\"inherits the
    mode's model and reasoning effort when you omit `model`\"）：v2
    漏覆盖，而非本轮推翻已发布说法；该歧义在新版仍未消除，章节按现状披露。 同页另有 amp.ai.decide 指向新 Decision Models
    页的链接，按范围排除。 - 'the-dial: b910105c6adf →
    6003621faf0a（archive/amp/artifact-source-amp-docs-the-dial-6003621faf0a/sou\
    rce.md）。 实质变化只有 *Use Modes That Are Not on Your Dial* 中 web 模式选择器的 Raw
    Models 段：新增 \"单模型模式只固定主代理，Oracle 与其他子代理保持自动路由；整体统一要在 Tune Modes 或插件 agent
    定义里固定三个角色\"。*Tune the Modes*、*Use a ChatGPT Subscription* 与 preset 各段逐字未变，
