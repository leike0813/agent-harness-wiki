investigation_notes:
- 本轮 triage 分类：maintain
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计，且维护工作尚未完成。
- source-amp-docs-cli-runners 逐字比对：变量更新语义由「运行中的线程每 30 秒重取一次」改为「只有该目录新启动的线程才拿到新值，已在运行的线程保持旧值直到新线程启动」，且不再需要重启
  runner。
- source-amp-docs-cli-runners 的该断言只出现在 configuration 主题的 amp-cli-configuration-v1/v2 第 config-runtime
  节（「并每 30 秒重新取」）；本轮任务主题范围是 custom_providers 与 custom_agents，两个主题的已发布章节均无
  30 秒轮询或 runner 变量注入断言。因此本次变化在范围内无可修订章节，config.runtime 保持 pending，留给父进程
  调整同一产品任务范围后再处理；不在本 worker 内擅自改动 configuration 选章。
- source-amp-docs-the-dial 逐字比对：Tune Modes 中跟随预设的角色由「各自持有一份模型副本」改为「跟随预设」，可单独 pin 模型或 effort，另有 Auto 按钮停止跟随。
- 已发布的 ref-amp-dial-chatgpt-preset / ref-amp-dial-chatgpt-pins 指向 snapshot-amp-docs-the-dial-20261003
  （archive/amp/artifact-amp-docs-the-dial-20261003/source.md，2026-10-03 抓取）；其中 ref-amp-dial-chatgpt-pins
  的 2026-09-28「Amp 已经替你保存了这些 pin」一句在新观测原件（archive/amp/artifact-source-amp-docs-the-dial-f25a28ed3310/source.md）
