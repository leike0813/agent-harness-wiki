- 新增 snapshot-amp-docs-the-dial-20261006 与 artifact-source-amp-docs-the-dial-f25a28ed3310，指向原项目
  archive/amp/artifact-source-amp-docs-the-dial-f25a28ed3310/source.md（sha256 f25a28ed…，与本审计 observed 一致）。
- providers.models / providers.metadata / providers.responses / agents.limits 本轮均以新观测原件复核：Tune Modes
