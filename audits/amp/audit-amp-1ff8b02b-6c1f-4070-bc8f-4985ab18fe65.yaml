investigation_notes:
  - >-
    本轮按冻结观察 triage：审计 checked_at 2026-11-25T00:28:01.101Z；只读
    documents 与 archive 原件逐字 diff，未重扫来源、未下载 npm 包字节。三个官方文档
    changed（runners、customize/model-routing、the-dial），npm 版本前移。
  - >-
    source-amp-docs-cli-runners（864e50fc… → 8d8f19f5…）：相对冻结 baseline 只有
    2 处正文变化。(a) Portals 段新增「Portals are not supported on Windows runners
    yet: `amp orb service` 和 `amp orb portal` 会带说明退出」。(b) runner 能力表的
    Portal 行由「start the runner with `--remote-control-portals`」改为「Available
    on macOS and Linux when you start the runner with `--remote-control-portals`」。
    另有 lastModified 2026-11-20 → 2026-11-24。两处都是 Portals 的平台支持说明，
    不改变配置来源、优先级、环境变量或 provider 路由；选中章节引用的 How It Works、
    Secrets & Env Vars、What to Expect、Troubleshoot a Runner 逐字未变（Troubleshoot
    仍只有位置选择器、Changes、Files、Terminal 四条），因此无答案变化，未新建章节、
    快照或引用。
  - >-
    source-amp-docs-customize-model-routing（9c6c1b88… → f43509fa…）：唯一正文变化
    是在 Precedence 之后新增整节「Block Amp-Billed Inference」，另有 lastModified。
    Precedence 的顺序列表、priority 段与路由图句逐字未变，既有 order/priority 引用
    不需改。新节语义：工作区管理员可在 Workspace Model Routing 打开该设置，停掉
    第 3 步（Amp 额度）；成员只能用 connection（personal 或 workspace），没有连接
    服务的请求失败并提示工作区要求连接及添加位置，而不是用 Amp credits；默认关闭。
    覆盖工作区线程内 agent 的模型请求：未连接凭据的成员、到达用量上限的订阅（仍可
    在同套餐另一条订阅间切换）、子代理/线程标题/压缩及其它线程内请求、box 与服务
    账号线程、Auto Painter、插件决策与 orb 内代码经 Amp 的请求。不覆盖 Dictation、
    Puck 语音、连接都不服务其模型时的媒体分析、Sign in with Amp 应用、orb/box/Mac
    satellite 运行时长、web 搜索与读取网页；Enterprise 计价下连接服务的 token 仍
    收 Amp fee。
  - >-
    证据固定：snapshot-amp-docs-customize-model-routing-20261125（artifact
    artifact-source-amp-docs-customize-model-routing-f43509facf77，archive 原件已
    按 observed sha256 f43509fa… 保留）与 reference ref-amp-routing-block-amp-billed
    （locator 小节 Block Amp-Billed Inference，摘录覆盖设置、失败消息、默认关闭与
    覆盖范围开头）。
  - >-
    维护结果：amp-cli-configuration-v5 在 config-trust 增加「阻断 Amp 计费推理」
    政策条目，config.trust answer 追加新引用；amp-cli-custom_providers-v5 在
    providers-entry 指向该策略，在 providers-routing 写覆盖范围与失败行为，在
    providers-diagnostics 增加失败消息入口，providers.entry / providers.forwarding /
    providers.responses / providers.diagnostics 的 answer 追加该引用。
    registry/chapter-current.yaml 选择 configuration 与 custom_providers 的 v5，
    旧 edition 与旧引用字节未动。
  - >-
    source-amp-docs-the-dial（e84fa1e1… → ee987b8c…）：2 处正文变化。(a) Who Pays
    首句由「The icon on each row of the selector shows what a model bills to. It is
    one of your subscriptions, one of your API keys, or Amp credits.」改为
    「The selector shows what a model bills to: one of your subscriptions, one of
    your API keys, or Amp credits.」，只删掉 icon 行措辞，计费归属（订阅/API key/
    Amp 额度）不变；紧随的 personal → workspace → Amp 顺序句逐字未变。(b) Claude
    Code 段删除了句末链接「For an overview, read [Use Your Claude Subscription in
    Amp](/news/use-your-claude-plan)」，其余「on Amp's servers, so nothing needs to
    be installed…」逐字未变。现有 dial 引用的 locator 只覆盖 first-message、
    off-dial、custom-modes、build、tune、tune-subagents、preset-follow、
    preset-role-override、auto、system-models 与 ChatGPT 订阅段，没有 Who Pays 或该
    Claude 段引用；删除的链接只指向 /news 概览，不是任何已发布结论的依据。故两处均
    无答案变化，未新建快照/引用/章节。
  - >-
    source-amp-npm 0.0.1795449633-g4295dd → 0.0.1795564863-gd17172 是同一 0.0.x
    开发构建的身份前移；未下载包字节、未建立版本映射、未改章节，新版本仍未验证。
    candidate_path 只用于文档原件，npm 检查无候选路径。
  - >-
    逐题结论：config.trust 已更新（工作区策略），config.runtime 无变化（runners
    引用段逐字未变，Portals 平台限制不涉及配置机制）。providers.entry、
    providers.forwarding、providers.responses、providers.diagnostics 已更新；
    providers.auth、providers.protocol、providers.models、providers.metadata 无变化
    （model-routing 变化只在新策略节，mapping/override/协议/凭据段逐字未变）。
    agents.roles、agents.invocation、agents.overrides、transcripts.lifecycle 无变化
    （the-dial 变化段不被这些答案引用）。
  - >-
    高影响判据逐条排除：新增的是默认关闭的可选工作区策略，未推翻已发布配置步骤
