investigation_notes:
  - 本轮 9 个 official_documentation 来源的内容 hash 变化。重新取回的字节与 pnpm sources:check 的 observed 值逐个 sha256 一致（the-dial
    3d4a142d、model-routing 317714a4、plugins 1c13b4fd、plugin-api 77dff2d4、cli 0b1e4f00、cli/settings b8d73711、cli/keybindings
    c1cc9a22、cli/streaming-json b6eb562b、cli/runners 3c36d549），原件已按 archived_document 归档。
  - source-amp-manual 的 observed hash 不能当作内容身份：登记 URL https://ampcode.com/manual 重定向到 HTML 页面，响应里含每次请求生成的
    CSP nonce 与 env 键序，同一分钟三次抓取得到三个不同 hash。当前响应的 Introduction 段落与既有引用 ref-amp-manual-intro 逐字一致，本轮判定为无内容变化；该来源会在后续每轮继续报
    changed，需要维护者决定是否把 URL 换成同一页面的 markdown 渲染（https://ampcode.com/docs/markdown）。
  - 逐条复核方法：把当前响应中既有引用的摘录做去 HTML/svelte 标签、空白归一后逐字比对，68 条引用里 65 条仍逐字命中；ref-amp-manual-intro 的差异只来自 HTML
    与 markdown 渲染的列表符号与撇号；ref-amp-dial-chatgpt 与 ref-amp-routing-connections 两条所在小节正文确实改动，已按新快照改写。
  - 页面级结论：the-dial 与 customize/model-routing 的 frontmatter lastModified 为 2026-10-02，正文确有改动；cli/runners
    的 lastModified 为 2026-10-01 与 2026-09-25，plugins 为 2026-10-02，但这些页面被引用的小节正文未变，字节变化来自 frontmatter lastModified、<script>
    与 DocsSurfaceToggle 等渲染样板，不产生读者可见结论。
  - plugins 页新增 4 个示例插件（BTW、Turn Stats、/goal、Kitchen Sink）与「Amp 自带写插件的内置 skill」一句，属于示例与既有机制的补充，不改变任何固定问题的答案，因此
    skills、mcp、custom_agents、hooks、native_plugins 五个主题本轮不新建章节版本。
  - npm 来源 @ampcode/cli 由 0.0.1790784043-gd80e47 变为 0.0.1791014446-g764146。npm 版本变化本身不构成章节变化或版本映射；本轮 delivery=pr
    未运行 pnpm managed:packages，受管二进制核对留给 harness-binary。
  - 本轮交付：custom_providers 改写为 amp-cli-custom_providers-v2（providers-entry 四种 connection 与 ChatGPT 账户限制、providers-auth
    订阅登录方式与 CLI 命令、providers-models 新增 Painter 与 system model 边界、providers-diagnostics 指向 Check Access
    段落）；configuration 改写为 amp-cli-configuration-v2，正文事实未变，只把 config-trust 的 Enterprise connection 引用换成
    2026-10-03 快照中逐字命中的段落。
