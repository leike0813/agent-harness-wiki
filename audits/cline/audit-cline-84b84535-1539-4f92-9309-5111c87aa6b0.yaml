    ref-cline-skill-file-symlink-scope。"
  - "排除 sdk/packages/core/src/cron/runner/cron-runner.ts 与
    sdk/packages/core/src/cron/store/sqlite-cron-store.ts：改动是取消被新排期取代的 queued 运行、
