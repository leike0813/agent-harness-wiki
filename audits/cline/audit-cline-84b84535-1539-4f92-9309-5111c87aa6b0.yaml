investigation_notes:
  - "本轮分类：maintain。source-cline-repo c3a40572765b76873c597247941118c1778d02c8 →
    a48408909bf9b2ff7f620d420be8547fb509e8ed，16 个变更路径；其余 7 个登记来源（npm 与 6 个官方
    文档）观察值与基线相同。"
  - "已验证并改章节：sdk/packages/core/src/extensions/config/user-instruction-config-loader.ts
    （discoverRulesLikeFiles 的候选判定改为接受指向普通文件的符号链接，落点 540-560 行）与
    sdk/packages/core/src/extensions/config/unified-config-file-watcher.ts
    （readDirectoryFileCandidates 同步，477-496 行）。运行时核对在 pinned workspace
    ws-a48408909bf9-5752eebb-9d5e-4d65-b810-f3aa080f2205 用 bun 直接加载该提交源码执行：baseline
    提交同一脚本只得到 1 条 rule 记录，observed 得到 2 条（linked.md 与 regular.md）；断链、
    指向目录、自环链接均未进入快照。监听行为用 start() 后订阅事件核对：只写链接目标时 0 个事件、
    快照仍是旧内容；写链接所在目录的文件时产生 upsert 事件并读到新内容。"
  - "改章节二：cline-cli-configuration-v2.md（新增 cline-cli-configuration-v2，config-sources
    增写 rules/workflows 符号链接规则与 skill 通道的对照，config-migration 增写符号链接的重载
    边界）与 cline-cli-skills-v3.md（skills-discovery 增写「符号链接只跟到目录，不跟到文件」）。
    两版都保留旧版文件与原 {#section-id} 锚点。chapter-current.yaml 的 configuration 与 skills
    选择随之指向新版本，其余六个主题不变。"
  - "新增固定来源记录（全部按 a48408909bf9b2ff7f620d420be8547fb509e8ed 的工作区字节计算
    sha256）：git_source_file 依次为 user-instruction-config-loader.ts
    (b47be676…)、unified-config-file-watcher.ts (ae199b26…)、sdk/DOC.md (bd8c06c5…)、
