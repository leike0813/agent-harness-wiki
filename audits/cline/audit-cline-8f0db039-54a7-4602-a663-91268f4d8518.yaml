investigation_notes:
- 本轮 triage 分类：maintain
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计，且维护工作尚未完成。
- 'source-cline-repo 由 cd80a20 变为 95e54e4（fix(cli): treat a provider API key from the environment as configured），195
  个文件。'
- 命中已登记引用并发生实质语义变化：sdk/packages/core/src/extensions/mcp/client.ts 的 DEFAULT_MCP_CONNECT_TIMEOUT_MS 由 3_000ms
  提升到 10_000ms（Windows 上经 cmd.exe 启动的 npx/uvx 在热缓存下需 3-6 秒才到 initialize，3 秒预算会静默丢弃会话），并新增 stdin 写失败标记与失败定时器；sdk/packages/shared/src/provider-auth.ts
  新增 ProviderAuthInfo.apiKeyOptional 与 resolveProviderApiKeyOptional；core/src/services/providers/local-provider-registry.ts、local-provider-service.ts、storage/provider-settings-legacy-migration.ts、llms/src/providers/builtins.ts、apps/cli/src/runtime/defaults.ts
  同步变化。
- npm 来源观察到 3.0.70（基线 3.0.68），仅说明发布身份变化。
- 定位核对：候选内全部 file_lines 引用逐条在 cd80a20 与 95e54e4a 两个提交上重跑摘录比对。本轮文件移动只让
  4 条引用的摘录在观察提交上失配：ref-cline-mcp-connect-budgets（3_000 常量已被替换，语义失效，由
  ref-cline-mcp-connect-budget-10s 取代，并从 mcp-transport 小节的 source_refs 中移除；文件本身保留，
  以免 cline-cli-mcp-v1 失去引用）、ref-cline-mcp-install（buildHeaders 已改名 parseMcpHeaders，
  但该引用支撑的「cline mcp install 归一 --transport」结论不变，locator 仍落在同一函数的相邻行）、
  ref-cline-cli-ref-files-v2（docs/cli/cli-reference.mdx 目录树重排，属 configuration/custom_agents
  范围）、ref-cline-cli-root-options（program.ts 选项列表重排，同上）。mcp 与 custom_providers 两个
  已选章节中，只有 mcp 的那一条因此改写正文。
- 另有 2 条引用（ref-cline-provider-add、ref-cline-provider-refresh）在 cd80a20 基线上就已与
  local-provider-service.ts 失配，属更早轮次的定位漂移，不是本轮文件移动造成，本轮不处理。
- custom_providers 核对后不改写：{#providers-auth} 已发布的「apiKeyEnv 白名单回退」与「没有凭据预检、
  后端 401 才是权威信号」两条结论在 95e54e4a 仍成立。apiKeyOptional 与 resolveProviderApiKeyOptional
  是新增的只读标志（Ollama、LM Studio、LiteLLM、openai-compatible 本地端点、Vertex ADC、
  Bedrock 声明 apiKeyOptional；自定义 OpenAI 兼容端点经 local-provider-registry 统一带上该标志），
  只改变宿主判断「已配置」的方式，不改变凭据落点与请求路径，因此不新建版本。
- apps/cli/src/tui/utils/provider-configured.ts 让「环境变量里的 API key 视为已配置」进入 CLI TUI
  的就绪判断（仅限恰好声明一个环境变量的 provider，provider-configured.ts 注释说明多环境变量的
  provider 混有 region/project 等配置，仍需 -k 或已保存设置），同样属于新增的界面判断，不推翻已发布答案。
- 排除：其余 180 余个文件（测试、UI 组件、SDK 快照）不在本轮范围。
