- skills 与 hooks 章节引用该仓库，需要按固定问题复核。
- >-
  skills 复核结论：sdk/packages/shared/src/storage/paths.ts 新增常量 CLAUDE_CONFIG_DIR = ".claude" 并插入
  getWorkspaceSkillDirectories 的目录列表（位置在 .cline 与 .agents 之间）；user-instruction-config-loader.test.ts
  同步断言 {workspace}/.claude/skills。skills.roots 原先记录的「代码不读 .claude/skills」与文档冲突不再成立，
  状态由 conflict 改为 answered；skills.collision 的工作区内覆盖顺序新增一档。已写 cline-cli-skills-v2。
- >-
  skills 复核结论（无影响）："fix(desktop): explain missing Git during skill install" 只改
  apps/examples/desktop-app/sidecar/marketplace.ts 的 installSkill 错误文本，surface 是 desktop；cline 自有的
  apps/cli/src/commands/skill.ts 与 apps/cline-hub/src/server/marketplace.ts 同段逻辑未变，skills 章节只发布
  cli 界面的答案，故不改答案。
- >-
  hooks 复核结论：apps/cli/src/commands/hook.ts 的 switch 补入 case "agent_error"，cline hook 的接受集与
  HookEventNameSchema 对齐；hook.test.ts 固定 agent_error 退出 0 并写出 {}、未知事件名仍在审计与会话扇出前被拒。
  hooks.events 与 hooks.diagnostics 答案变化，已写 cline-cli-hooks-v3。
- >-
  跨主题提示（未自行扩写）：resolveSkillsConfigSearchPaths 是共享加载入口，cline-cli-configuration-v1 的
  config-sources / config-defaults 引用旧的三目录证据；configuration 是本轮排除主题，交协调者决定是否另开范围。
- >-
  排除（review 后不调查）："fix(desktop): sync session titles changed on the web"、"feat(desktop): add transcript
