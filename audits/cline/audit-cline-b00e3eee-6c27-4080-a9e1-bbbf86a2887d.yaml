    src/index.ts
    改动插件命令与扩展注册、sdk/packages/core/src/extensions/plugin/plugin-sandbox.ts
    改动插件沙箱、sdk/packages/core/src/extensions/mcp/client.ts 与 manager.ts 与
    tools.ts 改动 MCP 客户端与管理、apps/cli/src/commands/skill.ts 改动 Skill
    命令、sdk/packages/core/src/runtime/host/local-runtime-host.ts 改动本地运行时宿主。
  - 本轮派发入口：topic local_transcripts、mcp、skills；固定问题
    mcp.capabilities、mcp.diagnostics、mcp.lifecycle、skills.loading、transcripts.lifecycle。
  - mcp 结论：提交 c441897f 新增 apps.ts（扩展 id io.modelcontextprotocol/ui、MIME
    text/html;profile=mcp-app 与 ui 资源方案），client 的 initialize 仅在工厂选项 mcpApps
    为真时声明该扩展；CLI 运行时构建两个客户端工厂都没有传这个选项，因此 CLI 会话不声明 MCP Apps。客户端与管理器新增
    readResource（stdio 走 resources/read 并用 ReadResourceResultSchema 校验），但 CLI
    运行时只从管理器取 tools 与 shutdown，没有把 resources 交给模型；prompts 仍无调用点。工具描述符保留
    _meta，createMcpTools 按 _meta.ui.visibility 过滤（缺省 model 与 app 都可见），该过滤不受
    mcpApps 开关影响。 据此 mcp.capabilities 与 mcp.diagnostics 的答案改写，新建
    cline-cli-mcp-v4， 旧版 cline-cli-mcp-v3 保留；registry/chapter-current.yaml 起初切到
    v4，按独立复核 issue 2 已回退到 v3（见末尾复核记录）。
  - mcp.lifecycle 结论未变：连接预算（stdio 与远程各 10 秒）、禁用不连接、工具缓存 5000 毫秒、stdin 写失败的 250
    毫秒宽限与错误文本都保持原样，mcp-transport 小节正文不改。
  - local_transcripts 结论未变：local-runtime-host.ts 增加插件命令 API、prepareApiMessages 与
    pluginCommandsClosing，chat-commands.ts 增加未知命令 fallback，二者只造成行号偏移；
    SessionManifestStore 的创建/重写落盘、按 messagesPath 与 manifest 回退恢复、/fork 与
    metadata.fork、压缩边车文件与 compaction_path 回填均未改动，故 transcripts.lifecycle 维持
    cline-local_transcripts-v1。
  - skills 结论未变：docs.cline.bot/customization/skills.md 的新旧原件对比只有 MDX 到 Markdown
    的排版差异（Note 引用块、Steps 改为加粗编号），分层加载与 skills 工具的语义 表述一致；definitions.ts 只新增
    PowerShell 引号说明，skills 工具描述（启用列表拼接） 与 user-instruction-plugin 的
    formatSkillInvocation 未改；skills.loading 维持 cline-cli-skills-v3。cline skill
    命令改为复用 @cline/core 的 SKILLS_CLI_PACKAGE （package.json 固定 skills
    1.7.2）属安装入口，不在 skills.loading 范围内，本轮不改写。
