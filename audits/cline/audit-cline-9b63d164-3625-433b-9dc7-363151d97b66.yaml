investigation_notes:
  - "Fixed 仓库来源到提交 39ff2359f7e08231281539696e48a166ce49270c（上一轮 3435f72fcf4cb843bee946b8f9e981683564c9e3），快照 snapshot-cline-repo-20261003，锚点原件 apps/cli/CHANGELOG.md。六个官方文档来源全部变化，已按新 hash 建立 -20261003 快照与归档原件。"
  - "custom_providers：改动最重。agent model 路径补上目录 provider 桥接（此前只有 ApiHandler 路径做，自定义 provider 跑任务会以 Unknown or disabled provider 失败）；modelsSourceUrl 取目录可带凭据但只发同源并禁止带凭据重定向；models.json 新增 discoveredModelIds 区分发现与手工模型，模型条目不再复制 provider 能力；provider 目录写入按 models 文件串行化并支持回滚；凭据保存时的目录刷新改为尽力而为；X-Task-ID/session_id 无会话时整个不发。已写 cline-cli-custom_providers-v2。"
  - "mcp：MCP 工具统一带 resultPolicy cache-oversized，超限结果进会话内存缓存并以 cline://cache URI 交给 read_files 分页读回，阈值 maxToolResultChars 默认 8000。已写 cline-cli-mcp-v2。"
  - "custom_agents：团队持久化由整份重写改为 persistBatch 增量批处理，TeamStore 新增该方法，团队库文件在 {数据目录}/db/teams.db 而非旧版记录的 teams 目录。已写 cline-cli-custom_agents-v4 并修正存储路径描述。"
  - "configuration / skills / hooks / native_plugins：本轮 changed_paths 未包含这些主题的机制文件（paths.ts、global-settings.ts、main.ts、commands/config.ts、各 hooks 与 plugins 模块、skill 加载器），六个文档来源的既有引用短摘录逐条核对后仍与新原件一致，判定无读者可见变化，保留原章节版本。"
  - "source-cline-npm 本轮 fetch failed，无法确认 registry 身份。上轮扫描观察到 3.0.68，与本轮固定提交里 apps/cli/CHANGELOG.md 记录的 3.0.68 一致，但 npm 身份未复核，因此不建立任何软件版本映射，review_status 保持 pending。"
  - "文档差异：docs/cli/cli-reference.md 新增 schedule、kanban、hub、connect 命令与全局选项，均不属七类主题范围，未写入章节。"
  - "记录冲突：变更日志称团队库在 ~/.cline/data/db/teams.db，代码 defaultTeamDir() 走 resolveDbDataDir()，与此一致；而上一版章节把团队状态记在 {数据目录}/teams/{team-name}/，那是文件回退存储的路径。本版并列两套存储与各自可用的环境变量。"
  - "独立复核（本会话之外的第二个 Agent，由父进程委派、只读）：对 custom_providers-v2、mcp-v2、custom_agents-v4 给出 VERDICT: PARTIAL。三类高影响条件里「来源之间无法用版本、分发或生效条件解释的冲突」与「新来源推翻已发布的配置步骤」两条成立，「跨主题关键加载机制变化」不成立。PARTIAL 不等于结论错误，但按维护规则在第二个 Agent 签署前不得把受影响问题当作已复核。"
  - "按复核意见修正（同一固定提交 39ff2359，章节仍为 v2 / v2 / v4）：为团队状态路径的三项事实（FileTeamStore 的 teamDirPath、resolveTeamDataDir() 与 CLINE_TEAM_DATA_DIR、每团队 state.json）补 git_source_file 定位 ref-cline-agents-team-file-store-dir / -file-dir / -file-state，并补 ref-cline-agents-team-sqlite-dir 覆盖 defaultTeamDir()；把 docs/cli/agent-teams.mdx 在同一提交仍只写 ~/.cline/data/teams/[team-name]/ 且不提 SQLite 这一说法与代码并列（ref-cline-agents-teams-doc-state-v2，文档侧任务板／信箱／任务日志清单已补回正文）；扩宽若干窄于断言的定位区间（缓存 URI、会话 id 头、AggregateError 文案、Discovery is optional 引语、缓存键的来源 URL）；缓存私有键补上凭据指纹一段（只描述指纹来源与算法形态，不含任何凭据值）。"
  - "pending_question_ids 保留三项：providers.protocol（本轮修正的是已发布 custom_providers-v1 的机制描述）、agents.roles 与 agents.limits（团队状态存储路径相关）。在第二个 Agent 签署前，这三项及所在章节（custom_providers-v2、custom_agents-v4）应留在已发布版本；mcp-v2 不含这三项的争议内容，可照常发布。review_status 保持 pending，reviewed_by / reviewed_at 留空。"
  - "仍未复核签署：本轮三份章节的复核由父进程委派的独立 Agent 完成并给出 PARTIAL，修正后的内容需由第二个 Agent 签署；source-cline-npm 仍 fetch failed，版本映射依旧为空。"
