investigation_notes:
  - 本轮 triage：narrow_investigation；入口限 native_plugins 与 configuration
    的固定问题（plugins.discovery、plugins.install、config.sources、config.overrides、config.migration）。
  - "仓库单提交 ed469c753（chore(vscode): release v4.1.24，125 文件）。协调者列出的 13
    个已引证据文件全部发生变化：apps/cli/src/commands/config.ts +37/-3（tools 视图新增失败插件小节与
    plugin_failure JSON 条目）；apps/cli/src/runtime/run-agent.ts +5（会话启动后打印插件 issue
    warning）；plugin-config-loader.ts +174/-24（新增
    resolveAgentPluginPathsWithDiagnostics、PluginExecutionMode/resolvePluginExe\
    cutionMode、CLINE_PLUGIN_MODE_ENV，mode 联合类型扩为三值）；plugin-loader.ts
    +4/-1（freshModule 选项与 setup 的 this 绑定）；plugin-sandbox.ts +201/-47（新增
    PluginSandboxTransport、WorkerSandbox、setupTimeoutMs、policy、CLINE_PLUGIN_BOO\
    TSTRAP_PATH_ENV、isPluginSandboxBootstrapAvailable、bootstrap
    惰性解析）；core/src/index.ts +18/-1（导出新增类型与 WorkerSandbox）；local-runtime-host.ts
    +62/-5（pluginIssues 进 StartSessionResult、之后发生的插件失败转 status
    notice、会话定向事件在注册前暂存、build 失败时释放插件副本）；local-runtime-bootstrap.ts +40/-7（传
    policy/hookErrorMode/onIssue，汇总 pluginIssues，整体发现失败也作为 plugin issue
    上报）；plugin-commands.ts +2/-8（斜杠命令宿主缓存键由 statSync(mtime) 改为
    fingerprintPluginSources 内容指纹）；plugin-mcp-settings.ts +27/-96（改用
    collectPluginContributions 而非自建假 setup api 收集 MCP）；plugin-tools.ts
    +84/-141（改用 collectPluginContributions、摘要新增
    state/lastError、失败插件仍进列表、缓存键加入执行模式与注册表状态且失败运行不缓存）；settings-service.ts
    +7/-3（loadError 文本与 inspectionStatus 的 failed
    判定）；shared/extensions/contribution-registry.ts +18（PluginSetupContext 新增
    cwd/emitEvent/onDispose）。"
  - 随提交新增但不被已发布章节直接引用的支撑文件：sdk/packages/core/src/extensions/plugin/plugin-registry.ts（1881
    行）、plugin-contributions.ts（243 行）以及两个 registry 测试文件。本轮按固定范围只读取 registry
    的常量、loadForSession 分支与 formatSessionPluginIssue 三处，未展开其完整实现。
  - 排除：vscode 扩展发布管道（apps/vscode/**）、desktop-app 示例 webview
    视图（apps/examples/desktop-app/webview/**）、shared/src/llms/tokens.ts 与
    rpc/runtime.ts 的发布配套改动；均在固定问题范围之外。
  - 逐行比对可行的更正：协调者记录「docs/plugins 与 docs/install-plugins 的上一版原件未被 archive
    保留，无法逐行比对」，但本次核查发现两版原件都在 archive/cline/ 下且 sha256
    与冻结基线一致（artifact-source-cline-docs-plugins-20261003 =
    634dfe11…、artifact-source-cline-docs-install-plugins-20261003 =
    19e4c827…；新一版为 -050ba118a6d5 与 -8f84c96048a8）。因此逐行 diff 已执行：sdk/plugins 新增
    How Plugins Run、Choosing Plugins per Session、Setup and Call Context、Plugin
    Status and Errors 四节并重写 Hooks 一节（删除旧的 Hook Stages 与 Hook Policies
    两节）；customization/plugins 仅新增 Troubleshooting Plugins 一节。安装命令、清单格式与目录结构段落未变。
  - configuration 主题三道问题结案为不受影响：config.sources、config.overrides、config.migration
    所依赖的路径解析（sdk/packages/shared/src/storage/paths.ts）、全局设置读写与规范化（sdk/packages/core/src/services/global-settings.ts）、provider
    设置迁移与 docs/getting-started/config.mdx 在本提交均无改动，source-cline-docs-config 亦为
    unchanged。apps/cli/src/commands/config.ts 的改动只落在 cline config tools
    的输出渲染，不触及作用域、优先级或迁移。
  - 按会话 plugins 策略与 CLINE_PLUGIN_MODE / CLINE_PLUGIN_BOOTSTRAP_PATH 是插件执行配置，不进入
    Cline 全局设置分层；记入 native_plugins 章节，并在 configuration 侧只作为交叉链接，不新建
    configuration 章节版本。
  - plugins.install 结案为不受影响：本提交未触及 apps/cli/src/commands/plugin.ts、插件安装常量与
    _installed 安装目录命名；安装面结论沿用既有引用，仅在新章节正文中点明该提交未改安装面。
  - npm 3.0.70→3.0.71 仅记录为发布身份变化，不计为章节影响。
  - "plugins.lifecycle 与 plugins.diagnostics 的结论改变已发布机制（诊断面从 loadError
    单一信号扩展为状态机加 issue 通道），按契约保持 review_status: pending 并声明独立复核。"
