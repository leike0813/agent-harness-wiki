investigation_notes:
  - 本轮 triage 分类：maintain
  - sdk/packages/llms/src/providers/url.ts 新增
    isOfficialAnthropicEndpoint(baseUrl)：未设置视为官方端点，new URL(baseUrl).origin ===
    https://api.anthropic.com 视为官方，畸形 URL 按自定义处理。
  - 'provider-option-rules.ts 的 directAnthropicProviderRule.build 由无条件返回 {
    anthropic: { fallbacks: "default" } } 改为按端点判定；端点检查刻意放在 build 而非
    applies，因此自定义端点仍保留 suppresses.genericFanout。基线版本此前对 anthropic 直连一律注入
    fallbacks。'
  - runtime/safety/rules.ts 与 extensions/config/user-instruction-service.ts
    的改动只是把规则筛选与排序收敛到共享函数，选择语义（仅启用项、按 name localeCompare 排序）未变，不构成知识变化。
  - hooks、MCP、custom agent 入口目录均不在 changed_paths 内，相关章节定位未失效；VS Code 宿主与测试文件按
    CLI 界面条件边界排除。
  - custom_providers worker 范围：固定 source-cline-repo 提交 cd80a20e，只调查 providers.auth/entry/models/responses，
    正文改在新版本 cline-cli-custom_providers-v3，v1 与 v2 均未改写；registry/chapter-current.yaml 由 coordinator 统一处理。
  - providers.auth 已完成：baseUrl 除拼请求地址外还决定 provider 选项注入。provider.anthropic.direct 的 applies 只看
    providerId 为 anthropic，命中即 suppresses.genericFanout；build 仅在 baseUrl 未设置或 origin 为
    https://api.anthropic.com 时返回 anthropic.fallbacks=default，自定义端点（含畸形 URL）返回 undefined，
    请求体其余部分不变。新证据 ref-cline-provider-anthropic-endpoint 与 ref-cline-provider-anthropic-fallback-rule
    固定到 cd80a20e，摘录逐行核对一致。
  - providers.entry/models/responses 复核无影响：两个改动文件分别是 url 工具函数与单条 provider 选项规则，不触及
    providers.json 信封与 models.json/modelsSourceUrl 刷新链路，也不触及流式、错误分类与重试路径；本区间内
    gateway.ts 与 provider-config-fields.ts 逐字节未变。
  - providers.forwarding 保留 pending：同一条件化注入也是「可写参数如何映射到请求」的答案，但小节
    providers-forwarding 只描述 ProviderConfig 字段与 capabilities 不变成请求字段，未提 provider 选项规则；
    本轮任务范围限定为 auth/entry/models/responses，故只登记不改正文。
  - configuration/skills 已核对并排除：runtime/safety/rules.ts 新增 listEnabledRulesFromRecords 与
    loadRulesForSystemPromptFromRecords，isRuleEnabled 即 disabled 不为 true，formatRulesForSystemPrompt 不排序，
    因此 watcher 路径的过滤与排序完全一致。user-instruction-service.ts 的合并规则路径此前只按 disabled 不为 true
    过滤、现在经共享函数后也按 name localeCompare 排序，system prompt 里规则段的渲染顺序由记录顺序变为按名排序；
    两章都没有记录该渲染顺序，故不改写正文。被引用的 ref-cline-skills-ambiguous（user-instruction-service.ts
    88-122 行）与 ref-cline-plugin-alias（core/src/index.ts 30-40 行）在本区间逐字节未变，无定位漂移。
  - native_plugins 无影响：core/src/index.ts 本轮只在 runtime/safety 的规则渲染导出块多导出一个
    loadRulesForSystemPromptFromRecords，与插件 manifest/extension 可导入的符号无关，plugins.api 答案不变。
  - 未新增版本映射：源码 commit 只代表源码树；source-cline-npm 观察到 3.0.68 且与基线一致，本轮不把 cd80a20e
    映射为任何 npm 版本。
  - 仓库状态提示：main 上已存在未选中的 cline-cli-custom_providers-v2 与 cline-cli-custom_agents-v4（20261004
    轮次因独立复核未签署而退回已发布版本）。本轮 v3 以当前已发布版本 v1 为基线新建，不改写 v2，v2 的复核欠账
    不在本轮解决。
