investigation_notes:
  - 本轮 triage 分类：maintain（native_plugins、skills）。观察冻结于 2026-10-13T18:01:50Z， 18
    个官方文档来源 hash 变化、npm 1.79.2→1.81.0。
  - 逐页正文比对（抽取可见文本后按行 diff，排除每页首尾的构建期 head 与 flight payload）： 只有
    source-command-code-docs-mods（63 行实质变化）与 source-command-code-docs-provider（3
    行） 有正文差异；其余 16 页正文逐行一致，变化只来自站点导航与打包资源名。
  - docs/mods 的实质变化已全部落到新章节版本：新增 cmd.addShortcut 与 cmd.addSkillsPath 两个注册动词（均返回
    Disposable）、运行期方法表新增 sendUserMessage / getSessionName / getModel / getEffort
    / getContextUsage / getCommands / isIdle / shutdown / getToolInfo、 UI
    surface 新增 notify 的 level 参数与 cmd.ui.setTitle、headless 降级矩阵新增 setTitle /
    addShortcut / sendUserMessage / shutdown 四行、What a package ships 小节新增
    commandcode.skills 与 hub 元数据段，以及新增的 curated registry 小节（mods/registry.json、
    commandcode.ai/mods.json）。curated registry 属发布与分发路径，不属本轮固定问题
    （plugins.api/discovery/model、skills.roots），未写入章节正文，仅作观察记录。
  - cmd.addShortcut 的受理规则（必须含 Ctrl 或 Alt；无修饰或仅 Shift、Ctrl+Shift 且键以裸控制
    字节到达终端、ctrl+m/i/h/[ 因终端编码冲突、已被内置绑定或输入框占用者一律拒绝）、handler 上下文 {args, ui, cwd,
    exec} 与 {message}/{prompt} 返回、宿主在自身绑定之后派发、同一和弦 首个注册获胜、/hotkeys 归入
    Mods、headless 从不触发，全部按页面逐句核对后写入 plugins-api 小节与 ref-cc-mods-shortcut-chords
    / ref-cc-mods-shortcut-dispatch 两条逐字摘录。
  - mod 贡献的 Skill 位置映射到 skills.roots：manifest 的 commandcode.skills（相对包根解析、
    越界条目丢弃、进入包被加载的每个会话）与 cmd.addSkillsPath（相对 mod 自身文件解析、工厂时 收集、返回
    Disposable）。文档没有给出多个已注册路径之间的优先级顺序，也没有说明它们相对 settings skills 数组与 --skill
    在六段查找链中的插入位置——该点写为 skills.roots 的缺口， 状态保持 answered（机制本身有直接证据）。
  - 可用界面徽标核查：18 个变化页面（agents、byok、context、headless、hooks、import、mcp、
    memory、mods、permissions、provider、reference/cli、reference/slash-commands、
    resource-security、settings、skills、troubleshooting/common-issues、
    troubleshooting/telemetry）正文页首的导航条目一律由「VS Code Extension」 （href
    /docs/vscode-extension）改为「IDE Extensions」（href /docs/ide），对应站点路由表里
    /vscode-extension 消失、/ide 出现。这是文档站导航标签与路由改名，不是 Command Code 产品界面身份：catalog
    中本产品只登记 surface cli（名称 CLI），未登记任何扩展界面，published 名称不因此变。 reference/cli 的 PREV
    页导航标签由「Desktop App」变为「Studio」，headless 的 NEXT 相应变为 「Desktop
    App」，同样是页序导航而非新增界面。故本轮不提 catalog 改动。
  - 未提 catalog 改动的决定性理由：Skill 第 4 节的 catalog 规则只在新界面身份或新的界面↔运行时
    关系出现时触发；本轮两者都未出现，改的只是文档站自身的导航标签与路由，因此 catalog/harnesses.yaml 保持不动。
  - 未提 catalog 改动的另一理由：bindings 中 cli 仍为 unknown，且没有任何直接来源证据把任一界面
    绑定到具体运行时或包版本，按契约保持 unknown，不猜测新绑定。
  - 既存缺口（本轮不修）：站点路由表 /docs/ide 同时覆盖 Install、VS Code、Cursor 三个页面， 而 catalog 未登记任何
    ide 界面；这是本轮之前就存在的不一致，不是本轮改名引入的新界面。
  - 排除：docs/provider 的定价与额度改写（deepseek-v4.1-flash 由 boosted usage 改为定额、
    glm-5.3-flash 的 DEAL 条目移除、新增 minimax-m3 与 mimo-v2.5 DEAL、一次请求最多 100 个 问题及
    64K/32K token 预算说明）属商业条款，不属八个固定主题的任一问题，未写入章节。
  - 排除：npm command-code 1.79.2→1.81.0 仅发布身份变化；未固定 npm 快照、未建立任何软件版本
    映射（delivery=pr 亦不执行受管包与二进制流程）。
  - 新增记录：archive 原件 artifact-source-command-code-docs-mods-7a846e17383e 与快照
    snapshot-source-command-code-docs-mods-20261013（保留基线 f82ee3c9 的旧快照与旧原件不变）；
    引用 ref-cc-mods-registration-20261013、ref-cc-mods-shortcut-chords、
    ref-cc-mods-shortcut-dispatch、ref-cc-mods-skillspath、ref-cc-mods-package-skills、
    ref-cc-mods-live-20261013、ref-cc-mods-live-state-20261013、ref-cc-mods-ui-notify-title、
    ref-cc-mods-headless-surface； 新章节版本 command-code-cli-native_plugins-v2 与
    command-code-cli-skills-v2，v1 原样保留。
  - 高影响：新的一方插件 API 面（cmd.addShortcut、cmd.addSkillsPath 与扩展后的 ModApi）需要独立 复核，审计保持
    review_status 为 pending；native_plugins 与 skills 的新章节版本未写入
    registry/chapter-current.yaml，选章仍指向 v1，待复核后再议。
  - 遗留：本审计的 pending_question_ids 只保留本轮实际派发的两个主题（native_plugins 七题、 skills
    九题）——这些题的答案随新插件 API 面一起等待独立复核，因此保持 pending。本轮未派发的
    主题（configuration、custom_agents、custom_providers、hooks、mcp、local_transcripts）以及
    plugins.package/install/lifecycle/diagnostics 与 skills.discovery 等未受本轮证据影响但仍
    属上游未结的题，继续由 pending_audit_refs 中的 audit-command-code-de61b740 承载，不在本审计
    中重复结案，也未被本审计关闭。
