investigation_notes:
  - "本轮为 command-code 的 local_transcripts 首采，交付 command-code-local_transcripts-v1。全部证据来自本轮 scan 归档的 18 个官方文档来源原件（archive/command-code/artifact-source-command-code-docs-*-<hash>/source.md），command-code 未登记 git 仓库来源，本轮没有源码工作区、没有固定 npm 发行包版本，也没有写任何版本映射。"
  - "command-code 的 8 个文档快照均以 version_applicability: unknown 记录，章节首段已声明结论不能绑定到某个已安装版本。界面只调查 catalog 登记的 cli；未登记其它界面。"
  - "新建 8 个 archived_document artifact、8 个 documentation 快照（snapshot-cc-lt-docs-*）与 15 条 reference，均按一个原件一个 artifact 一个 snapshot 绑定：artifact_id 取归档目录名，archive_path 落在 archive/command-code/<artifact_id>/source.md 下，raw_sha256 由原件真实字节计算，excerpt 逐字取自原件。原件为服务端渲染 HTML，摘录含标签，已逐条核对确实支撑对应结论。"
  - "transcripts.cleanup 记为 unknown：已查 /reference/slash-commands 的 Sessions 组与 /reference/cli 全 flags 表、/docs/security 存储隐私表、/docs/context 压缩与恢复、/docs/headless 会话与恢复、/docs/settings 文件与键表，没有任何删除、保留期、配额或官方清理入口；唯一相关表述是 /clear 明确 previous stays on disk。缺少证据不等于可以安全删除，正文已按此写明并列出缺口。"
  - "其余九题按证据强度记为 answered 或 partial。主要缺口：会话文件的确切路径与子目录层级、会话 id 生成规则、项目路径编码、字符编码与分片压缩、transcript 逐字段 schema 与版本迁移、是否存在数据库或索引、subagent 是否单独落盘记录、完整性校验与恢复排错入口——固定来源均未描述，正文逐条照实列出。"
  - "pending_question_ids 只新增 transcripts.cleanup；其它主题遗留的 pending 题原样保留，review_status 维持 pending。"
