  - "18 个官方文档来源同时变化，成因是站点表示层改变而非文档内容改写：登记 URL 现在返回服务端渲染的 HTML（每个页面头部带同一构建期标记），2026-09-30 固定的原件是 Markdown 抽取结果。/docs/agents.md、/llms.txt、/docs/agents/index.md 均返回 404，没有可用的 Markdown 端点。连续两次抓取同一 URL 的 sha256 一致，因此不是每次响应都变的 nonce 噪声。"
  - "既有 132 条 reference 的短摘录逐行对新原件核对：116 条逐行原样命中；余下 16 条全部落在有序列表序号、表格分隔线、Copy 按钮、选项卡标签等 HTML 渲染差异上，人工核对后原意与位置均未变。所有 document_section 定位标题在新页面结构中都能解析（0 缺失）。结论：七个主题的正文与问题答案不变，无需新 edition、无需新 reference。"
  - "已按新 hash 为 18 个文档来源建立 -20261003 快照与归档原件（archive/command-code/artifact-source-*-20261003/source.md），保留 2026-09-30 的旧快照与旧 artifact 记录不变；这样下一轮扫描以新 hash 为基线，不会把同一处站点重建反复判成变化。"
  - "遗留条件：既有 reference 的短摘录是 Markdown 字面，而新的归档原件是 HTML，逐行比对必须先抽取可见文本。原件的 extractor 仍记为 identity-markdown@1（字节恒等、raw=extracted），字段本身诚实但语义已不贴合；后续如需按字面核对摘录，需要先规范化再比对，或由维护者决定是否调整来源表示方式（不在本轮写入范围）。"
  - "source-command-code-npm 观察到 1.74.1@sha512-AEr4cPm08RQ86xKZTCOIOgf9ohob/L5ugB2ZO8X/iPzOQVk4nxDInRAofKy6/eQTfDlfb49J1y+Nyx3ngXMBFA==，上一轮无基线。npm 版本变化本身不构成章节变化或源码到包的映射，本轮未固定 npm 快照、未建立任何软件版本映射；受管包与受管二进制按 delivery=pr 不在本轮范围，交由 harness-binary 处理。"
