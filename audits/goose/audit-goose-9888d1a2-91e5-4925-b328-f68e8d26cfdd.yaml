  - "configuration：同时闭合了 v1 声明的三个缺口，因为本轮签出的是完整仓库，v1 缺失的 config/experiments.rs、commands/info.rs、commands/doctor.rs 都在。功能开关机制即配置键 experiments（名字到布尔的映射），权威清单 ALL_EXPERIMENTS 当前为空数组，读取前会移除不在清单里的名字，因此现阶段无激活实验且用户手写名会被清掉；goose info -v 打印的是 all_values() 的合并结果加解析后的 GOOSE_PROVIDER/GOOSE_MODEL，不含任意环境变量，故环境变量覆盖不会显式出现；goose info --check 真的发一条 Say 'ok' 补全并按四类失败区分标签，失败时返回错误可供 CI 前置验证；goose doctor 不打印配置，而是建不落库的交互会话跑 /doctor。GOOSE_MODE 的默认值也已在源码侧核对：config_value! 两参数形式无键级默认值，实际默认来自 GooseMode 枚举的 #[default] Auto 与调用点的 unwrap_or_default()。"
