investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 custom_providers 与 custom_agents 的固定问题。
  - "仓库单提交 4811ae2（chore(GDK): release v0.1.0-alpha.12，107 个文件），与章节已引证据文件重合的有
    crates/goose-providers/src/openai.rs、crates/goose/src/agents/subagent_handl\
    er.rs、crates/goose/src/agents/platform_extensions/summon.rs、crates/goose-cl\
    i/src/session/mod.rs。"
  - 同时改动 crates/goose-agent/src/inference.rs 与
    crates/goose-providers/src/{anthropic,openai_compatible,http_status}.rs，属
    provider 请求与子代理调度线索。
  - 本轮范围：narrow_investigation，入口限 custom_providers 与 custom_agents
    的五道固定问题；未扩展为全库重审。
  - 逐文件核对（pinned workspace
    ws-4811ae25f736-d197f1ee-c486-4929-b89d-ac07a4dc9922，4811ae25f736fdf0ede847449c060e96645426b5）：crates/goose-providers/src/openai.rs
    仅两处非流式分支新增厂商 request id（+7/-4
    行），无请求构造改动；crates/goose/src/agents/subagent_handler.rs 由
    from_foreground_subagent_session(session_manager, session,
    use_login_shell_path) 改为 prepare_subagent(agent, session) 并新增
    SubagentRunner/SubagentEnding/forwarded；crates/goose/src/agents/platform_extensions/summon.rs
    新增子会话继承父会话 goose_mode、handle_foreground_delegate 更名 create_subagent、错误文案去掉
    foreground；crates/goose-cli/src/session/mod.rs 只有一处测试构造由 Arc::new(agent) 改为
    agent。
  - 扩展依据：四个被引用文件中 subagent_handler.rs 的 subagent 执行宿主改变、openai.rs
    的响应/错误路径改变，故按契约展开到 crates/goose/src/agents/state_machine/ops_subagent.rs（由
    ops_foreground_subagent.rs
    重命名）、crates/goose/src/agents/agent.rs（stream_subagent_turn、release_session、Agent
    改为
    Arc<Agent>）、crates/goose-providers/src/{openai_compatible.rs,http_status.rs,anthropic.rs}
    与
    crates/goose-provider-types/src/{errors.rs,conversation/token_usage.rs}；未再扩展。
  - 结案为 unaffected：providers.protocol（engine
    路由与请求构造：crates/goose/src/config/*、crates/goose-providers/src/declarative.rs、model.rs、formats/、openai_compatible/
    子目录在该提交零 diff）、providers.forwarding（配置字段到请求的映射同为零 diff）；agents.limits 的 max
    turns 解析链（summon.rs 的 resolve_max_turns 与 subagent_task_config.rs
    未变）保持原结论，仅新增每会话 turn 锁与收尾释放，已并入 agents.limits 的 partial 答案。
  - 排除：GDK v0.1.0-alpha.12 版本号与 documentation/src/data/gdk-api.json、各 crate 的
    Cargo.toml/CHANGELOG、Cargo.lock、ui/desktop/**（含 i18n 与 provider UI
    组件）、crates/goose-agent/src/inference.rs 与 gen_ai_telemetry.rs 的
    gen_ai.request.id
    遥测字段、crates/goose/src/agents/state_machine/tests/**、crates/goose/tests/**、live_voice/service/tests.rs、elicitation.rs、execution/、providers/command_auth.rs、acp/、sdk
    绑定等测试与非本范围改动。
  - 交付：新建 goose-cli-custom_agents-v4 与 goose-cli-custom_providers-v4 两个完整
    edition（旧版保留），新增 17 条 git_source_file 引用（commit 4811ae25）与对应
    snapshot/artifact；chapter-current.yaml 未切换指针，等独立复核后再由协调者选择。
  - "高影响判定：子代理执行宿主由独立 Agent 改为共享父
    Agent，并新增跨会话的决策请求转发，属于推翻已发布机制的关键加载/调度路径变化，按契约保持 review_status: pending
    并声明独立复核；providers.responses 的 request id 透传为机制新增，同样列入待复核。"
  - 无来源阻塞：git 检出可用，未运行 sources:scan，未复制 checkout 进候选。
