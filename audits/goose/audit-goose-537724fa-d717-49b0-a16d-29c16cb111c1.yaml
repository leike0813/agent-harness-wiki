investigation_notes:
- 本轮 triage 分类：maintain；已按 coordinator 分派完成 custom_providers 与 custom_agents 两个主题，configuration/skills/mcp/hooks/native_plugins/local_transcripts 明确排除未触碰。
- custom_providers：supports_vision 现在是 ModelInfo 上的 serde 三态字段（3bd85200 crates/goose-provider-types/src/base.rs），声明值在 ProviderEntry::normalize_model_config 与 OpenAiProvider::vision_support 两处按“声明优先”覆盖 canonical 检测，最终作为 OpenAiFormatOptions.supports_vision 决定图片是否进入请求报文；模型名按 find_declared_model 大小写敏感精确匹配；update_custom_provider 对同名模型按 or 合并 supports_vision。仓库集成测试 crates/goose/tests/declared_vision_registry.rs 固定了端到端行为。providers.metadata 因此从 partial 升为 answered。
- custom_providers：另确认 ProviderDef 新增 RUNS_OWN_TOOL_LOOP 常量，而自定义 provider 注册恒为 false，故自定义 provider 永远由 goose 驱动工具循环并启动扩展 server——写入 providers.protocol，其余 protocol 缺口不变。
- custom_agents：build_task_config、SubagentRunParams、run_subagent_task 与后台委派执行路径整体删除，TaskConfig 只剩结构体与 Debug 且无任何构造点；delegate 只保留前台路径，并新增“provider 必须能从注册表重建”的失败点，v2 记载的“回落到会话自身 provider”不再成立。
- custom_agents：Stop 语义变化可由源码确证——子代理结果新增 Cancelled 结局且不交付消息，收尾时对未完成的子代理追加隐藏的“was cancelled before it finished and will not run again.”；CLI 侧 Ctrl-C 后先 drain_stopped_run 收干已产生事件再丢弃流。
- custom_agents：扩展生命周期改为按会话租用（ExtensionSlot）并首次使用时才启动；扩展选择有唯一性检查，报“extension '<NAME>' appears twice in the selection”。
- custom_agents：已删除的旧后台委派路径曾是 subagent_tool_request 日志通知的唯一生产者，而 CLI/ACP 的消费代码仍在，因此“子代理工具调用在 CLI 实时显示”在本轮只剩文档证据，已在章节缺口中如实记录，未据此推断能力消失。
- '排除（经复核确认不调查）：agent-loop: rename to finalize_cancellation and make Emitter sync (#12786)、docs: Agentic State Machines (#12130) 及全部 Cargo/workspace lockfile churn。三者不改变本轮固定问题在 custom_providers/custom_agents 下的用户可见答案。'
- 本轮新增 13 个 git_source_file artifact、13 个对应 source_revision snapshot（提交 3bd85200）与 22 条引用；未新增软件版本映射（源码提交不能证明 npm 1.54.0 的行为）。
- 本轮 triage 分类：maintain
- 仓库前进 13 个提交，其中 “Delete the legacy agent loop”、自定义 provider 的 supports_vision 传递与扩展按需启动同时改变 custom_agents
  与 custom_providers 的机制。
- custom_providers.metadata/forwarding 与 custom_agents 章节引用该仓库，需要按固定问题复核。
