  reason: 'TaskConfig 已无任何构造点：build_task_config 与后台委派执行路径整体删除，delegate 只经前台状态机路径，且 provider 必须能从注册表重建（新增 Provider ''<NAME>'' cannot be reconstructed for a foreground subagent 失败点，旧的“回落到会话自身 provider”路径消失）；Stop 现在及时结束本轮并保存已产生内容，子代理结果新增 Cancelled 结局；扩展改为按会话租用并首次使用时才启动。据此新增 goose-cli-custom_agents-v3，覆盖 agents.overrides/limits/diagnostics 的旧结论；入口、格式、角色与调用的用户可见结论不变。'
