    reason: 2026-10-22 复核判为实质变化并新建 lovable-web-configuration-v4：项目 Secrets 入口改为 More
      → Settings → Secrets；Lovable Cloud 文档内统一改称 built-in backend 且后端工具移到 More
      菜单；后端工具权限只在 Account settings → Agent permissions 调整；数据区域取值改为「工作区默认 > 个人设置
      > 最近区域」且启用后不可改；工作区 Default website access 改为仅 Business/Enterprise 且默认
      Anyone，发布受众新增组织选项、Invite only 每项目上限 10 人；旧 Who can publish externally 被
      Enterprise publishing policies（五条）替代；新增 Enterprise 废弃项目标记与自动删除、app
      登录方式策略；桌面应用最低系统改为 macOS 13+/Windows 10+。
