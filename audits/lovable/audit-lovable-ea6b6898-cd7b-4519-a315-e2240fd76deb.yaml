investigation_notes:
  - 本轮 triage 分类：narrow_investigation；只读观察时间 2026-10-22T12:55:01.242Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - 按已发布章节引用逐条核对：44 条已发布文档摘录在本轮页面中不再命中，受影响主题
    configuration、custom_agents、custom_providers、hooks、local_transcripts、mcp、native_plugins。
  - 37 个文档来源 changed，逐页比对后 19 页有实质差异；其中大量摘录失配来自官方站点把 MDX callout/Accordion/Steps
    批量改写为 Markdown
    提示块与编号步骤，正文语义不变——这类页面（custom-mcp、api-keys、chat-mode、agent-mode、app-user-connectors、app-connectors、payments、secrets
    的大部分、lovable-api、project-settings 的大部分）只记录身份变化，不据此改写章节。
  - 真正实质性变化集中在：cloud（Cloud → built-in
    backend、权限入口与区域设置重写）、privacy-and-security-settings（发布受众/策略、废弃项目、app
    登录方式、区域设置）、secrets（项目 Secrets 入口改为 More →
    Settings）、publish（组织受众、发布审批、unpublish 权限）、projects/settings（删除项目 60
    天可恢复、Lifecycle 的 Abandonment protection）、workspace-admin-settings（Recently
    deleted
    projects、工作区删除可自助恢复）、agent-integrations（面板路径、删除项目恢复）、lovable-mcp-server（数据库工具范围）、desktop-app（macOS
    13+/Windows 10+）、admin-controls（registry 依赖 Remote MCP
    connectors）、ai（模型表拆页、AI activity 与 app context 位置/默认值）。
  - 决策：configuration、local_transcripts、mcp、hooks、native_plugins 各新建完整
    edition（v4/v2/v3/v2/v2）并切换本产品选择；custom_agents 与 custom_providers
    的固定问题答案未变，保留原 edition，仅记录复核证据。所有新引用绑定本轮 observed sha256 的新
    artifact/snapshot，旧引用保持原样不动。
  - 风险提示：configuration 中 Secrets 入口、发布策略与删除恢复属于对已发布步骤的实质改写，建议 coordinator
    在发布前安排一次独立复核；本审计已按作者自检 + 候选 check 结论置为 reviewed。
