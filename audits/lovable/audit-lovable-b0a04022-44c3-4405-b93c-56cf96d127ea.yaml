investigation_notes:
  - 23 个来源在 sources:check 中标记 changed；本轮逐一获取 changed 官方文档并计算 SHA-256，结果均与输入 observed 一致。既有 Lovable
    引用中，绑定这些变化来源的摘录与新文档存在字面差异，尚未完成逐题语义复核。
  - 受影响范围覆盖七个主题与 49 个固定问题。当前工作区没有 archive/lovable/ 下的官方文档原件；maintenance 第 1 节要求新文档以 archived_document 原件留档，第 3
    节要求引用绑定固定 Snapshot。用户本轮严格写入范围不包括 archive/，因此不能新增可验证的新 Snapshot、Artifact、Reference 或章节版本。
  - 七个主题继续指向既有 edition；所有 impacts.question_ids 保留在 pending_question_ids 中。需要维护者允许在 archive/lovable/ 写入已按
    observed hash 核验的原件后，才能完成来源引用和章节更新。
