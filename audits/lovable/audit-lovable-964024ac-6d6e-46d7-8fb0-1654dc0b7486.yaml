investigation_notes:
  - "本轮 triage：九页中两页可判定，七页因缺少可比对的旧原件无法判定差异方向；据此重写 impacts，
    只保留实际核验过的 topic/question/section/reference。"
  - "可判定页 source-lovable-docs-publish：保留副本
    archive/lovable/artifact-source-lovable-docs-publish-723826a19025/source.md 与当前
    archive/lovable/artifact-source-lovable-docs-publish-d1f817c84529/source.md 逐行比对（已去 HTML）。
    语义变化全部集中在发布可见性：Free/Pro 新增 Invite only、Public 成为默认名称、Business/Enterprise
    的 Custom 扩展为可加整个工作区/组/按名字加人、新增 Enterprise publishing domain、新增
    \"Invite people outside your workspace\"、降级行为重写。受影响问题只有
    configuration.config-overrides（\"谁能看到已发布应用\"），已改；无其他章节正文引用发布可见性。"
  - "可判定页 source-lovable-docs-hosting：保留副本
    archive/lovable/artifact-source-lovable-docs-hosting-651e99eb89f7/source.md 与当前
    archive/lovable/artifact-source-lovable-docs-hosting-bfb74d6ab4c1/source.md 比对，差异只有
    Enterprise publishing domain 一句与 Free/Pro 可限制为受邀访问一句，属 hosting/发布行为。
    本产品章节没有任何一条 source_refs 指向 hosting 快照（ref-lovable-hosting-publish、
    ref-lovable-hosting-elsewhere 均未被章节引用），因此 reviewed_no_impact，不改章节。"
  - "关于\"发布可见性不属于八类固定主题\"：docs/topic-questions.md 的八类主题中没有 hosting/部署类问题，
    但 configuration.config.overrides（\"作用域间如何选择优先级……哪些键例外\"）确实覆盖
    \"工作区 Default website access 与发布弹窗逐项目覆盖\"这条覆盖关系，local_transcripts 也不涉及
    已发布站点受众。因此结论不是\"完全无影响\"，而是影响集中在 configuration 一个问题并已修订。"
  - "无法判定差异方向的七页：ai、chat-connectors、index、mcp-server、project-settings、secrets、
    workspace-admin-settings。项目 archive/ 内没有这七页的旧原件，本轮 check 也只登记了
    candidate_path 指向当前副本，无法逐字比对。对每一页只核对了\"当前原文是否仍支持已发布句子\"：
    逐条比对章节引用的 reference excerpt 与当前原文，全部逐字命中的页面为 chat-connectors（5 条引用）、
    index（2 条）、mcp-server（6/7 条）、secrets（3/4 条）、workspace-admin-settings（6/6 条）。
    仅措辞或增量的漂移：ref-lovable-mcpsrv-perms 中 deploy_project 一句新增 \"unless its website access
    is set to Invite only\"（mcp 章节正文只用该引用的 Manage access 入口，仍成立）；
    ref-lovable-projset-domains 新增 Enterprise publishing domain 一句；ref-lovable-secrets-manage
    新增 remix 与 secret form 两句；ref-lovable-wsadmin-general 的 General 段不再列\"默认成员月度
    积分上限\"（该设置现列于 Usage limits & alerts，章节正文只按工作区级设置列举，未指定小节）；
    ref-lovable-ai-models / ref-lovable-ai-pricing 为措辞与用量项增量。"
  - "对 ai 页发现的唯一实质冲突已处理：当前原文的 live voice 例外否证了已发布的\"不经浏览器\"表述，
    据此新建 custom_providers v2；但该页整体差异方向仍不可判定，故 providers.* 仍在 pending。
    同理 mcp.*、hooks.*、plugins.*、skills.*、agents.*、config.*、transcripts.* 所依赖的页面全部属于
    这七页，pending_question_ids 保持不变；这些不是新问题，而是本轮无法闭合的既有来源比较缺口。"
  - "本轮没有产生八类主题之外的新知识面：Enterprise publishing domain 只影响已发布站点地址与受众，
    没有任何章节状态它，也没有可归属的固定问题，仅记录不修改。"
  - "复核判断：不构成高影响（无来源互相冲突、无跨主题加载机制变化、未推翻任何已发布配置步骤）。
    本轮为作者自检的普通更新。"
