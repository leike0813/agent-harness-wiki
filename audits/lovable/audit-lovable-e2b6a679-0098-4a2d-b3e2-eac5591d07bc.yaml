investigation_notes:
  - "local_transcripts 首采。全部证据来自本轮 scan 已归档的官方文档原件（archive/lovable/artifact-source-lovable-docs-*/source.md）：
    plan-mode、agent-mode、project-settings、workspace-admin-settings、git-sync、ai、llms.txt 索引。
    lovable 未登记 git 仓库来源，因此本轮没有创建 git_source_file 记录，也没有任何 commit 可绑定；
    七个新 snapshot 均为 kind: documentation、version_applicability: unknown，结论不能绑定到已安装版本。
    工作区：仅项目根 archive/ 只读原件，未检出任何源码。"
  - "主要结论：已归档官方文档没有任何 Lovable 本机会话记录文件、数据库或索引。唯一写明磁盘路径的记录载体是
    项目内的 .lovable/plan.md 与 .lovable/plan/ 目录（项目文件，随 Git 同步进出，不是本机 transcript）；
    构建会话与 project chat history 在 Lovable 云端，来源未给出其存储位置、格式、schema 或删除入口。
    因此 transcripts.database 与 transcripts.schema 记 unknown，其余记 partial，并逐节写出已查入口与剩余缺口。"
  - "已在正文显式区分三类易混对象：Lovable 构建会话记录、部署应用的 AI 调用记录（features/ai.md，保留 90 天，
    不适用于构建会话）、以及 SSO 登录 session 时长（workspace-admin-settings.md 的 session 指登录会话，非 transcript）。"
  - "剩余缺口需下一轮取得原文的页面：features/projects/chat.md、features/chats.md、features/drafts.md、
    features/projects/remix.md、features/projects/history.md、features/advanced-settings.md、
    features/privacy-and-security-settings.md、integrations/lovable-api.md、integrations/desktop-app.md。
    这些页面的 llms.txt 索引条目已在 references 中引用，用于证明入口存在，而非证明机制。"
