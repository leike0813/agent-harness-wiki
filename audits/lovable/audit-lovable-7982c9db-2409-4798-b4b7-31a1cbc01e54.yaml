investigation_notes:
  - 本轮 triage 分类：maintain；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：maintain（高影响）；范围限 mcp 与 configuration 的固定问题。
  - docs/mcp-server 改写鉴权与授权模型：未预置 Lovable 连接的 MCP 客户端可用自定义 OAuth
    客户端（需注册回调地址并支持自定义凭据）；依赖自动注册的托管客户端仍需 Lovable 批准其 web 回调地址；连接权限改为由用户授权的 OAuth
    scope 决定，可跨项目与工作区但不会扩权；Business 与 Enterprise 可启用企业托管认证（成员经 Okta SSO 从 Claude
    使用 Lovable）；query_database 拒绝不在固定扩展清单内的 CREATE EXTENSION 并返回含清单的错误。
  - docs/workspace-admin-settings 新增 API keys & OAuth 章节（工作区访问令牌含 scope、过期、额度与
    IP 限制；“Log in with Lovable” 注册 OAuth 客户端，需 owner 或 admin
    角色），并改写工作区设置生效与复核说明。
  - docs/ai 补充自动生成的项目 LOVABLE_API_KEY 与工作区 API key 的区别；docs/secrets 的链接由
    workspace SSO 换成 oauth-clients。
  - api-keys、app-connectors、chat-mode、cloud、lovable-api、payments 六个来源的上一版原件未被
    archive 保留，无法逐行比对，改动按 mcp-server 与 workspace-admin-settings 的对应改写限定入口。
  - worker（task monitor-20261013-lovable）范围：mcp 与 configuration 主题，加上冻结问题清单中的 providers.auth；其余主题的 pending 问题保持不动。
  - 已比对的固定原件（archive/lovable/artifact-source-lovable-docs-*/source.md）：mcp-server 5763253d→fe9080de、workspace-admin-settings 8d1474af→0d97a6f9、ai c974c017→f3b0daa6、secrets 0d9def88→3879e2d3、index 4061ae24→bf3b917f；为新修订新增 artifact 与 snapshot 记录（artifact-source-lovable-docs-mcp-server-fe9080def292 等），未把 archive 原件复制进候选。
  - 排除项：docs/secrets 与 docs/index 的改动只有相关链接替换（secrets 的 SSO 链接换成 oauth-clients，index 新增 oauth-clients 与 enterprise-managed-auth 两个页面条目），不改配置字段、路径或鉴权语义，按冻结输入的 excluded 记为无知识影响。
  - 无法比对的部分：api-keys（baseline fc49a5af）、app-connectors（fa05ce6a）、chat-mode（3c3e5f2f）、cloud（8e77931a）、lovable-api（22a84f41）、payments（4e7c8ac4）的上一版原件未在 archive 保留，只能按新修订核对已发布答案：api-keys 的入口路径、每 key 限一个工作区、IP allowlist 与积分上限说明与已发布章节冲突或新增，已在新章节更正；app-connectors 的 LOVABLE_API_KEY 受管项目 secret 段、cloud 的 Enable Cloud 权限表与区域锁定、payments 的 provider API key 相关表述与已发布答案一致；chat-mode 未触及本轮范围。
  - 新建章节版本：lovable-web-mcp-v2、lovable-web-configuration-v3、lovable-web-custom_providers-v3；旧版本保留未改动，registry/chapter-current.yaml 未切换（高影响结论待独立复核）。
  - 顺带发现（同一 workspace-admin-settings 新修订，非鉴权主题但影响已发布 config.defaults 答案）：General 分区不再有“Default monthly member credit limit”行，成员额度改由 People 的逐成员额度与 Usage limits & alerts 的阈值承担，已在 v3 的默认值表中更正并换用新修订引用。
  - 保留缺口：MCP 各工具对应的具体 OAuth scope 名称清单未给出；features/oauth-clients.md 与 features/enterprise-managed-auth.md 未登记为来源，OAuth scope 明细与企业托管认证的配置步骤仍无直接证据；chat connector 的 OAuth token 刷新语义依旧无来源。
  - 高影响：本轮改写了已发布的 MCP 授权模型结论（旧的“连接继承完整账号权限”被替换为 scope 受限），需独立 reviewer 复核后才可进入已发布 edition；在此之前 mcp.auth、mcp.exposure、mcp.diagnostics、config.sources、config.runtime、config.trust、config.defaults、providers.auth 保持 pending。
