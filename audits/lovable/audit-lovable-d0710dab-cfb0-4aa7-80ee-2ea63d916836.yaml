investigation_notes:
  - "基线：21 个未变来源与 16 个变化来源的 baseline 哈希全部在 documents/ 中存在（checks 中逐条列出），因此全部为基线对基线的逐字 diff，无需回退到最近保留原件；比较窗口就是 2026-11-25 观察对各自上一基线。"
  - "source-lovable-docs-ai（61bbd652→5966b698）：新增 Enable ElevenLabs for your workspace 整节；Choosing a model 的音乐/TTS 行改为 Eleven Music v2 与 ElevenLabs 旁白；FAQ 改为音乐只有启用 ElevenLabs 时才有默认模型；删除“每个模型条目都链到 provider 官方页”一句（改为按用途分组、默认模型排在首位）。语义结论：新增一个工作区级内置 AI provider 开关；其余（app context、额度、监控、rate limits）未变。→ providers.entry/auth/models、providers.diagnostics 的 key 上限、config.defaults/trust、agents.overrides。"
  - "source-lovable-docs-project-settings（4a08014a→c34de675）：由标签页改为 General settings + More 面板的 Settings 分组（Secrets/Logs/Instructions/Memory/Git）；Domains 移到 More；Skills 从项目设置移除并注明只在 Workspace settings → Skills；Lifecycle 的 Abandonment protection 改为 Keep forever。→ config.sources 的项目作用域行、skills.roots/loading/conditions、local_transcripts 的 Lifecycle 路径。"
  - "source-lovable-docs-privacy-security（d2a443c9→0ffe4ee4）：Abandoned projects 全部更名为 Inactive projects（Mark/Delete inactive、Postpone/Postpone deletion、Keep it/Keep forever、Security insights 的 Inactive status → Kept forever 与 Kept forever since、audit log 事件名保持不变）；Connector policies 默认值改为“工作区变为 Enterprise 时开启、已为 Enterprise 的保持关闭”；深/快扫术语改为 advanced checks 与 dependency check；Sensitive data 的视图入口与 PII 提示措辞变化（未被本轮章节引用）。→ config.trust/defaults、local_transcripts.archive-cleanup、hooks.events/entry-io/order-conditions/diagnostics。"
  - "source-lovable-docs-api-keys（38b65fa3→ab8bba41）：新增每用户每工作区最多 10 个自建 key、过期未吊销仍占名额；IP allowlist 改为“不能保存空清单”，删除“Configure allowed IPs/remove last entry”措辞；IPv4 必需条目的理由改为双栈服务器仍可走 IPv4、纯 IPv6 清单可能挡掉它们；新增 ⋯ 菜单 Edit direct IPs as text 与 Export direct IPs as CSV。→ config.runtime（IP 限制与 key 上限）、config.diagnostics（建 key 上限排错）、custom_providers.diagnostics。"
  - "source-lovable-docs-skills（6717e68a→61757d01）：删除 Project settings → Skills 两处入口，自动使用开关改为仅 Workspace settings → Skills（含 lovable.dev/settings/skills 直链）。→ skills.roots/loading/conditions 三处文本与引用。"
  - "source-lovable-docs-desktop-app（5c483ed9→996ca0f0）：删除 Connect Paper 小节及 FAQ 的 Paper 条目，本地 MCP 示例只剩 Figma Desktop；Windows 关闭窗口改为留在系统托盘。→ mcp.definition/lifecycle 与 native_plugins.install/discovery/diagnostics 的 Paper 归属；Windows 托盘行为未进入五主题答案。"
  - "source-lovable-docs-chat-connectors（c108dd45→3caffe8e）：Prebuilt chat connectors 新增 Paper accordion（读取 Paper 设计上下文、在 Paper 画布创建/编辑设计，链接 Paper MCP 文档）。与 desktop-app 的 Paper 移除互为证据：Paper 由本地 MCP 改为远程 chat connector。"
  - "source-lovable-docs-workspace-admin-settings（8057d50c→48f408a3）：Security 分组描述 cleanup of inactive projects、Security center 的 scans 改为 advanced checks。仅措辞；配置章节引用的该页条目（设置入口、搜索设置、审计日志）未变，无答案改写。"
  - "source-lovable-docs-index（018d436e→16b90b3f）：llms.txt 中音乐、安全概览/安全视图、项目设置、2FA 的描述改；local_transcripts 引用的 project chat、Chats、cross-project 条目未变；hooks/native_plugins 引用的 header/listing 计数与页面集合未变。按导航/摘要噪声排除。"
  - "source-lovable-docs-agent-integrations（4081f68d→ca9ddf87）：Automated security checks 段改为 advanced checks（integration 变化或发布时触发、每天最多一次）与 Findings 页面（More → Security → Findings），新增 More 菜单配图；工具定义、面板、权限与 exposure 段未变。→ 无答案变化；mcp 的 400/security_critical_findings 仍由 mcp-server 来源支持。"
  - "source-lovable-docs-mcp-server（dd39a2b5→a277c5c1）：仅同一 accordion 内 Deep scan→advanced checks 的措辞替换，400、type、finding_refs 未变。→ 无答案变化。"
  - "source-lovable-docs-publish（22217be8→3049821d）：Quick scan→automatic checks、发布结果行改写（critical/warning 计数、Info 不计）、新增 Publish to Databricks 与取消发布时删除 Databricks App/secret scope。→ 本轮五主题与 hooks 未引用这些段落；Databricks 发布不改变配置/Provider/MCP/Transcript 结论。"
  - "source-lovable-docs-payments（b6d20293→c11557e7）：Payments tab 段落拆分并新增配图，webhook 端点文本未变（hooks 引用的旧 snapshot 仍匹配）。→ 无答案变化。"
  - "source-lovable-docs-connectors（ba2a7a66→187fd045）：仅新增 More → Connectors 配图。→ 噪声排除。"
  - "source-lovable-docs-git-sync（92272e97→500f450d）：仅把 Project settings 链接锚点 #git-tab 改为 #git，正文未变。→ 导航/URL churn，排除。"
