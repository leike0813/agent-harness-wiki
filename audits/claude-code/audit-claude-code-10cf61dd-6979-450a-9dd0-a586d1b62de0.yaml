investigation_notes:
  - 本轮按冻结观察 triage：只读时间 2026-11-23T18:01:06.472Z；npm 来源 2.1.330@sha512-KQMl… 未变，3 个官方文档来源变更：configuration-doc d94a7f2f… → 417b611c…、mcp-doc 8a5fcd23… → 683f1caf…、skills-doc 12bb7fba… → 0e2505f3…。
  - 设置页只有两个 hunk：`--settings` 条目新增“不能设置部分用户设置键，如 `prependPlugins`”；多仓库云会话条目把“这两个键声明的 marketplace 与插件仍不加载”收窄为“仓库声明的 marketplace 仍不会被添加”。新原件 archive/claude-code/artifact-source-claude-code-configuration-doc-417b611cbc5a/raw.md，sha256 417b611c…，固定为 snapshot-claude-code-configuration-doc-20261123；新引用 ref-cc-config-onesession-20261123、ref-cc-config-cloudmulti-20261123。
  - MCP 页只有两个 hunk：优先级列表第 5 项新增“在 `claude -p`、Agent SDK 与 VS Code 会话里 connector 排在插件提供的 server 之前”；form mode 示例措辞变化无语义。新原件 archive/claude-code/artifact-source-claude-code-mcp-doc-683f1caf3fd9/raw.md，sha256 683f1caf…，固定为 snapshot-claude-code-mcp-doc-20261123；新引用 ref-cc-mcp-precedence-20261123。
  - Skills 页只有一个 hunk：云会话插件条目只保留“只在用户设置里启用的插件不在云会话加载”，删除仓库设置声明插件的说法。新原件 archive/claude-code/artifact-source-claude-code-skills-doc-0e2505f3bb6b/raw.md，sha256 0e2505f3…，固定为 snapshot-claude-code-skills-doc-20261123；新引用 ref-cc-skills-cloudplugins-20261123。
  - 维护范围：configuration v6（config.sources 的云会话 marketplace 收窄，config.overrides 与 config.runtime 的 `--settings` 键限制）、mcp v7（mcp.entry 与 mcp.exposure 的 connector/插件先后）、skills v7（skills.conditions 的云会话插件条件）、native_plugins v4（plugins.install 原句“云会话不加载仓库声明的 marketplace 与插件”已无来源支持，按新措辞改写）。旧 snapshot 与 reference 全部保留未改。
  - 排除依据：三个文档的新增与删除行只出现在上述 5 个 hunk。对全部引用按变化短语检索（below managed settings、extraKnownMarketplaces、connectors rank、Form mode、Plugins declared、Plugins enabled only、don't load in a cloud session）只命中本轮维护或已被取代的引用。custom_agents、custom_providers、hooks、local_transcripts 的全部 pending 问题，以及 configuration 的 defaults/migration/trust/diagnostics、mcp 的 definition/transport/auth/lifecycle/capabilities/diagnostics、skills 的 roots/discovery/collision/format/extensions/loading/invocation/diagnostics、native_plugins 的 model/package/discovery/api/lifecycle/diagnostics 都按“引用文本未变”结案；其中 custom_providers 两处 ref-cc-config-onesession-20261003 引用只用于 env 配对与第三方 provider 叙述，不涉及 `--settings` 可设置键范围。
  - 版本边界：三页仍为 version_applicability unknown；新增结论无版本门槛，既有 v2.1.259（managedMcpServers）等门槛保持原样。npm 2.1.330 与 integrity 未变、README 只指向在线文档，本轮不新增版本映射。
  - 复核判据：云会话插件措辞收窄与 MCP connector 优先级变化涉及跨主题加载条件，已触发 §5 独立复核；无来源冲突，也没有推翻已发布配置步骤。
