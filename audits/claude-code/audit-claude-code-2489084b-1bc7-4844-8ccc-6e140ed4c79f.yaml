investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:53:14.776Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。三份文档来源按冻结 URL 逐页比对，三份都有实质差异；npm
    2.1.299→2.1.308 仅为发布身份变化，不产生知识影响，也不据此造版本映射。
  - 判据：已发布引用绑定的是各自 snapshot，摘录不再命中本轮页面不等于结论失效；只有当页面表述与本轮机制冲突或新增条件时才新建 edition。据此
    hooks 主题只做核对、不改章节。
  - configuration：设置页把「Settings in cloud sessions」拆成 project 云线程、单仓库、多仓库三段，并明确
    project 云线程里仓库 .claude/settings.json 的权限规则、hooks 与 env 都不生效；~/.claude.json
    的「sign-in session」改为「account details」。config-sources 段按此重写，config.defaults
    仍为 partial 且结论未变。
  - custom_agents：Skills 页 model 行新增 auto mode 与 plan mode
    分类器审阅期间不采用不支持模型的条件；fork Skill 的 checkpoint 段改为「/rewind 只恢复对话里 Claude
    已改过的文件，该 Skill 改的其他文件保留」。agents-overrides 段更新，agents.limits 的并发/嵌套上限仍无来源，保持
    partial。
  - local_transcripts：MCP 页删去自动转后台的 v2.1.212 版本标注，新增
    CLAUDE_CODE_MCP_AUTO_BACKGROUND_MS（毫秒，设 0 关闭）；checkpoints 与 ~/.claude.json
    表述同上。改写 transcripts-session-lifecycle 与
    transcripts-storage-layout；格式、schema、归档仍为 unknown/partial，未改。
  - mcp：Tool availability 的无 tool search 清单不再包含自定义
    ANTHROPIC_BASE_URL；网关单独成节，v2.1.304 起默认开启 tool search，v2.1.305 起可在 400/422 后无
    tool search 重试；deny ToolSearch 后工具前置加载但请求仍可能带占位 defer_loading；描述上限对
    api.anthropic.com 托管 server 不适用（该变量 v2.1.280 起可用）；-p、SDK 与非 project
    云线程会话免批准加载 project 作用域 server。仅改写
    mcp-capabilities，mcp.entry/definition/auth/lifecycle/diagnostics
    未在范围内，正文沿用旧机制与旧引用。
  - skills：项目与嵌套 Skill 的生效范围加了「project 云线程除外」；Cowork 与云会话段明确 project 云线程只用账号启用的
    Skill；叠放 Skill 只在终端成立，Agent SDK 或 claude -p 只加载第一个；user-invocable false 会隐藏
    / 菜单项且输入 /名字 不运行；paths 相对 Claude 当前工作目录，目录外文件不匹配。改写 skills-locations 与
    skills-invocation，其余小节沿用。
  - hooks：hooks-entry 的三条事实（settings 文件承载 hooks、Skill frontmatter hooks
    自调用起持续到会话结束、插件可携带 hooks 与其 MCP 工具全限定名）在本轮三份页面中语义未变；引用摘录的措辞漂移属于旧 snapshot
    的正常保留，故不新建 edition，hooks.entry 记 answered/partial 未变。
  - 新引用与快照：本轮新增
    snapshot-claude-code-configuration-doc-20261022、snapshot-claude-code-skills-doc-20261022、snapshot-claude-code-mcp-doc-20261022
    及三条 archived_document。其 archive_path 按 scan
    既有命名（archive/claude-code/<artifact-id>/source.md）记录，原件需由 coordinator 在项目根归档后
    sources:audit-log 才会回到 verified；worker 未写项目根。
  - 12 道固定问题全部落定，pending_question_ids 清空；仍保留 pending_audit_refs 中的上一轮审计作为溯源，其
    pending_question_ids 本就是空。
