investigation_notes:
- 本轮 triage 分类：maintain（高影响，需独立复核）
- 三个官方文档来源均有实质语义变化：skills 文档新增 managed-agents-onboard 命令并改写 worktree 下的父目录搜索与分叉技能结果返回规则；MCP 文档删除多处 “As
  of v2.1.196” 版本限定、改变 oauth.scopes 默认行为、明确插件 MCP 服务器表述并新增响应体大小上限；configuration 文档在 settings 作用域列中新增 “User”
  一项。
- npm 版本 2.1.294→2.1.296 属发布身份变化，单独不构成知识影响；本轮知识影响来自上述文档。
- skills、mcp、configuration 章节均引用这三个来源，按 SKILL §4 指定独立 reviewer 复核。
- 本轮 worker 在候选根内复核三个官方文档原件的差异后，改写 skills、mcp、configuration 三个章节的新版本：skills-v5、mcp-v4、configuration-v4，保留既有已发布版本字节不变。
- skills-v5：worktree 父目录搜索规则的适用面收窄到 `--worktree` / `git worktree add` 创建的 worktree；`disable-model-invocation` 的定时任务效果去掉 v2.1.196 版本限定；新增动态工作流中 fork 结果返回给调用 agent 的规则；`${CLAUDE_PROJECT_DIR}` 的 v2.1.196 版本说明已从页面删除。`managed-agents-onboard` 新增两行子命令属于捆绑 `/claude-api` skill 的子命令表，不改变 skills 章节任何固定问题的答案，本轮不写入。
- "\"mcp-v4：`oauth.scopes` 未设置时不再请求整份 `scopes_supported`；v2 协议修订协商扩展到 claude.ai connector 且不再限定于拉取特性开关的会话；新增 HTTP/SSE 单响应 16 MB 上限；新增按工具 `_meta` 的 `anthropic/alwaysLoad` 与按 server 的 `alwaysLoad: false`；项目 server 批准与 `.mcp.json` 信任规则不再标注 v2.1.196。标题重命名与插件 MCP 措辞精简不改变答案。\""
- configuration-v4：Scope 列新增 `User` 取值，写入忽略键的判定列表；共享 `.claude/settings.json` 按主工作目录读取；云会话多仓库读取限定为 Anthropic 托管环境。
- 未调查的固定问题保持原状态；custom_agents、custom_providers、hooks、native_plugins、local_transcripts 未被本 worker 触碰。
- npm 2.1.294→2.1.296 仅为发布身份变化，未进入任何章节结论或版本映射。
