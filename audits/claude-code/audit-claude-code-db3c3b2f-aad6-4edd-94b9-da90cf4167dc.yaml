investigation_notes:
  - "source-claude-code-skills-doc 0e2505f3bb6b -> 537004c08aad (119724 -> 120971 bytes): four semantic deltas. The collision table adds a reserved bundled-name row (`ship`, `ship-local`, `steward` are not replaced by your skill where `/ship` exists). A new 'Skills from MCP servers' section plus 'Skill features that don't apply' adds MCP servers as a skill source (v2.1.331) and lists the ignored frontmatter fields, disabled `!` commands, unattached `@` references and unsubstituted placeholders. The `model` frontmatter row now applies only to explicit `/name` runs and keeps the session model when Claude runs the skill, with org allowlist, plan-mode upgrade and auto-mode classifier exceptions, and becomes the forked subagent's model under `context: fork`. The restrict section adds that MCP skills get no `allowed-tools` grant and cannot be allow-skipped by skill name. Excluded as noise: NOTE/TIP callout conversions, 'never runs' -> 'doesn't run your skill', dropped 'without a restart' and 'so there are no packages to install', and the inline 30-day trash default now left to the retention link (it does not contradict the published 30-day claim)."
  - "source-claude-code-mcp-doc 683f1caf3fd9 -> c3cf54941780 (158669 -> 178397 bytes): 165 changed lines. MCP tasks lose the public-beta label and gain subagent calls: a non-fork subagent started by the main conversation, in an interactive terminal that fetches feature flags, on v2.1.331, with a server that is not defined in the subagent's own file; in terminal sessions that subagent waits for the result. A feature-flag-off clause now requires an interactive terminal on v2.1.317 instead of excluding the session. VS Code and local desktop sessions gain tasks (v2.1.331 + flag fetching). Cloud tasks are connector-only, with `.mcp.json` and plugin servers getting none, and question handling differs per surface (`claude -p`/Agent SDK cancel and skip Elicitation hooks). A new 'Use skills from MCP servers' section adds naming (`server:skill` with connector/plugin prefixes), approval modes, permission rules (`Skill(mcp__docs__*)`, `Skill(docs:pdf)`, `mcp__docs`), allow-rule scope, resource-read behavior, availability by plan/auth/model/connection, per-server limits, org switch `disableDirectMcpSkills` and connector restrictions, and troubleshooting. Excluded: 'interactive session' -> 'interactive terminal session' rewording in auto-backgrounding and wait sections repeats the same scoping already captured by the task clauses; removal of 'so the same server won't appear in your other projects' restates an unchanged rule; cloud poll-interval cadence is server-author guidance, not a fixed-question answer."
  - "source-claude-code-configuration-doc 417b611cbc5a -> db27bceb6478 (45900 -> 46754 bytes): a new 'Broken settings in a `-p` run' subsection documents the default-text stderr report. It separates a file that did not load (nothing in it applies, including hooks, permission rules and sandbox settings, though environment variables it already set can stay) from entries that were skipped (the rest of the source still applies), shows example reasons, tells the reader to fix and restart, to resend `applyFlagSettings` SDK inline settings, and to run `claude doctor` afterwards. Excluded: removal of 'your settings files stay as they were' and the `/config` cloud target relabel to Settings > Code are wording/UI metadata. The round hint about removing the `crossSessionInbound` and `useAutoModeDuringPlan` table rows is not present in this observation: both rows remain verbatim at lines 330-331 of the observed document, so the restrictive-key exceptions paragraph and its references stay unchanged."
