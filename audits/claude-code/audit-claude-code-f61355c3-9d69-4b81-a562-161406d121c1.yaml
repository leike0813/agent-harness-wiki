investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-24T18:04:24.653Z，会话
    057702b2-d935-4f35-a685-ca2fd5b75e89。
  - 3 个官方文档来源变更、1 个 npm 来源版本自 2.1.308 前进到 2.1.310。逐字节 diff 显示三个文档页面的改动主体是把站内相对链接
    /docs/en/x 改写为绝对链接 https://code.claude.com/docs/en/x.md，正文语义未变。
  - 但链接目标改写使 80 条已发布摘录不再逐字命中：这些摘录在自身快照字节中存在、在本轮新字节中消失（其中部分是 markdown
    表格与内联代码在掩码后仍不匹配）。引用失效本身需要处理——引用定位与摘录必须与新页面一致，不能让读者按旧链接目标核对。
  - 本轮派发范围覆盖全部受影响主题的固定问题，因为引用失效横跨
    skills、mcp、configuration、custom_providers、custom_agents、native_plugins、hooks
    与 local_transcripts 八类；worker 需要逐条判断是仅更新引用定位，还是结论本身也变了。
  - npm 版本前进属纯发布身份变化，未下载或比较包内容，不单独构成章节影响。
