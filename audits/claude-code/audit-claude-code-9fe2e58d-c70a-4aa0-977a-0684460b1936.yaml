investigation_notes:
  - >-
    本轮任务为 local_transcripts 主题首采，delivery=pr。工作面是批次隔离候选
    candidates/claude-code，没有使用源码工作区：claude-code 未登记 git 仓库来源，
    因此不新建 git_source_file，也不把 GitHub 上的源码当作已登记来源。全部证据取自
    本轮 scan 归档的三份官方文档原件（settings.md、mcp.md、skills.md），引用记录为
    archived_document，archive_path 指向 archive/claude-code/artifact-source-*/source.md，
    sha256 由原件真实内容计算。
  - >-
    三份快照的 version_applicability 均为 unknown。正文把页面自述的版本门槛（保存
    MCP 图片结果需 v2.1.283 或以后、自动转后台需 v2.1.212 或以后）限定为页面级说明，
    未绑定到任何已安装包版本，也未写 mappings/。本轮观察到的 npm 版本 2.1.291
    属于 harness-binary 职责，未更新受管包或 npm 快照。
  - >-
    共同缺口：官方把会话存储的完整清单放在 /docs/en/claude-directory（含
    cleaned-up-automatically 与 ce-claude-json 锚点），该页未纳入本轮固定快照，
    CLI reference 与 env-vars 页同样缺失。因此 transcripts.naming、transcripts.schema、
    transcripts.archive 记为 unknown，其余七题记为 partial，并在正文逐处写明已查
    入口与剩余缺口。未把“快照里没写”写成“不支持”或“可安全删除”。
  - >-
    界面边界：只有 CLI 界面记录答案。desktop、web、vscode、jetbrains 本轮未调查，
    未手工写 not_investigated。Windows 与 Linux 的路径形态分别写明，未互相外推；
    Skills 的 .trash 与 30 天回收期限只作为该机制的证据，未推断会话文件沿用同一规则。
  - >-
    review_status 保持 pending：本次巡检中其它主题仍有遗留 pending_question_ids，
    按规则不改写它们的结论，也不写 reviewed_by/reviewed_at。

