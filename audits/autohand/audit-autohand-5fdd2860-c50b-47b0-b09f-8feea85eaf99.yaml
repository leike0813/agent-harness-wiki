- 'keybinding 相关提交经核验落在基线之外，未改变任何答案：src/keybindings/profiles.ts（sha256 844505f1…）与 src/keybindings/externalKeybindings.ts（sha256 c9c7b54d…） 在 1bec565d 与 8e62478 逐字节相同；src/config.ts 在基线已有 `ui.keybindingProfile` 的 isKeybindingProfileId 校验（基线 1584-1588 行）；docs/config-reference.md 在基线 已有 keybindingProfile 行（781 行）与「Keyboard Shortcut Profiles」小节（972 行）；AgentUIRuntime 在基线已用 resolveKeybindings + loadExternalKeybindingOverrides(config.ui.keybindingProfile) 接线。故 configuration 的 keybinding 结论维持原样，只作确认不新建来源。'
- '真正改变答案的变化有两处，均在固定范围内：（一）docs/config-reference.md 与 src/config.ts 新增并校验 ui.toolOutput、ui.defaultInteractionMode、ui.statusBar， 正式化 permissions.allowList / denyList 命名并写明弃用别名只在新键缺失时读取（源码 normalizeSettings 用 ?? 归一化），--timeout 改为「窗口结束后恢复 --yolo 之前的权限设置」，新增 --zit；（二）src/core/hookEvents.ts 新增 computer-use-start / progress / error / stop 四个第一方事件，docs/hooks.md 补齐事件表、 matcher 匹配对象与 $HOOK_* 变量表，HookManager 补 parent_tool_use_id 与 computer_use_* 环境变量与 JSON 字段。据此新建 autohand-cli-configuration-v3 与 autohand-cli-hooks-v3。'
- '明确排除（确认后不调查）：「Add keybinding profiles for the interactive composer」属 UI/composer 渲染，已确认其 src/keybindings 实现逐字节未变， 超出本轮 configuration/hooks 问题范围的部分不写入；「Offer detected agents'' shortcuts and a memories, sessions and skills import during setup」 属 setup/import 与 skills，本轮 out of scope。skills、mcp、custom_agents、custom_providers、native_plugins、local_transcripts 六主题本轮不处理。'
