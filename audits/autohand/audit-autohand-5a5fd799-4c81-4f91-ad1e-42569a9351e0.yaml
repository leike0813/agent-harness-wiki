investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:53:00.739Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - 按已发布章节引用逐条核对：8 条已发布引用的行定位在本轮提交上不再命中。受影响主题
    configuration、local_transcripts、skills，受影响小节
    config-diagnostics、config-migration、config-trust-defaults、skills-roots、transcripts-diagnostics、transcripts-export-transfer-and-retention、transcripts-lifecycle。
  - Git 来源 changed 的 118 个文件中有 8 个被章节引用，逐个比对后确认机制级变化：src/config.ts 改动配置（10
    处机制相关行）、src/permissions/PermissionManager.ts
    改动权限管理、src/session/exportSession.ts 与 src/startup/resumeCommand.ts
    改动会话导出与恢复、src/constants.ts 改动常量、docs/config-reference.md 同步更新。
  - 本轮派发入口：topic configuration、local_transcripts、skills；固定问题
    config.defaults、config.diagnostics、config.migration、skills.roots、transcripts.archive、transcripts.diagnostics、transcripts.lifecycle。
  - 结论（configuration）：`autohand-cli-configuration-v4` 已发布并成为当前选择。已核实并改写的
    mechanism：`ui.defaultInteractionMode` 默认由 `automode` 改为 `default`，auto
    模式需显式打开（docs/config-reference.md 第 777 行 + v4 的
    config-trust-defaults/config-runtime）；`features.cliUsageV2` 默认开（同上文件第 3019
    行）；`features.autohand_inference` 默认开（该文件的 features.autohand_inference 小节 +
    src/featureFlags.ts 的 isAutohandInferenceEnabled 返回 true）；`automode.maxCost`
    与 `--max-cost` 改为明确不支持（src/index.ts 第 459-461
    行隐藏并抛错，src/core/AutomodeManager.ts 的 getAutomodeOptions 对配置值抛错，/settings
    注册表移除该项）；`-c` 短选项从 `--auto-commit` 改指 `--continue`。
  - "结论（local_transcripts）：`autohand-local_transcripts-v2` 已发布并成为当前选择。`/export`
    先脱敏再落盘并打印 `Secrets redacted: N`；裸文件名改写到 `$AUTOHAND_HOME/exports/`，绝对路径或 `./`
    前缀才表示显式目标，越界相对路径抛错（src/session/exportSession.ts 的 buildSessionExport 与
    resolveExportPath，src/constants.ts 的 AUTOHAND_PATHS.exports）；根命令新增
    `-c/--continue`（当前目录最近会话）与 `-r/--resume [id]`，validateSessionOptions 增加
    `--ephemeral` 与 `--continue`/`--resume`/`--fork` 的互斥，resolveStartupSession
    在选择器取消时返回 false 使启动中止。"
  - 结论（skills）：`skills.roots` 未变，保持 `autohand-cli-skills-v1`
    不动。核对依据：src/constants.ts 的 getUserSkillLocations/getProjectSkillLocations 与
    THIRD_PARTY_PROJECT_SKILL_DIRS 内容与本轮提交一致（仅因新增 `exports` 段整体后移行号）；文档站 skills
    页本轮 hash 变化，但其 Skill discovery 表仍为同样五处路径与 `**/SKILL.md`、`*/SKILL.md`
    模式。src/constants.ts 本轮只新增 `exports` 路径，不影响 Skill 位置。
  - Triage 排除项（不再复查）：PermissionManager 的 readOnlyReview/READ_ONLY_REVIEW_TOOLS
    属于审查期权限门控，不在固定问题内；src/config.ts 的 applyCliModelOverride 属于
    config.runtime；src/feedback/sessionTranscript.ts 的脱敏计数是 exportSession
    的实现细节；src/core/AutomodeManager.ts 其余改动属 auto-mode 运行时而非配置问题。由于
    defaultInteractionMode 默认值变化，v4 的 config-runtime 小节中「默认
    automode」这一处事实已同步更正（其余 config.runtime 内容未复审、未改写）。
  - 来源冲突（记录口径，均以源码与仓库参考为准）：(a) docs/config-reference.md 的 `--auto-commit` 段落仍写
    `-c` remains the same option，与同页旗标表（`-c, --continue`）及
    src/startup/resumeCommand.ts 的注册冲突，章节内已并列说明；(b) 文档站 configuration 页
    auto-mode 表仍列 `maxCost` 默认 10，但仓库参考的 Auto-Mode 旗标表已移除该项，源码在 auto-mode
    启动时直接拒绝 `automode.maxCost`；(c) 文档站 configuration 页写
    `features.autohand_inference` 「off unless deliberately enabled」，而仓库参考写
    enabled by default、src/featureFlags.ts 也返回 true，站点该处滞后。
  - 证据落地方式：本轮新登记 10 个 git_source_file artifact 与对应 source_revision
    snapshot（src/config.ts、src/permissions/PermissionManager.ts、src/constants.ts、src/session/exportSession.ts、src/startup/resumeCommand.ts、src/index.ts、src/commands/settings.ts、src/core/AutomodeManager.ts、src/feedback/sessionTranscript.ts、docs/config-reference.md，commit
    fcd92ec12f30ea113f44ef4887ea0d8c51556331），只记 commit/file/content_sha256，未复制
    checkout。文档站 configuration/skills 页未在项目 archive 留存新原件（archive/autohand 仅有
    providers 新副本），因此本轮不新增 docs-site snapshot，相关结论一律改用同提交的仓库文档与源码引用；旧站点引用按其原
    snapshot 保留。
  - 保留的 pending_audit_refs：audit-autohand-6f377dcd-9544-4955-a7a9-b5c1daa4eb3d
    是上一轮「只观察、未派发」的待续审计，其待续入口（custom_agents/custom_providers 的
    ReactLoopRunner.ts、CheckpointAdvisor.ts、openAIEventStream.ts、docs/providers.md）不在本轮冻结范围内；本轮没有解决它，其自身文件仍是
