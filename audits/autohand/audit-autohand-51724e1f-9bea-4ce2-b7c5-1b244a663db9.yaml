  - "差异来源固定在 workspace ws-6e69ad6b9c5c-e79be25d-a211-44e2-81e7-feb55eb0e9e7（baseline 8e62478053e907977636a7a726ac0ddba2179276 → observed 6e69ad6b9c5c2d9655834d4c13a28cf5be636a18），逐个读取真实 hunk，未采信扫描器的共享影响推断。"
  - "纳入 providers.forwarding / providers.responses：docs/providers.md 的 Rate Limiting 段落改写，且运行时行为可用固定源码验证——src/providers/AutohandAIProvider.ts:212-223 的 getCapabilities 只对 grok-4.7 增加 maxTools: 128；src/providers/LLMProvider.ts:14-18 新增可选 maxTools 字段；src/core/toolFilter.ts 新增 limitToolSelection 按 tool_search/tools_registry(100)、用户消息命中类别(80)、已调用工具(70)、tool_search 发现命中(60)、Computer Use 意图(50)、always 类别(40)、当前相关工具(20) 排序截断；src/core/agent/ReactLoopRunner.ts:294-303 用 maxTools ?? 128 为云端缓存播种有界初始工具集，765-768 每轮按 provider 上限截断。已发布句子「Autohand AI 的请求/分钟限流会按其有界 Retry-After 重试，长窗口配额结束回合」未被推翻，但遗漏了输入/输出 token 吞吐限流同样在预算内重试，故按新文档与 src/providers/LLMGatewayClient.ts（本次未变更，596-628 早已把 token 吞吐按 RPM 同等处理）补齐。"
  - "configuration 主题排除：docs/config-reference.md 唯一 hunk 是环境变量表新增一行 AUTOHAND_COMPUTER_USE_GLIDE_MS（描述写 default 50，示例列 150；该表第三列是示例值而非默认值，无冲突）。运行时 computerUseCursorMotion 默认 50、范围 0-5000 由 src/computer/computerUseCursor.ts:9-15 实现，读取点在 src/mcp/McpClientManager.ts 的 managesCursor 分支。已发布 configuration 章节 config-runtime 只按「路径/凭据/运行控制」三类举例列举环境变量，从不声称穷举（同表中的 AUTOHAND_DISABLE_STATEFUL_READ 同样未被章节收录），未出现该键或该默认值，因此无需扩写；该变量属于 Computer Use 子系统，八个固定主题无对应主题，按不新造覆盖处理。"
  - "mcp 主题排除：src/core/toolFilter.ts 与 src/mcp/McpClientManager.ts 的全部改动都在 managesCursor 条件内（serverName === 'autohand-computer-use' 且 stdio 且提供 CUA_DRIVER_CURSOR_THEME_DIR 且 start_session 声明 cursor_theme），即按 session 键跟踪光标会话、start_session 注入 cursor_theme/cursor_motion、旧引擎回退 set_agent_cursor_motion、取消不污染重试、end_session 按 session 清理。传输、连接、autoConnect、工具命名与暴露路径未变；已发布 mcp 章节未陈述托管光标会话，未被推翻也无需改写。"
  - "custom_providers 中仅此两题受影响：providers.entry/auth/protocol/models/metadata/diagnostics 所述内容（provider 定义入口、凭据、apiFormat 与端点、模型目录、/model 与 doctor 诊断）对应文件本次未变更。"
  - "local_transcripts 排除：唯一引用 src/core/agent/ReactLoopRunner.ts 的记录是 ref-autohand-lt-compaction-prepares-request（ref-autohand-lt-* 系列，固定在 a248656e 版本），该 hunk 只改工具选择，未触及记录创建、压缩、导出或清理路径。"
  - "skills、hooks、native_plugins 排除：本次 25 个变更路径中没有对应加载器、hook 事件注册或插件清单的改动；三个主题的固定问题与本次差异无可追溯入口。"
  - "docs/computer-control.md、src/computer/*、.github/workflows/ci.yml、src/testing/scenarios/*、tests/* 属 Computer Use 子系统、CI 与测试夹具，不在任何已发布章节的陈述范围内，未新建覆盖。"
