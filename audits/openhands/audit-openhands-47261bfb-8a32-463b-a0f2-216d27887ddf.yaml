  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:55:28.518Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。派发入口：configuration、custom_providers、hooks、native_plugins
    四个主题的 9 道固定问题。结论：9 题答案均未变化，未新建章节
    edition、引用、快照或映射，registry/chapter-current.yaml 未改。
  - 来源身份：CLI 仓库 unchanged（0403f1a）；主仓 All-Hands-AI/OpenHands
    71427af5→9508e72（522 文件，Agent Canvas 前端/electron/测试/文档，README 仅 docker tag
    1.27.1→1.30.1，被引的 Repository boundaries 段未变，无 CLI 界面 source_ref 命中）；SDK 仓库
    95cb37b7→b3d93b6（316 文件，openhands-sdk/pyproject.toml 版本 1.57.0）；npm
    @openhands/agent-canvas 1.27.1→1.30.1（web 发行身份，CLI 章节不消费，无映射）。20 个文档来源
    changed。
  - 版本边界（本轮全部判断的基准）：已发布章节的固定来源是 CLI 954f2ba（包 openhands 1.16.0）与 SDK
    edaac806（openhands-sdk==1.28.1，ref-openhands-cli-pyproject 的 pyproject
    摘录精确写死该依赖；audit-openhands-8f8b8fd5 曾以 git ls-remote 核实 refs/tags/v1.28.1 即
    edaac806）。本轮 pinned SDK 工作区在 b3d93b6=1.57.0，不被任何固定版本映射覆盖，CLI 1.16.0 也不会加载它，故
    SDK HEAD 的机制变化按 source-level knowledge 记录、不改写章节：settings/model.py 的
    AGENT_SETTINGS_SCHEMA_VERSION 8→9 与 v8→v9 迁移加 _reject_removed_settings_input
    硬报错（settings/model.py:512、754-802）、llm/llm.py 默认 model
    gpt-5.5→gpt-5.6（llm/llm.py:285）、hooks 的 SessionStart additional_context
    改为延后到系统提示之后注入（hooks/conversation_hooks.py:341-385）、插件新增 plugin/paths.py 与
    plugin/strict_fetch.py 及 extensions/installation/manager.py 的
    _install/_load_fetched/root_name 逻辑。
  - 文档来源比对：20 页 changed 中绝大多数是 Mintlify MDX→Markdown 重渲染（<Note>/<Warning>/<Tip>
    → [!NOTE]/[!WARNING]/[!TIP] 引用块、<Steps>/<Tabs>/<CardGroup>/<Accordion> →
    标题与引用卡片、`LLM\_API\_KEY` → `LLM_API_KEY`、模板代码块展开、export const
    path_to_script_* 移除），逐节归一化比对后语义一致；本轮只发现 4 处真实语义变化：(1)
    docs/environment-variables 改标题为「Archived Environment Variables
    Reference」并加警告：该页为原 Python monorepo 汇集、不再是对当前 Canvas/SDK 发行的完整或已核实参考，并移除
    Canvas Docker 会话运行时变量表改为指向 Canvas Development；(2) docs/custom-llm-configs
    改标题为「Legacy Custom LLM Configurations」并加同类警告，指向 Canvas LLM Profiles 与 SDK
    LLM Profile Store；(3) docs/hooks Quick Start 重写：hooks.json
    位于会话工作目录本身、OpenHands 不向上搜索父目录，并补 Claude Code 兼容差异（文件位置与工具名）；(4)
    overview/plugins 的 MCP 示例由 uvx mcp-server-github 换成 docker
    ghcr.io/github-mcp-server（示例级改动）。
  - 逐题证据（全部保持 answered/partial 原状态）：config.defaults — SDK 默认值取自固定快照
    edaac806，Windows→WSL 要求在新 cli-installation 页仍以 NOTE 保留，未变。config.migration —
