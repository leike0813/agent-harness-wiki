investigation_notes:
  - >-
    本轮由 harness-maintenance worker 以 delivery=pr 完成 openhands 的 local_transcripts
    首次采写，只调查 catalog 中登记的 cli 界面；同产品的 web 界面未取证，查询会派生
    not_investigated。既有七章与既有 reference 未改动。
  - >-
    固定来源：source-openhands-cli-repo，只读 pinned 工作区 commit
    954f2ba646e8d749261a8f2b2b7e3031fa39be9f（coordinator 打开，本 worker 未新建或释放），
    取用时间 2026-10-06T04:34:35.768Z。新增 21 条 git_source_file 证据，绑定 15 个按文件区分的
    snapshot（每个 artifact 只对应一个源码文件），另加 3 条引用既有文档快照
    snapshot-openhands-docs-cli-commands 的 source_reference；未新建 archived_document，
    三个文档 excerpt 均在 archive/openhands/artifact-openhands-docs-cli-commands/raw.md
    中逐字命中，raw_sha256 与既有 artifact 一致。无孤儿 artifact 与孤儿 snapshot。
  - >-
    结论边界：commit 只代表源码树，未写任何 mappings/；路径形态在 Linux 上取证，Windows 与
    macOS 未验证；未把 CLI 结论外推到 web 界面。文档快照 version_applicability 为 unknown，
    只用于佐证用户可见入口与默认路径。
  - >-
    关键机制结论：会话记录是文件而不是数据库——<状态目录>/conversations/<32 位 hex 会话 ID>/
    下每个事件一个 UTF-8 JSON 文件（event-<5 位序号>-<后缀>.json，CLI 只见到 event-*.json 与
    首个 event-00000-*.json），外加 SDK 常量 BASE_STATE 命名的 base_state.json；路径由
    locations.py 的 OPENHANDS_PERSISTENCE_DIR / OPENHANDS_CONVERSATIONS_DIR 决定，官方
    命令参考页把 ~/.openhands/conversations/ 列为 Conversation history。会话元数据是读取时
    从事件文件派生的，没有独立索引文件，因此备份只需复制会话目录。
  - >-
    本机记录与运行时会话状态已明确区分：智能体执行动作的工作区由 Workspace(working_dir)
    绑定（默认当前目录，可由 OPENHANDS_WORK_DIR 覆盖），openhands cloud 的会话由服务端持有
    并只回浏览器链接，CloudStore 每个方法仍 raise NotImplementedError，都不算本机 transcript。
  - >-
    十题状态：location、naming、diagnostics 为 answered；scope、format、schema、lifecycle、
    database、archive、cleanup 为 partial。partial 的原因分别是：事件类型与字段由
    openhands-sdk 的 Event 联合类型定义而本轮未固定 SDK 源码，写入、刷盘、分片与压缩策略同样
    在 SDK 侧；事件文件名 <后缀> 的生成规则与 base_state.json 除 agent.tools 外的字段未取证；
    关闭与刷盘、分支与父子会话关系、交给子代理后的落盘归属未取证；恢复必需件（events 目录与
    base_state.json）已定位，但“能否重建”只能从“无重建路径”推断，未正面取证；没有原生归档、
    导出或保留策略；没有官方删除命令或 API。
  - >-
    明确未覆盖并已查入口：缓存目录、日志与遥测文件按主题边界不逐项审计；删除与保留机制方面已查
    argparsers/ 全部子命令、conversations/ 与 stores/ 模块，命中 unlink() 的只有认证 token 文件与
    输入框临时文件。正文照实写明“没找到官方删除机制不等于可以安全直接删”，并给出删目录、删
    events 子目录、删单个事件文件三种情形的可观察后果。
