investigation_notes:
  - |-
    本轮 triage：source-openhands-npm（1.26.0 → 1.27.0，integrity 随版本同步变化）为
    reviewed_no_knowledge_impact。发行身份正常前进，本轮未固定也未比较发行包字节，不据此改写
    任何章节，也不新建版本映射；1.27.0 的发行包行为仍未验证。
  - |-
    source-openhands-cli-repo 与 20 个官方文档源本轮全部 unchanged：CLI 侧八个主题的固定证据
    （OpenHands-CLI@954f2ba、各文档快照）未移动，章节结论对基线稳定。
  - |-
    引用交叉核对（自行复核，未采信 scan 的 impacts）：references 下 239 条引用共命中 72 个不同
    locator.file（kind: file_lines），与本轮 307 + 24 条 changed paths 的交集只有三个文件——
    All-Hands-AI/OpenHands 的 README.md、package.json，以及 software-agent-sdk 的
    tests/sdk/mcp/test_create_mcp_tool.py。逐个读实际 hunk 后三者都不产生章节影响，理由见下三条。
  - |-
    README.md：唯一 hunk 是第 97-100 行 docker 镜像 tag 由 ghcr.io/openhands/agent-canvas:1.26.0
    改为 1.27.0。章节使用的定位是 README 的 “Repository boundaries” 段（20-45 行区间），
    该区间逐字未变；同文件上未被任何当前章节引用的 ref-openhands-canvas-readme 同样不受影响。
  - |-
    package.json：version 1.26.0 → 1.27.0，以及 @openhands/extensions 0.29.0 → 0.30.0、新增
    ws / @tailwindcss/node / @types/ws、@shadcn/lint 0.2.0 → 0.2.1。引用它的
    ref-openhands-canvas-package 不被任何当前章节使用；依赖 churn 不改变 CLI 界面的字段、默认、
    加载顺序或路径，且本轮不写 mappings。
  - |-
    tests/sdk/mcp/test_create_mcp_tool.py（被 mcp.exposure 的 ref-openhands-sdk-mcp-namespacing
    以 210-245 行引用）：新增 test_mcp_tool_reconnects_after_http_error（第 776 行起）并在文件头
    增加 3 行 import，使被引区间在 e3a2682 下整体下移 3 行（现为 213-248 行）。被引的多 server
    “server 名_工具名”前缀断言逐字未变，且该引用固定在 snapshot-openhands-sdk-repo（提交
    edaac806），excerpt 与其 pinned 快照一致，因此不改引用、不改章节正文。
  - |-
    MCP 客户端机制（openhands-sdk/openhands/sdk/mcp/client.py，本轮唯一有语义的 MCP 改动）：
    connect() 新增“若 session_task 已结束则先 _reset_session_state(full=True) 再连接”的恢复逻辑，
    对应测试断言首次 tools/call 收到 504 报错、第二次调用成功。章节 mcp.lifecycle 的固定来源是
    CLI 依赖的 openhands-sdk==1.28.1（提交 edaac806），本轮观察到的 e3a2682 不在任何固定版本映射
    覆盖范围内；源码 HEAD 不能证明已发行包行为，故只在审计记录，不改章节、不建映射。待把包含该
    改动的发行版固定进 mappings 后，再评估 mcp.lifecycle 是否需要修订。
  - |-
    agent_server 组（config.py 新增 field_validator 丢弃空 session_api_keys；init_router.py 对含空
    key 的初始化请求返回 422；sockets.py 拒绝空字符串凭据；canvas_extensions/backend.py 调整画端扩展
    后端的进程组回收）：72 个被引文件中没有一个来自 openhands-agent-server，章节没有任何 source_ref
    指向 agent_server；hooks 章节关于 SESSION_API_KEY 被剥离的表述来自
    openhands-sdk/openhands/sdk/hooks/executor.py（未变）。configuration 与 hooks 均无影响。
  - |-
    LLM 组（llm/auth/openai.py 的 OPENAI_CODEX_MODELS 增补 gpt-6.1-sol / gpt-6-sol / gpt-6-luna；
    llm/utils/model_features.py 的 PROMPT_CACHE_MODELS 增补 claude-haiku-5-5；llm/utils/telemetry.py
    在记录请求前复制并脱敏 kwargs、错误 message/repr/traceback 改走 redact_text_secrets；
    utils/redact.py 把敏感条目正则扩展到双引号、反斜杠转义与带连字符的 authorization / x-api-key）：
    custom_providers 现有表述是“提示缓存仅在能力表支持时下发”“两条端点路径”“api_key 属于密钥字段
    集合”，没有任何一处枚举上述模型清单，也没有断言遥测日志的字段内容；grep 全部八章无 telemetry /
    遥测 相关断言；sdk/hooks、sdk/context、sdk/conversation 下不存在 redact 调用点。custom_providers
    与 hooks 均无影响。
  - |-
    tools 组（terminal/constants.py 新增 MIN_POLL_INTERVAL = 0.02，terminal_session.py 相应调整
    轮询）：八个主题都不覆盖终端输出轮询，章节无相关 source_ref，无影响。
  - |-
    .agents/skills/**（23 个文件，含 verify-openhands 及其 feature-map、frontend-development、
    frontend-api-contracts）：这是 All-Hands-AI/OpenHands 仓库内部用于验证自身 UI 的开发技能，
    不是 harness 的 skill 机制。skills 章节引用的加载器文件（sdk/skills/*.py、subagent/*、
    plugin/*）全部未变，`.agents/skills/` 路径结论来自 sdk/skills/utils.py 与 locations.py（未变），
    故 skills 无影响。
  - |-
    其余主仓路径一律 reviewed_no_impact：.pr/bugs/**（14）、.pr/map-maintenance/**（47）、
    __tests__/** 与 tests/**、.github/**、src/**（React 组件、hooks、routes、i18n、主题）、
    electron/**、scripts/**、helm/**、docs/**、package-lock.json、AGENTS.md、.env.sample、
