  - 本轮 triage 分类：reviewed_no_impact（skills 与 custom_agents 两个已派发主题）
  - 前提更正：协调者最初把 root 越界拦截、resolves_within、AgentProfile schema
    版本与迁移记为本轮变化，worker 在固定工作区回源后证伪——这些行为在本轮基线
    6f8c38d 已与 HEAD 250dd481 完全一致，不属于本轮 diff。
  - skills 相关引用行区间无本轮漂移：find_skill_md_directories 472/472、find_regular_md_files
    496/496、find_third_party_files 338/338、get_skills_cache_dir 578/578、RESOURCE_DIRECTORIES
    131/131，本轮唯一移动的是 _list_resource_files 656→659。
  - openhands-cli-skills-v1 中记录的符号链接缺口是相对固定快照 edaac806（SDK
    1.28.1，章节声明的 CLI 1.16.0 依赖版本）成立的；1.53.0 主干已具备 root 拦截属于固定来源与
    上游主干之间的版本差，不是本轮固定来源的漂移。
  - 未决：按固定快照核验 1.28.1 侧是否确实缺少 root 拦截需要为该发布提交另开 release
    pinned 工作区；固定提交 edaac806 不在本轮浅克隆内，本工作树也无 archive/openhands/git/，
    因此本轮不改写该缺口陈述，也不为 1.53.0 主干新建并列快照。
  - openhands-sdk/openhands/sdk/profiles/agent_profile.py 的 AGENT_PROFILE_SCHEMA_VERSION
    与 v1→v2→v3 迁移同样已存在于基线，当前无已登记引用指向该文件；作为可采写面留待
    下一次以固定来源采写，不在本轮处理。
  - hooks/config.py 变更未改变对外语义：事件集合、加载优先级与 HookDefinition 字段逐字未变。
  - agent_server 侧存储与 docker_runtime 变化无已登记引用指向；local_transcripts 章节固定在
    OpenHands-CLI 仓，不受 SDK 变更影响。
