investigation_notes:
  - |-
    本轮 worker 完成 narrow_investigation 范围内的 skills 与 configuration 五个固定问题
    （skills.conditions / skills.loading / skills.invocation / config.trust / config.sources）的逐项判定，
    结论为已发布答案均不改变，因此不新建章节版本。impacts 由 coordinator 写入的八条通用
    "shared or unknown impact" 收窄为空，pending_question_ids 清空；收窄依据见下列各条。
  - |-
    引用交叉核对（自行复核，未采信 scan 的 impacts）：本候选 knowledge/openhands/references 下
    全部引用的 locator.file 共命中 72 个不同文件（均 kind: file_lines）。与本轮
    295（主仓）+ 85（SDK）条 changed paths 的交集只有三个文件：
    主仓 README.md、主仓 package.json、openhands-sdk/openhands/sdk/settings/model.py。
    skills 与 configuration 两章合计 41+46 条引用的 locator.file 去重后为
    {openhands-sdk/openhands/sdk/context/agent_context.py,
     openhands-sdk/openhands/sdk/context/prompts/templates/system_message_suffix.j2,
     openhands-sdk/openhands/sdk/skills/skill.py, openhands-sdk/openhands/sdk/skills/utils.py,
     openhands-sdk/openhands/sdk/settings/model.py, openhands-sdk/openhands/sdk/hooks/executor.py,
     openhands-sdk/openhands/sdk/llm/llm.py, openhands-sdk/openhands/sdk/llm/llm_profile_store.py,
     openhands_cli/..., pyproject.toml, src/utils/skill-scope.ts}，
    与两仓 changed paths 的交集只有 settings/model.py。
  - |-
    settings/model.py（唯一被引文件落在 SDK 改动集内）：两个 hunk 分别是第 39 行
    `from openhands.sdk.conversation.message_request import SendMessageRequest`（SendMessageRequest
    从 conversation/request.py 拆到新文件 message_request.py，属纯重构）与第 1260 行
    `for name in ("agent", "agent_settings", "agent_profile_id", "agent_profile")`
    （StartConversationRequest 互斥 agent 来源新增内联 agent_profile）。逐行比对
    e3a26821f8f7 与 27308a4b3f23 的 549-560、684-712、938-1010 三段（分别被
    ref-openhands-sdk-settings-version、-migrations、-agent 引用）逐字相同、行号未移位，
    故三条引用不改、config.sources 与 config.runtime 的现有表述不受影响。
  - |-
    SDK 提交的决定性问题（本轮唯一有语义的机制新增，判定为不影响已发布答案）：
    "feat(agent-server): accept additional skills when launching an agent" 引入第四条 Skill 供给通道
    `AgentLaunchAdditions.skills`。逐项证据：
    (1) 入口 = StartConversationRequest 的 `agent_launch_additions` 字段
        （openhands-sdk/openhands/sdk/conversation/request.py:204-210），
        字段体 `skills: list[Skill] | None` 定义于同文件 82-95 行，描述自述用途是
        "Deployment-supplied skills merged into the resolved agent's context … an
        `agent_profile_id` launch sends no `agent_settings`, leaving it no other way to supply them"。
    (2) 形状 = 已解析的 `Skill` 对象列表，不是路径或名字；随请求体传入，
        `AgentLaunchAdditions.model_config = ConfigDict(extra="forbid")`（同文件 72 行）。
    (3) 生效时机 = 启动期，在 `finalize()` 内于 `settings.create_agent()`（finalize.py:83）之后、
        系统提示后缀追加之后、`_apply_acp_skill_sourcing` 之前调用
        `_with_launch_skills`（finalize.py:98-99、200-217）；唯一非 agent-server 调用方
        `openhands-sdk/openhands/sdk/launch/preview.py:73` 不传 additions，
        agent-server 侧由 conversation_service.py:1565-1579 传入
        `additions=request.agent_launch_additions`；因此只在会话启动时解析一次，
        运行期不重解析，与已发布的"扫描只在构造 Agent 上下文时进行一次"一致。
    (4) 扩展而非覆盖：`_with_launch_skills` 以
        `taken = {skill.name for skill in context.skills} | set(context.disabled_skills)` 为准，
        只追加不在 taken 中的项（finalize.py:203-208），已存在的同名 Skill 与 profile 的
        disabled_skills 拒绝名单都胜出；这与已发布的
        "显式传入的 Skills 不会被自动加载项覆盖" 方向一致，不是新语义。
    (5) 信任/准入门控 = 只有上述按名去重与 disabled_skills 拒绝名单，没有额外的准入、
        审批或来源校验；同一提交新增的 `llm_profile_ref` 覆盖只在有
        agent_profile_id/agent_profile 时合法（request.py:405-410 校验、
        launch.py:138-145 分支、resolve.py 的 llm_ref 覆盖），与 skills 通道互不影响。
    (6) 结论不改变已发布答案的版本边界证据：skills 章节的固定来源是 CLI 954f2ba6 +
      SDK edaac806（openhands-sdk 1.28.1），而本轮 SDK 提交的 pyproject 版本为 1.54.0
      （openhands-sdk/pyproject.toml:3，e3a26821f8f7 与 27308a4b3f23 同为 1.54.0，未变）。
      该机制位于 agent-server / SDK launch 路径，skills 与 configuration 两章没有任何
      source_ref 指向 agent_server、sdk/launch 或 conversation/request.py；
      CLI 侧仍由 openhands_cli/stores/agent_store.py 的 `_build_agent_context()` 直接构造
      AgentContext（ref-openhands-cli-skills-context，CLI 仓库本轮 unchanged）。
      按"源码 HEAD 不能证明已发行包行为、不从源码 HEAD 写版本映射"的既有纪律，
      本轮只记录为源码级知识，不改章节、不建映射；待把含该机制的发行版固定进 mappings/
      后再评估是否需要新章节版本。
  - |-
    skills.conditions / skills.loading / skills.invocation 逐项判定（均 unaffected）：
    本章 skills-* 小节的全部证据文件（agent_context.py、skills/skill.py、skills/utils.py、
    system_message_suffix.j2、locations.py、agent_store.py、tui/content/resources.py、
    tui/core/commands.py、CLI pyproject.toml、src/utils/skill-scope.ts）在 SDK 提交
    e3a26821f8f7→27308a4b3f23 的 85 条路径中一个都没变
    （`git diff --stat -- openhands-sdk/openhands/sdk/skills/ openhands-sdk/openhands/sdk/context/`
    输出为空）；新增的 skills 字段在 finalize.py 内被 `_with_launch_skills` 消费，
    与 skill 发现、解析、分区（available_skills / REPO_CONTEXT）、
    自动加载开关 load_user_skills / load_public_skills 均无交集。
    主仓侧的 src/utils/skill-scope.ts 亦不在 295 条 changed paths 内。
    故三题维持已发布答案与既有状态（conditions answered、loading answered、invocation partial）。
  - |-
    config.trust 判定（unaffected，但主仓确实新增了一条人机准入门控，单独记录）：
    主仓 da4c7564 "feat(secrets): let the agent request a secret through an in-conversation modal"
    新增四个文件：src/api/request-secret-client-tool.ts（客户端自定义工具 `request_secret`，
    JSON schema 要求 name + reason，additionalProperties: false，见 25-52 行）、
    src/constants/secret-request.ts（工具名与结果前缀 "[secret-request] "）、
    src/services/secret-request.ts（handleRequestSecretAction 第 42-68 行：
    按 conversationId+toolCallId 用 claimClientToolCall 去重，已存在的同名 secret 直接挂载、
    否则入队弹窗；completeSecretRequest 第 105-127 行只回报 saved / not_saved / error 三态，
    明确 "It never carries the value"，且指引要求用户不要把密钥粘进聊天）、
    src/stores/secret-request-store.ts（待处理请求持久化到 localStorage，刷新后可重开）。
    这是 Agent Canvas（web 界面）新增的一条"用户确认后才提供密钥"门控，与模型权限确认策略无关；
    已发布的 config-trust 只回答 surface_id=cli 且明确"CLI 没有'项目信任'概念"
    （源 refs 全为 OpenHands-CLI 文件与 SDK hooks/executor.py），catalog 中 web 界面
    binding 状态为 unknown 且本轮无 web 章节，因此不构成对已发布 config.trust 的推翻，
    按"不越过固定来源与界面范围"处理，不改章节。SDK 侧同一提交的
    openhands-agent-server/openhands/agent_server/config.py（空 secret_key 视为未设置、
    记录 _secret_key_was_blank，73/502/513-534 行）与 init_router.py
    （含空 key 的初始化请求不再覆盖默认；check_init_api_key 在"配置过空 key 且无可用 key"时
    fail-closed 返回 401，179 与 357 行）同样属于 agent-server 的会话鉴权配置，
    既不被任何章节 source_ref 引用，也不在 CLI 的固定来源内，记录不改章节。
  - |-
