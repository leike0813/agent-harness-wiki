investigation_notes:
  - 版本边界（本轮决定性判断）：7 个已发布章节只回答 surface_id=cli，来源范围声明为 CLI 仓库 954f2ba6（openhands
    1.16.0）与 SDK edaac806。CLI 仓库本轮 unchanged，pyproject.toml 仍以
    openhands-sdk==1.28.1 精确固定依赖；git ls-remote 核实 refs/tags/v1.28.1 正指向
    edaac806，pyproject 版本亦为 1.28.1。SDK 主分支观察值 08af1d5a 的 pyproject 版本为 1.51.0。因此
    SDK 上游推进不构成 cli 界面的章节变化，本轮不改写任何已发布正文。
  - 已发布证据基线复核通过：92 条官方文档引用摘录在本轮 21 个重新抓取的文档候选中逐条原样存在（0 条失配），全部 document_section
    定位标题仍存在；38 个被引 SDK 文件在绑定快照 edaac806 中全部存在（0 缺失）；作为旁证的 Canvas 侧
    src/utils/skill-scope.ts 与 README.md 在 1ec86616→a6bba78f 区间未被改动，摘录仍成立。
  - 上游 SDK 差异规模（树对比，1165 文件 / +217468 / -18469；Python 包内 221 文件 / +27200 /
    -4724）：被 77 条引用覆盖的 38 个 SDK 文件中有 35
    个在上游发生变化。context/prompts/templates/system_message_suffix.j2（skills.loading
    引用的系统提示拼装模板）与 context/skills/__init__.py 在上游被删除；新增
    PathTrigger、plugin/format/、mcp/config.py、mcp/oauth.py、profiles/、subagent/scope.py。这些均不属于
    CLI 固定的 1.28.1，故不进入已发布知识。
  - 官方文档漂移：21 个文档页 hash 全部变化，内容已转向 1.51.0 及更新版本的 SDK/Canvas 行为（典型为 skills-path
    页的 path-triggered rules 与 <EXTRA_INFO> 注入描述）。文档快照 version_applicability 为
    unknown，按规则不参与精确版本验证；已发布正文继续以固定源码为准，与文档的差异在 v1 中已按版本差别并列写出。
  - npm 来源 source-openhands-npm 登记的是 @openhands/agent-canvas（Canvas Web 产品，非 cli
    界面），本轮首次记录版本观察值 1.24.0（此前无 baseline）。按规则 npm 版本观察本身不构成章节变化，也不据此制造源码到包的版本映射。
  - "留给维护者的范围观察（不阻塞本轮，未改动任何已发布记录）：21 个官方文档快照均登记 surface: cli，但该文档站越来越多描述
    Canvas/SDK 界面而非 CLI。是否调整这些快照的界面归属、或为 Canvas
    界面单独立章，需要维护者决定，本轮不单方面改写已发布的来源归属。"
  - 方法学限制：SDK 与 Canvas 工作区为浅克隆，git diff 的树对比结论有效，但 rev-list 计数与 --is-ancestor
    等祖先关系不可靠，因此本审计不记录提交条数或标签与 HEAD 的祖先关系断言；v1.51.0 标签指向 a955aa5，与观察到的 HEAD
    08af1d5a 的关系未予认定。
