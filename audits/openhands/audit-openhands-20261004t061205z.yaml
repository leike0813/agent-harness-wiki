investigation_notes:
  - 本轮协调者语义 triage 结论：narrow_investigation。已交回隔离候选做定向维护，仅 mcp 与 custom_agents 两个主题的固定问题。
  - openhands SDK 仓库由 08af1d5a 前进到 b347047e，提交为 uvicorn 依赖升级；文档侧 source-openhands-docs-agents、-custom-llm、-env-vars 三份哈希变化。
  - openhands 七章当前均为 v1 且证据较薄，本轮只交回最小入口，不发起全主题重审。
  - 更正协调者的前提：conversation_router.py 并非新增文件，它在基线 08af1d5a 已存在（864 行）。本轮该文件的 +74 行只给
    POST /conversations 增加四个 X-OpenHands-Observability-* 请求头（span name、tags、metadata、parent span context）并经
    _request_with_observability_headers 映射进 StartConversationRequest；openai/router.py 同样只多接一个 parent span context 头。
    api.py 的 +20/-27 是 _cleanup_stale_tmux_sessions 改写，与会话端点无关。语义判断因此从"新增对外能力面"改为"既有 HTTP 路由的
    可观测性请求头扩展"。
  - mcp 结论：八个固定问题答案不变，不新建版本。08af1d5a..b347047e 共 37 个变化路径中没有任何 MCP 相关代码，对全量 diff 检索
    mcp/fastmcp/list_tools/stdio/oauth/RemoteMCPServer/StdioMCPServer 的新增行命中为 0；openhands-sdk/openhands/sdk/mcp/ 整个目录
    未被改动；承载 mcp.json 解析、--transport 校验、list_enabled_servers 与 ACP 转发的 CLI 仓库 OpenHands/OpenHands-CLI@954f2ba
    本轮 unchanged；两个 MCP 文档来源 source-openhands-docs-cli-mcp 与 source-openhands-docs-mcp-settings 本轮也 unchanged。
    章节的 MCP 答案由 CLI 仓库与 sdk/mcp 承载，SDK 仓库 HEAD 前进不能证明这些答案变化。
  - custom_agents 结论：七个固定问题的答案与状态均不变，只修正一处引用边界。openhands-sdk/openhands/sdk/agents/、skills/、
    plugins/ 目录未被改动，Agent 定义加载、注册表与 TaskToolSet 委派机制无变化；新增的 sdk/automation/__init__.py（+215）只是
    automation_conversation_kwargs、automation_observability_headers 等可观测性标签与请求头辅助函数，不涉及 Agent 定义语义。
  - custom_agents 唯一改动：source-openhands-docs-agents 页面由《Main Agent and Capabilities》改标为《Legacy CodeAct Agent》，
    新增"Archived documentation for the former OpenHands Python monorepo"横幅并把当前 Agent 架构指向 /sdk/arch/agent。已归档本轮
    原件 archive/openhands/artifact-openhands-docs-agents-20261004/raw.md，raw_sha256 5bb5fa776a7b351366dd547c0e58631892608b67404b96937db940a1a0edc208
    与扫描器 observed 逐字一致（该页无行尾换行，与上一版原件同）。与上一版原件逐行比对，被章节引用的 "### Description" 正文字节未变，
    差异只有标题与新增横幅。章节 v1 原本把该页当作现行主代理的描述来源，现改为在 agents-scope 与 agents-roles 标注其归档身份，
    并新增 ref-openhands-docs-agent-legacy 承载该横幅；agents.roles 仍为 answered，主张继续由 CLI 与 SDK 源码引用支撑。
  - 跨主题观察（不在本轮交回范围，未改动）：source-openhands-docs-custom-llm 与 source-openhands-docs-env-vars 属同一次上游
    "归档标注"批次。custom-llm 页面只有标题改为《Legacy Custom LLM Configurations》与新增归档横幅，TOML llm.* 命名配置正文未变，
    但 custom_providers 章节引用的 ref-openhands-docs-customllm-how、ref-openhands-docs-customllm-using 正来自该页；env-vars 页面除
    归档横幅外还把 OH_CONVERSATION_* 表格压缩为指向 Canvas Development 的指针，涉及 configuration 与 custom_providers 章节引用的
    ref-openhands-docs-env-core/-deprecated/-llm/-naming。建议协调者按同一边界处理这两个主题。
  - 本轮未做版本映射：SDK 仓库 HEAD（b347047e）只代表源码树，openhands-sdk==1.28.1 固定提交 edaac806 未变，章节继续按
    source-level knowledge 记录，version_applicability 保持 unknown。
  - 本轮新建 openhands-cli-custom_agents-v2 并把 chapter-current 的 custom_agents 指向 v2，v1 保留可查；mcp 章节维持 v1 未改。
    未执行发布、未切发布指针、未触碰受管二进制。
