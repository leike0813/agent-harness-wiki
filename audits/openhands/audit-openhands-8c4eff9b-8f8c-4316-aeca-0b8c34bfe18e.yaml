  - 对照口径：21 个 changed 官方文档来源都能找到 retained 原件——18 个用与本次 baseline 同
    hash、2026-10-04 轮次保存的扫描副本；docs-agents 用 2026-10-04T06:14Z 的保留原件
    5bb5fa77（artifact-openhands-docs-agents-20261004），docs-custom-llm 与
    docs-env-vars 的 baseline 副本未保留，改用 2026-10-04 保存的副本 4423acea/ea2844c1。按
    Mintlify/HTML 标记 归一化（去 script/style 与标签、解实体、去空行、绝对化文档链接还原为根相对、`\_` 还原） 后逐行
    diff；因此可验证窗口为 2026-10-04T06:14Z → 2026-11-24T14:03Z。2026-09-30 快照窗口
    没有保留原件，未对其作知识变化断言。
  - hooks：真实语义变化，发布 openhands-cli-hooks-v2。(a) 新增 Hooks Bundled in Plugins：插件
    `hooks/hooks.json`、Agent Plugins 包 `dev.openhands/hooks/hooks.json`，插件 hook
    收到 `PLUGIN_ROOT` 且根绑定到该会话加载的插件修订；(b) hooks.json 位置限定为会话工作目录、 宿主不搜索父目录；(c)
    文档适用界面改为 Agent Canvas/OpenHands Cloud/OpenHands Enterprise， 移除 CLI 选项卡与
    `/skills` 入口。已更新 hooks-entry/input/conditions/diagnostics，并用 5 条 新引用固定到
    observed hash 2f549b98…（checked_at 2026-11-24T14:03:08.245Z）。`PLUGIN_ROOT`
    未在固定 SDK 1.28.1 快照验证，正文标为文档级信息；hooks.events/output/order 无变化。
  - custom_agents：真实语义变化，发布 openhands-cli-custom_agents-v3。task-tool-set 页说明单次
    任务调用仍阻塞，但独立任务调用可由父代理的 `tool_concurrency_limit` 并行；示例明确使用 TaskToolSet 并称
    DelegateTool 已退役。原 agents.limits 写“任务工具一次只跑一个”，与同段后文 “工具并发由
    tool_concurrency_limit 控制”矛盾，已改为“单次调用阻塞、并发由 tool_concurrency_limit 控制”，引用固定在
    526f76d0…（14:03:09.593Z）。agents.entry/format/ roles/invocation
    仅有格式与链接变化，答案不变。
  - native_plugins：语义变化限于安装入口描述，发布 openhands-cli-native_plugins-v2。plugins 页 删除
    `config.toml [plugins] sources` 与 `openhands --plugin`，改为 Agent
    Canvas/SDK/Cloud 三种用法；本地目录为 `~/.agents/plugins` 或
    `~/.openhands/plugins`（Agent Canvas 作为只读 `Local` 插件发现）或交给 SDK
    `PluginSource`。这与固定 CLI 源码无插件命令的结论一致。 plugins.install 与 plugins.diagnostics
    的“文档给出 CLI 入口”表述已更正，引用固定在
    81481fa2…（14:03:08.639Z）；model/package/discovery/api/lifecycle 机制结论不变。
  - configuration：真实语义变化，发布 openhands-cli-configuration-v2。(a) 环境变量页被上游归档为 前
    Python 单体仓库参考，明确“不是现行 Canvas/SDK 的完整或已验证参考”；config.runtime 删除
    “完整清单位于官方参考页”的表述，config.migration 增加归档提示。(b) 安装页 First Run 改为
    `agent_settings.json` 并列出
    `cli_config.json`、`mcp.json`，与固定源码一致；config.sources 删除旧的 settings.json
    命名差异说明。新引用固定在 994068f5…（14:03:07.609Z）与 e391ce62…
    （14:03:07.979Z）。config.defaults/diagnostics 的结论仍由源码与未变页面支撑。
  - custom_providers：6 道 pending
