investigation_notes:
  - "复核范围：本轮 changed 来源为 source-factory-droid-docs-models 与
    source-factory-droid-docs-org-control。两者新抓取的候选原件中，10 条被引用的
    短摘录（ref-fd-org-levels、ref-fd-org-precedence、ref-fd-org-merge、ref-fd-org-perm-rules、
    ref-fd-org-system-file、ref-fd-org-manage-rules、ref-fd-org-models、ref-fd-org-mcp、
    ref-fd-org-plugins、ref-fd-models-custom）逐行比对全部命中，缺失行数为 0。"
  - "config.sources / config.overrides / config.trust：对照新原件复核层级表、7 级构建顺序、
    硬控制与会话默认两套方向相反的优先级、四种合并模式、permissionRules 的 ID 解析与
    信任要求、系统级 settings.json 三个平台路径、Enterprise Controls 编辑步骤，均与
    factory-droid-cli-configuration-v1 正文一致，无需改写。"
  - "mcp.capabilities / mcp.exposure：mcpPolicy 默认不启用、启用后须命中 allowlist、
    空或缺省 allowlist 阻断全部 server、无 MCP blocklist，与
    factory-droid-cli-mcp-v1 的 mcp-exposure 一致。"
  - "plugins.install / plugins.discovery：enabledPlugins 启动时自动安装、
    strictEnabledPlugins 穷尽式允许清单、extraKnownMarketplaces 的 source 形态与
    strictKnownMarketplaces 上限语义，与 factory-droid-cli-native_plugins-v1 一致。"
  - "providers.models / providers.metadata：models.md 本轮变化是原生模型目录（模型 ID、
    倍率、可用 reasoning 档位），章节引用的默认值仍然成立（Claude Opus 4.8 默认 high、
    Claude Sonnet 4.5 默认 off，示例 ID claude-opus-4-7 仍在目录内）；org 托管自定义
    模型额外字段 maxContextLimit / enableThinking / thinkingMaxTokens 仍在 schema 内。
    章节不枚举原生模型目录，故无需改写。"
  - "未解决分歧（providers.entry / providers.auth，保持 pending）：已发布的
    factory-droid-cli-custom_providers-v1 写明组织托管自定义模型「新模型不允许使用静态
    apiKey，已存在的静态密钥模型仍可用并可轮换」；当前固定来源
    source-factory-droid-docs-org-control 的 Models and BYOK 中 apiKey 字段写的是
    「Static API keys are blocked for org-managed models. The managed-settings endpoint
    rejects any custom model with a static apiKey value」，没有任何豁免或轮换说明，
    references/ 中也没有支撑该豁免的短摘录。属于新来源与已发布配置约束相抵触，
    需独立复核后再决定改写或保留，本轮不改写正文。"
  - "证据边界：这两个来源的基线原件在本轮之前的 archive 清理中已不存在
    （archive/factory-droid/artifact-factory-droid-docs-models/raw.md 与
    artifact-factory-droid-docs-org-control/raw.md 均缺失），无法做逐字节 diff。
    上述判断来自对新候选原件的逐条主张复核，不能断言文档本轮具体改了哪几行。"
  - "下一轮线索：org 托管 schema 的 provider 取值包含 anthropic、openai、
    generic-chat-completion-api 之外的 bedrock-converse、factory、google、xai、voyage，
    而章节的 provider 取值表来自 BYOK 页（用户设置路径）。本轮该问题不在影响集内，
    未改写，后续可核实两条路径的适用边界。"
  - "source-factory-droid-npm 观察到 0.233.0（integrity 已记录）。按契约，npm 版本变化
    本身不构成章节变化或源码到包映射；delivery=pr 不做受管二进制核对。"
  - "未取得 Git 源码工作区：source-factory-droid-repo 观察身份与基线一致，无需打开受管
    工作区，本轮没有 sources:workspace 需要关闭。"
