investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:55:32.042Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - Git 来源 changed 的 430 个文件中有 13
    个被章节引用，逐个比对后确认机制级变化：packages/coding-agent/schemas/models.schema.json 改动模型
    schema（46 处机制相关行）、packages/ai/src/providers/compat-schema.ts 改动兼容层
    schema、packages/coding-agent/docs/custom-provider.md 改动自定义 Provider
    文档、packages/ai/src/types.ts 改动类型定义。
  - 自定义 Provider 的模型清单、元数据与协议映射是本章已发布答案的直接来源，属跨主题的模型元数据机制变化。
  - 本轮派发入口：topic custom_providers；固定问题
    providers.entry、providers.models、providers.metadata、providers.protocol、providers.forwarding。
  - providers.entry：文档新增“重定向既有 provider”与“注册兼容端点”两种最小写法，models.json 只改内置
    provider 的 baseUrl 会保留模型与鉴权；注册机制等价，但入口说明需补 models.json 路径，故写入新 edition。
  - providers.models：分类器清单新增 OpenRouter 的 Jev 1.14 与 Clef 三款、Workers AI 的 Jev
    1.14.0 与 Clef Omni；模型条目补上 input/contextWindow/maxTokens/reasoning 默认值，并记录 $$
    与 $! 转义；OpenRouter 按 key 清单机制未变。
  - providers.metadata：SystemOneCompat 新增 imageInput 与
    sendImageOptInHeader，provider 级 compat 开始作用于分类器模型而 models/modelOverrides 的
    compat 仅作用于 chat；模型字段默认值由 schema 生成。证据足以把该问题从 partial 升为 answered。
  - providers.protocol：CompatSchemasByApi 变为导出映射，新增 azure-openai-responses、
    openai-codex-responses 与两个 System One API 的模式绑定；协议清单本身未增删。
  - providers.forwarding：请求身份改由 client identity 生成 User-Agent 与归因头，identity
    头位于模型/provider/请求 header 之下，null 请求头可移除默认头；System One imageInput
    决定分类器图片请求形态。证据足以把该问题从 partial 升为 answered。
  - 未改问题：providers.auth 顺序未变；providers.responses 与 providers.diagnostics 仍按
    partial 记录，具体错误与诊断入口本轮未逐条登记，不在本轮范围内重审。
