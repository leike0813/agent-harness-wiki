investigation_notes:
  - 本轮 triage 分类：maintain（来源身份修正 + configuration / mcp 定向维护）
  - 来源身份问题优先于内容，已在本轮候选内修正：registry/sources/source-pi-repo.yaml 的
    repository_url 改为 https://github.com/earendil-works/pi.git，source-pi-npm.yaml 的
    package_name 改为 @earendil-works/pi-coding-agent。依据是固定提交 56b25ff4 下 13 个
    package.json 的 repository 字段全部为 git+https://github.com/earendil-works/pi.git、
    根 README 的 npm 徽章与安装命令指向 @earendil-works/pi-coding-agent、nix flake 指向
    github:earendil-works/pi/stable、CHANGELOG 的 issue 链接全部指向 earendil-works/pi。
    检出仍成功是因为 GitHub 对旧地址 301 重定向，属同仓改名而非新仓。
  - 按仓库既有惯例（kimi-code 的 source-kimi-code-legacy-repo、forgecode 的
    source-forgecode-npm-forge）保留旧身份：新增 source-pi-legacy-repo 与
    source-pi-npm-legacy，并登记进 registry/harnesses/pi.yaml 的 source_refs。
    校验规则要求 managed_package artifact 与 npm_release snapshot 的 package_name 与
    其 source 一致，因此 snapshot-pi-npm、snapshot-pi-readme-npm、artifact-pi-npm、
    artifact-pi-readme-npm 四条历史记录的 source_id 改指 source-pi-npm-legacy；
    记录的版本、integrity、路径与内容 hash 一律未动。
  - 本轮 checks 里的 npm 观察值原本记在 source-pi-npm 名下。身份修正后该 id 指向新包，
    保留原样会变成错误归属，故改记为 source-pi-npm-legacy；观察值本身（0.73.1 与同一
    integrity）未变。
  - source-pi-npm（新身份 @earendil-works/pi-coding-agent）与 source-pi-legacy-repo 本轮
    没有各自的独立观察记录：观察发生在身份修正之前，且固定源码工作区由旧地址检出。
    新 npm 来源没有基线，下一轮监控会首次观察并建立基线；在此之前该来源的
    version/integrity 未取证，本轮不据此写任何版本结论。
  - 知识内部不一致已消除：52 条仍带 badlogic/pi-mono 的 official_url 统一改为
    earendil-works/pi。改动只替换 URL 的 owner/rego 段，固定 commit、文件路径、
    行区间与摘录一律未动，因此已发布章节的证据内容不受影响。
  - packages/coding-agent/src/cli/args.ts 与 CHANGELOG [Unreleased]：--tools 新增
    +name/-name 条目，语义为改默认选择而非整体替换，并写明除非条目以 mcp__ 开头否则
    保留 MCP 工具；pi update 只保留新版本与被升级的那一版；独立二进制从启动目录加载
    .env/.env.local/.env.development。
  - 六类已登记来源文件全部在变更集内（docs/settings.md、docs/message-types.md、
    cli/args.ts、package.json、core/settings-manager.ts、README.md）。本轮能逐条复核的
    只有固定在工作区里的 28dcce2 一档：4 条引用按其自身固定提交复核通过，其中
    ref-pi-lt-schema-image-inline 的行区间多含一行空行，已由 27-38 修正为 27-37。
    另有 15 条引用固定在 83692682 与 781152fc 两档，这两档在浅克隆工作区里不可达，
    本轮无法复核行区间；由于引用按 commit 固定，其原定位仍是对该提交的准确引用，
    不构成错误，本轮按未复核记录。
  - 排除的路径及理由：README.md 新增的“Using local packages outside the monorepo”是
    贡献者构建流程（pack:packages、use-local-packages.mjs），面向本地开发而非终端用户
    的配置入口，与已登记的 packages 命令知识不是同一机制；packages/ai 的 OAuth 与
