- skills.discovery/roots 与 mcp.entry/definition 章节引用该仓库，需要按固定问题复核。
- 本轮 worker 在隔离候选中用固定工作区 ws-ea448f454af4-8d386daf-0d42-4a89-b65c-001c308c4433（commit
