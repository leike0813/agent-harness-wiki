investigation_notes:
- 本轮 triage 分类：maintain。
- >-
  固定工作区 ws-6fb2e7815167-94fe61ac-0147-40fc-b48e-11ef42d5b176，commit 6fb2e781
  （fix: support npm 12 pack JSON output），基线 56b25ff4，252 个文件。
- settings-manager.ts 的净减 190 行不是功能删除：逐块比对后，删掉的是 CompactionSettings、
  RetrySettings、TerminalSettings、Settings 等接口声明（搬到 settings-schema.ts）与
  DEFAULT_COMPACTION_TOKEN_SETTINGS 的字面量（改为引用 SETTINGS_DEFAULTS）；34 个 hunk 中
  绝大多数是 `?? 字面量` 换成 `?? SETTINGS_DEFAULTS.x`，唯一非替换的新增是 clearOnShrink 分支
  读取 PI_CLEAR_ON_SHRINK 环境变量，与默认值表无关。
- Settings 键集合逐个比对：新增 $schema、queueMode、websockets 三项（后两项本就在迁移代码里，
  现在同时进入模式并标 deprecated），无删除项。skills 的旧对象形态在模式里也标 deprecated。
- types.ts 的 413 行改动经 compat-schema.ts 逐接口比对确认为类型搬迁：OpenAICompletionsCompat、
  OpenAIResponsesCompat、AnthropicMessagesCompat、BedrockCompat、MistralConversationsCompat
  字段无增减；新增的实质字段是 AssistantMessage/ToolResult 的 durationMs 与 ClassifierContext.images，
  以及 KnownClassifierApi 的 openai-decisions。durationMs 属 transcripts 主题，不在本轮范围。
- nested-tool-calls.ts 只增加 durationMs 的透传，同属 transcripts 范围，本轮按父进程范围只记录不维护。
- 排除的路径：packages/tui 的终端/按键改动、scripts/release.mjs 与 package-artifacts.mjs 的
  npm 12 pack JSON 适配、openai-decisions.lazy.ts 等 provider 实现、test/ 与 lockfile，均不触及
  configuration / custom_providers 的固定问题。
- npm 来源观察到 1.1.0（基线 0.73.1），按 exclude 只记录身份变化，未据此写任何映射。
  新增事实全部来自 6fb2e781 的源码与文档，未建立软件版本映射。
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计，且维护工作尚未完成。