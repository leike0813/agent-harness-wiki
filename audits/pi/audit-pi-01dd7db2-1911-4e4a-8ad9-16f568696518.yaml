investigation_notes:
  - >-
    本轮 triage 分类：maintain。两个 Git 来源同时从 ea448f45 前进到 7bd01fb92485，各 443 个变化路径。
    两个 pinned checkout（ws-7bd01fb92485-942304df… 与 ws-7bd01fb92485-2caf6dd0…）在同一提交上的
    git ls-tree -r 输出逐行相同，字节一致，因此只用前者作为证据。
  - >-
    扫描器把两个 Git 来源的影响写成全部八个主题的「shared or unknown impact」。worker 逐条读取
    变化文件后把 impacts 收窄到 configuration、custom_providers、native_plugins、mcp 四个主题，
    其余四个主题（skills、custom_agents、hooks、local_transcripts 之外的 agents/hooks 部分）本轮不改章节。
  - >-
    settings.md 与生成的 schema：verify 后确认改动同时落在 docs/settings.md 第 5 行、
    schemas/settings.schema.json 第 3 行、schemas/models.schema.json 第 3 行与
    scripts/generate-schemas.ts 的 schemaBaseUrl/SchemaArtifact.filename 上，四处一致指向
    https://pi.dev/schemas。键集合、默认值与合并逻辑未变，因此没有扩展到 config.defaults、
    config.overrides、config.runtime、config.trust、config.migration——那些结论在 7bd01fb9 上没有
    被推翻。config.diagnostics 本就按 partial 记录（缺「打印某键最终生效值与来源」的命令），
    本轮补证据后仍为 partial，故留在 pending_question_ids。
  - >-
    跨主题扩展：$schema 发布地址与 !pattern 的 ~ 展开是共享机制，按「章节陈述了该键即同步」处理，
    因此同时更新 custom_providers（models.json 的 $schema 与 models.schema.json 的 $id）与
    native_plugins（包清单过滤）。skills 主题的 skills-extension-fields 也陈述同一组
    !pattern/+path/-path 键，但本轮任务范围未包含该主题，且其结论（键集合与语义）未被推翻，
    只在 investigation_notes 记录，留待下一轮 skills 定向维护；hooks 与 custom_agents 本轮无变化路径
    落在其引用文件上，不扩展。
  - >-
    实验运行时（instruction 3）：src/experimental/session-catalog.ts 与
    src/experimental/durable/sessions.ts 在本区间被整体删除，packages/coding-agent/package.json
    的 files 也不再排除 dist/experimental 与 dist/cli/experimental。local_transcripts 的
    transcripts-database-and-index 正是以这两个文件加 package.json 排除项为证据，因此新建
    pi-local_transcripts-v2，保留「实验路径不属于 pi CLI 记录、也不随包发布」这一条件而非删除该结论，
    并写明这两个文件的形态仍按 28dcce2 记录、本轮未复核其在后续提交中的存在性。
    transcripts.lifecycle/archive/cleanup 三题本轮无新证据，维持原状态与缺口描述。
  - >-
    compaction：docs/compaction.md 与 src/core/compaction/utils.ts 显示 serializeConversation()
    不再输出 thinking 块。这影响 transcripts.lifecycle 的摘要输入，已在 v2 中记录，并明确区分
    「摘要输入不含 thinking」与「thinking 仍照常落盘」，未改动 transcripts.schema 的记录形态结论。
  - >-
    版本映射：本轮未新增、未修改任何 mappings/ 记录，仓库 HEAD 不作为映射依据。
    npm 来源本轮 unchanged（1.1.0 与 legacy 0.73.1），继续按 source_only 阅读。
  - >-
    pending_question_ids 列出的是现行章节中仍未闭合的问题：config.sources 与 config.migration
    的 dotenv 优先级、迁移弃用时间表等缺口本轮没有新证据；config.diagnostics 与 mcp.diagnostics
    仍缺「打印某键最终生效值与来源」的命令与逐项 diagnostics 分解；providers.metadata/forwarding/
    responses/diagnostics 四题按 v5 的 partial 保留；plugins.diagnostics 缺逐包列出实际加载资源的命令；
    transcripts.lifecycle/archive/cleanup 三题的子代理委派、/import 分发分支与级联删除等缺口本轮仍无证据。
  - >-
    skills、custom_agents、hooks 三个主题本轮不改章节，但它们的未完问题必须继续在本审计里可见：
    skills.discovery/extensions/conditions/diagnostics、agents.format/limits/diagnostics、
    hooks.input/output 全部保留在 pending_question_ids，并由本审计的对应 impacts 覆盖。
    其中 hooks.input/hooks.output 是本轮确知会受影响但未获授权范围处理的两题；
    skills.extensions 与本轮的 ~ 展开修复同源。旧审计（audit-pi-04bf1025…、audit-pi-aef48867… 等）
    同样保留在 pending_audit_refs 中，两处记录指向同一批未闭合问题，不构成重复结案。
  - >-
    复核修订记录（2026-10-13，changes_requested 之后）：一、pi-mcp-v5.md 的 capabilities 与 route 各有一份
    重复段落、lifecycle 一行内重复了同一段 reachesTools 等待规则，均已删除，每条主张与其引用现在各出现一次。
    二、pi-local_transcripts-v2.md 原写「files 排除项消失是因为 src/experimental 整棵树已不存在」，该说法不成立
    （该目录下的 source-resolver.ts 在 7bd01fb9 仍存在并仍被 generate:schemas 引用），已改为只陈述
    session-catalog.ts 与 durable/sessions.ts 两个文件不在源码树内，并删掉与之冲突的旧 hedge 句。
    三、ref-pi-config-changelog-schema-publish 的 locator 原指向 CHANGELOG 第 8 行（before_agent_start 条目），
    已改指第 7 行，即真正记录四份模式发布地址与启动期主题校验的那条。
    四、pending_question_ids 恢复 skills.discovery/extensions/conditions/diagnostics、agents.format/limits/
    diagnostics、hooks.input/output 九项，并扩写 skills 与 hooks 的 impacts 覆盖它们；review_status 保持 pending。
  - >-
    独立复核需求：有。docs/settings.md 的 $schema 发布地址与 package-manager.ts 的过滤展开属于
    跨主题共享的加载/配置机制变更，且 CHANGELOG 把主题模式地址与启动期校验列为 breaking change，
    需要只读 reviewer 复核新引用与四个新章节版本的证据链。
