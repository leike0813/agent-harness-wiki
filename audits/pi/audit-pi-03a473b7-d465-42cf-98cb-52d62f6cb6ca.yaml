      body 流消费前触发。覆盖边界另记为部分 provider 只给空 header 或部分响应，SSE 流内错误与
      WebSocket 传输不触发。types.ts 的 StreamOptions.onResponse 注释给出同一契约。因此
      hooks.events 与 hooks.order（重复触发）需要新 edition；hooks.input / output / entry /
      conditions / diagnostics 未变。
