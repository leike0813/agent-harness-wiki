investigation_notes:
  - "local_transcripts 首采：仅覆盖 cli 界面，固定来源 source-amazon-q-repo，commit 15cc8f3cd18c4272925ce1c7053268eedff1ea0a（本轮 scan unchanged，基线同 commit），全部证据为该提交源码树的 git_source_file；本产品 archive/amazon-q/ 下无官方文档原件，因此未创建任何 archived_document，全部十题不含文档来源引用。"
  - "定位到实现位于 crates/chat-cli（workspace default-members 唯一成员）；同 workspace 的 crates/agent 尚无有效二进制（main.rs 为占位实现），其 util/directories.rs 不被 CLI 的 Database 路径使用，故未采信为会话路径证据。"
  - "十题均已给出可用答案：naming/format/lifecycle/archive 为 answered；scope/location/schema/database/cleanup/diagnostics 为 partial，缺口分别是记录开关无正面证据、dirs crate 的各平台取值来自外部、缺官方 JSON Schema 与值级版本迁移、删库后无法重建 value、缺官方保留与删除机制、缺会话记录诊断命令。"
  - "发现与 configuration 章节的文档漂移：该章依据 crates/agent/src/agent/util/directories.rs 称 Q_CLI_DATA_DIR 覆盖数据目录，但 CLI 的 Database::new() 走 GlobalPaths::database_path_static() 且无环境变量分支。已在 lt-storage-layout 一节写明，本轮未改动该既有章节，留待配置主题维护时复核。"
  - "未写入 mappings（无发行包版本证据）；未执行 sources:scan、publish、managed package 更新或真实 harness。"
