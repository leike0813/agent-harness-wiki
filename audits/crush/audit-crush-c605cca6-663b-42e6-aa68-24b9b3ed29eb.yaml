    reason: >-
      source-crush-repo d6edc32（PR #3924 workspace-prompts，父提交 c446d3f0）：本轮按派发范围只调查
      configuration 的 config.sources、config.overrides、config.trust。合入提交标题为 “server: scope
      permission/question prompts to the current session”，全部 24 个改动文件里没有任何配置读取、
      配置文件发现或工作区文件加载路径的改动：internal/config/**、internal/shellconfig/**、
      internal/skills/**、docs/** 与 schema.json 的 diff 均为空，非测试改动里也没有新增
      os.ReadFile、filepath.Walk 或 glob。“workspace prompts” 指的是同一 workspace 内按会话投递的
      权限/提问提示事件，不是新增的提示词文件发现机制；该能力在本提交之前不存在，也不新增任何
      配置键。与已登记证据重合的 internal/permission/permission.go 的 +29 行只做两件事：给
      PermissionNotification 加 SessionID 字段并在五处 Publish 带上 opts.SessionID，以及新增只读的
      Service.ActiveRequest()（先查 activeRequest 再用 pendingRequests 校验其仍可 Grant/Deny 解析）。
      Request 的判定顺序（skip → allowlist → hookApproved → autoApprove → AutoApproveSession →
      autoApproveTools）逐字未改，故配置侧的跳过/允许/信任门机制不变。逐问题结论：config.sources 的
      来源发现与优先级未变、config.overrides 的合并与覆盖语义未变、config.trust 的“配置文件即受信任
      代码”边界未变，三题均结案为不受影响，不新建章节 edition，也不新增 mapping。config.runtime、
      config.defaults、config.migration、config.diagnostics 未在派发范围，保持 pending。
