investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 configuration 的固定问题。
  - "仓库单提交 d6edc32（Merge pull request #3924 from
    charmbracelet/workspace-prompts，24 个文件），多为测试与内部 UI；与章节已引证据文件重合的只有
    internal/permission/permission.go。"
  - >-
    固定来源工作区：ws-d6edc3222231-e90b7699-7de1-48a8-af86-cf4fa3c5592a（baseline
    c446d3f0ddf59089ff43a617dd4f3ee233f01892，observed
    d6edc3222231a0177b88d073733413578c9a1e01），未重扫来源。
  - >-
    workspace-prompts 的性质已核实：merge commit 的标题是 “server: scope permission/question
    prompts to the current session”。24 个改动文件按职能分为四类——客户端/服务端事件投递
    （internal/backend/backend.go、internal/backend/events.go、internal/workspace/client_workspace.go、
    internal/server/{endpoints,events,proto}.go）、提示载荷加 session 维度
    （internal/permission/permission.go、internal/question/question.go、
    internal/proto/{permission,proto}.go）、TUI 注释
    （internal/ui/model/session.go）与测试与 CI（13 个 *_test.go、.github/**）。其中没有任何配置文件、
    配置目录或提示词文件的发现/读取路径；internal/config/**、internal/shellconfig/**、
    internal/skills/**、docs/**、schema.json 在本次提交中 diff 为空。
  - >-
    已检查并据以结案的差异文件（commit d6edc3222231a0177b88d073733413578c9a1e01）：
    internal/permission/permission.go 是本产品章节已引证据文件中唯一被改动的一个，+29 行、0 删除，
    精确内容为——第 49 行给 PermissionNotification 增加 SessionID string `json:"session_id"`；
    第 82-86 行在 Service 接口上新增带注释的方法 ActiveRequest() (PermissionRequest, bool)；
    resolve()（第 135 行定义，第 145-146 行的 Publish）与 Request() 的四处 notificationBroker.Publish
    （第 204、216、226、264 行）各补一行 SessionID；第 291-308 行新增 permissionService.ActiveRequest
    实现，先取 activeRequest，再以 pendingRequests.Get(active.ID) 判断该请求是否仍能被 Grant/Deny
    解析，均在 activeRequestMu 保护下读取。Request 的放行判定顺序（skip → allowedTools 命中 →
    hookApproved → autoApprove → AutoApproveSession → autoApproveTools）逐字未改；PermissionRequest
    结构本身的 SessionID 字段是既有的，本次未改。
  - >-
    排除的差异文件与其理由：13 个 *_test.go（bash_test.go、multiedit_test.go、view_test.go、
    backend_test.go、prompts_test.go、permission_test.go、question_test.go、e2e_test.go、
    events_filter_test.go、sessions_isbusy_test.go、client_workspace_test.go 等）只断言新行为，
    不构成用户可依赖的配置机制；internal/ui/model/session.go 与 internal/server/sessions_isbusy_test.go
    按派发范围显式排除（二者只改注释/测试，分别对应 TUI 会话上报说明与 sessions isbusy 回归测试，
    与 config.sources、config.overrides、config.trust 无机制关系）；.github/cla-signatures.json 与
    .github/workflows/release.yml 属仓库治理；internal/proto/**、internal/server/** 与
    internal/backend/** 的其余改动是服务端 SSE 事件按会话过滤与 pending 提示重发，接口层面是
    HTTP/SSE server surface，而 catalog 只为 crush 登记了 cli 一个 surface，且这些行为没有对应的
    配置键、路径或加载顺序，按范围不纳入本轮 configuration 结论。
  - >-
    逐题结论：config.sources（来源发现、项目边界与反转后的优先级）不受影响；config.overrides
    （JSON 深度合并、crushrc 内建命令顺序、permissions allow/deny 追加语义）不受影响；
    config.trust（crushrc 以完整 shell 语义执行、JSON 字符串字段做 $VAR/$(cmd) 展开，无任何信任门或
    沙箱）不受影响。已发布的 crush-cli-configuration-v2 三题答案与证据定位继续有效，
    本轮不新建章节 edition、不新增或改写 reference、不新增 mapping。
  - >-
    证据定位复核：ref-crush-code-permission-request（internal/permission/permission.go 181-240）与
    ref-crush-code-permission-service（290-310）虽指向本次改动的文件，但二者 snapshot_id 为
    snapshot-crush-repo（commit 69c65c3d5be0a388d62047feb55d88b9bad7f1b2），定位在其自身固定快照上
    仍然成立，无需改写；且这两条引用只被 hooks 与 custom_agents 章节引用，configuration 章节
    config-merge 引用的权限证据是 internal/shellconfig/permissions.go（ref-crush-code-permissions-builtin），
    该文件本次未改动。
  - >-
    复核：本轮没有改变任何已发布机制的结论，不触发高影响独立复核；但 audit 的 pending_question_ids
    仍保留 config.runtime、config.defaults、config.migration、config.diagnostics 与其余七个主题的未完成
    问题，review_status 维持 pending，由协调者在其余派发完成后统一处置。
