  - local_transcripts 首采（此前该产品没有此主题章节）。固定来源 source-crush-repo，commit 8da349060b7df148d209979be0a5e9c9281d1f15，检出位于项目外只读工作区 /tmp/ahw-source-workspaces/ws-8da349060b7d-a118cfda-a156-4656-98b1-bb093e307cca。
  - 只调查 catalog 中已登记的 cli 界面；commit 8da34906 的源码树中未发现其它界面实现，因此没有其它 surface 的答案。
  - 本项目 archive/ 下没有 crush 的官方文档原件，本轮全部证据取自源码文件（git_source_file + source_revision 快照），未创建 archived_document，也未写发行版本 mappings。
  - 结论与缺口：transcripts.naming、transcripts.archive、transcripts.cleanup 为 partial——数据库记录中没有 git 分支列，分支名运行时现读；internal/cmd 下没有归档或导出子命令；手工删表/删文件的行为未在源码中定义。
  - 其余七题 answered：正文存于 messages.parts 的带标签 JSON，库为每项目一个 crush.db，生命周期由 33ms 防抖与终止态同步落盘控制，诊断入口为 session/stats/logs/dirs 子命令。
  - 本轮未逐项审计缓存、日志轮转与遥测，只覆盖会话记录与维持它所需的存储依赖。
