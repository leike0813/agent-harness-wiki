investigation_notes:
  - "本轮只读观察 2026-10-22T12:53:45.316Z（会话 4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns）：source-crush-repo 由 a48dabea 前进到 cd5f15d，source-crush-npm 0.98.1 的 integrity 未变。所有结论只对源码树 commit 成立，本章不写发行版本映射。"
  - "逐文件 triage：103 个变更文件中，workflows、cla-signatures、UI/主题/补全/渲染与 *_test.go 不进入固定问题；语义入口集中在 internal/config、schema.json、docs/config/README.md、internal/shellconfig/options.go、internal/agent/agent.go 与 settle.go、internal/agent/tools/**、internal/message/content.go、internal/backend/session.go、internal/cmd/{root,session,stats}.go。"
  - "接受为机制级变化：internal/config/discovery.go 新增发现缓存、后台刷新与合并；config.go 新增 options.max_background_jobs；schema.json、docs/config/README.md 与内置 crush-config 技能同步该键；internal/agent/settle.go 新增工具调用补记；message/content.go 的 toolCallInput 与 AddFinishAt 改变落库字段语义；agent.go 与 backend/session.go 接入补记；empty_media.go 决定空媒体结果的落库文本。"
  - "判定不改变固定问题答案（已查入口）：hooks 只有 reload_hooks_test.go 的签名调整，internal/hooks/** 与 docs/hooks 未改；skills 只有 internal/skills/builtin/crush-config/SKILL.md 增加一行配置键说明，技能发现与加载代码未改；native_plugins 没有任何插件相关文件改动，仍为 not_applicable；custom_agents 的 Agent 结构与 SetupAgents 未改，schema.json 顶层仍无 agents 键；mcp 侧本轮的两处改动分属不同文件：internal/agent/tools/mcp/tools.go:63-115 把原先内联在 RunTool 里的折叠逻辑抽成 toolResultFromCall/mediaPayload，并加入空/空白媒体载荷处理（配套新增 internal/agent/tools/mcp/empty_media_test.go），折叠规则本身在本轮之前已存在；“最多一份图片、一份音频”的折叠与 UnsupportedMediaResponse 无关——后者定义在 internal/agent/tools/tools.go:73-76，由 internal/agent/tools/mcp-tools.go:143 与 internal/agent/tools/view.go:210 调用，mcp/tools.go 内不存在该标识符（全仓 grep 确认）。ListTools、filterTools、resources、prompts 路径未改，故 mcp.capabilities 答案不变。"
  - "配置加载入口本轮改为显式传 context（Load/Init/LoadProviders）并为发现探测加预算；这是调用层签名变化，不改变来源、合并、运行时覆盖与信任规则，config.sources、config.overrides、config.runtime、config.trust 结论不变。"
  - "internal/cmd/session.go、stats.go、root.go 的改动是 context 传递、信号处理与分页 writer 的重构，不改变记录的位置、格式或记录范围；transcripts.scope、transcripts.location、transcripts.format 不变。"
  - "已发布引用的行定位在本轮提交上会漂移（triage 记录 35 条不再命中）。处理方式是新 edition 只把新增结论绑定到 cd5f15d 的 git_source_file 快照（commit、仓库相对路径、content_sha256，不保留 checkout），旧 edition 与旧引用保持原字节。"
