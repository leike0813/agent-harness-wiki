investigation_notes:
  - 本轮 sources:scan 观察到的提交与任务输入文件不同：输入文件记录 observed e38702160795b172b1f9f66a4a97a5debd060f57，本轮重新扫描得到 e78f11f5409f47ec560fff390b6158470523cb0f（多出 e22fcd5fb「a restarted parent lists and reaches its subagents again (#3268)」与 e78f11f54「feat/machine library (#3285)」）。按共享执行契约以本轮扫描观察为准，审计的 observed 保持 e78f11f54。
  - 基线 e2fb7bfa（2026-09-16，#2426）到观察 e78f11f54（2026-10-03，#3285）之间有 208 个提交，跨越一次完整的 TypeScript 到 Rust 重写。
  - sources:workspace open 返回的 changed_paths 共 2585 条、覆盖整棵树（含 vendor/），不是真实差异。原因是受管工作区是 depth=1 浅克隆，.git/shallow 同时把基线与观察提交都记为边界提交，二者互不为祖先，git diff 退化为整树比较。在工作区内 git fetch --deepen=300 后基线恢复为祖先，真实差异为 2585 个文件、660547 行新增、437205 行删除。这是本轮工具侧缺陷，后续轮次不应直接采信浅克隆下的 changed_paths。
  - 重写主体：39bc99a91「Port Prime Agent to Rust (#2524)」（2026-09-29）。packages/agent、packages/ai、packages/coding-agent、packages/tui 四个 TypeScript 包整体删除，改为 crates/pa-agent、pa-ai、pa-cli、pa-core、pa-daemon、pa-models、pa-telemetry、pa-tui、pa-types 等 Rust crate；tsconfig.json、tsconfig.base.json、test.sh、package.json 一并删除。
