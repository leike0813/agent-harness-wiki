    reason: >-
      已在 prime-agent-cli-configuration-v2 落地。核实结论与初判有一处重要修正：factory.enabled 这个键在基线 e78f11f5 就已存在，内核 rlm.factory 与 crates/pa-core/src/refinement/mod.rs 都已在直接解析 agent 目录 settings.json 的原始 JSON 读它，绕过类型化设置层。c24ac227 新增的是类型化暴露——Settings 上新增可选 factory 字段、FactorySettings（serde camelCase，仅一个可选布尔 enabled）、KNOWN_FIELDS 接受 "factory"、SettingsManager 的 get/set_factory_enabled，以及 pa-tui/pa-cli 的 ClientSettings 读写缝。
      独立复核指出开关的界面归属必须限定：斜杠命令 /factory [on|off|status] 只实现在 pa-tui（crates/pa-tui/src/session_ui/commands.rs），pa-cli 侧注册的 factory 是另一套命令 factory <list|import|export>（机器库管理，无 on/off/status）；而 catalog/harnesses.yaml 为本产品只声明了 surface_id: cli，没有声明承载该斜杠命令的客户端界面。按 AGENTS.md 的界面归属规则，该命令的界面绑定记为 unknown，章节明确写明它不是 cli 界面的结论，键本身的语义（键名、只读全局、失败关闭）仍作为产品级事实保留。
      同一复核还纠正了旧版缺口声明：客户端界面的 /factory on 成功提示明确要求重启客户端才会显示 factory 分组，章节据此把该缺口收窄为 /reload 是否足够、关闭时是否也要重启。
      get_factory_enabled 读的是 self.global_settings()、setter 只写全局作用域，因此该键是新增的只读全局键，项目作用域无法打开闸门；这一点同时补进 config-overrides 的全局键例外表，否则同一章节会自相矛盾（该小节不在本轮交回的两个固定问题内，属必要的内部一致性补齐，未改其问题状态）。
      默认值是失败关闭：文件缺失、键缺失、值类型不对、文档损坏都按未设置处理，只有值恰为布尔 true 才算打开。
