    reason: >-
      已在 prime-agent-cli-mcp-v3 落地，作为 mcp-lifecycle 里新增的第三条准入路径写入（此前该小节只覆盖通用 HTTP/stdio 连接与目录集成状态机，没有 ACP 会话的整批准入）。
      核实后与 .changes/acp-mcp-replace-cleanup.md 的措辞有出入，按代码记录：基线的进程内 admit_session_servers 在替换失败时已经做 owner 清理，c24ac227 并不是给失败路径新增清理，而是把准入从进程内管理器搬到 worker 的 replace_acp_mcp_servers 线协议命令（会话级响应超时 30 秒），失败与超时因此汇入同一条 Err 分支，清理覆盖到超时这一新增情形。worker 侧另有三道约束：真正的 agent 引擎持有会话 MCP 存储（脚本化引擎退回 worker 级存储）、agent 运行中拒绝替换、同 owner 同列表为成功空操作，被拒替换先按同一 owner 清空回滚再上报失败。session/close 与连接拆除走同一条替换为空路径。
      该行为是 Rust 移植侧与 TypeScript 对齐的表述，但固定来源里已无 packages/ 下的 TypeScript 树（基线与本轮都没有），无法在本轮核实 TS 实现，故正文只记 Rust 侧语义。
