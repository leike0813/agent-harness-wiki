investigation_notes:
  - >-
    local_transcripts first pass, delivery=pr, agent: harness-maintenance worker.
    Fixed source: source-prime-agent-repo at commit
    7a52276cb17310f331f1075f28fa5cf9c4ae0a0a, opened by the coordinator in the
    pinned read-only workspace
    /tmp/ahw-source-workspaces/ws-7a52276cb173-08af7d2c-1d51-4a37-8c47-b81cea7c451d;
    no new workspace was opened and no temporary path is written into any
    record. Baseline for this audit is c24ac227f11f552ed1d3fa8ebc7d916937d7f6bc;
    the only commit in between is an install.ps1 packaging change, so no existing
    transcript record changed - the topic simply had no chapter, and this pass
    wrote prime-agent-local_transcripts-v1 from scratch (19 git_source_file
    artifacts, one snapshot per file, 48 references). No archived_document was
    created: archive/prime-agent/ does not exist in this project, so every
    citation is source-level. No mappings were written, because a source commit
    does not prove any published package's behavior.
  - >-
    Source-tree note worth a maintainer decision: the pinned commit is already
    the Rust workspace (crates/), while the seven pre-existing chapters cite
    TypeScript files under packages/coding-agent/src/ that are absent from this
    tree. This chapter therefore records only what commit 7a52276c shows, and
    the two trees' consistency is not asserted anywhere.
  - >-
    Gaps left open on purpose, each also listed in the chapter body:
    transcripts.schema (no first-party schema doc or exported JSON Schema; the
    ai/ content-block structs and the v1->v2 / v2->v3 rewrite bodies were not
    itemized; customType value set not enumerated), transcripts.database (the
    "no database" statement is a negative search over sqlite/rusqlite/libsql/
    diesel in the pinned tree, not a positive source statement; RLM ledger
    rebuild rules untaken), transcripts.cleanup (sidecar and RLM ledger
    handling on delete, cascade semantics for parent/child sessions and any
    rebuild entry point were not taken as evidence).
  - >-
    Status discipline: transcript.cleanup and transcript.schema are answered
    only where the fixed source states the mechanism directly; partial is used
    wherever the mechanism is evidenced but a real gap remains, and no
    "no evidence" was turned into "unsupported" or "safe to delete manually".
    No blocker stopped the pass; review_status stays pending because other
    topics in this audit still carry pending questions.
