- 实质变更一：commit 1e894a62c20f07311b39130fde6088fa72cecb5c (#3413) 用 TOML 规则表取代了随包 per_model.md 块机制，新增用户侧 $AGENT_DIR/model-prompts.toml 规则文档、deny_unknown_fields 解析、agent 目录内的路径约束、整层失败即全部失效的语义，以及 model_prompt_error 状态行与 prime-agent prompt --model 预览。命中 config.sources、config.diagnostics，configuration 升版 v4。
- 实质变更二：commit b3496ee86a55f34b92d1fc30c821588e5f90c4a4 (#3434) 在 session role 段加入 daemonless 提示，判定条件为 config.rlm_subagent_host.is_none()。命中 agents.roles、agents.limits，custom_agents 升版 v3。
