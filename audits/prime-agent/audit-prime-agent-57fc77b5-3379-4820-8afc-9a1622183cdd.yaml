investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:55:34.149Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。固定来源只有一个 Git 仓库，baseline
    791ce3d8、observed 8aac8692（547 个文件变化），其中 24 个文件被已发布引用覆盖。
  - config.defaults：新增 compaction.thresholdPercent 与 harnessRefinements
    两个键，默认值、合法范围与作用域都在
    crates/pa-core/src/settings/types.rs、crates/pa-core/src/session_engine/compaction.rs 与 crates/pa-core/src/settings/interactive_settings.rs 里直接可读（95
    = COMPACT_THRESHOLD_RATIO 0.95 × 100； harnessRefinements 未设置时 true
    且只读全局）。已发布默认值表与说明段落补上这两项，其余键与说明未改动； 新 edition
    prime-agent-cli-configuration-v6。
  - transcripts.schema：FileEntry 枚举新增 tool_started（toolCallId/toolName/args）与
    tool_progress （toolCallId/toolName/elapsedMs），带同一套 EntryBase 信封；schema
    小节补字段、序列化标签与脱敏示例行， 状态仍为 partial（块级内容 schema 等缺口未变）。
  - transcripts.lifecycle：工具调用开始/进行中各自追加一行（写失败只记录、不失败整轮）；worker 在懒加载 engine
    建好前落盘的用户行通过 replay_admitted_user_rows 以“准入身份”重放，MessageEnd 复用原行而不重复追加；
    恢复第三步只剩更旧版本写入的 sessions-archive/ 兜底（复制+hard_link 发布+删除原件）。
  - transcripts.database：正文仍不在数据库（sqlite/rusqlite/libsql/diesel 检索无命中）；内存索引新增
    ChainLink 父链（skew-binary jump，O(log N) 祖先查询）且显示 transcript
    改为按页读取（成本随页而非随会话）； sidecar 版本闸改为“删字段不必升版本”（值仍为 2），折叠状态里原来的全量消息搜索语料字段已删除， 并新增
    catalog 扫描这一写者。
  - transcripts.diagnostics：新增两个可观察信号——read_session_info_from 返回的 (SessionInfo,
    cold) 布尔 说明本次读取是否真的绕过了 sidecar；RLM 账本单行损坏改为跳过并记录（one bad line costs one
    record）。 修复路径（尾部扫描、首行闸、流式重写、租约闸）本轮所在文件未变化，原有条目保留。
  - 归档（transcripts.archive 属于本轮不派发的固定问题）：session_archive.rs 整个模块与
    sessionArchiveMaxAgeDays/sessionArchiveMaxSessions 两个设置键在本提交被删除，自动归档不再存在，
    只剩对遗留目录的读取/恢复。为不把已知不实叙述带进新 edition，在共享小节里补了一段明确标注的移除说明，
    并注明该问题本轮未重审、需要单独派发；transcripts.archive 的答案状态与引用未改动，但该问题已列入
    pending_question_ids 并计入 impacts，下一轮必须作为固定问题单独派发。
