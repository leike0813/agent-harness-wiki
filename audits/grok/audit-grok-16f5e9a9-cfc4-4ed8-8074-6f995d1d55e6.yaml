    （knowledge/grok/artifacts/artifact-grok-npm.yaml，research/package-set 锁定 1.0.44）不同，
    上游自上次受管刷新后发布了 1.0.45 与 1.0.46 两个版本。本轮不为此新建 npm_release 快照：
    取得包字节属于受管刷新，delivery=pr 不执行 pnpm managed:packages，交给 harness-binary 在
    合并后或本地模式核对。
  - Git 来源 HEAD 仍是 2bdd1d6a6369de0e8c68132ea4539e9abd9e14a8，与 snapshot-grok-repo 固定提交相同；
    8 个 official_documentation 来源的 observed 与各自快照 raw_sha256 逐字相同。被引用小节的正文
