investigation_notes:
- "local_transcripts first pass for sourcecraft-code-assistant, answered for surface vscode
  only. The chat page in this round states it describes Visual Studio Code and points the
  JetBrains chat features to operations/chat.md, which is not archived in this round; the
  checkpoints page carries an only-in-VS-Code note, so no answer was authored for the
  jetbrains, cli, web or zed surfaces"
- "Fixed sources: archived official documentation snapshots snapshot-sc-ca-checkpoints
  (2026-09-30T17:06:51Z), -chat-interface (17:06:45Z), -tools (17:06:46Z), -chat-prompts
  (17:09:54Z), -profiles (17:06:44Z), -ignore (17:06:48Z), -qa (17:07:00Z), -index (17:06:31Z)
  and -logs (17:06:56Z). All nine carry version_applicability unknown, so the chapter is
  source-level knowledge and binds no conclusion to an installed build. The product has no
  registered git repository source, so there is no source-level evidence this round"
- "New chapter sourcecraft-code-assistant-local_transcripts-v1 with ten transcripts.*
  answers: scope, location, format, lifecycle, cleanup and diagnostics partial; naming,
  schema, database and archive unknown. Partial means the fixed sources document the
  mechanism but not its storage form: the checkpoint auxiliary Git repository is documented
  without any disk path, and chat history is documented only as a UI area"
- "No new artifact or snapshot was created. All eighteen new references bind existing
  snapshot-sc-ca-* records; six already published references were reused where the same
  locator carries the evidence. Every new excerpt was checked verbatim against the retained
  original under archive/sourcecraft-code-assistant/ in the main working tree, since this
  worktree has no archive/ directory"
- "Searched entries: all 26 archived doc pages for transcript, history, session, storage,
  jsonl, sqlite, retention, delete and export. The docs give no local transcript path,
  format, schema, database, archive or retention policy; missing evidence is reported as
  unknown or partial and never as unsupported or safe-to-delete"
- "Cloud-side history is kept separate: the FAQ only states that the plugin needs continuous
  internet access, and the .codeassistantignore page only describes rule upload, so neither
  is used as evidence about local record storage"
