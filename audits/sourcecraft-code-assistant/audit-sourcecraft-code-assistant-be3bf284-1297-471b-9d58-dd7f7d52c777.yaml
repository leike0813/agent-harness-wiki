investigation_notes:
  - >-
    结论：本轮 26 个官方文档来源全部报 changed，但没有一条读者可见的知识变化。七个主题的已发布章节原样保留，不新建 edition，不改 registry/chapter-current.yaml。
  - >-
    变化性质：26 份新归档原件（archive/sourcecraft-code-assistant/artifact-<source-id>-<hash12>/source.md）都新增了同一行站点样板 “Documentation Index: Fetch the complete configuration index at https://sourcecraft.dev/portal/docs/en/llms.txt”，正文段落之间的空行被整体去掉，列表行留下尾随空格，frontmatter 新增 Diplodoc Platform 版本字段。frontmatter 还带着 source: en/_includes/... 的 include 标记，说明这是 Diplodoc 的重新渲染输出，不是作者改写。
  - >-
    逐条复核方法：把 121 条既有文档引用的摘录与本轮归档原件做空白归一（去空行、去尾随空格）后逐字比对，121 条全部命中；121 条 locator 标题在新原件中一个都没被删改。按抽取的章节小节 ID 逐个核对，config-files、config-merge、config-runtime、config-defaults、config-trust、config-migration、config-diagnostics、agents-*、providers-*、hooks-*、mcp-*、plugins-*、skills-* 在新原件中对应的机制小节全部在位。
  - >-
    机制抽查：skills 页的渐进式披露三步、八级覆盖优先序（含“同一项目层级下 .codeassistant/ 优先于 .agents/”）、mode 专属目录与符号链接，chat-rules 页的规则位置与合并顺序，mcp 页的 stdio/Streamable HTTP/legacy SSE 三种传输、超时与工具自动批准，profiles 页的创建、切换、固定、编辑删除与 mode 绑定，在新原件中与已发布 skills-v2 等章节的表述逐条一致。
  - >-
    新增面检查：新原件里反引号点号标识共 14 个，其中 8 个未出现在章节正文中，逐一确认全部是示例文件名（fibonacci.py、server.cpp、idea.log、cmd.exe、opencode.json、hello.py、review.md），不是新的配置键或扩展点。本轮没有出现新的配置面。
  - >-
    方法限制（如实记录）：上一轮的基线原件不在本工作树的 archive/ 下——既有 artifact 记录指向的 archive/sourcecraft-code-assistant/artifact-<artifact-id>/raw.md 全部不存在，本轮扫描只写入了按 observed hash 命名的新目录。因此本轮无法做基线字节的逐行 diff，只能做上面这种表示无关的复核。如果某页在保持全部被引段落与全部 locator 标题逐字不变的同时改写了未被引用的内容，本轮不会发现。
  - >-
    保留的既有状态：本轮没有为这些状态带来新信息，因此维持已发布答案不变——hooks 七题全部 unknown（登记来源里没有任何 hooks 页面）、providers.metadata、plugins.api、config.migration 为 unknown，mcp.capabilities、mcp.diagnostics、config.trust、config.diagnostics 及 agents/providers/plugins 的其余题为 partial。
  - >-
    复核判定：本轮不触发独立复核的三类高影响情况——没有来源之间冲突，没有新来源推翻已发布的配置步骤，没有跨主题关键加载机制变化。
  - >-
    交付方式 delivery=pr：未运行 pnpm ahw publish、pnpm chapters:update、pnpm managed:packages，未切换任何发布指针，未做受管二进制核对，未修改 registry/chapter-current.yaml。本轮没有打开任何来源工作区（登记来源全部是官方文档，没有 Git 来源需要检出）。
