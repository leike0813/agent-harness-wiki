investigation_notes:
  - 本轮 triage 分类：local_transcripts 与 skills 为 maintain；mcp、custom_agents、
    custom_providers、hooks、native_plugins、configuration 六个主题为 reviewed_no_impact。
  - 变更范围核实：固定工作区 ws-a70dea0bfddb-8abf2a45-e326-4648-a737-425d12f436af 在
    8c7caf7a → a70dea0b 之间只有 1 个提交，git diff --name-only 确认改动文件恰为
    docs/acp.md、docs/slash-commands.md、docs/web-ui.md 三个，各 1 处；CHANGELOG.md 与其余
    docs 文件逐字未变。本轮新增快照只固定这三个文件，不重新读取未变更文件。
  - docs/acp.md：ACP 模式下的命令列表过滤规则改变——不再过滤本地命令（/clear、/exit），
    改为过滤客户端专属命令（/theme、/config）与终端面板专属命令（/stats、/rewind）；
    /clear、/compact 等会话控制命令会下发给客户端触发后由服务端执行。落在 skills.invocation
    的可见性口径。
  - docs/slash-commands.md：/export 一行改为“终端中导出当前对话到文件或剪贴板；Web UI 中
    下载当前会话的对话记录与可用调试日志 ZIP。归档可能包含敏感信息，分享前请检查”。
  - docs/web-ui.md：“复制与导出”条目新增 /export ZIP 归档说明：含对话记录及可用的会话日志，
    共享工作区日志只收录含当前会话 ID 的行，归档可能包含提示词、本地路径和敏感信息。
  - 界面边界处理：/export 的两种行为分属终端 TUI 与 Web UI 两个前端，catalog 中 codebuddy
    只声明 cli 一个界面，两者都在同一 CLI 进程内但结论不等价；章节正文按前端分列并写明
    “斜杠命令表把两种行为合并成一行不构成终端也能下 ZIP 的证据”，未把任一界面结论外推到另一界面。
  - 三条既有 local_transcripts 引用锚点复核（在新修订下逐行核对）：acp.md:73、
    slash-commands.md:45 与 :47-48 文本与行号均未变，变化发生在这些锚点之后；因此继续沿用
    旧修订快照，不改写已发布引用。ref-codebuddy-lt-webui-export 指向的 web-ui.md 内容已变，
    改为新增 ref-codebuddy-lt-webui-export-zip 固定新修订，旧引用保留供已发布的
    local_transcripts-v1 继续引用。
  - 六个主题的排除依据：本轮三个变更文件的内容分别属于 ACP 命令列表推送与 /export 导出，
    不涉及 MCP server/transport/认证、subagent 定义与内置 agent、provider 端点与鉴权、
    hook 事件与匹配规则、插件清单与安装解析、配置文件键与合并优先级。对应章节 source_refs
    所引用的文件在本修订下均未变化，因此不改写这些章节，也不新增断言。
  - 未新增版本映射：官方文档未对上述行为声明适用版本，文档仓库提交不等于 npm 发行版行为，
    故本轮不写任何 software mapping。
