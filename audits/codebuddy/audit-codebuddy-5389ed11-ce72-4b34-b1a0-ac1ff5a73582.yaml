investigation_notes:
  - 本轮只观察到 source-codebuddy-docs 一个来源的内容变化（47ec6f1… → 694ae23…）。用
    `pnpm sources:workspace open --baseline` 取得 changed_paths：CHANGELOG.md、docs/env-vars.md、
    docs/release-notes/{README,v2.161.0,v2.161.1}.md。被七个 codebuddy 章节引用的 docs/*.md 在两个提交
    之间除 env-vars.md 外逐字未变，因此章节改写范围限于新增的环境变量行与两条发行记录。
  - docs/release-notes/v2.161.0.md、v2.161.1.md 是 CHANGELOG.md 同两条发行记录的 Markdown 版本，
    按单一事实源只引用 CHANGELOG.md，不为 release-notes 另建快照；版本号（2.161.0/2.161.1）
    只用于标注行为自哪个 CLI 版本起成立。
  - 本轮新建 snapshot-codebuddy-docs-env-vars-20261003 与 snapshot-codebuddy-docs-changelog-20261003
    （各配一个 git_source_file artifact，固定 commit 694ae23…、仓库内路径与内容 hash），并新建 7 条
    引用。Git 来源的 checkout 不保留，工作区临时路径不写入任何记录；既有 snapshot-codebuddy-docs
    与 167 条引用保持原样，避免让已发布的 v1 章节改指新的提交。
  - 界面边界：2.161.0/2.161.1 中 Server 库、Web UI、TUI 的条目一律不写入 CLI 章节。唯一例外是
    FileChanged 的批量触发语义——发行记录把它与后台服务文件监听放在同一条目里且未区分界面，本章按
    CLI 记录并在正文写明 Server 侧未验证。
  - source-codebuddy-npm 报 changed 是版本从受管记录的 2.160.0 变为观察到的 2.161.1。按 maintenance
    第 3 节，npm 版本变化本身不构成章节变化或源码到包的映射；本轮 delivery=pr 未取包字节，
    artifact-codebuddy-npm 仍记录 2.160.0，不新建 mappings/ 条目，留给 harness-binary 核对。
  - 改动不涉及来源冲突、推翻已发布的配置步骤或跨主题加载机制变化，按 maintenance 第 4 节由本 Agent
    自检，无需第二个 Agent 独立复核。
  - delivery=pr：本轮只执行第 1-6 节的观察、采写、自检与审计，未运行 pnpm ahw publish、
    pnpm chapters:update、pnpm managed:packages，未调用 harness-binary。
