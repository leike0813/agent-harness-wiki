investigation_notes:
- 'First pass for the local_transcripts topic. Pinned source is source-codebuddy-docs
  (https://cnb.cool/codebuddy/codebuddy-code) at commit 8c7caf7ad5edd6ec9367a51fbeec2f4f167aa109,
  read from the coordinator-opened workspace ws-8c7caf7ad5ed-009d3cf0-2a29-460d-9fc2-959198df0f49;
  baseline was 694ae23f44308ca901d620d2e48c2c3d35c75fc9. 17 distinct files were pinned
  as one artifact and one snapshot each, producing 27 references, all used in the
  chapter body. Main blocking limit: this git source is the documentation repository,
  not the product implementation, so it can only prove what the official docs state.
  Implementation-level transcript details stay unconfirmed and are recorded as per-question
  gaps: JSONL record type enumeration and required fields (transcripts.schema), encoding,
  sharding, compression and torn-line handling (transcripts.format), the <project-hash>
  derivation that would be needed to reproduce a project directory on another machine
  (transcripts.naming), whether a database is used alongside the JSONL files (transcripts.database),
