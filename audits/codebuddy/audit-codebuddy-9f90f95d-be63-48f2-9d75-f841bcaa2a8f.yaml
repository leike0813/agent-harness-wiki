investigation_notes:
  - 本轮 triage 分类：maintain；范围限 hooks 的固定问题（hooks.events / hooks.input /
    hooks.output / hooks.entry）。
  - "固定提交 ae82976cdedc6fc812a66b2c2d8d5eaf7524097a（docs: 自动同步 CodeBuddy Code
    文档和变更日志）共改 9 个文件；本轮逐字 diff 了其中的 docs/hooks.md 与 docs/tools-reference.md。"
  - docs/hooks.md：仅在第 664 行新增一段「上下文注入说明」（2 行增、0 行删），事件表、Hook 输入、 配置结构、matcher
    与执行细节逐字未变，故 hooks.events / hooks.input / hooks.entry / hooks.order /
    hooks.diagnostics 判定无变化；hooks.output 的 stdout 契约改写。codebuddy-cli-hooks-v3
    已合入 main，按维护契约第 4 节不得原地改写，故本次改写落在新建的完整 edition codebuddy-cli-hooks-v4 的
    hooks-io 小节，v3 文件逐字保持基线，并新增 ref-codebuddy-hooks-output-context。
  - docs/tools-reference.md：第 77 行只把「只读调用可以并发」一句补上并发上限（默认 10，超出排队， 可用
    CODEBUDDY_MAX_TOOL_USE_CONCURRENCY 调整）。工具名与事件名列表逐字未变，按任务排除项只作 确认，不改写 hooks
    章节，也不作为 hooks 的引用。
  - 排除并记录（本轮问题范围外）：CHANGELOG.md、docs/env-vars.md、docs/http-api.md、docs/mods-api.md、
    docs/release-notes/README.md、docs/release-notes/v2.166.0.md、docs/security.md
    共 7 个文件。其中 CHANGELOG.md 与 docs/release-notes/v2.166.0.md 含 hook 条目（修复
    systemMessage 用户提示意外进入 模型上下文、修复命令型 hook 输出提示信息时卡住），与本轮新增段落方向一致，但属于发行记录与其他
    主题（configuration / mcp / native_plugins / local_transcripts），本轮不作为 hooks
    引用、不改写 其他主题章节。
  - 版本映射：本轮不新建任何软件版本映射。来源为未带版本号的文档仓库，未验证任何发行版二进制行为， 沿用来源级知识表述。
  - review_status 保持 pending：hooks.output 改写了已发布的 stdout 契约（新增
    hookSpecificOutput .additionalContext 与纯文本兜底的边界），属需独立复核的情形；hooks.conditions
    的 Mods 启用闸门 复核仍由 audit-codebuddy-ce6431f3 承担，本审计通过 pending_audit_refs
    引用该未结案审计。
  - 本轮修正后的候选章节未获独立复核批准，已移出交付候选并作为任务工件保留在巡检临时目录；本审计的影响范围已收窄到仍在库内的章节小节，待复核问题继续
    pending。
