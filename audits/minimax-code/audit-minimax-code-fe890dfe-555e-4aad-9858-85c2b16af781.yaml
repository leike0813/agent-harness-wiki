investigation_notes:
  - >-
    本轮 sources:scan 报告 changed 的登记来源有两个：source-minimax-code-repo 从 c8a39a5a
    前进到 564e9166，source-minimax-code-npm 观察为 0.6.2。五个官方文档来源
    （features、configuration、reference、security、faq）内容 hash 全部未变。
  - >-
    扫描器给出的 impacts 覆盖全部七个主题，理由是「shared or unknown impact; investigate all
    themes」——因为本次 check 没有 changed_paths，扫描器无法收窄范围。已用来源工作区
    ws-564e9166d81f-850281bc-9b60-44c1-ac57-4981809f0242 打开 commit 564e9166 实际比对
    c8a39a5a..564e9166：77 个文件、+3881/-2085，其中绝大多数属于 TUI 渲染与交互
    （packages/tui 下的 transcript、engine、shell、renderer），不落在七个固定问题内。
  - >-
    实际影响两个主题。custom_providers：packages/shared/src/llm-error-classifier.ts 新增
    refusal 信号（安全拒答同时打 refusal 与 content_filter，命中后提前返回，
    不再走状态码与网络启发式），toLLMMetricErrorKind 归为 content_filter，
    classifyLLMErrorToCode 对拒答直接返回 null；packages/agent-core/src/pi-turn-runner/llm-retry.ts
    让 BYOK 的 retryAllErrors 兜底不再覆盖拒答；third_party/pi-mono/packages/ai/src/providers/anthropic.ts
    保留 stop_details 的 category/explanation 并按 stop_reason: refusal 抛出；
    openai-completions.ts 移除「有工具历史就补 tools: []」的兼容补丁。
    configuration：packages/config/src/config.ts 的预设 defaultModel 由
    minimax/MiniMax-M3 改为 minimax/MiniMax-M3.1-Flash-Preview。
  - >-
    复查后判定不受影响的五个主题：skills、mcp、hooks、native_plugins 的 changed 文件都在
    packages/tui 渲染层或测试里，没有触及这些主题的入口、格式、加载或生命周期机制；
    custom_agents 的变更集中在 packages/agent-modules/goal 与 local-runtime-v2 的
    goal 工作流资产（accepted complete 不再结束 Turn、改为写一条最终回复），
    但 goal 是主代理的内置工作流模块，既不是用户自定义代理定义（数据目录 agents/<名称>/agent.md），
    也不属于 explore/worker/verifier 三个规范子代理角色，其发现、解析、覆盖与委派机制均未改变，
    因此不构成 custom_agents 已发布答案的修订。据此移除了这五个主题的 impact。
  - >-
    顺带记一条相邻变化，未写入章节：ERR_SSL_BAD_RECORD_MAC_ALERT 被加入可重试的网络错误码集合
    （packages/shared/src/llm-error-classifier.ts），只影响重试分类的内部集合，
    现有 providers.retry 引用仍准确覆盖该小节的默认重试策略陈述。
  - >-
    npm 来源观察到 0.6.2，但本轮无基线可比对（与 kimi-code 同样的 npm_release 快照缺口），
    且 npm 版本变化本身不构成章节变化或源码到包的映射。受管包刷新属于 harness-binary 职责，
    delivery=pr 轮次不运行 pnpm managed:packages，故未更新
    knowledge/minimax-code/artifacts/artifact-minimax-code-npm.yaml，也未制造版本映射。
  - >-
    本轮新增快照 snapshot-minimax-code-repo-20261003 与对应 git_source_file 原件记录
    artifact-minimax-code-repo-20261003，固定到 564e9166；README.md 内容 hash 与上一版一致，
    说明本次变更不涉及仓库入口文档。
  - >-
    本轮没有来源互斥、没有新来源推翻已发布的配置步骤、没有跨主题关键加载机制反转，
    属于普通更新，按第 4 节自检后结案，未触发第二 Agent 独立复核。
