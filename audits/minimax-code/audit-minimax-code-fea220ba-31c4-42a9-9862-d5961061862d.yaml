  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:55:11.429Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - 按已发布章节引用逐条核对：6 条已发布引用的行定位在本轮提交上不再命中。受影响主题
    configuration、custom_agents、custom_providers，受影响小节
    agents-overrides-limits、config-sources、providers-diagnostics、providers-entry、providers-forwarding-responses、providers-protocol。
  - Git 来源 changed 的 61 个文件中有 8 个被章节引用，逐个比对后确认：docs/installation.md 与 README.md
    把 npm 默认版本从 0.4.12 更新为 0.6.9
    并同步数据目录说明，packages/local-runtime-v2/src/service/model-system/connectivity/test-connection.ts
    改动连接测试的 provider 分支，docs/tui-capabilities.md 与 docs/examples.md 补充说明。
  - 结论（configuration/config.sources）：data-dir.ts 本轮未改；getDataDir() 的五级解析顺序、
    getConfigPath() 的 `<data-dir>/config.yaml`、MINIMAX_DATA_DIR 优先于
    MAVIS_DATA_DIR 均保持原样；docs/installation.md
    仅在版本号与新数据目录说明上替换（0.4.12→0.6.9），数据目录表仍为 ~/.minimax。config.ts 的引用整体下移 10
    行，属位置变化。答案不变，保留 minimax-code-cli-configuration-v3，不新建 edition。
  - 结论（custom_agents/agents.overrides、agents.limits）：变更文件不含 agent 定义、
    canonical-tool-policy、subagent-roles、background-task 生命周期；能力覆盖/交集、工具天花板、
    task 子会话屏蔽、准入与停止预算均无改动。答案不变，保留 minimax-code-cli-custom_agents-v2。
  - 结论（custom_providers）：da22f11 新增第四种 API 格式 google-generative-ai（客户端
    MCODE_PROVIDER_API_FORMATS 与运行时 MODEL_PROVIDER_APIS 同步），TUI 引导增加该选项； 连接测试对
    google-generative-ai 改走 Pi 的 completeSimple 流式通道，默认超时 30 秒 （其余 10 秒），并以
    stopReason/内容判定 provider_error/invalid_response； resolution/model-ref.ts
    对该格式不注入 thinking 补丁（Pi 拥有 Google 思考参数）； shared/opencode-go-headers.ts 的头覆盖从
    /zen/go 扩到 /inference/go。 docs/examples.md 新增 Google 端点示例（base URL 写到 API
    版本、x-goog-api-key）。 官方 CLI 文档（configuration/features/faq 快照）与仓库 README
    仍列三种格式， 按版本/分发边界并列写入，不建软件版本映射。已新建完整 minimax-code-cli-custom_providers-v3
    并切换本产品选择。
  - 引用策略：新 edition 只对发生实质变化的证据新建 reference 与
    snapshot-minimax-code-repo-20261022（commit da22f11、git_source_file，未保留
    checkout）； 未改动的源码与官方文档引用沿用原 snapshot，其摘录仍逐字命中对应页面（configuration/features/
    reference/security 四份文档的引用摘录经比对仍在，faq 仅 Accordion 标记改为引用块）。
  - 未处理项与理由：npm 0.6.11→0.6.12 只记录身份，未下载包字节，不据此改写任何规则； 本轮未触及的 topic 与 question
