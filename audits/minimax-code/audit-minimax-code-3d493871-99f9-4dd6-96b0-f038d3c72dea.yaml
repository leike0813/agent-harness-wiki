  - 比较窗口：每份文档的新鲜保留原件是 2026-09-30T17:03Z 抓取的
    snapshot-minimax-code-docs-*（features a1230063、configuration
    9429573a、reference e35d9d1a、security a651d452、faq 39fd1c25），观察文档首次缓存于
    2026-11-03T02:02Z，并在 2026-11-24T14:09:42Z 的检查中以 code.minimax.io
    同路径确认。只能声明该窗口内的变化；更早的差异未保留原件，不作判断。
  - 主机迁移 agent.minimax.io -> code.minimax.io：registry 只新增 observation_url，url
    身份未改；页面内部链接仍指向 agent.minimax.io。迁移本身不计知识变化。
  - 纯渲染差异（不计知识变化）：features/configuration/reference/security 去掉 <div
    className="code-docs"> 包裹并取消整体缩进；faq 的 <AccordionGroup>/<Accordion> 改为引用块
    '[accordion]'；reference 的相对链接改为绝对链接。标题未变：features 仍为 'Features and
    configuration'，faq 仍为 'Troubleshooting'，保留原件已是这两个标题，本轮窗口内没有改题。features
    在保留原件里就已包含 providers/plugins/ACP 小节，本轮没有发生把 configuration 内容并入 features
    的结构变化。
  - 实质变化 1：configuration、features、reference 的 provider 格式列表新增第四种 api-format
    'google-generative-ai'（Google Gemini）；configuration 另加 'base URL 只有主机名时自动补
    /v1beta'。据此新建
    snapshot-minimax-code-docs-features-20261124、snapshot-minimax-code-docs-configuration-20261124（pinned
    观察 hash）与两条 reference，并交付 minimax-code-cli-custom_providers-v4：v3
    中『官方文档仍只列三种、第四种仅作来源级知识』的边界被推翻，改写为文档与仓库允许列表在四种格式上一致；仍不建立软件版本映射（文档无版本号，npm
    0.7.9 未验证）。旧 edition v3 与全部旧 snapshot/reference 未改动。
  - 实质变化 2（不建章节）：features 'CLI and desktop boundaries'、security 'Protocol
    boundaries'、faq 'Sessions, terminals, and desktop boundaries' 均改述 Computer
    Use——交互式 TUI（macOS/Windows）可经官方插件使用，headless、ACP、计划任务与 subtasks
    不能控制计算机，同一时间只允许一个会话控制；Browser 与桌面能力仍不在
    CLI。八类固定问题没有覆盖『按界面可用的桌面能力』，现有章节也未陈述相反结论，因此只记录为审计观察，不改
    configuration/custom_agents/native_plugins 的选择。
  - 实质变化 3（不建章节）：features 斜杠命令表中 /provider 的用途从「查看 providers 或编辑 MiniMax
    凭据」改为「查看 providers、删除第三方连接或编辑 MiniMax 凭据」。这是界面文案细节，不改变 providers.entry
    的入口/作用域答案。
  - 命令名核对：reference 的 mcode、mcode exec、mcode acp、mcode init，以及
    provider/plugin/update 命令块逐字未变；唯一变更是 provider add 的 --api-format 取值枚举增加
    google-generative-ai。
  - 逐主题排除依据：configuration 的 Configuration layers、Data directory、Runtime
    settings、Sign-in、Proxy、Skills and MCP、Plugins、Configuration checks
    各节文本未变（仅渲染差异），config.sources/runtime/trust/defaults/migration/diagnostics
    全部维持；mcp 与 skills 引用的 config-checks、skills-mcp 段落未变；native_plugins 引用的
