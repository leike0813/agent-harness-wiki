investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 configuration 的固定问题
    config.defaults、config.runtime、config.diagnostics。固定来源为 pinned 工作区
    ws-e798b460f4d8-4f63576c-a12c-45aa-ba1d-7ab1c4fcaef5，commit
    e798b460f4d8603ce732e5d319d63c8018ef6cad，未重扫来源。
  - "仓库单提交 e798b46（feat(tui): report program status with OSC 7501，18
    个文件，+399/-18），与章节已引证据文件重合的有 packages/config/src/tui-config.ts 与
    docs/tui-capabilities.md。"
  - "决定性结论：该提交不是纯输出变化，它新增了用户可配置项。packages/config/src/tui-config.ts 第 46-47 行新增
    TuiConfig.programStatus?: boolean（注释 Defaults to true），第 117 行以 typeof
    tui.programStatus === 'boolean' 条件透传；仓库文档 docs/tui-capabilities.md 第 33 行写明
    Set `tui.programStatus: false` to disable them，第 46 行的示例配置块新增 programStatus:
    true。因此任务里「不新增用户可配置项则无需维护」的排除条件不成立。"
  - 逐文件判定（18 个变更文件）：packages/config/src/tui-config.ts
    新增配置键，改动；docs/tui-capabilities.md
    新增配置说明与示例，改动；packages/tui/src/tui/shell/status-line-config.ts 第 11、36
    行把该键接入展示配置读取，是配置面而不是仅渲染；packages/tui/src/tui/launcher.ts 第 419-421 行把值透传进
    TUI 应用选项，配置面；packages/tui/src/types/tui-app.ts 第 70-71 行新增 programStatus
    选项与注释，配置面；packages/tui/src/tui/app-composition.ts 第 178-181 行按 isTTY &&
    programStatus !== false
    构造上报器，是配置生效判定；packages/tui/src/tui/platform/terminal-program-status.ts
    为新增的纯发射模块（65 行，只有状态映射表与 terminal.write
    调用），属输出实现；packages/tui/src/tui/app.ts、packages/tui/src/tui/platform/terminal-title.ts、packages/tui/src/tui/controller/product/chrome-flow.ts
    只做发射与标题渲染接线，无新配置入口；packages/tui/src/tui/controller/interaction/interaction-flow.ts
    去掉 agentStatusLineItems
    门控，属状态栏项与结构化状态解耦，不新增配置键；packages/tui/src/tui/automation/status-store.ts 新增
    loginRequired 派生事实，不触及配置读取；release/public-source.json 仅登记新文件；三份测试文件只覆盖上述行为。
  - packages/tui/docs/status-line-config.md 本次只改了一句 Fatal errors 说明：登录阻塞的 error
    在同一会话内登录成功后清除。这是 build-mode 状态栏协议的语义与渲染说明，不含任何配置键或加载路径，与本轮三道 configuration
    固定问题无关，因此不作为配置证据引用。
  - 逐题判定：config.defaults 变化（新增默认开启的 tui.programStatus，并写明布尔-only 解析、启动期一次性读取与
    isTTY 门），已写入新章节版本 minimax-code-cli-configuration-v4；config.diagnostics
    变化（该键不在 /reload 的重载范围内，也没有 /doctor 报告项，改后需重启），同版写入；config.runtime 不受影响（该键无
    CLI 参数、无环境变量，只能写在 config.yaml），已在章节内显式写明入口清单不变。三题均 answered，已从
    pending_question_ids
