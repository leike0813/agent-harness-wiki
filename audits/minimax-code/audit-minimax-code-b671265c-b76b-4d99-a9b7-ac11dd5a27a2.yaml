  - >-
    本轮任务是 local_transcripts 首采（此前七章不含本地 Transcript）。scan 报告 changed
    的来源是 source-minimax-code-repo（564e9166 → 185277170817）与 source-minimax-code-npm
    （0.6.2 → 0.6.3）；五个官方文档来源内容 hash 未变。checks 保持 scan 原样未改写。
  - >-
    固定来源与工作区：只读 pinned 工作区 ws-185277170817-379b6c18-85ea-4a9d-9f33-2651723a14ee，
    commit 185277170817c50e9dd5339c2893e850d610fa1e，观察时间 2026-10-06。新增 57 条
    git_source_file 引用、26 个文件 artifact 与 26 个逐文件 snapshot（一个文件一个 snapshot，
    locator.file 与 artifact.file 一致），全部经生成器生成，excerpt 为 pinned 源码的真实行区间。
  - >-
    未使用官方文档原件：项目根 archive/minimax-code/ 在本工作区不存在，按契约不得新建
    archived_document 记录，因此本章没有任何文档来源证据，也未写 mappings/（源码 commit 不
    证明发行包版本行为）。
  - >-
    基线到观察值的差异对本地 Transcript 的影响：45 个变更文件中没有一个落在
    packages/local-runtime-v2 的 infra/file、infra/db 或 service/session-system 存储模块；
    唯一触及会话生命周期的是 turn-system/compaction（compact-context.ts、
    checkpoint-provider.ts、contracts.ts）新增的 provider 图片上限拒绝恢复路径，已写入
    transcripts.lifecycle（影响压缩能否成功，不改变已落盘记录的形状）。
  - >-
    状态判定：transcripts.scope、location、naming、format、lifecycle、database、cleanup、
    diagnostics 为 answered；transcripts.schema 为 partial（message 字段级 schema、附件字节
    实际位置、旧记录迁移规则未由本轮来源覆盖，已在章节内列出具体缺口）；transcripts.archive
    为 partial（已查 packages/tui/src/cli 命令注册、mavis 工具子命令表与数据库备份模块，
    未找到用户可见的会话归档开关或导出命令，不据此断言不支持）。
  - >-
    本主题十题均已给出可用答案，因此 pending_question_ids 未新增 local_transcripts 条目；
    其它六个主题遗留的 pending 题按契约保持不动，review_status 保持 pending，未写
    reviewed_by/reviewed_at。
  - >-
    npm 来源观察到 0.6.3，但本轮不做源码到发行包的映射，受管包刷新属 harness-binary 职责，
    delivery=pr 未运行 pnpm managed:packages，故未新增 artifact-minimax-code-npm 记录。
  - >-
    删除闸门只在拥有它的 local-runtime 进程内协调、无跨进程互斥，这是本章明确写出的清理前置
    条件：手动删除文件或库行前需先退出使用同一数据目录的其它 MCode 进程。
