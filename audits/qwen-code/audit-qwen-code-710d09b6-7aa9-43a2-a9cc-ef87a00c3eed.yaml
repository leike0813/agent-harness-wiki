  - "两个来源之间是 1 个提交、1321 个文件的合并提交（fix(serve): keep Hosted Sessions available across Shell publisher drain and lost acknowledgements #13304）。按 changed_paths 逐目录复查：packages/web-shell、packages/sdk-java、docs/design、integration-tests 与 scripts 的改动不落在七个主题的 CLI 界面上；packages/cli/src/serve、packages/core/src/managed-runtime 与 packages/channels 属 daemon/托管运行时与渠道能力，同样不在本产品已登记的 cli 界面范围内。"
