  - local_transcripts 首采（delivery=pr）：固定来源为仓库 QwenLM/qwen-code 的提交 18dc7775e5a2d5d49edda57096ca7265803259cf（本轮 sources:scan 观察，抓取时间 2026-10-06T04:34:54.138Z），源码调查在 coordinator 已打开的只读 pinned 工作区中进行，未新建或释放任何工作区，未写入临时路径。
  - 新建章节 qwen-code-local_transcripts-v1，覆盖 6 个小节与十个 transcripts.* 问题；状态为 answered 7 题（location、naming、format、lifecycle、database、archive、diagnostics），partial 3 题（scope、schema、cleanup），无 unknown 与 not_applicable。
  - 本轮新增 14 个 git_source_file artifact 与 14 个 source_revision snapshot（每个被引用的源码或文档文件各一个快照，reference 的 locator.file 与其 snapshot 绑定 artifact 的 file 逐条一致），新增 45 条 reference，全部 excerpt 由固定提交原文按声明行区间逐字截取、长度在 1-800 之间、sha256 由真实文件字节计算；诊断命令另校验了行区间命中与无孤儿 artifact。
  - 只调查 catalog 中 qwen-code 的 cli 界面；vscode 与 jetbrains 两个已声明界面本轮无证据，未写答案，由查询侧派生为 not_investigated。提交号只代表源码树，本轮无逐小节证据对应 npm 发行包版本，未写 mappings/。
  - 固定来源内部发现两处需要维护者注意的分歧，未在正文中择一断言：（1）packages/core/src/services/sessionService.ts 第 855 行的类注释仍写 ~/.qwen/tmp/PROJECT_ID/chats/，而同文件的 getChatsDir() 与 docs/users/features/headless.md 都指向 projects/SANITIZED-CWD/chats，正文按可执行代码与官方文档给结论并标出该注释为过期；（2）docs/developers/daemon/08-session-lifecycle.md 称批量删除保留 file-history 快照，而 SessionService.cleanupRemovedSessionFiles 显式递归删除 GLOBALQWENDIR/file-history/SESSIONID，transcripts.cleanup 因此记 partial。
  - 本轮未运行 publish、chapters:update、sources:scan 或 managed:packages，未切换任何发布指针，未执行真实 harness，未读取维护者真实会话文件；仅修改 candidate root 内的 chapters/、references/、snapshots/、artifacts/、registry/chapter-current.yaml 与本审计文件。
  - 本主题十题均已给出可用答案且无需退回 blocked，故在 candidate 的 registry/chapter-current.yaml 追加 local_transcripts selection。
