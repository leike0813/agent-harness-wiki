  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:55:45.803Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - 按已发布章节引用逐条核对：18 条已发布引用的行定位在本轮提交上不再命中。受影响主题
    configuration、local_transcripts、mcp、native_plugins，受影响小节
    config-defaults、config-diagnostics、config-overrides、config-sources、mcp-entry、plugins-api、transcripts-recording-scope。
  - Git 来源 changed 的 3347 个文件中有 14
    个被章节引用，逐个比对后确认机制级变化：packages/cli/src/config/settings.ts 与
    packages/cli/src/config/settingsSchema.ts 改动设置与
    schema、docs/users/configuration/settings.md
    同步更新、docs/users/extension/mods.md 改动扩展机制、docs/users/features/headless.md 改动
    headless 行为。
  - 本轮派发入口：topic configuration、local_transcripts、mcp、native_plugins；固定问题
    config.defaults、config.diagnostics、config.overrides、config.sources、mcp.entry、plugins.api、transcripts.scope。
  - "结论（configuration）：settingsSchema.ts 新增
    ui.allowedApprovalModes（array、mergeStrategy REPLACE、默认 undefined、仅
    User/System/SystemDefaults、showInDialog 假）、model.loopProtection（enum
    warn/stop/off、默认 warn、requiresRestart 真）与 experimental.generatedUi（布尔、默认
    false、requiresRestart 真），并把 experimental.mods 改名为 Mods
    (Experimental)、showInDialog 改为真、描述扩展为本地交互终端与 headless；settingsUtils.ts 把 {
    section: 'ui', key: 'allowedApprovalModes' } 加入
    WORKSPACE_RESTRICTED_SETTINGS；config.ts 的 resolveLoopProtection 对非法值告警一次并回落
    warn。据此新建 qwen-code-cli-configuration-v6：config.defaults
    补三组默认值，config.overrides 增加例外三（运维作用域 + REPLACE 合并 + 受限键剥离），config.diagnostics
    增加非法值告警与 /settings Mods 开关两个可观察信号，config.runtime 修正“Mod
    只在非交互会话生效”的旧结论。config.sources 的层级、路径与来源入口未变，保持 answered。"
  - 结论（native_plugins）：Mods 运行面扩展到本地 Ink/OpenTUI 交互终端，InteractiveModSession 仅在
    experimental.mods 为真且 config.isInteractive() 为真时创建；ModSession.allowed()
    增加“交互性与终端输出面一致”的约束，其余门控与 headless 相同；交互宿主字段（surface terminal、isInteractive
    true、composer origin、presentation）、交互工具中间件、60 秒 root 限制与 64 次尝试上限、Esc
    撤销、初始化失败恢复与 worker 终止后需重启 CLI 等边界均有同提交文档与源码证据。据此新建
    qwen-code-cli-native_plugins-v3 并改写 plugins-api 的 Mod 段落。
  - 结论（mcp）：settingsSchema.ts 的 mcp 分组、mcpServers 作用域文件与 qwen mcp add
    入口在本轮无变化，config.ts 只新增 qwen daemon 子命令注册；mcp.entry 保持原 edition 与 answered
    状态。
  - 结论（local_transcripts）：chatRecordingService.ts 新增消息组删除（Web Shell/daemon 路由，重写
    transcript 并由写租约替换）、压缩检查点新增
    contextPrefixLength/summaryPrefixLength/directoryContextIndices、ChatRecord
    新增 clientInitiatedSkills（仅 hosted-workspace
    会话写入）；sessionService.ts/agent-transcript.ts 无新增
    subtype，general.chatRecording 开关与本地 CLI 记录范围不变。这些属于 cleanup/schema/hosted
    路径，未改变 transcripts.scope 的答案（记录哪些内容、由哪个开关控制、哪些内容另行存放），因此保留
    qwen-code-local_transcripts-v3。
  - 排除项：docs/users/features/headless.md 的新增章节说明 --safe-mode 保留内置工具并忽略 settings
    来源的 tools.eager、--max-tool-calls 0 不移除工具 schema；它属于 headless
    工具预算与排障指导，未改变本轮四个配置固定问题的来源、覆盖或默认值结论，故未写入章节。docs/users/configuration/settings.md
    对 skills.directories 的补充只是为已存在的设置键补文档，归属 skills 主题且本轮不在范围内，未改写。
  - review_status 置为 reviewed
    是因为本轮固定问题（config.defaults、config.diagnostics、config.overrides、config.sources、mcp.entry、plugins.api、transcripts.scope）全部完成；pending_audit_refs
    按要求原样保留，其中 888916ad 仍列有 config.runtime/config.trust 等历史 pending
