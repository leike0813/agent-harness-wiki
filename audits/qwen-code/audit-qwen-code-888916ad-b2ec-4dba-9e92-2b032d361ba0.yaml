      to disable for this invocation），parseArguments 按逗号拆分，loadCliConfig
      在 allow/exclude if-else-if 链之后独立并入 excludedMcpServers。并入语义
      与既有设置文件的整体替换/并集规则都不同，故 config.overrides 的已发布
      表述需新增第三类合并规则；settingsSchema.ts 同提交新增 UI 布尔键
      ui.arrowKeysScrollTranscript（默认 false、requiresRestart false、
      showInDialog true），docs/users/configuration/settings.md 的 ui 表新增
      对应行，故 config.defaults 的分组清单需更新。config.ts 的 CliArgs 字段
      与 parseArguments 仅新增这一个选项，配置文件路径、环境变量、加载顺序与
      迁移表均未触及，故 config.sources 与 config.migration 关闭为不受影响。"
