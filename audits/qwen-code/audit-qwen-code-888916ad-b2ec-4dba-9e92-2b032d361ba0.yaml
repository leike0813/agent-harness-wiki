investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 configuration 与 mcp 的固定问题。
  - "仓库单提交 6212189（feat(managed-agent): Add the public-event transport and the
    wake/materialization consumers，503 个文件），与章节已引证据文件重合的有
    packages/cli/src/config/{config,settingsSchema}.ts、packages/core/src/servic\
    es/sessionService.ts、docs/users/configuration/settings.md、docs/developers/d\
    aemon/08-session-lifecycle.md。"
  - packages/cli/src/commands/mcp/add.ts 与 config.test.ts 同步改动，属 MCP
    入口线索；docs/design 下的 managed-agent 设计文档为设计材料，不作为已发布机制证据。

  - 本轮 worker 范围收窄为 configuration 与 mcp 两个主题的六个固定问题（config.sources、
    config.overrides、config.defaults、config.migration、mcp.entry、mcp.definition），
    逐文件核对入口后其余主题维持 pending，未做全库重审。
  - 逐文件核对结论：packages/cli/src/config/config.ts 的 diff 只有两处新增——CliArgs 的
    disableMcpServer 字段与 parseArguments 的 --disable-mcp-server 选项，加上 loadCliConfig
    末尾的排除集并入块；没有任何删除或修改，故既有配置文件解析、设置合并与迁移代码路径不变。
  - packages/cli/src/config/top-level-options.ts 只在 allowed-mcp-server-names 之后插入
    disable-mcp-server 的选项元数据（type array + 一句说明），未改动其它选项。
  - packages/cli/src/config/settingsSchema.ts 的 diff 只有一处新增：UI 分类下的
    arrowKeysScrollTranscript 布尔键；无删除、无既有键的默认值或作用域变化。
  - packages/cli/src/config/config.test.ts 与 packages/cli/src/config/hot-reload.test.ts 的
    新增用例是本轮 --disable-mcp-server 的行为证据（allow-then-deny、safe mode 仍生效、
    settings 编辑会丢掉启动期排除项并标为 CHARACTERIZATION/#14009），不是独立机制变更。
  - packages/cli/src/commands/mcp/add.ts 的 diff 是把 includeTools/excludeTools/oauthScopes
    三处列表解析收敛为 splitCommaList，并新增三处调用点；字段名、默认值、传输自动探测
    （URL → http、否则 stdio 的 middleware）与路径/作用域处理均未变，故 mcp.definition 只补
    边界说明。add.test.ts 新增 7 个用例 + 1 个 oauth 用例，全部围绕该归一化函数的行为。
  - packages/core/src/services/sessionService.ts 的 diff 是把两处 file_history_snapshot 记录
    的判断收敛到 session-file-history-state.ts 导出的 readFileHistorySnapshotPayload，属纯
    重构（无判断条件变化），且该文件属 local_transcripts 主题，不在本轮范围内，故不改章节。
  - docs/developers/daemon/08-session-lifecycle.md 只在 replay 快照的字段列表补入
    lifecycleReplay/lifecycleReplayIncomplete 两个字段，属 daemon/托管 Agent 传输层，
    不涉及 configuration 与 mcp 的已发布机制，本轮不作为证据也不改这两个主题的章节。
  - docs/users/configuration/settings.md 的 diff 为两处：ui 表新增 ui.arrowKeysScrollTranscript
    一行；model.maxToolCallsPerTurn 的描述文字补入收敛提醒与 loop-detected 对话框同时抑制
    上限与提醒。两者都不改变键名、默认值与作用域：前者已按新键写入 config-defaults，后者不
    落在本轮六个固定问题的断言范围内（config.migration 与之无关），故不另起章节版本。
  - docs/users/reference/keyboard-shortcuts.md 与 docs/users/support/troubleshooting.md 的改动
    只是把新设置 ui.arrowKeysScrollTranscript 写进既有排障条目，属同一新键的用户说明，已由
    settingsSchema.ts 与 settings.md 的引用覆盖，不单独成节。
  - packages/cli/src/serve/hosted-mcp-session.ts 与 hosted-mcp-session.test.ts 的改动
    （reconcileEffects/closeResources 拆分、lifecycleAuthority 门控）是托管 Agent 的宿主会话
    生命周期，不是 settings.json 的 MCP server 定义或入口面，本轮不纳入 mcp 章节。
  - 显式排除：docs/design/** 下的 managed-agent 设计文档（含 2026-10-12-managed-agent-event-transport-mq2）
    为设计材料，未作为任何 configuration 或 mcp 结论的证据。
  - 未创建任何软件版本映射：本轮只有仓库 HEAD 变化，npm 侧 0.25.1 未变，不从源码 HEAD 推导
    发行版行为。
  - review_status 保持 pending：本轮为 config.overrides 新增一类合并机制并同时改写 mcp-entry
    的已发布表述（新增命令行排除入口），属跨主题的关键配置/入口机制变化，需独立复核；且
