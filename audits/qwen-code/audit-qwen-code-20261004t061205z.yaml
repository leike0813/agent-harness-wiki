investigation_notes:
  - 本轮协调者语义 triage 结论：maintain。已交回隔离候选做定向维护。
  - 本轮 qwen-code 由 2c591ecc 前进到 35616f3b；同批还有 docs/design/2026-09-11-agent-project-host-entry.md 的 1 行改动与若干 hosted-harness serve 内部改动。
  - 定向核实结论：agents.entry、agents.roles、agents.limits 三个固定问题的已发布答案不变，不新建 edition。逐题按 docs/topic-questions.md 口径核对，而非按目录名推断。
  - 改动语义为 Host 结果提交的幂等判定：新增 ThreadRun.hostResultReceipt（attempt/leaseId/digest 的 sha256），只有与回执完全一致的重发才返回 alreadyApplied；结算改写了上报状态（run 已 cancelling 而 Host 上报 completed）或已被恢复/取消先行结算的迟到结果返回 stale_lease，且不再把 token 计入 usageByRound。design 文档同段同步重述了这一语义。
  - workspace-agents 承载的是协作线程在已注册 Qwen Host 上的执行位置，不是用户可定义或可配置的 agent 形态：用户态 Subagent 定义与 frontmatter 解析在 packages/core/src/agents/runtime/，本提交未触及；agents.entry 的存储位置、/agents create 与 /agents manage 入口、扩展 agents/ 目录、agents.roles 的命名子代理与 fork 区分、agents.limits 的软警告与递归禁止均无变化。
  - 新增状态无对外暴露面：alreadyApplied 与 stale_lease 的唯一非测试消费方是内部 serve 协议，由 packages/cli/src/serve/routes/agent-hosts.ts 返回、packages/cli/src/serve/agent-host-client.ts 处理；hostResultReceipt 只写入 workspace-agents 内部持久化的 ThreadRun，未进入任何 CLI 命令、配置项或用户可见的 agent 状态枚举。
  - 本提交未改动任何 docs/users 用户文档；docs/design/2026-09-11-agent-project-host-entry.md 及其 .zh-CN.md 各改 1 行，Limits 一节未变。
  - 证据限于固定提交 35616f3b 的源码树与设计文档，不代表任何已发布包版本的行为；本轮未建立版本映射，保留来源级知识。
  - 同批的 packages/cli/src/serve/hosted-harness-*、hosted-runtime-recovery.ts、packages/sdk-java/managed-agent-server/** 与 docs/design/2026-10-0* 等路径未在本轮范围内评估；其语义涉及托管 harness 会话与 Java 端 managed agent server，若后续判定构成 custom_agents 知识影响需单独交回。
