- 本轮 triage 分类：maintain；四个主题的固定问题（agents.entry/agents.invocation/mcp.entry/mcp.transport/config.sources/config.overrides/transcripts.format/transcripts.schema）均已在固定源码上取得证据并写入新 edition。
- source-qwen-code-repo 由 4bffa67 变为 29aef7d（665 个文件）；本轮只调查上面四组入口，其余改动（release/java workflow 脚本、web-shell、托管会话运行时等）按任务排除范围未纳入判断。
- 变更路径与答案的对应关系：config.ts 注册 `qwen agents`（agents.entry）→ commands/agents/join.ts 与 session-send-mcp*.ts（agents.entry / mcp.entry / mcp.transport）→ serve/session-agents 适配器（mcp.entry）→ settingsSchema.ts 的作用域与额度描述（config.overrides / agents.limits）→ chatRecordingService.ts 与 jsonl-utils.ts（transcripts.schema / transcripts.format）。
- 四个新 edition 固定到源码提交 29aef7d：qwen-code-cli-custom_agents-v3、qwen-code-cli-mcp-v3、qwen-code-cli-configuration-v3、qwen-code-local_transcripts-v2；未改小节沿用各自 edition 原有的固定引用。
- 所有新增引用都绑定 git_source_file 快照（snapshot-qwen-code-29aef7d-*），只记 commit、仓库相对路径与内容哈希，不含工作区临时路径。
- agents.limits 与 mcp 之外的未覆盖问题（agents.format/roles/overrides/diagnostics、mcp.definition/auth/lifecycle/capabilities/exposure/diagnostics、config.sources/runtime/trust/defaults/migration/diagnostics、transcripts 其余问题）本轮未重开调查，沿用上一版答案；旧审计中这些主题的 pending 状态由 pending_audit_refs 继续承载。
- npm 来源 0.25.0 未变，且本轮证据只能证明源码树行为，因此不写任何软件版本映射。
