investigation_notes:
- 本轮 triage 分类：maintain
- 'source-gemini-cli-repo 由 fb972b2 变为 44d764e（fix(auth): prevent infinite verification and OAuth retry
  loops），79 个文件。'
- 命中已登记引用：packages/cli/src/config/settingsSchema.ts 与 schemas/settings.schema.json、docs/reference/configuration.md
  新增 telemetry.otlpHeaders（对象）与 GEMINI_TELEMETRY_OTLP_HEADERS（JSON 对象串或 k=v 列表，并回落 OTEL_EXPORTER_OTLP_HEADERS）；两处
  oauth 设置块新增 authorizationResponseIssParameterSupported（RFC 9207 iss 校验开关）。
- 新建 edition gemini-cli-cli-configuration-v2，v1 原样保留；当前选择改指 v2。
- 新增小节 config-per-key-precedence，把两处"多来源合并"写成逐键规则，并给出最小 JSON 示例（凭据用占位值）。
- 证据全部取自 pinned workspace ws-44d764ee5796-833c623d-b94d-449c-8fc3-974e8345d270 的 commit
  44d764ee579610bf73c43107f5e0422cd92588b9，每条 reference 记录一个 git_source_file artifact（commit、
  仓库相对 file、真实 content_sha256），未写入临时路径。
- 官方文档来源 source-gemini-cli-docs 与 source-gemini-cli-npm 在本工作树内没有可比较的旧原件
  （archive/ 下没有 gemini-cli 目录），因此不能判定其"无影响"；只把仓库内 docs/ 树的同提交原文作为
  source-gemini-cli-repo 的 git_source_file 证据，官方站点与已发布 npm 包的行为仍未验证。
- npm 观察为 0.62.0 → 0.63.0，本轮不据此建立任何版本映射，也不修改已有章节的版本声明。
- 排除项核对：core/src/core/{client,geminiChat}.ts 与 services/chatRecordingService.ts 的改动是会话
  重放/工具调用清理与初始化幂等，未触及 settings 加载、环境变量或 schema 解析入口，因此不纳入配置章节；
  未据此扩大范围到 local_transcripts 或其他主题。
- A2A 的 auth-provider/oauth2-provider.ts 改动（并发认证合并、401 重试计数）属 mcp/custom_providers
  的认证机制，本轮固定问题只覆盖 configuration，不写入；如需覆盖由协调者另开范围。
- config.overrides 仍为 partial：新增的两处合并顺序已确定，但通用的"数组、空值、删除标记"语义在固定来源内依旧没有可读策略表。
- 本轮未执行 sources:scan、sources:workspace open、publish、chapters:update 或任何网络抓取。