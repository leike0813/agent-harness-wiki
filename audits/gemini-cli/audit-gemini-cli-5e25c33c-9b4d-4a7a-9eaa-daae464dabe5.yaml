investigation_notes:
  - 本轮 triage 分类：maintain；只读观察时间 2026-10-22T12:54:18.777Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns。
  - 按已发布章节引用逐条核对：35 条已发布引用的行定位在本轮提交上不再命中。受影响主题
    configuration、custom_agents、custom_providers、hooks、mcp、native_plugins、skills，受影响小节
    agents-diagnostics、agents-entry-format、agents-overrides-limits、agents-roles-invocation、config-migration-diagnostics、config-runtime-defaults、config-sources-overrides、config-trust、hooks-diagnostics、hooks-events-entry、hooks-order-conditions、mcp-entry-definition、mcp-lifecycle-capabilities、plugins-install、providers-entry-auth、providers-forwarding-responses、providers-protocol-models、skills-conditions-diagnostics、skills-discovery-collision、skills-locations-format。
  - Git 来源 changed 的 116 个文件中有 11
    个被章节引用，逐个比对后确认机制级变化：packages/core/src/agents/registry.ts 改动 Agent 注册表（28
    处机制相关行）、packages/cli/src/config/settings.ts 与 schemas/settings.schema.json
    改动设置与 schema、packages/core/src/mcp/oauth-provider.ts 与 oauth-utils.ts 改动 MCP
    OAuth 提供方与工具。
  - 本轮派发入口：topic
    configuration、custom_agents、custom_providers、hooks、mcp、native_plugins、skills；固定问题
    agents.diagnostics、agents.entry、agents.overrides、agents.roles、config.defaults、config.diagnostics、config.migration、config.overrides、config.runtime、config.sources、config.trust、hooks.conditions、hooks.diagnostics、hooks.entry、mcp.entry、mcp.exposure、plugins.install、providers.entry、providers.forwarding、providers.models、providers.responses、skills.conditions、skills.diagnostics、skills.discovery、skills.extensions、skills.format。
  - 语义结论（本轮新建 3 个 edition）：configuration 由 v2 升为 v3、custom_agents 由 v1 升为
    v2、skills 由 v1 升为 v2；三者分别对应 settings.ts 的两遍占位符解析与尽力而为校验、agents/registry.ts
    的“工作区等于 home 时跳过项目层”、skillLoader.ts 的 frontmatter 解析放宽。其余派发主题维持原 edition。
  - configuration 的具体证据：settings.ts `resolveSettings`（891-926）在 `.env`
    前后各解析一次，只有第二遍把校验问题写入
    errors；`coerceValidSettings`（833-878）在整体校验失败时删掉失败属性重跑校验以转换其余字段；`_doLoadSettings`
    （1047-1077、1089-1124）先只用系统与用户设置判定信任、受信后才解析工作区设置；`setTrusted`（365-397）在加载后建立信任时补解析
    工作区原始设置；docs/reference/configuration.md（72-76）明确控制 `.env` 加载的键只能引用 shell 变量；
    schemas/settings.schema.json（4165-4168）新增 `oauth.allowPrivateNetwork`，无
    `default`。
  - custom_agents 的证据：registry.ts 174-181 把项目层加载包在
    `!storage.isWorkspaceHomeDir()` 外层判断内；内置、用户级、扩展层以及 项目层内的信任门禁与
    acknowledged-agents 确认逻辑未变，因此 agents.roles、agents.overrides 未改。
  - skills 的证据：skillLoader.ts 35-36 的 FRONTMATTER_REGEX 接受可选 BOM 与 `---`
    行尾空白并锚定全文；86-130 的简单解析器把 key 匹配改为大小写不敏感、去掉成对引号、支持 `>`/`|` 块标量；190-200 改用
    `readFileWithEncoding` （fileUtils.ts 261-277 按 BOM 识别
    UTF-8/UTF-16/UTF-32）。skills.discovery 的 glob 规则、skills.extensions 的字段、
    skills.conditions 与 skills.diagnostics 的入口均未变。
  - 排除说明：`packages/core/src/mcp/oauth-provider.ts`、`oauth-utils.ts` 与
    docs/tools/mcp-server.md 的改动只是 MCP OAuth 的 `allowPrivateNetwork` 选项与端点校验，归
    mcp.auth（本轮未派发）；mcp.entry 与 mcp.exposure
    的机制不变。custom_providers、hooks、native_plugins 的固定问题不经过被改动的代码路径：settings schema
    只新增同一 OAuth 字段，hooks 配置与插件安装/启用路径未变，因此不新建 edition。
  - 引用策略：新增引用只覆盖本轮改动区域，全部固定到提交 09d81bf116b6f0ef084731dc996aa9d56438bb70 并记录文件
    content_sha256（git_source_file + source_revision 快照，不保留
    checkout）；未变部分的已发布引用保持其 38700b4/44d764ee 快照，不回改。
  - 复核判断：本轮没有来源冲突，也没有推翻已发布的配置操作步骤；文件优先级与合并策略未变，变的是占位符解析时机与校验回退方式，
    属于同主题机制修订，因此按普通更新由作者自检结案。候选 check 已通过。
