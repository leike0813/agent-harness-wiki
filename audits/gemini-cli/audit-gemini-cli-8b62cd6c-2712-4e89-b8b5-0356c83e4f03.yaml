investigation_notes:
  - 本轮按提交 08e9a20f749aefcbda38622ac757899c3d6216e0（2026-11-24）的固定内容核对 configuration/mcp/native_plugins 三个主题；compare diff 为 9b6e0265..08e9a20f，包含已被旧 edition 吸收的中间提交，增量以各章已引固定提交为基线核对。
  - configuration：`docs/reference/configuration.md` 只新增 `model.requestTimeoutMs` 与模型默认数据（auto isPreview、flash contexts），机制变化是前者；默认值文档写 60000，schema default 为 undefined、minimum 1、requiresRestart。
  - configuration：`packages/core/src/config/config.ts` 的 `getRequestTimeoutMs()` 给出三层优先级（env > setting > 实验 flag），并在构造与 refreshAuth 时写入 `updateGlobalFetchTimeouts`；该文件不在初始 22 文件交集内，但它是声明的唯一实现入口，按同一固定提交补证。
  - configuration：`packages/cli/src/config/settings.ts` 的 `migrateBoolean`/`migrateDeprecatedSettings` 现在同时更新运行期 settings 与持久化 originalSettings，目标键已存在时不覆盖原始占位符。
  - configuration：`packages/cli/src/gemini.tsx` 在重新进入沙箱前调用 `resolveFolderTrustForSandbox`，源码注释说明 macOS Seatbelt 不允许沙箱进程访问 trusted folders 文件；仅新增一句信任条件，未改 sandbox 配置字段。
  - mcp：`docs/tools/mcp-server.md` 与 `settingsSchema.ts`/`schemas/settings.schema.json` 的 `oauth.allowPrivateNetwork` 已在上一条已发布提交 09d81bf1 存在，但 mcp edition 从未引用；本轮按 08e9a20f 补入 mcp.auth 与 definition。
  - mcp：`oauth-utils.ts` 的 `validateOAuthEndpointUrl` 只在 `allowPrivateNetwork` 为真且地址属于企业私网段时放行，其他私有/保留地址仍抛 OAuthSecurityError；`oauth-provider.ts` 把该值传给授权与 token 端点校验，`oauth-flow.ts` 同为透传。
  - mcp：`settings.ts` 的 `sanitizeSystemMcpServerMap`/`sanitizeSystemMcpServerCommand`/`blockSkippedSystemMcpServers` 只作用于系统 settings 与 system-defaults；被删除的 server 名会以大小写不敏感方式从 system/user/workspace 各作用域删除并追加到系统 `mcp.excluded`（内存值，不写回文件）。
  - native_plugins：`extension-manager.ts` 的 `acquireExtensionInstallLock` 让同一扩展的并发安装/更新串行化（15s 过期、约 7s 重试后报 "another installation or update ... already in progress"），`_buildExtension` 跳过 `.lock` 目录；`installOrUpdateExtension` 的安装源、`--ref`、link、uninstall 语义未变。该文件另把 link 源路径传给 consent 渲染器，但渲染器文件不在本轮 22 文件交集内，且"link 是实时符号链接、改动立即生效"已由现有章节记录。综合判断不改变 plugins.install/discovery/diagnostics 的固定问题答案，因此未新建 edition。
  - native_plugins：`extension.test.ts` 新增的是白名单加载容错测试（c10f094e 的回归），该行为已由未发布的 `gemini-cli-cli-native_plugins-v2` 记录，v2 仍在等待独立复核，本轮不修改、不选入。
  - 已核对并排除的 cited files：`docs/reference/commands.md`（/stats heatmap，不属八主题）；`packages/cli/src/utils/sessionUtils.ts`（会话排序/显示净化）；`packages/core/package.json`（版本与依赖）；`packages/core/src/agents/registry.ts`（custom_agents 的项目层加载与确认）；`packages/core/src/core/client.ts`、`geminiChat.ts`（provider 请求/重试与历史加固）；`packages/core/src/services/chatRecordingService.ts`（local_transcripts 写入）；`packages/core/src/skills/skillLoader.ts`（skills frontmatter，已由 skills v2 记录）；`packages/core/src/telemetry/sdk.ts`（遥测缓冲上限/错误隔离）；`packages/core/src/utils/fileUtils.ts`（BOM 编码，已由 skills/local_transcripts 记录）；`packages/core/src/utils/paths.ts`（tilde/IDE 目录与 Android 可信路径）；`packages/core/src/utils/oauth-flow.ts`（仅 allowPrivateNetwork 透传）。
  - "`schemas/settings.schema.json` 的增量是生成的 `requestTimeoutMs`（含 minimum 1）与主题 `active`/`focus` 字段；主题字段属 UI 主题定义，不进入固定问题。"
