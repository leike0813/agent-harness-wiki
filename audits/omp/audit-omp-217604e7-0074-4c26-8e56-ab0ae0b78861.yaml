    reason: >-
      source-omp-repo: adc7fed5..f1ac114d 的决定性变化是 omp gc 新增 opt-in 的 compress 阶段（--compress / gc.compress
      默认关闭，gc.compressAfterDays 默认 7），runGcCommand 的阶段序列由 stale→blobs→archive→wal 变为
      stale→blobs→archive→compress→wal；它就地压缩空闲会话的 transcript 及其 artifact 树，清扫自己留下的
      .omp-gc-compress-* 暂存目录（仅 APFS，范围为 sessions 根与 archive 根），并按整棵会话树的租约跳过活跃会话。
      这改变 transcripts.cleanup 的阶段清单与清扫对象；transcripts.archive 因“该阶段不删 history/stats 行、路径与
      mtime 不变、产物仍可续接”与归档明确不同而连带受影响；transcripts.scope 因 SessionHeader 新增 taskPromptCacheKey
      与 CLI 新增 --restore（同样需要持久化、不能与 --no-session 同用）而变化。transcripts.diagnostics 补入新的报告行。
      transcripts.location / naming / format / schema / lifecycle / database 的已录结论在该区间无对应改动。新出 edition
      omp-local_transcripts-v4。
