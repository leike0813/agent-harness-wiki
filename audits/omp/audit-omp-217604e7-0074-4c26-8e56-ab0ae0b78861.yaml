investigation_notes:
  - 本轮 triage 分类：narrow_investigation（定向固定来源模式）。worker 范围限定 configuration 与 local_transcripts
    的 7 个点名问题：config.sources / config.defaults / config.migration 与 transcripts.scope / transcripts.location /
    transcripts.cleanup / transcripts.archive。协调者冻结的观察未复跑，worker 未运行 sources:scan。
  - 已逐文件 diff 的点名证据文件与其结论：docs/cli-reference.md 只有 --restore 一行表格新增与持久化清单加词（影响
    transcripts.scope）；docs/models.md 只有 modelOverrides.tokenizer 枚举加 o200k（provider 侧，不在本轮范围）；
    docs/session.md 新增 compress 阶段两段（影响 transcripts.cleanup / transcripts.archive）；
    docs/settings.md 删除 providers.openai-codex.codeMode 与 codeModeDirectTools 两行表格（影响 config.defaults）；
    docs/session-operations-export-share-fork-resume.md 新增 "## CLI --restore" 一节（lifecycle 语义，不在本轮点名范围，
    仅记录为未展开候选证据）；packages/coding-agent/src/cli/gc-cli.ts +234/-6，新增 runCompressGc 与 CompressGcResult；
    packages/coding-agent/src/cli/gc-settings.ts +6（两个 gc.* 设置）；packages/coding-agent/src/commands/gc.ts +6
    （--compress / --compress-after-days）；packages/coding-agent/src/main.ts +34/-7（--restore 启动接线与 thinking 级
    解析，不改配置来源）；packages/coding-agent/src/session/context-settings.ts 只有 snapcompact.toolResults 描述文案
    （default 仍为 false，属描述级改动，不改已录默认值）；packages/coding-agent/src/session/session-manager.ts +62/-9
    （新增 taskPromptCacheKey 继承与 model_usage 的 activeLeafId）；packages/coding-agent/src/session/session-storage.ts
    +16（新增 replaceSessionFileSync，走既有 publish 锁）；packages/coding-agent/src/session/session-tools.ts -185（删除
    Codex Code Mode 全部接线，与 settings.ts 的删除同源）。
  - 为取到 gc compress 的落点另外读取（均在被点名文件的调用链上）：packages/coding-agent/src/cli/gc-compress.ts（本区间
    新增文件，346 行）、packages/stats/src/parser.ts（COMPRESS_SCRATCH_PREFIX 与 isCompressScratchPath）、
    packages/coding-agent/src/config/settings.ts（迁移与校验路径）。packages/coding-agent/src/config/settings.ts 与
