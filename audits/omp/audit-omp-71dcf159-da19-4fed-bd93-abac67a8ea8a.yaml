investigation_notes:
- 'Source triage: source-omp-repo 4b5e4fb7->adc7fed5 is 609 changed paths. Every source_reference cited by omp-local_transcripts-v2, omp-configuration-v5 and omp-custom_providers-v3 was resolved to its repo-relative file and its excerpt re-checked against the observed commit: 11 of them are no longer verbatim at adc7fed5 and 30 relocated only because earlier hunks shifted line numbers, which is not a knowledge change. Each of the 11 was read in the observed file to decide whether a documented statement changed, not whether a locator moved.'
- 'npm 18.8.9->18.10.2 is an identity bump with the integrity changing alongside the version, which is a normal release. No per-section evidence ties any documented statement to a published 18.10.2 artifact, and no session/config file was retrieved for it, so this is reviewed_no_knowledge_impact: no chapter change, no software-version mapping created or changed. The repository HEAD alone is not evidence of published-package behaviour.'
- 'The scanner marked all eight topics ''shared or unknown impact; assess relevant entrypoints''. That was narrowed by resolving each topic''s actual citations. Excluded with reasons: skills-v3 and hooks-v3 cite no file in the changed set at all (their refs are file_lines on untouched paths and document_section headings not present in any changed doc). mcp-v4 cites only the models.md section ''oauth'', which is byte-identical across the range. native_plugins-v3 cites only models.md ''Runtime model'', also byte-identical. custom_agents-v3''s eight document_section refs all live in docs/task-agent-discovery.md; seven of the eight sections are byte-identical and only ''Model and structured-output precedence'' changed. custom_providers-v3''s nine refs were all checked section-by-section and none changed, which is why its impact rests on newly added adjacent statements rather than on a corrected old one.'
- 'dirs.ts follow-through (shared path resolver): in the 788cf9e..adc7fed5 range it adds exactly one function, getMnemopiEmbedRuntimeDir() -> ~/.omp/run/mnemopi (state domain), consumed only by mnemopi/embed-client.ts for the per-model embedding server. getSessionsDir, getBlobsDir, getArchivedSessionsDir, getTerminalSessionsDir, getCustomSessionFilesDir, getSessionOwnersDir and the history.db resolver are untouched. Therefore it was extended into local_transcripts (recorded as a verified-unchanged note in the storage layout section, because that chapter states these paths) and into configuration (same, in config-roots). It was NOT extended into skills, plugins or mcp: none of those chapters cites dirs.ts, and none of them states a data or config path derived from it, so there is nothing for the new function to contradict. No chapter was changed on the strength of the mnemopi path itself, since a memory-backend runtime directory is not a config source, a session record, or an extension install root.'
- 'Included: local_transcripts (cleanup/archive/lifecycle/schema/diagnostics) on the gc-cli staging-temp sweep, the omp session pack|unpack|moved transfer command and its session-transfer custom_message entry, and the forkIfMovedAway resume guard; configuration (defaults) on task.structured and task.agentSoftRequestBudget and the rewritten tui.autoGraph smart description; custom_providers (protocol/auth/forwarding) on the two new judgment api values, the cloudflare-workers-ai credential entry and the CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS switch; custom_agents (limits) on the per-agent request budget override.'
- 'Excluded after reading the actual hunks: main.ts''s remaining edits are only the forkIfMovedAway wrapping already covered; session-manager.ts''s diff is a billing-cost reset helper for inherited task results and touches no documented path, layout, retention rule or config key; modes/settings.ts''s only change is the tui.autoGraph smart label already covered; session-storage.ts''s change is the staging-path extraction already covered; docs/session.md''s only other change is the one gc paragraph already covered; the 26 changed files under packages/ai/src/providers/, packages/catalog/src/compat/ and the packages/tui, crates, sdk and test trees were not individually read because none of them is cited by any current chapter section for the questions in scope - the provider-side consequences that do reach a chapter are covered above through docs/models.md, docs/providers.md and docs/environment-variables.md.'
- 'status: changed with review_status: pending. Reason: the new omp session pack|unpack|moved path changes how a session is moved between machines and adds a first-party custom_message type whose replay behaviour in older builds was not verified, and it changes every resume path in main.ts. That is a cross-cutting lifecycle/loading-mechanism change of the kind section 5 of the harness-maintenance skill routes to an independent reviewer, so it is not self-certified as reviewed here.'
