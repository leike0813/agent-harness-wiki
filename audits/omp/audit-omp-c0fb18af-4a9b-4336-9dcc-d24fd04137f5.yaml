  - 范围：source-omp-repo e4fe8782978e19c5de8b8830d050b95e63fc89ca 到 7f5fdfa3e4c5621cab857de46a8d75fbf3547e70。只抽取并阅读任务列出的 22 个被引用文件 hunk；另读两个直接关联入口：docs/mcp-protocol-transports.md（确认与 CHANGELOG/代码冲突）与 src/mcp/host/peers.ts（stdio 探针实现）。未重扫来源、未运行产品。npm 19.1.1 的 version@integrity 未变，不造映射、不改章节。
  - "README.md（sha256 f00258b483e38114f7e30d8c71b8abfb31ecd570e56d8d13db2d16274dcc3ca3）：唯一 hunk 改 pi-tui 包的描述（one component tree, rendered as rows or natively），属包架构文案，不是固定问题。无知识变化。"
  - "docs/cli-reference.md（sha256 c675b5fd62263d96a1b942593d1f939b421f683ca6a0856901a964df0d623cc5）：三个 hunk。116 行 --offline 的功能清单扩到图像描述、图像提问、技能与 MCP hints、job widgets 与 eval completion()。145 行 --no-tools 从“关闭内置工具”改为“只保留 --tools 点名的内置工具”，停用 MCP/LSP/扩展（含扩展 provider 与 hook）/custom tool/memory/auto-learn/Auto-QA/IRC，子代理继承限制，goal/plan 不可用，且不能与 --extension/--hook/--trusted-extension 组合。167 行 --no-extensions 扩到 custom tool 与 custom command 模块发现。全部归 configuration config.runtime。"
  - "docs/environment-variables.md（sha256 6e625a71531ef6827e83ddab88090f510f1dc1582df963d3de6b5ca9ec91c23e）：两处 hunk。131-132 行把 OTARI_API_KEY/OTARI_BASE_URL 的说明改为区域登录与复合凭据语义，作为 providers.auth 的文档证据。PI_NOTIFICATIONS 补充通知通道细节并新增 PI_NO_DESKTOP_NOTIFY，属终端桌面通知信号，不在八个固定问题内，未改章。"
  - "docs/provider-quirks.md（sha256 3cc241f0f32d26f2c8612d7cbb49bf6f3234ed5eca94c746fd17769b649275ae）：四处 hunk。(a) aiand 默认模型改为 moonshotai/kimi-k3，属内置 provider 种子行，不是固定问题；(b) alibaba 状态行路径从 packages/tui 移到 coding-agent，纯实现位置；(c) Otari 的 Auth & usage 重写为交互登录（区域选择、401 校验）、复合凭据（{ token, baseUrl }）与 baseUrl 优先级，归 providers.auth；(d) StepFun 的非聊天 roster 过滤新增 web search (dr-search-api) SKU，属 provider 细节，未改章。"
