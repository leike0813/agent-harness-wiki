investigation_notes:
  - >-
    Repo source moved dff728c -> 69e8c9e (one commit, 3127 changed paths); npm source
    moved 18.3.4 -> 18.5.1. All seven omp topics carry reader-visible mechanism
    changes at the new repo revision, so new v3 editions were cut from
    docs/*.md at 69e8c9e via snapshot-omp-repo-69e8c9e.
  - >-
    config.migration is answered at this revision: docs/config-usage.md still carries
    the "Migration behavior still active" section (startup-only when neither global
    config.yml nor config.yaml exists, three steps from settings.json via agent.db
    into config.yml, plus queueMode->steeringMode and flat theme field migrations).
    Evidence: ref-omp-config-migration-doc-69e8. The earlier note that the
    migration steps were missing was wrong; they live in config-usage.md, not in a
    separate settings.md.
  - >-
    hooks.events is answered at this revision: docs/hooks.md "Event surfaces"
    enumerates the full first-party event set in three groups (session, agent/context,
    tool), so the chapter no longer relies on the package types.ts for the event union.
    Evidence: ref-omp-hooks-events-surfaces-doc-69e8,
    ref-omp-hooks-agent-events-doc-69e8, ref-omp-hooks-tool-doc-69e8.
  - >-
    The npm bump alone created no chapter change and no source-to-package mapping;
    no runtime version is marked verified. Plugins manifest and omp plugin command
    claims still cite npm 18.3.4 package evidence and were not re-verified at 69e8c9e.
  - >-
    High-impact candidate for independent review: skills collision resolution moved
    from silent drop to namespaced <namespace>/<name> retention, which changes how a
    same-named skill is reachable. The evidenced cross-theme coupling is the
    claude-plugins provider deferring both skills and MCP discovery to the
    agent-plugins provider (docs/skills.md "Built-in skill providers and
    precedence", item 5), so the collision change and MCP discovery share one
    provider surface. The MCP tool-name normalization rules are NOT part of that
    coupling: docs/mcp-config.md, docs/mcp-protocol-transports.md and
    docs/mcp-runtime-lifecycle.md contain no "skill" occurrence, so the naming rules
    stand independently of the skill namespace.
