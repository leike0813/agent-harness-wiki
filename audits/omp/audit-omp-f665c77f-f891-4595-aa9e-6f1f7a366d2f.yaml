investigation_notes:
  - "local_transcripts 首采完成。使用 source-omp-repo 固定 commit fc6c0c90dab012a0b7edea731af92f5bbd09cff0 的源码树与随仓文档，写入 omp-local_transcripts-v1；引用绑定的 snapshot 为 snapshot-omp-lt-repo-fc6c-*，source_fetched_at 2026-10-06T05:20:00Z，distribution source-tree / os linux / arch x64。只覆盖 catalog 的 cli 界面。"
  - "来源变化本身对本主题的处置：repo 由基线 6d8552d7f9df1852826923f07f0eed4fe29511f3 前移到 fc6c0c90dab012a0b7edea731af92f5bbd09cff0，npm 由 18.6.0 到 18.6.1；本轮按首采处理，全部十题以固定 commit 的源码与文档为据，不为发行包写版本映射。"
  - "缺口一：source-omp-npm 上观察到的 18.6.1 未取到发行包文件，因此本章不含 npm 制品侧的记录形态结论；transcripts.archive 与 transcripts.cleanup 因此保持 partial。"
  - "缺口二：固定来源没有随包发布的机器可读 schema（无 JSON Schema）；custom、ttsr_injection、credential_pin、session_init、label 五个条目类型的字段未逐一定位到行，只确认其存在于 SessionEntry 联合类型。"
  - "缺口三：未查到从 .jsonl.gz 归档恢复回活动目录的官方路径，这是 transcripts.archive 记为 partial 的直接原因。"
  - "缺口四：blob store 内部是否分片、以及归档相对层级在 bucket 之外的细节，本轮未查证；缓存、日志与遥测文件按主题边界未逐项审计。"
  - "无 blocked check，无未解决分歧；未写 Markdown 复核报告。其他主题的 pending_question_ids 与 review_status: pending 按契约保持原样。"
