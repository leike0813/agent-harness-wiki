investigation_notes:
  - 本轮分类 maintain。只读观察 2026-10-22T12:55:17.079Z，会话
    4d765ae2-4466-41a5-951d-ac0df68377b4-alDEns；Git 来源 611c189 到 0b5c27ab，npm
    18.10.4 到 18.12.6。固定问题只覆盖
    configuration、custom_providers、local_transcripts、mcp 的 12 题。
  - 已发布引用中有 17 条的行定位在本轮提交上漂移。本轮不逐条重锚：新 edition 只为变化点新增基于 0b5c27ab 的快照与引用（前缀
    ref-omp-cfg8-、ref-omp-providers5-、ref-omp-mcp6-、ref-omp-lt5-），未变小节的旧引用继续绑定其原始
    commit 快照。
  - configuration。config.defaults 变化来自 docs/settings.md 与设置注册表：judge 内建链改为
    typesafe/jev-1.14.0 起头，新增 widget 聊天角色（未分配时按 smol
    解析）、advisor.continueSeverity、async.widgets、computer.backgroundFallback、lsp.requestTimeout、shellCommandPrefix、tui.completeScrollback，tools.approvalMode
    新增 always-ask-cached，lsp.shared 默认值不变但语义改为 per-project mux 加 5
    分钟保温。config.migration 变化来自 packages/coding-agent/src/config/settings.ts 的
  - custom_providers。providers.auth 新增 inception（INCEPTION_API_KEY，可 /login
    inception，登录用单 token Mercury 3 请求校验）与 sambanova（SAMBANOVA_API_KEY，可 /login
    sambanova）；OMP_AUTH_BROKER_ACCOUNT_POOL_FILE 由按 OAuth
    账号路由改为进程内凭据可见性（identityKey 数组、true/false、accounts+apiKeys，未列 provider 跟随 *
    规则）。providers.protocol 新增判定图像附件（链上过滤、280 到 1568 像素界、assets 与 image_url
    两种线上形态、盒式问题只发 TypeSafe 与 OpenRouter）以及 catalog 驱动的 judgment-images
    尺寸界。providers.forwarding 新增按 catalog request-encodings/endpoint-hosts
    的请求体压缩与 PI_REQUEST_COMPRESSION，PI_CODEX_ZSTD 不再存在；PI_ANTHROPIC_API_VERSION
    在新版本下省略 temperature/top_p/top_k。凭据七档顺序与 .env 载入未变。
  - mcp。mcp.exposure 变化来自 mcp/tool-bridge.ts：MCPTool 与 DeferredMCPTool 记录
    annotations.readOnlyHint 但仅供 prewalk，approval 仍是 write，批准展示改用
    formatApprovalArguments。mcp.diagnostics 变化来自
    mcp/protocol-transports、mcp/runtime-lifecycle、mcp/progress 与
    tool-bridge：进度上报写入 _meta.progressToken 并以 50ms 节流转成部分结果更新；stdio 取消为尽力而为且不回证
    server 停止；请求可能已到达 server 后失败标为非重试且有专门 next-step；发现期 warnings 写入日志，Claude
    插件低于 1000ms 的 timeout 被忽略并告警。
  - local_transcripts。transcripts.location：--session-dir 经 path.resolve
    绝对化，listFilesSync 跟随符号链接，临时根嵌套 home 时新增 hashed home
    桶名迁移。transcripts.lifecycle：新增 /seance 只读咨询分叉（seanceSource 头、artifact
    就地读、session_init 转 source_session_init）、重写经 sessionPublishTarget
    作用于符号链接指向、writeLinesToFile 等待背压写入确认、appendMessageToBranch 记录
    activeLeafId、defersSyncPublish 下排队重写保持非当前。transcripts.database：history.db
    隔离前关闭会话索引，随后从备份抢救 prompt、session_titles 与 session_recaps，读路径加类型过滤与最近 100 行
    quick_check 自检，索引句柄按 dev:ino:birthtimeMs 复用。transcripts.archive：unpack 的
    findLocalCopies 按 realpath 去重，避免符号链接分桶下重复搬移。
  - transcripts.cleanup 本轮未变：packages/coding-agent/src/cli 下 gc 与 compress
    相关文件、删除入口、stale 清理与保留规则在 611c189 到 0b5c27ab 区间都没有改动，答案与引用沿用
    omp-local_transcripts-v5 中该题的既有结论（仍为 partial）。
  - 未重审的固定问题（不在本轮派发范围）：config.sources、config.overrides、config.runtime、config.trust、config.diagnostics；providers.entry、providers.models、providers.metadata、providers.responses、providers.diagnostics；mcp.entry、mcp.definition、mcp.transport、mcp.auth、mcp.lifecycle、mcp.capabilities；transcripts.scope、transcripts.naming、transcripts.format、transcripts.schema、transcripts.diagnostics。新
    edition 原样保留这些题的答案与小节正文。
  - 本轮没有任何运行观察：未启动 MCP server、未发送模型请求、未执行 /seance、未对真实 history.db 制造损坏，也没有跑 omp
    gc 或 session unpack。相关结论全部来自固定提交的源码与随仓文档。
  - 候选自检 pnpm -s maintenance:candidates check 通过；旧引用中的 coverage 记录为历史材料，其
