investigation_notes:
- 本轮 triage 分类：maintain。范围限定 local_transcripts 与 configuration 两主题共 8 个固定问题。
- source-omp-repo 由 0932751 变为 788cf9e（1074 个文件）。逐项复核了任务点名的 session-storage.ts（+169）、session-manager.ts（+239）、session-index.ts、cli/gc-cli.ts、packages/utils/src/dirs.ts（+22）与 docs/session*.md。
- 实质变化三处：SessionStorage 新增可选 writeLinesSync/writeLinesAtomic 全文件按行流式发布（磁盘字节与顺序不变）；路径式 --resume 改为 throwIfMissing 并报 Session "<path>" not found.，选择器同策略；omp gc 归档在 deleteHistoryRowsForSessions 里新增 DELETE FROM session_titles。
- session-paths.ts、history-storage.ts、commands/gc.ts、cli/gc-settings.ts、session-listing.ts 在该区间无改动，上一版引用位置继续有效。
- dirs.ts 的 +22 只涉及 worktree 基址解析函数改名复用与 getNativesDir 的 PI_NATIVES_DIR 覆盖；随仓文档明确该变量不移动 sessions/plugins/其它数据，故 transcripts.location 的路径结论不变，仅补充边界证据。
- 配置侧新增设置默认值逐项对照 docs/settings.md 与 register() 定义取证；title.* 为本轮新接入 all-settings DOMAINS 的设置域。
- npm 来源观察到 18.8.5（基线 18.6.3），仅发布身份；未取到对应会话记录文件，不写版本映射。
- 排除：sdk/python、sdk/rust 的 omp-rpc wire 变化；packages/coding-agent/src/session 下与记录无关的 compaction/prewalk/ttsr 等改动。
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计。
