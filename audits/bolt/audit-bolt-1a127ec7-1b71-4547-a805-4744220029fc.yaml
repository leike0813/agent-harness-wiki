investigation_notes:
  - 本轮结论：maintain 目标下无知识变化。冻结观察时间 2026-10-22T12:53:11.493Z；source-bolt-repo 仍为
    eda10b12…，14 个官方文档来源 hash 全部变化，Git 侧不存在可比较的新提交。
  - 比对方式是确定性的：用项目根 archive/bolt 的上一版原件（mcp-0e079fc55811、skills-7b8ee4a967ad、
    faq-aba5bc4043f9、project-settings-f05d9a0da9e5、account-settings-f5eefde92712）与冻结
    resolved URL 的 当前字节逐行 diff；当前字节 sha256
    与观察值逐一相符（addb991e…、115220d1…、62f5f59c…、083e48b3…、 c61056a1…），不是抽样。
  - 差异只有两类：每页新增同一段「Agent Instructions」说明块，以及 MDX
    组件（<Steps>/<Step>/<Frame>/<Info>/
    <Tip>/<Accordion>/<Check>、autoPlay={true}）改成 GFM 提示块、图片与 <video>
    标签。四页正文措辞逐词未变； project-settings 另多一行移动端导航说明，与本主题无关；account-settings 只核对了
    mcp.entry 依赖的 Connectors 小节，该小节逐字未变。
  - 「已发布文档摘录不再命中」在本轮归因为渲染形式：带 MDX 标签的摘录（ref-bolt-docs-mcp-access、-builtin、
    -custom、-toggle、-tools；ref-bolt-docs-skills-faq、-add、-manual；ref-bolt-docs-faq-how、-start、
    -version-history；ref-bolt-docs-project-settings-backups
    等）去掉标签后，正文词序在当前页面逐字出现。 引用是其固定快照的引文，已发布引用与快照按契约保持不变；新版文档快照需要项目根 archive/
    的原件，该目录 对 worker 只读，故本轮不新建 edition、快照、引用或映射。
  - 索引页 source-bolt-docs-index 另有两处实质差异：发布排错页描述扩写，以及《Backups, restore, and
    version history》由 /building/using-bolt/rollback-backup.md 迁到
    /managing-projects/rollback-backup.md。标题与含义 未变，transcripts.archive
    依赖的「索引里存在该独立页面」仍成立；该页原件仍未归档， transcripts.archive 维持 partial。
  - 逐题结论（答案文本与证据不变）：mcp.entry、mcp.definition、mcp.transport、skills.collision、
    skills.loading 保持
    answered；mcp.auth、mcp.lifecycle、mcp.diagnostics、skills.diagnostics、
    transcripts.archive 保持 partial，缺口与各章正文所列一致（凭据存放与刷新、超时与重连、调用级请求日志、
    强制重载入口、托管侧会话记录）。
  - 章节与选择未改：bolt-web-mcp-v1、bolt-web-skills-v1、bolt-local_transcripts-v1 与
    registry/chapter-current.yaml 逐字保留，本候选只改本审计。
