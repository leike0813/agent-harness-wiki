investigation_notes:
  - |-
    比较窗口与原件状态：frozen audit 的 14 个 official_documentation 来源全部 changed，但 monitored baseline 多数未保留。逐源核对 newest registered snapshot：account-settings（2cb0bdf9a136）、forge（dff74b773c9e）、security（ec8ef2e421ab）的最新快照是 2026-10-03，raw_sha256 正是 frozen baseline 身份，归档原件在档，verified window = 2026-10-03 → 2026-11-25。其余 11 源的最新登记快照仍是 2026-09-30（如 skills 4afc7cc43aa5、index c0bf731ad08b），比 frozen baseline（如 skills 4c36a2d60e27、index 888c90cd677e）更旧，且 artifact 的 archive_path 在本工作树缺失；因此改用最新保留的观察原件 archive/bolt/artifact-source-<source>-<sha12>/source.md 对比 2026-11-25 观察。这些保留原件的 sha256 等于 audit-bolt-2194e4af（2026-10-14）的 observed 值，涉及 11 个来源：skills 7b8ee4a967ad、mcp 0e079fc55811、agents 80b81488b7d5、project-settings f05d9a0da9e5、workspace-settings e9b0a36a85ba、team-settings 1c81bcc9a4db、chat-tools 96b24dbca8f4、plan-mode 28340574cecd、llms 98706cfe2944、faq aba5bc4043f9 与 index 的 fcd2253636ed，因此这 11 源的 verified window = 2026-10-14 → 2026-11-25（index 见下）。account-settings、forge、security 另有 2026-10-14 原件（f5eefde92712、482cf31a3f53、3717d458baab），但按最新快照比较时以 2026-10-03 原件为准，结论与用 10-14 原件时一致。index 的保留原件 artifact-source-bolt-docs-index-fcd2253636ed 不对应任何历史审计的 observed 值，index 只能做 retained→observed 比较，不能断言 2026-09-30 至 2026-10-14 之间的变化。所有 changed 结论都不覆盖上述窗口之前。
  - |-
