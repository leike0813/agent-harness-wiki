- 13 个 official_documentation 来源内容 hash 变化。逐页重新取回的字节与 sources:check 的 observed 值 sha256 全部一致（index 888c90cd、skills
  4c36a2d6、mcp 2b966b4e、agents 5336558b、forge dff74b77、account-settings 2cb0bdf9、project-settings dde848e6、workspace-settings
  efaa005c、team-settings 2f2358bf、chat-tools aa717614、plan-mode b9f2a6ac、security ec8ef2e4、llms fa08e5ab、faq
  d6e2663e）；source-bolt-repo 仍停在 eda10b12。
- 本轮工作树内没有 archive/bolt/ 的历史原件（首次调查的归档不在本工作树），因此无法对基线字节做逐行 diff。判定方法改为：把 101 条文档引用（不含 40 条 Git 源码引用）的摘录与
  locator 标题在当前字节里做空白归一后的逐字比对，并逐节复读章节实际依赖的段落。
- 逐条比对结果：101 条里 100 条仍逐字命中，locator 标题全部存在。唯一失效的是 ref-bolt-docs-account-training：账户设置的 Model training 小节删掉了指向
  Forge 独立数据条款的 Info 块，改为直接链接 stackblitz.com 隐私政策。
- 逐节复读确认未变的部分：技能的内置技能清单、frontmatter 字段与 64/1024 字符上限、256 KB 与 2 MB 导入限制、GitHub 导入前 100 个、项目优先于工作区、/skill-creator；MCP
  的 Name/URL/Transport type/Authentication 字段、HTTP 与 SSE、API key/MCP OAuth/None、Auto-enable for all projects、按连接器开关工具；Forge
  的 Pro 与 Lite 获取方式、GLM 5.3/GLM 5.3 Flash/Kimi K3/DeepSeek v4 Pro、2026-10-14 预览结束、用法耗尽后的行为；队列 20 条上限与前
  5 条可见、暂停与版本恢复的先后；团队默认值 Viewer/User-specified/关闭；计划模式的项目上下文与联网检索。
- source-bolt-docs-security 与 source-bolt-docs-forge 已新建 2026-10-03 快照与归档原件：前者用于把「安全审计对付费计划开放、数据库安全检查所有计划可用」写进正文，后者用于写明
  Lite 计划不含安全扫描。
- 顺带修正一处证据不足的旧结论：v1 在 config-trust 与 config.diagnostics 里写「Pro 及以上才有项目安全审计」，所引 ref-bolt-docs-security-audit
  的摘录并未包含计划可用性说明。v2 按当前文档改为「付费计划可用、Lite 不含、数据库安全检查全计划可用」，并为 Model training 默认值补上真正覆盖它的引用。
- 另有一处当前文档事实未进入章节：/building/using-bolt/agents 新增 Note 说明免费计划只有 Standard、Max 需要付费计划。它与既有结论不冲突（custom_agents
  的 agents.entry 仍成立），本轮不为此新建 custom_agents 版本，留作后续按主题统一补写时的候选。
- 本轮无来源冲突、无新来源推翻已发布配置步骤、无跨主题加载机制变化，按 maintenance 第 4 节由本 Agent 自检，未触发独立复核。
- 本轮 delivery=pr：未运行 pnpm ahw publish、pnpm chapters:update 与 pnpm managed:packages，未调用 harness-binary，未读取
  Git 源码来源，未打开来源工作区。
