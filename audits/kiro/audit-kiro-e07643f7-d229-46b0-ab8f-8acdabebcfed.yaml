  - 现有 Kiro archived_document 原件登记指向 archive/kiro/<artifact-id>/raw.md，但工作区没有 archive/kiro/
    目录。因无法取得基线原件，本轮不能可靠区分被引内容变化与页面其他字节变化，故不更新章节、引用、快照或当前章节映射。
  - 本轮写入白名单不包含 archive/kiro；22 份当前文档临时副本未纳入 Git 跟踪知识记录。pending_question_ids 保留扫描输入列出的全部受影响问题；恢复条件为获得可审计的旧原件并完成逐题比较。
