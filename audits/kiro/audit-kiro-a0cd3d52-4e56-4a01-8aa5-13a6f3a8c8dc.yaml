investigation_notes:
  - local_transcripts 首采，只覆盖 surface_id=cli；catalog 中另有的 kiro（IDE）与 web 界面本轮没有可证实其本机记录形态的来源，不写答案，由查询派生 not_investigated。
  - Kiro 没有登记 git 仓库来源，本轮证据全部来自官方文档。已登记 artifact 指向 archive/kiro/artifact-<id>/raw.md，但工作区只剩 scan 本轮落盘的 8 份原件目录（artifact-source-<source-id>-<observed 前缀>/source.md），其余已登记原件不在磁盘上，因此没有引用任何无法逐字核对的旧快照。
  - 本轮新建 4 个 archived_document artifact、4 个 documentation snapshot 与 19 条 reference，分别绑定 settings、slash-commands、headless、installation 四份原件，raw_sha256 由原件真实字节计算，excerpt 由原件行区间逐字抽取并长度校验；每个 artifact 至少被一条 reference 绑定，无孤儿记录。
  - 版本边界：四份快照 version_applicability 均为 unknown，正文声明不能把文档结论绑定到任何已安装版本；未写 mappings/。
  - 缺口（已在正文逐题写明已查入口与剩余缺口）：落盘会话文件的路径、命名、编码与字段 schema 未被文档描述；是否有数据库未证实；官方删除入口仅覆盖“空本地会话”，手动删除后果无来源，因此未把任何删除方式写成安全做法。
  - 本题十题全部给出可用答案（lifecycle 与 diagnostics 为 answered，其余 partial/unknown），按简报照常发布 selection。audit 的 status 保持 scan 写入的 changed，pending_question_ids 原样保留其它主题遗留项，review_status 维持 pending。
