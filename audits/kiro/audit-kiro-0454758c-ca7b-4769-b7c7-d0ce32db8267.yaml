  - 本轮 triage 分类：maintain；巡检观察来自 2026-10-13 的只读检查；范围限 configuration 的固定问题。
  - 可逐行比对的两个来源：docs/reference/settings.md（7fd4ed21→45fb60cb1）与
    docs/cli/v3.md（5bc5ee10→fcb35cb2）。settings 只有两处实质变化：Display and
    accessibility 表新增 chat.screenReader 行（含 /settings display 引导句加入 screen
    reader support），Environment variables 表新增 KIRO_SCREEN_READER 行。
  - cli/v3 的实质变化集中在 Migration guide 一段与新增小节 "Switch from the startup
    offer"；Migration guide 现在要求 "Run it again after you change V2 trust settings
    so the generated V3 rules stay current."，即 /upgrade-agent
    可重复执行（章节只陈述当前来源的这一要求，不作与旧版本的对比措辞）。
  - 排除项（无知识影响）：cli/v3 的破折号改冒号（What's new in V3 六个粗体条目的 "—"→":"、Learn more
    五个链接条目、Info 段 "alongside your existing 2.x install，" 去 "— your"、Breaking
    changes 表 Session format 行 "High —" → "High."）、What's new 列表顺序与 Migration
    guide 链接列表顺序、以及 sentence 级语序调整；这些只改标点或顺序，未改任何机制、字段、作用域或加载顺序。
  - 剪除基线（无法逐行比对）：docs/cli/chat/settings.md 的 9a239bef 与
    docs/reference/slash-commands.md 的 38365b02 上一版原件未在 archive
