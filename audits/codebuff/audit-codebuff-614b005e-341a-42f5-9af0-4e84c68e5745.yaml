investigation_notes:
  - 观察冻结为 source-codebuff-repo 824604239e1e78c67bd4e0f48ea9086382aec9c3 →
    286f2517138563f5942a381f063f55254779a366；source-codebuff-npm 仍是 1.0.688 且
    integrity 未变；10 个 docs 源全部报告 changed。本轮只按分派的 9 个 cited 文件与冻结问题
    维护 configuration/custom_providers/local_transcripts，其余 topic 仅做排除性 triage。
  - 文档侧复核（通过）：/home/joshua/Git/JavaScript/agent-harness-wiki.git/agent-harness-wiki-monitor/documents
    下 10 对 baseline→observed 文本字节数相同；逐字节差异全部落在
    /_next/static/chunks/*.js 的构建哈希与 RSC 的 b 构建标记（如
    ikrY3xQdcq1y-Rz_js1zY）。把这些标记归一后 10 对文档逐字节相同，正文未变，故
    configuration/agents/hooks/mcp/plugins/skills 这些由 docs 变更带出的 impacts
    不构成知识变化。
  - cli/src/commands/command-registry.ts（sha256
    9cddf1bd6f1f168747d029b4bc3ebbbe385f1eae4ad9168071f3ab29d5109659）：hunk 删除
    ads:report 命令及其 import，属广告功能移除；skills 章节引用的命令注册区不在该
    hunk 范围，skills 答案不变，config/providers/transcripts 也不受影响。
  - cli/src/components/chat-history-screen.tsx（sha256
    2f761c7300ad3b7d73caa58a772879a2a81bc01122db5217bbe4b1251a6b4ee9）：/history
    显示名改为 chat.title ?? chat.lastPrompt，搜索 secondary 改为标题 + 首条提示。已维护到
    codebuff-local_transcripts-v2 的 transcripts.scope/transcripts.diagnostics。
  - cli/src/project-files.ts（sha256
    90fed71e85881c5c0de24d96a61fe8902f228bf1bbc354f9ae582f94d17bd706）：
    getMostRecentChatDir 改为按会话目录内 run-state.json 与 chat-messages.json 的较大
    mtime 排序，不再用目录自身 mtime（启动时的 logger 会先建空会话目录）。已维护到
    transcripts.lifecycle/transcripts.diagnostics。
  - cli/src/utils/chat-history.ts（sha256
    5d8c15868796b770bf34f7cd090efad8b2ac3d2b9e655c1aa7e76cb609f18027）：ChatHistoryEntry
    增加可选 title，并在列出有消息的会话时用 readChatTitle 读取。已维护到
    transcripts.scope/transcripts.location/transcripts.diagnostics。
  - cli/src/utils/run-state-storage.ts（sha256
    677dd236f0f44fba9572e57e3c2fdd66d5ff59aaca4f7746b826794a165df5cc）：新增
    resolveRequestedChatDir，要求 id 是 chats/ 的直接子目录、不含分隔符或 ./..、且
    realpath 后父目录仍是 chats/；loadMostRecentChatState 改用它，失败时打 debug 并回退到
    getMostRecentChatDir。已维护到 transcripts.lifecycle/transcripts.diagnostics；旧的
    ref-codebuff-lt-load-chat-id-fallback 仍保留在数据集中，但 v2 不再引用它描述的旧校验。
  - common/src/constants/reasoning-effort.ts（sha256
    ec9fe60240283f6abb97435290eb9df50a7d6564b54250c2dc1c364a8b3543c1）：只新增
    REASONING_EFFORT_LABELS 与 reasoningEffortLabel 展示名；BYOK 档位集合
    （low/medium/high）与 chatgpt 集合未变，Instant/Medium 的重命名只作用于 DeepSeek V4
    的模型档位，不改变 providers.entry/auth/metadata/forwarding 与 configuration 的既有
    答案，故不修改 custom_providers 正文。
  - sdk/src/byok.ts（sha256
    3029a80dcfc82b94d73a04adc4f3d417ac8252a0b17329c10179ed988354ab9d）：新增
    contextWindowMode 与 BYOK_MAX_CONTEXT_WINDOW，删除 400000 的自动发现上限，
    新增 byokConnectionLimits 的模式校验，auto 运行期把输出钳制到 contextWindow-1。
    已维护到 codebuff-cli-custom-providers-v5 的 providers.entry/providers.metadata。
  - sdk/src/impl/llm.ts（sha256
    0952ef0a5ecb4a5d2062a1358b423654b76704d7757ba050477f164b0565525b）：在
    codebuff_metadata 之前剔除 gravity_index 的终端用户元数据；这是 gravity 工具遥测
    边界，不经过 BYOK transform，也不在当前 provider 答案的描述范围内，故 custom_providers
    与 configuration 均不改。
  - sdk/src/validate-agents.ts（sha256
    dbece5fb94da5978b36b2d2e359daf9dd632ebe77af1cd7dda1ee522016469c0）：远程 agent
    校验对瞬时网络错误重试一次。agents.diagnostics 的 network_error 映射与“校验失败阻止
    发送”不变（第二次失败仍走同一路径），故 custom_agents 当前 edition 不改；该重试细节
    留作后续修订候选，本轮不声称已写入章节。
  - 本轮按 286f2517 新增 5 个 git_source artifact/snapshot（byok、project-files、
    run-state-storage、chat-history、chat-history-screen）与 19 个 reference；把
    codebuff-cli-custom-providers-v5、codebuff-local_transcripts-v2 选为当前 edition。
    旧 edition、旧 reference、旧 snapshot 均未修改。
  - custom_providers 修订要点：模式字段与旧连接语义、默认 32768/4096 只对旧连接表示
    “未配置”、byokModelLimits 的输出默认与压缩预算按当前公式重述、自动窗口上限 2000000
    与输出钳制。v4 保持历史版本，不原地改写。
  - local_transcripts 修订要点：/history 显示与搜索标题、继续会话按保存文件 mtime 选定、
    --continue 的 id 目录边界校验。缺口：标题的生成与落盘路径位于新文件
    cli/src/utils/chat-title.ts，不在本轮 9 个 cited 文件的交集内；按任务边界未把它写入
    正文，只记录读取侧，标题文件形态仍为未知。
  - configuration 无 edition 变更：9 个 cited 文件的 hunk 均不触及 config.sources /
    config.diagnostics 的机制，docs 文本亦未变；config.sources 与 config.diagnostics
    随本轮结案，config.overrides/runtime/trust/defaults/migration 保持原答案。
  - 历史 pending 审计（audit-codebuff-1c23337c-6204-49c1-a163-096fdaf80896、
    audit-codebuff-d8c97acc-bd10-4208-b191-091fbae8bbcd、
    audit-codebuff-0671d492-ab49-4906-8bfb-81cb980f31de、
    audit-codebuff-942168de-bfea-482d-a384-2eac2690e5de、
    audit-codebuff-a5316dcc-9124-4c1d-a896-6dadae9c22bb）保持原有状态并保留在记录中；本轮
    pending_audit_refs 置空与 reviewed 状态不会间接关闭它们，previous_audit_id 仍指向
