  - 遗留缺口（已在章节对应小节写明）：记录无 schema_version 与迁移规则（transcripts.schema=partial）；
    本轮只审计 CLI 自身记录路径，未确认嵌入式宿主与云端 runner 的存储与清理（transcripts.database=partial）；
    仅有 /export 单向导出，cli/ 下无导入命令，导出后如何恢复没有固定来源（transcripts.archive=partial）；
