    （pinned 外部工作区，未在项目内落 checkout），以及 source-codebuff-docs-troubleshooting 在本轮的归档原件
    archive/codebuff/artifact-source-codebuff-docs-troubleshooting-e171c47c9330/source.md，其
    "Accessing Your Chat History" 一节用于交叉核对配置目录与 chats 路径形状。
  - 检索入口：cli/src/project-files.ts、cli/src/utils/{run-state-storage,chat-meta,chat-history,message-history,logger,trace-writer,write-file-atomic,config-dir}.ts、
    cli/src/types/chat.ts、cli/src/commands/export-conversation.ts、cli/src/components/chat-history-screen.tsx、
    sdk/src/run-state.ts、common/src/types/session-state.ts；另在 cli/ 下检索 sqlite/leveldb/lowdb/localStorage 等本地存储与
    导入/恢复会话的实现，均无命中。
  - 版本边界：npm 侧 1.0.688 本轮未变，但源码 commit 不证明发行包行为，故未写 mappings/。
