investigation_notes:
  - 本轮不能关结：除 coordinator 给出的「38 个 artifact 文件零交集」外，按仓库既有规则（mapAuditImpacts 用引用
    locator.file 与 changed_paths 求交）复核发现 2 个被当前 edition 引用的文件落在本次改动里。观察冻结为
    source-codebuff-repo 7f04fb6980cc9b9bd909159d19e59e98551af9ec →
    824604239e1e78c67bd4e0f48ea9086382aec9c3；source-codebuff-npm 仍是 1.0.688 且
    integrity 未变；10 个 docs 源全部 changed。
  - 文档侧复核（通过）：/home/joshua/Git/JavaScript/agent-harness-wiki.git/agent-harness-wiki-monitor/documents
    下 10 对 baseline→observed 文本逐一比较，字节数相同；样本
    source-codebuff-docs-skills（c5bcc048→eb9f250e）cmp -l 计 60 处 字节差异，全部落在
    /_next/static/chunks/*.js 的构建哈希与 RSC 的 b 构建标记（如 b 值 HY97jnY4tTw-yp1xPFSQM→
    ikrY3xQdcq1y-Rz_js1zY）。把这两类标记归一后 10 对文档全部逐字节相同，正文文本未变，文档侧不构成知识变化。
  - 仓库侧：diff 头集合 36 个文件；knowledge/codebuff/artifacts 的 38 个 `git_source_file`
    文件值与它们零交集，但 knowledge/codebuff/references 的 78 个 locator.file 值里有 2
    个命中——common/src/mcp/client.ts 与 sdk/src/run.ts。
  - 命中 1（实质机制变化）：common/src/mcp/client.ts 的 hunk `@@ -180,11 +181,29 @@` 把
    listMCPTools 的缓存值改为调用新的 listAllTools，并新增 common/src/mcp/list-tools.ts 按
    nextCursor 分页取 tools/list（MCP_LIST_TOOLS_MAX=200、
    MCP_LIST_TOOLS_MAX_PAGES=20），且 rejected listing 会从缓存中删除以便下次重取。这与当前 edition
    codebuff-cli-mcp-v3 的 mcp-lifecycle-exposure 段落「listMCPTools 只对同一个 clientId
    调一次 listTools 并记住 Promise」（ref-codebuff-mcp-tools， locator
    151-188）直接冲突，mcp.lifecycle、mcp.capabilities、mcp.diagnostics 的答案需按新行为复核。
  - 命中 2（记录但不单独构成结论）：sdk/src/run.ts 的 hunk `@@ -353,6 +353,14 @@` 等 4 处新增
    RunOptions.hostPlatform 与 applyHostPlatform（写
    sessionState.fileContext.systemInfo.platform）。当前 edition custom-agents-v5 与
    hooks-v1 引用该文件 （ref-codebuff-run-options 170-200、run-overrides
    200-235、sdk-host-callbacks 266-282、hooks-sdk-run 1370-1382），但这些
    行不在改动范围，章节也没有列举 RunOptions 字段，故只记为待判断项。
  - 因此本审计保持 pending：需要补 impacts（topic 取 mcp、section 取
    mcp-lifecycle-exposure、question 取 mcp.lifecycle／
    mcp.capabilities／mcp.diagnostics）并决定是否新建 codebuff-cli-mcp-v4。impacts 与
    pending_question_ids 本轮按分派冻结， 未代填（schema 要求 pending_question_ids 必须出现在
    impacts 中）。
  - 范围限制：本规则只覆盖「章节已引用的文件」；未被引用文件里的机制变化不会被本条发现。
  - 本轮按冻结观察复核并维护：直取 824604239e1e78c67bd4e0f48ea9086382aec9c3 的
    common/src/mcp/client.ts 与 common/src/mcp/list-tools.ts（sha256 分别
    743e924961a1f21331e85afdaf224c66506b7da9a4a7f524fa7291af2f855cb2、
    0286daef2d0d8ee5ffd5f320f53d72233a4c1343f693082064729db083aa214e），确认
    listMCPTools 现缓存 listAllTools 的分页合并 Promise；后续页按 nextCursor 取到 200 工具/20
    页/重复 cursor/ 无新增工具名为止，重名丢弃，返回不带 nextCursor；失败列举会从缓存删除并在下次调用重取。 已新增
    artifact-codebuff-mcp-client-20261124、artifact-codebuff-mcp-list-tools-20261124（各带
    snapshot 与 reference），并将 codebuff-cli-mcp-v4 选为当前 mcp edition，更新
    mcp.lifecycle、 mcp.capabilities、mcp.diagnostics 的答案与
    mcp-scope/mcp-lifecycle-exposure/mcp-diagnostics 的引用；旧
    edition、artifact、reference 未改。sdk/src/run.ts 新增的 RunOptions.hostPlatform
    不在当前章节引用的行与答案范围内，章节也不列举 RunOptions 字段，本轮不写入新结论。
