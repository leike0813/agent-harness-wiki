investigation_notes:
  - >-
    文档来源的 changed 不能当内容身份。同一 URL 连续两次抓取得到不同字节（skills 页 117324 与 110592 字节，
    sha256 aad0aa9d 与 bff8f842），重新抓取的字节也与本轮 sources:check 的 observed（skills d45ce92d、
    troubleshooting f84f5b61）都不同，差异来自渲染样板（nonce、脚本、hydration 数据）。把 10 个文档来源的
    既有引用逐条在新响应里比对，21 条中 15 条去标签后逐字命中，其余 6 条缺失的只是 "--"、"：" 一类列表符号
    与行尾标点，正文段落仍逐字命中，含 how-does-it-work 的编排器与子 agent 段落、troubleshooting 的聊天历史
    路径。本轮判定 10 个文档来源无读者可见内容变化，不新建文档快照。
  - >-
    Git 来源 639e3f3 到 9fbc44c 共 350 个文件变化，38 个 codebuff 引用落在变化文件里。把 107 条
    snapshot-codebuff-repo 引用的摘录逐条在新提交里比对，99 条仍逐字命中，8 条因代码移动或注释改写而失效
    （byok-messages、byok-model、byok-usage、byok-validate、cli-byok-resolve、publisher-trust-error、
    run-options、sdk-host-callbacks）。失效引用只在正文改写处按 2026-10-03 快照重写，未改正文的旧引用保留原行号与旧快照。
  - >-
    读者可见变化有四处。发布者信任门从只拦 handleSteps 扩到拦 handleSteps 或任何 mcpServers，影响 custom_agents、
    configuration、mcp 三个主题。agent 定义新增 completionCheck 布尔字段，影响 custom_agents。settings.json 新增
    freebuffModelKey 与 freebuffCatalogReasoningEfforts 两个模型目录键及形状校验，影响 configuration。/byok 的命令参考
    与 help 文案、validate 结果的模型清单字段、凭据错误分流，以及 429 turn_spend_limit 熔断、retry-after 头白名单
    与无 index 的流式工具调用归位，影响 custom_providers。
  - >-
    逐条核对后判定无变化的主题有三个。skills 的加载器、frontmatter 解析、skill 工具与 command-registry 的 skill:
    分支均未变，引用逐字命中。native_plugins 的工具名清单、主题配置与工作区声明未变。hooks 在本提交仍没有
    第一方生命周期钩子，run_file_change_hooks 的 SDK 路径仍是显式 no-op；run.ts 新增的 requestHeaders 与 deadlineAt
    是宿主回调而非用户可配置钩子，因此不改写该章节，run-options 与 sdk-host-callbacks 两条失效引用保持指向旧快照。
  - >-
    npm 来源 codebuff 变为 1.0.688。npm 版本变化本身不构成章节变化或版本映射；本轮 delivery=pr 未运行
    pnpm managed:packages，受管二进制核对留给 harness-binary。
  - >-
    本轮交付四个章节版本：custom_agents 改写为 codebuff-cli-custom-agents-v2，configuration 改写为
    codebuff-cli-configuration-v2，custom_providers 改写为 codebuff-cli-custom-providers-v2，mcp 改写为
    codebuff-cli-mcp-v3；hooks、skills、native_plugins 保留当前版本。
