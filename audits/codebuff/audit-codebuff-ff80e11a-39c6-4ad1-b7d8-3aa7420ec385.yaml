impacts:
  - topic: custom_providers
    question_ids:
      - providers.forwarding
      - providers.responses
    section_ids:
      - providers-scope
      - providers-forwarding-responses
    surface_ids:
      - cli
    source_refs:
      - ref-codebuff-byok-gemini-signature
      - ref-codebuff-byok-gemini-placeholder
      - ref-codebuff-byok-gemini-backfill
      - ref-codebuff-provider-tool-call-extra-content
      - ref-codebuff-llm-provider-metadata-replay
    cross_topic_links:
      - agents.limits
    reason: >-
      sdk/src/impl/byok-request.ts gained a fourth provider-specific rewrite in
      byokRequestTransform: when the completion endpoint host is
      generativelanguage.googleapis.com, backfillGeminiThoughtSignatures gives the
      first tool call of every unsigned assistant message Google's placeholder
      GEMINI_SKIP_THOUGHT_SIGNATURE. The published edition enumerated exactly three
      such rewrites, so the count and the per-provider handling were wrong from this
      commit on. providers.responses was extended by the other half of the same
      mechanism: the OpenAI-compatible chat model now keeps a streamed tool call's
      extra_content as provider metadata tagged with the producing model id, and
      sdk/src/impl/llm.ts rides that metadata into the history tool-call part so the
      next request replays it.
  - topic: custom_agents
    question_ids:
      - agents.limits
    section_ids:
      - agents-scope
      - agents-limits-diagnostics
    surface_ids:
      - cli
    source_refs:
      - ref-codebuff-subagent-agents-per-call
      - ref-codebuff-subagent-live-cap
      - ref-codebuff-subagent-live-cap-scope
      - ref-codebuff-subagent-live-cap-refusal
    cross_topic_links:
      - providers.forwarding
    reason: >-
      common/src/tools/params/tool/spawn-agents.ts added
      MAX_LIVE_SUBAGENTS_PER_ROOT = 20 and packages/agent-runtime/src/tools/
      handlers/tool/spawn-agents.ts now enforces it for every agent type, with a
      Projects-scoped bucket split and a changed refusal message. codebuff-cli-
      custom-agents-v3 explicitly recorded the opposite as a gap ("the fixed
      sources give no independent cap on concurrent subagents"), so the published
      agents.limits answer had to be corrected against the runtime handler, not
      just against the tool schema.
