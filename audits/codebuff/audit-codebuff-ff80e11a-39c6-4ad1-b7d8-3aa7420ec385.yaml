investigation_notes:
  - >-
    Evidence base for this audit is the pinned workspace
    ws-99d7092ee7cc-5a6c3e3f-a614-4b76-b929-b5f8d28a6c1a at commit
    99d7092ee7cc6aa17aac3f3a292c2ba7a7d54310, read with
    `git -C <workspace> diff 7798b1320bccc2644aa819d042ac355b463055dc
    99d7092ee7cc6aa17aac3f3a292c2ba7a7d54310 -- <path>`. 62 paths changed; every
    non-test path was classified below. content_sha256 for the five newly pinned
    files was computed from the workspace bytes at that commit
    (`git cat-file blob 99d7092ee7cc:<file> | sha256sum`); no version mapping was
    created, because the evidence is a source commit and not an npm release.
  - >-
    source-codebuff-repo, included: sdk/src/impl/byok-request.ts (+73 lines, only
    the Gemini signature backfill), packages/llm-providers/src/openai-compatible/
    chat/openai-compatible-chat-language-model.ts (+54 lines, extra_content capture
    and schema fields), sdk/src/impl/llm.ts (tool-call chunks carry
    providerMetadata into history), common/src/tools/params/tool/spawn-agents.ts
    (MAX_LIVE_SUBAGENTS_PER_ROOT) and packages/agent-runtime/src/tools/handlers/
    tool/spawn-agents.ts (bucket split and enforcement). These two topics are the
    only ones whose published chapters cite the changed files.
  - >-
    Excluded, custom_agents: agents/base3.ts and agents/projects-subagent.ts. Read
    both diffs in full. base3.ts adds an instructionsPrompt (TURN_ENDING_NOTE) only
    when the compiled model is Muse Spark 1.3, and projects-subagent.ts is a
    13-line prompt/label edit. codebuff-cli-custom-agents-v3 says nothing about
    base3's per-model instruction prompt, and ref-codebuff-agent-modes is pinned to
    cli/src/utils/constants.ts, which did not change, so no published statement is
    affected.
  - >-
    Excluded, custom_agents (partly included): packages/agent-runtime/src/tools/
    stream-parser.ts, tool-stream-parser.ts, run-agent-step.ts and util/
    suggest-prompts-before-answer.ts only thread the tool-call providerOptions
    through and add a new "suggest prompts before answer" turn-ending nudge. The
    nudge is not stated in any published chapter; the plumbing corroborates the
    custom_providers claim already recorded there, so it did not need its own
    reference.
  - >-
    Excluded, custom_providers: common/src/constants/turn-ending-rule.ts and the
    survey, ad, analytics and i18n files (cli/src/components/chat-input-bar.tsx,
    cli/src/components/profile-survey-box.tsx, cli/src/hooks/use-chat-keyboard.ts,
    cli/src/state/profile-survey-store.ts, cli/src/utils/freebuff-catalog-agent.ts,
    cli/src/utils/profile-survey-machine.ts, cli/src/utils/sponsored-survey-api.ts,
    common/src/ads/*, common/src/constants/analytics-events.ts,
    common/src/constants/freebuff-*, common/src/types/ad-client-context.ts,
    common/src/types/contracts/support-email-ingest.ts,
    common/src/util/ad-experiment.ts, common/src/util/analytics-sampling.ts,
    common/src/util/axiom-only-log.ts, common/src/util/freebucks-reset.ts,
    common/src/util/freebuff-picker-sections.ts, common/src/desktop-cloud/
    turn-metrics.ts, common/src/sites/client.ts). None is cited by a codebuff
    chapter and none is a provider request, stream or error path.
  - >-
    Excluded, custom_providers: sdk/src/impl/stream-interruption.ts. The diff
    rewords the interruption classification and user-facing recovery strings
    ("no supported completion signal received" instead of "the connection was
    cut"). No codebuff chapter states the interruption wording, and the chapter that
    comes closest (local_transcripts) only cites the trace tags, not this message.
  - >-
    Excluded, local_transcripts: common/src/desktop-cloud/history.ts adds
    removedAt to CloudHistoryProject and changes the project-update type. The
    chapter's scope is the CLI's on-disk session records (run-state.json,
    chat-messages.json, message-history.json, debug logs); it makes no claim about
    the desktop cloud project list, which is a different surface from the registered
    `cli`. No transcript question, section or citation changes.
  - >-
    Excluded, configuration / hooks / mcp / native_plugins / skills: none of the
    62 changed paths is a configuration loader, key schema, hook event, MCP server
    definition, plugin package manifest or skill discovery entry point, and no
    chapter in those topics cites a changed file (verified by matching every changed
    path against knowledge/codebuff/references and chapters).
  - >-
    The ten source-codebuff-docs-* official-documentation sources are
    reviewed_no_impact: the coordinator already diffed their archived originals
    with scripts and styles stripped and the rendered text is byte-identical to the
    previous archived copies; only Next.js chunk/CSS build hashes and the `b:` build
    id moved. That conclusion was recorded rather than re-derived, so no
    documentation question was reopened. source-codebuff-npm is unchanged at
    1.0.688 with the same integrity, which is a registry identity observation only
    and proves nothing about behaviour, so no mapping was written.
  - >-
    Not in scope for this audit: audits/codebuff/audit-codebuff-1c23337c-6204-
    49c1-a163-096fdaf80896.yaml is a later scan whose git baseline is this audit's
    observed commit 99d7092ee7cc6aa17aac3f3a292c2ba7a7d54310 and whose observed
