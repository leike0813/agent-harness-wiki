investigation_notes:
- 本轮 triage 分类：maintain。22 个官方文档来源变化，逐字比对新原件（archive/lingma/artifact-source-*-<hash>/source.md）与上一轮原件后确认范围。
- 已排除 20 页：19 页差异仅为锚点 scrollMarginTop 由 8rem 变为 calc(max(var(--topbar-height,112px),...))，属站点排版；source-lingma-docs-install 仅把安装目录示例中的 C:\Users 改为 HTML 实体 C:&#92;Users，属转义写法，同一路径。两者均不改动机制语义。
- 更正协调方的两处判断：(1) source-lingma-docs-extensions 确为语义改写，判断成立；(2) source-lingma-docs-faq-mcp 并未删除分平台安装步骤——新旧两版都保留 nvm-windows(nvm install 22.14.0)、brew install node 与 ~/.zshrc 的 PATH export，变化是列表项缩进被提出为平铺段落、页签标题简化为 Windows/macOS、编号补空格，以及连接中断处理措辞调整。因此 mcp 仅 mcp.diagnostics 需复核，mcp.entry 未变。
- extensions 改写使 configuration 主题两处已发布结论失效（企业自定义指令的创建入口、公开/私有可见范围与 5～10 分钟生效延迟）。按协调要求新建 lingma-jetbrains-configuration-v2 取代，未就地修改已发布的 v1；v1 文件保持原样。
- 范围说明：协调清单将 configuration 列为不得触碰的排除主题，但同时要求“若 extensions 改写使已发布的企业自定义指令陈述失效，须显式声明并以新版本取代”。该失效陈述只存在于 configuration 章节，且新章节必以新章节版本发布，二者不可分离，故本轮对 configuration 做了最小必要的取代（仅两处失效段落与相应 source_refs/question 答案），未对该主题做全量复审。如协调方认为应改由他人处理，可回退 configuration-v2 与选章指针。
- 本产品 catalog 仅登记 jetbrains 一个界面，本轮全部答案 surface_ids 均为 [jetbrains]；未为他界面生成答案。extensions 新页的专属市场/下发机制按原文限定在 QoderWork CN 与 Qoder CN，未声明 JetBrains 插件接入，故在 plugins-enterprise-distribution 节显式标注不外推，plugins.diagnostics 保持 unknown。
- plugins.diagnostics 仍为 unknown：已检查 qoder-plugins.md 常见问题、本页常见问题、JetBrains 更新日志与安装指南，未找到插件版本/运行状态查询或加载错误定位的官方入口。
- 独立复核（read-only reviewer，2026-10-11T015904Z）：首轮返回 changes_requested，指出一处事实错误——mcp-v3 曾声称 faq-mcp 同页另一处仍保留“在界面右侧单击，系统会自动尝试重新启动 MCP 服务”，但新原件 archive/lingma/artifact-source-lingma-docs-faq-mcp-9e03e36028f3/source.md 全文 `界面右侧` 出现 0 次。
- 复核同时确认可接受：configuration-v2 的取代有据（旧原件 c9cd19508df1 标题为“扩展管理”、对象为自定义指令，新原件 3767bec1b8d3 为“扩展与市场”且对 自定义指令|企业标准版|JetBrains IDE|5～10 分钟 检索为 0 命中），且以新 edition 而非就地改写完成；native_plugins-v2 未把专属市场/下发模型外推到 jetbrains 界面；faq-mcp 分平台安装步骤未被删除的更正属实。
- writer 已修正该错误：mcp-v3 第 172 段、审计 YAML 的 mcp impact reason、审计报告第 3/4 节均不再声称同页分歧，并注明“界面右侧”表述属另一来源（ref-lingma-mcp-protocol → 用户指南页，其原件第 312 行确有该句，mcp-v3 第 151 行引用正确且与 v2 一致）。
- 复核结案为 approved（含上述修正）；本轮高影响复核完成，pending_question_ids 为空。
