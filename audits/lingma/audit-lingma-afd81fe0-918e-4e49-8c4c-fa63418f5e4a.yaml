investigation_notes:
  - >-
    local_transcripts 首采，仅覆盖 catalog 登记的 jetbrains 界面（Qoder CN JetBrains 插件）。
    lingma 未登记 git 仓库来源，本轮全部证据来自 scan 已归档的官方文档快照
    （hooks.md、faq.md、changelogs-jetbrains.md、tools.md、troubleshooting-guide.md，
    抓取时间 2026-09-30，version_applicability 均为 unknown），未新建任何
    archived_document 或 git_source_file；复用了既有 snapshot 与 artifact。
  - >-
    唯一直接描述本机会话记录内容的第一方入口是 Hook stdin 输入格式中的
    session_id 与 transcript_path（会话上下文 JSON 文件路径），据此确立记录以 JSON
    文件形式本机存在；记录目录、文件名、数据库、归档/导出、保留期与完整性校验在
    已归档文档中均无来源，对应题写 unknown 或 partial，未构造推测路径模板。
  - >-
    清理方面仅确认两个来源：Tools > Qoder > Qoder Cleanup 清理「过时的 Qoder 相关文件」
    （未说明是否触及会话记录），以及排障步骤中「先结束 Qoder CN 进程再删除 .lingma 目录」。
    未把前者写成可安全删除历史会话，也未给出手动删除单个记录文件的操作建议。
  - >-
    环境缺口：pinned 工作树 /home/joshua/orca/workspaces/agent-harness-wiki/local-transcripts-first-pass
    下不存在 archive/lingma/，22 个既有 artifact 的原件留存于主工作区
    /home/joshua/Workspace/Code/JavaScript/agent-harness-wiki/archive/lingma/。已逐个核对
    原件真实字节 sha256 与既有 artifact 记录的 raw_sha256 全部一致，并据此逐条校验本轮
    新增 reference 的 excerpt 逐字命中；未伪造或改写任何既有 artifact 记录。
