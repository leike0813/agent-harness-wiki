investigation_notes:
  - 本轮 triage 分类：maintain（14 个官方文档来源变化，逐页读取固定 observed 文本与 baseline 文本，剔除 scrollMarginTop/anchor 排版与标题格式噪声）。
  - 关键边界：11 个 /user-guide/ 页面（skills、mcp、custom-agent、agent-mode、hooks、custom-model、model-selector、rules、plugin-config、network-proxy、custom-commands）在本轮快照中以 Qoder CN IDE 为口径；涉及路径的页面改用 .qoder-cn / .qoder，MCP 与网络代理页明确把 JetBrains 用户指向 /plugins/settings；这些页面不再证明 catalog 唯一登记的 jetbrains（JetBrains 插件）界面的机制。
  - 同一批 FAQ 仍以 .lingma / Lingma.exe 指 JetBrains 插件，并以 .qodercn / QoderCN.exe 单列 Qoder CN IDE；产品家族页（未变）也把 Qoder CN IDE 与 Qoder CN JetBrains 插件列为两个子产品。因此本轮不把 IDE 页面改写进插件章节，旧快照与旧 edition 保留；受影响主题（skills、mcp、custom_agents、custom_providers、hooks、local_transcripts）本轮不改章节，待 coordinator 将来源重新绑定到 /plugins/* 插件文档或在 catalog 增加 Qoder CN IDE 界面后再维护。
  - 可直接归因到插件界面的两处：qoder-plugins.md 的客户端支持矩阵与 qoder.md 改动（native_plugins-v3），以及 faq.md 新增 JetBrains 插件本地服务一键修复（configuration-v3）。其余 11 个 IDE 页面与 faq-mcp 标题变化不产生插件章节影响。
  - faq-mcp 仅标题由“MCP常见问题说明”改为“MCP 常见问题”，正文无变化；按噪声排除，不改 mcp 章节。
  - 未改主题的既有 pending/unknown（如 providers.forwarding、providers.responses、plugins.diagnostics、agents.limits、transcripts.naming/database/archive）本轮无新插件证据，保持原状态，不重复派发。
  - 新增记录：artifact-source-lingma-docs-plugins-cacd40d123c3、snapshot-lingma-docs-plugins-20261125、artifact-source-lingma-docs-faq-d05003676195、snapshot-lingma-docs-faq-20261125，以及 6 条 reference；摘录均已逐字核对 archive 原件。
