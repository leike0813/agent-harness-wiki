- 本轮 triage 分类：maintain；本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计。
- 固定来源：source-deep-agents-repo 由 e6f59d0 变为 bfd9f22（workspace ws-bfd9f22fc558-58af8f7b-4afb-4371-8363-94f13810abee）。本轮为
  6 个新引用各建 git_source_file artifact 与 source_revision snapshot（commit bfd9f22fc558d5e90c809cf3beccb64aa69f3556），未复制
  checkout。
- 'skills 结论：pinned_skills 是 deepagents 包 SkillsMiddleware 的状态键，装在 before_model/abefore_model 上，在下一次模型调用前注入；在
  libs/code 全仓检索无任何写入点，dcode 的 /skill: 仍走 build_skill_invocation_envelope，故 cli 界面答案不变，新增内容只以 sdk 答案写进
  skills-pinning 小节。'
- custom_providers 结论：兜底 profile 有两条路径——发现期合并进 langchain_anthropic 档案（providers.models），创建期在 config.toml
  覆盖之前施加（providers.metadata）。合并方向为上游档案胜出，且不进入 overridden_keys。
- 本任务范围之外、但同一提交内变更的其他入口（config_manifest.py 的 terminal.tab_title、command_registry.py 的 /rename、model_config.py
  的 threads.auto_rename/rename_model、thread_titles.py、sessions.py、app.py 线程命名与工具显示）未在本轮调查；它们属于 configuration、custom_agents、local_transcripts
  主题，本审计不对这些主题下结论。
- 未新增 mappings：固定来源为源码提交，未证明任何已发布 npm 版本的行为。
