investigation_notes:
  - "本轮 triage 结论：reviewed_no_impact。文档与源码都有可见变化，但没有任何
    已发布答案、引用定位或映射需要改写，因此不新建 edition、不改
    registry/chapter-current.yaml；下方 impacts 保留为扫描给出的核查范围（逐 topic 的待查
    问题/小节/引用），不是知识变更声明。观察窗口按 checks 的 baseline → observed 冻结；
    10 个文档源的 baseline 原件都在 documents/<sha>.txt 可得（无缺失基线），只逐字比较每个源的
    两份原件，未重扫来源。"
  - "docs-cli-reference（dea76544… → 66cbed14…）：20 个 hunk、64 个变化行，全部是把链接的
    `.md` 后缀去掉（quickstart.md → quickstart 等）；把 `.../code/<page>.md` 归一化后两版逐字节相同。
    该页承载 agents/mcp/plugins/providers/skills 的 6 个引用，所在小节文本零变化。"
  - "docs-config-file（86cfa9ce… → 06da3fed…）：18 个 hunk、42 行；40 行是同类链接改写，唯一语义变化在
    `## Allowed models`：示例 `allowed = [\"bedrock:anthropic.claude-3-5-sonnet-20241022-v2:0\"]` 改为
    `allowed = [\"bedrock:anthropic.claude-sonnet-4-5-20250929-v1:0\"]`。该小节没有 reference
    （config-file 现有 8 个引用只覆盖 Default and recent agent、Agent runtime limits、Provider configuration、
    Compatible APIs、Arbitrary providers、Endpoints/keys/gateways、Profile overrides、Retries），
    章节也没有出现该示例或旧模型 ID；`models.allowed` 的机制陈述来自源码 ref-deep-agents-config-threat。
    结论：示例模型 ID 刷新，不是答案变化。"
  - "docs-configuration（4b2d394f… → 191b5b3b…）：19 个 hunk、66 行，全部是链接改写，归一化后相同。
    该页是 configuration 主题 5 个 doc 引用（dotenv/home/inspect/managed/resolve）及 agents、providers、
    skills、mcp 若干引用的来源，全部对应的正文小节未变。"
  - "docs-credentials（4 个 hunk、14 行）、docs-extensions（2 个 hunk、10 行）、docs-hooks（2 个 hunk、6 行）、
    docs-mcp-tools（1 个 hunk、2 行）、docs-plugins（6 个 hunk、22 行）、docs-providers（4 个 hunk、12 行）：
    逐页归一化后无差异，全部是链接改写；对应 providers.key-order、plugins、hooks、mcp 主题的引用小节未动。"
  - "docs-quickstart（f9f55617… → 5d404541…）：8 个 hunk、54 行；48 行是链接改写，6 行（3 对）语义变化都在
    `## Trace with LangSmith`：提示段由『legacy destination setting，支持 agent addressing 时可直接用
    agent identifier』改为『本集成不支持 agent addressing，按 tracer_session_name 归属 agent environment』；
    示例块语言 `sh`→`text`，输出行 `✓ LangSmith tracing: '…'`→`tracing:   '…'`。八主题固定问题不覆盖
    第三方 LangSmith tracing 接线，全候选无 LANGSMITH_/tracer_session_name/该输出行文本；唯一
    quickstart 引用是 custom_agents 的 `Interactive mode` 小节（未变）。结论：无答案影响。"
  - "source-deep-agents-repo（084f04fe… → 2abd693c…）：下载 diff 共 111 个改动路径（release 脚本、CI、
    uv.lock、pyproject、CHANGELOG、openwiki 等），与知识记录 `git_source_file.file` 和 reference
    locator.file 的交集只有 `libs/code/deepagents_code/config_manifest.py`。该文件本轮仅两个 hunk：
    `models.default` 的 `cli_flag` 由 `--set-default-model` 改为 `--default-model`，`update.auto_update`
    的 `cli_flag` 由 `--set-auto-update` 改为 `--auto-update`。"
  - "逐引用核对：config_manifest.py 的 9 个 locator 行段（72-88、105-112、320-325、1459-1467、2358-2372、
    2859-2877、2885-2896、2919-2933、3009-3016）都不含这两个 hunk；knowledge/ 与 catalog/ 中 grep 无
    `--set-default-model`/`--set-auto-update`，章节也从未把 manifest 的 cli_flag 写成已发布事实。
    cli-reference 页的 `--default-model` 与 `--auto-update` 在 baseline 中已如此，本次只是实现元数据
    与既有文档对齐。结论：无答案影响，不新增或修改 reference。"
  - "逐主题排除（49 个 pending 问题全部据此关闭）：configuration（doc 引用来自 configuration 页的噪声变化，
    源码引用行段未变）；custom_agents（cli-reference/config-file/quickstart 被引小节均未变）；custom_providers
    （config-file 被引小节与 credentials 的 Key resolution order 未变）；hooks（hooks 页零语义变化）；
    mcp（mcp-tools 页零语义变化）；native_plugins（plugins/extensions 页零语义变化）；skills（configuration/
    cli-reference 噪声与未变的 memory-and-skills）；local_transcripts（doc 引用固定在旧 cli-reference 快照
    d76bb88ee848，旧快照与源码行段都不变）。未发现需要新增的 impact 范围。"
