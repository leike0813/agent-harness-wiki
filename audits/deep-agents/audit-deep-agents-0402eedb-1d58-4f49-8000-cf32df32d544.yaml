  - 本轮 triage 分类：maintain；只读观察与派发针对 2026-10-22T12:53:57.419Z 的冻结输入，Git 来源
    baseline e6d4fbf5 对比 b4ac8829；12 个官方文档页在冻结 resolved URL 上重新取回，逐页核对 sha256
    与观察值一致后才作为证据使用。
  - Git 侧逐文件比对结论：libs/code/deepagents_code/hooks/ 与
    libs/code/deepagents_code/skills/ 零改动；configuration/ 只有 interpreter.py
    改动（与本轮问题无关）；config_manifest.py 仅新增 history.idle_compaction_tokens
    选项；_env_vars.py 新增同名环境变量并改写 RECENT_THREADS
    文档串；mcp_config.py、mcp_auth.py、mcp_tools.py、mcp_providers/_registry.py、mcp_providers/slack.py
    改动 MCP 的 oauth
    应用凭据；app.py、sessions.py、resume_policy.py、client/headless_resume.py、client/non_interactive.py
    改动会话生命周期、恢复策略与删除级联；agent.py 只新增 async subagent webhook 透传；model_retry.py 只新增
    Groq 工具上限错误类型。
  - 文档侧：hooks、mcp-tools、plugins、providers、subagents、cli-reference 六页相对旧快照只有 JSX
    转 Markdown 的排版改写，无内容删除；config-file 新增 Name threads automatically
    一节，configuration 把技能符号链接包含规则改写为“允许根或已批准信任目录（无头需
    extra_allowed_dirs）”，quickstart 把 /skill 改写为“agent server
    解析并加载正文”。这三处与本产品既有章节的结论一致，不构成答案变化。
