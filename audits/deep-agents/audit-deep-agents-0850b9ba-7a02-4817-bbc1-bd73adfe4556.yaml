investigation_notes:
  - "Repo diff reviewed read-only with `git -C ws-7a6974309ac7-ff4f672d-49a4-4b02-9eaf-53e05d9c7223 diff 9f0e39d5 7a697430 -- <path>` over all 115 changed paths; 25 of them are under libs/code and libs/deepagents. Only the cited files were read line by line."
  - "INCLUDED config.defaults / config.runtime: the manifest default for display.show_reasoning changed from False to True (config_manifest.py:2358-2372), so any published statement of that default was stale. The mode split is real, not a doc approximation: app.py:1481-1488 resolves with fallback=True while main.py:1131-1145 passes default=False, and config_manifest.py:1465-1466 applies that override only when ranked.ranks == (DEFAULT_RANK,), i.e. when no tier set the key. All three doc pages agree and were archived read-only from the project archive."
  - "EXCLUDED config.sources / config.overrides / config.trust / config.migration / config.diagnostics: diffed configuration/resolver.py, configuration/providers.py, configuration/service.py, configuration/writer.py, THREAT_MODEL.md and ARCHITECTURE.md in full - none of them appear among the 115 changed paths, and the manifest change adds no key, path, rank or merge strategy. doctor.py is also unchanged, so the config.diagnostics prose still holds. Kept unchanged sections at their original snapshot pins per the edition contract."
  - "EXCLUDED skills.roots / skills.discovery / skills.format / skills.extensions / skills.collision: the changed skills code touches invocation, the server-side pin and the trust interrupt only. discover_skills_and_roots keeps the same source list and precedence; the refactor merely extracted extra_skill_roots() and moved the manifest lookup into it. load.py, which those sections pin, is not in the diff."
  - "INCLUDED skills.invocation / skills.conditions but LEFT skills.diagnostics PENDING: skills-v3 cites invocation.py and trust.py through ref-deep-agents-skills-envelope (pinned to snapshot-deep-agents-repo, commit c9b2ce19) and states the CLI never writes pinned_skills. That citation depends directly on the rewritten lines, so skills.invocation and the trust half of skills.conditions were restated in skills-v4. skills.diagnostics was NOT restated: its four CLI bullets (skills list/info/delete, skills trust list|revoke|clear, /context-doctor, /reload) come from unchanged documentation pages, and I did not verify against the rewritten _discover_skills path whether the trust CLI commands still cover the new server-side interrupt flow end to end. Recording it as pending rather than asserting an unverified answer."
  - "EXCLUDED agents.entry / agents.roles / agents.invocation / agents.limits: agent.py changed, but the two hunks are PluginSkillsMiddleware(path_base=effective_cwd) and a ForkGoalToolsMiddleware injection for custom_subagents whose mode == 'fork' and which lack a prebuilt runnable. The second concerns a goal-tools middleware, not custom-agent discovery, format, precedence or limits; the first is covered by the skills impact above. goals for the agents topic stay as published."
  - "EXCLUDED mcp.* and plugins.*: no MCP or plugin-discovery entrypoint is among the changed paths. skills_middleware.py grew, but it is the plugin-provided skills adapter, and its externally visible contract (the SkillsMiddleware pin surface) is what changed - already recorded under skills."
  - "EXCLUDED hooks.*: app.py wires the new request_skill_trust/on_skill_pinned callbacks into the TUI adapter, which is client plumbing for the skills interrupt, not a hook event, entry, output or ordering change. No hook registry file is in the diff."
  - "EXCLUDED transcripts.*: the recorded-message path changed (message_store.py, widgets/messages.py, goal_state_notice.is_pinned_skill_message, auto_mode._latest_turn_id) but these are skill-pinned-message plumbing, not transcript storage semantics. local_transcripts-v1 pins sessions.py, state-migration.py, thread-ownership.py and graph.py; graph.py is in the diff but its change is unrelated to where transcripts are written, and none of the transcript storage modules changed."
  - "EXCLUDED providers.auth / providers.protocol / providers.metadata / providers.forwarding / providers.responses: model_config.py's only hunk is the Anthropic fallback merge recorded above. The fallback-application layer in config.py:7085-7096, which providers-metadata pins as ref-deep-agents-providers-anthropic-fallback-apply, is unchanged, so the model-creation-time {**fallback, **upstream} statement still holds; the two merge sites are deliberately described differently and must not be conflated."
  - "No software-version mapping was created. This is a source-tree commit with no npm release snapshot for libs/code; per the mapping contract a repository HEAD cannot by itself prove a published package version, so source-level knowledge is kept without a mapping."
  - "No unrelated product file was written. All new artifacts are git_source_file or archived_document identity records; no checkout or archive bytes were copied into the candidate."
  - "Source failure: none. All four changed sources were read from their pinned locations; the three documentation originals were read read-only from the project archive at the paths recorded in checks[].candidate_path."