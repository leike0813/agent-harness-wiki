investigation_notes:
  - local_transcripts 首采完成：调查 cli 界面（Deep Agents Code / dcode），十题全部给出可用答案（answered 7 题，partial 3 题：transcripts.schema、transcripts.archive、transcripts.diagnostics）。sdk 界面本轮未调查，查询会派生 not_investigated。
  - 固定来源：仓库 https://github.com/langchain-ai/deepagents.git 的 commit 4b9410272a4e4885ec70fb1ec8549e307a15e585（source-deep-agents-repo，抓取 2026-10-06T04:33:30Z），经 coordinator 已打开的只读工作区访问；官方命令参考文档取本轮 scan 落在 archive/deep-agents/artifact-source-deep-agents-docs-cli-reference-d76bb88ee848/source.md 的新候选原件（sha256 d76bb88e…），据此新建 artifact-deep-agents-lt-docs-cli-reference 与 snapshot-deep-agents-lt-docs-cli-reference，未覆盖既有 2026-09-30 快照。
  - 主要机制：会话正文是 LangGraph AsyncSqliteSaver 写入的 checkpoint，状态 blob 内联在 profile 的 .state/sessions.db；索引 idx_dcode_threads_list_v2 为可重建的覆盖索引；conversation_history/<thread_id>.md 是压缩产出的归档，保留窗口由 history.retention_days（默认 30 天，0 关闭）控制并在启动时扫描；dcode threads delete 为唯一内建删除入口，级联 checkpoints/writes/dcode_btw_costs 与磁盘归档，线程在别处打开时抛 BlockingIOError。
  - 缺口（照实记录，非“不支持”）：(1) checkpoints/writes 的建表语句与状态 blob 序列化格式属 langgraph-checkpoint-sqlite 与 LangChain，不在本仓库，故 transcripts.schema 记为 partial，只能给出本仓库确证的 metadata 键与 dcode_btw_costs 表结构；(2) 固定来源中未找到归档的导出/复制/导入命令与跨机器迁移步骤，transcripts.archive 记为 partial；(3) 未找到内建 integrity_check、VACUUM、记录计数或 sessions.db 自动保留期，transcripts.diagnostics 记为 partial。
  - 平台边界：路径模板为语义路径（<profile>/.state/…），未使用执行机的绝对路径；.state 的 0o700 加固在 POSIX 生效，Windows 上 chmod 被跳过、沿用父目录 ACL，已在正文与 transcripts.location 中标注。
  - 本轮未改写任何既有七章、既有 reference 或既有 artifact/snapshot；未新增 mappings；review_status 保持 pending，因为本审计中其它主题仍有未完成题。
