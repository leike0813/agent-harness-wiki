  - docs/config-file 原文已变化（f9e628b9… → 07d56c13…），但上一轮归档路径 archive/deep-agents/artifact-deep-agents-docs-config-file/raw.md 在本工作副本中不存在（archive 未随仓库保留），无法做逐字节 diff。改为与已登记的 8 条 config-file 摘录逐条比对：7 条逐字不变，ref-deep-agents-providers-arbitrary-doc 的唯一差异是 BaseChatModel 链接由 reference.langchain.com/python/langchain_core/language_models/#… 归一为 reference.langchain.com/python/langchain-core/language_models。该链接只出现在解释性文字中，custom_providers 章节依赖它的四条结论（可接受非 OpenAI 的 BaseChatModel、单独接收 api_key、可改写 create_agent、在 create_deep_agent 中用任意工具集）不受影响，故不改写 custom_providers 章节，也不在此轮另建文档快照。
