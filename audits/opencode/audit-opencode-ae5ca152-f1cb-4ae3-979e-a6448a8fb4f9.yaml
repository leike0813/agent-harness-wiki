    （skill/discovery.ts）、MCP 技能（plugin/mcp-skill.ts）、内置技能（plugin/skill.ts）、旧配置迁移
    （config/normalize.ts）与环境变量映射（cli/server-process.ts）。固定问题 9 项均 answered，
    v4 保留为历史版本。
  - >-
    local_transcripts：新建完整 edition opencode-local_transcripts-v3 并在候选选择。新增引用覆盖
    database.ts 的 pragma/凭据导入、migration.ts 的 bootstrap 判定、session/sql.ts 的 session_v2/
    session_message/session_part/session_inbox/blob/blob_ref、projector 的助手片段写入、experimental.ts
