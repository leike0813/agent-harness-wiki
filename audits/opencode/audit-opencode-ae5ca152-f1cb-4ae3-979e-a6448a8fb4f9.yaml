  - >-
    skills：新建完整 edition opencode-skills-v5 并在候选选择。新增证据引用覆盖站点 skills.mdx（位置、
    sources、catalog、frontmatter、IDs、precedence、loading、permissions）、新 Skill 服务（skill.ts 的
    prepare/content/files/read 与 URI）、发现器（skill-scan.ts、config/plugin/skill.ts、
    compatibility.ts）、发现/解析（skill-file.ts）、指令列表（skill/instructions.ts）、工具门禁
