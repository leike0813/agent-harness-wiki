    commands.ts 的 session 子命令、session/blob.ts 的 media_blob 开关。V1 record-schema 节保留原
    652c090 结论并明确标注为历史，不再把 session_input/part 表/三表导入写成当前事实。
  - >-
    configuration（held）：configuration v6 草稿仍在候选外 /tmp/ahw-opencode-v6-draft，选择保持
    opencode-configuration-v4，本轮没有写、选或移动 v6。核对 292cb5a1（v6 复核基线）→ d62d2db9 的
