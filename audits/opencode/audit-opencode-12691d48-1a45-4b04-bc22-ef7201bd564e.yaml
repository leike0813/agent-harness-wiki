investigation_notes:
  - '本轮 triage 分类：reviewed_no_impact。source-opencode-repo 由 0d61729b 变为 1c74b9f0（fix(tui): restrict command autocomplete to prompt start），632 个文件。命中已登记引用的三个文件逐一读真实 hunk 后，八个主题均无字段、默认值、优先级、路径、鉴权流程或命令列表的变化，因此不新建章节版本。'
  - 'agents.mdx（custom_agents 全部 9 条引用所在文件）：全文件只有一处 hunk，位于 366-370 行，把 OpenCode Zen 的说明链接由站内相对路径 /docs/zen 改为绝对地址 https://opencode.ai/v2/docs/console/。该段落其余文字（模型 ID 形如 provider/model-id）逐字未变。改动行不落在任何引用摘录的行范围内（16-39、119-138、142-184、188-216、226-313、424-450、578-597、601-630、700-716），已登记定位仍指向原内容。agents.entry、agents.format、agents.roles、agents.invocation、agents.overrides、agents.limits、agents.diagnostics 复核后答案与状态不变。'
  - 'providers.mdx（custom_providers 全部 7 条引用所在文件）：两处 hunk，均只把 "Learn more" 的目标由 /docs/zen 换成 https://opencode.ai/v2/docs/console/（87-90 行、1810-1813 行），没有触及 provider 段字段、/connect 鉴权流程、models 发现规则或 baseURL 语义。两处行号都不在引用行范围内（11-22、25-47、51-84、2595-2622、2662-2669、2673-2685）。providers.entry、providers.auth、providers.protocol、providers.models、providers.metadata、providers.forwarding、providers.responses、providers.diagnostics 复核后答案与状态不变。'
  - 'commands.ts（configuration 唯一引用所在文件）：唯一 hunk 在 533 行附近的 pair 命令，为 --remote 的描述补上“会把服务端暴露到互联网”，并新增 --yes/-y 布尔标志（默认 false，用于 --remote 首次开启对外访问时的同意确认）。已发布内容只引用该文件 115-143 行的 debug 分组，hunk 位于其后，摘录与章节结论（debug 分组只剩 agents、config、paths）逐字仍成立；已发布章节未陈述 pair 命令或其标志，没有章节依赖本次改动。config.sources、config.overrides、config.runtime、config.trust、config.defaults、config.migration、config.diagnostics 复核后答案与状态不变（含 config.trust 仍为来源冲突，未被本轮证据改变）。'
  - '同批 runtime 改动逐项排除：packages/core/src/v1/config/migrate.ts 与新增的 packages/core/src/v1/config/provider-options.ts 只改 v1→v2 迁移路径，为 @ai-sdk/openai-compatible 的模型选项拆出 settings/body；configuration 的 config.migration 答案取自 packages/core/src/config/normalize.ts 与 packages/cli/src/config/migrate.ts，未陈述 v1 provider 迁移，custom_providers 的 npm 选择与转发参数语义也未因此改变，故不属于对已发布表述的修正。'
  - 'packages/core/src/plugin/provider/azure.ts 把 /connect 表单的资源列举改为纯文本输入；已发布章节未涉及 Azure 连接流程，providers.auth 依据 providers.mdx 的 auth.json 存储不受影响。packages/core/src/plugin/provider/openai.ts 把 gpt-6.1-sol 的 limit 覆盖由 400_000/272_000 改为 628_000/500_000；该覆盖值未出现在任何已发布章节，providers.metadata 仍按 models.dev 自动取值加自定义手写保持 partial，正文无需改动。'
