investigation_notes:
  - "本轮由 harness-maintenance worker 以 delivery=pr 完成 local_transcripts 首次采写，只调查 catalog 中 opencode 的 cli 界面；desktop 界面未取证，查询会派生 not_investigated。"
  - "固定来源为 source-opencode-repo 在 commit 652c090dc119b5f3dc1e5e0bf1c4b40d9721f0ef 的只读工作区，新增来源记录 artifact-opencode-20261006-*（24 条 git_source_file）与 50 条 reference，全部 record_kind: production，sha256 由真实文件内容计算。"
  - "可追溯性修正（coordinator 复核后）：原先 50 条 reference 统一绑定单个 snapshot-opencode-repo-20261006，而该 snapshot 实际只固定 packages/core/src/session/sql.ts，导致 43 条引用的 locator.file 与其 snapshot 绑定的 artifact 文件不一致、23 个 artifact 成为孤儿。已按每个被引用的源码文件各建一个 kind: source_revision 快照 snapshot-opencode-<文件路径>-20261006，各自绑定对应 artifact，并把每条 reference 的 snapshot_id 改绑到与其 locator.file 一致的那个快照；50/50 一致，无孤儿 artifact，excerpt、行号与 sha256 未改动；已删除无人引用的总名快照 snapshot-opencode-repo-20261006，章节首段与本条说明同步更新。"
  - "关键机制结论：会话正文落单个 SQLite 文件（通道决定文件名，OPENCODE_DB 可覆盖）；event 表为事件日志，投影器在同一事务内写 session/message/part/session_message；超限工具输出全文写 data/tool-output 并有 7 天保留；归档是 time_archived 标记而非搬移，导出与导入只搬运 session/message/part 三表。"
  - "transcripts.location 记为 partial：各平台的 XDG 基目录由 xdg-basedir 决定，固定来源只给出委托关系，未核验其逐平台字面值，正文要求读者用 opencode debug paths 确认。"
  - "transcripts.cleanup 记为 partial：官方删除入口与 tool-output 保留策略有源码证据，但运行中进程与 WAL 边车文件在手工删库时的行为在固定来源中没有对应处理，未取证；未找到会话级自动保留或过期删除机制，按纪律不据此断言可以安全手删。"
  - "未改写 scan 观察到的 checks、status 与其它主题 impact；其它主题仍有 53 条 pending_question_ids，因此 review_status 保持 pending，未写 reviewed_by/reviewed_at。transcripts.* 十题均已给出可用答案（八题 answered、两题 partial），未加入 pending_question_ids。"
  - "按契约未建立源码到 npm 发行包的 mappings，未运行 sources:scan、publish 或 managed package 更新，未执行真实 harness。status 保持 changed（source-opencode-repo 相对基线 907b3bc518fa48e90e8ec24dd327d13eee71c36c 前移，check 观察为 changed），无来源失败。"

