investigation_notes:
  - "范围限定在 configuration 主题的一个 topic worker，未打开其余七个主题。父进程已冻结观察，未重新扫描来源；固定工作区 ws-8ffbcc2c81d1-2c550bff-22f2-4536-bfee-7c4f2750ea5b 只读。"
  - "决定性改动（直接读取 0af756b3..8ffbcc2c 的真实 hunk）：packages/core/src/config/normalize.ts 新增 normalizePolicies 并在 normalize() 中先于 normalizeExperimental 调用；生成的 encoded.policies = [...generated, ...experimental, ...native]，其中 generated 来自 V1 enabled_providers/disabled_providers。packages/schema/src/config/experimental.ts 的 experimental.policies 描述改为 Deprecated: use top-level policies；packages/schema/src/config/policy.ts 给出语句字段（action 三值 provider.use/tool.use/integration.use，effect 仅 allow/deny）。"
  - "packages/core/src/managed-policy.ts 第 55 行由 entry.info.experimental?.policies 改为 entry.info.policies；statements() 先 entries.toReversed() 再拼接各文档 policies，decision() 用 findLast，故跨文档时加载位置更靠前的（更宽的）来源胜出，与普通设置相反。"
  - "packages/core/src/config.ts 的受管层安排相对上一轮反转：上一轮 systemSupplementary 置于数组最前（最低优先级）、偏好 plist 排在系统目录之前；本轮 managed = [系统目录, 偏好 plist]，policies 抽出成只含策略的文档并整体 toReversed() 后置于数组最前，去掉 policies 的其余受管设置置于数组最末。源码注释称受管设置最后加载因而覆盖一切、MDM 偏好高于系统目录。测试 config.test.ts 同步由 loads system configuration at lowest priority 改名为 ...at highest priority，并断言 Config.latest(entries, \"shell\") 为 system。"
  - "分文档的官方文档树 services/www/src/docs/content/{config,pololicies}.mdx 在本范围内实质改写：新增 policies 键章节、Precedence 权威表与 Console 通道，并明确 experimental.policies 仍可用且合并进 policies。旧文档树 packages/web/src/content/docs/config.mdx 在本范围内逐字未变，仍只写 experimental.policies。两棵树并存，官方文档对本轮改动的记述只能取 services/www 一侧。"
  - "config.trust 由 conflict 改为 answered：受管目录与 MDM 偏好两条读取通道存在且对普通设置具最高优先级；受管层内部的策略层序也与 services/www 文档的权威表一致。推导链条为两次反转叠加——config.ts:248-251 的 managed 数组先系统目录后偏好 plist，252-264 的 managedPolicies 在 flatMap 之后整体 toReversed()，使数组最前一段变为偏好在前、系统目录在后；managed-policy.ts:52-55 的 statements() 再把整个条目数组 toReversed()，分组内相对次序随之回摆，语句列表中系统目录排在偏好之前；managed-policy.ts:72 的 findLast 因此取到偏好 plist 的语句，即 macOS 受管偏好域的策略权威高于系统目录，与权威表第 2、3 行相符。config.ts:244-245 的注释（MDM preferences outrank the system directory as in V1；policies evaluate in reverse load order）针对的是整个受管层而非仅普通设置，.toReversed() 正是为使该注释对策略成立而存在。"
  - "config.overrides 保持 partial：本轮能确证的例外键只有 policies（数组拼接 + 反序求值 + 组织语句最终决定），该证据不依赖受管层内部的层序结论，故纠正 config.trust 不改变本项推理。普通对象与数组跨文件如何拼接、空值与删除标记的语义在固定范围内仍未找到实现说明，未把 Config.latest 的单键 findLast 语义推广为全部键的合并规则。"
  - "config.runtime 与 config.diagnostics 的机制未变但表述更新：OPENCODE_CONFIG/OPENCODE_CONFIG_DIR/OPENCODE_CONFIG_CONTENT/OPENCODE_CONFIG_PROJECT_DISABLE 的读取位置逐字未变（packages/cli/src/server-process.ts）；debug config 仍打印脱敏后的条目数组，本轮补充说明受管目录同一文件会在输出中出现两次（最前只含 policies、最末为其余设置），这是受管层拆分带来的读者可见影响。opencode debug 分组仍只有 agents、config、paths。packages/cli/src/commands/commands.ts 与 handlers/debug/config.ts 在本范围内未变。"
