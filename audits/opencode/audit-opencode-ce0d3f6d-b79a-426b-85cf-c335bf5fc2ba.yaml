investigation_notes:
  - "两个登记来源都变化：source-opencode-repo 由 545f51d26cc39a907d2867492d498d9607ea5fa4 前进到 907b3bc518fa48e90e8ec24dd327d13eee71c36c（refs/heads/dev，239 个路径），source-opencode-npm 的 opencode-ai 由 1.18.32 变为 1.18.34。两者都成功观察，无来源失败。"
  - "npm 侧只作身份记录。按契约不因 npm 版本变化制造章节变化或源码到包的映射，1.18.34 与固定提交 907b3bc 之间仍未建立版本映射；新章节正文保留该适用性缺口。"
  - "仓库侧影响面按 changed_paths 收敛到 packages/opencode/src 的 12 个文件：cli/cmd/{account,web}.ts、cli/cmd/debug/{config,redact}.ts、mcp/{browser,oauth-provider}.ts、plugin/{digitalocean,snowflake-cortex,openai/codex}.ts、provider/{provider,transform}.ts、session/llm/request.ts。其余变化集中在 packages/console、packages/stats、packages/web 与文档翻译，不属本产品已登记知识范围。"
  - "官方文档侧未变：config.mdx、agents.mdx、providers.mdx、plugins.mdx、mcp-servers.mdx、skills.mdx 在两个提交间 blob 完全相同；本轮改动的英文文档只有 ecosystem.mdx、go.mdx、zen.mdx，均未被任何 reference 引用。"
  - "已逐条核对既有 14 个 reference 引用的全部 14 个文件在 545f51d 与 907b3bc 之间 blob 相同，因此既有章节正文与来源引用未被推翻，无需改写 skills、custom_agents、hooks、native_plugins 四个主题。"
  - "configuration 主题有读者可见变化：新增 packages/opencode/src/cli/cmd/debug/redact.ts，opencode debug config 打印前对配置做脱敏，命令改为输出 redactConfig(config)。既有 ref-opencode-config-diagnostics 的官方文档原文未变，该命令仍可用于核对键是否生效，但不能核对被脱敏的凭据取值。新增 opencode-configuration-v3。"
  - "custom_providers 主题有两处读者可见变化：provider.ts 把超时处理提取为 timeoutFetch，并让自建客户端的 Cloudflare AI Gateway 加载器也走带超时的 fetch，使该路径的 timeout、headerTimeout、chunkTimeout 语义与其它 provider 一致；session/llm/request.ts 让 x-opencode-session-id 对所有 provider 生效，子会话另加 x-opencode-parent-session-id。此外 transform.ts 用 GEMINI_2_5_RE 与 GEMINI_LEGACY_RE 区分 Gemini 2.5、旧式命名与 Gemma，改变可推理档位与自动写入的 thinkingLevel／reasoning.effort 默认值。新增 opencode-custom_providers-v4。"
  - "mcp 主题有两处读者可见变化：oauth-provider.ts 在跳转前校验授权 URL 协议，只接受 http 与 https；browser.ts 在注册 exit 监听后立即用当时的退出码再判一次，修掉 Windows 与 WSL 上拉起浏览器失败的漏判。新增 opencode-mcp-v4。"
  - "native_plugins 主题无机制变化：plugin/digitalocean.ts、plugin/snowflake-cortex.ts、plugin/openai/codex.ts 本轮只有 open 到 openUrl 的导入替换；codex 的 ALLOWED_MODELS 增加 gpt-6-sol 与 gpt-6-luna，但既有章节未记录该白名单，本轮不据此扩写新范围。"
  - "新增来源记录：artifact-opencode-repo-20261003（git_source_file）、snapshot-opencode-repo-20261003（source_revision，固定 907b3bc518fa48e90e8ec24dd327d13eee71c36c），以及 10 条引用：ref-opencode-config-redact、ref-opencode-config-debug-cmd、ref-opencode-providers-timeout-fetch、ref-opencode-providers-timeout-combine、ref-opencode-providers-aigateway-timeout、ref-opencode-providers-session-headers、ref-opencode-providers-gemini-efforts、ref-opencode-providers-gemini-defaults、ref-opencode-mcp-oauth-scheme、ref-opencode-mcp-browser-exit。全部 record_kind: production，git_source_file 按规则只固定 commit、file 与 content_sha256，不保留 checkout。"
  - "无来源冲突，无跨主题关键加载机制变化，也未推翻任何已发布的配置步骤，因此不触发独立复核的三个条件。config.diagnostics、providers.metadata、providers.responses、mcp.lifecycle、mcp.diagnostics 维持既有的 partial，原因未变（来源未提供来源溯源入口、配置层未定义推理强度等元数据、文档未给重试语义、无自动重连循环、无工具可见性专用命令），不是本轮新增缺口。"
  - "delivery=pr：未运行 pnpm ahw publish、pnpm chapters:update、pnpm managed:packages，未修改 registry/chapter-current.yaml，未做受管二进制核对。建议父进程把 opencode-configuration-v3、opencode-custom_providers-v4、opencode-mcp-v4 选为当前版本。"
