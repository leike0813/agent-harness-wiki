investigation_notes:
  - "本轮 triage 分类：maintain（由 narrow_investigation 收窄）。提交 0af756b3（docs(console):
    show Gemini 4 Argon discount with strikethrough pricing (#55206)，456 个文件）的
    subject 是 Console 定价展示，但配置发现/合并路径同时发生了实质移动，因此不能按 subject 排除。固定工作区
    ws-0af756b30fa1-d8f00cc0-dc9a-4d2a-bd22-0e1d4d390562 检出
    0af756b30fa12764cec7affc52c400043d24ffa2，直接读 c57c448d→0af756b3 的真实
    hunk，未重新扫描来源。"
  - "packages/core/src/config.ts（+43/-?）：加载数组新增 systemSupplementary
    并置于数组最前（最低优先级），新增 loadPreferences（plutil -convert json，10 秒超时，失败仅告警），Options
    新增 system: Schema.optional(Schema.Union([Schema.Boolean,
    Schema.String]))，global 注释改为“false skips the system and global config
    dirs”，configured() 依赖新增 AppProcess.node。→ config.sources 与 config.overrides
    的已发布加载顺序不再成立。"
  - packages/core/src/config/discovery.ts（+66/-?）：新增 systemDirectory()（darwin
    /Library/Application Support/opencode、win32 %ProgramData%\opencode、其余
    /etc/opencode）、preferencePaths()（/Library/Managed
    Preferences/<user>/ai.opencode.managed.plist 优先于 /Library/Managed
    Preferences/ai.opencode.managed.plist）、preferenceMetadata 集合与
    stripPreferenceMetadata()；Sources 接口新增 system 与 preferences
    字段；configDirectories = [system, globalDirectory] 并同时参与
    globalRoots、globalFiles 与项目遍历去重；preferences 仅在 system 未被自定义为字符串且平台为 darwin
    时选取。→ 配置文件发现顺序与受管目录来源均已发布表述被推翻。
  - packages/web/src/content/docs/config.mdx（+1/-1）：唯一 hunk 在 396 行，把
    chunkTimeout 默认值由 300000（5 分钟）改为 900000（15 分钟）；文档 154-178 行的 Managed
    settings 段落逐字未变。实现侧对应改动在
    packages/core/src/provider.ts：DEFAULT_CHUNK_TIMEOUT_MS = 900_000 与
    DEFAULT_TIMEOUT_MS 300_000 拆开，timeout/headerTimeout 默认值不变。→ config.defaults
    的默认值答案变化，新增 ref-opencode-config-chunk-timeout-default 与
    ref-opencode-config-doc-chunk-timeout。
  - "config.trust 的答案变化并已按高影响条件送独立复核：v4 正文记载“按这些路径与偏好域名检索源码未再找到对应的读取入口”，本提交在
    discovery.ts 与 config.ts 中恢复了平台系统目录与 ai.opencode.managed plist
    两条读取路径。该结论改动了已发布的配置机制描述，因此新章 opencode-configuration-v5 保持 status:
    conflict（文档称受管设置为最高优先级层，实现把受管层置于最低优先级，仅策略语句经反向求值取回最高权威），并声明独立复核。"
  - 排除（提交内但不在本轮 configuration 固定问题范围）：packages/ai/src/providers/google-vertex.ts
    及 packages/core/src/plugin/provider/*.ts 属 custom_providers 的 provider
    实现；packages/core/src/provider.ts 的 encoding 键（Provider.Encoding =
    zstd|gzip|none）与 packages/schema/src/config/provider.ts 的 compatibility 键属
    provider settings
    schema，不改变任何已发布的配置来源、优先级或合并规则；packages/core/src/v1/config/migrate.ts 把 V1
    setCacheKey 改写为 compatibility.supportsPromptCacheKey，属 V1→V2 provider 选项迁移，而
    config.migration 的已发布答案取自 packages/core/src/config/normalize.ts 与
    packages/cli/src/config/migrate.ts，两者本轮未变；packages/app/** 的 session/settings
    UI 与 e2e spec 不进入任何已发布配置问题的证据链。
  - 复核未变（逐文件 diff --stat
    为空）：packages/core/src/config/normalize.ts、packages/cli/src/config/migrate.ts、packages/cli/src/commands/commands.ts、packages/cli/src/commands/handlers/debug/config.ts、packages/core/src/managed-policy.ts、packages/cli/src/server-process.ts、packages/server/src/routes.ts。config.runtime
    因此不变——新增的 Config.Options.system 是构造参数，本提交未接到任何环境变量或 CLI
    开关；OPENCODE_CONFIG_DIR/OPENCODE_CONFIG/OPENCODE_CONFIG_CONTENT/OPENCODE_CONFIG_PROJECT_DISABLE
    的读取位置逐字未变。config.diagnostics 的结论也不变，opencode debug config
    仍打印按优先级排列的条目数组，只是最前面可能出现受管层条目。config.migration 与 config.overrides
    的状态维持原样：前者依据的两个文件未变，后者仍因缺少字段级合并实现说明保持 partial。
  - "新建 opencode-configuration-v5（v4 保留未删），新增 9 条 git_source_file 引用与 4
    个固定快照，均只记 commit 0af756b30fa12764cec7affc52c400043d24ffa2、仓库相对 file 与
    content_sha256，未复制源码 checkout，未记录临时路径。registry/chapter-current.yaml 的
    configuration 选择保持 v4 不变：v5 仍是 review_status: pending
    的未发布草稿，独立复核关闭前不切选择，其余七个主题的选择未动。"
  - 未新增软件版本映射：npm 侧本轮 unchanged（1.19.0 同一 identity），仓库 HEAD 不足以证明已发布二进制的行为。
  - review_status 保持 pending：config.trust 的来源冲突改写触发“新证据推翻已发布配置机制描述”，按高影响条件须独立
    reviewer；同时本审计引用的
    audit-opencode-0f16a4f4、audit-opencode-2aa143e4、audit-opencode-12691d48 的
    review_status 仍为 pending，不通过标 reviewed 间接关闭上游待办。其余主题的问题仍留在
    pending_question_ids 中，由各主题 writer 处理。
  - 本轮修正后的候选章节未获独立复核批准，已移出交付候选并作为任务工件保留在巡检临时目录；本审计的影响范围已收窄到仍在库内的章节小节，待复核问题继续
