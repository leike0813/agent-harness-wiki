investigation_notes:
  - "固定仓库来源到提交 76bcfd40be616a72f4697b3041565f322245b462（上一轮 0b1e01409a2f2255eff7e1c47c6dc894eaed5288），经 sources:workspace open 取得 changed_paths：共 357 个文件，其中 packages/kilo-vscode 142、packages/kilo-jetbrains 65、packages/opencode 43、packages/kilo-docs 23、packages/tui 14，其余分散在 core/schema/plugin/server/llm/sdk/kilo-ui/kilo-sandbox 等。登记界面只有 cli，故 VS Code 与 JetBrains 扩展的改动不写入本产品知识。"
  - "custom_providers：唯一有读者可见变化的主题。packages/opencode/src/kilocode/session/llm.ts 新增 KiloLLM.outputTokens，packages/opencode/src/session/llm/request.ts 把 maxOutputTokens 字段改为经该函数计算。Claude 系模型在四个一方协议包（@kilocode/kilo-gateway、@ai-sdk/anthropic、@ai-sdk/amazon-bedrock、@ai-sdk/google-vertex/anthropic）上，未设 KILO_EXPERIMENTAL_OUTPUT_TOKEN_MAX、非小请求、无显式 thinking.budgetTokens / reasoningConfig.budgetTokens 时，请求上限取模型完整 limit.output 而非 min(limit.output, 32000)。已写 kilo-code-cli-custom_providers-v3。"
  - "来源分歧：packages/kilo-docs/pages/code-with-ai/agents/custom-models.md 在本轮固定提交上仍写 'Capped at 32,000 by default'，未记录 Claude 一方路由例外；例外只出现在 CLI 运行时源码与 packages/opencode/CHANGELOG.md 的 7.8.2 条目。两者可按条件并存（文档写共享默认值，源码写四个协议包加 Claude 系模型的窄例外），已在 v3 的转发小节并列两说与适用边界，不构成需独立复核的来源冲突。"
  - "既有引用逐条核对：本轮 CLI 相关引用涉及的 24 个源码文件里只有 packages/opencode/src/tool/task.ts 变化，唯一 hunk 在第 480 行（取消文案），而引用 ref-kilo-code-agents-src-task 定位的是 123–165 行，与上一轮提交逐字节一致。文档侧 packages/kilo-docs/pages/code-with-ai/platforms/cli.md 未变化；custom-models.md 只在 VSCode 操作步骤加了 'Fetch models' 一句，Token Limits 表的 output 行仍写 'Capped at 32,000 by default'；openai-compatible.md 新增一句同样位于 VSCode 标签内、CLI 标签之前，未进入本产品登记的 cli 界面。既有引用全部仍然成立。"
  - "configuration：changed_paths 未触及 packages/config 的 schema、加载、合并或 guard 模块，也未触及 CLI 文档页 platforms/cli.md；packages/tui/src/config/keybind.ts 只新增 subagent_interrupt（默认 escape，映射 subagent.interrupt）这一 TUI 键位，kilo-docs 的 settings 页未随之更新，章节未收录键位表，故无读者可见变化，保留 kilo-code-cli-configuration-v2。"
