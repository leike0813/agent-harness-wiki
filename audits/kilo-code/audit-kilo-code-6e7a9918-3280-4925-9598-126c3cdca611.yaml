investigation_notes:
  - "local_transcripts 首采：本轮新增章节 kilo-code-local_transcripts-v1，并把该 edition 追加为 registry/chapter-current.yaml 的 local_transcripts selection。此前本产品只有七章且只覆盖 cli 界面，本章十题同样只给 cli 界面答案；catalog 登记的 vscode 与 jetbrains 界面未取证，由查询派生为 not_investigated。"
  - "固定来源：source-kilo-code-repo（https://github.com/Kilo-Org/kilocode.git）提交 62f674d4a91969ac077e4a7b6ceeb8a99de80e47，取用时间 2026-10-06T05:56:00Z，工作区为 coordinator 已打开的 pinned 检出。本轮新建 29 个 git_source_file artifact、29 个 source_revision snapshot 与 60 条 reference；每个被引用的源码文件各有独立 snapshot，locator.file 与其 snapshot 绑定的 artifact file 一致，excerpt 由 pinned 源码逐行抽取并落在 file_lines 区间内。"
  - "文档证据一律取自同一提交内的 packages/kilo-docs 页面并按 git_source_file 记录：本轮项目根下不存在 archive/kilo-code/，因此没有新建任何 archived_document 记录。"
  - "十题结论：location、naming、format、database、cleanup、diagnostics 为 answered；scope、schema、lifecycle、archive 为 partial。partial 的原因与已查入口：scope 未找到写入前脱敏路径与输入历史落盘形态的来源（kilo export --sanitize 是导出时脱敏，不能反推库内形态；recall 过滤只说明检索范围，不等于不落盘）；schema 未取证 data 列内部字段级版本迁移（旧 JSON 布局的一次性迁移与库边界兼容层是相邻但不同的机制）；lifecycle 未取证 resume 后重建上下文的具体加载顺序；archive 未取证本地归档目录或归档开关，只证实了 time_archived 列、导出/导入与 Markdown 渲染。"
  - "记录形态要点（供复核）：正文与元数据在 SQLite 的 session/message/part/todo 表，data 列为整份 JSON 文档；写入走事件投影并按 id onConflictDoUpdate 覆写，因此库中只有每个片段的最新状态，没有中间演进。session diff 仍在 Global.Path.data/storage 的 JSON 路径，快照基线在 data/snapshot/<project-id>/<worktree-hash> 的独立 Git 目录，三者互不包含。"
  - "清理机制：retention.enabled 与 retention.maxAgeDays 写在 kilo.json，由后端评估；删除失败关闭，只删最顶层过期会话并靠外键级联带走子会话，满足门槛后 VACUUM 与 wal_checkpoint(TRUNCATE) 回收空间，运行结果落在 data/retention/state.json。触发方式是本地 HTTP API（status/run/cancel），CLI 侧没有独立的清理子命令；单会话删除用 kilo session delete。"
  - "未新建任何 mappings 记录：源码提交不证明 npm 发行包行为，本轮也不执行受管包更新。npm 来源观察到 7.8.3，与 packages/opencode/package.json 的 version 一致，但版本一致性本身不构成映射依据。"
  - "本轮复核结论：未出现来源失败，也未出现需要独立复核的来源冲突。custom_providers 上一轮记录的 Claude 一方路由 32000 上限例外与文档表述差异按条件并存，不影响本章十题。故保留 review_status: pending——pending_question_ids 中仍有其它七个主题的 53 道题未在本轮处理，按契约不代为结案，也不写入 reviewed_by。"
