investigation_notes:
  - "固定来源：source-kilo-code-repo（https://github.com/Kilo-Org/kilocode.git），baseline 62f674d4a91969ac077e4a7b6ceeb8a99de80e47，observed 9d0f7a1dd8e843457f1166f64fb87b2275d00b35，取用时间 2026-10-06T13:43:33.653Z，在 coordinator 已 pin 的临时检出上做只读 git diff，未重新 open 或 scan，临时检出路径按契约不写入记录。"
  - "本轮结论：configuration 主题需要维护，其余七主题无证据支持的变更，按契约不改写正文。共 250 个变更文件，其中非 VS Code 扩展、非文档站的仅 42 个。"
  - "新增事实（config.defaults / config-defaults-migration 小节）：memory_model 是运行时配置 schema 的顶层键，取值可选字符串或 null，格式 provider/model，未设置或不可用时 memory 改用会话模型。机制证据不取自 changeset，而取自四处源码：packages/core/src/v1/config/config.ts:206-209 的键定义；packages/kilo-memory/src/effect/config.ts:4-12 的 providerID/modelID 解析；packages/opencode/src/kilocode/memory/ports.ts:305-319 的三条回落分支（未配置不告警直接用会话模型、invalid model、model unavailable 且后两者记 memory model config ignored 警告）；packages/opencode/src/kilocode/memory/turn.ts:45-53 在 MemoryTurn.close 中以 cfg.memory_model ?? undefined 读入。changeset .changeset/memory-model-setting.md 只作意图说明，并已核对声明的 minor 版本影响落在 @kilocode/cli 与 kilo-code。"
  - "schema 规范来源漂移复核（父进程提示第 4 条，已确认为漂移并改正）：packages/opencode/src/config/config.ts:30 从 @opencode-ai/core/v1/config/config 引入 ConfigV1，第 173-174 行是 export const Info = ConfigV1.Info 且注释自述为 value re-export，第 303 行配置解析亦直接用 ConfigV1.Info。因此 Effect Schema 的实际定义处在 packages/core/src/v1/config/config.ts，opencode 侧只是再导出，两者是同一份 schema 而非两条独立路径。官方文档 packages/kilo-docs/pages/contributing/architecture/config-schema.md「Source of truth」小节仍写 opencode 路径，本章保留该文档引用并同时给出源码结论，属上游文档表述不精确，未按冲突处理。packages/opencode/src/config/config.ts 本轮不在变更集内，该漂移在 baseline 即已存在，本轮只是首次有顶层键落在 core 侧而使表述需要更正。"
  - "编辑器校验面同步核对：packages/opencode/script/schema.ts:77 以 ConfigV1.Info 生成本地 JSON Schema，第 58-64 行把 model、small_model 以及新增的 subagent_model、memory_model 一并标注为 MODEL_REF（https://models.dev/model-schema.json#/$defs/Model）。据此把「本地生成 schema 与运行时读同一份 core schema，但与云端上传路径仍是两条独立路径」写进正文，替换 v2 的笼统说法。生成面同步变化的 packages/sdk/js/src/v2/gen/types.gen.ts:2615 与 packages/sdk/openapi.json 属派生产物，未单独建引用。"
  - "custom_providers 已核对并排除：memory_model 的 provider/model 解析只是 packages/kilo-memory/src/effect/config.ts 里按第一个斜杠切分两段，不含任何 provider 侧语义；解析结果随后交给既有的 provider 注册表查找 provider.getModel(ProviderV2.ID, ModelV2.ID)。该查找与回退路径属 custom_providers 已有的 providers.models / providers.diagnostics 覆盖范围，本轮无新语义，故不新建 custom_providers edition，该主题八题仍留在 pending_question_ids。"
