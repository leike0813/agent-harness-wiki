  - 十题结论：scope / location / naming / format / schema / lifecycle / archive / cleanup / diagnostics 为 partial，database 为 unknown。已确认的机制包括 CLAUDE_CONFIG_DIR 覆盖含会话历史的配置根（默认 ~/.costrict）、--no-session-persistence 与 persistSession:false 关闭非交互模式转录写入、cleanupPeriodDays 默认 30 天且启动时删除超期会话文件并兼管孤立子代理工作树、子代理记录独立文件与按代理 ID 恢复、压缩边界事件与超阈值 MCP 输出落盘、~/.costrict/debug/<session-id>.txt 日志路径、/export 纯文本导出。
  - 明确未证实的部分：主会话转录文件与数据库均无路径、命名、格式与字段级 schema 文档；没有任何页面提到 SQLite 或会话索引；没有原生归档开关、归档依赖与恢复损失；没有手动删除转录文件的后果、重建或级联删除说明；没有直接读取或校验转录文件的官方命令。章节逐题写明「缺少证据不等于可以安全删除」。
  - 与相邻主题的边界：hooks 的 PreCompact/PostCompact 与 SessionStart/SessionEnd、skills 的内容注入与压缩后重新附加、mcp 的超阈值输出落盘、plugins 的缓存孤立版本 7 天清理、providers 的 OAuth 凭据存储都只在本主题相关处点到，并在 cross_topic_links 中指向对应问题 id，不重复撰写。
