investigation_notes:
  - 结论与结案状态：configuration 的
    config.sources/overrides/migration/diagnostics 与 custom_providers 的
    providers.auth/providers.metadata 答案未变。cfgdir 页本轮只新增 `showReasoning`
    设置、若干托管键与沙箱 proxy 环境变量细节，七层叠加顺序、仓库级定向合并表、`config.json`
    残留用户键被忽略的迁移语义、`/settings` Problems 与 `copilot config` 诊断叙述均可逐条复核；byok
    页仅提示框转义与链接变化，auth
    页令牌优先级（`COPILOT_GITHUB_TOKEN`→`GH_TOKEN`→`GITHUB_TOKEN`→keychain→`gh auth
    token`）、keychain 与 offline 语义一致；故这两个主题保留
    configuration-v4、custom_providers-v2。
  - hooks 新建 github-copilot-cli-hooks-v3：hooks.input 增加子 agent 负载字段
    `agentId`/`agentType`/`parentAgentId`（及 snake_case 形式，根 agent
    负载不变），hooks.conditions 增加 `-p` 会话的 `--trust-folder`
    单次信任；hooks.events/entry/output 与 hooks-ref 现有表逐条一致，answer 状态未改。
  - mcp 新建 github-copilot-cli-mcp-v3：mcp.entry 增加第五种入口 `/mcp search`（GitHub MCP
    Registry 或组织自定义 registry，实验特性，Ctrl+S 写入 `mcp-config.json`），mcp.lifecycle 追加
    `--trust-folder` 与注册表安装后立即启动。
  - native_plugins 新建 github-copilot-cli-native_plugins-v2：`copilot-plugins`
    已不再随运行时内置，改为需自行注册的普通市场（旧安装一次性迁移进 `extraKnownMarketplaces` 并把 `autoUpdate` 置
    `true`），内置默认市场只剩 `awesome-copilot`；`copilot plugins` 的
    `--kind`/`--scope`/`--mcp`/`--skill` 跨类标志已移除；本地目录市场中的 path-sourced
    插件改为实时加载（`/restart` 或新会话）；`/plugin list`
    记录团队默认启用与托管强制不可本地禁用；`--trust-folder` 影响仓库插件设置。
  - skills 新建 github-copilot-cli-skills-v3：skills.collision 答案未变（cmdref
    的技能位置表与“插件限定名共存、裸名路由高优先级插件”文本与旧快照逐字一致），skills.conditions 追加团队默认启用插件与
    `--trust-folder` 两条条件。
  - 新增证据：5 个文档快照
    snapshot-source-github-copilot-docs-{hooks-ref,cmdref,mcp,plugin-ref,prog-ref}-20261022
    及对应 archived_document artifact、8 条新 reference；复核确认这 5 份原件已在项目
    archive/github-copilot/ 下按 artifact 的 archive_path 归档。另新增
