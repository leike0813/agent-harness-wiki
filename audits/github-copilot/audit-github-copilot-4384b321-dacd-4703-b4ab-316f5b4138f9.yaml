investigation_notes:
  - "Round 2026-11-24: triaged all 32 changed doc sources against the newest retained originals. URL moves, note-markup escaping, CDN parameters and cloud-agent terminology churn were treated as no knowledge change; material changes concentrated in custom agents, MCP, hooks, plugins, skills, configuration, providers and CLI/transcript features."
  - "Staged and selected: skills v4 (added-root loads .github/.agents/.claude skill dirs; surface-dependent location caveat), mcp v4 (github-mcp-server only auto-configured; WorkIQ/browser-use/computer-use conditional; connectors view; /mcp search no longer experimental; STDIO-only form; untrusted prompt warning; cwd/filter/timeout/permission semantics; diagnostics), custom_agents v2 (personal profiles and environment-dependent precedence; added-root .claude agents; agent-vs-subagent semantics; model-policy/strict-tools-list; --model vs required agent model)."
  - "Not written, still pending: hooks (managed restrictions strictPluginOnlyCustomization/allowManagedHooksOnly; sandbox execution semantics and /sandbox policy troubleshooting; ! Invalid hook configuration message; parallel preToolUse; policy hooks run on host) from docs-hooks-ref/howto/concept; native_plugins (available/installed/enabled precedence, repository-default opt-out via settings.local.json, strictPluginOnlyCustomization, extensions component) from docs-plugins-concept/install/plugin-ref and cfgdir; configuration (remote→remoteSessions, remoteExport + --sync-session, --no-remote removal, defaultMode/defaultPermissionMode, managed-key composition, /settings public-only, sandbox allowOutbound/filesystem) from docs-cfgdir/cmdref/configure/allowing-tools/prog-ref; local_transcripts (/share and /export, /session info, --sync-session, session-store.db, remoteSessions/remoteExport) from docs-cmdref/best-practices/cfgdir."
  - "custom_providers not selected: current sources conflict on providers.json vs legacy COPILOT_PROVIDER_* precedence (cfgdir and cmdref say a populated providers.json wins; the new byok troubleshooting says an active env-configured provider wins over the default providers.json). Independent review is required before a v3 edition is written or selected."
  - "Documentation inconsistencies recorded in the staged chapters: modelPolicy (cmdref/agents-config-ref) vs model-policy (agents-howto example); copilot mcp get shows configuration plus tools (cmdref) vs configuration plus enabled state (mcp howto)."
  - "Previous dead-URL blockers (agents-concept, byok, cli-concept, comparing, hooks-concept, mcp-concept, plugins-concept, marketplace, skills-concept) are resolved by the new observation_url snapshots; the old audits remain pending/historical and are not closed by this audit."
