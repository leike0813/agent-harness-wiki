investigation_notes:
  - "Repository source 8dfa600 -> a9ba11a changed only changelog.md (releases 1.0.90 and 1.0.91). No source-code mechanism moved, so no chapter claim was derived from release notes alone."
  - "Six of the seven changed documentation pages (config-dir reference, about Copilot CLI, hooks reference, custom-instructions support, add LSP servers, programmatic reference) differ from their pinned snapshots only in Markdown table column padding and separator rows. Comparing all 110 references bound to the seven changed snapshots against the freshly retained pages, every excerpt still matches verbatim once table padding and separator rows are normalised, apart from the single supported-models excerpt noted below. No chapter was rewritten for the formatting-only pages."
  - "cli-command-reference carries two real content changes: the Supported models table dropped gemini-3.5-flash and gemini-3.6-flash and keeps gemini-3.7-flash, and a new `copilot sandbox ca` command section documents sandbox proxy CA management. Both are recorded in new snapshot snapshot-source-github-copilot-docs-cmdref-20261003."
  - "custom_providers v2 now lists the nine currently documented built-in models and states that the earlier snapshot listed the two removed Gemini entries."
  - "configuration v3 documents `copilot sandbox ca` (status/create/trust/rotate/remove), the ordinary-user requirement, and that it rejects --config-dir so COPILOT_HOME is the only way to target a non-default home."
  - "Open gap: changelog 1.0.90 records --mcp-github-auth to scope GitHub account auth to approved MCP server origins, but no registered official documentation page describes its values, defaults, or applicable transports. Recorded as source_inspected release-note evidence only; mcp.auth is marked partial and no configuration syntax is claimed. Re-check when GitHub publishes reference documentation for the flag."
  - "Open gap: changelog 1.0.90 names 'GPT-6.1 Sol' while the command reference lists `gpt-6-sol`. The two labels are not reconciled by any fixed source, so the chapter reports the documentation spelling only."
  - "The archive originals for the pre-existing github-copilot documentation snapshots are absent from this workspace, so their excerpts could only be compared against the freshly retained pages, not against the original bytes. This predates this round."
