investigation_notes:
  - "local_transcripts first pass for github-copilot, surface cli only. The vscode, jetbrains and web surfaces are declared in catalog/harnesses.yaml but were not investigated in this pass; they derive not_investigated."
  - "The public repository github/copilot-cli publishes no CLI implementation. At commit 6783c47bfd23f2b497808cc3b8d217560bdf19bf the tree holds only 18 files (README.md, install.sh, changelog.md, LICENSE.md and GitHub workflow definitions), so no first-party source code, schema definition or storage module is inspectable. No mappings were written because source-level knowledge cannot be established for a shipped npm package."
  - "Session storage layout is first-party documented: the CLI best-practices page gives ~/.copilot/session-state/{session-id}/ containing events.jsonl, workspace.yaml, plan.md, checkpoints/ and files/. That page and the config-dir reference carried transcripts.location to answered; the other nine questions stay partial because the record schema, write and flush rules, identifier encoding, database question and archive semantics have no first-party statement."
  - "The remaining mechanism facts come from changelog.md at the pinned commit, used as source_inspected vendor release notes rather than source code or runtime observation: the 0.0.342 session logging overhaul and the lazy history-session-state migration on resume, events.jsonl metric persistence at session end, /session delete and delete-all, the local-versus-server-backed deletion distinction in the Sessions tab, /fork origin, --name and --resume=<name>, --continue working-directory preference, automatic compaction checkpoints, resume integrity behaviour, GitHub.com cross-device session sync, startup pruning of ~/.copilot/logs/, sessionEnd timing and the settings.json split."
  - "transcripts.database is recorded as no database, based on the absence of any database file in the documented ~/.copilot top-level listing. That is a negative inference from an enumerated list, not a vendor statement, so the question stays partial; a closed-source embedded store cannot be excluded from documentation alone."
  - "No example events.jsonl record is given. With no published schema, any sample would be fabricated; the schema gap is listed explicitly instead."
  - "Blocker: source-github-copilot-docs-cli-concept returned HTTP 404 in this scan. The pinned page about-copilot-cli is the first-party source for automatic context management, which backs part of transcripts.scope and transcripts.lifecycle. The failure does not prevent publication because the remaining pinned pages still carry those mechanisms, and the existing snapshot for that page was reused rather than re-fetched. The affected scope and the alternative entrypoints used are listed in the sibling markdown report."
  - "Cleanup discipline: the config-dir reference safe-to-delete table covers agents/, skills/, hooks/, config.json, instruction files, extensions/, installed-plugins/ and logs/, but not session-state/. The chapter states that this neither authorises nor forbids manual deletion of session directories and gives no recommendation."
