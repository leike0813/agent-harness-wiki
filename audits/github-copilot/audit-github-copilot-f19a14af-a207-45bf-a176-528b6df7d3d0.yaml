investigation_notes:
  - 本轮 triage 分类：maintain；范围限 configuration 与 hooks 两主题的固定问题。
  - 新建 edition：configuration v4、hooks v2；v3 与 v1 保留未改，chapter-current.yaml 切到新版本。
  - 固定来源：source-github-copilot-repo 475c5ba（changelog.md 第 15 行为推翻性表述）、docs-cfgdir 8e729d40、docs-cmdref 0a0c815d、docs-hooks-ref 3b492ffd；均新建 snapshot/artifact 与 reference，不改写既有引用。
  - 同页另外的改动按范围排除：沙箱 host rules/代理改写、/sandbox 对话框 Auth→Credentials 标签、托管 permissions 新增 limitTo、调试日志与预会话环境选择器、模型 /model 表描述，均不改变已登记的配置字段、路径、加载顺序或条件。
  - cmdref 的 `copilot sandbox ca` 段落删除了「不接受 --config-dir」的例外，与 v3 已发布步骤直接冲突，按同一类推翻处理并改写。
