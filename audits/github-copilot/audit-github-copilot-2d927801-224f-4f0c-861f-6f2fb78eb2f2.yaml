investigation_notes:
  - 本轮 triage 分类：maintain（含来源阻塞）；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：maintain（同时保留来源阻塞）；范围限 hooks、custom_agents 与 configuration
    的固定问题。
  - hooks 文档新增 agent-scoped hooks：在自定义代理 frontmatter 里声明 hooks
    事件映射，仅在该代理被选中时运行，除会话/用户/仓库/插件/策略 hook 外还会叠加；支持 windows/linux/osx 覆盖，子代理 Stop
    映射到 SubagentStop 且连续 8 次拦截后忽略，远程或组织托管的代理定义不运行。
  - cfgdir 文档新增 inlineImages 设置（Kitty 图形协议渲染图片，禁用时回退文本占位），并改写
    forceRemoteSettingsRefresh：缓存策略不能满足新鲜度要求，失败时不再作为回退。
  - cmdref 文档改写 /add-dir（开启沙箱时同时授予目录沙箱访问）、/model（模型 ID 大小写不敏感，规范 ID 会被保存）与
    /sandbox（对话框给出的建议）。
  - source-github-copilot-docs-cli-concept 仍返回 404，与 2026-10-09
    审计记录的同一阻塞一致且无新证据，按规则不重复派发，保留 baseline 与 pending。
  - 仓库单提交 a3f560e 仅 changelog.md 的 1.0.96 版本条目（1 个文件），源码无语义变化。
