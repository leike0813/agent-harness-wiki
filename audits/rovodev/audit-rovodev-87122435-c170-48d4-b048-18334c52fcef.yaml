investigation_notes:
  - 本轮覆盖 registry/harnesses/rovodev.yaml 登记的全部 14 个 official_documentation 来源，逐个观察成功，没有 blocked；pending_audit_refs
    为空（audits/rovodev 在本轮之前没有记录）。全部 14 个来源都被扫描器报为 changed，本 Agent 自己重跑 `pnpm sources:scan rovodev` 得到的
    observed hash 与 sources:check 导出的输入逐个相同，两次观察之间没有从 changed 变 blocked 的来源。
  - 字节身份变化的成因是站点整体重新部署，不是文章内容改动：13 个 support.atlassian.com 页面在 HTML 顶部注释里带同一份构建信息
    （COMMIT 96b24966daa19fea6df9e874492f5ac70085c42f、RELEASE_VERSION sac@50764、UPDATED 2026-10-02T23:27:23.055Z），而本项目的文档来源
    以 identity-markdown@1 记录整页原始字节，原件不含这两个快照的页面外壳自然不同。上轮快照 source_fetched_at 为 2026-09-30，
    介于其间的 2026-10-02 站点部署解释了 13 个页面同时变化。
