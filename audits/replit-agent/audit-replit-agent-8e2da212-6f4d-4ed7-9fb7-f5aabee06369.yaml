  - 本轮 triage 分类：narrow_investigation；入口限 mcp 与 configuration 的固定问题。
  - docs/connect-via-mcp、docs/app-configuration、docs/add-collaborators
    三个来源内容哈希变化，但上一版原件未被 archive 保留，无法逐行比对；只能以当前原件对照章节已登记结论核实。
  - docs/index 的改动仅为页面数量统计与 Stripe 用例条目变化，按无知识影响排除。
  - 基线裁剪造成的能力边界（必须照实记录，不可写成"无变化"）：archive/replit-agent/ 下只保留了本轮新原件
    artifact-source-replit-connect-via-mcp-doc-aa555ff250cb、
    artifact-source-replit-app-configuration-doc-8cbaf19fbafd、
    artifact-source-replit-add-collaborators-doc-ed7a32ebecb4，
    旧哈希目录与 knowledge 内登记的 archive/replit-agent/artifact-<source-id>/raw.md 均已不存在。
    因此本轮只能证明"当前原件仍支持已发布的每一条答案"，无法证明"该页其余部分未变"。
  - 实际读取入口：archive/replit-agent/artifact-source-replit-connect-via-mcp-doc-aa555ff250cb/source.md
    的 Documentation Index 前言、Connect a pre-listed MCP server（Steps：Open the Integrations
    catalog / Pick a server / Sign in）、Add a custom MCP server（Steps：Open the add-server
    dialog / Set a display name / Enter the server URL / Test & save，以及 trust 警告）、Use
    MCP tools in Agent、Share an install link（含 McpLinkGenerator 的 payload 构造）；
    archive/replit-agent/artifact-source-replit-app-configuration-doc-8cbaf19fbafd/source.md
    的前言与隐藏文件步骤、replit.nix file、.replit file 键表、Configuring basic settings
    （Entrypoint / Run command / Including environment variables）、Advanced configuration
    options、Packager / Deployment / Port configuration、Accessing Replit App environment
    metadata、Environment variables 表；
    archive/replit-agent/artifact-source-replit-add-collaborators-doc-ed7a32ebecb4/source.md
    全文（Documentation Index 前言、SCIM Note、Steps：Open Workspace collaborators / Choose a
    role / Enter email addresses and send invitations、Next step 卡片）。
  - mcp.entry（verified-against-current-source）：预置 server 入口仍是 replit.com/integrations
    的 Discover integrations 目录、按 All types 过滤 MCP、逐个 Sign in 完成 OAuth；
    自定义 server 入口仍是 MCP Servers 面板的 + Add MCP server，字段仍只有 Display name /
    MCP Server URL（HTTPS endpoint）/ Advanced settings 自定义 header，保存动作为 Test &
    save；安装链接仍为 https://replit.com/integrations?mcp= 加 base64 JSON payload。
    章节 mcp-entry-definition 记录的四类入口与 ref-replit-mcp-connect-prelisted、
    ref-replit-mcp-connect-custom 的短摘录在当前原件中逐字可查，未被推翻。
  - mcp.auth（verified-against-current-source）：当前原件仍写明 Test & save 时 "Replit attempts
    to connect and walks you through any OAuth flow the server requires"，Advanced settings
    用于 "add custom headers (e.g. X-API-Key) if the server needs authentication"，与
    ref-replit-mcp-auth 的两条认证路径（OAuth DCR / Custom headers，来源为未变化的
    mcp-overview 页）一致；Enterprise 自带 OAuth 客户端仍由未变化的 managing-connectors 页
    支撑。token 刷新、凭据存储与轮换仍无来源，原缺口陈述不变。
  - config.sources（verified-against-current-source）：当前原件仍以 .replit 与 replit.nix 两个
    文件配置 Replit App，两者默认隐藏、需 Library → Files → Show hidden files 才显示；
    .replit 的键表（entrypoint、modules、[nix]/channel、packages、[unitTest]/language、
    [gitHubImport]/requiredFiles、[deployment]/run/deploymentTarget）与 replit.nix 的 deps 数组
    （pkgs. 前缀）均未变；Environment variables 表与 REPL_* 变量清单仍在。config.defaults 依赖的
    "无可枚举默认值来源"结论同样未被推翻。
  - config.overrides（verified-against-custom-source 之外的交叉核对后 verified-against-current-source）：
    当前 app-configuration 页只给出单文件内的键作用域（[run]/[run.env]、[deployment]、
    [packager.features]、[nix]）与"shell 重载后同步"，依旧没有跨来源的合并、覆盖顺序或删除标记
    规则；Custom Instructions 与 replit.md 的分工、Secrets 与 Configurations 按敏感性分离、
    多环境 published/testing configuration 等结论来自未变化来源。因此 config.overrides 的
    partial 结论与缺口陈述照旧成立，无需新建章节 edition。
  - docs/add-collaborators 判定为超出派发问题：该页讲的是团队 Workspace 的成员邀请与角色
    （Member / Guest / Viewer）、SCIM 与 SSO 域限制、逗号分隔批量邀请，以及 Next step 的
    "Manage connectors" 链接。它不描述交给 Agent 的配置来源（无 replit.md、.replit、
    replit.nix、Secrets、Settings 分组），也不描述任何覆盖或优先级机制，因此对
    config.sources 与 config.overrides 两题没有落点。其唯一被引用处
    ref-replit-collab-invite 支撑的是 config.trust（角色可见性），不在本轮 question_ids 内；
