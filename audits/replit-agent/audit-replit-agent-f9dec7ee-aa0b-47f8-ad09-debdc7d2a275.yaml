  - "local_transcripts 首采：replit-agent 只登记 web 一个界面，无 git 仓库来源，证据全部来自官方文档 markdown 快照；快照 version_applicability 均为 unknown，结论不绑定具体产品版本。"
  - "工作区为 pinned 检出 /home/joshua/orca/workspaces/agent-harness-wiki/local-transcripts-first-pass（只读），可写目录仅 candidates/replit-agent。"
  - "关键判断：Replit Agent 是托管 Web 服务而非本机 agent 进程，读者在本机找会话记录文件属于找错对象；正文据此把服务端任务对象、App 状态 checkpoint 与 Memory 偏好摘要与真正的会话 transcript 严格区分。"
  - "本轮未新建任何 artifact、snapshot 或 reference：archive/replit-agent/ 下磁盘上仅存 replit-ai-integrations 一份原件（与本主题无关），无法为其它来源计算真实 raw_sha256，故只复用既有已登记 reference，不猜测 locator 与摘录。"
  - "缺口（照实保留为 unknown/partial）：transcripts.location / naming / format / schema / database 五题为 unknown——登记来源无任何路径、文件名、格式或字段定义；scope、lifecycle、archive、cleanup、diagnostics 为 partial，仅覆盖服务端任务生命周期、App 状态快照与 Memory 偏好摘要。"
  - "明确未做推断：未把服务端保留策略写成本机保留策略，未把 MCP/SDK 读取路径当成本机落盘机制，也未因缺少证据而写成不支持或可以安全删除。"
  - "保留 custom_providers 的四个 pending 题（providers.auth / protocol / responses / diagnostics）不动——那是上一轮 ai-integrations 来源变化留下的待处理项，本轮未复写该主题，故 review_status 维持 pending。"
