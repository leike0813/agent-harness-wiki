  reason: 'source-zed-repo: crates/agent/src/agent.rs 的 release_session（1789-1812 行）新增
    thread.cancel(cx) 并置于 enqueue_save 之前；crates/agent/src/thread.rs 的 cancel（2357-2376
    行）递归取消子代理后调用 flush_pending_message，后者（4127-4152 行）把 pending 助手消息收尾追加
    进 messages、刷新 updated_at，并为无结果的工具调用补写 is_error 工具结果（TOOL_CANCELED_MESSAGE）。
    落盘效果分两种：没有运行中 turn 时刷盘同步发生在入队保存之前，收尾消息进入这一行；有运行中 turn
    时刷盘在异步取消之后，而会话已从内存表摘除，save_thread（1821-1831 行）查不到会话即返回，该行
    只保留入队时捕获的状态。这属于 transcripts.lifecycle 的「关闭」时机，未改变任何记录字段、版本号
    或路径。'
