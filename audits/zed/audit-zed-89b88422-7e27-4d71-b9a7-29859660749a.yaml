  → flush_pending_message 的收尾写入因此成为关闭会话时的可观察落盘行为；进一步核对 save_thread
  （1821-1831 行）在会话已摘除时直接返回，因此异步刷盘的那部分写入不落盘，正文按两种路径分别写清。
