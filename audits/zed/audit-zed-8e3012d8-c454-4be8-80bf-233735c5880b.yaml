    menu::SecondaryConfirm（macOS Cmd、Linux/Windows Ctrl）选择模型、profile 或思考强度进入
    thread-only；选择器旁出现圆点，Reset to Defaults（agent::ResetThreadToDefaults）与 Save as
    Default（agent::SaveThreadAsDefaults）退出；收藏循环在非 thread-only 时也写默认。旧行
    38-42、50-52、84-86 的 local_transcripts 文档引用本轮零 hunk，答案不变；新行只作为
