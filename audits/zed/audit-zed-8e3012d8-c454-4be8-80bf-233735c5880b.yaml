investigation_notes:
  - >-
    本轮 triage 分类：maintain（worker；固定来源
    6501df15765d66d6c2a2b66b1eb22434ccef3f86 →
    2664a0aa1eae5dabf8f8273c03f88d53061ca7dc，下载的 compare diff files=136）。只读
    /tmp/gitdiff-1125/zed--source-zed-repo.diff 中七个已引用文件的 hunk，并从
    raw.githubusercontent.com 该提交取回文件计算 sha256；不重扫来源、不扩题。
  - >-
    crates/acp_thread/src/acp_thread.rs（HEAD sha256
    15a29926d0384e09cfabb443f31056d1d32278a07d68757c64cd74f1b6c0d6fb）为终端创建重构：
    AcpThread::create_terminal 新增 shell 参数，由 NativeThreadEnvironment 统一解析
    project/remote 默认 shell 后传入；Windows WSL 专用分支取消，Linux/Windows 沙箱与 headless
    都走同一 ShellBuilder + prepare_sandbox_wrap；SandboxAuthorizationDetails 删除
    warn_windows_fs，Windows DrvFs 预提示授权函数与测试一并移除。属于沙箱/终端行为，不写
    threads.db、不改消息/工具持久化；该文件既有引用 set_draft_prompt 与 register_subagent 本轮零
    hunk，local_transcripts 与 custom_agents 答案均不变。本轮未派发 sandbox 主题，不扩题。
  - >-
    crates/agent/src/agent.rs（HEAD sha256
    8bf69c7082c3381fc07c4424a1746524e1d29e41b1f72526cbcaed63b830b3d6）生产改动两处：
    NativeAgentModelSelector::select_model 改为在设置模型/思考/速度后调用
    thread.save_default_model(cx)，替代原先直接 update_settings_file 的写法，并实现
    AgentModelSelector::mark_thread_only；NativeThreadEnvironment 解析 terminal_shell 并传给
    create_terminal。新增测试覆盖 thread-only 选择不覆盖待写默认、重载后继续使用被移除模型后的替代模型、
    hosted 目录变化后继续会话。影响 custom_agents.overrides，不改变 local_transcripts 的持久化格式。
  - >-
    crates/agent/src/db.rs（HEAD sha256
    09d4f23c3ca726d303d86520179b2734c3999fb6c56cd9c0cf714c4de6f55cee）只在 DbThread 增加
    #[serde(default)] pub thread_only: bool 与
    pub profile_downgraded_for_restricted_workspace: bool；SharedThread、Default/构造函数与测试夹具
    补 false。DbThread::VERSION 仍为 0.3.0，threads 表列、data_type、zstd level 3 与 upsert 路径
    均未变。影响 local_transcripts.scope/schema。
  - >-
    crates/agent/src/thread.rs（HEAD sha256
    ab7f2f096b7bcecdb76a350926eccd04caf14ed786c6dc5dfa89347ddae524ca）新增
    NewThreadSettings 提取默认 profile/模型思考/速度；Thread 增加 thread_only 字段，
    StreamingSaveKey 增加 thread_only 与 profile_downgraded_for_restricted_workspace；
    from_db 从 db_thread 还原这两个字段（此前 profile 降级固定为 false），to_db/save payload
    同步写入；新增 mark_thread_only、save_default_model/profile、save_model_options、
    write_default、save_as_defaults、can_reset_to_defaults、reset_to_defaults，统一在
    write_default 跳过 thread-only 与 subagent；set_speed 改为 Option<Speed>。另有终端 shell
    名称进入系统提示、Windows DrvFs 警告删除等沙箱改动。影响 local_transcripts.lifecycle 与
    custom_agents.overrides。
  - >-
    crates/agent_ui/src/agent_panel.rs（HEAD sha256
    524612eb89d525d1b2db70d873cd819ea7e728fca16339139b4681ede0622543）生产改动只有
    NewThread 时对空草稿调用 reset_empty_thread_only_draft：空且为原生线程的 thread-only 草稿
    就地 reset_to_defaults，有内容的草稿保持 thread-only；其余为测试。属于 UI 边界行为，官方文档
    只描述“新线程从默认开始”，未单列该去留规则；不改变章节已发布的入口/覆盖答案，故只在审计记录，
    不另写小节。
  - >-
    crates/agent_ui/src/thread_metadata_store.rs（HEAD sha256
    19ea4e998d67d81c4f56ed5655146207ce61d366aa27817b294bca98300bd86b）仅测试夹具补上两个新
    DbThread 字段默认值，无生产代码变化，不构成答案变化。
  - >-
    docs/src/ai/agent-panel.md（HEAD sha256
    1f1aa0ce49cdeb2c4c51a5c7467fed8b64d5ebe67fbb345c7ca25e1615835eb5）在 Changing Models
