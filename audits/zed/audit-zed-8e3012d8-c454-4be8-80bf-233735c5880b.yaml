      Zed Agent 的模型/profile 线程内覆盖与默认值持久化成为用户可见机制：选择模型即写入
      agent.default_model；用次级确认（menu::SecondaryConfirm / Cmd / Ctrl）进入 thread-only
      后不再写默认；Reset to Defaults（agent::ResetThreadToDefaults）恢复默认
      profile/模型/思考/速度，Save as Default（agent::SaveThreadAsDefaults）把当前选择写成默认；
      write_default 对 thread-only 与 subagent 一律跳过，自动降级的 profile 不被 Save as Default
      写回。新 edition zed-zed-custom_agents-v2 扩写 agents-invocation-overrides，其余小节保留。
