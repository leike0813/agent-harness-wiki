investigation_notes:
- 本轮 triage 分类：maintain
- 仓库前进 29 个提交，含 ACP 会话与工具 ID 升级到 v2、通过 ACP v2 发布原生命令、工具事件与权限选择升级。
- local_transcripts 与 custom_agents 章节引用该仓库，需要按固定问题复核。
- 定向结论（worker，commit b47a4ca595d3a3fba116b9e78ef01a46e2e43f3e → 93d745668805029476e6d7fbb19652116fed51de）：两个主题的已登记答案均未发生实质变化，章节与 registry 选择保持现状。
- local_transcripts 未变：DbThread 字段集合与 DbThread::VERSION（"0.3.0"）在 crates/agent/src/db.rs 未变；本轮 db.rs 的实质改动只是把 DbThreadMetadata.id / parent_session_id、load_thread/save_thread/delete_thread 的入参从 acp v1::SessionId 换成 acp v2::SessionId（两者都是 Arc<str> 文本 id），并新增两条只读兼容性测试证明旧行仍按原样读回、保存时 id/parent_id/subagent_context 不变、版本号仍为 0.3.0；threads 表 DDL、数据目录路径、zstd 压缩、消息枚举与流式保存抑制逻辑（StreamingSaveKey/can_skip_save_while_streaming）在本轮 diff 中零改动（git diff 对 thread.rs、agent.rs 的保存相关标识无命中）。git 证据：93d745668805029476e6d7fbb19652116fed51de + crates/agent/src/db.rs + bbb9750190efb8aed023fd078a0bfe121c81960e35b615fba7e2486afc4f174a；+ crates/agent/src/thread.rs + 834663232b7e2edbf1355540fb154d334d4e2f25001af4edcc68882df4f412d2；+ crates/acp_thread/src/mention.rs + 9233447c926cd4c3b066b65cd99e616c6542d9c00c323ca029f790b7317a9abb；+ crates/agent_ui/src/thread_metadata_store.rs + 713928c7c4d373a9c87073bb219e700ee30bd9085492edba474de61e7c4c4052。
- custom_agents 未变：自定义 agent 的定义入口 crates/settings_content/src/agent.rs、crates/agent_servers/src/{custom.rs,agent_servers.rs}、crates/agent_settings/src/agent_profile.rs 本轮零改动；spawn_agent_tool.rs 的改动只是 SessionId/ToolKind/Meta 从 v1 类型换成 v2 类型加 update_fields 调用形式变化，SpawnAgentToolInput 的字段与用途不变，因此 agents.entry/format/roles/invocation/overrides/limits 均不受影响。
- 「agent：Publish native commands using ACP v2」核查结论：crates/agent/src/agent.rs 的 build_available_commands_for_project 只是把 AvailableCommand/AvailableCommandInput 从 v1 类型换成 v2 类型（Unstructured → Text），发布的命令集合本身不变（原生 /compact 加 context server 注册的 prompt），且 custom_agents 章节登记的六个问题均未记录原生命令的发布机制，因此不构成对已登记答案的改变，不新开小节。
- 「agent_servers：Preserve initial ACP session updates」核查结论：crates/agent_servers/src/acp.rs 的 new_session 增加注册屏障，使首个 session update 不再被丢弃；这只影响 ACP 外部 agent 会话建立时的更新分发，属于 agents.diagnostics 未记录的传输层时序，custom_agents 章节未记录该行为，故不构成答案变化。
- ACP SDK 升级 3.1.0 → 3.3.0（workspace Cargo.toml 第 530 行，agent-client-protocol）：属依赖churn。本轮已专门核对它是否改变本地会话记录的存储/命名或原生命令发布，结论为均未改变。
- 明确排除且未调查：crates/agent/src/tests/*、thread_store.rs 超出 session-id 类型迁移所需的内部逻辑、全部 UI/TUI 渲染改动（agent_ui/*、gpui*、editor、collab_ui、markdown、sidebar 等）；以及本批次明令不触碰的 configuration、skills、mcp、custom_providers、hooks、native_plugins 主题。
