investigation_notes:
  - "逐文件 triage（e76235b→fb7511a，只取与已引用文件/符号交集）："
  - "CHANGELOG.md — 3.1.5 条目是本章组变更清单：远端插件库、tool_result_images、模型目录改名与默认开启、去掉 128 子会话生命周期上限、tools 权限成为配置错误、流中途瞬时错误重试、Sessions 页面与 /cd。已新增 ref-mv-315-changelog-* 引用。"
  - "vibe/core/config/vibe_schema.py — 移除 routed_default_model/routed_model_config/routed_extra_models 与对应注入校验；新增 enable_model_catalog（默认 true）、enable_builtin_models、experimental_enable_remote_plugins；max_lifetime_subagents 的 128 描述删除；新增 _reject_unknown_tool_permissions；新增 _leave_out_models_without_provider；resolve_default_model_alias 不再看路由字段，但目录默认值 catalog_default_model 仍可由 GrowthBook 的 model_catalog_filter 提供。"
  - "vibe/core/config/layers/growthbook.py + _catalog_filter.py — set_variants 仍读取 MODEL_CATALOG_FILTER 并写入 CATALOG_FILTER_KEY；过滤结果的 catalog_default_model 由过滤规格的 default 决定，仍被 resolve_default_model_alias 首先采用。独立复核指出首轮把它们误写成“GrowthBook 不再影响默认模型”，已按此修正。"
  - "vibe/core/config/layers/model_catalog.py — 目录字段集为 name/provider/alias/display_name/supports_images/max_context_length/temperature/thinking_levels/thinking/auto_compact_threshold/requires；层只读且位于内置默认值之上。"
  - "tests/core/config/test_vibe_config_schema.py — test_models_are_kept_when_none_has_a_configured_provider 证明全部模型缺 provider 时被保留；test_a_pin_on_a_model_without_its_provider_falls_back_and_names_it 证明选中时回落到默认模型并点名 provider。"
  - "vibe/core/config/models.py — ProviderConfig 新增 tool_result_images 与 sends_tool_result_images；删除 parse_routed_model_payload/routed_model_keys；_SPARSE_OVERRIDE_LAYER_TYPES 用 AdminConfigLayer 替换 GrowthbookLayer（模型写回策略变化；configuration 章节未描述该写回策略，故只在此记录，未改写 config.overrides 正文）。"
  - "vibe/core/config/_migration.py — 新增 _migrate_renamed_enable_model_catalog（旧 true 丢弃、旧 false 保留）和顺序表注册。"
  - "vibe/core/plugins/_native.py — 新增 REMOTE 作用域、remote_plugin_dirs/names、_without_library_names、_without_builtin_names、_select_by_precedence(remote)、plugin.name.library_owned；扩展块新增 starterPrompt/volumes/defaultEnabled 与 starter_prompt/has_volumes 描述字段。"
  - "harness/.../vibe/_storage.py — STORE_FORMAT_MINOR=10、_GZIP_CHUNKS_MINOR/READABLE_STORE_FORMAT_MINOR=11、块名按未压缩摘要且允许 .json.gz、1 GiB 解压上限、稀疏历史位置不可读时丢弃并每次加载警告一次、_session_catalog 读取端同步改用 READABLE_STORE_FORMAT_MINOR。"
  - "harness/.../vibe/_subagents/_models.py + _controller.py — SubagentLimits 只剩 max_depth/max_children/max_concurrent_turns（默认 32/32），无 max_lifetime_names；spawn 达到存活上限先 _longest_waiting_child 驱逐，无等待者才 subagent_child_limit；关闭名字冲突有专门消息。"
  - "vibe/core/session/saved_sessions.py — relocate 只改 environment.working_directory/origin_directory 并丢弃 repository_root/checkout_root，对应 /cd 行为。"
  - "vibe/core/plugins/remote.py — REMOTE_PLUGINS_DIR = VIBE_HOME/remote-plugins（默认 ~/.vibe/remote-plugins），数据目录 VIBE_HOME/plugin-data/remote。"
  - "vibe/core/plugins/_enablement.py — is_plugin_enabled：远端/必需插件恒开，disabled_plugins 只对本地插件生效，本地插件以 default_enabled 或 enabled_plugins 决定。"
  - "vibe/app_server/_unified_harness_backend_adapter.py — 归档/恢复通过 _persist_unified_session_metadata 把 archived_at 写进 unified 会话元数据（meta.json），目录不移动；恢复传 archived_at=None 清空。"
  - "排除项（逐符号核对，均为 no-op 或只影响旧 edition）：vibe/app_server/_plugins.py、_runtime.py、_unified_permissions.py、experiments/active.py、paths/_vibe_home.py、trusted_folders.py、core/types.py 的改动只落在旧 edition 引用上（当前 8 个 edition 未引用），按“已发布引用保持不变”不触发章节修订；_unified_harness_backend_adapter.py 的其它改动同样只影响旧引用，但归档/恢复元数据写入已按复核意见补入 local_transcripts。"
  - "mcp：当前 edition 引用 vibe/core/config/models.py 的 MCP server 配置类与 vibe/core/tools/mcp/*、vibe/app_server/stdio.py:185 的“Unified Harness 是必需运行时”注释；本 delta 对 stdio.py 只加通道/会话停放参数，MCP 配置类与 mcp 工具模块无改动 → no_change。"
  - "skills：vibe/core/skills/models.py 仅新增 SkillScope.REMOTE 枚举值（供远端插件使用），当前 skills-v2 引用的是 SkillInfo/元数据区与 manager/parser 逻辑，均未变；远端插件 skill 已在 native_plugins 章节描述 → no_change。"
  - "hooks：当前 hooks-v3 引用的 vibe/core/hooks/models.py、config.py、_hook_config.py、_hook_matcher.py、_foreign_hooks.py 未变；vibe/core/config/harness_files/_harness_manager.py 仅新增 access_roots 字段（会话可写目录，不读取 config/skills/hooks）→ hook 文件发现规则 no_change。"
  - "agents 补充：vibe/core/agents/manager.py 新增 rediscover()（/reload 重扫 agent 目录），与 CHANGELOG 的 subagent profile 热加载条目一致；vibe/plugins/builtins/vibe/skills/vibe/SKILL.md 的 /reload 说明也加了 agent/subagent profiles。"
  - "configuration 补充：vibe/core/config/_catalog_filter.py 的 with_remote_models 在目录列出模型或 enable_builtin_models=false 时移除默认层模型，支撑“目录列出模型时内置模型不参与合并”的表述。"
  - "官方文档 8 个源仍以 HTML 观察入口重新取到内容；当前 8 个 edition 引用集不含任何 docs snapshot，故文档迁移本身不构成知识变化（与 audit-mistral-vibe-2cd4d3e0 的结论一致）。"
  - "新增快照 snapshot-mv-315-repo（artifact-mv-315-repo = README.md @ fb7511a，sha256 e5051665…），新引用均为 git_source_file 级别证据；旧 301 引用与旧 edition 字节未改。"
  - "本审计不引用历史 pending 审计（21f18606、a1dfa350、470a3a59、88a19df8、5af77669、20261006t134000z）；它们保持原状态，本审计的 reviewed 状态不会间接关闭它们。"
  - "高影响提示：模型目录开关改名与默认开启推翻已发布配置步骤（旧键仍能被迁移但不再被读取），已按独立复核要求标记 review。"
  - "独立复核轮（ReviewMistralVibe，2026-11-25）要求修正 7 项：GrowthBook 默认模型经 model_catalog_filter 仍生效；缺 provider 的两种情形；providers 章节剔除与 3.1.5 矛盾的旧 ref、补 available_models/allowed_models 依据；远端插件目录随 VIBE_HOME；归档只写 archived_at；defaultEnabled 仅本地且 disabled_plugins 优先；审计先 pending 再复核。以上均已落入 v4/v5 章节与 ref-mv-315-* 引用。"
