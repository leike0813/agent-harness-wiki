investigation_notes:
  - >-
    local_transcripts 首采（delivery=pr）。固定来源为 source-mistral-vibe-repo，
    commit 7c19608af06f6c61d63f8f7a5c3430da73fba2ab，工作区
    /tmp/ahw-source-workspaces/ws-7c19608af06f-0c300bd2-ea79-4428-ac9a-3172f273f388
    （只读，coordinator 已打开）；scan 本轮判定仓库与九份官方文档均为 unchanged。
  - >-
    所有新证据都是 kind=git_source_file 的源码快照，按“一个被引用的源码文件一个
    snapshot”建立，逐文件计算真实 content_sha256，excerpt 为源码逐字行段。
    本工作区不存在 archive/mistral-vibe/ 目录，因此本轮没有新建任何
    archived_document 记录，transcripts.archive 的文档侧缺口照实保留。
  - >-
    缺口：transcripts.archive 没有官方导出/归档命令，SessionMetadata.archived_at
    在本 commit 的 Python CLI 路径里没有找到写入点，unified 存储的 quarantine/
    目录语义未展开；transcripts.cleanup 缺少保留期配置与批量删除入口的证据。
    两者按 partial 记录，不据此断言可以安全删除会话目录。
  - >-
    范围限定：catalog 中 mistral-vibe 只有 cli 一个界面，结论只覆盖 Python CLI
    （vibe/）在该 commit 上的行为；Rust 前端（vibe/cli-rust/）与随仓库分发的
    harness 包常量单独标注来源文件，不做发行包版本映射。
