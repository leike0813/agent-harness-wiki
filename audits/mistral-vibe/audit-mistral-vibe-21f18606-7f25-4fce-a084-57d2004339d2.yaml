investigation_notes:
  - '范围：本轮只处理 scanner 标记的五个官方文档页（agents、api-keys、configuration-reference、
    safety、skills），逐条对照候选中已发布章节正文，不重扫来源。'
  - '关键限制（影响全部五页）：这五页的上一版基线原文都不在项目 archive/ 树里（archive/mistral-vibe/
    下只有本轮新归档的五个 source.md），因此无法做文本 diff。本轮结论一律是「当前归档文本仍支持 /
    不再支持已发布陈述」，这比「已验证的语义增量」弱，不能据此断言上游新增或删除了某段内容。'
  - 'agents（archive/mistral-vibe/artifact-source-mistral-vibe-docs-agents-087fa322eb4f/source.md）：
    读全文后与 custom_agents-v2 正文逐句比对，两处不再被支持：内置 agent 表现在含 smart-approve（已发布
    正文漏列）；Select an agent 一节只有 --agent / Shift+Tab / default_agent，没有 --auto-approve /
    --yolo（已发布正文按官方文档引用）。其余陈述仍被支持：custom agents 一节的 ~/.vibe/agents/ 与
    ./.vibe/agents/ 位置、agent_type 两态、safety 仅改边框颜色不强制权限、custom subagents 一节
    的 text-only 结果与不能向用户提问，均在当前文本中原样存在。已建 custom_agents-v3 修订。'
  - 'configuration-reference（…-configuration-reference-d4c6981b051a/source.md）：Models 一节只有字段表，
    没有模型 ID 清单与日期后缀说明（codestral-latest / ministral-8b-latest 在本页全文不存在），
    custom_providers-v2 对应陈述不再被支持，已建 custom_providers-v3 修订。其余被引小节仍被支持：
    Providers 字段表（含 [providers.extra_headers]、api_key_env_var 密钥必须用这种形式）、
    Agent definition files（不在 config.toml、agent_type/safety/system_prompt_id 键）、Top-level keys
    （default_agent 程序化模式被忽略并回退 auto-approve、allowed_models 按发给推理 API 的模型名而非
    别名匹配）、Environment variables（VIBE_HOME / MISTRAL_API_KEY / <PROVIDER>_API_KEY 属配置模型
    而非 config.toml 键）、Per-tool permissions、MCP servers 字段表。'
  - 'api-keys（…-api-keys-926431a0e275/source.md）：Give the API key to the CLI 一节仍完整支持
    configuration-v1/v2 与 custom_providers-v1/v2 的凭据陈述——三条路径（--setup 存 ~/.vibe/.env、
    MISTRAL_API_KEY、手写 .env）、环境变量优先于 .env、.env 只放凭据；Switch between accounts or
    providers 一节的 openrouter 示例与 providers-entry 正文逐字一致。无正文改动。'
  - 'safety（…-safety-1b1bc3c91f44/source.md）：Trusted folders 一节仍完整支持 configuration-v1 的
    config-trust 与 config-diagnostics 陈述（仅显式受信任目录加载 .vibe/、未信任时忽略并告警、
    记录在 ~/.vibe/trusted_folders.toml、交互式信任对话框、--trust 临时信任），也仍支持
    hooks-v2 的 hooks-entry / hooks-conditions（唯一前置条件是信任）与 skills-v1 的
    skills-conditions；Per-tool permissions 一节仍支持 config-trust 的工具权限配套陈述。
    该页新增的 smart-approve / utility_models 小节属 safety 主题范围，本轮固定问题未覆盖，不扩题。'
  - 'skills（…-skills-a87ce0619d88/source.md）：Skill format、Skill locations、Enable/disable/filter、
    Custom slash commands 四节仍逐条支持 skills-v1 已发布陈述——SKILL.md 示例字段一致、
    skill_paths → 受信任 ./.vibe/skills/ 或 ./.agents/skills/ → ~/.vibe/skills/ 的顺序、
    enabled_skills 非空即白名单否则减去 disabled_skills、user-invocable 默认 true 暴露为斜杠命令。
    无正文改动。'
  - '排除：scanner 影响的 mcp 与 native_plugins 主题经核对 source_refs 后不属于本次五页变更范围。
    mcp-v2 的 mcp-definition / mcp-exposure 引用 ref-mv-docs-config-mcp 与 ref-mv-docs-config-tools，
    两者摘录与当前 configuration-reference 页的 MCP servers 与 Per-tool permissions 两节一致（新增的
    api_key_env / api_key_header / api_key_format 字段反而与正文已列字段相符），故不建新 edition；
    mcp-servers 页本身 unchanged。native_plugins-v2 与 local_transcripts-v2 不引用任何 docs-* 引用。
    hooks-v2 除 ref-mv-docs-trusted-folders 外全部引用 ref-mv-docs-hooks-*（unchanged 来源）。'
  - '遗留：三个问题（agents.roles、agents.invocation、providers.models）本轮只能确认「当前文本不再
    支持已发布陈述」并据此更正正文，无法验证语义增量方向（新增还是删除），因此保持 pending，
    review_status 维持 pending；需下一轮取得可 diff 的基线或上游变更说明后再结案。'