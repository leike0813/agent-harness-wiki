investigation_notes:
  - 本轮固定在提交 dd2c04ce717c417731ab89c333cd0a72541e33ba（变更日志 3.0.1，基线 4ae5c5955da8e761318916bdb1a7f46f0b50c7d0），只读 pinned workspace，未重扫上游。
  - 逐主题核对结论：八个主题的已发布答案全部需要修订——配置层序与来源、agent 内置集合与委派工具面、provider 字段与默认模型、hook 执行位置、MCP OAuth 与 stdio 连接、插件保留命名空间、skill frontmatter 与投影、会话存储写入者与格式次版本。
  - 51 条旧引用仍绑定 2.26.0 的 source_revision 快照，按"已发布引用保留"原则未删除；新 edition 全部改用新快照 snapshot-mv-301-repo 下的 ref-mv-301-*，locator 与摘录按本提交逐条核对。
  - 官方文档本轮也变更，但新文档原件需要落在项目 archive/ 下，worker 不可写；因此新 edition 不新增文档快照引用，用户可见行为改由仓库内第一方文件（内置 vibe skill 的 MCP/agent 章节、插件作者指南、CHANGELOG）与源码承担证据。
  - 来源冲突：插件作者指南仍列六个保留命名空间，代码的 _RESERVED_NAMESPACES 为九个（含 agents/agent/collaboration）。冲突可由"指南文本滞后于实现"解释，正文以代码为执行依据并写明边界与诊断码 plugin.namespace.reserved。
  - 仍为 partial 的问题：plugins.install（无版本固定/更新/卸载入口的第一方依据）、transcripts.archive（无用户级导出归档命令，quarantine 触发与保留未说明）、transcripts.cleanup（无保留期配置与批量清理入口）。
  - 复核：本轮结论覆盖跨主题加载机制改变（配置九层栈含模型目录、hook 执行迁入 harness、会话存储写入者与次版本变更），按维护契约需独立只读复核；问题本身均已结案，pending_question_ids 为空，review_status 保持 pending 待复核。
