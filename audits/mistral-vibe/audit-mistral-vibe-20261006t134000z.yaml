investigation_notes:
  - 本轮 triage 分类：maintain
  - CHANGELOG 顶部新增 2.26.0（2026-10-05），其中与八主题直接相关的条目：app-server 可从宿主应用自带 root
    发现内置插件；~/.vibe/.env 的 API key 回退改为 0600 owner-only；模型接受 thinking_levels
    字段；/mcp <name> 接受浏览器展示名；每模型 max_context_length 可在 /config 编辑；插件可用 ./ 命令在自己的
    mcp.json 里启动自带 MCP server；[utility_models] 的 active 把功能钉到会话所用模型；permission =
    never 对敏感路径直接拒绝；Vibe 默认恒跑 Unified Harness，运行时缺失即报错而不再静默回退 legacy 引擎。
  - 23 个已登记来源文件在变更集内，含
    vibe/core/config/{_defaults.py,vibe_schema.py,models.py}、vibe/core/tools/mcp/registry.py、vibe/core/auth/mcp_oauth.py、vibe/core/plugins/_native.py、vibe/core/trusted_folders.py、vibe/utils/paths.py、vibe/core/session/session_lease.py、vibe/app_server/_plugins.py
    与 unified harness 适配器等。
  - Unified Harness 默认化直接影响以 Python vibe/core/**
    为机制真源的运行时与条件边界结论，需按实际文件内容重新核对，不能只凭 CHANGELOG。
  - tests/**、client-e2e goldens、build_backend、构建脚本、CI 与锁文件按已核对排除。
  - worker 20261006-mistral-vibe 结论（pinned workspace ws-7cb91894c40b-a9d3b8bc-084e-4f90-8d43-a7bd14a53c08，baseline 7c19608 → 7cb9189，仅 1 个 commit，1568 个变更文件）。
  - 变更集按目录聚合：vibe/cli-rust 401、vibe/app_server 50、vibe/core 36、vibe/cli 23、harness/ 59、vibe/utils 5、vibe/{plugins,setup,acp} 8、client-e2e 831、tests 122、其余零散。briefing 提到的 crates/ 与 packages/ 在本变更集中不存在，已按实际目录统计替代。
  - 已完成并写入候选：configuration（config.sources/.runtime/.trust/.defaults/.diagnostics）、custom_providers（providers.metadata/.models）、mcp（mcp.entry）、native_plugins（plugins.discovery）、local_transcripts（transcripts.scope/.format）。每条断言均带 ref-mv-cfg-* / ref-mv-plugins-* / ref-mv-mcp-display-name / ref-mv-lt-store-format-minor-8 引用，指向 commit 7cb9189 的 git_source_file（content_sha256 实算）。
  - 第 9 条（Unified Harness 默认化）已核实为真，但机制位置与 briefing 假设不同：不在 vibe/core/unified_harness/（该目录不存在），而在 vibe/_experimental_harness.py、vibe/app_server/_runtime.py、vibe/acp/entrypoint.py 与 vibe/core/experiments/active.py。resolve_harness_selection 不再读 GrowthBook 分流，UNIFIED_HARNESS_ROLLOUT 消费面被清成 frozenset()，默认路径构造 Unified Runtime 且失败即 raise runtime_startup_error，只有 --legacy-harness 能选旧引擎。
  - pending 保留 config.runtime：这是跨主题的关键加载机制反转，直接决定以 vibe/core/** 为真源的运行时与条件边界结论，按 SKILL 第 5 节须独立复核后才能进入已发布 edition。其余五章为普通更新，已作者自检（pnpm maintenance:candidates check 通过，exit 0）。
  - 需要 reviewer 额外注意（未列为 pending，属普通更新但有条件边界）：permission = "never" 遇敏感路径由提问改为直接拒绝，仅 Unified 后端成立（vibe/app_server/_unified_permissions.py _context_for，注释原文 "legacy prompts there, this is deliberately stricter"）。
  - CHANGELOG 线索逐条核对结果：第 1、2、3、5、7、8、9 条已回源核实；第 4 条（/mcp 展示名）仅存在于 Rust 前端 vibe/cli-rust/src/server/proto_mcp.rs resolve_source，Python TUI 无对应实现。
  - 第 5 条"每模型 max_context_length 可在 /config 编辑"的前端归属未定，两个前端都有 /config：Python TUI 在共享注册表 vibe/cli/commands.py 注册 config（别名 /config，描述 "Edit config settings"），实现在 vibe/cli/textual_ui/app.py _show_config，经 ConfigScreen（vibe/cli/textual_ui/screens/config/config_screen.py）与 write_callback=self._patch_config 落盘；Rust 前端 vibe/cli-rust/src/commands/commands.rs 自述 mirror Python's vibe/cli/commands.py，_show_config 与同名条目对应。但 max_context_length 在 vibe/cli/** 与 vibe/cli-rust/** 上 grep 均为 0，两端都未直接枚举该字段，是否真能在 /config 里编辑未定，配置字段本身两前端共用。
  - CHANGELOG 第 6 条（插件用 ./ 命令在自己的 mcp.json 启动 MCP server）在本变更集内无实现变化：_native.py 的 _load_mcp_servers 读 plugin.root/"mcp.json"、_resolve_plugin_command 处理 ./ 前缀，二者在 baseline 7c19608 即已存在且逐字相同，故未改写章节，仅在此记录已核对。
  - v1 章节中两处已过期断言已修正：local_transcripts 的 generate_titles 默认值（关闭 → 开启）与 unified store 的 STORE_FORMAT_MINOR（7 → 8）；custom_providers 中"固定来源没有上下文窗口独立字段"已被新的 max_context_length 推翻。
  - 范围外但已发现相关证据，留给 coordinator 决定是否另派：CHANGELOG 2.26.0 另有多条 hooks 相关变更（hooks.toml 在 unified harness 上重新收到 session_id/transcript_path/parent_session_id、system_message 呈现、失败原因），涉及 harness/runtimes/.../vibe/_foreign_hooks.py；本任务 briefing 未包含 hooks 主题，worker 未扩范围。
  - 另需 coordinator 判断的身份问题：VIBE_CLI 选择器（vibe/cli/_rust.py，unset 走 Rust TUI、VIBE_CLI=python 走旧 Python TUI，并有新的 vibe_cli_rust_tui_rollout 实验面）意味着同一产品下存在两个前端实现。catalog/harnesses.yaml 目前只登记 surface_id=cli，bindings[cli].status=unknown。是否新增界面 id 属 catalog 身份决策，worker 未擅自改动共享 catalog。
