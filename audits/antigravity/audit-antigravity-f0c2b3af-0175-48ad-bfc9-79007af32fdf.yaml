investigation_notes:
  - "local_transcripts 首采（harness-maintenance worker，delivery=pr），界面 cli。十个 transcripts.* 题各有一条可用答案，全部为 partial，没有写成 answered/not_applicable。"
  - "固定源码来源 source-agy-repo，pinned commit 274d81b9929aaa2b91a7266106d0d0b7f19adf52（基线 65a3c69e388148c9327f307efe82ddb1c0c8d7d4），只读工作区 ws-274d81b9929a-8820d38a-36ad-4d2d-bc01-2dcc4fc8ea72。该 commit 的仓库树只有 README.md、CHANGELOG.md、.github/ 与 examples/，不含 CLI 实现源码，因此本主题结论是发行说明与文档所陈述的行为，未写 mappings/。"
  - "证据构成：CHANGELOG.md 与 README.md 走 git_source_file artifact + 每文件一个 snapshot；CLI reference 文档的 5 条引用绑定到既有 snapshot-agy-cli-reference-doc。"
  - "缺口：本轮工作副本的 archive/antigravity/ 下没有保留官方文档原件，5 条文档引用的摘录取自对同一登记 URL（https://antigravity.google/docs/cli/reference.md）的直接读取，可能与快照内容存在差异；相关问题因此保持 partial。"
  - "未解决的实质缺口：会话文件所在的具体子目录、会话 ID 与文件命名规则、记录 schema（类型/字段/必填项/迁移）、SQLite 表结构与索引、官方保留期或自动清理策略，在登记来源中均无记载；正文按纪律写明已查入口与缺口，未把「没找到证据」写成「不支持」或「可安全删除」。"
  - "transcript.jsonl 与 .db 的关系未证实：来源只分别提到两者，未说明是一份记录的两种投影还是两套并行记录，正文记为未解决点，不做推断。"
  - "pending_question_ids 保持 scan 写入的其它主题遗留项不变；本轮十题均有可用答案，故未新增 transcripts.* pending 项，review_status 维持 pending。"
