investigation_notes:
  - 本轮协调者语义 triage 结论：narrow_investigation。已交回隔离候选做定向维护。
  - 本轮 antigravity 仍带 1 条未结案审计；安装文档变化可能与之相关，一并交回，但只交回本入口。
  - 定向核实结论：configuration 不需要改章节，当前选中版本 antigravity-cli-configuration-v3 保持不变。只读抓取 install.md 得 sha256 322c3ee907924d9e0b4ff4fd6927ba33779aabd65e3c159839ccf2c23526b4ab，与本轮扫描观察值逐字节一致，可确认比对对象就是扫描所见内容。
  - 比对覆盖了本入口被标记的全部面：章内引用 install.md 的来源恰好 6 条，与 impacts 标记的 source_refs 相同；逐条核对后 5 条仍逐字命中上游当前页面，且 6 条的 heading 全部存在。已发布摘录整体仍与当前页面一致。
  - 唯一漂移引用 ref-agy-configuration-install-api-key 属纯措辞改写：you have to 改为 you must，并删去句首 Only。命题本身（须同时设置 provider 与带密钥的环境变量，单独设 GEMINI_API_KEY 无效）逐字等价，config.runtime 的答案不变，故不为此新建章节版本。
  - 本轮无可用基线原件：archive/antigravity/ 不存在，且快照 snapshot-agy-install-doc 记录的 0706cc9870ceabc7dc1873cb0f61680385c1fd24f418904f643ffddb4d5d7fe4 早于本轮基线 403673e1…。因此无法逐行 diff，也不把当前页面上的任何内容判为本轮新增事实或本轮删除事实。
  - 已发布结论与当前页面一致，无相互矛盾之处：钥匙串凭据与 SSH 手动码登录流程、安装脚本的 --skip-path 与 --skip-aliases、GEMINI_API_KEY 的三条排障行、settings.json 中 modelProvider 的键名与 gemini 取值，在上游当前页面上均有对应。configuration 目录层叠、权限三表优先级、规则累加与去重、迁移与诊断各小节所依赖的其它来源本轮均为 unchanged。
  - 观察到但未采纳：当前页面含若干与配置相邻、章内尚未收录的材料（钥匙串小节的平台与静默登录细节、installer flags、另外三行 modelProvider 排障、shell profile 持久化示例、session 终止清理本地缓存目录）。因无基线原件不可归因于本轮变化，按不新增事实处理，留待专门的重锚轮次。
  - 旧审计 audit-antigravity-37963c6d-36f9-4f2f-b6df-aa68cabd8089 保持 pending：本轮变化不提供可执行的重锚入口——install.md 无基线原件可比对，且待重锚引用横跨 19 个页面；本轮观察到的漂移与上一轮已记录的文档整体改写属同一类（标题与小节行文改写，机制描述未变）。不为使台账显得干净而结案。
  - pending_question_ids 未改动：七道 configuration 固定问题仍因上一轮记录的整批引用重锚工作待处理，与本轮变化是否影响答案无关；其中的 custom_providers 条目不在本入口范围，未触碰。
