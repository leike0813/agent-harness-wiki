investigation_notes:
  - >-
    本轮的 19 个官方文档来源全部变化，但同一工作树内没有保留上一版文档原件（archive/antigravity 为空，
    主检出目录同样为空），因此无法做逐行文本 diff。改用重新抓取当前页面并逐条复核既有 319 条引用来定位影响：
    重新抓取的内容 sha256 与本轮扫描观察值逐条一致。
  - >-
    复核结论一：文档站整体改写过行文风格与章节结构（标题由 Title Case 改为 sentence case，部分小节合并或改名）。
    178 条文档类引用中有 107 条的短摘录或小节标题不再逐字命中上游；抽查确认机制描述本身仍在（例如 permissions.md 的
    Deny > Ask > Allow、action(target) 与全局通配语法，agent-settings.md 的 Default / Request Review / Turbo 预设），
    但引用已不能逐字复核，需要按新页面重锚。
  - >-
    复核结论二：141 条 file_lines 引用中，139 条落在 CHANGELOG.md 且只是行号整体平移 45 行（1.2.14–1.2.16
    三节插在文件开头），短摘录文本未变；另 2 条落在文档页，skills.md 的表格引用平移 -17 行，plugins.md 的
    引用行号未变。旧引用仍是对 77b1aad 快照与 2026-09-30 页面快照的正确引用，新增条目改用固定在 65a3c69 的
    新引用，不改写已发布引用。
  - >-
    复核结论三：53 道固定问题的当前版本中，至少有一道支撑引用不再逐字命中上游，因此全部保留为 pending。
    本轮交付的四个新版本只覆盖 CHANGELOG 明确变化的部分，文档类引用的逐条重锚需要先为本轮页面建立文档快照与归档原件，
    属于下一轮的工作。
  - >-
    本轮没有取得第二个 Agent 的独立复核：维护子代理上下文中没有可用的原生 subagent 委派工具。文档站的整体改写
    触及全部七个主题的引用基础，按维护规则属于需要独立复核的高影响变化，因此 review_status 保持 pending，
    不填写 reviewed_by 与 reviewed_at。
