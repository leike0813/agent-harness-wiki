investigation_notes:
  - |-
    比较窗口与基线：本轮 19 个 official_documentation 源的状态均为 changed，但 baseline 是 dead/moved URL 的旧值；实际语义比较使用各源最新 RETAINED original（artifact-agy-*-doc/raw.md，source_fetched_at 2026-09-30T03:19:01.017Z）对 2026-11-24T14:09:47–50Z 的观察文档。逐源 retained→observed sha256 前 12 位：skills eb11a56a→a8037deb；slash c04f3ec6→85977469；mcp 894da6ab→17ab3f92；hooks c1ce6447→c500f806；plugins 5768a2dd→a6ce5caa；marketplace 4efd06bd→8aebc9fe；sidecars 7763d96c→7f1e4c7f；subagents da1e45f9→457e9719。
  - |-
    续上：agent-settings cd8229aa→b14e2408；install 0706cc98→6b1fcfbd；models f70a1beb→38916967；settings f867637b→7714a0e5；rules f2d38ef2→8097f234；permissions f2dc8d81→8704d654；sandbox 90c58347→1d6d0ead；cli-reference 81a88de5→44917daf；cli-migration 26803485→47fa6974；cli-troubleshooting cee8cb62→922e825b；workflows-to-skills f71ee835→82f35e3b；repo 77b1aad→bb5c8da（仅 CHANGELOG.md）。
  - |-
    install 源的身份变化：source-agy-install-doc 的 url 仍是 docs/cli/install.md，observation_url 已改为 docs/getting-started.md，所以本轮观察文档是新的 Get started 页；原文的安装 flags、认证工作流与 API key 步骤都在 /docs/install.md，本轮没有该页的观察文档。配置章的 install/auth refs 保持旧快照且未改写，相关步骤未在 2026-11-24 文档上复核。
  - |-
    已维护并选中新 edition：skills v3（解析全局根 ~/.gemini/config/skills/、~/.gemini/skills/、~/.gemini/antigravity-cli/skills/ 与插件根 ~/.gemini/config/plugins/{plugin}/skills/；每回合元数据；/skills reload；workflows 全局路径 global_workflows 且 /migrate-workflows 仅 App 2.12.0+）；mcp v3（enabledTools/tools/timeoutSeconds；lazy/eager 与 schema 缓存；OAuth CIMD/PKCE/DCR；MCP Apps；远程仅 Streamable HTTP、url 为别名）；custom_agents v5（browser 自动/手动条件；/swarm 与 /teamwork；@子代理直连；主 agent 分配工具与权限）；custom_providers v2（modelProvider 已入设置键表；customModelsConfig/gcp；Gemini 4 与 Orchestrator；xhigh）；local_transcripts v2（transcript.jsonl 固定路径；--conversation/--log-file；.db 路径仍未知）。
  - |-
    暂不改变 selection 的 configuration：新 settings/rules/permissions/sandbox/agent-settings 文本推翻了已发布步骤——上一代权限系统现在描述为 business/enterprise 而非 Windows；unsandboxed 仅 business/enterprise，普通账号忽略并警告；enableTelemetry 改为账号保存、不在 settings.json、business 恒关；rules 不再从工作区子目录加载；默认 preset 改为 Default（sandbox 不可用时才 Request Review）并新增 Auto；hooks/plugins/rules 的全局路径与 settings.json hooks 行为也变化。按维护规则需独立复核，旧 edition v4 保持选中。
  - |-
    暂不改变 selection 的 hooks：新页面明确 hooks 写在 ~/.gemini/antigravity-cli/settings.json 时不会被加载（CLI 保留该键但从不读取），并新增 SessionStart、lastUserInput、overwrite、auto_approve、systemMessage/errorMessage 与 terminationBehavior；插件 hooks 落点与字段也变化。旧 v1 中「settings.json 也可放 hooks」属被推翻的配置步骤，需独立复核，selection 保持 v1。
  - |-
    暂不改变 selection 的 native_plugins：新 plugins/marketplace 文本把 Marketplace 安装 ID 改成 antigravity-plugins-official / antigravity-plugins-partners（旧示例 @agent-marketplace 不再正确），CLI 暂存目录改为 ~/.gemini/config/plugins/{plugin}，manifest 支持 displayName/version/logo/suggestedPrompts 等字段（旧页的 additionalProperties:false 只允许 name/description 不再成立），并新增 agy plugin import/validate 与 list --json。旧 v2 的安装命令与 manifest 约束属于被推翻的步骤，需独立复核，selection 保持 v2。
  - |-
    Git 源：HEAD 由 77b1aad 前进到 bb5c8da，changed_paths 只有 CHANGELOG.md；没有 pinned checkout 可读，新 CHANGELOG 的具体条目未用于本章结论。文档源已覆盖同一批能力变化（模型、Orchestrator、CLI flags 等），因此不建立版本映射。
  - |-
    复核请求：configuration、hooks、native_plugins 三个 topic 需要独立 reviewer 核对其被推翻的配置步骤与建议的新 edition；configuration 还缺少 /docs/install.md 的 2026-11-24 观察文档。其余五个 topic 已按新快照维护并通过候选 check，可在 reviewer 确认后一并集成。

