  source_refs:
  - ref-agy-custom-agents-changelog-agent-relative-paths
  cross_topic_links:
  - skills.roots
  - skills.conditions
  - mcp.entry
  reason: >-
    CHANGELOG 1.3.1（commit 968f117，第 13 行）固定了 markdown custom agent 的 skills:/plugins:/rules:/agents:/hooks:
    相对路径解析基准为 agent 自身目录：此前无论作为子代理还是主代理运行，写成相对 agent 自身文件的条目都被忽略，
    修复后可写 agents: [child.md] 调用同级 child。此前 custom_agents-v3 只登记了「路径规则与 skills 相同、
    支持工作区相对、绝对与代理相对」这一未加版本边界的说法（来自 1.2.2 条目），未说明代理相对一条此前不生效，
    属已发布章节被新证据纠正，因此新建 antigravity-cli-custom_agents-v4。skills 章节 v2 未对 agent frontmatter
    路径基准作任何断言，本轮无需改写 skills 章。
- topic: native_plugins
  question_ids:
  - plugins.install
  - plugins.lifecycle
  section_ids:
  - plugins-install
  - plugins-lifecycle
  surface_ids:
  - cli
  source_refs:
  - ref-agy-native-plugins-changelog-install-mcp-stop
  - ref-agy-native-plugins-changelog-marketplace-no-overwrite
  - ref-agy-native-plugins-changelog-plugin-bom
  cross_topic_links:
  - mcp.lifecycle
  - mcp.definition
  - config.migration
  reason: >-
    CHANGELOG 1.3.1（commit 968f117，第 12 行）给出三条命中原生插件机制的改动：Windows 上 /plugin 安装、重装、卸载前先停止该插件的
    MCP server 再替换或删除目录并事后重启（被其它 Antigravity 进程占用时提示关闭后重试）；从 marketplace 安装不再覆盖来源不同的既有插件目录，
    为「重装精确替换受管目录」补上跨来源例外；插件清单、mcp_config.json、hooks.json 带 UTF-8 BOM 时也能加载。此前 native_plugins-v1
    对安装只登记了精确替换与落点，未含这三项，属安装与生命周期语义的实质变化，因此新建 antigravity-cli-native_plugins-v2。
- topic: mcp
  question_ids:
  - mcp.lifecycle
  - mcp.diagnostics
  section_ids:
  - mcp-lifecycle
  - mcp-diagnostics
  surface_ids:
  - cli
  source_refs:
  - ref-agy-mcp-changelog-bom
  cross_topic_links:
  - plugins.install
  - plugins.lifecycle
  reason: >-
    已逐节核对 mcp-v2 的「生命周期」与「诊断」两节：1.3.1 的 /plugin 条目只描述插件目录被替换前后 CLI 对该插件 MCP server
    的停启动作与跨进程占用提示，主体是 /plugin 安装流程（已记入 native_plugins-v2 并交叉链接），未改变 mcp 章登记的启动时机、
    超时、重连、禁用落盘路径与诊断入口；BOM 一条针对的是插件内的 mcp_config.json，而 mcp 章的 BOM 结论（Windows 上
    UTF-8 BOM 的 MCP JSON 可解析）来自更早的独立条目 ref-agy-mcp-changelog-bom，不被本次条目推翻。故 mcp 章不改版。
