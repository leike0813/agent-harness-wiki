    cross_topic_links:
      - agents.entry
      - agents.discovery
    reason: >-
      source-agy-repo 的 CHANGELOG.md 在 commit 5e9c9c6c 新增 1.3.0 段落：Verbosity 默认值由 high 改为
      medium，且对从未显式选择者（含此前在 high 为默认时选过 high 的人）生效，可在 /config 改回，
      属 config.defaults 与 config.migration；另一条修复含空格、#、%、特殊字符与 Windows 盘符路径在
      workspace trust 上的识别，属 config.trust。本轮只维护这三个问题，其余 configuration 问题已核对为
      无事实变化；已登记 CHANGELOG 引用的行号属各自固定 commit 的事实，本轮不改写。
