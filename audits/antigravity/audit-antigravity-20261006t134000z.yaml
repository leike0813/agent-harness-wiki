investigation_notes:
  - 本轮 triage 分类：maintain
  - CHANGELOG.md 新增 1.3.0 段落：默认 Verbosity 由 high 改为 medium，对从未显式选择者（含此前选 high
    者）生效，可用 /config 改回。
  - 1.3.0 另一条修复涉及含空格、#、%、特殊字符或 Windows 盘符路径的 @ 文件提及、/codesearch 结果、响应内文件链接，以及
    workspace trust 与 project-scoped custom agents 对桌面应用创建项目的识别。
  - /diff 的 j/k 改为移动行光标、滚轮修复属交互修正，按已登记机制小节排除。
  - 1.3.0 段落插在文件顶部共 7 行，全部 CHANGELOG 行引用需要整体位移；其中
    ref-agy-configuration-changelog-trust-dialog
    的既有行号与摘录在本轮之前已不匹配，需按摘录重新定位，不能与其他引用一起批量位移。
  - 引用位移前提经复核后不成立，本轮未改动任何既有 CHANGELOG 引用。已登记的 173 条 CHANGELOG.md
    引用并非指向同一个文件版本：它们分布在三个 snapshot 上，分别固定 commit 77b1aad0（139 条）、
    65a3c69e（12 条）与 274d81b9（22 条），三者的 CHANGELOG 行号各自相差 59、14、7 行。
  - 逐条按摘录内容在新 commit 5e9c9c6c 上重新定位的结果：172 条的记录行号在各自固定 commit 上都成立，
    只有 ref-agy-skills-changelog-async 的 3 行区间（565-567）其摘录引用了区间首行与末行，按位移后
    预测同样成立。已登记引用记录的是“某个固定 commit 的某几行写了什么”，上游新增版本不改变该陈述的
    真值；把行号改写成新 commit 下的位置反而会让引用与其 snapshot 所固定的 commit 不符。
  - 父进程提示的 ref-agy-configuration-changelog-trust-dialog「本轮之前就已不匹配」经复核不成立：
    它固定在 snapshot-agy-repo（77b1aad0）上，该 commit 不在本轮 pinned workspace 内（浅克隆仅含
    274d81b9 与 5e9c9c6c），archive/ 的 git_checkout 原件也未保留，故其记录行号 12 无法在本轮直接复核；
    但它与同 snapshot 的另外 118 条 ref 在新 commit 上一致地相差 59 行，说明行号 12 在 77b1aad0 上成立。
    按「+7」重定位到 19 行才会把它指向一条无关的发行条目。该引用本轮保持不变。
  - 20 条 custom_providers 与 1 条 mcp、1 条 skills 引用无法逐字匹配，属既有摘录为改写或截断
    （例如省略行首 "- " 前缀），不是本轮位移造成；这些 topic 本轮无事实变化，按范围不改写。
  - 本轮只新增 1.3.0 事实所需的固定来源与引用：commit 5e9c9c6c 的 CHANGELOG.md
    （content_sha256 b3e40d3e…）登记为新的 git_source_file artifact 与 source_revision snapshot，
    未复制源码进候选，未记录任何临时路径。
  - 新增 configuration 事实两条：Verbosity 默认值由 high 改为 medium 及其适用人群与改回方式
    （config.defaults、config.migration），以及含空格/#/%/特殊字符与 Windows 盘符路径的识别修复
    （config.trust）。
  - 新增 custom_agents 事实一条：project-scoped custom agents 对桌面应用在特殊字符路径下创建项目的识别修复
    （agents.entry）。
  - 1.3.0 的 /diff 键位（j/k 改为移动行光标）与触控板/滚轮滚动修复已核对并排除：二者是终端交互
    修正，不改变任何已登记机制的配置字段、路径、加载顺序或条件，章内也无对应小节，故不写入章节。
  - local_transcripts 中「本轮 pin 在 commit 274d81b9」「CHANGELOG 覆盖 1.0.2 至 1.2.17」这类陈述
    经核对仍然成立：该章 22 条引用固定在 snapshot-antigravity-lt-changelog-md（274d81b9）上，其
    结论是对该 commit 的发行说明的陈述，1.3.0 的新增不改变这些结论，也不需要改写该章。
  - 本轮未新增版本映射：CHANGELOG 为未标版本的发行说明，只能证明源码树在某个 commit 的行为，
    不足以支撑 npm 发行版的行为映射。
  - 本轮为普通更新，经作者自检（逐条复核引用行号、固定问题归属、界面范围与版本边界），
    未涉及来源冲突、推翻已发布配置步骤或跨主题关键加载机制变化，因此不需要独立复核；
    因本审计仍引用三个未结 pending 审计，review_status 维持 pending。
