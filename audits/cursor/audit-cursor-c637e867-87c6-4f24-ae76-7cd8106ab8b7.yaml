investigation_notes:
- 本轮 triage 分类：maintain
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计，且维护工作尚未完成。
- source-cur-agent-run-modes-doc 逐字比对新增「Read access」机制：Settings > Agents > Approvals & Execution > Read
  Access 提供 System（默认，可读工作区外文件）与 Workspace（工作区外读取需批准或在 Read Allowlist 内；检索结果跳过边界外文件；macOS/Linux 上沙箱命令只能看到工作区、Read
  Allowlist 与常用系统路径），需 Cursor 3.23 及以上。
- source-cur-agent-projects-doc：Projects 的可用范围由「所有套餐」改为「所有付费套餐」，Hobby 免费套餐不可用（不再以 Privacy Mode (Legacy)
  为排除条件）。
