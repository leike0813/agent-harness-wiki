investigation_notes:
  - "4 个官方文档来源变化（source-cur-agent-projects-doc、source-cur-agent-run-modes-doc、source-cur-ent-model-management-doc、source-cur-sdk-typescript-doc），无来源失败、无网络跳过。已按 observed hash 建立 -20261003 快照与归档原件（artifact-source-cur-*-20261003），旧快照与旧章节版本保留。"
  - "既有引用逐条复核：这 4 个来源支撑的 45 条既有引用短摘录，在新原件中全部逐字命中；file_lines 定位在新原件上仍指向同一段内容（run-modes 19-21、5；enterprise 48-57、61-63、65-74、76-84、94-104、113-118、122-142、146、150-160；sdk 1515、2083）。没有需要按新内容改写的旧结论。"
  - "configuration（v2）：run-modes 新增「Auto-review classifier requirements」小节，分类器跑在 Cursor 托管小模型上（Gemini 3.5 Flash Lite，回退 Claude 4.5 Haiku），企业模型访问控制对两者都生效，屏蔽回退模型可在团队 Run Modes 包含 Auto-review 时仍在 IDE 禁用它。enterprise 页新增「Auto-review and model access」给出同一边界。新增「Protected Git Scopes」一节（仪表盘 Integrations 锁定 Git 组织/组/命名空间，认领需 Cursor 团队管理员兼 Git provider 管理员）。另「Cloud Agents do not use Run Modes」明确 Run Modes 只作用于本地 agent。补入 SDK 本地 agent 默认值：sandboxOptions.enabled 默认 false、autoReview 默认关闭——与桌面/CLI「Auto-review 为推荐默认」相反，且 SDK 沙箱后端为 bubblewrap/seatbelt，与 Run Modes 页的 Landlock + seccomp 不是同一实现，来源未说明两者关系，已记为缺口。"
  - "custom_agents（v2）：agent/projects.md 新增「Subscriptions」——协调者可持有订阅（Slack 频道、计划任务、PR 活动），聊天输入框上方出现 Listening 标记，可查看与移除。sdk/typescript.md 新增「Replacing the system prompt」（systemPrompt 仅本地、与 cloud 同传报错、非空要求、不持久化）、「Custom tools」（local.customTools 注册为名为 custom-user-tools 的 MCP server，跳过交互式批准，deny 与沙箱限制仍生效）、「Composer 2 reroutes to Composer 2.5」（composer-2 / composer-2-fast 在鉴权期改写，等价 composer-2.5 配 fast=true）。均在 agents.roles / agents.overrides 补写，agents.overrides 仍标 partial（provider 字段与子代理级沙箱/网络/审批覆盖仍无来源）。"
  - "mcp（v2）：SDK「What gets loaded」补入云端凭据复用规则——内联 server 未写 auth/headers 且该 URL 此前已在 cursor.com/agents 授权时，个人 API token 认证的运行自动复用 OAuth token；service account API key 不能回退到用户认证。mcp.auth 仍标 partial（token 刷新与过期行为、凭据存储与清理仍无来源）。"
  - "hooks（v2）：SDK「Hooks」明确 hook 只支持文件方式、没有程序化 hook 回调，hook 是项目策略边界而非单次运行开关。据此改写 hooks.entry 的缺口描述，并说明 hook 缺席内联选项是有意设计。"
  - "custom_providers：sdk/typescript.md 变化落在已覆盖的小节（models.list、params、per-run override 粘性、auth、retries、Router 分级与逐个 requireModelPermission），逐条核对既有短摘录仍一致，无读者可见变化，保留 cursor-cli-custom_providers-v1，未新建版本。"
  - "skills / native_plugins：受影响来源未触及这两个主题的机制小节（skill 加载与迁移、插件 settings 优先级与 MCP 优先级），既有引用仍一致，保留 v1。"
  - "记录冲突：新增「分类器模型」这条约束与 configuration 既有的「团队模型访问控制」条目并不矛盾而是同一机制的具体化，已在同一小节并列说明；未发现需要 unresolved 标记的冲突。"
  - "无高影响项：四个来源的既有结论均逐字复核通过，未推翻已发布的配置步骤或命令语义，跨主题的 MCP 优先级与插件 settings 优先级未变化，因此本轮不需要独立复核，review_status 保持 pending。"
