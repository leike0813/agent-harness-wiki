investigation_notes:
  - "本轮状态：本产品已完成协调者的只读观察与语义 triage，来源证据已固定（Git 工作区已按观察到的 commit 打开并保留），但**本轮没有执行 maintenance 派发**。上述限定范围、问题清单与已固定的来源入口是下一轮可直接接续的工作面，不是已完成结论。review_status 保持 pending，pending_audit_refs 保持不变；不得因本轮无候选产物而视为已结案。"
  - "narrow_investigation。source-cur-sdk-typescript-doc 有 6 行实质差异：usage 与 cost 的语义由 “summed across runs” 改为 “total for the agent”，并新增说明——未带 runId 调用的云端 agent 还会计入 Task 子代理与 side chat，因此可能大于 runs 之和。"
  - "这改写了已发布的用量口径，命中 providers.metadata / providers.diagnostics，先限定在 custom_providers 单主题派发。"
  - "source-cur-models-pricing-doc 的 4 行差异同轮判定。"
