    cross_topic_links: []
    reason: >-
      已核实：唯一被改写的是 Model access control 里 Team Settings → Models 的团队基线条目，
      原件把入口称作 **Model Providers** 段，新原件改为 **Cursor Models** / **Other Models**、
      **Model Defaults**、**Personal API Keys (BYOK)** 三个入口。custom_providers v1 的
      custom_providers-entry 表格行与正文段落按旧名描述该入口，故新建 edition
      cursor-cli-custom_providers-v2 并改写这两句，引用改挂新快照
      snapshot-source-cur-ent-model-management-doc-20261012。
pending_question_ids: []
investigation_notes:
  - "观察：source-cur-ent-model-management-doc 由 2606b4bd74d4 变为 c629fcd1ddf2。新原件 archive/cursor/artifact-source-cur-ent-model-management-doc-c629fcd1ddfe/source.md（sha256 已核对等于 c629fcd1ddfef0c37c6c3f2bac7d62733b083f429bb697941133c36b57495e05），旧件 archive/cursor/artifact-source-cur-ent-model-management-doc-2606b4bd74d4/source.md；逐行 diff 只有第 11 行一条 bullet 变化，其余 208 行逐字相同。"
  - "纳入：custom_providers / providers.entry / custom_providers-entry / cursor。理由：该小节正文与表格直接把团队基线入口写成「Team Settings → Models 的 Model Providers 段」与「Team Settings → Models → Model Providers（Enterprise）」，新原文已无 Model Providers 这一名称；已按新名称改写并保留 Enterprise 团队管理员条件与 per-surface 归属（providers.entry 的 cli 答案不含该引用，只有 cursor 答案含）。"
  - "排除 configuration（config.overrides、config.trust）：逐条核对 cursor-cli-configuration-v3 的 config-overrides 与 config-trust。两处只写「团队仪表盘 / Organization Group / Admin API」「到 Team Settings → Models 启用 Claude 4.5 Haiku」，从不点名 Model Providers 段，也不复述该 bullet 的导航层级；该 bullet 描述的开关与默认值语义（决定可用模型、团队基线）在这两节未被逐字复述，因此无需改写，也未新增引用。chapter 保持 v3。"
  - "排除 custom_providers 的 providers.forwarding 与 providers.diagnostics：两处正文只说「团队与组织组按并集决定可用模型」「团队/组织组模型访问设置是判定入口」，依据的是 How team and group model access combine 与 rollout 两个小节，措辞未受本次改动影响；新原文仍同样支持这两句。新 edition 仅把这两处的 model-access 引用改挂到新快照，正文一字未改。"
  - "排除 mcp（mcp.definition）：该来源的 MCP Allowlist、命令/URL 通配、工具控制、网络控制、优先级各小节在新旧原件中逐字相同（diff 未触及），引用短摘录与 file_lines 定位在新原件上仍指向同一段。"
  - "排除 native_plugins（plugins.api）：该来源只被 ref-cur-native_plugins-ent-allowlist 与 ref-cur-native_plugins-ent-distribute 引用，二者定位的 allowlist 与团队市场分发内容不在本次 diff 内，逐字未变。"
