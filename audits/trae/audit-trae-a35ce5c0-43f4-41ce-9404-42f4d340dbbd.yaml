  - >-
    基线窗口：24 个来源现有的知识快照均为 2026-09-30 抓取，raw_sha256 与冻结审计 checks.baseline 一致，但其 artifact 指向的
    archive/trae/artifact-<source>/raw.txt 未被保留，09-30 原文不可读；因此逐源比较改用
    archive/trae/artifact-source-<id>-<hash>/source.md 中保留的观察原件。24 个来源在 2026-10-11 与 2026-10-12
    两轮审计的 observed 原件均保留，另有每源 2 份日期不明的保留原件。已验证窗口为最早保留原件（2026-10-11）至
    2026-11-25；10-22 与 10-24 两轮只有哈希、原件未保留，不能声称这两轮之间无变化；09-30 至 10-11
    之间只能通过已发布 reference 的原文摘录间接核对。
