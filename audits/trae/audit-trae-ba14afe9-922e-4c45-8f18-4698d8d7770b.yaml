investigation_notes:
  - 本次为 trae 的 local_transcripts 主题首采，delivery=pr。全部结论只来自已登记的官方文档快照（docs.trae.ai IDE 分册，2026-09-30 抓取），trae 没有登记 git 仓库来源，本轮也未新建 git_source_file，因此本主题是纯来源级知识，没有源码级或 npm 版本级结论。
  - 阻塞性限制：项目根 archive/trae/ 在本工作区不存在（archive/ 下只有 amp、bob、claude-code、cline、codebuff、command-code、deep-agents、devin、factory-droid、github-copilot、junie、kiro、lovable、replit-agent、rovodev、warp）。因此无法打开归档原件做逐字摘录复核，也无法检索新的文档小节。本轮不新建 archived_document 记录，只复用已登记且已校验的快照与引用，未新增任何 artifact、snapshot 或 reference。
  - 实际结论分布：scope/schema/lifecycle/diagnostics 四题为 partial，location/naming/format/database/archive/cleanup 六题为 unknown。没有任何一题达到 answered：官方 IDE 文档公布了会话事件与事件载荷字段，但没有公布会话记录的落盘路径、命名、格式、数据库分工、归档与删除机制。文档化保留期陈述只有 hook 执行日志"退出 TraeCode 后清除"，已在正文中明确限定其范围，不外推到会话记录。
  - 界面边界：只回答 catalog 的 trae（Trae IDE）界面。24 条来源全部是 IDE 分册，CLI 界面无会话记录证据，不写答案，由查询派生为 not_investigated。
  - 已声明但无法闭合的缺口（需要新证据才能推进）：会话记录的文件或数据库路径、命名与 session_id 生成规则、写入格式与刷盘规则、恢复/分支/上下文压缩后的延续、原生归档与导出、官方删除与保留机制、记录完整性与状态检查入口。若后续补齐 archive/trae/ 原件或 Trae 公开更完整的存储说明，可重采本主题升级答案状态。
