  - "因此 config.defaults 与 mcp.entry/definition/transport/auth/lifecycle 无需改写，knowledge/trae/ 未新增 edition；trae 全部 24 个登记来源本轮均 unchanged，无来源失败、无待处理旧审计，结案且不进入发布流程。"
