investigation_notes:
  - 本轮 triage 分类：narrow_investigation；巡检观察来自 2026-10-13 的只读检查。
  - 本轮 triage 分类：narrow_investigation；入口限 skills 与 configuration 的固定问题。
  - docs/cli/skills、docs/cli/settings-reference、docs/ide-tools
    三个来源内容哈希变化，但上一版原件未被 archive 保留，无法逐行比对；只能以当前原件对照章节已登记结论核实。
  - npm 1.1.68→1.1.70 仅发布身份变化。
  - skills.roots 与 skills.format 已对当前保留原件核实为仍成立（verified-against-current-source）：docs/cli/skills 的 "Where Skills live"、
    "Choose Storage Location"、"Organize Directory Structure"、"Write SKILL.md"（frontmatter 字段表 name/description 及 64/1024
    字符约束）与 qoder-qoder-skills-v3 已发布的发现根与格式结论逐条一致，无新增或缺失的根目录与 frontmatter 字段；已发布的
    "无扫描深度/符号链接/忽略规则" 缺口在当前页仍然成立。按本轮 narrow_investigation 范围未追查同源的 skills.discovery、
    skills.extensions、skills.loading、skills.invocation、skills.diagnostics，仍为 pending。
  - config.sources、config.defaults、config.migration 不由本轮三个变化来源背书：其 source_refs 分别落在 extensions/hooks.md、user-guide/rules.md、
    user-guide/indexing.md、user-guide/commands.md、cli/settings.md、cli/config-scope.md，本轮观察这些来源 observed 与 baseline
    相同（unchanged），结论不受影响；三项本轮不列入 impacts 与 pending_question_ids。
  - 本轮核实的限制：三个变化来源的上一版原件未被 archive 保留（archive/qoder/ 下只有 artifact-source-qoder-docs-cli-skills-cdeddfdedca4、
    artifact-source-qoder-docs-cli-settings-reference-f5730c052e71、artifact-source-qoder-docs-ide-tools-b1f0804fa72d 三份当前版原件），
    因此只能确认"当前原件仍支持每条已发布答案"，不能排除这三页中与本次范围内问题无关的部分同时发生了变化。本轮不写 "no change"。
