investigation_notes:
  - local_transcripts 首采，delivery=pr，角色为 harness-maintenance worker。qoder 没有登记 git 仓库来源，本轮没有打开任何源码工作区，全部结论只来自已归档的官方文档原件。
  - 本轮新增 31 条 references，全部绑定到既有 snapshot（extensions/hooks.md、user-guide/chat/overview.md、user-guide/quest/overview.md、troubleshooting/troubleshooting-guide.md、user-guide/indexing.md、cli/settings-reference.md、cli/config-scope.md），没有新建 artifact，也没有新建 snapshot；archive/qoder/ 下这些原件均实际存在，用真实字节重算的 sha256 与既有 archived_document 记录的 raw_sha256 逐条相同。
  - 项目根的 pinned 工作区 /home/joshua/orca/workspaces/agent-harness-wiki/local-transcripts-first-pass/archive/qoder 不存在（该工作区 archive/ 下只有本轮其它产品），原件实际位于主仓库 /home/joshua/Workspace/Code/JavaScript/agent-harness-wiki/archive/qoder；只读取该目录，未写入。
  - IDE 界面（surface qoder）结论：Transcript 是 IDE 自动生成的会话日志，路径由 Hook 输入的 transcript_path 与 QODER_TRANSCRIPT_PATH 给出，文档举例 ~/.qoder/projects/<project>/transcript/<session-id>.jsonl；格式为 JSONL 逐行追加；逐行 schema 有四类记录（session_meta/user/assistant/progress）与一组公共字段。format、schema、diagnostics 三题 answered，其余七题 partial，缺口集中在项目目录编码、恢复时是续写还是新文件、flush/关闭细节、本机会话数据库、归档导出与删除级联关系。
  - CLI 界面（surface cli）结论：可证实的只有 QODER_SESSION_ID、QODER_SESSION_NAME 两个身份变量、QODER_CONFIG_DIR 决定的用户级数据位置（默认 ~/.qoder）、项目级 .qoder 固定在项目根，以及 general.sessionRetention.{enabled,maxAge,minRetention} 这一组自动会话清理开关（默认 true/30d/1d）。scope、naming、format、schema、database、archive、diagnostics 七题为 unknown，location、lifecycle、cleanup 为 partial。
  - 已查入口：cli/config-scope.md 的 .qoder 目录清单、cli/settings-reference.md 的全部配置组与环境变量表、cli/Skills.md、cli/mcp-reference.md、cli/plugins-reference.md，以及 IDE 侧 chat/overview、quest/overview、troubleshooting-guide、indexing、hooks 五页。全部按"没找到证据即写缺口"处理，没有把"未记载"写成不支持或可安全删除。
  - 明确区分三类记录：本机会话 Transcript、.qoder 下的配置与运行时数据、以及代码索引的云端向量数据（indexing 页说明上传文件生成向量后即销毁、只留云端向量）。Quest 的 Pin/Fork/delete 与消息编辑回滚属任务与工作区层面，没有当作记录层机制写入。
  - 版本边界：全部来源 version_applicability 为 unknown，文档未标注软件版本，正文按来源级知识记录，未新建或修改任何 software_mapping。
  - pending_question_ids 保持为空：十题均给出可发布答案（允许 partial/unknown）。scan 的 29 个 check 无 blocked、无内容变化，status 仍为 no_change，review_status 保留 not_required。
  - 结论：本轮为新主题首采，没有既有章节被改写，也没有出现来源互斥或来源失败，因此按普通更新自检结案，不触发独立复核，也不另写 Markdown 报告。
