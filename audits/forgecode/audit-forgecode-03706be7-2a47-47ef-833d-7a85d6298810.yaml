investigation_notes:
  - "local_transcripts 首次采写（不是对既有章节的维护更新）。证据层级为源码级：pinned workspace
    固定在 tailcallhq/forgecode 的 commit 1469f75aa0fa3a2a768bde24f7dc528723b67259，即本次
    scan 观察到的提交；其基线 937577539c6e1b57b765fad231a802f1cc0d1a11 的唯一变更路径是
    package-lock.json，不触及会话存储。本项目树内未保留 forgecode 的归档官方文档原件，
    因此没有新建 archived_document 记录，全部引用均来自 git_source_file artifact。"
  - "主要结论：会话记录是 {base_path}/.forge.db 内单张 SQLite 表的一行，主键为随机 UUID v4，
    按 cwd 哈希得到的 workspace_id 分区，每轮 dispatch 结束后整行 upsert。输入历史
    (.forge_history) 与文件快照是独立存储，仅在与记录生命周期相关处描述。未找到官方保留或
    清理策略，transcripts.cleanup 因此保持 partial；固定来源中没有完整性校验工具，
    transcripts.diagnostics 同为 partial。"
  - "章节内记录的缺口：context JSON 没有字段级 schema 文档，JSON 列的编码未在来源中声明，
    导入 dump 后父子链能否重建未验证。未写 mappings，因为源码 commit 不证明任何已发布
    npm 包的行为。"
