investigation_notes:
  - "覆盖 registry/harnesses/forgecode.yaml 登记的全部 16 个来源并全部观察成功，没有 blocked、没有网络跳过。audits/forgecode 在本轮之前没有审计文件，pending_audit_refs 为空，没有待处理旧审计。"
