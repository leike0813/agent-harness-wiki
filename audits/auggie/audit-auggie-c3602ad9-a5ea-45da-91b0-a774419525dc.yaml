investigation_notes:
  - 20 个 official_documentation 来源的 raw sha256 全部变化，Git 仓库 source-auggie-repo 未变（9cc3ead4…）。本轮用 pnpm sources:scan auggie 重新取回字节并按 archived_document 归档，取回内容的 sha256 与父进程 sources:check 的 observed 逐个一致。
  - 逐条复核方法：把新归档原件与既有 137 条文档引用的摘录做空白归一后逐字比对，134 条命中；未命中的三条是 ref-auggie-docs-models-current（模型清单确有增补）、ref-auggie-docs-index-cli 与 ref-auggie-docs-logs-path（后两条是概述式摘录而非逐字引用，内容本身未变）。
  - 字节变化的主体是文档站渲染样板：每页顶部新增 “## Documentation Index” 提示块，页尾新增 Mintlify 署名行；docs.augmentcode.com/llms.txt 的 CLI 段落行号未移位（旧引用 84-87 行仍是 Agent Skills／Tool Permissions／Plugins／Integrations 四条），只有 Tool Permissions 一行补了“由 Auggie CLI 与 Cosmos 云 agent 遵守、Augment 代码扩展不强制执行”的说明——该事实已由 configuration 章节的 ref-auggie-docs-perms-enforced 记录。
  - 读者可见的实质变化只有模型页：清单新增 GPT-6.1 Sol、Kimi K3、Kimi K2.7 Code 与第二个 Prism 条目，并新增 “Prism routing options” 一节（Prism (Claude + Gemini) 在 Claude Opus 5／Claude Sonnet 5／Gemini 3.0 Flash 之间路由，Prism (GPT) 在 GPT-5.6 Sol／GPT-5.6 Luna／GPT-5.6 Luna solver 层之间路由），同时写明被取代的型号退到 More、新型号只对符合条件的账号开放。据此把 custom_providers 改写为 auggie-cli-custom_providers-v2，并新建 2 个快照（models、index）与 3 条引用。
  - 其余六个主题（skills、mcp、custom_agents、hooks、native_plugins、configuration）逐条复核后无事实变化：被引小节正文、设置层级与合并规则、hook 事件与字段、权限策略优先级、插件组件类型、Skill 位置与调用方式在新原件中逐字未变，因此不新建章节版本。
  - npm 来源 source-auggie-npm 报 changed 是基线缺失造成的：Auggie 没有 npm_release 快照，扫描器拿不到 baseline，观察值 0.36.0@sha512-jb4kq97… 与既有 artifact-auggie-npm 记录的版本与 integrity 完全相同，不构成版本变化，也不产生版本映射。
  - 本轮 delivery=pr：只做第 1-6 节的观察、采写与自检，未运行 pnpm ahw publish、pnpm chapters:update 与 pnpm managed:packages，未做受管二进制核对。改动未出现来源冲突、推翻已发布配置步骤或跨主题加载机制变化，按 maintenance 第 4 节由本 Agent 自检。
