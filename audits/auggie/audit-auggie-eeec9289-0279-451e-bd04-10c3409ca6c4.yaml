investigation_notes:
  - >-
    local_transcripts 首采。本轮使用固定源码工作区
    /tmp/ahw-source-workspaces/ws-9cc3ead419db-b4a520b9-748e-4447-9b82-3c90c6ec2255
    （commit 9cc3ead419db9486ad44e6e4bba30ecd6784ccff，source-auggie-repo）与已归档的官方文档原件。
    源码 commit 只代表源码树，未写 mappings。
  - >-
    关键发现：固定 commit 的仓库只包含 README、CHANGELOG、examples 与 plugin_marketplace，
    不含 CLI 实现代码，因此会话存储机制无法从源码读到实现级证据。本轮全部新证据来自
    CHANGELOG.md 的固定行区间（真实 sha256 c073e2fd…），配合既有已验证的文档引用
    ref-auggie-docs-reference-sessions。
  - >-
    transcripts.location 记为 unknown：文档与 CHANGELOG 都没有给出会话记录的落盘路径、
    数据库引擎、表名或文件扩展名。transcripts.format 与 transcripts.schema 记为 partial：
    只确证 Session JSON 承载逐次交换的 model ID、summarization 计费与 sub-agent 历史，
    无字段级 schema、编码、分片、压缩与迁移规则。transcripts.database 记为 partial：
    仅由“CLI transcript queue 重复行”与列表分页推出行式存储，未确认具体引擎。
    transcripts.archive 记为 partial：只确证分享链接机制，本轮来源无原生归档开关。
  - >-
    未把“没找到证据”写成不支持或可安全删除：删除前需停止的写入者、级联删除、孤儿记录、
    官方保留期限均在正文列为缺口。0.26.0 的 auto-archive 属 Expert YAML 部署侧清理，
    未当作本地 CLI 归档机制。日志、缓存与遥测未逐项审计。
