investigation_notes:
  - >-
    Frozen observation, re-triaged against the actual diffs. This round's audit checks show
    11 changed sources; the semantic deltas come from five of them
    (byok, custom-endpoint, custom-routers, model-choice and, for one word, orchestration).
    The remaining changed sources differ only in image query strings
    (?dpl=...): agent-notifications, agent-profiles, env-vars, integrations, mcp, rules,
    slash-commands, ssh-extension, warp-drive. Stripping scripts, styles and ?dpl= params,
    none of those nine changes a configuration field, path, load order, condition or locator,
    so skills, mcp, custom_agents, hooks and native_plugins are closed as no knowledge impact.
  - >-
    Evidence paths read: archive/warp/artifact-source-warp-docs-byok-0c54da58cad7/source.md,
    archive/warp/artifact-source-warp-docs-custom-endpoint-4dc8f334566c/source.md,
    archive/warp/artifact-source-warp-docs-custom-routers-dd8c9d2e53ac/source.md,
    archive/warp/artifact-source-warp-docs-model-choice-3d98a6b4f0a9/source.md, compared
    against the previous baselines
    archive/warp/artifact-source-warp-docs-byok-981d70589be5/source.md (BYOK),
    archive/warp/artifact-source-warp-docs-custom-endpoint-650fa5e5bb17/source.md,
    archive/warp/artifact-source-warp-docs-custom-routers-2ca45fc15602/source.md and
    archive/warp/artifact-source-warp-docs-model-choice-e4af09cf3df4/source.md
    (the snapshot edition v4 cited).
  - >-
    Verified and applied: Personal BYOK / Personal custom inference endpoint are scoped to
    local Warp Agent runs (app and CLI) and are not available to cloud runs; Team-managed API
    keys and endpoints are the Business/Enterprise route covering local and cloud runs, with
    Warp storing the shared credentials and a member's own key taking precedence over the
    team key on custom routers; inference is billed by the provider while platform charges
    still apply to Business/Enterprise local runs and to cloud runs; Auto models use
    Warp-provided inference and consume available usage; the Warp credit fallback setting
    retries with Warp-provided inference and those retries consume Warp usage.
  - >-
    Verified and withdrawn: the "Warp Agent harness runs on Warp's backend and assembles the
    full request" step. It existed in the BYOK and custom-endpoint pages until the 2026-10-12
    rewrite and now appears in no registered source, so custom_providers v5 and
    local_transcripts v2 keep only "prompt, context and key pass through Warp's servers" and
    record the harness detail as a gap.
  - >-
    Excluded with reasons. configuration: v3 cites ref-warp-endpoint-managed (a 2026-09
    snapshot) for "personal endpoints are user-level and work only for interactive requests",
    but v3's body only asserts that BYOK/endpoint keys stay out of settings.toml and live in
    local secure storage, which the 2026-10-12 custom-endpoint page still states; no
    published statement is contradicted, so no new edition was created. skills, mcp,
    custom_agents, hooks, native_plugins: their cited sources (slash-commands, mcp, rules,
    agent-profiles, agent-notifications, integrations, ssh-extension, warp-drive, env-vars)
    changed only in image URLs. local_transcripts questions other than transcripts.scope rest
    on file-locations, slash-commands, orchestration and warp-drive snapshots and were not
    affected. models.* / providers.metadata: only the Auto row descriptions and the SuperGrok
    sentence changed on model-choice; the model inventory itself is identical, so no model
    question was reopened.
  - >-
    Not used as evidence: source-warp-docs-all-settings. This audit records it unchanged, but
    the previous audit audit-warp-bc2ad5cd-877f-4e60-a92a-1ae3d1391b7d observed a different
    hash (85626f2af325) against baseline 8da8d34fd01d, and no archived copy of 8da8d34fd01d
    exists in archive/warp, so that delta cannot be diffed. It was therefore excluded from
    this round's evidence, and the configuration questions whose answers rest on the
    all-settings reference page stay pending with configuration-v3 left unchanged.
  - >-
    Also excluded: the orchestration wording swap "credit usage" -> "usage charges" and the
    custom-routers section rename "Credits and model availability" -> "Usage and model
    availability". The custom-routers rename was applied because edition v4 quoted that
    section's text; the orchestration swap was not applied because local_transcripts v1 quotes
    it from the pinned snapshot-warp-lt-orchestration-20261006 and the swap changes no
    mechanism the chapter depends on.
  - >-
    pending_audit_refs keeps audit-warp-bc2ad5cd-877f-4e60-a92a-1ae3d1391b7d, whose scanner
    impacts were never triaged. Its 15 changed sources are a superset of this round's 11 and
    are all covered by the triage above, except the undiffable all-settings delta recorded as
    pending. This audit therefore stays review_status pending rather than closing that audit.
