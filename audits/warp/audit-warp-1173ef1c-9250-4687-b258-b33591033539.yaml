    cross_topic_links: [config.defaults, config.runtime, transcripts.scope]
    reason: >-
      The official docs were rewritten between the 2026-10-11 and 2026-10-12 snapshots:
      BYOK was renamed and re-scoped to Personal BYOK for local Warp Agent runs only, a new
      Team-managed API keys and endpoints row appeared (Business/Enterprise, local and cloud),
      and the billing wording moved from "never consumes your AI credits" to provider-billed
      inference plus applicable platform charges. custom-endpoint and custom-routers were
      rewritten the same way. model-choice changed the Auto row descriptions from
      credit-consumption to inference-cost wording. Edition warp-desktop-custom_providers-v4
      asserted the old scope, the old credit semantics and a server-side harness step that
      upstream deleted, so a new edition was required.
