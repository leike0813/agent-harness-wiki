investigation_notes:
- 本轮 triage 分类：maintain。
- source-warp-docs-model-choice（3750069e8c27→e4af09cf3df4）逐字比对：Anthropic 小节新增 Claude Haiku 5.5 行
  （claude-5-5-haiku-{low,medium,high,xhigh,max}，Default 列为 —）与"has no fixed default model_id"说明，
  第 49 行措辞由"listed separately"改为"listed separately where one exists"，另有一处图片 dpl_ 指纹变化。据此新建
  custom_providers v4 edition 与两个新引用（snapshot e4af09cf3df4）。
- source-warp-docs-file-locations（25bf65433b69→25fd32b5785a）逐字比对：三平台 Cross-platform 小节各新增
  Warp Agent CLI 安装项（macOS/Linux ~/.warp/tui/ + ~/.local/bin/warp 符号链接；Windows %LOCALAPPDATA%\Warp\tui\
  + Stable 启动器 %LOCALAPPDATA%\Warp\bin\warp.cmd），Linux 段末另加卸载 CLI 的外部文档链接；tab-panel 锚点由
  831/832/833 位移到 843/844/845。据此新建 configuration v3 edition 与三个新引用（snapshot 25fd32b5785a）。
- 已复核并确认为无知识影响的 13 个 changed 文档来源（agent-notifications、agent-profiles、byok、env-vars、
  integrations、launch-configs、mcp、notifications、rules、slash-commands、ssh-extension、warp-drive、
  yaml-workflows）：逐行比对后差异全部落在 dpl_ 部署指纹与 tab-panel 锚点上，正文零变化，不写成事实变化。
- 未验证且未断言：Preview 通道下 Warp Agent CLI 的实际安装目录（文档的 Preview 小节只把 MCP 配置与 skills 列为共享，
  未提 CLI）；CLI 自定义安装路径（文档仅标注为安装脚本默认值）。二者按缺口留在 configuration v3 正文。
- 本轮不写 reviewed_by/reviewed_at：仍引用 review_status=pending 的旧审计。
