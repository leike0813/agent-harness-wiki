investigation_notes:
  - "15 of 21 registered sources changed; 6 unchanged. Every change was re-read against the
    archived originals and the published warp chapters."
  - "Genuine reader-visible content change: source-warp-docs-file-locations was rewritten
    into per-platform bullet lists and gained a new WSL symlinking section. Published
    warp-desktop-configuration-v2 rebinds the file-location questions to a new dated
    snapshot and adds the Windows carve-out, OSS channel, cache paths, per-platform
    Preview rules, and the WSL softlink boundary."
  - "Genuine reader-visible content change: source-warp-docs-model-choice refreshed the
    model catalog and added a Zero Data Retention section. Published
    warp-desktop-custom_providers-v2 records the ZDR boundary and the Claude Fable 5/5.1
    exception, plus per-profile base model configuration."
  - "No change requiring revision: source-warp-docs-agent-notifications,
    source-warp-docs-agent-profiles, source-warp-docs-byok, source-warp-docs-env-vars,
    source-warp-docs-integrations, source-warp-docs-launch-configs, source-warp-docs-mcp,
    source-warp-docs-notifications, source-warp-docs-rules, source-warp-docs-slash-commands,
    source-warp-docs-ssh-extension, source-warp-docs-warp-drive,
    source-warp-docs-yaml-workflows. Differences against every published reference excerpt
    were limited to Astro deploy-id query strings, regenerated tab-panel anchor ids, and
    line reflow; no published claim was retracted or falsified. Existing references still
