investigation_notes:
  - >-
    任务 20261006-warp：role=worker、delivery=pr、候选根 /tmp/ahw-batch-20261006a/candidates/warp。
    本审计只覆盖父进程派发的固定问题与小节，未重新扫描来源，也未扩展到全主题重审。
  - >-
    逐行比对的原件：model-choice 用 archive/warp/artifact-source-warp-docs-model-choice-3750069e8c27/source.md
    与 archive/warp/artifact-source-warp-docs-model-choice-8375c96d4c39/source.md；byok 用 34c598319cc9 与
    43390b756a9c；rules 用 562e81998199 与 6b4d9e8ae52a；slash-commands 用 54ab6fa568fc 与
    141272edde33。四个来源的差异均为图片 ?dpl= 构建号之外的语义变化。
  - >-
    父进程已排除 11 个 Astro 构建噪声来源（agent-notifications、agent-profiles、env-vars、
    file-locations、integrations、launch-configs、mcp、notifications、ssh-extension、warp-drive、
    yaml-workflows），本 worker 未重复调查，也未把它们计入本审计的 checks。
  - >-
    configuration 主题未新建 edition：config.migration 唯一引用的规则文件事实（WARP.md 与 AGENTS.md
    共存时 WARP.md 优先、可改名、二者继续支持）在本轮 rules 原件中逐字未变；本次 rules 页删除的
    是 /add-rule 与 /init 的输入模式限定，该限定从未出现在 configuration 章节里。章节中引用的
    ref-warp-rules-project 仍然成立，因此按「来源变化未影响既有结论」结案，不制造无差异的新版本。
  - >-
    hooks 主题未新建 edition：hooks.conditions 的结论来自「桌面端没有 agent 生命周期 hook」，
    其证据 ref-warp-slash-static 所指的静态命令表逐行未变；slash-commands 的适用范围改写不影响该结论。
  - >-
    SuperGrok 依据处理：byok 页原「Settings > Agents > Warp Agent 选择连接、Warp 打开浏览器完成授权」
    一段已被上游删除，该页现有内容只能支撑「SuperGrok 订阅可连接、token 存本机」。因此 providers-auth
    删除了入口路径与浏览器授权步骤，保留 token 本地存放并改引新的路线行引用，同时把 providers.auth
    由 answered 降级为 partial，写明已查入口（grok-subscription 页、chatgpt-subscription 页均未登记为
    固定来源，本轮归档集合无原件）与缺口（授权流程、凭据存放、刷新方式）。未保留任何失效来源定位。
  - >-
    ChatGPT 订阅按登记来源记录为已文档化的第五条路线（providers.entry），并写明可用性以 Warp pricing
    为准；其授权细节与 providers.auth 的缺口一致，不做推断。
  - >-
    观察到但未写入章节的变化：byok 页的 platform credits 条件新增「or a connected ChatGPT plan」。
    providers-protocol 不在本 worker 的指派问题范围内，且当前章节没有任何小节陈述该条件，故本轮不改写；
    已登记为后续轮次可处理的来源变化，原件见 checks 的 candidate_path。
  - >-
    引用库中发现两处未被任何章节引用的旧摘录已与当前页面不符，本轮未改写（无章节消费它们，改动会变成
    无消费的记录变更）：ref-warp-rules-create 的摘录仍含已删除的「in Auto or Agent input modes」与
    「/init in Auto-Detection or Agent Mode」；ref-warp-byok-enterprise 的摘录仍写 Enterprise teams，
    当前页面为 Business and Enterprise teams。两者应由下一轮维护按需新建带日期的引用替代。
  - >-
    新增证据固定在三个新快照上：snapshot-warp-docs-model-choice-20261006、
    snapshot-warp-docs-byok-20261006、snapshot-warp-docs-slash-commands-20261006，均指向
    archive 下的原件，version_applicability 为 unknown，本轮未新增任何软件版本映射。
  - >-
    edition 选择建议：custom_providers 选 v3（v2 已合入 main），custom_agents 选 v2，skills 选 v2；
    configuration 保持 v2、hooks 保持 v1。registry/chapter-current.yaml 由父进程在集成阶段统一更新，
    本候选未修改该文件。
  - >-
    本审计保持 review_status=pending：custom-endpoint、custom-routers、orchestration、skills 四个来源
    缺可比旧原件，相关问题未判定；同时引用了三份仍未结案的父轮审计。
  - >-
    返修轮（revision_round 2，独立复核 changes_requested，事实层全部通过）：修正路线表计数断言的引用。
    「五条路线」原引 ref-warp-byok-compare，而该引用绑定的是 10-04 旧快照、摘录只有 BYOK 与 custom
    endpoint 两行。整张五行表在 excerpt 800 字符上限内放不下（source.md 26-30 为 1247 字符），因此按行
    段拆成两条固定在 snapshot-warp-docs-byok-20261006 上的引用：ref-warp-byok-routes-key-endpoint-20261006
    （26-27 行，BYOK 与 custom endpoint）与 ref-warp-byok-routes-byollm-20261006（28 行，BYOLLM），加上已有的
    ref-warp-byok-subscription-routes-20261006（29-32 行，SuperGrok 与 ChatGPT）。五行全部由当前快照固定，
    ref-warp-byok-compare 从 v3 的 providers-entry 段落与问题引用中移除（v1、v2 仍引用它，未受影响）。
  - >-
    返修轮同批处理：BYOLLM 行按新快照补回原文的「Azure Foundry coming soon」；OpenAI 后缀改为按原文限定为
    「后缀词表含 max，但只有 GPT-6 系列带 -max 取值」，不再暗示 gpt-5-4-max 之类 ID 存在；GPT-5.3 Codex
