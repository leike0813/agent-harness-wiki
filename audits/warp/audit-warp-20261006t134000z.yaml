  - 本轮 triage 分类：maintain
  - model-choice 有实质变化：OpenAI 表新增 gpt-6-1-sol-{low,medium,high,xhigh,max}，下线
    gpt-5-3-codex-*；Anthropic 表由 model_id/variant 三列改为 supported values +
    default model_id 两列，-xhigh-fast 挂到
    claude-5-5-opus/claude-5-opus/claude-4-8-opus；Fireworks 下线
    glm-5.2-fireworks、kimi-k27-code-fireworks、kimi-k26-code-fireworks、deepseek-v4-pro-fireworks，新增
    glm-5.3-fireworks、deepseek-v4.1-flash-fireworks；Google 新增
    gemini-3.8-flash；新增 ChatGPT 订阅接入说明段。xAI 表仍保留 reasoning level 三列，取消只限
    OpenAI/Anthropic。
  - byok 有实质变化：新增 ChatGPT subscription 接入行；旧 L16 整段 SuperGrok Settings
    连接步骤被删除，章节中该条依据已失效；FAQ 由 ChatGPT/Claude 订阅均不可用反转为仅 Claude 不可用；platform
    credits 条件新增 connected ChatGPT plan。
  - rules 与 slash-commands 改写输入模式限定：/add-rule、/init 的模式限定被删除，slash 命令适用范围由 Agent
    Mode/Auto-Detection Mode 改为 terminal mode/Agent Mode；静态命令表
    ref-warp-slash-static 逐行一致，定位未失效。
  - 其余 11 个来源为 Astro 构建噪声：图片 URL 的 ?dpl= 构建号与 tab-panel
    锚点重编号，已逐行或按行数/字符/关键词三重指纹排除。
  - custom-endpoint、custom-routers、orchestration、skills 四个 changed
    来源在本工作树内没有可比对的旧原件，无法判定，记录为未验证而非无影响。
