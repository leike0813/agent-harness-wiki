investigation_notes:
  - "Scope of this round: the Git source moved 41f9084b30812db321a0b592def4f500d1e79cf4 -> b741e480e203f037ca726bc2a76d99a8e8668e66 with 2071 changed paths (2016 under codex-rs). The review therefore re-verified every mechanism the codex chapters actually cite, rather than re-reading the whole tree: all 19 source-cited references still resolve at b741e480 with their recorded excerpts intact, and all 45 documentation excerpts recorded against the previous documentation snapshots are still present verbatim in the newly archived bytes."
  - "Configuration: config/src/config_layer_source.rs is not in the diff, so the layer priority values (bundled -10, MDM 0, System 10, enterprise 15, User 20/21, Project 25, session 30, legacy managed 40/50) and config/src/merge.rs merge_toml_values are unchanged. edition codex-cli-configuration-v3 adds the managed-policy delivery order documented in the new configuration reference (OS-specific environment override -> all-OS environment override -> Global) and requirements.toml [features] pinning, both kept separate from the config-file layer order."
  - "MCP: the new documentation snapshot adds OAuth client-registration and callback rules that the current edition did not state (configured client_id skips registration; server-specific callback ID derived from the MCP server URL; per-server oauth.callback_port) and an explicit 512-character budget for the server instructions field. edition codex-cli-mcp-v3 records them; mcp.auth stays pending only for the source-side enterprise-auth change described below."
  - "Source-side enterprise MCP authentication changed: codex-rs/config/src/mcp_ema.rs drops plugin-declared ema_auth (config/src/mcp_types.rs PluginMcpServerEmaAuthConfig and the plugins.<name>.mcp_servers.<server>.ema_auth validation path are removed) and adds account-scoped credential names keyed by user, workspace, issuer and client id. This was read in the diff but not yet traced to a reader-visible configuration conclusion, so mcp.auth and plugins.api stay pending."
  - "The new configuration reference states that model_provider and model_providers are not supported as managed Local-computer-access cloud overrides. That boundary was not written into codex-cli-custom_providers, so providers.entry stays pending."
  - "npm @openai/codex moved 0.157.1 -> 0.160.0 with a new integrity. Per the maintenance contract an npm version change alone is neither a chapter change nor a source-to-package mapping; the package snapshot stays at 0.157.1 and no version mapping was created. delivery=pr forbids the managed package refresh that would confirm the released bytes."
  - "Blocker on byte-level documentation diff: the archived originals for the previous documentation snapshots (archive/codex/artifact-codex-cli-*/raw.md) are absent from this working tree, so the changed documentation could not be diffed against the baseline bytes. The additive conclusion rests on excerpt-level re-verification instead, and the newly archived originals are pinned by this round's snapshots."
  - "Independent review was not required: no source conflict remains unresolved, no published configuration step was overturned, and no cross-topic loading mechanism changed. All 45 previously recorded documentation claims and all 19 source-cited claims still hold at the observed revision."
