investigation_notes:
  - "local_transcripts 首采。角色 harness-maintenance worker，delivery=pr。"
  - "固定源码来源 source-codex-repo（https://github.com/openai/codex.git），调查 commit 822e58cc3d666166c7446c5b1ea2e52f5d09594c，基线 b8dceb0d4f29e49e73daa08f57fcf5181186f354；只读工作区 /tmp/ahw-source-workspaces/ws-822e58cc3d66-9929b175-7eeb-4d67-9f99-7e5ef68ea817（coordinator 已打开，任务结束后释放）。"
  - "新写入 27 个 git_source_file artifact 与 27 个逐文件 source_revision 快照（snapshot-codex-repo-822e58cc-<artifact slug>），每条 reference 的 snapshot_id 绑定其自身 locator.file 对应的那个快照；artifact 逐文件记录 commit、仓库相对路径与真实计算的 content_sha256，未记录任何临时路径。另有 snapshot-codex-repo-822e58cc 作为 coverage-codex-repo-822e58cc-local-transcripts 的仓库级锚点保留。"
  - "修正记录：首轮曾把全部源码 reference 绑到同一个 snapshot-codex-repo-822e58cc，导致 locator.file 与快照固定的文件不一致。已按每个被引用源码文件各建一个快照并逐条重绑，reference id、正文、source_refs、excerpt、行号与 official_url 均未改动。27 个 artifact 全部仍被 reference 引用，孤儿 artifact 为 0。"
  - "官方文档来源为 source-codex-cli-configuration-doc-learn 快照（https://learn.chatgpt.com/docs/config-file/config-reference.md，raw/extracted sha256 73242945d789…，抓取时间 2026-10-03），version_applicability 为 unknown，因此未写 mappings/。"
  - "界面边界：只调查 catalog 登记的 surface_id=cli。未调查 vscode、desktop、cloud，查询会派生 not_investigated。"
  - "10 题状态：scope、location、naming、format 为 answered；schema、lifecycle、database、archive、cleanup、diagnostics 为 partial。"
  - "partial 的具体缺口已写进对应小节：ResponseItem 与被保留 EventMsg 的字段级 schema 未逐变体核对；进程退出时的最终刷盘触发点未确认；thread_history_1.sqlite 是否为恢复硬依赖未验证；归档的跨机可移植性损失无官方证据；手动删除后的孤儿行与修复路径未确认；doctor 各 flag 语义与发现漂移后是否自动修复未确认。"
  - "未消解的措辞分歧：官方配置参考把 history.persistence 描述为控制 session transcripts，而源码 message-history 的模块文档把 history.jsonl 定义为 {session_id, ts, text} 的用户输入历史。章节以源码为准并显式记录该差异，未据此判定任何一方错误。"
  - "未运行 sources:scan、publish、managed package 更新，未执行真实 harness 或受管二进制，未读取维护者真实会话文件。"
  - "缺口：项目根 archive/codex/ 在本工作区不存在（archive/ 被 .gitignore 忽略），配置参考原件实际只在同仓库的 harness-monitor 工作树 archive/codex/ 下只读可用；本轮未新增归档原件。文档断言因此只依赖 scan 阶段已归档的三份文档快照。"
