    reason: >-
      source-codex-repo: codex-rs/core/src/hook_runtime.rs 的 additional_contexts 由
      Vec<String> 改为 Vec<codex_hooks::HookContext>。沿该字段追到
      codex-rs/hooks/src/context.rs（HookContext = text + ContentItemMetadata）、
      codex-rs/hooks/src/events/common.rs（append_additional_context 接收并保存 metadata）、
      codex-rs/hooks/src/engine/command_runner.rs（command 处理器 context_metadata 固定为
      ContentItemMetadata::command_hook()）、codex-rs/core/src/context/hook_additional_context.rs
      （HookAdditionalContext 的 content_metadata() 直接返回该 metadata）与
      codex-rs/protocol/src/models/item_metadata.rs（provenance Harness { hook }）。
      这条链只跨 hooks 主题，故不扩大到 mcp/custom_agents。记录于 codex-cli-hooks-v3：
      hooks.output 增加注入归因结论（仍 partial，因退出码/阻断语义不在固定来源内）；
      hooks.input 与 hooks.order 的已发布结论未被推翻。新增结论：异步排空路径
      drain_async_hook_results 重建 HookContext 并填入 command_hook()，原因是承载通道的
      HookOutputEntry 只有 kind 与 text、不携带 metadata。该硬编码不构成归因损失：
      能进入该通道的只有 async 为真的 command 处理器——异步调度在 mcp_tool 处直接返回
      （hooks/src/engine/command_runner.rs:134），executor 作用域处理器走 schedule_async_task
      不发往该通道，command 处理器的运行时归因本就是 command_hook()。初稿曾把这一实现事实
      表述为"同步路径下 MCP tool 可带 tool(namespace) 归因而在异步路径丢失"，独立复核证明该后果
      不可达，已删除并改为等价的实现事实表述。
