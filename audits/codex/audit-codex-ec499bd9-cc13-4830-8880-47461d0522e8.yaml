investigation_notes:
  - >-
    范围与身份：本轮观察即 checks（配置文档 5dc51991→72e59e99，MCP 文档
    b49326fc→c8f3e1f3，Git 0c7efeb5→b0b0852e，npm 0.172.0 与 CLI/skills 文档未变）。
    原件在 archive/codex/artifact-source-codex-cli-configuration-doc-learn-72e59e992e38/source.md
    与 archive/codex/artifact-source-codex-cli-mcp-doc-learn-c8f3e1f3dc8a/source.md，
    sha256 与 checks 的 observed 一致；可见文本对比用
    documents/<sha>.txt 的 diff，两个文档都没有 CDN token、buildId/nonce、
    "Last modified" 或纯 URL 迁移差异，改动全是正文。
  - >-
    source-codex-cli-mcp-doc-learn（2 个 hunk，+7/−1）：其一，Other configuration
    options 的 startup_readiness 条目把 "satisfy startup while the server
    connects" 改为 "satisfy that requirement"，并保留 "Tool calls still need a
    live connection"；其二，同一小节新增整段：默认可选 stdio server 在已有可用
    工具清单（缓存目录）时可等到第一次工具调用才启动，required stdio server
    在 startup_readiness="catalog" 时也可首次使用时启动，没有缓存工具清单则
    thread 启动时启动，features.mcp_lazy_stdio_startup=false 时这些 server
    随 thread 启动。结论：mcp.lifecycle 启动时机与 mcp.capabilities 的缓存边界
    变化，写入 codex-cli-mcp-v4；OAuth 与 Supported MCP features 段落零改动，
    mcp.auth 结案为不受影响。
  - >-
    source-codex-cli-configuration-doc-learn（7 个 hunk，+38/−5）：(a) 新增
    apps.<id>.tools.<tool>.approvals_reviewer（user|auto_review，覆盖 app
    reviewer，受 managed requirements 约束）——两个已写章节都不覆盖 apps 工具
    审批审阅者，无已发布答案，排除。(b) mcp_servers.<id>.startup_readiness 描述
    改写——配置章节未登记该键，机制记入 mcp 主题，config.defaults 仍为 partial，
    不计 configuration 答案变化。(c) 新增 features.mcp_lazy_stdio_startup
    （boolean，默认 true）——同一 MCP 机制，配置侧 reference
    ref-codex-cli-config-lazy-stdio-key 供 mcp 章节引用。(d) 新增
    otel.headers_helper 与 otel.headers_helper_refresh_interval_ms（用户层与
    managed 层各一组，默认 1740000 ms，项目设置与 managed exporters 不能用
    用户层键）——两个章节均未覆盖 otel header helper，排除。(e) 删除 managed
    permission-profile 版本门槛段（要求 Codex 0.138.0，0.137.0 及更早忽略
    allowed_permission_profiles 与托管 default_permissions）——config.migration
    的已发布答案变化，v7 删除该段；旧 snapshot/reference 保持原字节，v5 仍保留
    该引用与正文，不用删除推断具体版本行为。(f) network_proxy 描述删除
    "Codex 0.166.0 accepts" 版本门与 "Keep the alias in published policies…"
    建议，保留 [network_proxy] 及其别名 [experimental_network] 与"每层只用一名"
    规则——据此把 config-defaults-migration 的别名写法更正为
    network_proxy（别名 experimental_network）并新增
    ref-codex-cli-config-network-proxy-doc。
  - >-
    source-codex-repo 交集：diff 共 927 个改动文件，与 knowledge/codex/artifacts
    的 51 个唯一 file: 值求交得 22 个文件。配置相关三处：
    config/src/types.rs（新增 ImageGenerationSettings、PluginsConfigToml::
    allows_plugin 改为显式 enabled 优先于 _default）、
    config/src/config_requirements.rs（新增 gateway 托管 shorthand，
    requires_remote_config/is_empty 纳入该字段）、
    core/src/config/mod.rs（删除 deprecated load 辅助函数、新增
    ImageGenerationSettings::from(&Config)、namespace 常量替换）。这些是新增键
    与重构：章节引用的 layer 优先级、merge、windows.allow_mxc/require_mxc、
    include_environment_context_time 与 thread_unload_delay_secs 行区间都没有
    改动，types.rs 被引用的 locator 也不在 diff 中 → config.sources/overrides/
    defaults/diagnostics 无答案变化。mcp 章节只引用文档与配置快照，不引用本轮
    改动文件，git 侧对 mcp 无影响。
  - >-
    受限的 transcripts 观察（只为结案 pending 的 transcripts.cleanup）：
    delete_thread.rs 把 thread_history 行删除从"rollout 文件删除之前"移到之后，
    并新增 history_db_for_delete 可达性前置检查，注释说明是为了让排队批次不能
    重建已删行；已发布的清理顺序（宿主数据清理 → 删除 rollout → 删除状态库行）
    与新实现一致，改动是把旧实现的先行删除改成符合模块注释与已发布答案的顺序，
    答案不变。同批 history/src/lib.rs 把 RolloutItem::EventMsg 改为带可选
    metadata 的结构体变体（transcripts.schema 的 payload 级新增，该题不在本轮
    问题集，现有答案已声明 payload 字段未逐项核对）；state/src/sqlite.rs 抽出
    journal_mode_policy/prefers_rollback_journal 并从连接选项移除 busy_timeout
    （打开重试循环未变，不推翻数据库小节的"有界重试"表述）；rollout
    list/metadata/recorder/lineage 只是 EventMsg 变体匹配改写。这些都不改变
    transcripts.cleanup 答案，未改该章节。
  - >-
