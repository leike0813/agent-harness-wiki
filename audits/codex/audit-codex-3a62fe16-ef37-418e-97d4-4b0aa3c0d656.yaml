investigation_notes:
  - 本轮 triage 分类：maintain；local_transcripts 的 5 道固定问题全部调查完毕，结论写成新 edition
    codex-local_transcripts-v2，v1 原样保留并切换 current 选择。
  - 仍不写 reviewed_by/reviewed_at：本审计 pending_audit_refs 指向的 3 份旧审计仍是
    review_status=pending，不能通过结案新审计间接关闭其未完成阻塞。
  - 已发布引用逐个在 2f3fb111 上复核：ref-codex-cli-transcripts-format-append-open（recorder.rs）、
    ref-codex-cli-transcripts-lifecycle-cli-subcommands（cli/src/main.rs）、
    ref-codex-cli-transcripts-schema-item-types（history/src/lib.rs）三处摘录文本已不存在；压缩、
    状态库、SessionMeta、行写、find-thread、lineage 等引用整体位移。逐条判断后只有下列机制级变化进入
    章节重写，纯位移与 Box 化的内部调整不改变已发布结论。
  - transcripts.location：sqlite home 三级来源（config.toml sqlite_home → CODEX_SQLITE_HOME →
    codex_home）与 SQLITE_HOME_ENV 字面量本轮首次可引用；库文件集合新增 memories_v2_1.sqlite；
    logs_2.sqlite 改由 logs_home() 解析（仅显式配置 log_dir 且 requirements 未固定 sqlite_home 时
    使用 log_dir，默认 codex_home/log，否则回落到 sqlite_home）；session_index.jsonl 的完整路径
    codex_home/session_index.jsonl 已确认（v1 曾标为未验证）。
  - transcripts.naming：rollout_file_name.rs 的解析与渲染规则未变，lineage 指针语义未变，故命名结论
    保持不变，仅随新 edition 重述。
  - transcripts.format：RolloutLine 信封与逐行追加未变；append 打开改为仅在明文文件不存在的场景刷新
    mtime，并把 ACL 造成的 PermissionDenied 视为可接受；压缩与物化改为先复制 owner/权限/mtime 再校验
    发布，物化临时文件改用 .rollout-materialize- 前缀，压缩发布需取得线程 writer 发布锁；压缩常量
    （7 天冷阈值、级别 3、.zst/.tmp、6 小时 marker/temp 过期、5 小时上限、2 并发）未变。
  - transcripts.database：新库初始化改为 incremental auto_vacuum + WAL，已有库保留原 journal/vacuum
    模式；启动对 SQLITE_BUSY 有界重试；新增 codex migrate-nfs-db（仅 Unix、需确认、要求所有客户端停止、
    依赖跨客户端 POSIX 锁、--staging-dir 本地暂存、原库与 WAL 备份到 <库路径>_wal_migration_backup/）。
    threads 表结构、backfill 与 BackupAndRebuild 恢复路径未变。
  - transcripts.archive：archive_thread.rs 与 delete_thread.rs 的移动/硬删除顺序与锁检查未变；归档
    结论保持，仍为 partial（可移植性损失与删除级联范围无来源）。CLI 引用改为 2f3fb111 的
    子命令枚举（新增 MigrateNfsDb）。
  - 文档来源：source-codex-cli-mcp-doc-learn 与 source-codex-cli-configuration-doc-learn 本轮 changed，
    但属于 mcp/configuration 主题，不在本轮派发范围，未对其做语义判断，留待对应主题派发。
  - npm 来源观察到 0.163.0（基线 0.162.1），仅说明发布身份变化；未据此建立任何版本映射。
