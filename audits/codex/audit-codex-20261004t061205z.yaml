    reason: 维护复核结论为本轮无需修改章节。观察：b8dceb0d 为 McpHandler 新增 is_third_party_tool() 恒返回 true（codex-rs/core/src/tools/handlers/mcp.rs:311-313），与 registry.rs:80-84 的 trait 默认 false 及 DynamicToolHandler 的 true 一致；同时新增 Feature::CodeModeOnlyStrictThirdPartyTools。结论：该行为由 spec_plan.rs:190-196 的 code_mode_only_strict_3p_tools() 双重门控，需 effective_tool_mode 为 CodeModeOnly 且开关显式启用，而 code_mode 与 code_mode_only 同为 Stage UnderDevelopment 且 default_enabled false，默认配置下不生效。生效时 MCP 工具被置为 ToolExposure::Deferred 而非 Hidden，并保留 exec 路由以便仍可被发现（spec_plan.rs:584-596 与 873-876），所以 mcp.capabilities 所问的工具能否被发现和使用结论不变；该开关属工具暴露与过滤策略，落在 mcp.exposure 口径内，不在本轮范围。
