investigation_notes:
  - 本轮协调者语义 triage 结论：maintain。已交回隔离候选做定向维护。
  - 本轮 codex 由 b741e480 前进到 b8dceb0d（提交标题为 Vim Normal 模式下从空草稿打开斜杠命令），变化路径共 99 条。
  - 维护复核后修正路径清单：初始 triage 记录为 config.schema.json、config/mod.rs、handlers/mcp.rs 三处加 skills_extension 快照，实际与本轮范围相关的源码文件为 8 个——config/src/types.rs、core/config.schema.json、core/src/config/mod.rs、core/src/config/config_tests.rs、core/src/tools/registry.rs、core/src/tools/handlers/mcp.rs、core/src/tools/handlers/dynamic.rs、core/src/tools/spec_plan.rs（另有 features/src/lib.rs 登记新开关定义）；其余为 codex-rs/tui/ 下 57 条与 30 个快照文件。
  - 定向复核结论：configuration 与 mcp 两个主题的既有答案均不变，本轮不新建 edition、不新增 reference、不改动 registry/chapter-current.yaml。configuration 的两个新项落在已记录的入口与默认值机制内部；mcp 的严格第三方工具归类由 CodeModeOnly 与新增开关双重默认关闭所门控，且生效时保持 Deferred 与 exec 路由，不改变工具可发现可调用结论。
  - 越界观察一（未处理，交协调者）：code_mode_only_strict_3p_tools 生效时会忽略 MCP 的 omit_tools_from、deferLoading 与 namespace skip 设置并强制 Deferred，这更贴合 mcp.exposure 的固定问题（工具名称、过滤、权限、信任与批准如何决定实际可见与可调用的能力），而 mcp.exposure 不在本轮交回范围、当前为 answered 且仅有文档引用；该行为仅有源码级证据且双重默认关闭，故不自行扩大范围。
  - 越界观察二（未处理，交协调者）：codex-rs/core/tests/suite/skills_extension.rs 为 +13/-1 夹带 cloud_skills_across_executor_readiness 与 _windows 两个快照；核实内容是测试夹具隔离与按 cfg!(windows) 分支断言，不是 skills 机制变化，因此不构成独立 skills 知识影响，skills 主题未交回故未处理。
  - 版本边界：本轮全部结论为源码级。npm 来源本轮观察为 0.160.0 且与基线一致，固定来源未把提交 b8dceb0d 绑定到任何已发布包版本，因此不据此推断已安装版本行为。
  - 来源快照现状：既有 configuration 章节的源码引用仍绑定 snapshot-codex-repo 的 commit 67a7096；本轮未新增 b8dceb0d 的 git_source_file 引用，因为没有写入任何新结论。
