investigation_notes:
- 本轮 triage 分类：maintain；维护已在候选中完成，写成新 edition codex-cli-configuration-v4，v3 原样保留。
- 仍不写 reviewed_by/reviewed_at：本审计 pending_audit_refs 指向的 5 份旧审计仍是 review_status=pending。
- source-codex-cli-configuration-doc-learn 逐字比对新增 29 行 config-reference 条目：application 表新增 application.network、application.network.enabled
  等键，描述桌面应用网络请求的目的地限制，并与命令网络和浏览器来源规则相区分。
- source-codex-repo 由 c0c230e 变为 ad54b755（Track source attribution for individual context parts），1045
  个文件。已登记引用逐个复核：codex-rs/config/src/types.rs 新增 windows.allow_mxc 与 notice.hide_gov_cloud_guidance；
  core/src/config/mod.rs 新增 allow_mxc=false 时对 windows.sandbox="mxc" 的 InvalidInput 拒绝、include_environment_context_time
  默认 true、thread_unload_delay_secs 默认 1800，并新增 ConfigBuilder::without_project_context（app-server 侧改为不传 cwd 而非
  loader_overrides.ignore_project_config）；core/src/hook_runtime.rs 的 additional_contexts 由 Vec<String> 改为 Vec<HookContext>；
  core-plugins/src/loader.rs 的 disabled_skill_paths 由 AbsolutePathBuf 改为 PathUri；rollout/{compression,policy}.rs 仅重导出与新增
  ElicitationAbandoned 持久化分支；history/src/lib.rs 新增 TurnAttribution 重导出。以上均不改变 config 层优先级、合并、信任门槛或
  迁移规则，故 hooks/native_plugins/local_transcripts 三题不在本轮改动范围。
- config_requirements.rs 的 diff 仅为新增 windows.require_mxc 与 is_empty 条件，未改既有键的解析。
- npm 来源观察到 0.161.0（基线 0.160.1），仅说明发布身份变化；未据此建立任何版本映射。
