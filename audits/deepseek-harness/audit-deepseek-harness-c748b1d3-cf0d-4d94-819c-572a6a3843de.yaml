    snapshot-deepseek-harness-repo-20261022（git_source_file README.md，与旧快照同一内容
    hash）。
  - 兼容判定的实际变化：unmetRequirements 先看 engines.dsh，命中时该范围单独决定并忽略 peers；缺 engines.dsh
    才回退到 @deepseek-ai/dsh 与 @deepseek-ai/dsh-* peer 规则；
    evaluatePluginCompatibility 的未满足字段由 peers 改名 requirements；engines 非对象或
    engines.dsh 非字符串视为清单畸形。上游同时更新了 docs/user/develop/basic/publish.md:66、
    packages/boot/app-boot/README.md:52 与
    upgrade-guide/v0.2.1-alpha.3/plugin-engines-dsh， 三处口径一致，无来源冲突。
  - 文档来源 changed：与留存原件
    archive/deepseek-harness/artifact-source-deepseek-harness-docs-665aa28b1c3a
    逐行比对，差异仅为 VitePress 资产 hash 与一行预加载清单位移，正文机制文本 0 行变化；本产品没有任何
    章节引用该来源，故不构成知识影响。
  - npm 来源 0.2.0-rc.2 → 0.2.1-rc.2：仅有版本与 integrity 身份变化，本轮未写任何版本映射， 也未据此改写章节。
  - 范围外但已观察到的旧陈述（本轮不派发、不改写，留给后续任务）： native_plugins 的 plugin-model
