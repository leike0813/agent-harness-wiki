investigation_notes:
- 本轮 triage 分类：maintain
- 仓库基线落后 669 个提交，区间内含桌面端改为免配置的 macOS 打包、plugin-manager 记录非交互 pnpm 报告的忽略构建脚本，以及 providers worktree 分支合并。
- configuration 与 native_plugins 章节引用该仓库，需要按固定问题复核；跨度大，调查须限定在配置位置、插件管理与打包配置入口。
- '窄范围结论（workspace ws-d74326738864-46210cd1-57ef-411f-b8c8-76f87c02f914，区间 5badb150..d7432673 共 669 提交）：两个指定提交都不改变已发布答案，章节字节保持不变。'
- 'configuration / 2604a4b13a feat(desktop): make local macOS packaging configuration-free：只改 apps/desktop 的发行打包环境（新增 localMacOSPackageEnvironment() 跳过 .env.macos，unsigned macOS 构建不再解析 mandatory-update policy，electron-builder 不再写 dshMandatoryUpdatePolicy）。本产品的 configuration 七道固定问题全部描述运行时 Cordis 配置树（Harness home、层优先级、环境变量/CLI/profile 介入、bootstrap 信任、schema 与 bundle 默认值、settings.yaml 旧文档导入、dump/HMR/启动诊断），源码里没有任何一节引用 apps/desktop 打包脚本，该提交也不触及 packages/** 的配置解析。因此没有一题答案发生变化，判定为超出本轮固定问题的实际影响范围，作为 finding 报告而非改写章节。'
- 'native_plugins / b9bea234ce fix(plugin-manager): record ignored build scripts reported by a non-interactive pnpm：readPendingBuilds(dir) 改为 recordPendingBuilds(dir, output)，从失败运行输出的 “Ignored build scripts: …” 行解析包名并自行写入 profile 的 pnpm-workspace.yaml allowBuilds 占位符；index.ts 在安装失败分支调用它填 result.pendingBuilds。发布章节 plugins.lifecycle 与 plugins.diagnostics 都没有陈述 pendingBuilds 的具体内容，也没有陈述“pnpm 只在可提示时写入”这一前提，故不存在被推翻的既有断言；批准流程本身（approvedBuilds、仅接受 pending 名、拒绝通配符、写入 allowBuilds）语义未变。判定为不 supersede。'
- '显式排除并记入审计，未调查：.agents/notes/** 文档树（i18n 与 markdown）、test(web): bound plugin-card switch polls（仅测试）、fix(ci): skip the verification install when rebuilding Linux node-pty（CI）、Merge pull request #5800 from deepseek-harness/worktree/ptc-providers/remove-both、以及全部本地化 churn。skills、mcp、custom_agents、custom_providers、hooks、local_transcripts 六个主题按指令未触碰。'
- '本轮未新增引用、快照或章节版本；registry/chapter-current.yaml 保持 8 条不变。'
