investigation_notes:
  - 本轮 21 个登记来源全部观察成功，没有 blocked。20 个 official_documentation 来源的 observed 与各自快照记录的 raw_sha256
    全部不同，逐页复查后确认不是正文改版，而是本轮抓取把原件保存形态从提取后的 Markdown 换成了原始 HTML：archive/junie/ 下
    新写入的 20 份原件是 Writerside 渲染页（<html>…</html>），而 knowledge/junie/artifacts/ 记录的 20 条 archived_document
    仍指向上一轮的 raw.txt（extractor identity-markdown@1），且这些旧目录已被本轮扫描清除，archive_path 目前不再解析。
  - 对该形态变化做了表示无关的复核：把当前 20 份原件抽成正文文本，按「小节标题 + 高信号标识（backtick 标识、CLI flag、JUNIE_* 环境变量、
    路径与 JSON 片段）」逐条核对 knowledge/junie/references/ 的 115 条引用。108 条一次通过；余下 7 条的表面缺失全部定位为本次核对脚本
    自身的表示误差——norm() 会剥掉 *，而 .junie/rules/*.md、$JUNIE_HOME/models/*.json、[a-z][a-z0-9_-]* 等路径与正则含 *；
    另外 Writerside 对 % 与 … 使用了双重实体转义（&amp;#37;、&amp;hellip;），使 %USERPROFILE%\.junie\AGENTS.md 与
    {"decision":"block","reason":"…"} 在文本里短暂不可见。逐条回看原件后，115 条引用的短摘录在当前原件中全部仍然成立，
    20 个页面的全部 locator 标题也都还在，没有小节被删除或改名。
  - Git 来源 HEAD 从 1ee36c00 前进到 b1e2839d，changed_paths 只有 registry-eap.json、registry-nightly.json、
    update-info-eap.jsonl、update-info-nightly.jsonl、update-info.jsonl 五个文件，全部是分发元数据：新增 release 构建记录
    （3419.26、3419.29）与 nightly 构建记录（3593.1、3595.1 …），以及对第三方 ACP agent 的版本号与下载归档更新。
    README.md 与 install.sh 不在 changed_paths 内。
  - 据此复核了四条 Git 侧引用：ref-junie-repo-install（README 29-44）、ref-junie-repo-channels（README 46-68）、
    ref-junie-repo-auth（README 70-78）、ref-junie-repo-installer（install.sh 1-22），在新提交上逐行仍然成立，行号未漂移。
    安装方式、更新 channel 与认证方式均未变化。
  - source-junie-npm 观察到 3110.7.0@sha512-2OikZxvMaq9xAso0Zk0tTeFghI4SyUk4t4GjDgenJ70rZaq1+IyR6U/XzJwhg1xMPf8c2+Yi75r4l0c06BTNDg==。
    junie 此前没有 npm_release 快照，扫描器取不到基线，因此按首次观察记 changed。按 maintenance 第 3 节，npm 版本变化本身
    不构成章节变化或源码到包的映射；取得包字节属于受管刷新，delivery=pr 不执行，本轮不新建 npm_release 快照，
    也不为 3110.7.0 制造版本映射。七个主题继续按来源级知识记录，version_applicability 保持 unknown。
  - 一处覆盖缺口（本轮无法处理，留作后续）：source-junie-docs-acp 正文现在说明连接 JetBrains IDE 时可用 /ide 命令查看
    IDE 连接状态，并指向 junie-cli-jetbrains-ide-integration.html。该页不在 registry/harnesses/junie.yaml 登记的来源内，
    其余 17 个未登记链接均为 Writerside 的上一页/下一页导航（android-development-with-junie.html 等），
    只有这一条出现在正文语境。登记新来源要改 registry/sources/，超出本轮只写 knowledge/junie/ 与 audits/junie/ 的范围，
    因此本轮不改写任何章节，留给登记该来源后的定向调查。
  - 结论：无读者可见的章节、来源定位或版本映射变化。已发布的七个 v1 章节（skills、mcp、custom_agents、custom_providers、hooks、
    native_plugins、configuration）全部保持原状，不新建 edition，不改 registry/chapter-current.yaml。既有 partial/unknown 答案状态
    是上一轮已发布的知识状态，本轮没有新增未完成问题，故 pending_question_ids 为空。
  - 本轮不触发独立复核：三类高影响情形都不成立——不存在来源间冲突，不存在新来源推翻已发布的配置步骤，不存在跨主题关键加载机制变化。
    唯一 unresolved 项是上面的来源覆盖缺口，属新登记来源缺失而非分歧，按 PRD 保留为后续工作。
