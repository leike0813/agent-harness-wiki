excerpt: |2-
  fn currency_symbol(declared: &str) -> String {
      let declared = declared.trim();
      match declared.to_ascii_uppercase().as_str() {
          "" | "USD" => DEFAULT_CURRENCY.to_string(),
          "EUR" => "€".to_string(),
          "GBP" => "£".to_string(),
          "JPY" => "¥".to_string(),
          _ => declared.to_string(),
      }
  }
