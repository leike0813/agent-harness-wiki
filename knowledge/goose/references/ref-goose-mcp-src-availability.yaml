  pub(crate) fn is_extension_available(config: &ExtensionConfig) -> bool {
      match config {
          ExtensionConfig::Platform { name, .. } => {
              crate::agents::extension::PLATFORM_EXTENSIONS.contains_key(name_to_key(name).as_str())
          }
          _ => true,
      }
  }
