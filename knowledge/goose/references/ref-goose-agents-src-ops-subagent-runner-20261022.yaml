      fn requested_subagent_session_ids(
          &self,
          parent_session: &Session,
          message: &Message,
      ) -> Vec<String> {
          if parent_session.session_type == SessionType::SubAgent {
              return Vec::new();
          }
          delegated_subagent_ids(&message.content)
              .map(str::to_owned)
              .collect()
      }
