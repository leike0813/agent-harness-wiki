excerpt: |-
  pub(crate) fn custom_provider_file_path(id: &str) -> Result<PathBuf> {
      if id.is_empty()
          || id
              .chars()
              .any(|ch| ch == '/' || ch == '\\' || ch.is_control())
      {
          return Err(anyhow::anyhow!(
              "Invalid provider id: {}",
              if id.is_empty() { "<empty>" } else { id }
          ));
      }
      Ok(custom_providers_dir().join(format!("{}.json", id)))
  }
