  fn message_timestamp_to_datetime(timestamp: i64) -> Option<DateTime<Utc>> {
      let timestamp = if timestamp > MILLISECOND_TIMESTAMP_THRESHOLD {
          timestamp / 1000
      } else {
          timestamp
      };
      Utc.timestamp_opt(timestamp, 0).single()
  }
