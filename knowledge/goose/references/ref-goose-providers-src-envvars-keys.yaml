  if let Some(ref env_vars) = config.env_vars {
              for ev in env_vars {
                  // Default primary to `required` so required fields show prominently in the UI
                  let primary = ev.primary.unwrap_or(ev.required);
                  config_keys.push(ConfigKey::new(
                      &ev.name,
                      ev.required,
                      ev.secret,
                      ev.default.as_deref(),
                      primary,
                  ));
