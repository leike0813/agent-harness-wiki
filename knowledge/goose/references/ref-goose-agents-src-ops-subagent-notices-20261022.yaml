  fn start_notice(subagent_id: &str, task: Option<&str>) -> String {
      let snippet = task
          .map(|task| {
              let task = task.split_whitespace().collect::<Vec<_>>().join(" ");
              format!(" ({})", safe_truncate(&task, TASK_SNIPPET_CHARS))
          })
          .unwrap_or_default();
      format!("Running subagent {subagent_id}{snippet}")
  }
