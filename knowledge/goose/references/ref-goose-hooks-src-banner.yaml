  fn extract_banner(stdout: &str) -> Option<String> {
      if !stdout.starts_with('{') {
          return None;
      }
      #[derive(Deserialize)]
      struct BannerResp {
          banner: Option<String>,
      }
      let parsed: BannerResp = serde_json::from_str(stdout).ok()?;
      parsed.banner.filter(|b| !b.is_empty())
  }
