  /// Model IDs are case-sensitive; declarations apply only to the requested ID.
  pub fn find_declared_model<'a>(models: &'a [ModelInfo], model_name: &str) -> Option<&'a ModelInfo> {
      models.iter().find(|model| model.name == model_name)
  }
