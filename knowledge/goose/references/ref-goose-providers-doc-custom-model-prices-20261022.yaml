official_url: "https://github.com/block/goose/blob/6835dd45a21a701b017abe38aa4204e18fed9213/documentation/docs/getting-started/providers.md"
excerpt: |-
  Each model in a custom provider's JSON file can declare prices in USD **per token**:
  Both `input_token_cost` and `output_token_cost` must be present for goose to use a model's configured pricing. If either is missing, goose falls back to catalog pricing for the model.
  Cache-read and cache-write prices are independently optional. Supplied cache prices, including `0`, override catalog cache rates. Omitted cache prices use catalog cache rates when available, otherwise the input price. Declaring both input and output prices as `0` keeps the model free unless you explicitly set a cache price. Provider-reported costs take precedence over estimates.
