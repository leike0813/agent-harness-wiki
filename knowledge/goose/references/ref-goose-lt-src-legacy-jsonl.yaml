  pub fn list_sessions(session_dir: &PathBuf) -> Result<Vec<(String, PathBuf)>> {
      let entries = fs::read_dir(session_dir)?
          .filter_map(|entry| {
              let entry = entry.ok()?;
              let path = entry.path();

              if path.extension().is_some_and(|ext| ext == "jsonl") {
                  let name = path.file_stem()?.to_string_lossy().to_string();
                  Some((name, path))
              } else {
                  None
              }
          })
          .collect::<Vec<_>>();

      Ok(entries)
  }
