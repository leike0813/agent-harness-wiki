  fn remove_subagent_session_meta(result: &mut CallToolResult) {
      let Some(meta) = result.meta.as_mut() else {
          return;
      };

      meta.0.remove("subagent_session_id");

      if meta.0.is_empty() {
          result.meta = None;
      }
  }
