  heading: Tool Filtering
official_url: "https://github.com/block/goose"
excerpt: "Use the `available_tools` field to limit which tools are loaded from an extension. List the tool names you want — only those will be available to goose. Leave it empty (the default) to load all tools. This can help reduce token overhead in sessions where you only need a subset of an extension's capabilities."
