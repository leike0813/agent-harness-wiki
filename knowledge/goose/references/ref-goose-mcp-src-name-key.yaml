  pub fn name_to_key(name: &str) -> String {
      let mut result = String::with_capacity(name.len());
      for c in name.chars() {
          result.push(match c {
              c if c.is_ascii_alphanumeric() || c == '_' || c == '-' => c,
              c if c.is_whitespace() => continue,
              _ => '_',
          });
      }
      result.to_lowercase()
  }
