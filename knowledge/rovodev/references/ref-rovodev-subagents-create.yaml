excerpt: "To create a subagent: 1. Run /subagents to open the subagent. 2. Select Create a subagent. 3. Choose the scope, user-level or project-level. 4. Enter a name and description, select an AI model. 5. Select standard memory files to load, or specify an additional memory file. 6. Enter a system prompt as instructions for the subagent, and specify tools the subagent can use. 7. Select skills the subagent can use."
