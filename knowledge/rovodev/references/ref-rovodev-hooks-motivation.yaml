locator:
  kind: document_section
  heading: "What inspired event hooks?"
official_url: "https://www.atlassian.com/blog/development/streamline-rovo-dev-cli-with-event-hooks"
excerpt: "While waiting for Rovo Dev CLI to complete, we saw a few recurring patterns: People would kick off a longer task, switch to another window, and then forget about the CLI until much later. Sometimes the agent would appear to still be working, but in reality it was blocked while waiting for user permission, so nothing progressed for minutes while the user wasn't looking. After some duration of inactivity, we'd often need to refresh the whole model context, which is slower and more expensive than it needs to be. Event hooks are our answer to that: a way for Rovo Dev CLI to support notifications while also remaining customisable for users to add more functionality beyond notifications."
