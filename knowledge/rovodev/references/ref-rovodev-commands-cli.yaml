official_url: "https://support.atlassian.com/rovo/docs/rovo-dev-cli-commands/"
excerpt: "acli rovodev --help - Show flags and commands. acli rovodev <command> --help - Get detailed help about specific commands (for example, you could use acli rovodev config --help). Server mode: acli rovodev serve [port] - Starts Rovo Dev in server mode on the specified port. Configuration file: acli rovodev config - Opens the configuration file in your default editor. acli rovodev run --config-file [directory] - Create a new configuration in the specified directory and use its settings for Rovo Dev CLI. Model Context Protocol (MCP) servers: acli rovodev mcp - Opens MCP server configuration file in your default editor."
