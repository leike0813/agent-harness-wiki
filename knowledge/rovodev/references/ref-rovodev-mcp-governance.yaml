  heading: How to disable Rovo Dev features
official_url: "https://support.atlassian.com/rovo/docs/rovo-dev-and-model-context-protocol-mcp/"
excerpt: "Rovo Dev CLI and Rovo Dev in IDE can be disabled at an organization level and a site level. Organization level: You must be an organization admin ... Go to Atlassian Administration. ... navigate to Apps > AI settings > AI-enabled apps. Select the Rovo Dev tab. Toggle the feature off. Site level: You must be an app admin ... In the app switcher, select Rovo Dev. Select Settings. Toggle the feature off."
