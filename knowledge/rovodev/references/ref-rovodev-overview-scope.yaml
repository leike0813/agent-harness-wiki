  heading: Use Rovo Dev CLI
official_url: "https://support.atlassian.com/rovo/docs/use-rovo-dev-cli/"
excerpt: "Rovo Dev CLI brings powerful AI capabilities to your terminal. Perform complex development tasks using natural language - like generating, reviewing, and refactoring code, analyzing your codebase, writing documentation, debugging issues, and creating unit tests - all without leaving your command line. Rovo Dev is integrated with your Atlassian apps, so you can also use it to action your Jira work items or create new Confluence content. By bringing all these capabilities to a command line interface, you can speed up your workflow and reduce context-switching."
