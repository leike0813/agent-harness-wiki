  heading: Compound commands
official_url: "https://support.atlassian.com/rovo/docs/use-tools-in-rovo-dev-cli/"
excerpt: "When you run compound commands (using &&, ||, or ;), each subcommand is analyzed separately. If any subcommand requires permission, you'll be prompted for each one. For example, ls -la && cat file.txt && npm install would be split into three subcommands, and each evaluated independently."
