locator:
  kind: document_section
  heading: "Where do skills live?"
official_url: "https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/"
excerpt: "Where you store a skill determines who can use it. When skills share the same name across levels, higher-priority locations win: built-in > user > project. Built-in | Shipped with Rovo Dev | All users. User | ~/.rovodev/skills/<skill-name>/ or ~/.agents/skills/<skill-name>/ | All your projects. Project | .rovodev/skills/<skill-name>/ or .agents/skills/<skill-name>/ | This project only."
