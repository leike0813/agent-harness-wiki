excerpt: "/status - Show CLI status, version, account details, and model. /config - View and edit Rovo Dev configuration. /mode - Display and select from available agent modes. /models - Switch between available AI models. /feedback - Provide feedback or report bugs. /usage - Show Rovo Dev Credit usage. /usage site - Switch to a Rovo Dev credit allocation on another site (when available). /mcp - Manage MCP servers. /directories - Manage allowed external directories for file access. /subagents - Manage subagent profiles (when enabled). /ide - Install Rovo Dev IDE plugin (when enabled). /changelog - Display changelog and release notes. /hooks - Manage event hook configurations. /efficiency - Set the efficiency level for the current session."
