  heading: Use subagents in Rovo Dev CLI
official_url: "https://support.atlassian.com/rovo/docs/use-subagents-in-rovo-dev-cli/"
excerpt: "Rovo Dev can delegate specific tasks to subagents with specialized capabilities, custom system prompts, and tailored tool configurations. Subagents only use context supplied by Rovo Dev, ensuring focused execution and reducing the overall context size of the main agent. Subagents are available to Rovo Dev through the invoke_subagent tool. To use subagents reliably, it's best to explicitly tell Rovo Dev to invoke them. But Rovo Dev can still attempt to delegate relevant tasks to subagents without being asked."
