excerpt: 'Session management\/new - Create a new session with an optional title.\/sessions new - Create a new session with default title.\/sessions new [title] - Create a new session with custom title.\/sessions fork - Fork the current session with default title.\/sessions fork [title] - Fork the current session with custom title.\/sessions rename [title] - Rename the current session.\/sessions rename [current_title] [new_title] - Rename a specific session.'