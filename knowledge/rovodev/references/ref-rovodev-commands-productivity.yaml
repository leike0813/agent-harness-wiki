excerpt: "? - Show all available shortcuts. /ask - Send a prompt in ask (read-only) mode without permanently switching modes. /copy - Copy last agent response to clipboard. /copy conversation [limit] - Copy conversation history to clipboard. /plan - Switch to plan mode to create an implementation plan before making changes. /full-context - Gather project context from Atlassian tools using the full-context-mode skill. /research - Conduct deep research using domain-focused subagents. /yolo - Toggle YOLO mode, without asking permission for tool use (use with caution)."
