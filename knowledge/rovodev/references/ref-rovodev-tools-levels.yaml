official_url: "https://support.atlassian.com/rovo/docs/use-tools-in-rovo-dev-cli/"
excerpt: "Tool permissions are configured in your configuration file (by default at ~/.rovodev/config.yml) in the toolpermissions section. You can configure permissions for specific tools, and each tool can have one of three permission levels: allow - The tool or command can be executed without asking for permission. ask - The agent will prompt you for permission before executing (default for most tools). deny - The tool or command is blocked and cannot be executed in the tools section."
