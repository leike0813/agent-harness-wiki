excerpt: "name | Required | The skill name. Use lowercase letters, numbers, and hyphens (max 64 characters). Must match the directory name. description | Required | What the skill does and when to use it. Rovo Dev uses this to decide when to load the skill automatically. allowed-tools | Optional | A list of tools the skill is pre-approved to use. license | Optional | License information for the skill. compatibility | Optional | Compatibility information for the skill. metadata | Optional | Arbitrary key-value metadata."
