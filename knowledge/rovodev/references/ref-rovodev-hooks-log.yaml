excerpt: "First, try running the command from your terminal directly to check that it works. If it doesn't, you might need to adjust it or choose a different command that achieves the same result. If the sound plays correctly in your terminal, open your config with /config and check the event hooks log file listed under the eventHooks section. That log should help pinpoint what went wrong."
