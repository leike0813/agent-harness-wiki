official_url: "https://support.atlassian.com/rovo/docs/connect-to-an-mcp-server-in-rovo-dev-cli/"
excerpt: "The MCP protocol allows a server to return optional server-level instructions as part of its initialization response. By default, Rovo Dev CLI surfaces a user-configured server's instructions into the agent's system prompt. To prevent a specific server's instructions from being passed to the agent, set \"enable_instructions\": false on that server's entry in mcp.json. Notes: enable_instructions is configured per server ... When the field is absent or set to true, the server's instructions are surfaced to Rovo. You can disable this for MCP servers that are untrustworthy or misbehaving."
