  heading: Command patterns for bash commands
official_url: "https://support.atlassian.com/rovo/docs/use-tools-in-rovo-dev-cli/"
excerpt: "You can use regex patterns to match multiple bash commands: toolPermissions: bash: # Default permission for bash commands not explicitly listed default: ask # List of specific bash commands with their permission settings commands: - command: ls.* permission: allow - command: cat.* permission: allow. Exact match: \"pwd\" - matches only the pwd command. Pattern match: \"ls.*\" - matches ls with any arguments (e.g., ls -la, ls /tmp). First word pattern: \"git.*\" - matches all git commands."
