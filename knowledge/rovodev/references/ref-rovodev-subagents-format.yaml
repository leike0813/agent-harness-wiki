excerpt: "Create a markdown file in this format: --- name: [name] description: [one-line-description] tools: - [tool1] - [tool2] - [tool3] --- [System prompt]. For example (.rovodev/subagents/code-reviewer.md): --- name: code-reviewer description: Reviews code and suggests improvements tools: - open_files - expand_code_chunks - grep - bash --- You are an expert code reviewer focused on identifying potential issues and suggesting improvements."
