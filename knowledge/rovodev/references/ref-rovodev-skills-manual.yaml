  heading: Create a skill manually
official_url: "https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/"
excerpt: "To create a skill manually, create a directory and a SKILL.md file in the appropriate location. For example, for a project-level skill: .rovodev/skills/code-review/SKILL.md. A SKILL.md file has two parts: a YAML frontmatter block (between --- markers) and a markdown body containing the instructions Rovo Dev will follow when the skill is invoked."
