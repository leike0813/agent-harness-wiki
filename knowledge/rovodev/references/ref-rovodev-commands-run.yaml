  heading: Run Rovo Dev CLI
official_url: "https://support.atlassian.com/rovo/docs/rovo-dev-cli-commands/"
excerpt: "acli rovodev run - Start Rovo Dev CLI in interactive mode. acli rovodev run [instruction] - Execute a single instruction (non-interactive mode). acli rovodev run --worktree [name] - Run Rovo Dev CLI in a Git worktree. Optionally, specify a name. If you don't specify a name, a timestamp-based name is automatically generated. acli rovodev run --web - Start Rovo Dev CLI in web UI mode instead of terminal UI. acli rovodev run --restore [session ID] - Run Rovo Dev CLI and restore the last session from the current workspace. acli rovodev run --yolo - Runs Rovo Dev CLI in YOLO mode, without asking permission for tool use (use with caution)."
