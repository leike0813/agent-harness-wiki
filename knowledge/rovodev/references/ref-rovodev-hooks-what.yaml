  heading: "What are Event Hooks?"
official_url: "https://www.atlassian.com/blog/development/streamline-rovo-dev-cli-with-event-hooks"
excerpt: "Event hooks provide you with the ability to \"hook in\" your own custom behaviour into a given event. Concretely, an event is a specific moment in the agent's lifecycle. For example, when it: finishes generating a response; encounters an error; needs your permission to run a tool. In other words, if it can fit into the template \"Every time X happens (an event), I want to run Y (a script)\", that's a perfect application of event hooks."
