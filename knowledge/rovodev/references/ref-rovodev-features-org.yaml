excerpt: "To use Rovo Dev features, they must be activated at both an organization level and a site level. Organization admin permissions required to enable or disable Rovo Dev for your organization. 1. Go to Atlassian Administration. 2. If you have multiple organizations, select the one you want to enable or disable Rovo Dev on. 3. From the main navigation, navigate to Rovo, then Rovo Settings, and select Rovo Dev. 4. Select the Rovo Dev tab. 5. Toggle each feature on or off."
