  heading: Tool permissions
official_url: "https://support.atlassian.com/rovo/docs/use-tools-in-rovo-dev-cli/"
excerpt: "In interactive mode, when Rovo Dev is about to use a tool for the first time, it will ask for permission. You can choose to allow or deny the tool: Once - Apply permission for this single use only. Session - Apply permission for the current session. Always - Save permission to config file and apply to all future sessions. When choosing to deny a tool, you can optionally provide a reason to the agent why you are denying the tool call."
