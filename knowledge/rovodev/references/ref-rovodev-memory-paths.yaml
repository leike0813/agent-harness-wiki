excerpt: "User memory is stored in ~/.rovodev/AGENTS.md. User memory applies to all your Rovo Dev CLI sessions. Project memory is stored in AGENTS.md and AGENTS.local.md in your workspace directories. Project memory is specific to directories you work in. Memory files are written in markdown."
