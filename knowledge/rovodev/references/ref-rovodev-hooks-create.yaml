  heading: Common examples for using event hooks
official_url: "https://www.atlassian.com/blog/development/streamline-rovo-dev-cli-with-event-hooks"
excerpt: "Step 1: From your acli rovodev run session, run /hooks. Step 2: Select on_tool_permission. Step 3: Select \"+ Add new command\". Step 4: Add the following command to play a sound based on your OS: macOS: afplay /System/Library/Sounds/Bottle.aiff; Linux: echo -e '\\a'; Windows (PowerShell): powershell [console]::Beep(1000, 300). When the agent asks for tool permissions, you should now hear a noise."
