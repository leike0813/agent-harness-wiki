  heading: Legacy file support
official_url: "https://support.atlassian.com/rovo/docs/use-memory-in-rovo-dev-cli/"
excerpt: "Rovo Dev provides migration support for several legacy memory file formats: CLAUDE.md, CLAUDE.local.md; codex.md, .codex/*.md; .cursor/rules/*.mdc, .cursorrules.md, .cursorrules; rules.md, .rules.md; .agent.md, .agent.local.md. When using /memory init, content from legacy files will be migrated to the AGENTS.md format."
