  heading: YOLO mode
official_url: "https://support.atlassian.com/rovo/docs/use-tools-in-rovo-dev-cli/"
excerpt: "To enable YOLO mode, run: acli rovodev run --yolo. Or, in interactive mode, use /yolo. When YOLO mode is enabled: All file operations (create, delete, move, open, close, find and replace) are executed without confirmation. All bash/PowerShell commands are executed without confirmation. All workspace navigation and git tools are executed without confirmation. MCP tools and other integrations continue to use their configured permissions. Exit YOLO mode by using /yolo again. YOLO mode is restricted to your session and does not affect your configuration file."
