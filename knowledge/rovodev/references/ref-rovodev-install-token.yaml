  heading: Create API token manually
official_url: "https://support.atlassian.com/rovo/docs/install-and-run-rovo-dev-cli-on-your-device/"
excerpt: "If the link above doesn't work, or you want to create your API token manually: 1. Go to your Atlassian profile and select Create API token with scopes. 2. Enter a name and expiry date for your token, then select Create. 3. Select Rovo Dev, then Next. 4. Select the necessary scopes, then Next: 1. Admin: admin:repository:bitbucket 2. Chat: chat:rovodev 3. Delete: delete:attachment:confluence 4. Manage: manage:jira-project 5. Read: read:account, read:analytics:rovodev, ... read:rovodev:limits ... 6. Search: search:confluence, search:rovodev, search:rovo:mcp 7. View: view:team:teams 8. Write: write:attachment:confluence, ... write:jira-work, write:page:confluence"
