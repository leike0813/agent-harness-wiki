  heading: "How does Rovo Dev use Model Context Protocol?"
official_url: "https://support.atlassian.com/rovo/docs/rovo-dev-and-model-context-protocol-mcp/"
excerpt: "When connected to a third-party data source, in some cases users may create prompts to send data outside of your Atlassian site. Before any data is transferred, users will receive a prompt to review the third-party tool being used to send data, and approve or decline it. Users should carefully review each request to make sure they trust the third-party tool ... No data will be transferred to third-party sources without explicit user approval."
