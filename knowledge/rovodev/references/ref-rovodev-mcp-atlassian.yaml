  heading: "How does Rovo Dev use Model Context Protocol?"
official_url: "https://support.atlassian.com/rovo/docs/rovo-dev-and-model-context-protocol-mcp/"
excerpt: "Rovo Dev CLI and Rovo Dev in IDE process data on the user's local device, and enables connections to third-party data sources via model context protocol (MCP). These Rovo Dev features automatically connect to the Atlassian MCP server, and users can choose to connect to other, third-party data sources by MCP as well."
