  heading: Extend Rovo Dev CLI with Agent Skills
official_url: "https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/"
excerpt: "Agent Skills are reusable instruction sets that teach Rovo Dev how to perform specific types of tasks. A skill is a markdown file with a short YAML header that tells Rovo Dev when and how to use it. Once a skill is in place, Rovo Dev loads its instructions whenever the task matches, giving it the knowledge to act consistently without you having to re-explain the context each time. Agent Skills follow the open Agent Skills protocol."
