excerpt: "By default, Rovo Dev can only access files within your workspace. You can allow access to external paths: toolPermissions: allowedExternalPaths: - \"/path/to/external/directory\" - \"/path/to/external/file.txt\". You can also manage this using the /directories command in interactive mode."
