official_url: "https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/"
excerpt: "Rovo Dev can load and use skills in two ways: Automatically - Rovo Dev reads every skill's description field at the start of a session and loads the matching skill's instructions when the task at hand fits. Write clear, specific descriptions with keywords that make selection obvious. Explicitly - Ask Rovo Dev to use a specific skill by name in your prompt. For example: Use the code-review skill to review my latest changes"
