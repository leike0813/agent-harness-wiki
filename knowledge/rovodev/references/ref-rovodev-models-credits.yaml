  heading: Credit multipliers
official_url: "https://support.atlassian.com/rovo/docs/switch-between-large-language-models-in-rovo-dev-cli/"
excerpt: "Each LLM has its own Rovo Dev credit multiplier based on model complexity, speed, and reasoning depth. See each LLM credit multiplier when you use /models. For example, a more advanced model might have a 1.5x credit multiplier. This means it will use 50% more Rovo Dev Credits than the default LLM for the same task."
