  heading: Manage skills in interactive mode
official_url: "https://support.atlassian.com/rovo/docs/extend-rovo-dev-cli-with-agent-skills/"
excerpt: "In the Rovo Dev TUI, use /skills to open the interactive skills menu. From there, you can: View all available skills across built-in, user, and project scopes, along with their descriptions, allowed tools, and file location. Create a new skill by stepping through a short wizard: choose whether it's a user-level or project-level skill, then enter a name, description, and instructions. Edit an existing skill's description or instructions (built-in skills cannot be edited). Delete a user or project skill (built-in skills cannot be deleted)."
