excerpt: '| `dcode threads list [--agent NAME] [--limit N]` | List sessions (alias: `ls`). Default limit: 20. Set `DEEPAGENTS_CODE_RECENT_THREADS` to change the default, or use `-n` as a short flag for `--limit`. Additional flags: `--sort {created,updated}`, `--branch TEXT` (filter by git branch), `--cwd [PATH]` (filter by working directory; bare flag uses current directory), `-v`/`--verbose` (show all columns including branch, created time, and initial prompt), `-r`/`--relative` (relative timestamps) |

  | `dcode threads delete ID` | Delete a session. Supports `--dry-run` |'
