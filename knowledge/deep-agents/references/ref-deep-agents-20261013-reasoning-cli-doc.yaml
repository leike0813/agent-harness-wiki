excerpt: |-
  Provider-visible reasoning is shown by default in interactive sessions, where it streams into a separate row that collapses when the phase ends; press `Ctrl+O` to reopen it. Non-interactive mode hides reasoning by default. When enabled there, reasoning goes to stderr so the final answer on stdout remains pipeable. Set `DEEPAGENTS_CODE_SHOW_REASONING=0` to hide it in both modes, or pass `--show-reasoning` to show it for one launch. This setting applies for the full session.