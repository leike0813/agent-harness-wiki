excerpt: 'The total includes model calls from the assistant, subagents, offloading, Auto classification, and rubric grading. It persists when you resume or switch threads. Estimates use the [genai-prices](https://github.com/pydantic/genai-prices) catalog; requests without pricing are excluded.


  Use `/tokens` for the token counts behind the estimate. For uncovered models, [add a custom pricing override](/oss/deepagents/code/configuration#custom-pricing-overrides).'
