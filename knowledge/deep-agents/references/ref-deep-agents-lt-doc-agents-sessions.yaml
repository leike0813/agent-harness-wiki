excerpt: 'Resume a previous conversation with `-r`/`--resume`. Pass no ID to open the most recent thread, or pass a thread ID to resume a specific session. Resuming bypasses agent selection flags and restores the thread''s original agent:


  ```bash theme={"theme":{"light":"catppuccin-latte","dark":"catppuccin-mocha"}}

  dcode -r

  dcode -r abc123-thread-id

  ```


  List and delete sessions with `dcode threads list` and `dcode threads delete`. See [Memory and skills](/oss/deepagents/code/memory-and-skills) for how per-agent memory works.'
