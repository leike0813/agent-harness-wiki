  <ResponseField name="DEEPAGENTS_CODE_SHOW_REASONING" type="string" post={["optional"]}>
    Show provider-visible reasoning in the interactive transcript and on stderr in non-interactive mode. Defaults to on in interactive sessions and off in non-interactive mode. Set to `1` to show it or `0` to hide it in both modes. Overrides `[ui].show_reasoning`; `--show-reasoning` takes precedence for a single launch.
  </ResponseField>