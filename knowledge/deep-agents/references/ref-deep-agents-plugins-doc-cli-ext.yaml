excerpt: "Run `/extensions` in a session to list each extension registration with its kind, name, scope, and source path. The report also shows load failures and whether graph-bound changes require `/restart`. This command and Python extension loading require `DEEPAGENTS_CODE_EXPERIMENTAL=1`. See [Python extensions](/oss/deepagents/code/extensions)."
