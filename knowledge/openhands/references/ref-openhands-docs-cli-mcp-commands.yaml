  ### List Servers
  View all configured MCP servers:
  ```bash theme={null}
  openhands mcp list
  ```
  ### Get Server Details
  View details for a specific server:
  ```bash theme={null}
  openhands mcp get <server-name>
  ```
  ### Remove a Server
  Remove a server configuration:
  ```bash theme={null}
  openhands mcp remove <server-name>
  ```
