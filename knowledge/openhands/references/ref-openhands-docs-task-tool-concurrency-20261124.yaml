excerpt: |-
  Each task call blocks until its sub-agent finishes. To run independent task calls concurrently, configure the parent agent’s `tool_concurrency_limit`. See [parallel tool execution](https://docs.openhands.dev/sdk/guides/parallel-tool-execution.md).
