  heading: Configuration Format
official_url: "https://docs.openhands.dev/openhands/usage/cli/mcp-servers.md"
excerpt: |-
  The file uses the [MCP configuration format](https://gofastmcp.com/clients/client#configuration-format):
  ```json theme={null}
  {
    "mcpServers": {
      "server-name": {
        "command": "command-to-run",
        "args": ["arg1", "arg2"],
        "env": {
          "ENV_VAR": "value"
        }
      }
    }
  }
  ```
