  heading: Hooks Bundled in Plugins
official_url: "https://docs.openhands.dev/openhands/usage/customization/hooks.md"
excerpt: |-
  Plugins can ship hooks in `hooks/hooks.json`, or in `dev.openhands/hooks/hooks.json` for
  [Agent Plugins packages](https://docs.openhands.dev/overview/agent-plugins.md). These hooks still run from the conversation's
  working folder, but OpenHands sets `PLUGIN_ROOT` in their environment to the resolved root
  directory of the plugin that supplied them. A hook can call a script bundled in its plugin
  without knowing where OpenHands cached the plugin:
