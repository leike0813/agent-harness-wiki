  heading: Create the Hooks Directory
official_url: "https://docs.openhands.dev/openhands/usage/customization/hooks.md"
excerpt: |-
  These paths are inside the backend environment. If you configured a different
  default working directory, use that directory instead. Hooks are loaded from
  the working folder itself; OpenHands does not search its parent folders. For
  example, `/home/openhands/workspace/.openhands/hooks.json` is not loaded when
  the working folder is `/home/openhands/workspace/project`.
