  heading: Hooks Bundled in Plugins
official_url: "https://docs.openhands.dev/openhands/usage/customization/hooks.md"
excerpt: |-
  The shell expands the variable, so quote it in case the path contains spaces. This example uses
  POSIX shell syntax; on Windows, use `%PLUGIN_ROOT%`. Each plugin's hooks see their own root, bound
  to the plugin revision loaded for the conversation, so two plugins that bundle a script with the
  same name each run their own copy. Hooks from `.openhands/hooks.json` are not supplied by a plugin
  and do not receive `PLUGIN_ROOT`.
