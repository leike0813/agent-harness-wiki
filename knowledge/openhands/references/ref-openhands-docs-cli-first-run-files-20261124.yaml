official_url: "https://docs.openhands.dev/openhands/usage/cli/installation.md"
excerpt: |-
  The first time you run the CLI, it will take you through configuring the required LLM settings. These will be saved
  for future sessions in `~/.openhands/agent_settings.json`. CLI preferences are stored in
  `~/.openhands/cli_config.json`, and MCP server configuration is stored in `~/.openhands/mcp.json`.

  The conversation history will be saved in `~/.openhands/conversations`.
