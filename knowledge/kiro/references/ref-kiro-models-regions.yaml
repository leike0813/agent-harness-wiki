  heading: Inference endpoint regions
official_url: "https://kiro.dev/docs/models.md"
excerpt: |-
  The geography that serves your request depends on both the model you select and the region of your Kiro profile. GPT-5.6 models are served from the US regardless of your profile region. Claude Fable 5.1 is currently available only in US East (N. Virginia). Every other model is served from the geography that matches your profile.
  Profile region applies to enterprise users who sign in through IAM Identity Center or an external identity provider. Free Tier users and individual subscribers are always served from the US.
  | Model | Kiro profile in US East (N. Virginia) | Kiro profile in Europe (Frankfurt) |
  |-------|:-------------------------------------:|:----------------------------------:|
  | **GPT-5.6 Sol** | US | US |
  | **GPT-5.6 Terra** | US | US |
  | **GPT-5.6 Luna** | US | US |
