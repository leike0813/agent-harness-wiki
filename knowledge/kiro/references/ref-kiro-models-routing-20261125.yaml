official_url: "https://kiro.dev/docs/models.md"
excerpt: |-
  The table below is the source of truth for model routing. Each profile column shows where requests from that Kiro profile are processed: **US profile** is a Kiro profile in US East (N. Virginia), and **EU profile** is a Kiro profile in Europe (Frankfurt). **Status** is the model's [lifecycle status](https://kiro.dev/docs/models/available-models.md#model-lifecycle). Lifecycle status and inference routing are independent.

  Profile Region applies to enterprise users who sign in through IAM Identity Center or an external identity provider. Free Tier users and individual subscribers follow the **US profile** column.
