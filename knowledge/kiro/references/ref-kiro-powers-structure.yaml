excerpt: |-
  Here's what a complete power looks like:
  ```text
  power-supabase/
  ├── plugin.json                           # Required manifest
  ├── mcp.json                              # MCP server configuration
  └── skills/                               # Agent Skills
      ├── setup/
      │   ├── SKILL.md
      │   └── scripts/
      │       └── validate-deps.sh
      └── migrations/
          ├── SKILL.md
          └── references/
              └── migration-patterns.md
  ```
