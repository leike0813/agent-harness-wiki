excerpt: |-
  Triggers when a new chat session starts in the IDE or CLI V3. Use the canonical `SessionStart` trigger in CLI V3.
  **ℹ️ Info:** For CLI 2.x and compatibility spellings, see [Agent Spawn](#agent-spawn).
  **Use Cases:**
  - Inject workspace-specific instructions into the agent's context
  - Run environment checks (verify dependencies, validate credentials)
  - Load project-specific configuration at session start
