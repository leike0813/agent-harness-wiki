locator:
  kind: document_section
  heading: Install and uninstall powers in CLI V3
official_url: "https://kiro.dev/docs/powers/installation.md"
excerpt: |-
  From a local CLI V3 chat session, install a power by its catalog name or the path to a local directory:
  ```text
  /powers install <name|path>
  ```
  If the argument is an existing directory, Kiro installs the power from that directory. Otherwise, Kiro looks for an exact name in the powers catalog. A local power directory must contain a `plugin.json` or `POWER.md` file.
  Remove an installed power by name:
  ```text
  /powers uninstall <name>
  ```
  The commands above run inside an interactive chat. To install or uninstall a power without starting chat, use the corresponding `kiro-cli powers` command:
  ```bash
  kiro-cli powers install <name|path>
  kiro-cli powers uninstall <name>
  ```
  Installing or uninstalling powers isn't supported in cloud sessions because these commands modify the local machine.
