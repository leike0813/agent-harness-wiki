official_url: "https://kiro.dev/docs/hooks/types.md"
excerpt: |-
  Not all hook triggers are available on every surface or CLI version. The table below shows support for the current standalone Hook format; CLI version labels identify aliases or version-specific triggers.
  | Trigger | IDE | CLI | Web |
  |---------|:---:|:---:|:---:|
  | [Prompt Submit](#prompt-submit) | ✓ | ✓ | ✓ |
  | [Agent Stop](#agent-stop) | ✓ | ✓ | ✓ |
  | [Session Start](#session-start) | ✓ | V3 | ✓ |
  | [Agent Spawn](#agent-spawn) | — | 2.x / V3 alias | — |
  | [Session End](#session-end-cli-v3-only) | — | V3 | — |
  | [Pre Tool Use](#pre-tool-use) | ✓ | ✓ | ✓ |
  | [Post Tool Use](#post-tool-use) | ✓ | ✓ | ✓ |
  | [File Create](#file-create) | ✓ | V3 | ✓ |
  | [File Save](#file-save) | ✓ | V3 | ✓ |
  | [File Delete](#file-delete) | ✓ | V3 | ✓ |
