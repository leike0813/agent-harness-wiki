excerpt: |-
  Model access management controls which models your users can select in their clients. Turning it on for your organization is a separate step from approving individual models: after you enable the setting, you choose each model in **Manage approved list**.

  - **Disabled:** Claude Fable 5.2, Claude Fable 5.1, and Kimi K3 are not available. All other supported models are available, and new models become available automatically as Kiro adds them.
  - **Enabled:** Only models selected in **Manage approved list** are available. New models are not available until an administrator selects them and saves the list. Claude Fable 5.2, Claude Fable 5.1, and Kimi K3 follow the same rule: they appear in the list unselected, and users cannot see them until an administrator selects them and saves the list.
