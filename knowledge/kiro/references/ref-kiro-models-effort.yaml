  heading: Reasoning effort
official_url: "https://kiro.dev/docs/models.md"
excerpt: |-
  For models that support configurable reasoning effort, you can control how much reasoning the model applies to your prompts. Lower effort levels produce faster, shorter responses and use fewer credits. Higher levels spend more tokens on deeper analysis, multi-step reasoning, and thorough code generation.
  | Capability | IDE | CLI | Web | Mobile |
  |------------|:---:|:---:|:---:|:------:|
  | Reasoning effort selection | ✓ | ✓ | ✓ | — |
  Set the level from the model selector's **Effort** panel in the IDE, by opening `/model` and choosing **Effort** in Kiro CLI, or from the reasoning effort selector in Kiro Web. You can also use the `--effort` launch flag in the CLI. In the IDE, the choice applies to subsequent messages in the conversation.
