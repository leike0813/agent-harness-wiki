  heading: "Organization sign-in"
official_url: "https://kiro.dev/docs/mcp/configuration.md"
excerpt: |-
  In Kiro IDE 1.4.236 or later and Kiro CLI 3.5.0 or later, Kiro can let eligible HTTP MCP servers share one sign-in through your organization's identity provider instead of signing in to each server separately. Kiro CLI V2 sessions ignore `identityProvider` and `oauth.mode`.
