excerpt: |-
  | `--url <URL>` | Endpoint of an HTTP server (required for an HTTP server) |
  | `--oauth-mode <MODE>` | How a V3 session gets the HTTP server's access token (Kiro CLI 3.5.0 or later; requires `--url`): `browser` (default) signs in to the server in a browser; `enterprise` uses only the organization sign-in set up with `kiro-cli mcp idp setup` and never opens a browser; `auto` uses the organization sign-in when the server supports it and a browser sign-in otherwise. Stored as `oauth.mode`; V2 sessions ignore it. See [Organization sign-in](https://kiro.dev/docs/mcp/configuration.md#organization-sign-in) |
