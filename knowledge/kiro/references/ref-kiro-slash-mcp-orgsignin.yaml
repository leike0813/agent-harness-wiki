excerpt: |-
  In Kiro CLI 3.5.0 or later, when an [organization sign-in](https://kiro.dev/docs/mcp/configuration.md#organization-sign-in) is set up with `kiro-cli mcp idp setup`, a V3 session lists an `org sign-in` row first in the panel. It shows the provider's name and, once signed in, your account in parentheses; otherwise `not signed in`, `session expired`, or `signing in`. While the row is selected and signed out or expired, it adds `Enter to sign in`. An invalid `identityProvider` block shows its error on this row.
