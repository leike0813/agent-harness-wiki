  heading: "Servers not in the registry"
official_url: "https://kiro.dev/docs/mcp/registry.md"
excerpt: |-
  In a Kiro CLI V3 session, a name match alone is not enough. A registry server runs only when its `mcp.json` entry is declared as ``. An entry that matches a registry name but supplies its own `command` or `url` is skipped. The `/mcp` panel lists the configured servers the registry hid and, for servers the registry offers, shows how to declare them. `kiro-cli mcp list` marks these servers as skipped rather than active.
