excerpt: |-
  - **Your organization** - If your Kiro account is managed by an admin, choose **Your organization**. You can use either AWS IAM Identity Center or an external Identity Provider such as Okta or Microsoft Entra ID:
    - **AWS IAM Identity Center** — you'll need the **Start URL** and the **AWS Region** that hosts your identity directory, provided by your admin.
    - **External identity provider** — enter your *work email* or the **Kiro Start URL** provided by your admin. This is also the path for [AWS GovCloud (US) regions](#aws-govcloud-us-regions).
