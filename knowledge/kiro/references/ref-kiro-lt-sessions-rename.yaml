excerpt: |-
  `/sessions rename <name>` renames the current local session and, in Kiro CLI 3.5.0 or later, a cloud session too; earlier versions refused it in a cloud session as an unknown subcommand. The title is saved on this machine and, for a cloud session, sent to the session. On success Kiro prints `Session renamed to "<name>"`; when the cloud session does not confirm, it prints `Session renamed on this machine; the cloud session did not confirm the new title`. To confirm, run `kiro-cli chat --list-sessions`, which shows the new title. See [Current limitations](https://kiro.dev/docs/cloud-sessions.md#current-limitations) for what cloud sessions still cannot do.
