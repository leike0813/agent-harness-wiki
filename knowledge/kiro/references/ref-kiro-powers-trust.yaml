  heading: "Security and trust"
official_url: "https://kiro.dev/docs/powers/installation.md"
excerpt: |-
  A power can add Skills, scripts, and MCP servers to Kiro. Tool calls from a power follow the same Kiro permission settings as any other tool. A local MCP server runs on your machine with your user's access unless you sandbox it, so it can run code and read files you can read. Before you install, review the power's source and the access it requests. To remove a power, choose **Uninstall** on the power in the IDE Powers panel, or run `/powers uninstall <name>` or `kiro-cli powers uninstall <name>` in Kiro CLI. For MCP server safety, see [MCP security best practices](https://kiro.dev/docs/mcp/security.md).
