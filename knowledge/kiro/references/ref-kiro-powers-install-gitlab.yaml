  heading: "From public GitHub or GitLab URL"
official_url: "https://kiro.dev/docs/powers/installation.md"
excerpt: |-
  You can use a repository URL or a URL that points to a directory in the repository. A URL that names no branch installs from the `main` branch. If the repository's default branch has another name, open the folder on that branch in GitHub or GitLab and copy the URL from your browser, so the URL names the branch. To install from a self-hosted GitLab instance, add its host to the `kiroAgent.powers.trustedGitLabHosts` setting first.
