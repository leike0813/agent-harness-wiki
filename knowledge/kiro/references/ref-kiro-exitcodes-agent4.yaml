excerpt: |-
  A non-interactive run (`--no-interactive`, V2 or V3) exits with code 4 when its named agent isn't available on the selected agent engine. In Kiro CLI 3.5.0 or later, a V3 run with no named agent also exits with code 4 when its requested mode is unavailable:
