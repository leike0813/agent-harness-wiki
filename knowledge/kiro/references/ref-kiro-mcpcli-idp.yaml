official_url: "https://kiro.dev/docs/reference/cli-commands.md"
excerpt: |-
  Set up, show, or remove the organization sign-in that HTTP MCP servers with `oauth.mode` `enterprise` or `auto` use in V3 sessions (Kiro CLI 3.5.0 or later). The configuration lives in a top-level `identityProvider` block of the user-level `~/.kiro/settings/mcp.json`; `setup` never writes a workspace file. See [Organization sign-in](https://kiro.dev/docs/mcp/configuration.md#organization-sign-in).
