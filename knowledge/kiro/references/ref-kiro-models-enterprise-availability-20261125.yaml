excerpt: |-
  **Claude Fable 5.2** is available in Preview, with limited access during the rollout, to Kiro Enterprise organizations with model governance enabled. It has a 1M context window and a 6x credit multiplier. Inference runs only in the US geography. Organizations with access can select Fable 5.2 in **Manage approved list** and save the list to make it available to their users. See [Claude Fable 5.2](https://kiro.dev/docs/models/available-models.md#claude-fable-52) for capabilities and data-handling details.
