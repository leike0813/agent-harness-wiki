excerpt: |-
  The `.kiro/hooks/*.json` format was introduced in **IDE 1.0** and **CLI 3.0**. If you're upgrading from an earlier version:
  - **From IDE 0.x** - Hooks moved from the previous format to standalone JSON files with PascalCase trigger names. See [What's new in IDE 1.0: Hooks](https://kiro.dev/docs/ide/whats-new-v1/hooks.md) for the trigger mapping.
  - **From CLI 2.x** - Hooks moved from embedded fields in agent config to standalone files. Run `kiro-cli agent migrate` to auto-convert, or see [CLI 3.0 Hooks migration](https://kiro.dev/docs/cli/v3/hooks-migration.md) for the manual mapping. For the legacy embedded format and trigger namespace, see the [CLI 2.x reference](https://kiro.dev/docs/cli/2x-reference.md#hooks).
