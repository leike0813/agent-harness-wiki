  heading: "Use cloud-synced Powers in the IDE"
official_url: "https://kiro.dev/docs/powers.md"
excerpt: |-
  Cloud-synced Powers are account-backed configuration. They are separate from [cloud sessions](https://kiro.dev/docs/cloud-sessions.md), which run the agent in a managed sandbox. Use [Configuration Sync](https://kiro.dev/docs/web/cloud-configuration.md) to upload a supported local Power to your Kiro Web account. Powers you manage under **Agent Config > Powers & MCP** in [Kiro Web](https://app.kiro.dev/settings/powers) appear in the installed Powers list in Kiro IDE 1.0.437 or later. A cloud indicator identifies each Power. Select **Try power** to use it directly, or open its details to review its bundled Skills and MCP configuration.
