  heading: File locations by platform
official_url: "https://docs.warp.dev/terminal/settings/file-locations.md"
excerpt: "Portable user data (`%APPDATA%\\warp\\Warp\\data\\`, Roaming): themes, tab_configs, default_tab_configs, workflows, launch_configurations. Non-portable config (`%LOCALAPPDATA%\\warp\\Warp\\config\\`): `settings.toml`, `keybindings.yaml`, legacy preferences in registry key `HKCU:\\Software\\Warp.dev\\Warp`. Non-portable state (`%LOCALAPPDATA%\\warp\\Warp\\data\\`): logs `warp.log*`, database, Codebase Context index, MCP logs; cache `%LOCALAPPDATA%\\warp\\Warp\\cache\\`."
