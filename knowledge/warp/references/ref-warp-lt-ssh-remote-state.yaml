excerpt: '-   **One server, many sessions** - Multiple SSH sessions and Warp windows connected to the same host share a single server process.

  -   **Automatic updates** - The extension version tracks your Warp version. When you connect to a host with an outdated extension, Warp automatically installs the matching version.

  -   **Easy to remove** - Uninstall by deleting the `~/.warp*/remote-server` directory on the remote host.'
