  heading: File locations by platform
official_url: https://docs.warp.dev/terminal/settings/file-locations.md
excerpt: |-
  **Cross-platform (always in your home directory)**

  -   **MCP server config** - `%USERPROFILE%\.warp\.mcp.json`
  -   **Bundled skills** - `%USERPROFILE%\.warp\skills\`
  -   **Agent config** - `%USERPROFILE%\.agents\`
  -   **Warp Agent CLI install** (install-script default) - `%LOCALAPPDATA%\Warp\tui\` with Stable launcher `%LOCALAPPDATA%\Warp\bin\warp.cmd`
