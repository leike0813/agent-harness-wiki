excerpt: '-   **Child agent** - an agent spawned by a parent with its own prompt, environment, and (optionally) a different model or agent runtime. A child runs its own work and reports back; it does not spawn its own children.


  Orchestrations today are exactly one level deep: a parent and its direct children. The Warp app, the [Oz web app](https://docs.warp.dev/platform/oz-web-app/), and the [Oz API & SDK](https://docs.warp.dev/reference/api-and-sdk/) render that single level. The parent and each child each have an independent **run** with its own lifecycle, transcript, conversation, and credit usage.'
