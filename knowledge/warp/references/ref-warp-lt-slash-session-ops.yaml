excerpt: '| `/remote-control` | Publish the current third-party CLI agent session to the cloud so you can monitor and steer it from another device. See [Remote Control](https://docs.warp.dev/agents/cli-agents/remote-control/). |

  | `/rename-conversation` | Rename the current conversation. |

  | `/rename-tab` | Rename the current tab. Include the new tab name as an argument (for example, `/rename-tab deploy`). |

  | `/rewind` | Rewind to a previous point in the conversation. |'
