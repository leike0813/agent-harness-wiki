  heading: Workspaces in Warp Drive
official_url: "https://docs.warp.dev/knowledge-and-collaboration/warp-drive.md"
excerpt: |-
  When you open the Warp Drive panel, you will find a personal workspace where you can store your Workflows, Notebooks, Prompts, and Environment Variables and organize them into folders.
  ![Personal workspace zero state in Warp Drive, showing where Workflows, Notebooks, Prompts, and Environment Variables are saved.](https://docs.warp.dev/_astro/Warp_Drive_Zero_State.ChcuOCHL_U7Smd.webp?dpl=dpl_8fQc7jHAsnEorizNiqpCwthfQCjA)
  If you are a member of a team using Warp Drive, your team’s workspace will also be available in the side panel.
  ![Warp Drive side panel showing both a personal workspace and a team workspace.](https://docs.warp.dev/_astro/Warp_Drive_with_Team.DL2nCgiJ_1R1Ujq.webp?dpl=dpl_8fQc7jHAsnEorizNiqpCwthfQCjA)
