  heading: File locations by platform
official_url: "https://docs.warp.dev/terminal/settings/file-locations.md"
excerpt: "On macOS, Stable keeps every Warp-authored file under `~/.warp/`. Portable user data: themes `~/.warp/themes/`, tab configs `~/.warp/tab_configs/`, workflows `~/.warp/workflows/`, launch configurations `~/.warp/launch_configurations/`. Non-portable config: settings file `~/.warp/settings.toml`, keybindings `~/.warp/keybindings.yaml`. Non-portable state: logs `~/Library/Logs/warp.log*`, database/Codebase Context index/MCP logs under `~/Library/Group Containers/2BBY89MBSN.dev.warp/Library/Application Support/dev.warp.Warp-Stable/`."
