  kind: document_section
  heading: Setting up notifications
official_url: "https://docs.warp.dev/agents/capabilities/agent-notifications.md"
excerpt: |-
  For the **Warp Agent**, notifications work out of the box — no setup needed.
  For **third-party CLI agents**, each agent requires a one-time setup. The process varies by agent:
  -   **Claude Code** - one-click auto-install via a chip in Warp, or manual plugin commands. See [Claude Code setup](https://docs.warp.dev/agents/cli-agents/claude-code/#setting-up-notifications).
  -   **Codex** - add `notification_condition = "always"` under `[tui]` in `~/.codex/config.toml`, then restart Codex. See [Codex setup](https://docs.warp.dev/agents/cli-agents/codex/#setting-up-notifications).
  -   **OpenCode** - add `"@warp-dot-dev/opencode-warp"` to the `plugin` array in your OpenCode config. See [OpenCode setup](https://docs.warp.dev/agents/cli-agents/opencode/#setting-up-notifications).
