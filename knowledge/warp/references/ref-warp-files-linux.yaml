  heading: File locations by platform
official_url: "https://docs.warp.dev/terminal/settings/file-locations.md"
excerpt: "On Linux, Warp follows the XDG Base Directory Specification: portable data `${XDG_DATA_HOME:-$HOME/.local/share}/warp-terminal/` (themes, tab_configs, default_tab_configs, workflows, launch_configurations); non-portable config `${XDG_CONFIG_HOME:-$HOME/.config}/warp-terminal/` (`settings.toml`, `keybindings.yaml`); non-portable state `${XDG_STATE_HOME:-$HOME/.local/state}/warp-terminal/` (logs, database, Codebase Context index, MCP logs); cache `${XDG_CACHE_HOME:-$HOME/.cache}/warp-terminal/`."
