  ## Usage and model availability

  A custom router’s inference usage follows the model it selects. See [usage and billing](https://docs.warp.dev/support-and-community/plans-and-billing/credits/) for charge components and billing units.

  ### Using your own API keys (BYOK)

  Custom routers work with [Bring Your Own API Key (BYOK)](https://docs.warp.dev/agents/inference/bring-your-own-api-key/). After the router selects a model, Warp applies your API keys as it would when selecting that model directly. Your provider bills inference covered by a matching key; requests without a matching key use Warp-provided inference. [Platform charges](https://docs.warp.dev/support-and-community/plans-and-billing/platform-credits/) still apply to eligible runs.
