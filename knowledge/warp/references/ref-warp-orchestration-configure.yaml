  heading: How a child agent is configured
official_url: "https://docs.warp.dev/platform/orchestration.md"
excerpt: |-
  An ad hoc child’s prompt comes from the parent at spawn time. The model, harness, and execution settings apply to every child in the batch.
  Use a [skill](https://docs.warp.dev/agents/capabilities/skills/) for reusable instructions. A local child discovers the project and home-directory skills in scope from its working directory. For cloud children, the parent attaches skills from a repository in the [environment](https://docs.warp.dev/platform/environments/).
  For named agents with standing configuration, use [Warp Factories](https://docs.warp.dev/factories/). A factory’s foreman can dispatch its [factory agents](https://docs.warp.dev/factories/factory-agents/#choose-a-configured-factory-agent).
