  heading: Creating a Launch Configuration
official_url: "https://docs.warp.dev/terminal/sessions/launch-configurations.md"
excerpt: |-
  ### From the UI
  1.  Set up the configuration of windows, tabs, and panes you would like to save.
  2.  Open the [Command Palette](https://docs.warp.dev/terminal/command-palette/), and type in `Save New Launch Configuration`.
  3.  Name the configuration file. The name field cannot be empty.
  4.  Click the Save configuration button.
  Warp saves each tab group’s name, color, collapsed and pinned states, and tab membership.
  ### With a YAML File
  -   Launch Configurations files are generated when you create them with the UI and can also be created or modified manually.
  -   See [Launch Configuration YAML file locations, format, and examples](https://docs.warp.dev/terminal/sessions/launch-configurations/#launch-configuration-yaml-format).
