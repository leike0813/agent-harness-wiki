excerpt: |-
  Use Slash Commands in terminal mode or Agent Mode to quickly run built-in actions or saved prompts without leaving the input field.

  Slash Commands are quick actions and saved prompts you can invoke by typing `/` in terminal mode or Agent Mode. They provide instant access to built-in actions like starting conversations, creating environments, switching models, opening static flows, and running saved prompts from Warp Drive.
