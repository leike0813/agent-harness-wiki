official_url: "https://docs.warp.dev/agents/inference/custom-inference-endpoint.md"
excerpt: |-
  ### AI credits
  When you select an endpoint-routed model from the model picker, inference is billed directly by your endpoint provider, according to their pricing, rather than drawing from your AI credits.
  Note
  On Business and Enterprise plans, local agent runs that route through a custom inference endpoint still consume platform credits for Warp’s platform infrastructure. See [platform credits](https://docs.warp.dev/support-and-community/plans-and-billing/platform-credits/) for the full breakdown.
  ### Auto routing still uses Warp credits
  Warp’s **Auto** models dynamically route across providers using Warp’s infrastructure. Because Auto routing depends on Warp, **Auto always consumes Warp’s credits**, even if you’ve configured a custom inference endpoint.
