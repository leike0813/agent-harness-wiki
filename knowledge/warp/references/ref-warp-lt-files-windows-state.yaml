excerpt: '**Non-portable state** (`%LOCALAPPDATA%\warp\Warp\data\`)


  -   **Logs** - `%LOCALAPPDATA%\warp\Warp\data\logs\warp.log*`

  -   **Database, Codebase Context index, MCP logs** - other subdirectories under `%LOCALAPPDATA%\warp\Warp\data\`

