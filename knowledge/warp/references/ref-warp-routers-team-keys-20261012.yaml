excerpt: |-
  Warp’s built-in Auto models use Warp-provided inference even when BYOK is configured.

  -   **Covering all routed models** - Configure a provider key for every model the router references. Requests without a matching key use Warp-provided inference.
  -   **Team-managed keys (Business and Enterprise)** - [Team-managed API keys](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) apply to custom routers the same way; a member’s own key for a provider takes precedence over the team’s.
  -   **No custom inference endpoints** - Routing targets must be Warp-supported models, so a router can’t resolve to a model from a [custom inference endpoint](https://docs.warp.dev/agents/inference/custom-inference-endpoint/) and never draws on your endpoint.
