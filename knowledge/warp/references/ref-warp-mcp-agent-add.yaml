  heading: "Using `/agent-add-mcp`"
official_url: "https://docs.warp.dev/agents/capabilities/mcp.md"
excerpt: |-
  The built-in `/agent-add-mcp` skill lets the Warp Agent create or update file-based MCP server definitions. Choose whether to save globally or in the current project — the skill writes the server definition to the matching file:
  -   **Global:** `~/.warp/.mcp.json`
  -   **Project-scoped:** `{repo_root}/.warp/.mcp.json`
  The demo shows how to use `/agent-add-mcp` to add an MCP server, choose where Warp saves the file-based configuration, and review the generated `.warp/.mcp.json` file before using the server.
