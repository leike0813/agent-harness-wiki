  ## Centrally managed configuration

  Personal endpoints are configured on each user’s device and work for local Warp Agent runs, not [cloud agents](https://docs.warp.dev/platform/).

  Business and Enterprise admins can configure [team-managed endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/) for local and cloud runs. For Enterprise AWS Bedrock or Gemini Enterprise (Vertex AI) routing, see [Bring Your Own LLM](https://docs.warp.dev/enterprise/enterprise-features/bring-your-own-llm/).
