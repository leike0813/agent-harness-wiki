excerpt: |-
  ### Auto Model

  Warp’s **Auto** models use Warp-provided inference and consume your available usage, even if you’ve configured your own API keys.

  To use your own key, select a specific provider model (for example, Claude Opus 4.7, Claude Sonnet 4.6, GPT-5.5, or Gemini 3.1 Pro) directly from the model picker with a key icon.

  [Custom routers](https://docs.warp.dev/agents/inference/custom-routers/) resolve each task to a model you chose, then apply your API keys to that model. Requests covered by one of your keys bill inference through your provider account. See [usage and model availability](https://docs.warp.dev/agents/inference/custom-routers/#credits-and-model-availability) for details.
