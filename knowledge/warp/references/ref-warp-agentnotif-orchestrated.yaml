locator:
  kind: document_section
  heading: Notifications in orchestrated runs
official_url: "https://docs.warp.dev/agents/capabilities/agent-notifications.md"
excerpt: |-
  In a [multi-agent orchestration](https://docs.warp.dev/platform/orchestration/), the parent agent and each child agent are separate conversations. Today, in-app notifications fire on the parent’s conversation only: child agent conversations are excluded from the toast stream and the notification mailbox so the mailbox doesn’t get cluttered with per-child status churn.
  That means:
  -   **Toasts and the mailbox** - watch the parent’s conversation for `Complete`, `Request`, and `Error` notifications.
  -   **Per-child state** - use the orchestration pill bar above the agent view header (in the Warp app) or the parent’s **Sub-agents** tab on the [Runs page](https://oz.warp.dev/runs) (in the Oz web app) to see each child’s live status.
