excerpt: |-
  ### Warp Terminal and local agent teams

  Personal BYOK is configured on each member’s device. Those keys work for local Warp Agent runs in the app or CLI, not [cloud agents](https://docs.warp.dev/platform/). Business and Enterprise plans for Warp Terminal and local agents also support centrally managed keys in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/).
