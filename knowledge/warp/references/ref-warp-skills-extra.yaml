excerpt: "[Cloud agents](https://docs.warp.dev/platform/) discover skills from the repositories in their [environment](https://docs.warp.dev/platform/environments/). To index skills that live outside those repositories — for example, skills baked into a custom Docker image — set the `WARP_SKILL_DIRS` environment variable. See [extra skill directories in cloud runs](https://docs.warp.dev/platform/skills-as-agents/#extra-skill-directories-in-cloud-runs)."
