  heading: Identify skill sources in conversation data
official_url: "https://docs.warp.dev/agents/capabilities/skills.md"
excerpt: |-
  The [Conversation API](https://docs.warp.dev/api) returns skill loads as `read_skill` actions. The action’s `input` identifies the skill source:
  | Input field | Skill source |
  | --- | --- |
  | `bundled_skill_id` | A Warp-provided bundled reference when this field is present. |
  | `skill_path` | The path used to resolve the skill. It can refer to a file-based skill or a path-referenced bundled skill, including one from a remote host. |
  To measure usage of skills your team owns, exclude `read_skill` actions whose `input` contains `bundled_skill_id`. From the remaining actions, count only `skill_path` values under skill roots your team manages. Don’t classify other path-based entries as customer-owned because Warp-bundled skills can also use `skill_path`.
