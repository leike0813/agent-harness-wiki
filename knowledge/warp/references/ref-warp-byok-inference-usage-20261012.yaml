excerpt: |-
  ### Inference usage

  When you select a model with the key icon in your model picker, Warp routes the request through your API key. In that case:

  -   Inference is billed through your provider account rather than your Warp usage balance.
  -   Agent Mode prioritizes BYOK over Warp-provided inference.
