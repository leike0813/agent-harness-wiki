  ### Zero data retention (ZDR)

  Warp’s provider Zero Data Retention (ZDR) agreements apply to supported models on every plan when Warp supplies the provider account. See [Privacy and data control](https://docs.warp.dev/support-and-community/privacy-and-security/privacy/#zero-data-retention-zdr) for the policy.

  Some models require provider data retention and aren’t covered by these agreements.
