excerpt: |-
  ### Inference usage

  Your endpoint provider bills endpoint-routed inference according to their pricing, rather than drawing from your Warp usage balance.

  Local endpoint-routed runs on Business and Enterprise still incur [platform charges](https://docs.warp.dev/support-and-community/plans-and-billing/platform-credits/). External inference bills are not fully represented in Warp’s usage totals.

  ### Auto routing uses Warp-provided inference

  Warp’s **Auto** models use Warp-provided inference and consume your available usage, even if you’ve configured an endpoint.
