  heading: Author a router as a file
official_url: "https://docs.warp.dev/agents/inference/custom-routers.md"
excerpt: |-
  Custom routers are stored as YAML files in `~/.warp/custom_model_routers/`, with one router per file. Warp loads every file in that directory and reloads automatically when you add, edit, or remove one, with no restart required. Routers you create in settings are saved here too.
  Routing targets use the same `model_id` values listed on the [Model choice](https://docs.warp.dev/agents/inference/model-choice/#available-models) page. Every target must be a concrete, Warp-supported model. You can’t route to an Auto model, another router, or a model from a [custom inference endpoint](https://docs.warp.dev/agents/inference/custom-inference-endpoint/).
  A complexity router uses `type: complexity`. `default` is required and is used for any bucket you omit:
