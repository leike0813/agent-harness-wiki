excerpt: '**Can I sign in with a Claude subscription?** No. A Claude (Anthropic) consumer subscription can’t be connected to Warp the way a [ChatGPT](https://docs.warp.dev/agents/inference/chatgpt-subscription/) or [SuperGrok](https://docs.warp.dev/agents/inference/grok-subscription/) subscription can. To use your own Anthropic account, add an API key with BYOK and pay Anthropic directly. A subscription and API access are billed separately.'
