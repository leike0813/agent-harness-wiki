excerpt: '| `/fork-from` | Open a searchable menu to [fork the conversation](https://docs.warp.dev/agents/local-agents/interacting-with-agents/conversation-forking/) from a specific query. Select a query to create a fork that includes everything up to that point. |

  | `/handoff` | Hand the current local conversation off to a cloud agent, carrying its history and a snapshot of your uncommitted changes. See [Handoff from local to cloud](https://docs.warp.dev/platform/handoff/local-to-cloud/). You can optionally include a follow-up prompt. `*` |'
