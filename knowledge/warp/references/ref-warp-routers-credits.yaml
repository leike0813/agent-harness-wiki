official_url: "https://docs.warp.dev/agents/inference/custom-routers.md"
excerpt: |-
  A custom router resolves to a concrete model, so credit usage matches whichever model the router selects for each task. See [Credits](https://docs.warp.dev/support-and-community/plans-and-billing/credits/) for how credits are consumed.
  ### Using your own API keys (BYOK)
  Custom routers work with [Bring Your Own API Key (BYOK)](https://docs.warp.dev/agents/inference/bring-your-own-api-key/). After the router resolves a task to a concrete model, Warp applies your API keys to that model — the same as selecting that model directly from the picker. Requests that resolve to a model covered by one of your keys are billed through your provider account and don’t consume Warp credits; requests that resolve to a model without a matching key consume Warp credits as usual.
