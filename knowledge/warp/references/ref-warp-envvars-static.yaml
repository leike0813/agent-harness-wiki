  heading: Static variables
official_url: "https://docs.warp.dev/knowledge-and-collaboration/warp-drive/environment-variables.md"
excerpt: |-
  Static variables are similar to .env files. You create the variables by entering raw strings of text. Each variable has a variable name and a corresponding value.
  ![Saving a static environment variable with name and value pairs.](https://docs.warp.dev/_astro/env-var-static-variable-save.DEikx-Hy_rQPet.webp?dpl=dpl_8fQc7jHAsnEorizNiqpCwthfQCjA)
  After you save the environment variable, you can click it to load it into your terminal session.
  ![Loading a saved static environment variable into the current terminal session.](https://docs.warp.dev/_astro/env-var-static-variable-load.CwOi2SYo_VDUzv.webp?dpl=dpl_8fQc7jHAsnEorizNiqpCwthfQCjA)
  When you use static variables, Warp stores them securely in Warp Drive.
  Note: Static variables should not be used to replace a secret manager.
