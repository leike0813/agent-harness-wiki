excerpt: |-
  Warp has a [SOC 2 Type 2 attestation](https://www.warp.dev/legal/security).

  Warp’s [provider ZDR policy](https://docs.warp.dev/support-and-community/privacy-and-security/privacy/#zero-data-retention-zdr) applies to supported models accessed through Warp’s provider accounts, but not to requests made through your own key.

  Provider-side retention for BYOK depends on your provider account settings. Verify ZDR with your provider for the specific account, model, and configuration. Warp cannot enforce provider ZDR for BYOK.
