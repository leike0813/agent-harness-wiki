excerpt: 'In a [multi-agent orchestration](https://docs.warp.dev/platform/orchestration/), the parent agent and each child agent are separate conversations. Today, in-app notifications fire on the parent’s conversation only: child agent conversations are excluded from the toast stream and the notification mailbox so the mailbox doesn’t get cluttered with per-child status churn.


  That means:


  -   **Toasts and the mailbox** - watch the parent’s conversation for `Complete`, `Request`, and `Error` notifications.'
