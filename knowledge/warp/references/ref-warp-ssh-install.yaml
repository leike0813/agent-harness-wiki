locator:
  kind: document_section
  heading: Installing the SSH extension
official_url: "https://docs.warp.dev/terminal/warpify/ssh.md"
excerpt: |-
  On the first SSH connection to a host that doesn’t already have the SSH extension installed, Warp shows an in-block prompt with two options:
  -   **Install Warp’s SSH extension** - Recommended. Warp downloads the matching remote server extension for the remote OS and architecture, installs it under `~/.warp/remote-server` (or `~/.warp-preview/remote-server` on Preview builds), launches it, and completes the handshake. Subsequent connections to the same host skip the prompt and reuse the installed binary.
  -   **Continue without installing** - Skip installing the extension for this connection. The session continues without the SSH extension, so file tree, native file reads, and native code diffs are unavailable until you install. You can reconnect and install at any time.
