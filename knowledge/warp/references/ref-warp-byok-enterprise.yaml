  heading: BYOK on Business and Enterprise plans
official_url: "https://docs.warp.dev/agents/inference/bring-your-own-api-key.md"
excerpt: |-
  The BYOK described on this page is configured at the **user level** on every plan, including Business and Enterprise. Each team member adds and manages their own API keys locally on their device, and those keys work only for interactive requests, not [cloud agents](https://docs.warp.dev/platform/).
  Enterprise teams can also configure **team-managed API keys** centrally: an admin sets shared keys in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/), and they work for both interactive requests and cloud agents. See [Team-managed API keys and endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) for details, or [contact sales](https://www.warp.dev/contact-sales).
