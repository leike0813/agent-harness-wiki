locator:
  kind: document_section
  heading: Where parent and child agents can run
official_url: "https://docs.warp.dev/platform/orchestration.md"
excerpt: |-
  The parent and child don’t have to run in the same place. Orchestration supports four combinations:
  -   **Local → local** - a [Warp Agent](https://docs.warp.dev/agents/) conversation in the Warp app spawns child Warp Agent conversations on the same machine. Useful for trying orchestration patterns without spinning up cloud infrastructure.
  -   **Local → cloud** - a local parent spawns one or more cloud children that run in [environments](https://docs.warp.dev/platform/environments/) on Warp-hosted or self-hosted infrastructure. The parent keeps working while children execute in parallel.
  -   **Cloud → cloud** - a cloud parent spawns cloud children that each run in their own environment.
