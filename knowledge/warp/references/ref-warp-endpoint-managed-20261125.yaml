excerpt: |-
  ## Centrally managed configuration

  Personal endpoints are configured on each user’s device and work for local Warp Agent runs, not [cloud agents](https://docs.warp.dev/platform/).

  For Warp Terminal and local agents, Business and Enterprise admins can configure [team-managed endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/).

  For Warp Factories, Scale and Enterprise admins configure shared endpoints in the same Admin Panel. For cloud-provider routing under an Enterprise agreement, see [Bring Your Own LLM](https://docs.warp.dev/enterprise/enterprise-features/bring-your-own-llm/).
