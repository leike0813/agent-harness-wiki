  heading: How to change models
official_url: "https://docs.warp.dev/agents/inference/model-choice.md"
excerpt: |-
  You can configure the base model for each [Agent Profile](https://docs.warp.dev/agents/capabilities/agent-profiles-permissions/), alongside the Agent’s autonomy, tool access, and other permissions. The base model is also used for [Planning](https://docs.warp.dev/agents/capabilities/planning/).

  Edit your default profile or any other profile directly in **Settings** > **Agents** > **Profiles**.
