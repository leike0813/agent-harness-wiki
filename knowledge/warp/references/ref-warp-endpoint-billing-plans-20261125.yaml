  ### Warp Terminal and local agents

  Local endpoint-routed runs on Business and Enterprise plans for Warp Terminal and local agents incur [platform charges](https://docs.warp.dev/support-and-community/plans-and-billing/platform-credits/#warp-terminal-and-local-agents). Free, Build, and Max plans for Warp Terminal and local agents do not incur local platform charges.

  ### Warp Factories

  The Scale and Enterprise plans for Warp Factories support team-managed endpoints. Your provider bills inference; Warp’s [platform and hosted-compute charges](https://docs.warp.dev/support-and-community/plans-and-billing/credits/) still apply. A personal endpoint configuration cannot fund or configure a factory run.
