excerpt: |-
  BYOK prompts and responses [pass through Warp’s servers](#how-byok-works). Warp applies your account’s privacy settings to this content, including any settings enforced by your organization.

  In the Warp app, **Help improve Warp** controls analytics and content collection for service improvement. **Store AI conversations in the cloud** controls [cloud storage of your personal Terminal conversations](https://docs.warp.dev/agents/local-agents/cloud-conversations/). See the [analytics and storage controls](https://docs.warp.dev/support-and-community/privacy-and-security/privacy/#provider-retention-analytics-and-storage) for details.
