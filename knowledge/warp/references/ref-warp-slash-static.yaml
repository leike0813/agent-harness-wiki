  heading: Static slash commands
official_url: "https://docs.warp.dev/agents/capabilities/slash-commands.md"
excerpt: |-
  Warp currently supports the following built-in Slash Commands:
  | Slash Command | Description |
  | --- | --- |
  | `/add-mcp` | Add a new [MCP server](https://docs.warp.dev/agents/capabilities/mcp/). |
  | `/add-prompt` | Add a new [Agent Prompt](https://docs.warp.dev/knowledge-and-collaboration/warp-drive/prompts/) in Warp Drive. |
  | `/add-rule` | Add a new [Global Rule](https://docs.warp.dev/agents/capabilities/rules/) for the Agent. |
  | `/agent` | Start a new [agent conversation](https://docs.warp.dev/agents/local-agents/interacting-with-agents/). Optionally include a prompt to send immediately. |
  | `/changelog` | Open the latest Warp [changelog](https://docs.warp.dev/changelog/). |
  | `/cloud-agent` | Start a new [cloud agent conversation](https://docs.warp.dev/platform/). `*` |
