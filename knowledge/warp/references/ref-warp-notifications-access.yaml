excerpt: |-
  ### Notifications
  -   Notifications are enabled by default and require system permissions to appear.
  -   If you’ve turned Notifications off before, toggle it back on by going to **Settings** > **Features** > **Session**, or quickly toggle Notifications with the [Command Palette](https://docs.warp.dev/terminal/command-palette/).
  -   Customize Notification triggers for long-running commands or password prompts by going to **Settings** > **Features** > **Notifications**.
  Note
  On macOS, you will want to **Allow** or **Accept** the request so that Warp can send you desktop notifications. If you accidentally denied it or would like to re-enable Notifications later, check the [troubleshooting guide below](https://docs.warp.dev/terminal/more-features/notifications/#troubleshooting-notifications).
