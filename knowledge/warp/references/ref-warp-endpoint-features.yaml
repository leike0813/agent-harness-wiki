official_url: "https://docs.warp.dev/agents/inference/custom-inference-endpoint.md"
excerpt: |-
  -   **OpenAI-compatible** - Works with any endpoint that implements the OpenAI Chat Completions API.
  -   **Provider flexibility** - Use a model router (OpenRouter, LiteLLM), a model provider with an OpenAI-compatible surface (z.ai), or your own internal gateway exposed at a public URL.
  -   **No AI credits consumed for inference** - Inference is billed directly by your endpoint provider. On Business and Enterprise, local agent runs that route through a custom inference endpoint still consume [platform credits](https://docs.warp.dev/support-and-community/plans-and-billing/platform-credits/) for Warp’s platform infrastructure.
  -   **Local API key storage** - Your endpoint API key is stored **only on your device** (in your OS keychain or equivalent secure storage), never on Warp’s servers.
