  heading: Using environment variables
official_url: "https://docs.warp.dev/knowledge-and-collaboration/warp-drive/environment-variables.md"
excerpt: |-
  There are three ways to invoke your environment variables and load them into a terminal session:
  1.  [Click to load into a current section](https://docs.warp.dev/knowledge-and-collaboration/warp-drive/environment-variables/#click-to-load-into-a-current-session)
  2.  [Click to load into a subshell](https://docs.warp.dev/knowledge-and-collaboration/warp-drive/environment-variables/#click-to-load-into-a-subshell)
  3.  [Select to load in with a workflow](https://docs.warp.dev/knowledge-and-collaboration/warp-drive/environment-variables/#select-to-load-with-a-workflow)
  #### Click to load into a current session
  First, click your environment variable from Warp Drive or the Command Palette.
  Then, review the confirmation block.
