excerpt: |-
  #### Models that require data retention

  This list applies to Warp-managed inference in both Warp Terminal and factory runs.

  Anthropic requires data retention for safety, abuse monitoring, and compliance. This requirement applies to the following models at every effort level:

  -   Claude Fable 5
  -   Claude Fable 5.1
  -   Claude Fable 5.2

  Turning off the **Help improve Warp** toggle doesn’t remove these retention requirements.

  For Enterprise teams, these models are disabled by default and a workspace admin must enable them in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/#models-settings).
