excerpt: '| `/compact` | Free up context by summarizing conversation history. |

  | `/compact-and` | Compact the current conversation and then send a follow-up prompt. |

  | `/continue-locally` | Fork the current cloud agent conversation into a local Warp session. See [Handoff between local and cloud agents](https://docs.warp.dev/platform/handoff/). Available while a cloud agent conversation is active. |

  | `/conversations` | Open [conversation history](https://docs.warp.dev/agents/local-agents/interacting-with-agents/). |

  | `/copy-debugging-id` | Copy debugging information for the current conversation to your clipboard, so you can include it when [reporting an issue](https://docs.warp.dev/support-and-community/troubleshooting-and-support/sending-us-feedback/). Available while a conversation is active. |'
