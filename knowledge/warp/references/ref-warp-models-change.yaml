excerpt: |-
  You can use the model picker in your prompt input to quickly switch between models. The currently active model appears directly in the input editor.
  ![Model selector dropdown showing available models with Intelligence, Speed, and Cost benchmarks](https://docs.warp.dev/_astro/model-selector-dropdown.C5X4qk_B_1dmhsq.webp?dpl=dpl_8fQc7jHAsnEorizNiqpCwthfQCjA)
  Model selector in Warp’s input.
  To change models, click the displayed model name (for example, *Claude Sonnet 5*) to open a dropdown with all supported options. Your selection will automatically persist for future prompts.
