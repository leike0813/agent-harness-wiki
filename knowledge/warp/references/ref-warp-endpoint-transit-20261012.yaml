excerpt: |-
  Personal endpoint configurations are stored on your device, with API keys in secure storage. When you select an endpoint model, your prompt, context, endpoint URL, and key pass through Warp’s servers to your endpoint. Warp does not retain your personal endpoint API key.

  Caution

  Personal endpoint configurations are not available to [cloud runs](https://docs.warp.dev/platform/). Business and Enterprise teams can configure [team-managed endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) for cloud inference; applicable compute and platform charges remain.
