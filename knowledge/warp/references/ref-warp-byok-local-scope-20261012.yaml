excerpt: |-
  Personal API keys are stored in your device’s secure storage. When you select a provider model with a key icon, your prompt, context, and key pass through Warp’s servers to that provider. Warp does not retain your personal API key.

  Caution

  Personal BYOK keys work for local Warp Agent runs, not [cloud runs](https://docs.warp.dev/platform/). Business and Enterprise teams can configure [team-managed API keys and endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/), which Warp stores securely for local and cloud inference.
