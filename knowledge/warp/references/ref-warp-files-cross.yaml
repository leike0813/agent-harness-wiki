excerpt: "Cross-platform (always in your home directory): MCP server config `~/.warp/.mcp.json`, bundled skills `~/.warp/skills/`, agent config `~/.agents/`. Both Stable and Preview share the same `~/.warp/` directory for MCP config and skills, so installing Preview alongside Stable shares the same MCP servers and skills."
