excerpt: 'Track run state transitions in these places:


  -   **The parent’s transcript** - the parent agent receives child state transitions as it runs and reflects them in its own conversation.

  -   **The orchestration pill bar** - in the Warp app, while you’re viewing the parent agent, a horizontal pill bar above the agent view header shows the parent on the left and one pill per child. Each pill displays the child’s name and a status badge that updates live. Click a pill to switch the pane to that child’s conversation in place; click the parent pill to switch back.'
