  heading: File locations by platform
official_url: https://docs.warp.dev/terminal/settings/file-locations.md
excerpt: |-
  **Cross-platform (always in your home directory)**

  -   **MCP server config** - `~/.warp/.mcp.json`
  -   **Bundled skills** - `~/.warp/skills/`
  -   **Agent config** - `~/.agents/`
  -   **Warp Agent CLI install** (install-script default) - `~/.warp/tui/` with a `warp` symlink in `~/.local/bin/`
