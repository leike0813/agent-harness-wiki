  heading: How Warp organizes files
official_url: "https://docs.warp.dev/terminal/settings/file-locations.md"
excerpt: |-
  In addition, a small set of cross-cutting files always live in your home directory on every platform — currently MCP server config and bundled skills. Both Stable and Preview share the same `~/.warp/` directory for these files (Preview does **not** use `~/.warp-preview/` for MCP config or skills, so installing Preview alongside Stable shares the same MCP servers and skills). Other release channels do use a channel-suffixed directory — for example, `~/.warp-oss/` for OSS.

  -   **MCP server config** - `~/.warp/.mcp.json`
  -   **Bundled skills** - `~/.warp/skills/`
  -   **Agent config** - `~/.agents/`
