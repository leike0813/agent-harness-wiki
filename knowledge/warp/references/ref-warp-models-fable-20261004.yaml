excerpt: |-
  Anthropic requires data retention for Claude Fable 5 and Claude Fable 5.1 for safety, abuse monitoring, and compliance reasons, so these models are **not available under Zero Data Retention (ZDR)**. This requirement is specific to the Claude Fable models and doesn’t change the ZDR behavior of any other supported model. For Enterprise teams, these models are off by default and a workspace admin must enable them.
