excerpt: |-
  ## Zero Data Retention (ZDR)

  Warp’s [provider ZDR agreements](https://docs.warp.dev/support-and-community/privacy-and-security/privacy/#zero-data-retention-zdr) don’t apply to requests through your own endpoint. Verify retention with the endpoint provider and any upstream model providers for your specific account, model, and configuration. Warp cannot enforce provider ZDR for these requests.

  Prompts and responses [pass through Warp’s servers](#how-it-works). Warp applies your account’s privacy settings to this content, including any settings enforced by your organization. Review [Warp’s analytics and storage controls](https://docs.warp.dev/support-and-community/privacy-and-security/privacy/#provider-retention-analytics-and-storage) separately from your provider’s retention rules.
