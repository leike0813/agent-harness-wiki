excerpt: |-
  ### BYOK on Business and Enterprise plans

  Personal BYOK is configured on each member’s device, including on Business and Enterprise. Those keys work for local Warp Agent runs in the app or CLI, not [cloud agents](https://docs.warp.dev/platform/).

  For shared keys that work in local and cloud runs, configure [team-managed API keys and endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/) in the [Admin Panel](https://docs.warp.dev/enterprise/team-management/admin-panel/).
