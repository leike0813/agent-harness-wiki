excerpt: |-
  ### Warp Factories teams

  The Scale and Enterprise plans for Warp Factories support [team-managed API keys and endpoints](https://docs.warp.dev/enterprise/enterprise-features/team-managed-keys-and-endpoints/). An admin configures shared credentials in the Admin Panel; these work for factory runs using the Warp Agent. Third-party harnesses use separate [harness credentials](https://docs.warp.dev/factories/harnesses/authentication/).
