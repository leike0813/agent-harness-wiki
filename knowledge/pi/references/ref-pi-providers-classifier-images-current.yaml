excerpt: |-
  Classifier models whose `input` includes `"image"` also judge images passed in `images`; other classifier models return an error for them. … Jev takes PNG and JPEG images, and image input is experimental on TypeSafe's own API. Clef takes PNG, JPEG, and WebP images, at most four per request. Jev from `vercel-ai-gateway` and `opencode` takes text only.

  Each System One service takes images in its own request format, set by the model's `compat.imageInput`. … A custom provider that proxies another service's classifiers sets it in its provider-level `compat` in `models.json`.
