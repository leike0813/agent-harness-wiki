excerpt: "A tool that reaches other tools declares which ones a call may reach with `reachesTools(input)`: `\"all\"`, or the words of the input that may name them, where a word refers to every tool or namespace whose name it contains. `codemode` returns `\"all\"` for scripts that search or list tools and the words of the script otherwise; `tool_search` always returns `\"all\"`. Extensions that register tools late use it from their `tool_call` handler to finish registering the tools a call needs before it runs, as the MCP extension does for servers that are still connecting. The MCP extension also activates `codemode` or `tool_search` for MCP tools only when the tool of that name declares `reachesTools`."
