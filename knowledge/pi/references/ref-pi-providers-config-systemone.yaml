excerpt: |-
  ### `typesafe-system-one`

  Also applies to `cloudflare-workers-ai-system-one`.

  | Field | Type | Default | Description |
  |---|---|---|---|
  | `imageInput` | `"assets" \| "images" \| "state-image-urls"` |  | How the service takes classifier images. … Classifier models read it from the provider-level compat; models and modelOverrides entries apply to chat models only. |
  | `sendImageOptInHeader` | boolean |  | Whether requests with images send the TypeSafe-Danger-Zone-Images: true header … Defaults to true for the typesafe-system-one API unless the model is detected as OpenRouter. |
