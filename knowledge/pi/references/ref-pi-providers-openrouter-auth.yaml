excerpt: "Authenticate with `/login openrouter` or `OPENROUTER_API_KEY`.\n\nWith a key, Pi lists only the OpenRouter chat models that key may use, with the key's context size, max output, and prices. These come from OpenRouter's `/models/user` endpoint and reflect guardrails and provider restrictions set in OpenRouter. Image and classifier models are not filtered."
