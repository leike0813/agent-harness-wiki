excerpt: "### ImageContent\n\n```typescript\ninterface ImageContent {\n  type: \"image\";\n  data: string;\n  mimeType: string;\n}\n```\n\n`data` is base64-encoded image data. `mimeType` identifies its media type, such as `image/png` or `image/jpeg`."
