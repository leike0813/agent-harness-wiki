excerpt: 'Use `/export` to write the current session as HTML or JSONL. Use `/share` to upload it and get a viewer link. Pi uses a Radius artifact when Radius authentication is configured; otherwise, it uses a private GitHub gist.


  Review exported or shared sessions first. They can contain prompts, model responses, tool arguments, command output, file contents, and extension messages.'
