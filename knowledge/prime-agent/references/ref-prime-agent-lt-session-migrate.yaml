excerpt: "/// Migrate entries to the current version; true when a rewrite happened.\npub fn migrate_to_current_version(entries: &mut [FileEntry]) -> bool {\n    let version = entries\n        .iter()\n        .find_map(|entry| match entry {\n            FileEntry::Header { header } => Some(header.version.unwrap_or(1)),\n            _ => None,\n        })\n        .unwrap_or(1);\n    if version >= CURRENT_SESSION_VERSION {\n        return false;\n    }\n    if version < 2 {\n        migrate_v1_to_v2(entries);\n    }\n    if version < 3 {\n        migrate_v2_to_v3(entries);\n    }"
