excerpt: |-
  fn model_inputs(values: Option<&Vec<String>>) -> Vec<ModelInput> {
      values.map_or_else(
          || vec![ModelInput::Text],
          |items| {
              items
                  .iter()
                  .map(|item| match item.as_str() {
                      "image" => ModelInput::Image,
                      "video" => ModelInput::Video,
                      _ => ModelInput::Text,
                  })
                  .collect()
          },
      )
  }
