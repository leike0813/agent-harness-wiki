  /// A [`BilledRow`]'s usage: a model call made outside the agent loop.
  pub(crate) fn fold_billed_row(&mut self, row: Option<BilledRow>) {
      if let Some(row) = row {
          add_assistant_usage(&mut self.billed_row_usage, &row.usage);
      }
  }
