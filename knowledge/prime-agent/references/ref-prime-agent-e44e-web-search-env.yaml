excerpt: |-
  /// The environment variable whose nonblank value overrides the stored key.
  #[must_use]
  pub fn api_key_env(self) -> &'static str {
      match self {
          WebSearchProvider::Serper => "SERPER_API_KEY",
          WebSearchProvider::Eco => "YOU_API_KEY",
      }
  }
