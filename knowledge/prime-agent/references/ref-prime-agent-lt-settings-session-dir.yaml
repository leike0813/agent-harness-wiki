excerpt: "    #[must_use]\n    pub fn get_session_dir(&self) -> Option<std::path::PathBuf> {\n        let session_dir = self.merged.session_dir.as_ref()?;\n        let home = pa_types::platform::home_dir()?;\n        Some(if session_dir == \"~\" {\n            home\n        } else if let Some(rest) = session_dir.strip_prefix(\"~/\") {\n            home.join(rest)\n        } else {\n            session_dir.into()\n        })\n    }"
