official_url: https://github.com/can1357/oh-my-pi/blob/69e8c9e8ccaacd1ac0c917ff4e962d11d7285565/docs/config-usage.md
excerpt: |
  User-level bases:

  - OMP native: `~/<PI_CONFIG_DIR>/agent` (normally `~/.omp/agent`; a named profile changes this as described below)
  - Claude's active config directory (`~/.claude` by default; `CLAUDE_CONFIG_DIR` overrides it)
  - `~/.codex`
  - `~/.gemini`

  Project-level bases:

  - `<cwd>/.omp`
  - `<cwd>/.claude`
  - `<cwd>/.codex`
  - `<cwd>/.gemini`
