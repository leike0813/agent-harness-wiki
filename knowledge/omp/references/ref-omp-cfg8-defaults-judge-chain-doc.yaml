excerpt: "Small typed decisions the app makes about its own state (the `auto` thinking-level difficulty classifier, Smart unexpected-stop detection, git TUI AI staging, and `judge()` eval helper) use the `judge` model role. With a TypeSafe credential, the catalog discovers the account-visible judge roster from `GET /v1/models`—including `jev-latest` and `jev-preview` when advertised, alongside the seeded `jev-1.14.0` the alias-only listing omits—and the role selects an exact catalog model. The built-in judge chain is `typesafe/jev-1.14.0`, `openrouter/typesafe/jev-1.14`, `tiny`, `smol`, `default`, then the active-session model. Once the chain reaches a native System One model (TypeSafe directly or through OpenRouter), it only falls back to other native models: when every native judge fails, the jud…"
