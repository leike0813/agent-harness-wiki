excerpt: "- Both attempt a reconnect + single retry for retriable connection failures before dispatch, such as `Transport not connected`.\n- Connection loss after a request may have reached the server is non-retryable and is never replayed automatically: stdio has written its frame to stdin, or an HTTP or legacy SSE connection was reset or closed after it was established (with or without a response). The operation may already have run; check its effect before retrying. Refused connections are retried."
