excerpt: |
  Supported frontmatter fields on the skill type:

  - `name?: string`
  - `description?: string`
  - `globs?: string[]`
  - `alwaysApply?: boolean`
  - `hide?: boolean`
  - `disableModelInvocation?: boolean` (Agent Skills equivalent of `hide`; normalized from kebab-case `disable-model-invocation`)
  - additional keys are preserved as unknown metadata by conventional scanners
  - `enabled: false` skips a skill in conventional scanners and Skillshare discovery

  `globs` and `alwaysApply` are metadata here, not automatic skill-invocation controls. Agent Plugins packages use stricter Agent Skills validation instead of the permissive scanner: required name/description, directory-name agreement, valid naming, and a closed frontmatter field set. OMP-specific fields such as `hide` and `enabled`
