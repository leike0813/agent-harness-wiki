excerpt: "| `computer.backgroundFallback` | enum | `takeover` | When a window input call's background route is unavailable: `takeover` reruns that one call in takeover, returns focus to the user's app (on macOS even if they kept typing; X11 and Windows run it as plain takeover), and says so in the result; `refuse` fails the call with `BackgroundUnavailable` and takes nothing over. Under `takeover`, a call that passes `takeover` itself is never rerun. Under `refuse`, the model's own `takeover: true`, `raise()`, activating `apps.open`, `control.acquire`, desktop-root input, off macOS `el.focus()`, and on macOS calls that open a menu (right-click, Control-click, `AXShowMenu`, a `menu` option; a press, or a left click, hold or drag, on a popup button or menu button, `setValue` on a popup button) are re…"
