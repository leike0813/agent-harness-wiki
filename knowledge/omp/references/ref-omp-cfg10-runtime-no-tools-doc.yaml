excerpt: |-
  | `--no-tools`               | Restrict the session to the built-in tools named in `--tools` (none without it). Nothing else is loaded: no MCP servers, LSP, extensions (including extension-registered providers and hooks), custom tools, memory backend, auto-learn, Auto-QA or IRC. Subagents inherit the restriction. Goal and plan mode are unavailable. Cannot be combined with `--extension`, `--hook` or `--trusted-extension`. |
