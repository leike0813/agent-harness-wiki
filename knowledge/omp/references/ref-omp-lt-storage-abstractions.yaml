excerpt: '`SessionStorage` owns filesystem-like operations used by `SessionManager`: synchronous directory/existence/write/stat/list operations; async read, sliced read, write, guarded atomic write, rename, unlink, artifact-aware deletion, title update, writer creation, and backend drain. Optional capabilities include synchronous reads, confirmed remote writes, assistant-turn scans, file locking, session ownership claims, and conditional artifact-aware deletion.


  Implementations and adapters:


  - `FileSessionStorage`: real local files

  - `MemorySessionStorage`: map/chunk-backed in-memory storage for non-persistent sessions and tests

  - `IndexedSessionStorage`: shared local index plus ordered remote publication used by Redis/SQL-backed storage'
