excerpt: "| `todo.backend`                 | string  | `native`  | Extension todo backend that the main session's todo list is mirrored to: the `id` an extension registered with `pi.registerTodoBackend()`, picked under Tools → Todos in `/settings`. `native` mirrors nothing. omp keeps the list either way; an id no enabled extension registers is reported as an extension error and changes nothing else. |"
