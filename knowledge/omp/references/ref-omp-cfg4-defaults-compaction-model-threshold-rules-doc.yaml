excerpt: "Per-model compaction triggers replace both `compaction.threshold*` settings for the models they match. The `/models` preview shows each model's trigger; to set one, select a role or fallback row in the **Roles** view and press `k` (or click **Compaction limit**), then type `90000`, `90k`, `1M`, or `80%` (empty input resets). That writes the exact `provider/model-id` key to the global config. By hand:\n\n```yaml\ncompaction:\n  thresholdPercent: 80\n  modelThresholds:\n    \"deepseek/*\": 90000\n    \"openrouter/anthropic/*\": \"60%\"\n    anthropic/claude-opus-5.5: 150000"
