excerpt: "| `lsp.shared`                      | boolean | `true`    | Start language servers through the broker-managed per-project LSP mux. Each connection gets its own server. A released server stays warm for up to 5 minutes for the next connection, but only while another omp process keeps the project's mux running; the mux stops a few seconds after the last one exits. Falls back to private servers when the broker is unavailable. |\n| `lsp.diagnosticsOnWrite`          | boolean | `true`    | Run diagnostics after a write.                                                                                                                              |\n| `lsp.diagnosticsOnEdit`           | boolean | `false`   | Run diagnostics after an edit.                                                               …"
