excerpt: "| `tui.vimShowCommand`           | boolean | `true`          | Echo a half-typed Vim command in the status line, like Vim's `showcmd`, even when the mode indicator is hidden.                                                                                                                                             |\n| `tui.vimYankToClipboard`       | boolean | `false`         | Copy every Vim yank to the system clipboard, as in Vim with `clipboard=unnamed`; off, only `\"+y` / `\"*y` do."
