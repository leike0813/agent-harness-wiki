excerpt: '- Uses `workers-ai-systemone`: Cloudflare''s Clef decision models take the System One body at `POST https://api.cloudflare.com/client/v4/accounts/<account>/ai/run/@cf/cloudflare/<model>`. `<account>` resolves per request from the stored credential''s account ID, else `CLOUDFLARE_ACCOUNT_ID`. `judgment-questions-max` caps a request at 64 questions (`providers/judgment-questions.kdl`).'
