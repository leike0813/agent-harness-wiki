excerpt: "| `--no-judge`                 | Run judge-role calls only on the active model's provider; with no active model, nothing is judged.                         |\n| `--no-spotlight`             | Send no Spotlight requests, unless the active model's provider is `stencil` and `spotlight.url` is the default.           |\n| `--offline`                  | Both of the above, and keep memories, titles, commit messages, subagents, fallback models, web search, speech and image generation on the active model's provider; a feature with no model there is skipped or fails. Not a network firewall: MCP servers and web fetches still go out. |"
