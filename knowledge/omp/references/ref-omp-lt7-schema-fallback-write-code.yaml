  	appendModelChange(model: string, role?: string, options?: { fallback?: ModelFallbackCause }): string {
  		const entry: ModelChangeEntry = {
  			type: "model_change",
  			...this.#freshEntryFields(),
  			model,
  			role,
  			resolvedModelIsFallback: options?.fallback !== undefined,
