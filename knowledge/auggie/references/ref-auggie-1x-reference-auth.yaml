official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie auth login [--headless]` | Log in to Augment and store the session locally |
  | `auggie auth logout` | Remove the local session |
  | `auggie auth status` | Show the current authentication status |
  | `auggie token print` | Print the current session JSON for automation |
  | `auggie token revoke` | Revoke tokens for the current user and remove the local session |
  | `auggie --augment-session-json <json-or-path>` | Authenticate with inline session JSON or a session file |
