official_url: "https://docs.augmentcode.com/cli/subagents.md"
excerpt: |-
  | `max_turns` | No | Maximum number of turns before the agent stops |
  | `replace_system_prompt` | No | `true` to use the prompt body as the whole system prompt instead of appending it. Default `false` |
  | `skills` | No | Names of the skills to load for the agent. Defaults to all skills |
  | `disable_skills` | No | `true` to load no skills |
  | `disable_rules` | No | `true` to skip rules |
  | `isolation` | No | `worktree` to run the agent in a separate git worktree |
  | `run_in_background` | No | `true` to run the agent in the background by default |
  | `enabled` | No | `false` to turn the agent off without deleting the file |
