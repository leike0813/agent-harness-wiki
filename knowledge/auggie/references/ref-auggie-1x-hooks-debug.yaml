  heading: Viewing Hook Execution Logs
official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  Hooks log to the Augment logger. To see hook execution details:
  auggie --log-level debug "your prompt here"
  Use `--log-file <path>` to choose where the log is written. Hook log lines use the `pi-hooks` prefix.
  Run `/hooks` in interactive mode to see the configured hooks and any configuration problems.
