excerpt: "Runs when the agent stops responding, whether from normal completion or user interrupt. The `agent_stop_cause` field indicates why the agent stopped (e.g., `\"end_turn\"` or `\"interrupted\"`). Can block the agent from stopping (useful for requiring tests before completion)."
