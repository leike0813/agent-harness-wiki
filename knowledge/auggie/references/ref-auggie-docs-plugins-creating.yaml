excerpt: |-
  A marketplace is a GitHub repository that hosts one or more plugins. Anyone can create and share their own marketplace.
  ### Marketplace Structure
  ```
  my-marketplace/
  ├── .augment-plugin/
  │   └── marketplace.json
  ├── plugins/
  │   ├── hello-commands/
  │   │   ├── .augment-plugin/
  │   │   │   └── plugin.json
  │   │   └── commands/
  │   │       └── hello.md
  │   ├── code-guard/
  │   │   ├── .augment-plugin/
  │   │   │   └── plugin.json
  │   │   └── hooks/
  │   │       ├── hooks.json
  │   │       └── check.py
  │   └── full-example/
  │       ├── .augment-plugin/
  │       │   └── plugin.json
  │       ├── commands/
  │       ├── agents/
  │       ├── rules/
  │       ├── hooks/
  │       └── .mcp.json
  └── README.md
  ```
