excerpt: |-
  | Field | Required | Purpose |
  | :- | :- | :- |
  | `name` | No | Name of the agent. Defaults to the filename without `.md` |
  | `description` | No | Description of the agent, used to decide when to delegate to it |
  | `color` | No | Label color: `red`, `blue`, `green`, `yellow`, `orange`, `purple`, `pink`, or `cyan` |
  | `model` | No | Model to use for the agent. If not specified, the current model is used |
  | `thinking` | No | Reasoning effort for the agent's model |
  | `tools` | No | Built-in tools the agent can use (allowlist). See [Tool restrictions](#tool-restrictions) |
  | `disabled_tools` | No | Tools the agent cannot use (denylist) |
