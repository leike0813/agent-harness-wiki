  heading: Invoking Skills
official_url: "https://docs.augmentcode.com/cli/skills.md"
excerpt: |-
  In interactive mode, every discovered skill is registered as a slash command named `/skill:<name>`. If you have a skill at `.augment/skills/my-skill/SKILL.md`, run it by typing:
  ```
  /skill:my-skill
  ```
  Any text after the command is passed to the skill along with its instructions:
  ```
  /skill:my-skill focus on the payments module
  ```
  Type `/skill:` to see the available skills and their descriptions in the autocomplete list. To turn off skill commands, set `enableSkillCommands` to `false` in `settings.json`.
  You don't have to invoke a skill yourself. The agent sees each skill's name and description and loads the full `SKILL.md` when a task matches.
