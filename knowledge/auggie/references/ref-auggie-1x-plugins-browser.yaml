excerpt: |-
  The plugin browser has three tabs. Press `Tab` or the left and right arrow keys to switch tabs, and type to filter.
  **Plugins Tab**
  * View available plugins from your installed marketplaces
  * Press `Space` to enable or disable a plugin
  * Press `Enter` to see plugin details, including whether it's enabled and any problems loading it
  **Marketplace Tab**
  * View installed plugin marketplaces
  * Add new marketplaces from GitHub repositories
  * Browse plugins within each marketplace
  **Errors Tab**
  * View problems found while loading marketplaces and plugins
