  heading: Create a subagent with the wizard
official_url: "https://docs.augmentcode.com/cli/subagents.md"
excerpt: |-
  1. Run the `/agents` command in interactive mode
  2. Select "Create new agent"
  3. Select where you want the agent configuration to be stored: the project (`.augment/agents/`) or your user directory (`~/.augment/agents/`)
  4. Choose a creation method:
     * **Generate with Auggie**: Describe what the agent should do and give it a name. Auggie writes the configuration for you.
     * **Manual configuration**: Enter the name, description, tools, model, thinking level, and prompt yourself.
  `/agents` also lists running agents and available agent types.
