official_url: "https://docs.augmentcode.com/cli/automation/overview.md"
excerpt: |-
  Session tokens are associated with the user that created it, and Auggie will run with integration configurations from that user. See [Authentication](https://docs.augmentcode.com/cli/setup-auggie/authentication.md) for full details.
  ```sh theme={null}
  # First, login to Augment with the CLI
  auggie auth login
  # Next, print your current session details
  auggie token print
  # Then, pass the session JSON to auggie
  AUGMENT_SESSION_AUTH='<session-json>' auggie --print "Summarize the build failure"
  ```
