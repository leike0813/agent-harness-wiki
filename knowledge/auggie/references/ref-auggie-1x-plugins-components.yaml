  Slash commands are Markdown files in the `commands/` directory. The command name combines the plugin name, marketplace name, and filename. For example, `hello.md` in the `hello-commands` plugin from `my-marketplace` creates `/hello-commands--my-marketplace:hello`:
  Specialized agents in the `agents/` directory that Auggie can invoke for specific tasks:
  Event handlers that respond to Auggie events. Configure in `hooks/hooks.json`:
  Model Context Protocol integrations defined in `.mcp.json` or within `plugin.json`:
