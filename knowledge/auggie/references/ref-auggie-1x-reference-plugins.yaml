  heading: Plugins and extensions
official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | `auggie plugin marketplace add <source>` | Add a plugin marketplace from a repository or URL |
  | `auggie --plugin-dir <path>` | Load and enable plugins from a local marketplace directory (repeatable) |
  | `auggie install <source> [-l]` | Install an extension package and add it to settings (`-l` for project settings) |
  | `auggie remove <source> [-l]` | Remove an extension package from settings |
  | `auggie --extension <path>` (`-e`) | Load an extension file for this run (repeatable) |
  Auggie 1.x is built on [pi](https://github.com/earendil-works/pi), so [pi extensions](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/extensions.md) should work in Auggie. Install them with `auggie install` instead of `pi install`.
