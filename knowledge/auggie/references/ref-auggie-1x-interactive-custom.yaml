  heading: Custom and skill slash commands
official_url: "https://docs.augmentcode.com/cli/interactive.md"
excerpt: |-
  In addition to the built-in commands above, the slash menu also lists:
  * Your [custom slash commands](https://docs.augmentcode.com/cli/custom-commands.md). For example, `.augment/commands/deploy-staging.md` becomes `/deploy-staging`.
  * Your discovered [skills](https://docs.augmentcode.com/cli/skills.md). For example, a skill at `.augment/skills/my-skill/SKILL.md` becomes `/skill:my-skill`.
  Built-in slash commands take precedence over custom commands or skills with the same name, so choose names that do not collide with the commands listed above.
