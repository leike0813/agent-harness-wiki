locator:
  kind: document_section
  heading: Built-in slash commands take precedence
official_url: "https://docs.augmentcode.com/cli/skills.md"
excerpt: "If a discovered skill's directory name matches a built-in slash command (for example, `/help`, `/model`, `/skills`, or another command listed under [Interactive Mode Slash Commands](/cli/interactive#slash-commands)), the built-in command runs instead of the skill. To make a skill reachable as a slash command, choose a directory name that does not collide with an existing built-in command."
