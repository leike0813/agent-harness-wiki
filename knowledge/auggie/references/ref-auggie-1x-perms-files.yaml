official_url: "https://docs.augmentcode.com/cli/permissions.md"
excerpt: |-
  Tool permissions are configured in `settings.json`. The Auggie CLI and Cosmos cloud agents read these files:
  | File | Scope |
  | :- | :- |
  | `/etc/augment/settings.json` (`C:\ProgramData\augment\settings.json` on Windows) | Managed settings set by an administrator. |
  | `.augment/settings.local.json` | Personal project settings that are not committed. |
  | `.augment/settings.json` | Repo-level settings committed to the project, applied to any agent running in that repo. |
  | `~/.augment/settings.json` | Personal settings that apply to all your projects (user/home). |
  Run `/permissions` in interactive mode to see the active rules from every source and to add, edit, or remove rules.
