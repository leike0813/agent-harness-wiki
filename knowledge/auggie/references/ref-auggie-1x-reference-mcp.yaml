excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie mcp add [options] <name>` | Create or update a named MCP server configuration (`--project` or `--local` to choose the settings file) |
  | `auggie mcp add-json <name> <json>` | Add an MCP server from JSON configuration |
  | `auggie mcp list` | Display all configured MCP servers |
  | `auggie mcp remove <name>` | Remove a named MCP server configuration |
  | `auggie --mcp-config <json-or-path>` | Load MCP server configuration from inline JSON or a file (repeatable) |
  > `--mcp-config` overrides MCP servers defined in settings files.
