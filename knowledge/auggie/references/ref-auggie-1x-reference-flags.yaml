official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie` | Start Auggie in interactive mode |
  | `auggie --print "Summarize the staged changes"` (`-p`) | Run one instruction in print mode and exit |
  | `auggie --print --mode stream "Summarize the staged changes"` | Stream text and tool activity as it happens |
  | `auggie --print --mode json "Summarize the staged changes"` | Output structured JSON events for automation workflows |
  | `auggie --print --show-cost "Summarize the staged changes"` | Include cost and credit usage in the output |
  | `auggie --acp` | Run Auggie as an [ACP](https://docs.augmentcode.com/cli/acp/agent.md) agent for compatible editors and clients |
