  heading: Disabling Automatic Updates
official_url: "https://docs.augmentcode.com/cli/autoupgrade.md"
excerpt: |-
  You can disable automatic updates in either of two ways:
  * Set `"autoUpdate": false` in `~/.augment/settings.json` (persistent, per-user).
  * Set the `AUGMENT_DISABLE_AUTO_UPDATE` environment variable to `1` (recommended for scripts and CI).
  ### Settings File
  ```json theme={null}
  {
    "autoUpdate": false
  }
  ```
