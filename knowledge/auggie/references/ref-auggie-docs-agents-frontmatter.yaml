  heading: Frontmatter configuration
official_url: "https://docs.augmentcode.com/cli/subagents.md"
excerpt: |-
  | Field | Required | Purpose |
  | :- | :- | :- |
  | **`name`** | **Yes** | **Name of the agent** |
  | `description` | No | Description of the agent |
  | `color` | No | Color of the agent in the CLI, should be a valid ANSI color name. |
  | `model` | No | Model to use for the agent. If not specified, the CLI default model is used. |
  | `tools` | No | List of tool names that this subagent is allowed to use (allowlist). Only these tools will be available. Cannot be used with `disabled_tools`. |
  | `disabled_tools` | No | List of tool names that this subagent is NOT allowed to use (denylist). All tools except these will be available. Cannot be used with `tools`. |
