excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie --model "name"` | Select the model. Append `:<effort>` to set the reasoning effort, for example `sonnet:high` |
  | `auggie --thinking <effort>` | Set the reasoning effort. Use `default` to clear the override |
  | `auggie --models <patterns>` | Comma-separated model patterns to cycle through |
  | `auggie model list [search]` | List available models (`--json` for full metadata) |
