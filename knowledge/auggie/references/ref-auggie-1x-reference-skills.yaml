excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie --rule <path>` | Load a rule file or directory (repeatable) |
  | `auggie --no-rules` | Disable rule discovery |
  | `auggie --skill <path>` | Load a skill file or directory (repeatable) |
  | `auggie --no-skills` | Disable skill discovery |
  | `auggie --prompt-template <path>` | Load a prompt template file or directory (repeatable) |
  | `auggie --theme <path>` | Load a theme file or directory (repeatable) |
  > Skills are loaded automatically from `.augment/skills/` and `.claude/skills/` directories in both your workspace and home directory.
