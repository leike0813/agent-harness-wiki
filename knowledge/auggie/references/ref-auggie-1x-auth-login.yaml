official_url: "https://docs.augmentcode.com/cli/setup-auggie/authentication.md"
excerpt: |-
  You can login by running the following command and following the prompts. Use `--headless` on machines without a browser.
  ```sh theme={null}
  auggie auth login
  ```
  You can also run `/login` from interactive mode. If you are not signed in, Auggie shows a login screen when it starts.
  > In Auggie 1.x, `auggie auth login` and `auggie auth logout` are replaced by `auggie auth login` and `auggie auth logout`.
