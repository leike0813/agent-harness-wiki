  heading: Manage MCP servers with the Auggie CLI
official_url: "https://docs.augmentcode.com/cli/integrations.md"
excerpt: |-
  You can add and inspect MCP servers with Auggie subcommands. By default, they save the configuration to your `~/.augment/settings.json` file. Pass `--project` to use `.augment/settings.json` or `--local` to use `.augment/settings.local.json` in the current project.
  * `-c, --command <path>` - Executable path (for stdio transport)
  * `-e, --env <KEY=VAL>` - Environment variable (repeatable)
  * `-t, --transport <transport>` - stdio|sse|http (default: "stdio")
  * `-u, --url <url>` - URL (required for --transport sse or http)
  * `-H, --header <KEY:VAL>` - HTTP header (repeatable, for http and sse transports)
  * `--project` - Save to project settings (`.augment/settings.json`)
  * `--local` - Save to local settings (`.augment/settings.local.json`)
