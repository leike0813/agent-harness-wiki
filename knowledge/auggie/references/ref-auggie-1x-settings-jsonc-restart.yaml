excerpt: |-
  Some commands still write to project or local settings when you ask them to, for example `auggie mcp add --project` or `auggie mcp add --local`.
  The files support JSON with Comments (JSONC), so comments and trailing commas are allowed. After editing a file manually, restart Auggie for the changes to take effect.
