  heading: PostToolUse Output
official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  PostToolUse hooks can provide additional context to the agent. `reason` and `additionalContext` are appended to the tool's result, so the agent reads them together with the tool output:
  | Field | Type | Description | Destination |
  | :-: | - | :-: | - |
  | `decision` | `"block"` | Sends `reason` to the agent. The tool has already run and is not undone; the agent is not stopped | - |
  | `reason` | string | Feedback for the agent (used when decision="block") | Agent |
  | `additionalContext` | string | Additional context for the agent to consider | Agent |
