  heading: Available options
official_url: "https://docs.augmentcode.com/cli/settings.md"
excerpt: |-
  ### General
  | Option | Setting | Description |
  | :- | :- | :- |
  | Auto-compact | `compaction.enabled` | Automatically summarize the conversation when the context window fills up |
  | Double-escape action | `doubleEscapeAction` | What pressing `Escape` twice does: `tree`, `fork`, or `none` |
  | Skill commands | `enableSkillCommands` | Register skills as `/skill:name` commands |
  | MCP tool discovery | `disableToolSearch` | Turn off automatic MCP tool discovery, which hides MCP tools behind `find-tool` and `execute-tool` when their definitions take up too much context. Appears only when automatic discovery is available |
