locator:
  kind: document_section
  heading: Settings File Locations
official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  Settings are listed below from **highest to lowest precedence**:
  | Location | Platform | Supported By | Description |
  | :- | :- | :- | :- |
  | `/etc/augment/settings.json` | Linux/macOS | CLI, VSCode, IntelliJ | System-wide settings for enterprise/admin policies (immutable) |
  | `C:\ProgramData\Augment\settings.json` | Windows | CLI, VSCode, IntelliJ | System-wide settings for enterprise/admin policies (immutable) |
  | `<workspace>/.augment/settings.local.json` | All | CLI | Personal project overrides — not committed to source control |
  | `<workspace>/.augment/settings.json` | All | CLI | Shared project settings — committed to source control |
  | `~/.augment/settings.json` | All | CLI, VSCode, IntelliJ | User-level settings (lowest precedence) |
  <Note>
