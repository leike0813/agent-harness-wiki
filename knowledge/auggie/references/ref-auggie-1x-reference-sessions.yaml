official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | `auggie --resume` (`-r`) | Interactively choose a saved session to resume |
  | `auggie --session-dir <dir>` | Directory for session storage and lookup |
  | `auggie --no-session` | Do not save the session |
  | `auggie --export <session.jsonl> [output.html]` | Export a session file to HTML and exit |
  | `auggie session list` | List saved sessions from the current workspace (`--all`, `--json`, `-n <number>`) |
  | `auggie session stats [sessionId]` | Show session statistics, including cost and credit usage |
  Resuming a session restores its `--permission` and `--add-workspace` values unless you pass them again.
