  heading: Common Fields (All Events)
official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  These fields are present in **every** hook event:
  | Field | Type | Description |
  | :- | :- | :- |
  | `hook_event_name` | string | The type of event: `"PreToolUse"`, `"PostToolUse"`, `"Stop"`, `"SessionStart"`, `"SessionEnd"`, `"PromptSubmit"`, `"Notification"` |
  | `hook_type` | string | Same value as `hook_event_name` |
  | `cwd` | string | The session's working directory |
  | `conversation_id` | string | Unique identifier for the current conversation |
  | `workspace_roots` | string\[] | List of workspace root directories (usually contains one path) |
