excerpt: |-
  Cursor-style event names are also accepted and mapped to Auggie events: `beforeShellExecution`, `beforeReadFile`,
  and `beforeMCPExecution` run as PreToolUse; `afterShellExecution`, `afterFileEdit`, and `afterMCPExecution` run
  as PostToolUse; `stop` runs as Stop.
