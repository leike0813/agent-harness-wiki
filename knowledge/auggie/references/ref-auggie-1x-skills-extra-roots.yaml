excerpt: |-
  You can also load skills from other paths:
  * Pass `--skill <path>` to load a skill file or directory for one run. Repeat the flag to add more.
  * Add paths to the `skills` array in [`settings.json`](https://docs.augmentcode.com/cli/settings).
  * Use `--no-skills` to turn off discovery. Skills passed with `--skill` still load.
