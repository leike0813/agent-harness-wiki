  heading: Limitations
official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  * PreToolUse and PostToolUse hooks run one at a time, in order; if a hook blocks the tool, later hooks for that call do not run. Other events run their hooks at the same time
  * **Timeout**: 60-second execution limit by default, configurable per command
  * **Execution order**: Hooks execute in the order they are defined
