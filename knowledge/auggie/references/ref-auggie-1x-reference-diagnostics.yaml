official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie --log-file <path>` | Write logs to the given file. Defaults to a temp file |
  | `auggie --log-level <level>` | Set the log level: `error`, `warn`, `info` (default), or `debug` |
  | `auggie --verbose` | Show the startup header even if `quietStartup` is set |
  | `auggie --offline` | Disable startup network operations |
  | `auggie --check-startup` | Boot, print startup diagnostics as JSON, and exit |
