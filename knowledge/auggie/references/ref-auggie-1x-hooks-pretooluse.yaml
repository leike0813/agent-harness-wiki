excerpt: |-
  > If a PreToolUse hook times out or crashes, the tool still runs. Only exit code 2 or a `deny` decision blocks it.
  > Keep security hooks fast and make them fail closed: exit with code 2 when they can't reach a decision.
  > Tool names changed in Auggie 1.x. Matchers that use 0.x names such as `launch-process`, `view`, `str-replace-editor`, or `save-file` still match the new tools for now, and `/hooks` flags them. Update matchers to the new names.
