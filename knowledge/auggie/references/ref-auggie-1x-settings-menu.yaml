  heading: The `/settings` menu
official_url: "https://docs.augmentcode.com/cli/settings.md"
excerpt: |-
  The `/settings` slash command opens an interactive menu for common options. It replaces the `/config` command from Auggie 0.x.
  Type to filter the list, use the arrow keys to move, and press `Enter` to change a value. Press `Escape` to go back.
  Changes made in `/settings` are always saved to your user settings file, `~/.augment/settings.json` (`C:\Users\<username>\.augment\settings.json` on Windows). Auggie 1.x does not prompt you to choose a settings file. To change project or local settings, edit those files directly.
