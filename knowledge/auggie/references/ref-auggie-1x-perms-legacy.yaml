locator:
  kind: document_section
  heading: Legacy Tool Names
official_url: "https://docs.augmentcode.com/cli/permissions.md"
excerpt: |-
  | Legacy name | Current name | Description |
  | :- | :- | :- |
  | `launch-process`, `shell` | `bash` | Execute shell commands |
  | `view` | `read` | Read file contents |
  | `str-replace-editor`, `str_replace_editor` | `edit` | Edit files with find/replace |
  | `save-file`, `save_file` | `write` | Create or overwrite files |
  | `grep-search` | `grep` | Search file contents |
  > Only the legacy names in this table are recognized by permission rules. Other legacy names, such as `read_file`, `launch_process`, or `file_search`, are not matched, so a rule using them will not apply.
