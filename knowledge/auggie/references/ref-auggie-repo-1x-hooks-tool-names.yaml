excerpt: |-
  ### Hook Tool Names Changed (With Temporary Backward Compatibility)
  Tool names have been standardized to short, canonical verbs across Auggie 1.x.
  > **Note on Compatibility**: Temporary backward compatibility is provided in 1.x. **Hook matchers** using any legacy name above (e.g. `matcher: "str-replace-editor"`) continue to trigger for the canonical 1.x tools during the preview period.
