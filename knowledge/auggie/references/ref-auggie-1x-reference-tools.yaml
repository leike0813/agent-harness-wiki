official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie --tools read,bash,edit,write` | Enable only the listed built-in tools (`read`, `bash`, `edit`, `write`, `grep`, `find`, `ls`) |
  | `auggie --no-tools` | Disable all built-in tools |
  | `auggie --remove-tool <tool-name>` | Remove a tool by name for the current session (repeatable) |
  | `auggie --permission bash:ask-user` | Set a tool permission rule for the current run (repeatable) |
  | `auggie --enable-tool-search` | Hide individual MCP tools behind `find-tool` and `execute-tool` |
