  heading: Common settings
official_url: "https://docs.augmentcode.com/cli/settings.md"
excerpt: |-
  | Setting | Description |
  | :- | :- |
  | `defaultModel` | Default model for new sessions |
  | `defaultThinkingLevel` | Default reasoning effort: `off`, `minimal`, `low`, `medium`, `high`, or `xhigh` |
  | `theme` | Color theme |
  | `shellPath` | Shell used by the `bash` tool: a full path, or `bash`, `zsh`, `fish`, `sh`, or `powershell`. `shell` (the 0.x name) still works |
  | `shellCommandPrefix` | Shell code run before every `bash` tool command, for example `source ~/.augment/startup.sh`. It's shell text, not a file path. `startupScript` (the 0.x name) still works |
  | `notificationMode` | Notify when the agent finishes or asks a question: `off`, `bell`, or `desktop_notification` |
