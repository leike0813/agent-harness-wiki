excerpt: |-
  Auggie 1.x ships with `dark`, `light`, and `ansi` themes. Use `ansi` if your terminal does not support true color. The legacy `default-dark` value from 0.x is treated as `dark`.
  ```json theme={null}
  {
    "theme": "ansi"
  }
  ```
