  heading: Custom commands vs. skills
official_url: "https://docs.augmentcode.com/cli/custom-commands.md"
excerpt: |-
  Custom slash commands and [skills](/cli/skills) are separate features that share the same `/<name>` invocation surface in interactive mode:
  | Feature | Stored in | Purpose |
  | :- | :- | :- |
  | **Custom slash commands** | `.augment/commands/<name>.md` (and Claude / Agents equivalents) | Reusable prompts and workflows you trigger with `/<name>` |
  | **Skills** | `.augment/skills/<name>/SKILL.md` (and Claude / Agents equivalents) | Domain-specific knowledge packages following the [agentskills.io](https://agentskills.io) specification, also invocable directly with `/<skill-name>` |
  Both appear in the slash-command menu in interactive mode.
