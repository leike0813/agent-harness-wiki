excerpt: |-
  ### Shell
  | Tool | Description |
  | :- | :- |
  | `bash` | Execute shell commands. Takes a `command` input and is matched by `shellInputRegex` against that command. |
  > The shell is exposed as a single tool, **`bash`**. A rule on `bash` gates all shell commands.
  ### File Operations
  | Tool | Description |
  | :- | :- |
  | `read` | Read file contents |
  | `edit` | Edit files with find/replace |
  | `write` | Create or overwrite files |
  | `grep` | Search file contents with regex patterns |
  | `find` | Find files matching glob patterns |
  | `ls` | List directory contents |
