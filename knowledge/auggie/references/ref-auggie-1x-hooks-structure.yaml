official_url: "https://docs.augmentcode.com/cli/hooks.md"
excerpt: |-
  | Field | Description |
  | :- | :- |
  | `matcher` | Pattern to match tool names (case-insensitive). Supports regex patterns. Optional for `PreToolUse` and `PostToolUse` (defaults to `".*"` to match all tools). Not used for other events. |
  | `type` | Hook execution type - currently only `"command"` is supported. |
  | `command` | Command to run: a script path or any command line (for example `python3 ~/.augment/hooks/check.py`). Run through the system shell. |
  | `args` | *(Optional)* Argument list. When set, `command` is run directly with these arguments, without a shell. See [Running a program with `args`](#running-a-program-with-args). |
  | `timeout` | *(Optional)* Timeout in milliseconds (default: 60000ms). |
