official_url: "https://docs.augmentcode.com/cli/config.md"
excerpt: |-
  Configuration changes made through the Configuration Wizard are saved to `~/.augment/settings.json` on macOS and Linux, and `C:\Users\<username>\.augment\settings.json` on Windows.
  If you have project settings (`<workspace>/.augment/settings.json`), you will be prompted where to save the configuration. See [Hierarchical Settings File](#hierarchical-settings-file) for more details.
  ### Hierarchical Settings File
  Auggie also supports hierarchical settings files to allow you to configure settings at different levels of granularity. This lets you define shared settings in project settings while individual developers add their own user or local project settings without replacing the shared configuration.
  1. **Managed settings** (read-only)
     * `/etc/augment/settings.json` on macOS and Linux
