  heading: Skill File Structure
official_url: "https://docs.augmentcode.com/cli/skills.md"
excerpt: |-
  Skills are defined in `SKILL.md` files located in the `.augment/skills/`, `.claude/skills/`, or `.agents/skills/` directories (in either your workspace or home directory). Each skill must be in its own subdirectory:
  ```
  .augment/skills/
    ├── python-testing/
    │   └── SKILL.md
    ├── api-design/
    │   └── SKILL.md
    └── database-migrations/
        └── SKILL.md
  ```
  ### SKILL.md Format
  Each `SKILL.md` file must include YAML frontmatter with required metadata:
  **Example SKILL.md file:**
  ```markdown theme={null}
  ---
  name: python-testing
  description: Best practices for writing and running Python tests with pytest
  ---
