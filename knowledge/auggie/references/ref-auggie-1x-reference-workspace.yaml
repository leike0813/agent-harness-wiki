official_url: "https://docs.augmentcode.com/cli/reference.md"
excerpt: |-
  | Command | Description |
  | :- | :- |
  | `auggie --workspace-root /path/to/project` (`-w`) | Specify the root of the workspace (defaults to the git root) |
  | `auggie --add-workspace /path/to/another/project` | Index an additional workspace alongside the primary workspace (repeatable) |
  | `auggie --discover-workspaces[=depth]` | Discover git repositories under a non-git workspace root |
  | `auggie --worktree [slug]` | Create or reuse a git worktree for this session |
  | `auggie --augment-cache-dir /path/to/dir` | Relocate the Augment config and cache directory (default `~/.augment`) |
