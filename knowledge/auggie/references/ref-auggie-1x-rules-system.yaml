  heading: System prompt files
official_url: "https://docs.augmentcode.com/cli/rules.md"
excerpt: |-
  Two more files change the system prompt itself:
  | File | Effect |
  | :- | :- |
  | `.augment/APPEND_SYSTEM.md` or `~/.augment/APPEND_SYSTEM.md` | Appended to Auggie's default system prompt |
  | `.augment/SYSTEM.md` or `~/.augment/SYSTEM.md` | Replaces Auggie's default system prompt |
  The project file is used when it exists; otherwise the user file is used. Rules and `AGENTS.md` files are still added when you use `SYSTEM.md`.
