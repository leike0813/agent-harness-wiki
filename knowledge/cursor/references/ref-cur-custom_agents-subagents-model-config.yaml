excerpt: |-
  The `model` field controls which model a subagent uses. There are two options:

  | Value               | Behavior                                                                                                                                                              |
  | :------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | `inherit`           | Uses the same model as the parent agent. This is the default.                                                                                                         |
