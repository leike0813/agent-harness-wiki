official_url: https://cursor.com/docs/cli/reference/permissions.md
excerpt: |-
  Add permissions to the `permissions` object in your CLI configuration file:
  
  ```json
  {
    "permissions": {
      "allow": [
        "Shell(ls)",
        "Shell(git)",
        "Read(src/**/*.ts)",
        "Write(package.json)",
        "WebFetch(docs.github.com)",
        "WebFetch(*.github.com)",
        "Mcp(datadog:*)"
      ],
      "deny": [
        "Shell(rm)",
        "Read(.env*)",
        "Write(**/*.key)",
        "WebFetch(malicious-site.com)"
      ]
    }
  }
  ```
