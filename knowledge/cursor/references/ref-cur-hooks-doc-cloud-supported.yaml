  heading: "Supported hooks"
official_url: https://cursor.com/docs/hooks.md
excerpt: |2-
  The following hooks run in cloud agents:

  | Hook                   | Supported |
  | ---------------------- | --------- |
  | `beforeShellExecution` | Yes       |
  | `afterShellExecution`  | Yes       |
  | `beforeReadFile`       | Yes       |
  | `afterFileEdit`        | Yes       |
  | `preToolUse`           | Yes       |
  | `postToolUse`          | Yes       |
  | `postToolUseFailure`   | Yes       |
  | `subagentStart`        | Yes       |
  | `subagentStop`         | Yes       |
  | `beforeSubmitPrompt`   | Yes       |
  | `preCompact`           | Yes       |
  | `afterAgentResponse`   | Yes       |
  | `afterAgentThought`    | Yes       |
  | `stop`                 | Yes       |
