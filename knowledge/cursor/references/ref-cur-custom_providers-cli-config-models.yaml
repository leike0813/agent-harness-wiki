excerpt: |-
  You can select a model for the CLI using the `/model` slash command.

  ```bash
  /model auto
  /model gpt-5
  /model sonnet-4-thinking
  ```

  See the [Slash commands](https://cursor.com/docs/cli/reference/slash-commands.md) docs for other commands.
