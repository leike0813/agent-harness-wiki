  heading: "MCP Allowlist"
official_url: https://cursor.com/docs/mcp.md
excerpt: |-
  Enterprise admins can control which MCP servers users may run from the Cursor dashboard. Open [Team Settings > MCP Configuration](https://cursor.com/dashboard/team-settings?view=mcp-configuration) to configure which servers and tools the team may run. The Plugins & MCPs page also links here. Allowlisting approves an MCP configuration. It does not distribute or install the server.

  Use the MCP Allowlist to define approved servers:

  - **Command entries** approve local `stdio` MCP servers by command pattern.
  - **URL entries** approve remote HTTP/SSE MCP servers by URL entry pattern.
  - **Tool allowlists** restrict which tools from an approved server can run automatically. Leave a tool allowlist empty to allow all tools from that server.
