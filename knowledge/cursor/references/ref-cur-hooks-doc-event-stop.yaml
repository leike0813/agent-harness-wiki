excerpt: |2-
  Called when the agent loop ends. Can optionally auto-submit a follow-up user message to keep iterating.

  ```json
  // Input
  {
    "status": "completed" | "aborted" | "error",
    "loop_count": 0
  }
  ```

  ```json
  // Output
  {
    "followup_message": "<message text>"
  }
  ```
