  heading: "Step 1: Create the IAM role"
official_url: https://cursor.com/docs/customizing/aws-bedrock.md
excerpt: |-
  Create a new IAM role with the following trust policy:

  ```json
  {
    "Version": "2012-10-17",
    "Statement": [
      {
        "Effect": "Allow",
        "Principal": {
          "AWS": "arn:aws:iam::289469326074:role/roleAssumer"
        },
        "Action": "sts:AssumeRole",
        "Condition": {
          "StringEquals": {
            "sts:ExternalId": "<your-external-id>"
          }
        }
      }
    ]
  }
  ```
