locator:
  kind: document_section
  heading: "Skill directories"
official_url: https://cursor.com/docs/skills.md
excerpt: |-
  Each skill should be a folder containing a `SKILL.md` file:
  
  ```text
  .agents/
  └── skills/
      └── my-skill/
          └── SKILL.md
  ```
  
  Skills can also include optional directories for scripts, references, and assets:
  
  ```text
  .agents/
  └── skills/
      └── deploy-app/
          ├── SKILL.md
          ├── scripts/
          │   ├── deploy.sh
          │   └── validate.py
          ├── references/
          │   └── REFERENCE.md
          └── assets/
              └── config-template.json
  ```
