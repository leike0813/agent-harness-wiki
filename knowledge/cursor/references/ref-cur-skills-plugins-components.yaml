  A plugin can bundle any combination of these components:
  
  | Component       | Available in   | Description                                                |
  | :-------------- | :------------- | :--------------------------------------------------------- |
  | **Rules**       | Cursor Plugins | Persistent AI guidance and coding standards (`.mdc` files) |
