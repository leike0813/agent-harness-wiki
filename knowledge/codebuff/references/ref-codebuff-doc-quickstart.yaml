excerpt: |-
  Get started with Codebuff
  1. Install Codebuff: npm install -g codebuff
  2. Navigate to your project directory: cd /path/to/your-repo
  3. Run Codebuff: codebuff
  4. Initialize Your Project (Optional)
  Run the /init command inside Codebuff to set up project-specific files. Useful for: New projects -- if you don't already have an AGENTS.md or CLAUDE.md (Codebuff will also read these files). Building custom agents -- running /init is the first step to creating your own agents!
