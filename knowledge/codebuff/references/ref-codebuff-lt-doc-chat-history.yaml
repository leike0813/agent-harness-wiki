excerpt: Chats are stored locally at <code class="relative rounded px-[0.3rem] py-[0.2rem] mx-2 font-mono text-sm bg-muted">~/.config/manicode/projects/&lt;your-project-name&gt;/chats</code>. Prompts and relevant project context are also sent to Freebuff and model providers. See the <a class="text-primary underline underline-offset-4 hover:no-underline font-medium" href="https://freebuff.com/privacy-policy">Privacy Policy</a>.</p>
