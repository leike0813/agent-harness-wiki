  heading: Core Configuration
official_url: "https://www.codebuff.com/docs/agents/agent-reference"
excerpt: |-
  Core Configuration
  id (string, required) Unique identifier for this agent. Must contain only lowercase letters, numbers, and hyphens.
  displayName (string, required) Human-readable name for the agent.
  spawnerPrompt (string, optional) Tells other agents when to spawn this one.
  Model Configuration
  model (string, required) The model to use, which can be any model string from Openrouter.
  Reasoning Options (reasoningOptions, object, optional) Controls model reasoning behavior using OpenRouter-style settings.
