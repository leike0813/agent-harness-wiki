excerpt: |-
  tasks.retentionDays
  number
  30
  Number of days after which unpinned tasks are automatically deleted. Pinned tasks are never deleted automatically. Set to 0 to disable automatic cleanup and keep all task history.
  Only set tasks.retentionDays to 0 in Bob Shell 2.0.1 or later. Setting this value to 0 in earlier versions can delete unpinned tasks and their history.
