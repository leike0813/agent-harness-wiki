excerpt: |-
  Runs when the agent stops, after the final turn completes.
  Stdin schema
  {
  "session_id": "string",
  "cwd": "string",
  "hook_event_name": "string",
  "last_assistant_message": "string | null"
  }
  Example payload
  {
  "session_id": "3f2a9c1e8b7d4f6a0e5c2b1d9a8f7e6c",
  "cwd": "/path/to/project",
  "hook_event_name": "Stop",
  "last_assistant_message": "Done. The auth module is refactored."
  }
  Stdout: Ignored.
  Blocking: Exit code 2 has no effect. The session has already ended.
