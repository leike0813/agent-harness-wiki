excerpt: |-
  The authentication prompt does not open
   Verify that you did not mark the server as disabled in your configuration.
   Check that your configuration file does not include a static Authorization header in headers.
   Restart Bob Shell to reinitiate the connection.
   Check that your browser or firewall does not block local loopback connections on 127.0.0.1.
   The identity provider returns a redirect URI mismatch error
   Verify that your identity provider client registration includes http://127.0.0.1:33418/callback.
   If port 33418 is busy, register additional ports from 33419 through 33427.
