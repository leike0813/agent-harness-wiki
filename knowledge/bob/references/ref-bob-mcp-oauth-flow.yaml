  heading: How the authentication flow works
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  You add an OAuth-enabled MCP server to your configuration file (no headers or env credentials required)
   When Bob first connects to the server, it detects the server's OAuth authorization metadata
   Bob opens a browser-based authentication prompt asking you to sign in and grant consent
   After you authorize, Bob stores the access and refresh tokens securely across sessions
   Bob automatically refreshes tokens before they expire. You are not prompted again unless the refresh fails.
  Bob Shell Authorization Server MCP Server
   | | |
   |-- connect to server ---------->| |
   |<-- OAuth metadata (401) -------| |
   |-- open auth prompt ----------->| |
   | (user signs in & consents) | |
   |<-- authorization code ---------| |
   |-- exchange for tokens -------->| |
