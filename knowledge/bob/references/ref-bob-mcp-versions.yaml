excerpt: |-
  Bob Shell supports the following MCP specification versions:
  Protocol versionStatus
  2025-11-25Supported
  2025-06-18Supported
  2025-03-26Supported
  2024-11-05Supported
  2024-10-07Supported
  Bob Shell negotiates the highest mutually supported version when connecting to a server. The 2026-07-28 specification version is not yet supported.
