  heading: Custom OAuth parameters
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  When your identity provider requires a pre-registered client ID, custom scopes, or a client secret, configure the oauth object:
   url: string, Remote MCP endpoint URL (required).
   oauth.enabled: boolean, Set to false to disable OAuth, or true to require OAuth. Enabled by default when no Authorization header is present.
   oauth.clientId: string, Pre-registered OAuth client ID issued by your identity provider.
   oauth.clientSecret: string, OAuth client secret, if your authorization server requires one for confidential clients.
   oauth.scope: string, Space-separated list of OAuth scopes you want to request.
