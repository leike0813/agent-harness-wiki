official_url: "https://bob.ibm.com/docs/shell/account/api-keys"
excerpt: |-
  API keys are scoped to both the user and the subscription instance. Individual users can create, list, and revoke their own API keys. Subscription instance admins can list and revoke API keys for all users in their instance.
  API key types
  You can create two kinds of API keys:
  TypeScope and usage
  GeneralScoped to your subscription instance and usable across multiple services. For inference requests, you must also include the team ID header.
  InferenceScoped to a specific subscription instance and team, and limited to inference requests only. No additional instance or team headers are required.
  When to use API keys
  Use API keys when you need to:
  Authenticate Bob Shell in non-interactive sessions
  Run Bob in CI/CD pipelines or scheduled automation
