  heading: Current limitations
official_url: "https://bob.ibm.com/docs/shell/configuration/lifecycle-hooks"
excerpt: |-
  The following capabilities are not yet available:
   Hook handler types other than command and https: function hooks, inline script hooks, and similar are not supported.
   Scheduled hooks: hooks cannot be set to run on a timer or in response to an external event.
   Input rewriting: hooks cannot modify the prompt or tool input before it reaches the model.
   Sandboxed running: hooks run with your full user permissions; no isolation is applied.
   Dedicated hook telemetry: hook activity is not tracked separately in session analytics.
   Blocking from non-blocking hooks: exit code 2 has no effect for SessionStart, PostToolUse, PostCompact, or Stop.
  How is this topic?
   Custom rules
