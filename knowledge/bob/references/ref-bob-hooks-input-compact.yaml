  heading: Hook reference
official_url: "https://bob.ibm.com/docs/shell/configuration/lifecycle-hooks"
excerpt: |-
  Runs before context compaction begins, giving you a chance to inspect conditions or block compaction.
  Stdin schema
  {
  "session_id": "string",
  "cwd": "string",
  "hook_event_name": "string",
  "trigger": "manual | auto",
  "custom_instructions": "string | null"
  }
  Example payload
  {
  "session_id": "3f2a9c1e8b7d4f6a0e5c2b1d9a8f7e6c",
  "cwd": "/path/to/project",
  "hook_event_name": "PreCompact",
  "trigger": "auto",
  "custom_instructions": null
  }
  Stdout: Ignored.
  Blocking: Exit code 2 blocks compaction from proceeding. Bob Shell reports compaction as blocked and continues the session.
