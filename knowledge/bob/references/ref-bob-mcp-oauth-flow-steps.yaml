  heading: How the authentication flow works
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  You add the remote MCP server URL to your configuration file without headers or env credentials.
   When Bob Shell connects to the server, Bob Shell detects the OAuth requirements.
   Bob Shell opens a browser sign-in window where you review requested permissions and approve access.
   Bob Shell receives the authorization tokens and stores them securely across your sessions.
   Bob Shell automatically refreshes tokens before they expire so you can work without interruption.
