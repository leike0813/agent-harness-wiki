  heading: Log files
official_url: "https://bob.ibm.com/docs/shell/configuration/configuring"
excerpt: |-
  Logs are written to <code>~/.bob/logs/shell/</code> using rotating files (<code>bob-&lt;timestamp&gt;.log</code>). Up to 10 log files are retained; older files are pruned automatically. The maximum log file size is 5 MB before rotation.
