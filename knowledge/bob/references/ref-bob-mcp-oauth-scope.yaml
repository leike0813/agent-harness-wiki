  heading: Configure an OAuth-enabled server
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  You can configure your MCP servers in either your global configuration (~/.bob/mcp_settings.json) or your project configuration (.bob/mcp.json).
  Minimal configuration (automatic discovery)
   When your MCP server provides automatic OAuth metadata discovery, you only need to specify the url:
  {
  "mcpServers": {
  "my-oauth-server": {
  "url": "https://mcp.example.com/mcp"
  }
  }
  }
