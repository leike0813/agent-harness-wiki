excerpt: |-
  Manage Model Context Protocol servers directly from the CLI with bob mcp add, bob mcp add-json, bob mcp remove, and bob mcp list. Supports both global and workspace scopes, and stdio, SSE, and HTTP transports.Learn more →
  Skills
  Create reusable instruction sets that teach Bob new workflows and specialized tasks. Define custom workflows, add supporting files, and share skills across your team through version control. Skills were not available in Bob Shell 1.0.x.Learn more →
   Improvements
  Redesigned settings schema
  Settings are now stored at ~/.bob/settings/settings.json. The schema adds a telemetry section, an edit tool group, and clearer per-setting documentation. CLI flags and the /settings slash command override file values for the current session.Learn more →
