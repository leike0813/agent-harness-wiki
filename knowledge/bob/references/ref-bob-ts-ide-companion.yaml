official_url: "https://bob.ibm.com/docs/shell/troubleshooting/troubleshoot"
excerpt: |-
  The Bob Shell Companion extension might not be installed or running, or Bob Shell might be running outside the workspace directory.
  Solution:
   Install the Bob Shell Companion extension in your IDE.
   Navigate to your workspace directory in the terminal.
   Start Bob Shell from the workspace directory.
   Run /ide enable in Bob Shell.
