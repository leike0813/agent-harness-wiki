  heading: Built-in commands
official_url: "https://bob.ibm.com/docs/shell/features/slash-commands"
excerpt: |-
  Bob Shell includes the following built-in slash commands:
  CommandAliasesDescription
  /helpShow all available slash commands
  /clearClear the screen and reset conversation history
  /compact/condense, /compress, /summarizeIntelligently compact the context window to free up space
  /copyCopy an item from conversation history to the clipboard
  /editorOpen the current prompt in your preferred terminal editor. The editor is resolved from $VISUAL, $EDITOR, or vi. When you save and close the editor, the text is loaded back into the prompt.
  /hooksOpen the hooks management dialog. The dialog lists all configured global and workspace hooks with their event type, matcher, scope, status, and command. Toggle individual hooks on or off.
  /modeSwitch the active mode (opens a picker)
