  heading: How to enable or disable telemetry data collection
official_url: "https://bob.ibm.com/docs/shell/configuration/telemetry-data-shell"
excerpt: |-
  With a Bob Shell session open, type /settings.
  Navigate to and select Enable Usage Metrics.
  Press Enter to toggle between true (Enabled) and false (Disabled). You can press Tab to save settings globally
  or for a user.
