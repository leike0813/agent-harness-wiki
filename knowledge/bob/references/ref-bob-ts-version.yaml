  heading: Verify your version of Bob Shell
official_url: "https://bob.ibm.com/docs/shell/troubleshooting/troubleshoot"
excerpt: |-
  Run the following command to see your version of Bob Shell:
   Interactive session:
  /about
   Non-interactive session:
  bob --version
  Log files
   Bob Shell writes log files to ~/.bob/logs/shell/. Log files rotate automatically:
   Maximum of 10 log files are retained
   Each file is capped at 5 MB
   To find the current log file for a session:
  ls -lt ~/.bob/logs/shell/ | head
   Share relevant log excerpts when reporting issues.
  Workspace root resolution
   Bob Shell determines the workspace root by walking up from the current working directory until it finds a .git directory or a .bob directory. The first match becomes the workspace root.
   If no .git or .bob directory is found, Bob Shell uses the current working directory as the workspace root.
