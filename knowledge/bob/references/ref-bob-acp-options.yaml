  heading: Command options
official_url: "https://bob.ibm.com/docs/shell/features/acp"
excerpt: |-
  Start with bob acp and add options only for a specific reason:
  OptionDescription
  --log-level <level>Set the log verbosity: debug, info, warn, error, or silent. Also configurable through the BOB_LOG_LEVEL environment variable.
  --trustTrust every workspace that this ACP server opens. This option removes a project-level boundary, so do not include it in a permanent editor configuration.
  --auto-approveApprove every tool call without showing permission prompts. This option is broader than selecting Always allow for a single tool.
  --disable-mcpSkip MCP server initialization. Use this option to isolate session startup failures.
  --disable-subagentsOmit Bob's subagent tool registration when the task does not require delegation.
  --accept-licenseRecord license acceptance before server startup.
