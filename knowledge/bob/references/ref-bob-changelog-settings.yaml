excerpt: |-
  Settings are now stored at ~/.bob/settings/settings.json. The schema adds a telemetry section, an edit tool group, and clearer per-setting documentation. CLI flags and the /settings slash command override file values for the current session.Learn more →
  Agent mode replaces Code and Advanced modes
  The previous Code mode and Advanced mode have been consolidated into a single Agent mode. Agent mode takes autonomous action to complete tasks.Learn more →
  Expanded non-interactive output schema
  The JSON output from bob run now includes a stats object with per-session token counts, cache ratios, cost, duration, and tool call totals. Structured event types (message, tool_use, tool_result, error) make it easier to parse results in CI/CD pipelines.Learn more →
