excerpt: |-
  Each mode defines which subagent types Bob is permitted to spawn. The "Allowed subagents" row in the table above shows what is permitted in each mode. If Bob determines that a subagent would help, it spawns only a type that the active mode allows.
  Mode selection guidelines
   Start with Plan mode for new projects or complex features to design before implementation.
   Use Agent mode for implementing features, fixing bugs, and any tasks requiring file modifications.
   Switch to Ask mode when you need explanations or information without making changes.
  Customizing modes
   Tailor Bob's behavior by customizing existing modes or creating new specialized assistants.
  Define tool access, file permissions, and behavior instructions to enforce team standards or create purpose-specific assistants.
