locator:
  kind: document_section
  heading: Register Bob with your identity provider
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  When your identity provider (IdP) requires you to register Bob as a client application before you connect, use the following application settings:
  SettingValue
  Application or client typePublic, Native, or Loopback (Authorization Code with PKCE)
  Redirect URIhttp://127.0.0.1:33418/callback
  Additional redirect URIshttp://127.0.0.1:33419/callback through http://127.0.0.1:33427/callback (recommended if port 33418 is in use)
  Grant typesAuthorization Code (authorization_code) and Refresh Token (refresh_token)
  ScopesScopes specified in your MCP server documentation
  Copy the issued client ID into oauth.clientId in your configuration file.
