  heading: Skill locations
official_url: "https://bob.ibm.com/docs/shell/features/skills"
excerpt: |-
  Skills can be defined at two levels:
  LocationScopeUse case
  <project>/.bob/skills/Project-specificWorkflows unique to this project
  ~/.bob/skills/GlobalPersonal or organization-wide workflows
   Priority: If both locations contain a skill with the same name, the project-level skill takes precedence.
  Approving skills
   By default, Bob asks for your permission before activating a skill. This gives you control over when specialized workflows are applied.
   To skip the approval prompt, enable auto-approve for skills in your settings:
   Via /settings: Open settings with the /settings slash command, then enable Auto-approve: Skills.
   Via settings.json: Add "autoApprove": { "skills": true } to your ~/.bob/settings/settings.json.
