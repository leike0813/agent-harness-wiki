excerpt: |-
  Required fields:
   name: The skill's name. Match it to the skill's folder name—Bob uses the folder name to identify and reference the skill. Folder names must be lowercase kebab-case (letters, numbers, and single hyphens), up to 64 characters; Bob skips folders with invalid names.
   description: A clear summary that helps Bob decide when to activate this skill. If you omit it, Bob uses the first line of the instructions instead.
  Instructions section:
  Everything below the --- delimiter becomes the instructions Bob receives when the skill is activated.
