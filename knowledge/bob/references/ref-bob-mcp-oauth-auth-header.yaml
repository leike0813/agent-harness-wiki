  heading: Configure an OAuth-enabled server
official_url: "https://bob.ibm.com/docs/shell/configuration/mcp/mcp-oauth"
excerpt: |-
  Adding a static Authorization header to an MCP server configuration turns off OAuth. When an Authorization header is present, Bob Shell does not initiate the OAuth flow. When OAuth is active, Bob Shell removes static Authorization headers before sending requests. Use only one authentication method per server.
