excerpt: |-
  "session": {
   "maxTurns": 100,
   "defaultMode": "agent",
   "mcp": true,
   "subagents": true
   },
   "logging": {
   "logLevel": "warn"
   },
   "tasks": {
   "retentionDays": 30
   },
   "telemetry": {
   "enabled": true
   }
  }
  SettingTypeDefaultDescription
  session.maxTurnsnumber100Maximum agentic turns per session (0 = unlimited)
  session.defaultModestring"agent"Default mode when starting a session
  session.mcpbooleantrueEnable Model Context Protocol (MCP) servers by default
  session.subagentsbooleantrueEnable subagent spawning by default
  logging.logLevelstring"warn"Log verbosity (error, warn, info, debug, trace)
  tasks.retentionDaysnumber30Number of days to retain task history. Set to 0 to disable automatic cleanup and keep all task history.
  telemetry.enabledbooleantrueWhether usage telemetry is sent.
