excerpt: |-
  alwaysAllow MCP tools respected in Bob Shell
  MCP tools listed in alwaysAllow inside .bob/mcp.json are now automatically approved on the first tool call of a task in Bob Shell. Previously, this setting was honored only in the IDE extension.Learn more →
  Increased task history retention
  The default task retention period is now 30 days. Setting tasks.retentionDays to 0 disables automatic cleanup so that all task history is kept indefinitely.Learn more →
  Platform-aware auto-approve keyboard shortcut
  The keyboard shortcut to toggle auto-approve is now Alt+F on Windows, Linux, and WSL. On macOS, the shortcut remains Ctrl+F.Learn more →
  New slash command aliases
