locator:
  kind: document_section
  heading: Hook reference
official_url: "https://bob.ibm.com/docs/shell/configuration/lifecycle-hooks"
excerpt: |-
  Runs before a matched tool runs, giving you a chance to inspect or block the action.
  Stdin schema
  {
  "session_id": "string",
  "cwd": "string",
  "hook_event_name": "string",
  "tool_name": "string",
  "tool_input": "object",
  "tool_use_id": "string"
  }
  Example payload
  {
  "session_id": "3f2a9c1e8b7d4f6a0e5c2b1d9a8f7e6c",
  "cwd": "/path/to/project",
  "hook_event_name": "PreToolUse",
  "tool_name": "write_file",
  "tool_input": {
  "path": "src/index.ts",
  "content": "..."
  },
  "tool_use_id": "toolu_01abc123"
  }
  Stdout: Ignored.
  Blocking: Exit code 2 prevents the tool from running. Bob Shell reports the tool as blocked and continues the session.
