excerpt: |-
  **Tool call** (`type: "tool_use"`):

  ```json
  {
    "type": "assistant",
    "message": {
      "role": "assistant",
      "content": [
        {
          "type": "tool_use",
          "id": "call_d498c5988a...",
          "name": "read_file",
          "input": {
            "file_path": "/path/to/file.py"
          }
        }
      ]
    }
  }
  ```

  - `name`: Tool name (e.g. `read_file`, `search_replace`, `run_in_terminal`, `Skill`)
  - `input`: Tool call parameters
  - `id`: Corresponds to `tool_use_id` in the subsequent `tool_result`
