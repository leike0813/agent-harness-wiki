  heading: "Codebase indexing"
official_url: "https://docs.qoder.com/user-guide/indexing.md"
excerpt: |-
  Codebase indexing improves context understanding to help agents provide more accurate answers. When you first open a project, you can choose to create an index and configure automatic incremental updates for subsequent changes. Use `.gitignore` and `.qoderignore` to exclude files that do not need to be indexed. Cross-project indexing at the workspace level is also supported.

  For data processing, codebase indexing uploads only the necessary code files, excluding configuration files, secrets, and other nonessential files, to generate vector data in the cloud. The uploaded code files are destroyed after vector generation. Only vector data is retained in the cloud.
