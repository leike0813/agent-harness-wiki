  heading: How to Switch
official_url: "https://docs.qoder.com/user-guide/chat/model-tier-selector.md"
excerpt: |-
  1. In the AI Chat input box, click the model selector dropdown menu
  2. Select **Model Tier** or **Specific Model**
  3. The selection takes effect immediately, and the new model will apply to subsequent conversations in the current session
  <Note>
    When Credits run out, requests that require Credits cannot continue. Paid users can manually switch to Efficient during the limited-time free offer, or acquire more Credits. Service Account usage is excluded from the offer.
  </Note>
