excerpt: |-
  The Quest window in Qoder IDE has officially been retired. It is no longer available to new users, and access for existing users will be closed in batches. During this period, even if you can still use it now, the Quest window may disappear or become unavailable at any time. We recommend migrating to Qoder as soon as possible.
