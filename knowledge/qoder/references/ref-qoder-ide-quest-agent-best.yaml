excerpt: "Avoid vague instructions like \"fix the code.\" Clearly specify your specific goals, preferred tech stack, and acceptance criteria (e.g., \"Write a React table component with pagination\"). Use `@` to reference related files or code snippets, which greatly helps the Agent accurately understand the project context."
