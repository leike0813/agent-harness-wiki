excerpt: |-
  **4. `progress` — Hook trigger records**

  Records when hook scripts fire and which commands run:

  ```json
  {
    "type": "progress",
    "data": {
      "type": "hook_progress",
      "hookEvent": "UserPromptSubmit",
      "hookName": "UserPromptSubmit",
      "command": ".qoder/hooks/inject-skill-hint.sh"
    }
  }
  ```
