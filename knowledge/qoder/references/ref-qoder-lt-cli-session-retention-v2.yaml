  | `general.sessionRetention.enabled`      | boolean | `false`               | No      | Enable automatic session cleanup. Disabled by default; explicitly set to `true` to enable.        |
  | `general.sessionRetention.maxAge`       | string  | `30d`                 | No      | When automatic cleanup is enabled, delete sessions that have not been modified for this duration. |
  | `general.sessionRetention.minRetention` | string  | `1d`                  | No      | Minimum retention period (safety lower bound).                                                    |
