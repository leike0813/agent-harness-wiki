  heading: Impact of Folder Trust
official_url: "https://docs.qoder.com/cli/settings.md"
excerpt: "For security reasons, Project-Level and Local Level configurations are only applied when the current working directory is trusted. If the working directory is not trusted, Qoder CLI only loads User Level configurations and ignores `settings.json` and `settings.local.json` within the project. Folder Trust is controlled by `security.folderTrust.enabled` (enabled by default)."
