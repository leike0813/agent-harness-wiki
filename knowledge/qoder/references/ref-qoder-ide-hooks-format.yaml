locator:
  kind: document_section
  heading: Config Format
official_url: "https://docs.qoder.com/extensions/hooks.md"
excerpt: |-
  ```json
  {
    "hooks": {
      "EventName": [
        {
          "matcher": "match condition",
          "hooks": [
            {
              "type": "command",
              "command": "command to execute"
            }
          ]
        }
      ]
    }
  }
  ```
  | Field           | Required | Description                                                                                                 |
  | --------------- | -------- | ----------------------------------------------------------------------------------------------------------- |
  | `type`          | Yes      | `"command"` or `"http"`                                                                                     |
