locator:
  kind: document_section
  heading: Configuration File Locations
official_url: "https://docs.qoder.com/cli/settings.md"
excerpt: |-
  Qoder CLI reads configuration files from three levels:
  | Level             | Path                                   | Description                                                                              |
  | ----------------- | -------------------------------------- | ---------------------------------------------------------------------------------------- |
  | **User Level**    | `~/.qoder/settings.json`               | Personal preferences that apply to all projects for the current user.                    |
  | **Project-Level** | `<project>/.qoder/settings.json`       | Shared project configuration, committed to the repository and shared among team members. |
