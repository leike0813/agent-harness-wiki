  heading: "Transcript File Format"
official_url: "https://docs.qoder.com/extensions/hooks.md"
excerpt: |-
  The Transcript is a **session log file** automatically generated by Qoder IDE, located at the path pointed to by `transcript_path` (e.g. `~/.qoder/projects/<project>/transcript/<session-id>.jsonl`). Each line is an independent JSON object appended in chronological order, recording the complete session interaction.
