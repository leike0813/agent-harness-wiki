excerpt: |-
  ## **Planning**
  </div>
  Agent autonomously recognizes intent and automatically generates a plan for complex tasks. The generated plan is presented for your review, and upon confirmation, execution proceeds according to the plan. For more details on how Planning works, see [Planning](./plan-agent).
  <Tip>For medium-to-large tasks that require strict alignment on technical solutions or involve complex steps, we recommend using the [Code with Spec](/user-guide/quest/spec-driven) mode in the Quest workspace to generate a structured document before writing code.</Tip>
  <div id="make-plans-by-to-dos">
    ## **Make plans by to-dos**
  </div>
  Based on your inputs, Qoder IDE will generate a plan with To-dos for you to review, breaking down complex issues into manageable, sequential steps.
