excerpt: |-
  ### SessionStart

  Fires when a session starts or resumes. Use it to inject startup context (project conventions, environment info) at the beginning of a session.

  **Matcher:** None.

  **Extra input fields:**

  ```json
  {
    "session_id": "abc-123",
    "cwd": "/path/to/project",
    "hook_event_name": "SessionStart",
    "type": "startup",
    "model": "Auto"
  }
  ```
