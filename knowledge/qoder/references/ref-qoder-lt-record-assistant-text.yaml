excerpt: |-
  Model reply `message.content` is always an array containing two element types:

  **Text reply** (`type: "text"`):

  ```json
  {
    "type": "assistant",
    "message": {
      "role": "assistant",
      "content": [
        {
          "type": "text",
          "text": "I'll help you delete comments from test.py. Let me read the file first.\n\n"
        }
      ]
    }
  }
  ```
