  heading: "Rules, skills and context files"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  |                             | In the prompt from the start | Loaded on demand                |
  | --------------------------- | ---------------------------- | ------------------------------- |
  | Context file (`QWEN.md`)    | always, in full              | —                               |
  | Baseline rule               | always, in full              | —                               |
  | Conditional rule (`paths:`) | nothing                      | when a matching file is touched |
  | Skill                       | name + description only      | body, when the model invokes it |
  A skill is the right home for a procedure the model chooses to follow; a conditional rule is the right home for a constraint that applies to a region of the codebase whether or not the model thought to look for it.
