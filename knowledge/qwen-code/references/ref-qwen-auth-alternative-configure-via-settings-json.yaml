locator:
  kind: document_section
  heading: "Alternative: configure via `settings.json`"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  If you prefer to skip the interactive `/auth` flow, add the following to `~/.qwen/settings.json`:
  ```json
  {
    "modelProviders": {
      "openai": [
        {
          "id": "qwen3-coder-plus",
          "name": "qwen3-coder-plus (Coding Plan)",
          "baseUrl": "https://coding.dashscope.aliyuncs.com/v1",
          "description": "qwen3-coder-plus from Alibaba Cloud Coding Plan",
          "envKey": "BAILIAN_CODING_PLAN_API_KEY"
        }
      ]
    },
    "env": {
      "BAILIAN_CODING_PLAN_API_KEY": "sk-sp-xxxxxxxxx"
    },
    "security": {
      "auth": {
        "selectedType": "openai"
      }
    },
    "model": {
      "name": "qwen3-coder-plus"
    }
  }
  ```
  > [!note]
  >
  > The Coding Plan uses a dedicated endpoint (`https://coding.dashscope.aliyuncs.com/v1`) that is different from the standard Dashscope endpoint.
