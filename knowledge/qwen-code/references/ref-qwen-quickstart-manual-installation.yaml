excerpt: |-
  **Prerequisites**
  Make sure you have Node.js 22 or later installed. Download it from [nodejs.org](https://nodejs.org/en/download).
  **NPM**
  ```bash
  npm install -g @qwen-code/qwen-code@latest
  ```
  **Homebrew (macOS, Linux)**
  ```bash
  brew install qwen-code
  ```
