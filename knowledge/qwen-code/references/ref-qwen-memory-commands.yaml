excerpt: |-
  ### `/memory`
  Opens the Memory panel. From here you can:
  - Turn auto-memory saving on or off
  - Turn periodic cleanup (dream) on or off
  - Open your personal QWEN.md (`~/.qwen/QWEN.md`)
  - Open the project QWEN.md
  - Browse the auto-memory folder
  ### `/memory migrate-team`
  Migrates the **team memory** tier (`.qwen/team-memory/`) to the structured metadata format: each file gains the frontmatter (name, description, category, keywords, usage scenarios) that memory recall needs. Personal and project memory are migrated automatically in the background once [structured recall](#structured-recall-opt-in) is enabled; team memory is shared through git, so the rewrite runs only on explicit request and shows up as a reviewable commit.
