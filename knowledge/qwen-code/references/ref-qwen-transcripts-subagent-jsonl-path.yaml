  /** Returns the canonical JSONL transcript path. */
  export function getAgentJsonlPath(
    projectDir: string,
    sessionId: string,
    agentId: string,
  ): string {
    return path.join(
      getSubagentSessionDir(projectDir, sessionId),
      `agent-${sanitizeFilenameComponent(agentId)}.jsonl`,
    );
