  kind: document_section
  heading: "Tool filtering (allow/deny tools per server)"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  Use `includeTools` / `excludeTools` to restrict tools exposed by a server (from Qwen Code’s perspective).
  Example: include only a few tools:
  ```json
  {
    "mcpServers": {
      "filteredServer": {
        "command": "python",
        "args": ["-m", "my_mcp_server"],
        "includeTools": ["safe_tool", "file_reader", "data_processor"],
        "timeout": 30000
      }
    }
  }
  ```
