  heading: "Recommended: One-file setup via `settings.json`"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  The simplest way to get started with API Key authentication is to put everything in a single `~/.qwen/settings.json` file. Here's a complete, ready-to-use example:
  ```json
  {
    "modelProviders": {
      "openai": [
        {
          "id": "qwen3-coder-plus",
          "name": "qwen3-coder-plus",
          "baseUrl": "https://dashscope.aliyuncs.com/compatible-mode/v1",
          "description": "Qwen3-Coder via Dashscope",
          "envKey": "DASHSCOPE_API_KEY"
        }
      ]
    },
    "env": {
      "DASHSCOPE_API_KEY": "sk-xxxxxxxxxxxxx"
    },
    "security": {
      "auth": {
        "selectedType": "openai"
      }
    },
    "model": {
      "name": "qwen3-coder-plus"
    }
  }
  ```
