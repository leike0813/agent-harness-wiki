    static getGlobalQwenDir(): string {
      const envDir = process.env['QWEN_HOME'];
      if (envDir) {
        return Storage.resolvePath(envDir);
      }
      const homeDir = os.homedir();
      if (!homeDir) {
        return path.join(os.tmpdir(), '.qwen');
      }
      return path.join(homeDir, QWEN_DIR);
