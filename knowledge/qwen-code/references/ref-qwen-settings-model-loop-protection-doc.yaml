excerpt: "What a loop detector does when it fires. `\"warn\"` (default) reminds the model once, appended to the next tool results, and does not stop the turn, except for content and thought repetition, which happens mid-stream where no reminder can be delivered; `\"stop\"` stops the turn where it always has; the always-on guards (identical calls, shell inspection, invalid tool parameters, and stuck repetition past the adaptive cap) first remind the model once, appended to the next tool results, when the turn reaches their reminder point before the stop, while the opt-in heuristics stop without a reminder; `\"off\"` neither reminds nor stops and only records a telemetry event."
