  heading: "Automatic git sync (optional)"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  By default you share team memory with the normal git workflow (`pull` to receive, `commit`/`push` to share). To have Qwen do it for you, enable sync:
  ```json
  {
    "memory": {
      "enableTeamMemory": true,
      "enableTeamMemorySync": true
    }
  }
  ```
  When on, at session start Qwen best-effort syncs the `.qwen/team-memory/` directory: it rebuilds the shared `MEMORY.md` index, fast-forward-pulls collaborators' updates **first**, then commits your team-memory changes on top, and pushes **only that sync commit** (via an explicit single-branch refspec) — so the index you load reflects the latest. It only **stages** the team directory (your other working changes are never committed), and never blocks the session on a git failure. Off by default.
