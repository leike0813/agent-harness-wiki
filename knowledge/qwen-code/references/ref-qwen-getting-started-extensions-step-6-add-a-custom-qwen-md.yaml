  heading: "Step 6: Add a Custom `QWEN.md`"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  You can provide persistent context to the model by adding a `QWEN.md` file to your extension. This is useful for giving the model instructions on how to behave or information about your extension's tools. Note that you may not always need this for extensions built to expose commands and prompts.
  > **This is the most expensive place to put instructions.** An extension's context file is concatenated into the system prompt of **every request of every session the extension is active in**, whether or not the work at hand has anything to do with your extension — there is no relevance gating and no size limit. In one measured session, nine extensions' context files accounted for 9,989 tokens, 21% of everything the request carried before the conversation itself.
