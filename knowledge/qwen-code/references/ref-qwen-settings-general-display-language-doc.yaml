excerpt: |-
  Show completed replies and opened thoughts translated into `"zh-CN"` (Simplified Chinese) or `"en"` (English) in the Ink and OpenTUI terminals and the Web Shell. The model answers as usual; the stored conversation, what the model reads and copied text keep the original. Each translated block costs one call to the fast model, or the session model when none is set. Works without `experimental.mods` and in untrusted workspaces. User/System/SystemDefaults scopes only; Workspace values are ignored with a warning. See [Display Translation](../features/language.md#display-translation). Requires restart.
