  heading: "`qwen-extension.json`"
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  The `qwen-extension.json` file contains the configuration for the extension. The file has the following structure:
  ```json
  {
    "name": "my-extension",
    "version": "1.0.0",
    "mcpServers": {
      "my-server": {
        "command": "node my-server.js"
      }
    },
    "channels": {
      "my-platform": {
        "entry": "dist/index.js",
        "displayName": "My Platform Channel"
      }
    },
    "contextFileName": "QWEN.md",
    "commands": "commands",
    "skills": "skills",
    "agents": "agents",
    "workflows": "workflows",
    "settings": [
      {
        "name": "API Key",
        "description": "Your API key for the service",
        "envVar": "MY_API_KEY",
        "sensitive": true
      }
    ]
  }
  ```
  - `name`: The name of the extension.
