  heading: Single Responsibility Principle
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: |-
  Each Subagent should have a clear, focused purpose.
  **✅ Good:**
  ```
  ---
  name: testing-expert
  description: Writes comprehensive unit tests and integration tests
  ---
  ```
  **❌ Avoid:**
  ```
  ---
  name: general-helper
  description: Helps with testing, documentation, code review, and deployment
  ---
  ```
  **Why:** Focused agents produce better results and are easier to maintain.
