excerpt: |-
  Set `tools.freeform` to `true` to send Code Mode's `exec` input as raw text on
  OpenAI Responses models. It takes effect only when `tools.codeModeOnly` is also
  `true` and the selected model uses `wireApi: "responses"`. Enable it only for
  endpoints that support [Responses Custom Tools](https://developers.openai.com/api/docs/guides/function-calling#custom-tools). This setting is intentionally
  hidden from the Settings dialog; edit it in the settings file. It defaults to
  `false` and requires a restart.
