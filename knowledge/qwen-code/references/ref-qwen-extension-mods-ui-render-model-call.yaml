  export function register(on) {
    on(
      'ui.render',
      { component: ['AssistantMessage', 'Thinking'] },
      async ($, e, next) => {
        if (mostlyChinese(e.props.text)) return next(e);
        const r = await $.model.complete(
          {
            model: 'haiku',
            system: SYSTEM,
            prompt: e.props.text,
            maxTokens: 8192,
            timeoutMs: 25000,
          },
          { signal: next.signal },
        );
