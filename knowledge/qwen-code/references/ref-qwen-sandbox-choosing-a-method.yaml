excerpt: |-
  - **On macOS**:
    - Use Seatbelt when you want lightweight sandboxing (recommended for most users).
    - Use Docker/Podman when you need a full Linux userland (e.g., tools that require Linux binaries).
  - **On Linux/Windows**:
    - Use Docker or Podman.
