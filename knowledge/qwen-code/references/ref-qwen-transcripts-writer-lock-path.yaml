  export function getSessionWriterLockPath(
    runtimeBaseDir: string,
    sessionId: string,
  ): string {
    return path.join(
      runtimeBaseDir,
      'tmp',
      'session-writer-locks',
      `${encodeURIComponent(sessionId)}.lock`,
    );
  }
