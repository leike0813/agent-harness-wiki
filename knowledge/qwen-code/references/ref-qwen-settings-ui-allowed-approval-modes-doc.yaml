excerpt: "Execution approval modes offered by the Web Shell mode picker, `/approval-mode` dialog, custom footer and keyboard cycling. Omit to offer `default`, `auto-edit`, `auto` and `yolo`; an empty list offers none and disables the picker. A Web Shell host's `allowedApprovalModes` prop overrides this setting. User, System, and SystemDefaults scopes only; workspace values are ignored with a warning, because a cloned repository must not remove a restriction the operator set. Presentation only: it does not change the current mode or enforce backend permissions. Not shown in the Settings dialog; edit `settings.json` directly."
