      eventBusAgentLoop: {
        type: 'boolean',
        label: 'Event-Bus Agent Loop',
        category: 'Experimental',
        requiresRestart: true,
        default: undefined as boolean | undefined,
        unsetToggleValue: true,
        description:
          'Run the shared agent loop on the event-bus architecture. Applies to the surfaces that run on the shared agent loop: headless sessions (`-p` and stream-json), ACP sessions (Zed, VS Code, Web Shell, channels), the Ink TUI, OpenTUI and subagents by default; other surfaces keep their current loop internals. When unset, headless sessions run on the kernel, and the other surfaces on the shared loop use its procedural path. `true` selects the kernel, and `false` selects the procedural path, including for headless.
