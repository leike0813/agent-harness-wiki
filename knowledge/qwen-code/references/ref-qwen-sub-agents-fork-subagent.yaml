  heading: Fork Subagent
official_url: "https://github.com/QwenLM/qwen-code"
excerpt: "In addition to named subagents, Qwen Code supports **forking** — selected explicitly with `subagent_type: \"fork\"`. A fork inherits the parent's full conversation context and normally runs detached in the background. Forks work in both interactive and headless sessions; headless forks always use the background path. Omitting `subagent_type` does **not** fork; it launches the general-purpose subagent. Top-level named subagents run in the background by default and deliver their results through completion notifications. Set `run_in_background: false` when the current turn must wait for a regular subagent's result inline."
