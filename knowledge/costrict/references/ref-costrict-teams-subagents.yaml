excerpt: "生成队友时，你可以引用来自任何Subagents范围的Subagents类型：项目、用户、Plugins或 CLI 定义的。这让你可以一次定义一个角色，例如安全审查员或测试运行器，并将其同时用作委派的Subagents和Agent teams的队友。 要使用Subagents定义，在要求 CSC 生成队友时按名称提及它： 使用 security-reviewer 代理类型生成一个队友来审计认证模块。 队友会遵循该定义的 tools 白名单和 model ，定义的内容会作为额外指令附加到队友的系统提示中，而不是替换它。团队协调工具（如 SendMessage ）和任务管理工具在队友中始终可用，即使 tools 限制了其他工具。 注意： Subagents定义中的 skills 和 mcpServers frontmatter 字段在该定义作为队友运行时不会被应用。队友从你的项目和用户设置加载Skills和 MCP 服务器，与常规会话相同。 权限 ​ 队友以负责人的权限设置启动。如果负责人以 --dangerously-skip-permissions 运行，所有队友也是如此。生成后，你可以更改各个队友的模式，但不能在生成时设置每个队友的模式。 上下文和通信 ​ 每个队友都有自己的上下文窗口。生成时，队友加载与常规会话相同的项目上下文：AGENTS.md、MCP 服务器和Skills。它还接收来自负责人的生成提示。负责人的对话历史不会传递。 队友如何共享信息： 自动消息传递 ：当队友发送消息时，消息会自动传递给接收者。负责人不需要轮询更新。 空闲通知 ：当队友完成工作并停止时，他们"
