excerpt: "字段过滤 hooks 何时触发。匹配器的评估方式取决于它包含的字符： 匹配器值 评估为 示例 \"*\" 、 \"\" 或省略 匹配所有 在事件的每次发生时触发 仅包含字母、数字、 _ 和 | 精确字符串，或 | 分隔的精确字符串列表 Bash 仅匹配 Bash 工具； Edit|Write 精确匹配任一工具 包含任何其他字符 JavaScript 正则表达式 ^Notebook 匹配任何以 Notebook 开头的工具； mcp__memory__.* 匹配 memory 服务器的每个工具 FileChanged 事件在构建其监视列表时不遵循这些规则。请参阅 FileChanged。 每个事件类型匹配不同的字段： 事件 匹配器过滤的内容 匹配器值示例 PreToolUse 、 PostToolUse 、 PostToolUseFailure 、 PermissionRequest 、 PermissionDenied 工具名称 Bash 、 Edit|Write 、 mcp__.* SessionStart 会话如何启动 startup 、 resume 、 clear 、 compact SessionEnd 会话为何结束 clear 、 resume 、 logout 、 prompt_input_exit 、 bypass_permissions_disabled 、 other Notification 通知类型 permission_prompt 、 idle_prompt 、 auth_success 、 elicitation_dialog SubagentStart 代理类型 Bash 、 Explore 、 Plan 或自定义代理名称 PreCompact 、 PostCompact 什么触发了压缩 manual 、 auto SubagentStop 代理类型"
