excerpt: "字段允许插件声明一个或多个将内容注入对话的消息通道。每个通道绑定到插件提供的一个 MCP 服务器。 { \"channels\" : [ { \"server\" : \"telegram\" , \"userConfig\" : { \"bot_token\" : { \"description\" : \"Telegram 机器人令牌\" , \"sensitive\" : true } , \"owner_id\" : { \"description\" : \"你的 Telegram 用户 ID\" , \"sensitive\" : false } } } ] } server 字段是必填的，必须与插件的 mcpServers 中的键匹配。可选的每通道 userConfig 使用与顶级字段相同的模式，允许插件在启用时提示输入机器人令牌或所有者 ID。 路径行为规则 ​ 对于 skills 、 commands 、 agents 和 outputStyles ，自定义路径替换默认目录。如果清单指定了 skills ，则不会扫描默认的 skills/ 目录。钩子、MCP 服务器和 LSP 服务器在处理多个来源时有不同的语义。 所有路径必须相对于插件根目录并以 ./ 开头 自定义路径中的组件使用相同的命名和命名空间规则 可以将多个路径指定为数组 要保留默认目录并为技能、命令、代理或输出样式添加更多路径，请在数组中包含默认路径"
