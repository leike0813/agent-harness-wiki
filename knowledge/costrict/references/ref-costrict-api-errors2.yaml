excerpt: "核对基础地址和准确模型 ID；不要将控制台网址或完整 /chat/completions 请求地址直接当作本文的 Base URL 400 、 422 、Invalid parameters 协议不匹配、参数不受支持、模型能力配置不符 按报错字段检查；核对最大输出、图像、推理等配置与模型规格；仍失败时提交脱敏报错 429 、Rate limit 请求过快、并发过高；部分平台也用该码表示额度限制 阅读错误正文；限流时降低频率、结束重复任务并稍后重试；额度问题到服务商后台核对 500 、 502 、 503 、服务繁忙 服务商或中间网关暂时异常 稍后重试，查看服务商状态；持续出现时向服务商提供请求 ID 和时间 Timeout、Connection error、DNS 或证书错误 网络、代理、地址解析或证书配置问题 确认 API 地址和本机网络；公司网络请联系管理员，不要通过关闭证书校验解决 Context length exceeded、输入过长 当前对话超出模型上下文限制 新建对话，减少附带文件和输入内容，并核对模型上下文配置 模型列表为空，但 Key 看起来正确 服务未开放模型列表接口、权限不足或地址错误 核对官方模型 ID；插件可尝试填写自定义模型；仍需实际发消息验证 能聊天，但读取文件或其他工具操作失败 模型工具调用不兼容，或本地权限未允许 查看具体失败步骤；确认文件读取授权；用简单演示项目复测并提交脱敏错误 更换 Key 后仍使用旧配置 修改未保存、当前使用了另一组配置、已有进程或其他配置来源仍保留旧值 确认已保存和当前配置；新建对话；CSC 退出后重新启动，检查此前手动设置的配置来源 配置保存失败 配置文件格式、文件权限或 VS Code 密钥存储异常 保留错误信息；CSC 检查用户配置 JSON 格式和写入权限；不要通过删除整个配置目录处理 10. 联系方式 ​"
