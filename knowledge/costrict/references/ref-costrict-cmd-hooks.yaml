excerpt: "/hooks 查看工具事件的钩子配置 /ide 管理 IDE 集成并显示状态 /init 使用 AGENTS.md 指南初始化项目。设置 CLAUDE_CODE_NEW_INIT=1 可启用交互式流程，还会引导你完成技能、钩子和个人记忆文件的设置 /insights 生成分析你的 CSC 会话的报告，包括项目领域、交互模式和摩擦点 /install-github-app 为仓库设置 Claude GitHub Actions 应用。引导你选择仓库并配置集成 /install-slack-app 安装 Claude Slack 应用。打开浏览器完成 OAuth 流程 /keybindings 打"
