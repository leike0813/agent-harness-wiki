  heading: FALLBACK_FOR_ALL_PRIMARY_MODELS
official_url: "https://docs.costrict.ai/csc/reference/env-vars"
excerpt: "设置为任何非空值以在任何主模型上出现重复过载错误后触发回退到 --fallback-model 。默认情况下，仅 Opus 模型触发回退 FORCE_AUTOUPDATE_PLUGINS 设置为 1 以强制插件自动更新，即使通过 DISABLE_AUTOUPDATER 禁用了主自动更新器 HTTP_PROXY 指定网络连接的 HTTP 代理服务器 HTTPS_PROXY 指定网络连接的 HTTPS 代理服务器 IS_DEMO 设置为 1 以启用演示模式：在标题和 /status 输出中隐藏你的电子邮件和组织名称，并跳过引导。在流式传输或录制会话时有用 MAX_MCP_OUTPUT_TOKENS"
