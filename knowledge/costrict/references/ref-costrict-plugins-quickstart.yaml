excerpt: "每个Plugins都位于自己的目录中，包含清单和你的Skills、代理或Hooks。现在创建一个： mkdir my-first-plugin 创建Plugins清单 ​ .claude-plugin/plugin.json 处的清单文件定义了Plugins的身份：其名称、描述和版本。CSC 使用此元数据在Plugins管理器中显示你的Plugins。 在你的Plugins文件夹中创建 .claude-plugin 目录： mkdir my-first-plugin/.claude-plugin 然后创建 my-first-plugin/.claude-plugin/plugin.json ，内容如下： { \"name\" : \"my-first-plugin\" , \"description\" : \"A greeting plugin to learn the basics\" , \"version\" : \"1.0.0\" , \"author\" : { \"name\" : \"Your Name\" } } 字段 用途 name 唯一标识符和Skills命名空间。Skills以此作为前缀（例如 /my-first-plugin:hello ）。 description 在Plugins管理器中浏览或安装Plugins时显示。 version 使用语义版本控制跟踪发布。 author 可选。有助于归属标注。 有关 homepage 、 repository 和 license 等附加字段，请参阅完整的清单架构。 添加Skills ​ Skills位于 skills/ 目录中。每个Skills"
