excerpt: "/config 打开设置界面以调整主题、模型、输出样式和其他偏好。别名： /settings /context 以彩色网格可视化当前上下文使用情况。显示上下文密集工具的优化建议、内存膨胀和容量警告 /copy [N] 将最后一个助手响应复制到剪贴板。传递数字 N 复制第 N 个最新响应： /copy 2 复制倒数第二个。当存在代码块时，显示交互式选择器以选择单个块或完整响应。在选择器中按 w 可将选择写入文件而非剪贴板，这在 SSH 上很有用 /cost 显示 token 使用统计。有关订阅的详细信息，请参阅成本跟踪指南 /debug [description] [Skill]。 为当前会话启"
