  heading: "团队和任务在本地存储："
official_url: "https://docs.costrict.ai/csc/agent/agent-teams"
excerpt: "任务在本地存储： 团队配置 ： ~/.costrict/teams/{team-name}/config.json 任务列表 ： ~/.costrict/tasks/{team-name}/ 创建团队时 CSC 会自动生成这两项，并在队友加入、空闲或离开时更新它们。团队配置保存运行时状态，如会话 ID 和 tmux 窗格 ID，因此不要手动编辑或预先编写：你的更改会在下次状态更新时被覆盖。 要定义可重用的队友角色，请改用Subagents定义。 团队配置包含一个 members 数组，包含每个队友的名称、代理 ID 和代理类型。队友可以读取此文件来发现其他团队成员。 没有项目级别的团队配置等效项。项目目录中的 .costrict/teams/teams.json 等文件不会被识别为配置；CSC 将其视为普通文件。 使用Subagents定义作为队友 ​ 生成队友时，你可以引用来自任何Subagents范围的Subagents类型：项目、用户、Plugins或 CLI 定义的。这让你可以一次定义一个角色，例如安全审查员或测试运行器，并将其同时用作委派的Subagents和Agent teams的队友。 要使用Subagents定义，在要求 CSC 生成队友时按名称提及它： 使用 security-reviewer 代理类型生成一个队友来审计认证模块。 队友会遵循该定义的 tools"
