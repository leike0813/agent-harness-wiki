excerpt: "要拒绝的 .mcp.json 文件中特定 MCP 服务器列表 [\"filesystem\"] disableSkillShellExecution 禁用技能和自定义命令中来自用户、项目、插件或附加目录源的 !`...` 和 ```! 块的内联 shell 执行。命令被替换为 [shell command execution disabled by policy] 而不是运行。捆绑和托管技能不受影响。在用户无法覆盖的托管设置中最有用 true effortLevel 跨会话持久化努力级别。接受 \"low\" 、 \"medium\" 或 \"high\" 。运行 /effort low 、 /effort medium 或 /effort high 时自动写入。在 Opus 4.6 和 Sonnet 4.6 上支持 \"medium\" enableAllProjectMcpServers 自动批准项目 .mcp.json 文件中定义的所有 MCP 服务器 true enabledMcpjsonServers 要批准的 .mcp.json 文件中特定 MCP 服务器列表 [\"memory\", \"github\"] env 将应用于每个会话的环境变量 {\"FOO\": \"bar\"} fastModePerSessionOptIn 当为 true 时，快速模式不会跨会话持久化。每个会话以快速模式关闭开始，要求用户使用 /fast 启用。用户的快速模式偏好仍被保存。参见要求每次会话选择加入 true feedbackSurveyRate 会话质量调查在符合条件时出现的概率（0–1）。设置为 0 以完全抑制"
