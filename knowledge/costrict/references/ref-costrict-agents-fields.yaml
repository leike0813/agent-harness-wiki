excerpt: "以下字段可在 YAML frontmatter 中使用。只有 name 和 description 是必需的。 字段 必需 描述 name 是 使用小写字母和连字符的唯一标识符 description 是 CSC 何时应委托给此Subagents tools 否 Subagents可以使用的工具。如果省略则继承所有工具 disallowedTools 否 要拒绝的工具，从继承或指定的列表中移除 model 否 要使用的模型： sonnet 、 opus 、 haiku 、完整模型 ID（例如 claude-opus-4-6 ）或 inherit 。默认为 inherit permissionMode 否 权限模式： default 、 acceptEdits 、 auto 、 dontAsk 、 bypassPermissions 或 plan maxTurns 否 Subagents停止前的最大代理轮次 skills 否 在启动时加载到Subagents上下文中的Skills。注入的是完整Skills内容，而不仅仅是使其可调用。Subagents不从父对话继承Skills mcpServers 否 此Subagents可用的 MCP 服务器。每个条目要么是引用已配置服务器的服务器名称（例如 \"slack\" ），要么是以服务器名称为键、完整 MCP 服务器配置为值的内联定义 hooks 否 作用于此Subagents的生命周期Hooks memory 否 持久记忆作用域： user 、 project 或 local 。启用跨会话学习 background 否 设为 true 以始终将此Subagents作为后台任务运行。默认： false effort 否 此Subagents活跃时的努力级别。覆盖会话努力级别。默认：从会话继承。选项： low 、 medium 、 hi"
