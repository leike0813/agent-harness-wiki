excerpt: "此文件包含您的偏好（主题、通知设置、编辑器模式）、OAuth 会话、用户和本地范围的 MCP 服务器配置、按项目状态（允许的工具、信任设置）以及各种缓存。项目范围的 MCP 服务器单独存储在 .mcp.json 中。 注意： CSC 会自动创建配置文件的时间戳备份，并保留最近的五个备份以防止数据丢失。 { \"$schema\" : \"https://json.schemastore.org/claude-code-settings.json\" , \"permissions\" : { \"allow\" : [ \"Bash(npm run lint)\" , \"Bash(npm run test *)\" , \"Read(~/.zshrc)\" ] , \"deny\" : [ \"Bash(curl *)\" , \"Read(./.env)\" , \"Read(./.env.*)\" , \"Read(./secrets/**)\" ] } , \"env\" : { \"CLAUDE_CODE_ENABLE_TELEMETRY\" : \"1\" , \"OTEL_METRICS_EXPORTER\" : \"otlp\" } , \"companyAnnouncements\" : [ \"Welcome to Acme Corp! Review our code guidelines at docs.acme.com\" , \"Reminder: Code reviews required for all PRs\" , \"New security policy in effect\" ] } 上面示例中的 $schema 行指向"
