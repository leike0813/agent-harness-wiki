excerpt: "csc agents 列出所有已配置的子代理，按来源分组 csc agents csc auto-mode defaults 以 JSON 格式打印内置的自动模式分类器规则。使用 csc auto-mode config 查看应用设置后的有效配置 csc auto-mode defaults > rules.json csc mcp 配置模型上下文协议（MCP）服务器 参见 CSC MCP 文档。 csc plugin 管理 CSC 插件。别名： csc plugins 。参见插件参考了解子命令 csc plugin install code-review@claude-plugins-official csc remote-control 启动远程控制服务器，从 costrict.ai 或 Claude 应用控制 CSC。以服务器模式运行（无本地交互式会话）。参见服务器模式标志 csc remote-control --name \"My Project\" csc setup-token 为 CI 和脚本生成一个长期有效的 OAuth 令牌。将令牌打印到终端而不保存。需要 Claude"
