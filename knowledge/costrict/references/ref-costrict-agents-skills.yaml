excerpt: "使用 skills 字段在启动时将Skills内容注入Subagents的上下文。这为Subagents提供领域知识，而无需在执行期间发现和加载Skills。 --- name : api - developer description : Implement API endpoints following team conventions skills : - api - conventions - error - handling - patterns --- Implement API endpoints. Follow the conventions and patterns from the preloaded skills. 每个Skills的完整内容被注入Subagents的上下文，而不仅仅是使其可调用。Subagents不从父对话继承Skills；你必须明确列出它们。 注意： 这与在Subagents中运行Skills是相反的。在Subagents中使用 skills 时，Subagents控制系统提示并加载Skills内容。在Skills中使用 context: fork 时，Skills内容被注入到你指定的代理中。两者使用相同的底层系统。 启用持久记忆 ​ memory 字段为Subagents提供一个跨对话持久化的目录。Subagents使用此目录随时间积累知"
