excerpt: "文件是通过分层设置配置 CSC 的官方机制： 用户设置 定义在 ~/.costrict/settings.json 中，适用于所有项目。 项目设置 保存在您的项目目录中： .costrict/settings.json 用于签入源代码控制并与团队共享的设置 .costrict/settings.local.json 用于未签入的设置，适用于个人偏好和实验。CSC 在创建时会配置 git 忽略 .costrict/settings.local.json 。 托管设置 ：对于需要集中控制的组织，CSC 支持多种托管设置的交付机制。所有机制使用相同的 JSON 格式，且不能被用户或项目设置覆盖： 服务器管理的设置 ：通过 costrict.ai 管理控制台从 CoStrict 的服务器交付。参见服务器管理的设置。 MDM/OS 级别策略 ：通过 macOS 和 Windows 上的本机设备管理交付： macOS： com.anthropic.claudecode 托管偏好域（通过 Jamf、Iru (Kandji) 或其他 MDM 工具中的配置文件部署） Windows： HKLM\\SOFTWARE\\Policies\\CoStrict 注册表键，包含 JSON 的 Settings 值（REG_SZ 或 REG_EXPAND_SZ）（通过组策略或 Intune 部署） Windows（用户级别）： HKCU\\SOFTWARE\\Policies\\CoStrict （最低策略优先级，仅在不存在管理员级别来源时使用） 基于文件 ：部署到系统目录的 managed-settings.json 和 managed-mcp.json ： macOS： /Library/Application Support/CoStrict/ Linux 和 WSL： /etc/claude-code/ W"
