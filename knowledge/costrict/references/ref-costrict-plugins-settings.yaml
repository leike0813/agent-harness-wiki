  heading: "为Plugins附带默认设置"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/plugins"
excerpt: "Plugins可以在Plugins根目录包含 settings.json 文件，以在Plugins启用时应用默认配置。目前仅支持 agent 键。 设置 agent 会将Plugins的一个自定义代理激活为主线程，应用其系统提示、工具限制和模型。这让Plugins可以在启用时默认改变 CSC 的行为方式。 { \"agent\" : \"security-reviewer\" } 此示例激活了在Plugins agents/ 目录中定义的 security-reviewer 代理。 settings.json 中的设置优先于 plugin.json 中声明的 settings 。未知键会被静默忽略。 组织复杂Plugins ​ 对于包含许多组件的Plugins，按功能组织目录结构。有关完整的目录布局和组织模式，请参阅Plugins目录结构。 在本地测试Plugins ​ 使用 --plugin-dir 标志在开发期间测试Plugins。这会直接加载你的Plugins，无需安装。 csc --plugin-dir ./my-plugin 当 --plugin-dir Plugins与已安装的市场"
