excerpt: "如果 CSC 未按预期使用你的Skills： 检查描述是否包含用户自然会说的关键词 验证Skills是否出现在\"有哪些Skills可用？\"中 尝试重新表述你的请求以更接近描述 如果Skills是用户可调用的，使用 /skill-name 直接调用 Skills触发过于频繁 ​ 如果 CSC 在你不希望的时候使用了你的Skills： 使描述更具体 如果你只想要手动调用，添加 disable-model-invocation: true Skills描述被截断 ​ Skills描述被加载到上下文中，以便 CSC 知道有什么可用。所有Skills名称始终包含在内，但如果你有很多Skills，描述会被缩短以适应字符预算，这可能会剥离 CSC 匹配你请求所需的关键词。预算按上下文窗口的 1% 动态缩放，回退值为 8,000 个字符。 要提高限制，设置 SLASH_COMMAND_TOOL_CHAR_BUDGET 环境变量。或者在源头修剪描述：将关键用例放在前面，因为每个条目无论预算如何都上限为 250 个字符。"
