  heading: "9. 常见问题与报错"
official_url: "https://docs.costrict.ai/plugin/guide/api-integration"
excerpt: "不同服务商对错误码的定义可能不同。以下用于初步排查，请同时阅读报错正文和该服务商的错误说明。 现象或报错 常见原因 建议处理 401 、Authentication failed、Invalid API Key Key 错误、已失效，或 Key 与接口不匹配 重新复制有效 Key，检查首尾空格及签发平台；确认协议和地址；保存后新建对话重试 403 、Permission denied 无模型或项目权限，账号或网络访问策略受限 核对模型权限、项目权限及访问限制；由服务商或公司管理员确认 402 、Insufficient balance、额度不足 余额不足或相应服务额度不可用 查看当前 Key 所属账号和服务的余额、额度或订阅状态；不要仅凭错误码判断应购买哪个套餐 404 、Model not found 地址路径或模型 ID 错误，也可能无该模型权限 核对基础地址和准确模型 ID；不要将控制台网址或完整 /chat/completions 请求地址直接当作本文的 Base URL 400 、 422 、Invalid parameters 协议不匹配、参数不受支持、模型能力配置不符 按报错字段检查；核对最大输出、图像、推理等配置与模型规格；仍失败时提交脱敏报错 429 、Rate limit 请求过快、并发过高；部分平台也用该码表示额度限制 阅读错误正文；限流时降低频率、结束重复任务并稍后重试；额度问题到服务商后台核对 500 、 502 、 503 、服务繁忙 服务商或中间网关暂时异常 稍后重试，查看服务商状态；持续出现时向服务商提供请求 ID 和时间 Timeout、Connection error、DNS 或证书错误 网络、代理、地址解析或证书配置问题 确认 API 地址和本机网络；公司网络请联系管理员，不要通过关闭证书校验解决 Context length exce"
