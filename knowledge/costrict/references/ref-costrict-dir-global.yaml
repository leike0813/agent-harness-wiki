excerpt: "（你的主目录）中。 ~/.claude.json ​ 标记： 仅本地 简介： 应用状态和 UI 偏好 何时加载： 会话开始时读取你的偏好和 MCP 服务器。当你在 /config 中更改设置或批准信任提示时，CSC 会写回此文件 描述： 保存不属于 settings.json 的状态：主题、OAuth 会话、每个项目的信任决策、你的个人 MCP 服务器和 UI 开关。主要通过 /config 管理，而不是直接编辑。 提示： UI 开关如 showTurnDuration 和 terminalProgressBarEnabled 在这里，不在 settings.json 中 projects 键跟踪每个项目的状态，如信任对话框接受和上次会话指标。你在会话中批准的权限规则会写入 .costrict/settings.local.json 这里的 MCP 服务器仅属于你：用户范围适用于所有项目，本地范围按项目但不提交。团队共享的服务器放在项目根目录的 .mcp.json 中 { \"editorMode\" : \"vim\" , \"showTurnDuration\" : false , \"mcpServers\" : { \"my-tools\" : { \"command\" : \"npx\" , \"args\" : [ \"-y\" , \"@example/mcp-server\" ] } } } 全局 ~/.costrict/ 目录 ​ 你的个人配置，适用于所有项目。这是项目 .costrict/ 目录的全局对应物。此处的文件适用于你工作的每个项目，永远不会提交到任何仓库。 AGENTS.md ​ 简介"
