  heading: "插件清单模式"
official_url: "https://docs.costrict.ai/csc/reference/plugins-reference"
excerpt: "文件定义了插件的元数据和配置。本节记录所有支持的字段和选项。 清单是可选的。如果省略，CSC 会自动发现默认位置中的组件，并从目录名派生插件名称。当你需要提供元数据或自定义组件路径时，请使用清单。 完整模式 ​ { \"name\" : \"plugin-name\" , \"version\" : \"1.2.0\" , \"description\" : \"简要插件描述\" , \"author\" : { \"name\" : \"作者姓名\" , \"email\" : \"author@example.com\" , \"url\" : \"https://github.com/author\" } , \"homepage\" : \"https://docs.example.com/plugin\" , \"repository\" : \"https://github.com/author/plugin\" , \"license\" : \"MIT\" , \"keywords\" : [ \"keyword1\" , \"keyword2\" ] , \"skills\" : \"./custom/skills/\" , \"commands\" : [ \"./custom/commands/special.md\" ] , \"agents\" : \"./custom/agents/\" , \"hooks\" : \"./config/hooks.json\" , \"mcpServers\" : \"./mcp-config.json\" , \"outputStyles\" : \"./styles/\" , \"lspServers\" : \"./.lsp.json\" } 必填字段 ​ 如果你包含清单， name 是唯一必填的字段。 字段 类型 描述 示例 name string 唯一标识符（kebab-case，不含空格） \"deployment-tools\" 此名称用于组"
