  heading: "将现有配置转换为Plugins"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/plugins"
excerpt: "如果你已经在 .costrict/ 目录中有Skills或Hooks，可以将它们转换为Plugins以便于共享和分发。 迁移步骤 ​ 创建Plugins结构 ​ 创建一个新的Plugins目录： mkdir -p my-plugin/.claude-plugin 在 my-plugin/.claude-plugin/plugin.json 创建清单文件： { \"name\" : \"my-plugin\" , \"description\" : \"Migrated from standalone configuration\" , \"version\" : \"1.0.0\" } 复制现有文件 ​ 将你现有的配置复制到Plugins目录： # Copy commands cp -r .costrict/commands my-plugin/ # Copy agents (if any) cp -r .costrict/agents my-plugin/ # Copy skills (if any) cp -r .costrict/skills my-plugin/ 迁移Hooks ​ 如果你的设置中有Hooks，请创建Hooks目录： mkdir my-plugin/hooks 创建 my-plugin/hooks/hooks.json 并配置你的Hooks。从 .costrict/settings"
