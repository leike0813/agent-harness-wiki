excerpt: "并提供 prompt 字符串而不是 command 。使用 $ARGUMENTS 占位符将 hook 的 JSON 输入数据注入到你的提示文本中。CSC 将组合的提示和输入发送给快速的 CSC 模型，后者返回 JSON 决策。 此 Stop hook 要求 LLM 在允许 CSC 完成之前评估所有任务是否完成： { \"hooks\" : { \"Stop\" : [ { \"hooks\" : [ { \"type\" : \"prompt\" , \"prompt\" : \"Evaluate if CSC should stop: $ARGUMENTS. Check if all tasks are complete.\" } ] } ] } } 字段 必需 描述 type 是 必须为 \"prompt\" prompt 是 发送给 LLM 的提示文本。使用 $ARGUMENTS 作为 hook 输入 JSON 的占位符。如果 $ARGUMENTS 不存在，输入 JSON 会追加到提示 model 否 用于评估的模型。默认为快速模型 timeout 否 超时时间（秒）。默认：30 响应模式 ​ LLM 必须以包含以下内容的 JSON 响应： { \"ok\" : true | false , \"reason\" : \"Explanation for the decision\" } 字段 描述 ok true 允许"
