excerpt: "CSC 具有原生沙箱化功能，可为代理执行提供更安全的环境，同时减少对持续权限提示的需求。沙箱化不是为每个 bash 命令请求权限，而是预先创建定义的边界，使 CSC 可以在降低风险的情况下更自由地工作。 沙箱化的 bash 工具使用操作系统级原语来强制执行文件系统和网络隔离。 为什么沙箱化很重要 ​ 传统的基于权限的安全性需要用户不断批准 bash 命令。虽然这提供了控制力，但可能导致： 审批疲劳 ：反复点击\"批准\"可能导致用户不太关注他们正在批准的内容 降低生产力 ：持续的中断会减慢开发工作流 有限的自主性 ：CSC 在等待批准时无法高效工作 沙箱化通过以下方式解决这些挑战： 定义清晰的边界 ：精确指定 CSC 可以访问哪些目录和网络主机 减少权限提示 ：沙箱内的安全命令不需要批准 维护安全性 ：尝试访问沙箱外资源会触发即时通知 实现自主性 ：CSC 可以在定义的限制内更独立地运行 ⚠️ 警告： 有效的沙箱化需要 同时具备 文件系统和网络隔离。如果没有网络隔离，受损的代理可能会窃取 SSH 密钥等敏感文件。如果没有文件系统隔离，受损的代理可能会后门系统资源以获取网络访问权限。在配置沙箱化时，确保配置的设置不会在这些系统中创建绕过是非常重要的。 工作原理 ​ 文件系统隔离 ​ 沙箱化的 bash 工具将文件系统访问限制在特定目录： 默认写入行为 ：对当前工作目录及其子目录的读写访问 默认读取行为 ：对整个计算机的读取访问，除了某些被拒绝的目录 阻止的访问 ：未经明确许可，无法修改当前工作目录之外的文件 可配置 ：通过设置定义自定义允许和拒绝的路径 你可以使用设置中的 sandbox.filesystem.allowWrite 授予对额外路径的写入访问权限。这些限制在操作系统级别强制执行（macOS 上使用 Seatbelt，Linux 上使用 bubblewrap），因此它"
