excerpt: "覆盖 CSC 使用的默认模型 \"claude-sonnet-4-6\" modelOverrides 将 CoStrict 模型 ID 映射到提供商特定的模型 ID，如 Bedrock 推理配置文件 ARN。每个模型选择器条目在调用提供商 API 时使用其映射值。参见按版本覆盖模型 ID {\"claude-opus-4-6\": \"arn:aws:bedrock:...\"} otelHeadersHelper 生成动态 OpenTelemetry 头的脚本。在启动时和定期运行（参见动态头） /bin/generate_otel_headers.sh outputStyle 配置输出样式以调整系统提示。参见输出样式文档 \"Explanatory\" permissions 参见下表了解权限结构。 plansDirectory 自定义计划文件的存储位置。路径相对于项目根目录。默认： ~/.costrict/plans \"./plans\" pluginTrustMessage （仅托管设置）附加到安装前显示的插件信任警告的自定义消息。使用此添加组织特定的上下文，例如确认来自内部市场的插件已经过审查。 \"All plugins from our marketplace are approved by IT\" prefersReducedMotion 减少或禁用 UI 动画（旋转器、微光、闪烁效果）以提高可访问性 true respectGitignore 控制 @ 文件选择器是否遵循 .gitignore 模式。当为 true （默认）时，匹配 .gitignore 模式的文件从建议中排除 false showClearContextOnPlanAccept 在计划接受屏幕上显示\"清除上下文\"选项。默认为 false 。设置为 true 以恢复该选项 true showThinkingS"
