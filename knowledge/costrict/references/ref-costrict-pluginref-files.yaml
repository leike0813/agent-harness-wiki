excerpt: "组件 默认位置 用途 清单 .claude-plugin/plugin.json 插件元数据和配置（可选） 技能 skills/ 具有 <name>/SKILL.md 结构的技能 命令 commands/ 扁平 Markdown 文件形式的技能。新插件请使用 skills/ 代理 agents/ 子代理 Markdown 文件 输出样式 output-styles/ 输出样式定义 钩子 hooks/hooks.json 钩子配置 MCP 服务器 .mcp.json MCP 服务器定义 LSP 服务器 .lsp.json 语言服务器配置 可执行文件 bin/ 添加到 Bash 工具 PATH 的可执行文件。此处的文件在插件启用时可在任何 Bash 工具调用中作为裸命令调用 设置 settings.json 插件启用时应用的默认配置。目前仅支持 agent 设置 CLI 命令参考 ​ CSC 提供 CLI 命令用于非交互式插件管理，适用于脚本编写和自动化。 plugin install ​ 从可用市场安装插件。 csc plugin install <plugin> [options] 参数： <plugin> ：插件名称或 plugin-name@marketplace-name （指定市场） 选项： 选项 描述 默认值 -s, --scope <scope> 安装范围： user 、 project 或 local user -h, --help 显示命令帮助 范围决定安装的插件添加到哪个设置文件。例如， --scope project 写入 .costrict/settings.json 中的 enabledPlugins ，使插件对每个克隆项目仓库的人可用。 示例： # 安装到用户范围（默认） csc plugin install formatter@my-market"
