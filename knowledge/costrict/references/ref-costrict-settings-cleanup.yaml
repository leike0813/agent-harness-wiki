excerpt: "早于此期限的会话文件在启动时被删除（默认：30 天，最小值 1）。设置为 0 将因验证错误被拒绝。还控制启动时自动移除孤立子代理工作树的年龄截止。要在非交互模式（ -p ）中完全禁用转录写入，请使用 --no-session-persistence 标志或 persistSession: false SDK 选项；没有交互模式的等效项。 20 companyAnnouncements 启动时向用户显示的公告。如果提供多个公告，它们将随机循环显示。 [\"Welcome to Acme Corp! Review our code guidelines at docs.acme.com\"] defaultShell 输入框 ! 命令的默认 shell。接受 \"bash\" （默认）或 \"powershell\" 。设置 \"powershell\" 在 Windows 上通过 PowerShell 路由交互式 ! 命令。需要 CLAUDE_CODE_USE_POWERSHELL_TOOL=1 。参见 PowerShell 工具 \"powershell\" deniedMcpServers 在 managed-settings.json 中设置时，明确阻止的 MCP 服务器黑名单。适用于所有范围，包括托管服务器。黑名单优先于白名单。参见托管 MCP 配置 [{ \"serverName\": \"filesystem\" }] disableAllHooks 禁用所有钩子和任何自定义状态行 true disableAutoMode 设置为 \"disable\" 以阻止自动模式被激活。从 Shift+Tab"
