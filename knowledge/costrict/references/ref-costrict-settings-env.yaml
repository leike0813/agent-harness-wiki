excerpt: "环境变量让您无需编辑设置文件即可控制 CSC 行为。任何变量也可以在 settings.json 的 env 键下配置，以应用于每个会话或向您的团队推出。 有关完整列表，请参见环境变量参考。 CSC 可用的工具 ​ CSC 可以访问一组用于读取、编辑、搜索、运行命令和编排子代理的工具。工具名称是您在权限规则和钩子匹配器中使用的精确字符串。 有关完整列表和 Bash 工具行为详情，请参见工具参考。"
