excerpt: "/debug 会从该点开始捕获日志。可选择描述问题以聚焦分析 /desktop 在 CSC 桌面应用中继续当前会话。仅限 macOS 和 Windows。别名： /app /diff 打开交互式差异查看器，显示未提交的更改和每轮差异。使用左/右箭头在当前 git diff 和各个 CSC 轮次之间切换，上/下浏览文件 /doctor 诊断并验证你的 CSC 安装和设置 /effort [low|medium|high|max|auto] 设置模型努力级别。 low 、 medium 和 high 在会话间持久保存。 max 仅适用于当前会话且需要 Opus 4.6。 auto 重置为模型默认值"
