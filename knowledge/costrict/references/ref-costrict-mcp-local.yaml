  heading: "Local 作用域"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "Local 作用域是默认值。Local 作用域的服务器仅在您添加它的项目中加载，并且对您是私有的。CSC 将其存储在 ~/.costrict.json 中该项目路径下，因此同一服务器不会出现在您的其他项目中。将 Local 作用域用于个人开发服务器、实验性配置或包含您不想放入版本控制的凭据的服务器。 注意： MCP 服务器的\"local 作用域\"术语与一般本地设置不同。MCP Local 作用域的服务器存储在 ~/.costrict.json （您的主目录）中，而一般本地设置使用 .costrict/settings.local.json （在项目目录中）。有关设置文件位置的详细信息，请参阅设置。 # 添加 Local 作用域的服务器（默认） csc mcp add --transport http stripe https://mcp.stripe.com # 明确指定 local 作用域 csc mcp add --transport http stripe --scope local https://mcp.stripe.com 该命令将服务器写入 ~/.costrict.jso"
