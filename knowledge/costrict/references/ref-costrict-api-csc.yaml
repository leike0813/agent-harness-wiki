  heading: "5. 在 CSC 中配置"
official_url: "https://docs.costrict.ai/plugin/guide/api-integration"
excerpt: "以下命令在终端中使用。 进入准备使用的项目目录，启动 CSC： csc 在 CSC 的输入框中输入： /login 选择与服务商文档一致的协议： OpenAI 兼容 、 Anthropic 兼容 或 Gemini API 。 按顺序填写 Base URL、API Key，以及 Haiku、Sonnet、Opus 三个模型配置项。 每填完一项按 Enter 进入下一项；在最后一项按 Enter 保存。 输入 /model ，确认当前使用的目标模型，再发送测试消息。 模型映射怎么填 ​ 这里的三个名称是 CSC 中的模型映射位置。接入第三方服务时，应填写该服务商提供的实际模型 ID，不需要购买三个不同厂商的模型。 如果目前只使用一个模型，可以在三个位置填写同一个有效模型 ID。以后需要分配不同模型时，再分别修改。例如准备使用的模型 ID 为 YOUR_MODEL_ID ，三个位置都填写该 ID；不要原样填写这个占位词。 模型 ID、额度和能力以服务商为准。Gemini 配置要求三个模型位置都填写。 出现配置保存成功提示后，仍需完成下一节的实际调用验证。 6. 如何验证接入成功 ​ 第一步：验证基本对话 ​ 确认当前配置和模型后，新建对话，发送： 请只回复“连接成功”，不要读取文件或执行命令。 能够正常收到回复，且没有鉴权、权限或额度错误，说明本次基本模型调用成功。 第二步：验证项目读取 ​ 在不包含敏感信息的演示项目中放入一份简单的 README.md ，再发送： 请读取当前项目的 README.md，用两句话概括内容，不要修改文件或执行命令。 如出现读取授权提示，确认目标文件后允"
