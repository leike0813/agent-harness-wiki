  heading: CLAUDE_CODE_OAUTH_TOKEN
official_url: "https://docs.costrict.ai/csc/reference/env-vars"
excerpt: "用于 costrict.ai 认证的 OAuth 访问令牌。SDK 和自动化环境中 /login 的替代方案。优先于钥匙串存储的凭据。使用 csc setup-token 生成 CLAUDE_CODE_OTEL_FLUSH_TIMEOUT_MS 刷新待处理 OpenTelemetry span 的超时时间（毫秒）（默认：5000）。参见监控 CLAUDE_CODE_OTEL_HEADERS_HELPER_DEBOUNCE_MS 刷新动态 OpenTelemetry 头的间隔（毫秒）（默认：1740000 / 29 分钟）。参见动态头 CLAUDE_CODE_OTEL_SHUTDOWN_TIMEOUT_MS OpenTelemetry 导出器在关闭时完成的超时时间（毫秒）（默认：2000）。如果在退出时指标丢失则增加此值。参见监控 CLAUDE_CODE_PERFORCE_MODE 设置为 1 以启用 Perforce 感知的写保护。设置后，如果目标文件缺少所有者写入位（Perforce 在同步文件上清除该位，直到 p4 edit 打开它们），Edit、Write 和 NotebookE"
