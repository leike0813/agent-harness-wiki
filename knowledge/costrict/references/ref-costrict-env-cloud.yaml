excerpt: "使用 Bedrock CLAUDE_CODE_USE_FOUNDRY 使用 Microsoft Foundry CLAUDE_CODE_USE_MANTLE 使用 Bedrock Mantle 端点 CLAUDE_CODE_USE_POWERSHELL_TOOL 设置为 1 以在 Windows 上启用 PowerShell 工具（选择加入预览）。启用后，CSC 可以原生运行 PowerShell 命令，而不是通过 Git Bash 路由。仅在原生 Windows 上支持，不支持 WSL。参见 PowerShell 工具 CLAUDE_CODE_USE_VERTEX 使用 Vertex CLA"
