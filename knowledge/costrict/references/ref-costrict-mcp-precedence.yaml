official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "当同一服务器在多个地方定义时，CSC 只连接一次，使用最高优先级来源的定义： Local 作用域 Project 作用域 User 作用域 Plugins提供的服务器 costrict.ai 连接器 三个作用域按名称匹配重复项。Plugins和连接器按端点匹配，因此指向与上述服务器相同 URL 或命令的Plugins或连接器被视为重复项。 .mcp.json 中的环境变量展开 ​ CSC 支持 .mcp.json 文件中的环境变量展开，允许团队共享配置，同时保持机器特定路径和 API 密钥等敏感值的灵活性。 支持的语法： ${VAR} - 展开为环境变量 VAR 的值 ${VAR:-default} - 如果 VAR 已设置则展开为其值，否则使用 default 展开位置： 环境变量可以在以下位置展开： command - 服务器可执行文件路径 args - 命令行参数 env - 传递给服务器的环境变量 url - 用于 HTTP 服务器类型 headers - 用于 HTTP 服务器认证 使用变量展开的示例： { \"mcpServers\" : { \"api-server\" : {"
