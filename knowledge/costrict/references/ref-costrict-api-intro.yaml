  heading: "CoStrict API 接入使用说明"
official_url: "https://docs.costrict.ai/plugin/guide/api-integration"
excerpt: "本文介绍如何在 CoStrict 插件和 CoStrict CLI（以下简称 CSC）中配置自己的模型 API，完成首次调用，并管理 API Key。 1. 名词释义 ​ 服务商 是向你提供 API 服务、签发 API Key 的平台。 模型 是实际回答问题和执行任务的模型； 接口协议 则决定 CoStrict 以什么方式向平台发送请求。常见的接口协议类型有OpenAI 兼容接口、Anthropic兼容接口、Google Gemini API等。 配置时，请使用同一服务对应的协议、Base URL、API Key 和模型 ID。一个服务商可能提供多种协议，每种协议对应的地址可能不同。 常见提供商 ​ CoStrict 支持主流模型提供商的API接口，你可以接入智谱、Kimi、DeepSeek等官方API，也可以通过大模型服务平台（阿里百炼、硅基流动、方舟 Agent Plan等）由公司管理员统一配置后，使用各类大模型。 2. 开始前需要准备什么 ​ 已安装 CoStrict VS Code 插件或 CSC。尚未安装，可查看 CoStrict 下载页 或 CSC 快速开始 。 注册模型 API 服务商的账号，以及有效的 API Key。 获取服务商提供的接口协议、Base URL 和模型 ID。 可用的 API 额度或有效订阅，以及目标模型的访问权限。是否需要实名认证、充值或开通权限"
