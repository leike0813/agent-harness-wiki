  heading: CLAUDE_CODE_SYNC_PLUGIN_INSTALL
official_url: "https://docs.costrict.ai/csc/reference/env-vars"
excerpt: "以在第一次查询之前等待插件安装完成。没有此设置时，插件在后台安装，可能在第一轮不可用。与 CLAUDE_CODE_SYNC_PLUGIN_INSTALL_TIMEOUT_MS 结合使用以限制等待时间 CLAUDE_CODE_SYNC_PLUGIN_INSTALL_TIMEOUT_MS 同步插件安装的超时时间（毫秒）。超过时，CSC 继续运行而不使用插件并记录错误。无默认值：没有此变量时，同步安装会等待直到完成 CLAUDE_CODE_SYNTAX_HIGHLIGHT 设置为 false 以禁用差异输出中的语法高亮。当颜色干扰你的终端设置时有用 CLAUDE_CODE_TASK_LIST_ID 跨会话共享任务列表。在多个 CSC 实例中设置相同的 ID 以协调共享任务列表。参见任务列表 CLAUDE_CODE_TEAM_NAME 此队友所属的代理团队名称。在代理团队成员上自动设置 CLAUDE_CODE_TMPDIR 覆盖用于内部临时文件的临时目录。CSC 在此路径后追加 /claude-{uid}/ （Unix）或 /claude/ （Windows）。默认：macOS 上为 /tmp"
