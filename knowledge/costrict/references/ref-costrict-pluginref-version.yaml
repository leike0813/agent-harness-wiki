official_url: "https://docs.costrict.ai/csc/reference/plugins-reference"
excerpt: "为插件发布遵循语义化版本控制： { \"name\" : \"my-plugin\" , \"version\" : \"2.1.0\" } 版本格式 ： MAJOR.MINOR.PATCH MAJOR ：重大变更（不兼容的 API 变更） MINOR ：新功能（向后兼容的添加） PATCH ：错误修复（向后兼容的修复） 最佳实践 ： 首个稳定版本从 1.0.0 开始 在分发更改之前更新 plugin.json 中的版本 在 CHANGELOG.md 文件中记录更改 使用预发布版本如 2.0.0-beta.1 进行测试 ⚠️ 警告： CSC 使用版本来确定是否更新你的插件。如果你更改了插件的代码但没有在 plugin.json 中提升版本，由于缓存，插件的现有用户将看不到你的更改。 如果你的插件在市场目录中，你可以通过 marketplace.json 管理版本，并从 plugin.json 中省略 version 字段。"
