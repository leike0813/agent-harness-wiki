excerpt: "指向非第一方主机时提前加载。值： true （始终延迟，包括代理）、 auto （阈值模式：如果工具在上下文的 10% 内则提前加载）、 auto:N （自定义阈值，例如 auto:5 为 5%）、 false （全部提前加载） FALLBACK_FOR_ALL_PRIMARY_MODELS 设置为任何非空值以在任何主模型上出现重复过载错误后触发回退到 --fallback-model 。默认情况下，仅 Opus 模型触发回退 FORCE_AUTOUPDATE_PLUGINS 设置为 1 以强制插件自动更新，即使通过 DISABLE_AUTOUPDATER 禁用了主自动更新器 HTTP_PRO"
