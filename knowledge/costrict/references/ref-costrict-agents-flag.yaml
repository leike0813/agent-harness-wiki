  heading: "CLI 定义的Subagents"
official_url: "https://docs.costrict.ai/csc/agent/sub-agents"
excerpt: "在启动 CSC 时作为 JSON 传递。它们仅在该会话中存在，不会保存到磁盘，适合快速测试或自动化脚本。你可以在单个 --agents 调用中定义多个Subagents： csc --agents '{ \"code-reviewer\": { \"description\": \"Expert code reviewer. Use proactively after code changes.\", \"prompt\": \"You are a senior code reviewer. Focus on code quality, security, and best practices.\", \"tools\": [\"Read\", \"Grep\", \"Glob\", \"Bash\"], \"model\": \"sonnet\" }, \"debugger\": { \"description\": \"Debugging specialist for errors and test failures.\", \"prompt\": \"You are an expert debugger. Analyze errors, identify root causes, and provide fixes.\" } }' --agents 标志接受与基于文件的Subagents具有相同 frontmatter 字段的 JSON： description 、 prompt 、 tools 、 disallowedTools 、 model 、 permissionMode 、 mcpServers 、 hooks 、 maxTur"
