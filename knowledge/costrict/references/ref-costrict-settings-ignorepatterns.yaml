excerpt: "这取代了已弃用的 ignorePatterns 配置。匹配这些模式的文件从文件发现和搜索结果中排除，对这些文件的读取操作被拒绝。 子代理配置 ​ CSC 支持可以在用户和项目级别配置的自定义 AI 子代理。这些子代理存储为带有 YAML frontmatter 的 Markdown 文件： 用户子代理 ： ~/.costrict/agents/ - 跨所有项目可用 项目子代理 ： .costrict/agents/ - 特定于您的项目，可与团队共享 子代理文件定义具有自定义提示和工具权限的专业 AI 助手。在子代理文档中了解更多关于创建和使用子代理的信息。 插件配置 ​ CSC 支持插件系统，让您可以通过技能、代理、钩子和 MCP 服务器扩展功能。插件通过市场分发，可以在用户和仓库级别配置。 插件设置 ​ settings.json 中与插件相关的设置： { \"enabledPlugins\" : { \"formatter@acme-tools\" : true , \"deployer@acme-tools\" : true , \"analyzer@security-plugins\" : f"
