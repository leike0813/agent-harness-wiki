excerpt: "支持多种选项： 键 描述 示例 agent 将主线程作为命名子代理运行。应用该子代理的系统提示、工具限制和模型。参见显式调用子代理 \"code-reviewer\" allowedChannelPlugins （仅托管设置）允许推送消息的通道插件白名单。设置后替换默认的 CoStrict 白名单。未定义 = 回退到默认值，空数组 = 阻止所有通道插件。需要 channelsEnabled: true 。参见限制可运行的通道插件 [{ \"marketplace\": \"claude-plugins-official\", \"plugin\": \"telegram\" }] allowedHttpHookUrls HTTP 钩子可目标的 URL 模式白名单。支持 * 作为通配符。设置后，URL 不匹配的钩子被阻止。未定义 = 无限制，空数组 = 阻止所有 HTTP 钩子。数组跨设置源合并。参见钩子配置 [\"https://hooks.example.com/*\"] allowedMcpServers 在 managed-settings.json 中设置时，用户可配置的 MCP 服务器白名单。未定义 = 无限制，空数组 = 锁定。适用于所有范围。拒绝名单优先。参见托管 MCP 配置 [{ \"serverName\": \"github\" }] allowManagedHooksOnly （仅托管设置）仅加载托管钩子、SDK 钩子以及在托管设置 enabledPlugins 中强制启用的插件钩子。用户、项目和所有其他插件钩子被阻止。参见钩子配置 true allowManagedMcpServersOnly （仅托管设置）仅尊重托管设置中的 allowedMcpServers 。 deniedMcpServers 仍从所有来源合并。用户仍可添加 MCP 服务器，但仅应用管理员定义的白名单。参见"
