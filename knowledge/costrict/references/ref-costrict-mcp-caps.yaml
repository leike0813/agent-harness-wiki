  heading: "使用 MCP 资源"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "MCP 服务器可以暴露资源，您可以使用 @ 提及来引用它们，类似于引用文件的方式。 引用 MCP 资源 ​ 步骤 1：列出可用资源 ​ 在提示中输入 @ 以查看所有已连接 MCP 服务器的可用资源。资源与文件一起出现在自动完成菜单中。 步骤 2：引用特定资源 ​ 使用格式 @server:protocol://resource/path 引用资源： 你能分析 @github:issue://123 并建议修复方案吗？ 请查看 @docs:file://api/authentication 处的 API 文档 步骤 3：多个资源引用 ​ 您可以在单个提示中引用多个资源： 比较 @postgres:schema://users 和 @docs:file://database/user-model 💡 提示： 提示： 引用资源时会自动获取并作为附件包含 资源路径在 @ 提及自动完成中支持模糊搜索 当服务器支持时，CSC 自动提供列出和读取 MCP 资源的工具 资源可以包含 MCP 服务器提供的任何类型的内容（文本、JSON、结构化数据等） 使用 MCP 工具搜索进行扩展 ​ 工具搜索通过延迟工具定义直到 CSC 需要它们来保持 MCP 上下文使用量较低。会话启动时仅加载工具名称，因此添加更多 MCP 服务器对您的上下文窗口影响极小。 工作原理 ​ 工具搜索默认启用。MCP 工具被延迟而非预先加载到上下文中，CSC 在任务需要时使用搜索工具发现相关工具。只有 CSC 实际使用的工具才会进入上下文。从您的角度来看，MCP 工具的工作方式与之前完全相同。 如果您更喜欢基于阈值的加载，请设置"
