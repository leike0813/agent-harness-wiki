excerpt: "/agents 管理代理配置 /autofix-pr [prompt] 启动一个 CSC 网页版会话，监视当前分支的 PR，并在 CI 失败或审阅者留下评论时推送修复。使用 gh pr view 从你检出的分支检测打开的 PR；要监视不同的 PR，请先检出其分支。默认情况下，远程会话被告知修复每个 CI 失败和审阅评论；传递提示可给它不同的指令，例如 /autofix-pr only fix lint and type errors 。需要 gh CLI 和 CSC 网页版的访问权限 /batch <instruction> [Skill]。 在代码库中并行编排大规模变更。研究代码库，将工作分"
