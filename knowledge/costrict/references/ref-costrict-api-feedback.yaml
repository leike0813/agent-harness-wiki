excerpt: "反馈时提供：操作系统、VS Code 和插件版本或 CSC 版本、服务商名称、服务类型（普通 API 或订阅）、协议、模型 ID、出错时间、操作步骤、脱敏报错，以及服务商返回的请求 ID（如有）。公开反馈时也应遮挡公司内部域名、账号信息和项目内容，不要发送 API Key。"
