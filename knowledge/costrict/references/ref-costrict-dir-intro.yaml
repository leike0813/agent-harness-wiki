excerpt: "CSC 从这里读取 AGENTS.md、settings.json、hooks、skills、commands、subagents、rules 和自动记忆。探索你项目中的 .costrict 目录和主目录中的 ~/.costrict。 CSC 从你的项目目录和主目录中的 ~/.costrict 读取指令、设置、Skills、Subagents和记忆。将项目文件提交到 git 以便与团队共享； ~/.costrict 中的文件是适用于你所有项目的个人配置。 如果你设置了 CLAUDE_CONFIG_DIR ，此页面上的每个 ~/.costrict 路径都将位于该目录下。 大多数用户只需编辑 AGENTS.md 和 settings.json 。目录的其余部分是可选的：根据需要添加Skills、规则或Subagents。 项目级文件 ​ 以下文件位于你的项目目录中。 AGENTS.md ​ 简介： CSC 每次会话都会读取的项目指令 何时加载： 在每次会话开始时加载到上下文中 描述： 特定于项目的指令，决定 CSC 在此仓库中的工作方式。将你的约定、常用命令和架构上下文放在这里，以便 CSC 以与你的团队相同的假设运行。 提示： 目标控制在 200 行以内。更长的文件仍会完整加载，但可能会降低遵循度 AGENTS.md 会加载到每个会话中。如果某些内容只与特定任务相关，请将其移到 skill 或路径范围的 rule 中，这样只会在需要时加载 列出你最常运行的命令，如构建、测试和格式化，这样 CSC 无需你每次都拼写出来 运行 /memory 可以在会话中打开和编辑 AGENTS.m"
