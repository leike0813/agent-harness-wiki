excerpt: "此Skills激活时的努力级别。覆盖会话努力级别。默认值：继承自会话。选项： low 、 medium 、 high 、 max （仅 Opus 4.6）。 context 否 设为 fork 可在分叉的Subagents上下文中运行。 agent 否 设置 context: fork 时使用的Subagents类型。 hooks 否 限定在此Skills生命周期的Hooks。请参阅Skills和代理中的Hooks了解配置格式。 paths 否 限制此Skills何时激活的 glob 模式。接受逗号分隔的字符串或 YAML 列表。设置后，CSC 仅在处理匹配模式的文件时自动加载该Skills。使用与路径特定规则相同的格式。 shell 否 此Skills中 !`command` 和 ```! 块使用的 shell。接受 bash （默认）或 powershell 。设置 powershell 可在 Windows 上通过 PowerShell 运行内联 shell 命令。需要 CLAUDE_CODE_USE_POWERSHELL_TOOL=1 。 可用的字符串替换 ​ Skills支持在Skills内容中进行动态值的字符串替换： 变量 描述 $ARGUMENTS 调用Skills时传递的所有参数。如果内容中不存在 $ARGUMENTS ，参数将作为 ARGUMENTS: <value> 附加。 $ARGUMENTS[N] 通过从 0 开始的索引访问特定参数，例如 $ARGUMENTS[0] 表示第一个参数。 $N $ARGUMENTS[N] 的简写，例如 $0 表示第一个参数，"
