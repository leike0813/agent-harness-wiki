  heading: "选项 1：使用 managed-mcp.json 的独占控制"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "当您部署 managed-mcp.json 文件时，它对 所有 MCP 服务器拥有独占控制权 。用户无法添加、修改或使用此文件中定义的以外的任何 MCP 服务器。这是希望完全控制的组织最简单的方法。 系统管理员将配置文件部署到系统范围的目录： macOS： /Library/Application Support/CoStrict/managed-mcp.json Linux 和 WSL： /etc/claude-code/managed-mcp.json Windows： C:\\Program Files\\CoStrict\\managed-mcp.json 注意： 这些是系统范围的路径（而非用户主目录如 ~/Library/... ），需要管理员权限。它们设计为由 IT 管理员部署。 managed-mcp.json 文件使用与标准 .mcp.json 文件相同的格式： { \"mcpServers\" : { \"github\" : { \"type\" : \"http\" , \"url\" : \"https://api.githubcopilot.com/mcp/\" } , \"sentry\" : { \"type\" : \"http\" , \"url\" : \"https://mcp.sentry.dev/mcp\" } , \"company-internal\" : { \"type\" : \"stdio\" , \"command\" : \"/usr/local/bin/company-mcp-server\" , \"args\" : [ \"--config\" , \"/etc/company/mcp-con"
