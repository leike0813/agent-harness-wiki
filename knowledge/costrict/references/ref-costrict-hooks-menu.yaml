official_url: "https://docs.costrict.ai/csc/reference/hooks"
excerpt: "以打开配置 hooks 的只读浏览器。菜单显示每个 hook 事件及其已配置 hooks 的计数，让你可以深入查看匹配器，并显示每个 hook 处理程序的完整详细信息。使用它来验证配置、检查 hook 来自哪个设置文件，或检查 hook 的命令、提示或 URL。 菜单显示所有四种 hook 类型： command 、 prompt 、 agent 和 http 。每个 hook 都标有 [type] 前缀和指示其定义位置的来源： User ：来自 ~/.costrict/settings.json Project ：来自 .costrict/settings.json Local ：来自 .costrict/settings.local.json Plugin ：来自插件的 hooks/hooks.json Session ：在当前会话的内存中注册 Built-in ：由 CSC 内部注册 选择一个 hook 会打开一个详细视图，显示其事件、匹配器、类型、源文件以及完整的命令、提示或 URL。菜单是只读的：要添加、修改或移除 hooks，请直接编辑设置 JSON 或要求 CSC 进行更改。 禁用或移除 hooks ​ 要移除 hook，请从设置 JSON 文件中删除其条目。 要在不移除的情况下临时禁用所有 hooks，请在设置文件中设置 \"disableAllHooks\": tru"
