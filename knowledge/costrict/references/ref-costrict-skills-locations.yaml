  heading: "Skills存放位置"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/skills"
excerpt: "Skills的存储位置决定了谁可以使用它： 位置 路径 适用范围 企业级 参见托管设置 组织中的所有用户 个人 ~/.costrict/skills/<skill-name>/SKILL.md 你的所有项目 项目 .costrict/skills/<skill-name>/SKILL.md 仅此项目 Plugins <plugin>/skills/<skill-name>/SKILL.md 启用Plugins的范围内 当不同级别的Skills同名时，高优先级位置优先：企业级 > 个人 > 项目。PluginsSkills使用 plugin-name:skill-name 命名空间，因此不会与其他级别冲突。如果你在 .costrict/commands/ 中有文件，它们的工作方式相同，但如果Skills和命令同名，Skills优先。 从嵌套目录自动发现 ​ 当你在子目录中处理文件时，CSC 会自动从嵌套的 .costrict/skills/ 目录中发现Skills。例如，如果你在 packages/frontend/ 中编辑文件，CSC 也会在 packages/frontend/.costrict/skills/ 中查找Skills。这支持了各包拥有自己Skills的 monorepo 设置。 每个Skills是一个目录，以 SKILL.md 作为入口： my-skill/ ├── SKILL.md # 主要指令（必需） ├── template.md # 供 CSC 填写的模板 ├── examples/ │ └── sample.md # 显示预期格式的示例输出 └── s"
