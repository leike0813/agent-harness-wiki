excerpt: "除了 markdown 内容，你还可以使用 SKILL.md 文件顶部 --- 标记之间的 YAML frontmatter 字段来配置Skills行为： --- name : my - skill description : What this skill does disable-model-invocation : true allowed-tools : Read Grep --- Your skill instructions here ... 所有字段都是可选的。只推荐 description ，以便 CSC 知道何时使用该Skills。 字段 是否必需 描述 name 否 Skills的显示名称。如果省略，使用目录名。仅限小写字母、数字和连字符（最多 64 个字符）。 description 推荐 Skills的功能和使用时机。CSC 使用此字段决定何时应用该Skills。如果省略，使用 markdown 内容的第一段。将关键用例放在前面：超过 250 个字符的描述会在Skills列表中被截断以减少上下文使用量。 argument-hint 否 自动完成期间显示的提示，指示预期的参数。例如： [issue-number] 或 [filename] [format] 。 disable-model-invocation 否 设为 true 可防止 CSC 自动加载此Skills。用于你想要通过 /name 手动触发的工作流。默认值： false 。 user-invocable 否 设为 false 可从 / 菜单中隐藏。用于用户不应直接调用的背景知识。默认值： true 。 allowed-tools 否 此Skills激活时 CSC 可以使用而无需请求许可的工具。接受空格分隔的字符串或 YAML 列表。 model 否 此Skills激活时使用的模型。 ef"
