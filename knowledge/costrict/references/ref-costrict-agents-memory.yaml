excerpt: "字段为Subagents提供一个跨对话持久化的目录。Subagents使用此目录随时间积累知识，例如代码库模式、调试见解和架构决策。 --- name : code - reviewer description : Reviews code for quality and best practices memory : user --- You are a code reviewer. As you review code , update your agent memory with patterns , conventions , and recurring issues you discover. 根据记忆应适用的范围选择作用域： 作用域 位置 使用场景 user ~/.costrict/agent-memory/<name-of-agent>/ Subagents应在所有项目中记住学习内容 project .costrict/agent-memory/<name-of-agent>/ Subagents的知识是项目特定的，可通过版本控制共享 local .costrict/agent-memory-local/<name-of-agent>/ Subagents的知识是项目特定的，但不应提交到版本控制 启用记忆后： Subagents的系统提示包含读写记忆目录的指令。 Subagents的系统提示还包含记忆目录中 MEMORY.md 的前 200 行或 25KB（以先到者为准），以及如果超出限制则整理 MEMORY.md 的指令。 Read、Write 和 Edit 工"
