excerpt: "队友以负责人的权限设置启动。如果负责人以 --dangerously-skip-permissions 运行，所有队友也是如此。生成后，你可以更改各个队友的模式，但不能在生成时设置每个队友的模式。 上下文和通信 ​ 每个队友都有自己的上下文窗口。生成时，队友加载与常规会话相同的项目上下文：AGENTS.md、MCP 服务器和Skills。它还接收来自负责人的生成提示。负责人的对话历史不会传递。 队友如何共享信息： 自动消息传递 ：当队友发送消息时，消息会自动传递给接收者。负责人不需要轮询更新。 空闲通知 ：当队友完成工作并停止时，他们会自动通知负责人。 共享任务列表 ：所有代理都可以看到任务状态并认领可用工作。 队友消息传递： 消息 ：向一个特定队友发送消息 广播 ：同时向所有队友发送。谨慎使用，因为成本随团队规模增长。 负责人在生成每个队友时为其分配一个名称，任何队友都可以通过该名称给其"
