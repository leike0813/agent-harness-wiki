excerpt: "Skills可以在其目录中包含多个文件。这使 SKILL.md 专注于要点，同时让 CSC 仅在需要时访问详细的参考材料。大型参考文档、API 规范或示例集合不需要在每次Skills运行时都加载到上下文中。 my-skill/ ├── SKILL.md (required - overview and navigation) ├── reference.md (detailed API docs - loaded when needed) ├── examples.md (usage examples - loaded when needed) └── scripts/ └── helper.py (utility script - executed, not loaded) 从 SKILL.md 中引用支持文件，以便 CSC 知道每个文件包含什么以及何时加载它： ## Additional resources - For complete API details, see reference.md - For usage examples, see examples.md 💡 提示： 将 SKILL.md 保持在 500 行以内。将详细的参考材料移到单独的文件中。 控制谁调用Skills ​ 默认情况下，你和 CSC 都可以调用任何Skills。你可以输入 /skill-name"
