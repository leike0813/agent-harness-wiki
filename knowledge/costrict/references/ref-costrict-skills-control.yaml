excerpt: "默认情况下，你和 CSC 都可以调用任何Skills。你可以输入 /skill-name 直接调用它，CSC 也可以在与你的对话相关时自动加载它。两个 frontmatter 字段让你可以限制这一点： disable-model-invocation: true ：只有你可以调用该Skills。用于有副作用或你想要控制时机的工作流，如 /commit 、 /deploy 或 /send-slack-message 。你不希望 CSC 因为代码看起来准备好了就决定部署。 user-invocable: false ：只有 CSC 可以调用该Skills。用于不可作为命令操作的背景知识。一个 legacy-system-context Skills解释旧系统的工作方式。CSC 应该在相关时知道这一点，但 /legacy-system-context 对用户来说不是一个有意义的操作。 此示例创建一个只有你可以触发的部署Skills。 disable-model-invocation: true 字段防止 CSC 自动运行它： --- name : deploy description : Deploy the application to production disable-model-invocation : true --- Deploy $ARGUMENTS to production : 1. Run the test suite 2. Build the application 3. Push to the deployment target 4. Verify the"
