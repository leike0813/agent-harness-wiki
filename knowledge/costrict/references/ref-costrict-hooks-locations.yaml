excerpt: "你在哪里定义 hook 决定了它的作用范围： 位置 作用范围 可共享 ~/.costrict/settings.json 你的所有项目 否，仅限本机 .costrict/settings.json 单个项目 是，可以提交到仓库 .costrict/settings.local.json 单个项目 否，被 gitignore 托管策略设置 组织范围 是，由管理员控制 插件 hooks/hooks.json 当插件启用时 是，随插件打包 技能或代理 frontmatter 当组件处于活动状态时 是，定义在组件文件中 有关设置文件解析的详细信息，请参阅设置。企业管理员可以使用 allowManagedHooksOnly 来阻止用户、项目和插件 hooks。在托管设置 enabledPlugins 中强制启用的插件 hooks 豁免，因此管理员可以通过组织市场分发经过审查的 hooks。请参阅 Hook 配置。 匹配器模式 ​ matcher 字段过滤 hooks 何时触发。匹配器的评估方式取决于它包含的字符： 匹配器值 评估为 示例 \"*\" 、 \"\" 或省略 匹配所有 在事件的每次发生时触发 仅包含字母、数字、 _ 和 | 精确字符串，或 | 分隔的精确字符串列表 Bash 仅匹配 Bash 工具； Edit|Write 精确匹配任一工具 包含任何其他字符 JavaScript 正则表达式 ^Notebook 匹配任何以 Notebook 开头的工具； mcp__memory__.* 匹配 memory 服务器的每个工具 FileChanged 事件在构建其监视列表时不遵循这些规则。"
