excerpt: "每次会话加载的指令 rules/*.md 项目和全局 ✓ 按主题范围的指令，可选地按路径限制 settings.json 项目和全局 ✓ 权限、hooks、环境变量、模型默认值 settings.local.json 仅项目 你的个人覆盖，自动 gitignore .mcp.json 仅项目 ✓ 团队共享的 MCP 服务器 .worktreeinclude 仅项目 ✓ 复制到新工作树的 gitignore 文件 skills/<name>/SKILL.md 项目和全局 ✓ 通过 /name 调用或自动调用的可重用提示 commands/*.md 项目和全局 ✓ 单文件提示；与 skills 同一机制 output-styles/*.md 项目和全局 ✓ 自定义系统提示部分 agents/*.md 项目和全局 ✓ 拥有自己提示和工具的Subagents定义 agent-memory/<name>/ 项目和全局 ✓ Subagents的持久记忆 ~/.claude.json 仅全局 应用状态、OAuth、UI 开关、个人 MCP 服务器 projects/<project>/memory/ 仅全局 自动记忆：CSC 跨会话给自己的笔记 keybindings.json 仅全局 自定义键盘快捷键 检查已加载的内容 ​ 此页面显示哪些文件可以存在。要查看当前会话中实际加载了什么，请使用以下命令： 命令 显示内容 /context 按类别的令牌使用：系统提示、记忆文件、Skills、MCP 工具和消息 /memory 哪些 AGENTS.md 和 rules 文件已加载，以及自动记忆条目 /agents 已配置的Subagents及其设置 /hooks 活跃的 hook 配置 /mcp 已连接的 MCP 服务器及其状态 /skills 来自项目、用户和Plugins源的可用Skill"
