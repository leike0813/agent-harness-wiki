official_url: "https://docs.costrict.ai/csc/configuration/permissions"
excerpt: "仅托管设置 ​ 以下设置仅从托管设置中读取。将它们放在用户或项目设置文件中没有效果。 设置 描述 allowedChannelPlugins 允许推送消息的通道插件白名单。设置后替换默认的 CoStrict 白名单。需要 channelsEnabled: true 。请参阅限制哪些通道插件可以运行 allowManagedHooksOnly 当为 true 时，仅加载托管钩子、SDK 钩子和在托管设置 enabledPlugins 中强制启用的插件钩子。用户、项目和所有其他插件钩子被阻止 allowManagedMcpServersOnly 当为 true 时，仅尊重托管设置中的 allowedMcpServers 。 deniedMcpServers 仍从所有来源合并。请参阅托管 MCP 配置 allowManagedPermissionRulesOnly 当为 true 时，阻止用户和项目设置定义 allow 、 ask 或 deny 权限规则。仅托管设置中的规则适用 blockedMarketplaces 市场来源黑名单。被阻止的来源在下载前检查，因此它们永远不会触及文件系统。请参阅托管市场限制 channelsEnabled 允许团队和企业用户使用通道。未设置或为 false 时，无论用户向 --channels 传递什么，都会阻止通道消息交付 forceRemoteSettingsRefresh 当为 true 时，阻止 CLI 启动，直到远程托管设置被新鲜获取，如果获取失败则退出。请参阅故障关闭强制执行 pluginTrustMessage 安装前显示的插件信任警告后附加的自定义消息 sandbox.filesystem.allowManagedReadPathsOnly 当为 true 时，仅尊重托管设置中的 filesystem.allowRead 路径。"
