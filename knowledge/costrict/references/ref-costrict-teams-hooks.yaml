excerpt: "使用Hooks在队友完成工作或任务被创建或完成时强制执行规则： TeammateIdle ：当队友即将空闲时运行。以代码 2 退出可发送反馈并让队友继续工作。 TaskCreated ：当任务被创建时运行。以代码 2 退出可阻止创建并发送反馈。 TaskCompleted ：当任务被标记为完成时运行。以代码 2 退出可阻止完成并发送反馈。 Agent teams的工作原理 ​ 本节介绍Agent teams背后的架构和机制。如果你想开始使用它们，请参见上面的控制你的Agent teams。 CSC 如何启动Agent teams ​ Agent teams有两种启动方式： 你请求一个团队 ：给 CSC 一个受益于并行工作的任务，并明确要求创建Agent teams。CSC 根据你的指示创建一个。 CSC 建议一个团队 ：如果 CSC 确定你的任务受益于并行工作，它可能会建议创建一个团队。在继续之前你需要确认。 在这两种情况下，你保持控制。CSC 不会在未经你批准的情况下创建团队。 架构 ​ Agent teams由以下部分组成： 组件 角色 团队负责人 创建团队、生成队友并协调工作的主"
