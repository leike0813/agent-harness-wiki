excerpt: "Subagents是带有 YAML frontmatter 的 Markdown 文件。根据作用域将它们存储在不同的位置。当多个Subagents共享相同名称时，更高优先级的位置获胜。 位置 作用域 优先级 如何创建 托管设置 组织范围 1（最高） 通过托管设置部署 --agents CLI 标志 当前会话 2 启动 CSC 时传递 JSON .costrict/agents/ 当前项目 3 交互式或手动 ~/.costrict/agents/ 你的所有项目 4 交互式或手动 Plugins的 agents/ 目录 启用Plugins的位置 5（最低） 随Plugins安装 项目Subagents （ .costrict/agents/ ）非常适合特定于代码库的Subagents。将它们提交到版本控制，以便你的团队可以协作使用和改进它们。 项目Subagents通过从当前工作目录向上遍历来发现。使用 --add-dir 添加的目录仅授予文件访问权限，不会扫描Subagents。要跨项目共享Subagents，使用 ~/.costrict/agents/ 或Plugins。 用户Subagents （ ~/.costrict/agents/ ）是在你所有项目中可用的个人Subagents。 CLI 定义的Subagents 在启动 CSC 时作为 JSON 传递。它们仅在该会话中存在，不会保存到磁盘，适合快速测试或自动化脚本。你可以在单个 --agents 调用中定义多个Subagents： csc --agents '{ \"code-reviewer\": { \"description\": \"Expert code reviewer. Use proactively after code changes.\", \"prompt\": \"You are a senior code"
