excerpt: "在 CSC 内部运行 /status 以查看哪些设置源处于活动状态以及它们来自哪里。输出显示每个配置层（托管、用户、项目）及其来源，例如 Enterprise managed settings (remote) 、 Enterprise managed settings (plist) 、 Enterprise managed settings (HKLM) 或 Enterprise managed settings (file) 。如果设置文件包含错误， /status 会报告问题以便您修复。 配置系统的要点 ​ 记忆文件（ AGENTS.md ） ：包含 CSC 在启动时加载的指令和上下文 设置文件（JSON） ：配置权限、环境变量和工具行为 技能 ：可以使用 /skill-name 调用或由 CSC 自动加载的自定义提示 MCP 服务器 ：使用附加工具和集成扩展 CSC 优先级 ：更高级别的配置（托管）覆盖较低级别的（用户/项目） 继承 ：设置被合并，更具体的设置添加到或覆盖更广泛的设置 系统提示 ​ CSC 的内部系统提示未发布。要添加自定义指令，请使用 AGENTS.md 文"
