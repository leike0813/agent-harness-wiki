excerpt: "MCP 服务器可以在三个作用域中配置。您选择的作用域控制服务器在哪些项目中加载，以及配置是否与团队共享。 作用域 加载范围 是否与团队共享 存储位置 Local 仅当前项目 否 ~/.costrict.json Project 仅当前项目 是，通过版本控制 项目根目录中的 .mcp.json User 所有您的项目 否 ~/.costrict.json Local 作用域 ​ Local 作用域是默认值。Local 作用域的服务器仅在您添加它的项目中加载，并且对您是私有的。CSC 将其存储在 ~/.costrict.json 中该项目路径下，因此同一服务器不会出现在您的其他项目中。将 Local 作用域用于个人开发服务器、实验性配置或包含您不想放入版本控制的凭据的服务器。 注意： MCP 服务器的\"local 作用域\"术语与一般本地设置不同。MCP Local 作用域的服务器存储在 ~/.costrict.json （您的主目录）中，而一般本地设置使用 .costrict/settings.local.json （在项目目录中）。有关设置文件位置的详细信息，请参阅设置。 # 添加 Local 作用域的服务器（默认） csc mcp add --transport http stripe https://mcp.stripe.com # 明确指定 local 作用域 csc mcp add --transport http stripe --scope local https://mcp.stripe.com 该命令将服务器写入 ~/.costrict.json 中当前项目的条目。以下示例显示了从 /path/to/your/project 运行时的结果： { \"projects\" : { \"/path/to/your/project\" : { \"mcpServers\" :"
