excerpt: "/permissions 管理工具权限的允许、询问和拒绝规则。打开交互式对话框，你可以按范围查看规则、添加或删除规则、管理工作目录以及查看最近的自动模式拒绝。别名： /allowed-tools /plan [description] 直接从提示进入计划模式。传递可选描述以进入计划模式并立即开始该任务，例如 /plan fix the auth bug /plugin 管理 CSC 插件 /powerup 通过带有动画演示的快速交互式课程发现 CSC 功能 /pr-comments [PR] 已在 v2.1.91 中移除。请直接让 CSC 查看拉取请求评论。在更早版本中，从 GitHub 拉取请求获取并显示评论；自动检测当前分支的 PR，或传递 PR URL 或编号。需要 gh CLI /privacy-settings 查看和更新你的隐私设置。仅对 Pro 和 Max 订阅者可用 /re"
