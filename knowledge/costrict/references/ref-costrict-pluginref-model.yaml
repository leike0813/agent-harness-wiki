excerpt: "是一个自包含的组件目录，通过自定义功能扩展 CSC。插件组件包括技能、代理、钩子、MCP 服务器和 LSP 服务器。 插件组件参考 ​ 技能 ​ 插件为 CSC 添加技能，创建 /name 快捷方式，供你或 CSC 调用。 位置 ：插件根目录的 skills/ 或 commands/ 目录 文件格式 ：技能是包含 SKILL.md 的目录；命令是简单的 Markdown 文件 技能结构 ： skills/ ├── pdf-processor/ │ ├── SKILL.md │ ├── reference.md (可选) │ └── scripts/ (可选) └── code-reviewer/ └── SKILL.md 集成行为 ： 技能和命令在插件安装时自动发现 CSC 可以根据任务上下文自动调用它们 技能可以在 SKILL.md 旁边包含支持文件 完整详情请参阅技能。 代理 ​ 插件可以提供专门的子代理，用于特定任务，CSC 可以在适当时自动调用。 位置 ：插件根目录的 agents/ 目录 文件格式 ：描述代理功能的 Markdown 文件 代理结构 ： --- name : agent - name description : 此代理擅长什么以及 CSC 何时应调用它 model : sonnet effort : medium maxTurns : 20 disallowedTools : Write , Edit --- 描述代理角色、专业知识和行为的详细系统提示。 插件代理支持 name 、 description 、 model 、 effort 、 maxT"
