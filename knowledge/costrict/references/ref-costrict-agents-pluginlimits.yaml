excerpt: "出于安全原因，PluginsSubagents不支持 hooks 、 mcpServers 或 permissionMode frontmatter 字段。从Plugins加载代理时，这些字段会被忽略。如果你需要它们，将代理文件复制到 .costrict/agents/ 或 ~/.costrict/agents/ 。你也可以在 settings.json 或 settings.local.json 中的 permissions.allow 中添加规则，但这些规则适用于整个会话，而不仅仅是PluginsSubagents。 来自任何这些作用域的Subagents定义也可用于Agent teams：在生成队友时，你可以引用Subagents类型，队友使用其 tools 和 model ，并将定义的正文附加到队友的系统提示作为额外指令。有关在该路径上适用的 frontmatter 字段，请参阅Agent teams。 编写Subagents文件 ​ Subagents文件使用 YAML frontmatter 进行配置，后跟 Markdown 格式的系统提示： 注意： Subagents在会"
