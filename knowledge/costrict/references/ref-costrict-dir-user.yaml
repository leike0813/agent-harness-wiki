excerpt: "以下文件位于你的项目目录中。 AGENTS.md ​ 简介： CSC 每次会话都会读取的项目指令 何时加载： 在每次会话开始时加载到上下文中 描述： 特定于项目的指令，决定 CSC 在此仓库中的工作方式。将你的约定、常用命令和架构上下文放在这里，以便 CSC 以与你的团队相同的假设运行。 提示： 目标控制在 200 行以内。更长的文件仍会完整加载，但可能会降低遵循度 AGENTS.md 会加载到每个会话中。如果某些内容只与特定任务相关，请将其移到 skill 或路径范围的 rule 中，这样只会在需要时加载 列出你最常运行的命令，如构建、测试和格式化，这样 CSC 无需你每次都拼写出来 运行 /memory 可以在会话中打开和编辑 AGENTS.md 也可以放在 .costrict/AGENTS.md ，如果你希望保持项目根目录整洁 示例说明： 此示例适用于 TypeScript 和 React 项目。它列出了构建和测试命令、CSC 应遵循的框架约定，以及项目特定规则（如导出风格和文件布局）。 # 项目约定 ## 命令 - 构建： `npm run build` - 测试： `npm"
