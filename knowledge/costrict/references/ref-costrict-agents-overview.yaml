excerpt: "Subagents是处理特定类型任务的专门 AI 助手。当某个附带任务会产生大量搜索结果、日志或你不会再引用的文件内容时，使用Subagents：Subagents在自己的上下文中完成工作，只返回摘要。当你不断用相同指令生成同一种工作程序时，定义一个自定义Subagent。 每个Subagent在自己的上下文窗口中运行，具有自定义系统提示、特定工具访问权限和独立权限。当 CSC 遇到与Subagents描述匹配的任务时，它会委托给该Subagents，Subagents独立工作并返回结果。要实际查看上下文节省效果，上下文窗口可视化功能演示了一个Subagents在其独立窗口中处理研究的会话。 注意： 如果你需要多个代理并行工作并相互通信，请参阅Agent teams。Subagents在单个会话内工作；Agent teams跨独立会话协调。 Subagents帮助你： 保留上下文 ——将探索和实现操作排除在主对话之外 强制约束 ——限制Subagents可以使用的工具 跨项目复用配置 ——通过用户级Subagents实现 专业化行为 ——为特定领域提供聚焦的系统提示 控制成本 ——将任务路由到更快、更便宜的模型，如 Haiku CSC 使用每个Subagents的描述来决定何时委托任务。创建Subagents时，请编写清晰的描述，以便 CSC 知道何时使用它。 CSC 包含多个内置Subagents，如 Explore 、 Plan 和 general-purpose 。你也可以创建自定义Subagents来处理特定任务。本页涵盖内置Subagents、如何创建自己的Subagents、完整配置选项、使用Subagents的模式以及示例Subagents。 内置Subagents ​ CSC 包含 CSC 在适当时自动使用的内置Subagents。每个Subagents继承"
