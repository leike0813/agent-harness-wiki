excerpt: "本文配置方式 对应 Key 项 OpenAI 兼容 OPENAI_API_KEY Anthropic 兼容 ANTHROPIC_AUTH_TOKEN Gemini API GEMINI_API_KEY 若此前还在系统环境变量、终端启动配置或其他配置来源中手动设置过同一枚 Key，也需要清理对应值，再重新打开终端。不要删除整个配置目录。不熟悉 JSON 编辑时，请先在服务商后台撤销 Key，再联系管理员协助清理本地值。 9. 常见问题与报错 ​ 不同服务商对错误码的定义可能不同。以下用于初步排查，请同时阅读报错正文和该服务商的错误说明。 现象或报错 常见原因 建议处理 401 、Authentication failed、Invalid API Key Key 错误、已失效，或 Key 与接口不匹配 重新复制有效 Key，检查首尾空格及签发平台；确认协议和地址；保存后新建对话重试 403 、Permission denied 无模型或项目权限，账号或网络访问策略受限 核对模型权限、项目权限及访问限制；由服务商或公司管理员确认 402 、Insufficient balance、额度不足"
