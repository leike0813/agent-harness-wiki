excerpt: "你已经创建了一个带有Skills的Plugins，但Plugins可以包含更多内容：自定义代理、Hooks、MCP 服务器和 LSP 服务器。 ⚠️ 警告： 常见错误 ：不要将 commands/ 、 agents/ 、 skills/ 或 hooks/ 放在 .claude-plugin/ 目录内。只有 plugin.json 放在 .claude-plugin/ 中。所有其他目录必须位于Plugins根目录级别。 目录 位置 用途 .claude-plugin/ Plugins根目录 包含 plugin.json 清单（如果组件使用默认位置则可选） skills/ Plugins根目录 以 <name>/SKILL.md 目录形式的Skills commands/ Plugins根目录 以扁平 Markdown 文件形式的Skills。新Plugins请使用 skills/ agents/ Plugins根目录 自定义代理定义 hooks/ Plugins根目录 hooks.json 中的事件处理器 .mcp.json Plugins根目录 MCP 服务器配置 .lsp.json Plugins根目录 用于代码智能的 LSP 服务器配置 bin/ Plugins根目录 Plugins启用时添加到 Bash 工具 PATH 的可执行文件 settings.json Plugins根目录 Plugins启用时应用的默认设置 注意： 下一步 ：准备好添加更多功能？跳转到开发更复杂的Plugins以添加代理、Hooks、MCP 服务器和 LSP 服务器。有关所有Plugins组件的完整技术规范，请参阅Plugins参考。 开发更复杂的Plugins ​ 当你熟悉了基本Plugins后，就可以创建更复杂的扩展。 为Plugins添加Skills ​ Plugins可以包含代理Sk"
