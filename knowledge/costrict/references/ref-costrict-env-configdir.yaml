  heading: CLAUDE_CONFIG_DIR
official_url: "https://docs.costrict.ai/csc/reference/env-vars"
excerpt: "覆盖配置目录（默认： ~/.costrict ）。所有设置、凭据、会话历史和插件都存储在此路径下。适用于并行运行多个账户：例如， alias csc-work='CLAUDE_CONFIG_DIR=~/.claude-work csc' CLAUDE_ENABLE_STREAM_WATCHDOG 设置为 1 以中止停滞 90 秒无数据的 API 响应流。在自动化环境中（挂起的会话不会被注意到）或在静默断开连接的代理后面有用。没有此设置时，停滞的流可能会无限期挂起会话，因为请求超时仅覆盖初始连接。使用 CLAUDE_STREAM_IDLE_TIMEOUT_MS 配置超时 CLAUDE_ENV_FILE CSC 在每次 Bash 命令之前 source 的 shell 脚本路径。用于在命令之间持久化 virtualenv 或 conda 激活。也由 SessionStart、CwdChanged 和 FileChanged 钩子动态填充 CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX 未提供显式名称时自动生成的远程控制会话名称的前缀。默认为机器的主机名，"
