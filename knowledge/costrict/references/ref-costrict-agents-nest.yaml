excerpt: "如果你的工作流需要嵌套委托，使用Skills或从主对话链式调用Subagents。 管理Subagents上下文 ​ 恢复Subagents ​ 每次Subagents调用都会创建一个具有新上下文的新实例。要继续现有Subagents的工作而不是从头开始，让 CSC 恢复它。 恢复的Subagents保留其完整的对话历史，包括所有之前的工具调用、结果和推理。Subagents从它停止的地方继续，而不是重新开始。 当Subagents完成时，CSC 接收其代理 ID。CSC 使用 SendMessage 工具，以代理的 ID 作为 to 字段来恢复它。 SendMessage 工具仅在通过 CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 启用Agent teams时可用。 要恢复Subagents，让 CSC 继续之前的工作： Use the code-revi"
