excerpt: "安装插件时，你选择一个 范围 ，决定插件在哪里可用以及谁可以使用： 范围 设置文件 用途 user ~/.costrict/settings.json 跨所有项目可用的个人插件（默认） project .costrict/settings.json 通过版本控制共享的团队插件 local .costrict/settings.local.json 项目特定插件，被 gitignore managed 托管设置 托管插件（只读，仅可更新） 插件使用与 CSC 其他配置相同的范围系统。有关安装说明和范围标志，请参阅安装插件。有关范围的完整说明，请参阅配置范围。 插件清单模式 ​ .claude-plugin/plugin.json 文件定义了插件的元数据和配置。本节记录所有支持的字段和选项。 清单是可选的。如果省略，CSC 会自动发现默认位置中的组件，并从目录名派生插件名称。当你需要提供元数据或自定义组件路径时，请使用清单。 完整模式 ​ { \"name\" : \"plugin-name\" , \"version\" : \"1.2.0\" , \"description\" : \"简要插件描述\" , \"author\" : { \"name\" : \"作者姓名\" , \"email\" : \"author@example.com\" , \"url\" : \"https://github.com/author\" } , \"homepage\" : \"https://docs.example.com/plugin\" , \"repository\" : \"https://github.com/author/plugi"
