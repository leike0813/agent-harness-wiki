excerpt: "CSC 使用 范围系统 来确定配置的应用位置和共享对象。了解范围有助于您决定如何为个人使用、团队协作或企业部署配置 CSC。 可用范围 ​ 范围 位置 影响对象 与团队共享？ 托管 服务器管理的设置、plist / 注册表或系统级 managed-settings.json 机器上的所有用户 是（由 IT 部署） 用户 ~/.costrict/ 目录 您，跨所有项目 否 项目 仓库中的 .costrict/ 此仓库的所有协作者 是（提交到 git） 本地 .costrict/settings.local.json 您，仅在此仓库中 否（gitignored） 何时使用各范围 ​ 托管范围 适用于： 必须在全组织范围内强制执行的安全策略 不可覆盖的合规要求 由 IT/DevOps 部署的标准化配置 用户范围 最适合： 您希望在所有地方使用的个人偏好（主题、编辑器设置） 您在所有项目中使用的工具和插件 API 密钥和身份验证（安全存储） 项目范围 最适合： 团队共享设置（权限、钩子、MCP 服务器） 整个团队应具备的插件 跨协作者标准化工具 本地范围 最适合： 特定项目的个人覆盖 在与团队共享之前测试配置 对其他人不适用的机器特定设置 范围如何交互 ​ 当同一设置在多个范围中配置时，更具体的范围优先： 托管 （最高） - 不能被任何东西覆盖 命令行参数 - 临时会话覆盖 本地 - 覆盖项目和用户设置 项目 - 覆盖用户设置 用户 （最低） - 当没有其他设置指定时应用 例如，如果某个权限在用户设置中被允许但在项目设置中被拒绝，则项目设置优先，该权限被阻止。 哪些功能使用范围 ​ 范"
