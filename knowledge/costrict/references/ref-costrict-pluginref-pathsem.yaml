  heading: "路径行为规则"
official_url: "https://docs.costrict.ai/csc/reference/plugins-reference"
excerpt: "对于 skills 、 commands 、 agents 和 outputStyles ，自定义路径替换默认目录。如果清单指定了 skills ，则不会扫描默认的 skills/ 目录。钩子、MCP 服务器和 LSP 服务器在处理多个来源时有不同的语义。 所有路径必须相对于插件根目录并以 ./ 开头 自定义路径中的组件使用相同的命名和命名空间规则 可以将多个路径指定为数组 要保留默认目录并为技能、命令、代理或输出样式添加更多路径，请在数组中包含默认路径： \"skills\": [\"./skills/\", \"./extras/\"] 当技能路径指向直接包含 SKILL.md 的目录时，例如 \"skills\": [\"./\"] 指向插件根目录， SKILL.md 中的 frontmatter name 字段决定技能的调用名称。这提供了一个稳定的名称，无论安装目录如何。如果 frontmatter 中未设置 name ，则使用目录基名作为回退。 路径示例 ： { \"commands\" : [ \"./specialized/deploy.md\" , \"./utilities/batch-process.md\" ] , \"agents\" : [ \"./custom-agents/reviewer.md\" , \"./custom-agents/tester.md\" ] } 环境变量 ​ CSC 提"
