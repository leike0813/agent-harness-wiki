excerpt: "在 CSC 4.2.38 中，通过上述 /login 表单填写的第三方 Key，会写入用户级 settings.json 的 env 配置中，以可读文本保存。这与 CoStrict 账号登录凭据的存储不是同一条路径。 默认位置为： 系统 用户配置文件 macOS ~/.costrict/settings.json Windows %USERPROFILE%\\.costrict\\settings.json 如果设置了自定义配置目录，实际位置会变化。不要公开上传该文件或将其作为普通项目文件分享。 安全注意事项 ​ Key 仅粘贴到对应配置输入框，不发送到聊天消息、群聊、Issue 或公开文档。 录屏、截图和提交日志前，遮挡整枚 Key，包括可能显示的前缀。检查配置导出文件，不能假定导出会自动移除密钥。 将 Key 交给谁，就可能允许谁使用对应账号的 API 额度。服务商支持时，为不同用途创建独立 Key，并设置必要的权限和额度限制。 Base URL 应来自可信服务商或公司管理员。把 Key 配到不可信地址，可能导致密钥泄露。 使用第三方模型处理代码或文档前，确认这些内容允许发送给对应服务商。 怀疑 Key 泄露时，立即到签发平台撤销旧 Key，再创建新 Key。仅在 CoStrict 中删除配置不能使泄露的 Key 失效。 8. 修改、更换与停用 API Key ​ 修改配置或更换 Key ​ VS Code 插件：进入“设置 → 提供商”，选中对应配置，替换 API Key，点击“保存”；返回对话面板，确认使用该配置并新建任务验证。 CSC：重新输入 /login ，选择相应协议，填写新的 Key；如更换服务商，同时更新 Base URL 和全部模型映射。保存后使用 /model 确认模型，再新建对话验证。 正常轮换 Key 时，先创建并验证新 Key，再到服务商后台撤销旧"
