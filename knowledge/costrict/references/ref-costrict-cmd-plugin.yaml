excerpt: "/plugin 管理 CSC 插件 /powerup 通过带有动画演示的快速交互式课程发现 CSC 功能 /pr-comments [PR] 已在 v2.1.91 中移除。请直接让 CSC 查看拉取请求评论。在更早版本中，从 GitHub 拉取请求获取并显示评论；自动检测当前分支的 PR，或传递 PR URL 或编号。需要 gh CLI /privacy-settings 查看和更新你的隐私设置。仅对 Pro 和 Max 订阅者可用 /release-notes 在交互式版本选择器中查看更新日志。选择特定版本查看其发行说明，或选择显示所有版本 /reload-plugins 重新加载所有活动插"
