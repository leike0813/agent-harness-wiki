excerpt: "由组织管理员部署。将 markdown 文件放在托管设置目录内的 .costrict/agents/ 中，使用与项目和用户Subagents相同的 frontmatter 格式。托管定义优先于同名项目和用户Subagents。 PluginsSubagents 来自你安装的Plugins。它们与你的自定义Subagents一起出现在 /agents 中。有关创建PluginsSubagents的详细信息，请参阅Plugins组件参考。 注意： 出于安全原因，PluginsSubagents不支持 hooks 、 mcpServers 或 permissionMode frontmatter 字段。从Plugins加载代理时，这些字段会被忽略。如果你需要它们，将代理文件复制到 .costrict/agents/ 或 ~/.costrict/agents/ 。你也可以在 settings.json 或 settings.local.json 中的 permissions.allow 中添加规则，但这些规则适用于整个会话，而不仅仅是PluginsSubagents。 来自任何这些作用域的Su"
