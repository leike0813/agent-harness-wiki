excerpt: "/status 打开设置界面（状态选项卡），显示版本、模型、账户和连接状态。在 CSC 响应时也可工作，无需等待当前响应完成 /statusline 配置 CSC 的状态行。描述你想要的内容，或在不带参数的情况下运行以从你的 shell 提示自动配置 /stickers 订购 CSC 贴纸 /tasks 列出和管理后台任务。也可用 /bashes /teleport 将 CSC 网页版会话拉入此终端：打开选择器，然后获取分支和对话。也可用 /tp 。需要 costrict.ai 订阅 /terminal-setup 配置终端的 Shift+Enter 和其他快捷键的键绑定。仅在需要它的终端中可见，如 VS Code、Alacritty 或 Warp /theme 更改颜色主题。包括浅色和深色变体、色盲可访问（daltonized）主题以及使用终端调色板的 ANSI 主题 /ultrapla"
