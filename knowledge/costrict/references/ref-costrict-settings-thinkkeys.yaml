excerpt: "默认为所有会话启用扩展思考。通常通过 /config 命令配置，而不是直接编辑 true apiKeyHelper 自定义脚本，在 /bin/sh 中执行，用于生成认证值。此值将作为模型请求的 X-Api-Key 和 Authorization: Bearer 头发送 /bin/generate_temp_api_key.sh attribution 自定义 git 提交和拉取请求的归属。参见归属设置 {\"commit\": \"🤖 Generated with CSC\", \"pr\": \"\"} autoMemoryDirectory 自动记忆存储的自定义目录。接受 ~/ 展开的路径。在项目设置（ .costrict/settings.json ）中不接受，以防止共享仓库将记忆写入重定向到敏感位置。从策略、本地和用户设置中接受 \"~/my-memory-dir\" autoMode 自定义自动模式分类器阻止和允许的内容。包含 environment 、 allow 和 soft_deny 散文规则数组。参见配置自动模式分类器。不从共享项目设置中读取 {\"environment\": [\"Trusted repo: github.example.com/acme\"]} autoUpdatesChannel 更新遵循的发布通道。使用 \"stable\" 获取通常约一周前且跳过重大回归的版本，或 \"latest\" （默认）获取最新发布 \"stable\" availableModels 限制用户可通过 /model 、 --model 、配置工具或 ANTHROPIC_MODEL 选择的模型。不影"
