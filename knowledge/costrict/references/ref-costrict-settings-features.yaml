excerpt: "范围适用于许多 CSC 功能： 功能 用户位置 项目位置 本地位置 设置 ~/.costrict/settings.json .costrict/settings.json .costrict/settings.local.json 子代理 ~/.costrict/agents/ .costrict/agents/ 无 MCP 服务器 ~/.claude.json .mcp.json ~/.claude.json （按项目） 插件 ~/.costrict/settings.json .costrict/settings.json .costrict/settings.local.json AGENTS.md ~/.costrict/AGENTS.md AGENTS.md 或 .costrict/AGENTS.md AGENTS.local.md 设置文件 ​ settings.json 文件是通过分层设置配置 CSC 的官方机制： 用户设置 定义在 ~/.costrict/settings.json 中，适用于所有项目。 项目设置 保存在您的项目目录中： .costrict/settings.json 用于签入源代码控制并与团队共享的设置 .costrict/settings.local.json 用于未签入的设置，适用于个人偏好和实验。CSC 在创建时会配置 git 忽略 .costrict/settings.local.json 。 托管设置 ：对于需要集中控制的组织，CSC 支持多种托管设置的交付机制。所有机制使用相同的 JSON 格式，且不能被用户或项目设置覆盖： 服务"
