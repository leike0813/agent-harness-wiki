excerpt: "标志在开发期间测试Plugins。这会直接加载你的Plugins，无需安装。 csc --plugin-dir ./my-plugin 当 --plugin-dir Plugins与已安装的市场Plugins同名时，本地副本在该会话中优先。这让你可以测试已安装Plugins的更改，而无需先卸载它。由托管设置强制启用的市场Plugins是唯一的例外，无法被覆盖。 当你对Plugins进行更改时，运行 /reload-plugins 以获取更新而无需重启。这会重新加载Plugins、Skills、代理、Hooks、Plugins MCP 服务器和Plugins LSP 服务器。测试你的Plugins组件： 使用 /plugin-name:skill-name 尝试你的Skills 检查代理是否出现在 /agents 中 验证Hooks是否按预期工作 💡 提示： 你可以通过多次指定标志来一次加载多个Plugins： csc --plugin-dir ./plugin-one --plugin-dir ./plugin-two 调试Plugins问题 ​ 如果你的Plugins没有按预期工作： 检查结构 ：确保你的目录位于Plugins根目录，而不是 .claude-plugin/ 内 单独测试组件 ：分别检查每个Skills、代理和Hooks 使用验证和调试工具 ：有关 CLI 命令和故障排除技术，请参阅调试和开发工具 分享你的Plugins ​ 当你的Plugins准备好分享时： 添加文档 ：包含带有安装和使用说明的 README.md 为Plugins设置版本 ：在 plugin"
