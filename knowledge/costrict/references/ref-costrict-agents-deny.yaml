  heading: "禁用特定Subagents"
official_url: "https://docs.costrict.ai/csc/agent/sub-agents"
excerpt: "你可以通过将特定Subagents添加到设置中的 deny 数组来阻止 CSC 使用它们。使用格式 Agent(subagent-name) ，其中 subagent-name 匹配Subagents的 name 字段。 { \"permissions\" : { \"deny\" : [ \"Agent(Explore)\" , \"Agent(my-custom-agent)\" ] } } 这适用于内置和自定义Subagents。你也可以使用 --disallowedTools CLI 标志： csc --disallowedTools \"Agent(Explore)\" 有关权限规则的更多详细信息，请参阅权限文档。 为Subagents定义Hooks ​ Subagents可以定义在Subagents生命周期期间运行的Hooks。有两种配置Hooks的方式： 在Subagents的 frontmatter 中 ：定义仅在该Subagents活跃时运行的Hooks 在 settings.json 中 ：定义在Subagents启动或停止时在主会话中运行的Hooks Subagents frontm"
