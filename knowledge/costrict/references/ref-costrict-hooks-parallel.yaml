excerpt: "所有匹配的 hooks 并行运行，相同的处理程序会自动去重。命令 hooks 按命令字符串去重，HTTP hooks 按 URL 去重。处理程序在当前目录中使用 CSC 的环境运行。 $CLAUDE_CODE_REMOTE 环境变量在远程 Web 环境中设置为 \"true\" ，在本地 CLI 中未设置。 通过路径引用脚本 ​ 使用环境变量相对于项目或插件根目录引用 hook 脚本，无论 hook 运行时的工作目录如何： $CLAUDE_PROJECT_DIR ：项目根目录。用引号包裹以处理包含空格的路径。 ${CLAUDE_PLUGIN_ROOT} ：插件的安装目录，用于随插件打包的脚本。每次插件更新时更改。 ${CLAUDE_PLUGIN_DATA} ：插件的持久数据目录，用于应在插件更新后保留的依赖和状态。 项目脚本 ​ 此示例使用 $CLAUDE_PROJECT_DIR 在任何 Wr"
