  heading: "调试 Hooks"
official_url: "https://docs.costrict.ai/csc/reference/hooks"
excerpt: "Hook 执行详细信息，包括哪些 hooks 匹配、它们的退出码以及完整的 stdout 和 stderr，都写入调试日志文件。使用 csc --debug-file <path> 启动 CSC 以将日志写入已知位置，或运行 csc --debug 并在 ~/.costrict/debug/<session-id>.txt 处读取日志。 --debug 标志不会打印到终端。 [DEBUG] Executing hooks for PostToolUse:Write [DEBUG] Found 1 hook commands to execute [DEBUG] Executing hook command: <Your command> with timeout 600000ms [DEBUG] Hook command completed with status 0: <Your stdout> 要获取更细粒度的 hook 匹配详细信息，请设置 CLAUDE_CODE_DEBUG_LOG_LEVEL=verbose 以查看额外的日志行，如 hook 匹配器计数和查询匹配。 有关常见问题的故障排除，如 hooks 未触发、无限 Stop hook 循环或配置错误，请参阅指南中的限制和故障排除。"
