excerpt: "要在不移除的情况下临时禁用所有 hooks，请在设置文件中设置 \"disableAllHooks\": true 。无法在保留配置中的单个 hook 的同时禁用它。 disableAllHooks 设置遵循托管设置的层级结构。如果管理员已通过托管策略设置配置了 hooks，则在用户、项目或本地设置中设置的 disableAllHooks 无法禁用那些托管 hooks。只有在托管设置级别设置的 disableAllHooks 才能禁用托管 hooks。 对设置文件中 hooks 的直接编辑通常会由文件监视器自动检测。 Hook 输入和输出 ​ 命令 hooks 通过 stdin 接收 JSON 数据，并通过退出码、stdout 和 stderr 传回结果。HTTP hooks 接收相同的 JSON 作为 POST 请求体，并通过 HTTP 响应体传回结果。本节涵盖所有事件共有的字段和行为。Hook 事件下每个事件的部分包括其特定的输入模式和决策控制选项。 通用输入字段 ​ Hook 事件除了每个 hook 事件部分中记录的事件特定字段外，还接收这些字段作为 JSON。对于命令 hooks，"
