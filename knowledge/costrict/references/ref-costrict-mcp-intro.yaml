  heading: "通过 MCP 将 CSC 连接到工具"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "CSC 可以通过模型上下文协议（MCP）连接到数百个外部工具和数据源，这是一个用于 AI-工具集成的开源标准。MCP 服务器使 CSC 能够访问您的工具、数据库和 API。 当您发现自己从其他工具（如问题跟踪器或监控仪表板）复制数据到聊天中时，请连接服务器。连接后，CSC 可以直接读取和操作该系统，而不是基于您粘贴的内容工作。 使用 MCP 可以做什么 ​ 连接 MCP 服务器后，您可以要求 CSC 执行以下操作： 根据问题跟踪器实现功能 ：\"添加 JIRA 问题 ENG-4521 中描述的功能并在 GitHub 上创建 PR。\" 分析监控数据 ：\"检查 Sentry 和 Statsig 以查看 ENG-4521 中描述功能的使用情况。\" 查询数据库 ：\"根据我们的 PostgreSQL 数据库，查找使用了功能 ENG-4521 的 10 个随机用户的电子邮件。\" 集成设计 ：\"根据 Slack 中发布的新 Figma 设计更新我们的标准电子邮件模板\" 自动化工作流 ：\"创建 Gmail 草稿，邀请这 10 个用户参加关于新功能的反馈会议。\" 响应外部事件 ：MCP 服务器还可以充当频"
