excerpt: "命令打开一个标签式界面来管理Subagents。 Running 标签页显示正在运行的Subagents，并允许你打开或停止它们。 Library 标签页允许你： 查看所有可用的Subagents（内置、用户、项目和Plugins） 通过引导设置或 CSC 生成创建新Subagents 编辑现有Subagents配置和工具访问权限 删除自定义Subagents 当存在重复时查看哪些Subagents处于活动状态 这是创建和管理Subagents的推荐方式。对于手动创建或自动化，你也可以直接添加Subagents文件。 要在不启动交互式会话的情况下从命令行列出所有已配置的Subagents，运行 csc agents 。这会显示按来源分组的代理，并指示哪些被更高优先级的定义覆盖。 选择Subagents作用域 ​ Subagents是带有 YAML frontmatter 的 Markdown 文件。根据作用域将它们存储在不同的位置。当多个Subagents共享相同名称时，更高优先级的位置获胜。 位置 作用域 优先级 如何创建 托管设置 组织范围 1（最高） 通过托管设置部署 --agents CLI 标志 当前会话 2 启动 CSC 时传递 JSON .costrict/agents/ 当前项目 3 交互式或手动 ~/.costrict/agents/ 你的所有项目 4 交互式或手动 Plugins的 agents/ 目录 启用Plugins的位置 5（最低） 随Plugins安装 项目Subagents （ .costrict/agents/ ）非常适合特定于代码库的Subagents。将它们提交到版本控制，以便你的团队可以协作使用和改进它们。 项目Subagents通过从当前工作目录向上遍历来发现。使用 --add-dir 添加的目录仅授予文件访问权限，不会扫描Suba"
