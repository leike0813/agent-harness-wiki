excerpt: "Agent teams让你可以协调多个 CSC 实例协同工作。一个会话充当团队负责人，协调工作、分配任务和综合结果。队友独立工作，各自在自己的上下文窗口中，并直接相互通信。 与Subagents不同——Subagents在单个会话内运行，只能向主代理汇报——你还可以直接与各个队友交互，无需通过负责人。 本页涵盖： 何时使用Agent teams，包括最佳用例以及与Subagents的比较 启动团队 控制队友，包括显示模式、任务分配和委派 并行工作的最佳实践 何时使用Agent teams ​ Agent teams在并行探索能带来真正价值的任务中最有效。完整的场景示例请参见用例示例。最佳用例包括： 研究和审查 ：多个队友可以同时调查问题的不同方面，然后分享并质疑彼此的发现 新模块或功能 ：队友可以各自拥有独立的部分，互不干扰 竞争性假设调试 ：队友并行测试不同理论，更快地收敛到答案 跨层协调 ：涉及前端、后端和测试的变更，每个由不同的队友负责 Agent teams会增加协调开销，并且比单个会话消耗明显更多的 token。当队友可以独立操作时效果最佳。对于顺序任务、同文件编辑或有许多依赖关系的工作，单个会话或Subagents更有效。 与Subagents的比较 ​ Agent teams和Subagents都允许你并行化工作，但它们的运作方式不同。根据你的工作者是否需要相互通信来选择： Subagents Agent teams 上下文 拥有上下文窗口；结果返回给调用者 拥有上下文窗口；完全独立 通信 仅向主代理汇报结果 队友直接相互发消息 协调 主代理管理所有工作 共享任务列表，自我协调 最适合 只关注结果的聚焦任务 需要讨论和协作的复杂工作 Token 成本 较低：结果汇总回主上下文 较高：每个队友是独立的 CSC 实例 当你需要快速、聚焦且只需汇报结果的工作者时，使"
