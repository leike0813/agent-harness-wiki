excerpt: "运行 csc plugin validate 或 /plugin validate 检查 plugin.json 、技能/代理/命令 frontmatter 和 hooks/hooks.json 的语法和模式错误 技能未出现 目录结构错误 确保 skills/ 或 commands/ 在插件根目录，而不是在 .claude-plugin/ 内部 钩子未触发 脚本不可执行 运行 chmod +x script.sh MCP 服务器失败 缺少 ${CLAUDE_PLUGIN_ROOT} 对所有插件路径使用变量 路径错误 使用了绝对路径 所有路径必须相对并以 ./ 开头 LSP Executable not found in $PATH 语言服务器未安装 安装二进制文件（例如 npm install -g typescript-language-server typescript ） 示例错误消息 ​ 清单验证错误 ： Invalid JSON syntax: Unexpected token } in JSON at position 142 ：检查是否缺少逗号、多余逗号或未加引号的字符串 Plugin has an invalid manifest file at .claude-plugin/plugin.json. Validation errors: name: Required ：缺少必填字段 Plugin has a corrupt manifest file at .claude-plugin/plugin.json. JSON parse error: ... ：J"
