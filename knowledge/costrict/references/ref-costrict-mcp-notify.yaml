excerpt: "允许 MCP 服务器动态更新其可用工具、提示和资源，而无需断开和重新连接。当 MCP 服务器发送 list_changed 通知时，CSC 会自动刷新该服务器的可用功能。 通过频道推送消息 ​ MCP 服务器还可以直接将消息推送到您的会话中，以便 CSC 可以响应外部事件，如 CI 结果、监控警报或聊天消息。要启用此功能，您的服务器需要声明 claude/channel 能力，并在启动时使用 --channels 标志选择启用。请参阅频道以使用官方支持的频道，或参阅频道参考以构建您自己的频道。 💡 提示： 提示： 使用 --scope 标志指定配置存储位置： local （默认）：仅在当前项目中可供您使用（在旧版本中称为 project ） project ：通过 .mcp.json 文件与项目中的所有人共享 user ：在所有项目中可供您使用（在旧版本中称为 global ） 使用 --"
