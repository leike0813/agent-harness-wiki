excerpt: "当会话开始或恢复时 UserPromptSubmit 当你提交提示时，在 CSC 处理它之前 PreToolUse 在工具调用执行之前。可以阻止它 PermissionRequest 当权限对话框出现时 PermissionDenied 当工具调用被自动模式分类器拒绝时。返回 {retry: true} 告知模型可以重试被拒绝的工具调用 PostToolUse 在工具调用成功之后 PostToolUseFailure 在工具调用失败之后 Notification 当 CSC 发送通知时 SubagentStart 当子代理被创建时 SubagentStop 当子代理完成时 TaskCreated 当通过 TaskCreate 创建任务时 TaskCompleted 当任务被标记为完成时 Stop 当 CSC 完成响应时 StopFailure 当轮次因 API 错误而结束时。输出和退出码被忽略 TeammateIdle 当代理团队的队友即将进入空闲状态时 InstructionsLoaded 当 AGENTS.md 或 .costrict/rules/*.md 文件被加载到上下文中时。在会话开始时以及文件在会话期间被延迟加载时触发 ConfigChange 当配置文件在会话期间更改时 CwdChanged 当工作目录更改时，例如当 CSC 执行 cd 命令时。适用于与 direnv 等工具的响应式环境管理 FileChanged 当监视的文件在磁盘上更改时。 matcher 字段指定要监视的文件名 WorktreeCreate 当通过 --worktree 或 isolation: \"worktree\" 创建工作树时。替换默认的 git 行为 WorktreeRemove 当工作树被移除时，要么在会话退出时，要么在子代理完成时 PreCompact 在上下文压缩之前 Pos"
