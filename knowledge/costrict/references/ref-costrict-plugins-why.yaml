excerpt: "CSC 支持两种添加自定义Skills、代理和Hooks的方式： 方式 Skills名称 最适合 独立配置 （ .costrict/ 目录） /hello 个人工作流、项目特定自定义、快速实验 Plugins （包含 .claude-plugin/plugin.json 的目录） /plugin-name:hello 与队友共享、向社区分发、版本发布、跨项目复用 适合使用独立配置的情况 ： 你正在为单个项目自定义 CSC 配置是个人使用的，不需要共享 你正在打包之前实验Skills或Hooks 你想要简短的Skills名称，如 /hello 或 /deploy 适合使用Plugins的情况 ： 你想与团队或社区共享功能 你需要在多个项目中使用相同的Skills/代理 你想对扩展进行版本控制和轻松更新 你正在通过市场分发 你可以接受带命名空间的Skills，如 /my-plugin:hello （命名空间防止Plugins之间的冲突） 💡 提示： 先在 .costrict/ 中使用独立配置进行快速迭代，当你准备好共享时再转换为Plugins。 快速入门 ​ 本快速入门将引导你创建一个带有自定义Skills的Plugins。你将创建一个清单（定义Plugins的配置文件），添加一个Skills，并使用 --plugin-dir 标志在本地测试它。 前提条件 ​ CSC 已安装并认证 注意： 如果你没有看到 /plugin 命令，请将 CSC 更新到最新版本。有关升级说明，请参阅故障排除。 创建你的第一个Plugins ​ 创建Plugins目录 ​ 每个Plugins都位于自己的目录中，包含清单和你的Skills、代理或Hooks。现在创建一个： mkdir my-first-plugin 创建Plugins清单 ​ .claude-plugin/plugin.json 处的"
