excerpt: "已弃用 ：改用 attribution 。是否在 git 提交和拉取请求中包含 co-authored-by CSC 署名（默认： true ） false includeGitInstructions 在 CSC 的系统提示中包含内置的提交和 PR 工作流指令以及 git 状态快照（默认： true ）。设置为 false 以移除两者，例如在使用您自己的 git 工作流技能时。设置时 CLAUDE_CODE_DISABLE_GIT_INSTRUCTIONS 环境变量优先于此设置 false language 配置 CSC 的首选响应语言（例如 \"japanese\" 、 \"spanish\" 、 \"french\" ）。CSC 将默认以此语言响应。还设置语音听写语言 \"japanese\" model 覆盖 CSC 使用的默认模型 \"claude-sonnet-4-6\" modelOverrides 将 CoStrict 模型 ID 映射到提供商特定的模型 ID，如 Bedrock 推理配置文件 ARN。每个模型选择器条目在调用提供商 API 时使用其映射值。参见按版本覆盖模型 ID {\"claude-opus-4-6\": \"arn:aws:bedrock:...\"} otelHeadersHelper 生成动态 OpenTelemetry 头的脚本。在启动时和定期运行（参见动态头） /"
