excerpt: "MCP 服务器可以暴露提示，这些提示在 CSC 中可用作命令。 执行 MCP 提示 ​ 步骤 1：发现可用提示 ​ 输入 / 查看所有可用命令，包括来自 MCP 服务器的命令。MCP 提示以 /mcp__servername__promptname 格式显示。 步骤 2：执行不带参数的提示 ​ /mcp__github__list_prs 步骤 3：执行带参数的提示 ​ 许多提示接受参数。在命令后以空格分隔传递： /mcp__github__pr_review 456 /mcp__jira__create_issue \"登录流程中的 Bug\" high 💡 提示： 提示： MCP 提示从已连接的服务器动态发现 参数根据提示定义的参数进行解析 提示结果直接注入到对话中 服务器和提示名称被规范化（空格变为下划线） 托管 MCP 配置 ​ 对于需要集中控制 MCP 服务器的组织，CSC 支持两种配置选项： 使用 managed-mcp.json 的独占控制 ：部署一组固定的 MCP 服务器，用户无法修改或扩展 使用允许列表/拒绝列表的基于策略的控制 ：允许用户添加自己的服务器，但限制允许的服务器 这些选项允许 IT 管理员： 控制员工可以访问哪些 MCP 服务器 ：在整个组织中部署标准化的已批准 MCP 服务器 防止未经授权的 MCP 服务器 ：限制用户添加未批准的 MCP 服务器 完全"
