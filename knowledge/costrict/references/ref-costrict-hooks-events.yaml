excerpt: "Hooks 在 CSC 会话的特定点触发。当事件触发且匹配器匹配时，CSC 将有关事件的 JSON 上下文传递给你的 hook 处理程序。对于命令 hooks，输入通过 stdin 到达。对于 HTTP hooks，它作为 POST 请求体到达。你的处理程序随后可以检查输入、采取行动，并可选地返回决策。事件分为三种频率：每个会话一次（ SessionStart 、 SessionEnd ），每个轮次一次（ UserPromptSubmit 、 Stop 、 StopFailure ），以及智能体循环中的每次工具调用（ PreToolUse 、 PostToolUse ）： 下表总结了每个事件的触发时机。Hook 事件部分记录了每个事件的完整输入模式和决策控制选项。 事件 触发时机 SessionStart 当会话开始或恢复时 UserPromptSubmit 当你提交提示时，在 CSC 处理它之前 PreToolUse 在工具调用执行之前。可以阻止它 PermissionRequest 当权限对话框出现时 PermissionDenied 当工具调用被自动模式分类器拒绝时。返回 {retry: true} 告知模型可以重试被拒绝的工具调用 PostToolUse 在工具调用成功之后 PostToolUseFailure 在工具调用失败之后 Notification 当 CSC 发送通知时 SubagentStart 当子代理被创建时 SubagentStop 当子代理完成时 TaskCreated 当通过 TaskCreate 创建任务时 TaskCompleted 当任务被标记为完成时 Stop 当 CSC 完成响应时 StopFailure 当轮次因 API 错误而结束时。输出和退出码被忽略 TeammateIdle 当代理团队的队友即将进入空闲状态时 Instruct"
