excerpt: "--debug-file <path> 将调试日志写入指定文件路径。隐式启用调试模式。优先于 CLAUDE_CODE_DEBUG_LOGS_DIR csc --debug-file /tmp/claude-debug.log --disable-slash-commands 禁用此会话的所有技能和命令 csc --disable-slash-commands --disallowedTools 从模型上下文中移除且无法使用的工具 \"Bash(git log *)\" \"Bash(git diff *)\" \"Edit\" --effort 为当前会话设置努力级别。选项： low 、 medium 、 high 、 max （仅 Opus 4.6）。会话范围，不会持久化到设置 csc --effort high --exclude-dynamic-system-prompt-sections 将系统提示中每台机器的部分（工作目录、环境信息、记忆路径、git 状态）移到第一条用户消息中。提高在不同用户和机器运行相同任务时的提示缓存复用率。仅在使用默认系统提示时适用；设置了 --system-prompt 或 --system-prompt-file 时忽略。与 -p 一起用于脚本化的多用户工作负载 csc -p --exclude-dynamic-system-prompt-sections \"query\" --fallback-model 当默认模型过载时启用自动回退到指定模型（仅打印模式） csc -p --fallback-model sonnet \"query\" --fork-s"
