excerpt: "/doctor 诊断并验证你的 CSC 安装和设置 /effort [low|medium|high|max|auto] 设置模型努力级别。 low 、 medium 和 high 在会话间持久保存。 max 仅适用于当前会话且需要 Opus 4.6。 auto 重置为模型默认值。不带参数时显示当前级别。立即生效，无需等待当前响应完成 /exit 退出 CLI。别名： /quit /export [filename] 将当前对话导出为纯文本。带文件名时直接写入该文件。不带文件名时打开对话框以复制到剪贴板或保存到文件 /extra-usage 配置额外用量以便在达到速率限制时继续工作 /fast"
