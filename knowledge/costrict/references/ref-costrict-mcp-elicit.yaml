  heading: "响应 MCP 请求请求"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/mcp"
excerpt: "MCP 服务器可以使用请求在任务中途向您请求结构化输入。当服务器需要无法自行获取的信息时，CSC 会显示交互式对话框并将您的响应传回服务器。您无需进行任何配置：请求对话框会在服务器请求时自动出现。 服务器可以通过两种方式请求输入： 表单模式 ：CSC 显示一个包含服务器定义的表单字段的对话框（例如用户名和密码提示）。填写字段并提交。 URL 模式 ：CSC 打开一个浏览器 URL 进行身份验证或批准。在浏览器中完成流程，然后在 CLI 中确认。 要自动响应请求请求而不显示对话框，请使用 Elicitation Hooks。 如果您正在构建使用请求的 MCP 服务器，请参阅 MCP 请求规范以获取协议详细信息和架构示例。 使用 MCP 资源 ​ MCP 服务器可以暴露资源，您可以使用 @ 提及来引用它们，类似于引用文件的方式。 引用 MCP 资源 ​ 步骤 1：列出可用资源 ​ 在提示中输入 @ 以查看所有已连接 MCP 服务器的可用资源。资源与文件一起出现在自动完成菜单中。 步骤 2：引用特定资源 ​ 使用格式 @server:protocol://resource/path 引用资源"
