  heading: "使用Skills扩展 CSC"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/skills"
excerpt: "Skills扩展了 CSC 的能力。创建一个包含指令的 SKILL.md 文件，CSC 会将其添加到工具集中。CSC 会在相关时使用Skills，或者你可以通过 /skill-name 直接调用。 当你不断将相同的操作手册、检查清单或多步骤流程粘贴到聊天中，或者当 AGENTS.md 的某个部分已经从事实描述变成了操作流程时，就该创建一个Skills了。与 AGENTS.md 的内容不同，Skills的主体只在被使用时才加载，因此长篇参考材料在你需要之前几乎不消耗任何资源。 注意： 对于内置命令（如 /help 和 /compact ）以及内置Skills（如 /debug 和 /simplify ），请参阅命令参考。 自定义命令已合并到Skills中。 .costrict/commands/deploy.md 处的文件和 .costrict/skills/deploy/SKILL.md 处的Skills都会创建 /deploy 并且工作方式相同。你现有的 .costrict/commands/ 文件继续有效。Skills增加了可选功能：用于存放支持文件的目录、用于控制由你还是 CSC 调用的 frontmatter，以及 CSC 在相关时自动加载的能力。 CSC Skills遵循 Agent Skills 开放标准，该标准适用于多种 AI 工具。CSC 通过调用控制、Subagents执行和动态上下文注入等额外功能扩展了该标准。 内置Skills ​ CSC 包含一组在每次会话中都可用的内置Skills，包括 /simplify 、 /batch 、 /debug 、 /loop 和 /claude-api 。与直接执行固定逻辑的内置命令不同，内置Skills是基于提示的：它们给 CSC 一份详细的操作手册，让它使用工具来编排工作。你可以像调用任何其他Skills一样调用"
