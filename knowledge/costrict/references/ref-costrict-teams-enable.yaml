excerpt: "Agent teams默认禁用。通过在 shell 环境或 settings.json 中将 CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS 环境变量设置为 1 来启用： { \"env\" : { \"CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS\" : \"1\" } } 启动你的第一个Agent teams ​ 启用Agent teams后，告诉 CSC 创建一个Agent teams，并用自然语言描述你想要的任务和团队结构。CSC 会根据你的提示创建团队、生成队友并协调工作。 以下示例效果很好，因为三个角色是独立的，可以在不等待彼此的情况下探索问题： 我正在设计一个帮助开发者追踪代码库中 TODO 注释的 CLI 工具。 创建一个Agent teams从不同角度探索：一个队友负责 UX， 一个负责技术架构，一个扮演魔鬼代言人。 从那里，CSC 会创建一个带有共享任务列表的团队，为每个视角生成队友，让他们探索问题，综合发现，并在完成时尝试清理团队。 负责人的终端会列出所有队友及其正在做的工作。使用 Shift+Down 在队友之间切换并直"
