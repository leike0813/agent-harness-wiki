excerpt: "要向官方 CoStrict 市场提交Plugins，请使用以下应用内提交表单之一： costrict.ai ：costrict.ai/settings/plugins/submit Console ：platform.costrict.ai/plugins/submit 注意： 有关完整的技术规范、调试技术和分发策略，请参阅Plugins参考。 将现有配置转换为Plugins ​ 如果你已经在 .costrict/ 目录中有Skills或Hooks，可以将它们转换为Plugins以便于共享和分发。 迁移步骤 ​ 创建Plugins结构 ​ 创建一个新的Plugins目录： mkdir -p my-plugin/.claude-plugin 在 my-plugin/.claude-plugin/plugin.json 创建清单文件： { \"name\" : \"my-plugin\" , \"des"
