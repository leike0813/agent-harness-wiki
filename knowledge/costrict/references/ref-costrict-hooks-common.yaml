excerpt: "这些字段适用于所有 hook 类型： 字段 必需 描述 type 是 \"command\" 、 \"http\" 、 \"prompt\" 或 \"agent\" if 否 权限规则语法，用于过滤此 hook 何时运行，如 \"Bash(git *)\" 或 \"Edit(*.ts)\" 。hook 仅在工具调用匹配模式时才启动。仅在工具事件上评估： PreToolUse 、 PostToolUse 、 PostToolUseFailure 、 PermissionRequest 和 PermissionDenied 。在其他事件上，设置了 if 的 hook 永远不会运行。使用与权限规则相同的语法 timeout 否 取消前的秒数。默认值：命令 600，提示 30，代理 60 statusMessage 否 hook 运行时显示的自定义加载消息 once 否 如果为 true ，每个会话仅运行一次然后被移除。仅限技能，不适用于代理。请参阅技能和代理中的 hooks 命令 hook 字段 ​ 除通用字段外，命令 hooks 还接受这些字段： 字段 必需 描述 command 是 要执行的 shell 命令 async 否 如果为 true ，在后台运行而不阻塞。请参阅在后台运行 hooks shell 否 用于此 hook 的 shell。接受 \"bash\" （默认）或 \"powershell\" 。设置 \"powershell\" 在 Windows 上通过 PowerShell 运行命令。不需要 CLAUDE_CODE_USE_POWERSHELL_TOOL ，因为 hooks 直接启动 Power"
