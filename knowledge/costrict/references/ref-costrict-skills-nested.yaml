  heading: "从嵌套目录自动发现"
official_url: "https://docs.costrict.ai/csc/tools-and-plugins/skills"
excerpt: "当你在子目录中处理文件时，CSC 会自动从嵌套的 .costrict/skills/ 目录中发现Skills。例如，如果你在 packages/frontend/ 中编辑文件，CSC 也会在 packages/frontend/.costrict/skills/ 中查找Skills。这支持了各包拥有自己Skills的 monorepo 设置。 每个Skills是一个目录，以 SKILL.md 作为入口： my-skill/ ├── SKILL.md # 主要指令（必需） ├── template.md # 供 CSC 填写的模板 ├── examples/ │ └── sample.md # 显示预期格式的示例输出 └── scripts/ └── validate.sh # CSC 可执行的脚本 SKILL.md 包含主要指令，是必需的。其他文件是可选的，让你构建更强大的Skills：供 CSC 填写的模板、显示预期格式的示例输出、CSC 可执行的脚本或详细的参考文档。从 SKILL.md 中引用这些文件，以便 CSC 知道它们包含什么以及何时加载它们。有关更多详细信息，请参阅添加支持文件。 注意： .costrict/commands/ 中的文件仍然有效，并支持相同的 frontmatter。推荐使用Skills，因为它们支持支持文件等额外功能。 来自额外目录的Skills ​"
