excerpt: "CSC 提供 CLI 命令用于非交互式插件管理，适用于脚本编写和自动化。 plugin install ​ 从可用市场安装插件。 csc plugin install <plugin> [options] 参数： <plugin> ：插件名称或 plugin-name@marketplace-name （指定市场） 选项： 选项 描述 默认值 -s, --scope <scope> 安装范围： user 、 project 或 local user -h, --help 显示命令帮助 范围决定安装的插件添加到哪个设置文件。例如， --scope project 写入 .costrict/settings.json 中的 enabledPlugins ，使插件对每个克隆项目仓库的人可用。 示例： # 安装到用户范围（默认） csc plugin install formatter@my-marketplace # 安装到项目范围（与团队共享） csc plugin install formatter@my-marketplace --scope project # 安装到本地范围（被 gitignore） csc plugin install formatter@my-marketplace --scope local plugin uninstall ​ 移除已安装的插件。 csc plugin uninstall <plugin> [options] 参数： <plugin> ：插件名称或 plugin-name@marketplace-name 选项： 选项 描述 默认值"
