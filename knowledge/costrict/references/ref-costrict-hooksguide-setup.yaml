excerpt: "要创建Hooks，请将 hooks 块添加到设置文件中。本演练创建一个桌面通知Hooks，这样当 CSC 等待你的输入时，你会收到提醒，而不必一直盯着终端。 步骤 1：将Hooks添加到设置中 ​ 打开 ~/.costrict/settings.json 并添加一个 Notification Hooks。以下示例使用 osascript （适用于 macOS）；有关 Linux 和 Windows 命令，请参阅当 Claude 需要输入时获取通知。 { \"hooks\" : { \"Notification\" : [ { \"matcher\" : \"\" , \"hooks\" : [ { \"type\" : \"command\" , \"command\" : \"osascript -e 'display notification \\\"CSC needs your attention\\\" with title \\\"CSC\\\"'\" } ] } ] } } 如果你的设置文件已经有 hooks 键，请将 Notification 添加为现有事件键的同级，而不是替换整个对象。每个事件名称都是单个 hooks 对象内的一个键： { \"hooks\" : { \"PostToolUse\" : [ { \"matcher\" : \"Edit|Write\" , \"hooks\" : [ { \"type\" : \"command"
