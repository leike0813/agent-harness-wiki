  heading: Enable telemetry
official_url: "https://github.com/google-gemini/gemini-cli"
excerpt: |-
  Hook execution is logged when `telemetry.logPrompts` is enabled. You can view
  these logs to debug execution flow.
  ```json
  {
    "telemetry": {
      "logPrompts": true
    }
  }
  ```
