  heading: "`agents.overrides`"
official_url: "https://github.com/google-gemini/gemini-cli"
excerpt: |-
  Use this to enable or disable specific agents or override their run
  configurations.
  ```json
  {
    "agents": {
      "overrides": {
        "security-auditor": {
          "enabled": false,
          "runConfig": {
            "maxTurns": 20,
            "maxTimeMinutes": 10
          }
        }
      }
    }
  }
  ```
