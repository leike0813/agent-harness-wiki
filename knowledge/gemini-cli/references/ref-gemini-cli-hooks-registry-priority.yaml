excerpt: |-
  getHooksForEvent(eventName: HookEventName): HookRegistryEntry[] {
      return this.entries
        .filter((entry) => entry.eventName === eventName && entry.enabled)
        .sort(
          (a, b) =>
            this.getSourcePriority(a.source) - this.getSourcePriority(b.source),
        );
    }
