locator:
  kind: document_section
  heading: Create an extension from a template
official_url: "https://github.com/google-gemini/gemini-cli"
excerpt: |-
  Create a new extension directory using a built-in template.
  ```bash
  gemini extensions new <path> [template]
  ```
  - `<path>`: The directory to create.
  - `[template]`: The template to use (for example, `mcp-server`, `context`,
    `custom-commands`).
