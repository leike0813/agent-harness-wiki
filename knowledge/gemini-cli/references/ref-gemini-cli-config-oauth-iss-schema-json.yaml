        "oauth": {
          "type": "object",
          "description": "OAuth configuration for authenticating with the server.",
          "additionalProperties": true,
          "properties": {
            "authorizationResponseIssParameterSupported": {
              "type": "boolean",
              "description": "Whether the authorization server returns the \"iss\" parameter in the authorization response (RFC 9207). When true, callbacks without \"iss\" are rejected; when false, they are accepted. A provided \"iss\" is always validated. Overrides the \"authorization_response_iss_parameter_supported\" value discovered from server metadata."
            }
          }
