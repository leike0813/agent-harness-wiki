  def lint_edited(self, fnames):
          res = ""
          for fname in fnames:
              if not fname:
                  continue
              errors = self.linter.lint(self.abs_root_path(fname))
              if errors:
                  res += "\n"
                  res += errors
                  res += "\n"
          if res:
              self.io.tool_warning(res)
          return res
      def __del__(self):
          """Cleanup when the Coder object is destroyed."""
          self.ok_to_warm_cache = False
