excerpt: "def split_chat_history_markdown(text, include_tool=False):\n    messages = []\n    user = []\n    assistant = []\n    tool = []\n    lines = text.splitlines(keepends=True)\n\n    def append_msg(role, lines):\n        lines = \"\".join(lines)\n        if lines.strip():\n            messages.append(dict(role=role, content=lines))\n\n    for line in lines:\n        if line.startswith(\"# \"):\n            continue\n        if line.startswith(\"> \"):\n            append_msg(\"assistant\", assistant)\n            assistant = []\n            append_msg(\"user\", user)"
