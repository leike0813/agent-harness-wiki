  def __init__(self, encoding="utf-8", root=None):
          self.encoding = encoding
          self.root = root
          self.languages = dict(
              python=self.py_lint,
          )
          self.all_lint_cmd = None
      def set_linter(self, lang, cmd):
          if lang:
              self.languages[lang] = cmd
              return
          self.all_lint_cmd = cmd
