  // toolCallInput returns arguments safe to hand a provider. Empty or partial
  // input becomes {}, since providers disagree about what a blank means.
  func toolCallInput(input string) string {
  	if !json.Valid([]byte(input)) {
  		return "{}"
  	}
  	return input
  }
