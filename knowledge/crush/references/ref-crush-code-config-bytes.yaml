  func loadFromBytes(configs [][]byte) (*Config, error) {
  	if len(configs) == 0 {
  		return &Config{}, nil
  	}
  	data, err := jsons.Merge(configs)
  	if err != nil {
  		return nil, err
  	}
  	var config Config
  	if err := json.Unmarshal(data, &config); err != nil {
  		return nil, err
  	}
  	return &config, nil
  }
