  CREATE TABLE IF NOT EXISTS read_files (
      session_id TEXT NOT NULL CHECK (session_id != ''),
      path TEXT NOT NULL CHECK (path != ''),
      read_at INTEGER NOT NULL,  -- Unix timestamp in seconds when file was last read
