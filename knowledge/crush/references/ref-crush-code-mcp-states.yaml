  type State int
  const (
  	StateDisabled State = iota
  	StateStarting
  	StateConnected
  	StateError
  	StateNeedsAuth
  )
  func (s State) String() string {
  	switch s {
  	case StateDisabled:
  		return "disabled"
  	case StateStarting:
  		return "starting"
  	case StateConnected:
  		return "connected"
  	case StateError:
  		return "error"
  	case StateNeedsAuth:
  		return "needs auth"
  	default:
  		return "unknown"
  	}
  }
  // EventType represents the type of MCP event
  type EventType uint
  const (
  	EventStateChanged EventType = iota
  	EventToolsListChanged
  	EventPromptsListChanged
  	EventResourcesListChanged
