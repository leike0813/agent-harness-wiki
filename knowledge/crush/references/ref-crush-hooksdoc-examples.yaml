excerpt: |-
  ### Block destructive commands
  Prevent the agent from running `rm -rf` in bash:
  ```json
  {
    "hooks": {
      "PreToolUse": [
        {
          "matcher": "^bash$",
          "command": "./hooks/no-rm-rf.sh"
        }
      ]
    }
  }
  ```
  `hooks/no-rm-rf.sh`:
  ```bash
  #!/usr/bin/env bash
