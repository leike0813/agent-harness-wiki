locator:
  kind: document_section
  heading: OpenAI-Compatible APIs
official_url: "https://github.com/charmbracelet/crush"
excerpt: |-
  Here’s an example configuration for Deepseek, which uses an OpenAI-compatible
  API. Don't forget to set `DEEPSEEK_API_KEY` in your environment.
  ```bash
  provider add deepseek --type openai-compat \
    --base-url "https://api.deepseek.com/v1" \
    --api-key "$DEEPSEEK_API_KEY"
  model add deepseek/deepseek-chat \
    --name "Deepseek V3" \
    --context-window 64000 \
    --default-max-tokens 5000 \
    --price-input 0.27 \
    --price-output 1.1 \
    --price-cache-create 1.1 \
    --price-cache-hit 0.07
  ```
