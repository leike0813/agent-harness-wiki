  func Reinitialize(ctx context.Context, cfg *config.ConfigStore) {
  	reinitMu.Lock()
  	if reinitRunning {
  		reinitDirty = true
  		reinitMu.Unlock()
  		return
  	}
  	reinitRunning = true
  	reinitMu.Unlock()
  	for {
  		reconcileOnce(ctx, cfg)
  		reinitMu.Lock()
  		if !reinitDirty {
  			reinitRunning = false
  			reinitMu.Unlock()
  			return
  		}
  		reinitDirty = false
  		reinitMu.Unlock()
  	}
  }
