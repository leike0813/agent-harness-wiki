  func shouldEnableMetrics(cfg *config.Config) bool {
  	if v, _ := strconv.ParseBool(os.Getenv("CRUSH_DISABLE_METRICS")); v {
  		return false
  	}
  	if v, _ := strconv.ParseBool(os.Getenv("DO_NOT_TRACK")); v {
  		return false
  	}
  	if cfg.Options.DisableMetrics {
  		return false
  	}
  	return true
  }
