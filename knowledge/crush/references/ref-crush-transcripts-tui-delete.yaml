  func (s *Session) confirmDeleteSession() Action {
  	sessionItem := s.selectedSessionItem()
  	s.sessionsMode = sessionsModeNormal
  	if sessionItem == nil {
  		return nil
  	}
  
  	s.removeSession(sessionItem.ID())
  	return ActionCmd{s.deleteSessionCmd(sessionItem.ID())}
