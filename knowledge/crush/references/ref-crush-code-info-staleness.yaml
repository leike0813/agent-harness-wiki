  func writeConfigFiles(b *strings.Builder, cfg *config.ConfigStore) {
  	b.WriteString("[config_files]\n")
  	paths := cfg.LoadedPaths()
  	for _, p := range paths {
  		b.WriteString(p + "\n")
  	}
  	b.WriteString("\n")
  }
