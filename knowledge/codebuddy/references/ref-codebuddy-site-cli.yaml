excerpt: |-
  - **CodeBuddy IDE**：腾讯云自研的 AI 优先 IDE，深度集成 Agent 能力，支持多 Agent 并行开发。适用于希望摆脱插件束缚、体验完整 AI 编程范式的开发者
  - **CodeBuddy 插件**：面向 VSCode / JetBrains / Cursor 等主流 IDE 的插件形态，保留原 IDE 体验的同时增强 AI 能力
  - **CodeBuddy Code（CLI）**：命令行 Agent 工具，可在终端里直接对话、执行任务、编辑代码，适合脚本化与自动化场景
