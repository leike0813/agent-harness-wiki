  heading: "官方市场"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  官方市场在 CodeBuddy Code 启动时自动可用。运行 `/plugin` 并进入**发现**标签页浏览可用插件。
  ### 安装官方市场的插件
  使用以下命令从官方市场安装插件：
  ```bash
  /plugin install <插件名>@<官方市场名>
  ```
  例如，安装 GitHub 集成：
  ```bash
  /plugin install github@codebuddy-plugins-official
  ```
