excerpt: '说明：


  * 命令与输出仅在当前 TUI 会话中**瞬态展示**；模型看不到它们，续聊或恢复会话时也不会回放。它们从不进入会话历史（既不入模型上下文，也不写 JSONL），因此 `/btw`、上下文压缩、`/fork` 同样看不到本地 shell 内容。

  * 瞬态展示会在当前实时会话内保留（窗口缩放、界面重挂、`Ctrl+O` 详细视图都能继续看到），但保留是有上限的进程内展示，不落盘。现有会话结束回调（如 `/clear`）或已提交的对话回退会清空本地回显；普通上下文压缩不会主动清空回显。离开当前会话后，旧命令的迟到输出不会重新出现。'
