excerpt: '### `--all` 会额外清理什么


  - `~/.codebuddy/projects/` 下的全部项目状态

  - 全部 session 任务列表、文件编辑历史、debug 日志与 `history.jsonl`

  - `~/.codebuddy.json` 中全部项目级配置项

  - `~/.codebuddy/settings.json` 中全部项目 trust rules

  - 旧格式项目记忆目录（保留 `~/.codebuddy/memories/global/`）'
