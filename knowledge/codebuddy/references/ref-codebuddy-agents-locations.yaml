  heading: "文件位置"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  子代理存储为具有 YAML 前置内容的 Markdown 文件，位置有两个：
  | 类型           | 位置                     | 范围             | 优先级 |
  | :------------- | :----------------------- | :--------------- | :----- |
  | **项目子代理** | `.codebuddy/agents/`     | 在当前项目中可用 | 最高   |
  | **用户子代理** | `~/.codebuddy/agents/`   | 在所有项目中可用 | 较低   |
  当子代理名称冲突时，项目级别的子代理优先于用户级别的子代理。
