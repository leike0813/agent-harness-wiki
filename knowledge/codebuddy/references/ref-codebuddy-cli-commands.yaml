excerpt: |-
  | 命令                                | 说明                                     | 示例                                           |
  | :---------------------------------- | :--------------------------------------- | :--------------------------------------------- |
  | `codebuddy`                         | 启动交互式 REPL                          | `codebuddy`                                    |
  | `codebuddy "查询"`                  | 带初始提示词启动 REPL                    | `codebuddy "解释这个项目"`                     |
  | `codebuddy -p "查询"`               | 通过 SDK 查询后退出                      | `codebuddy -p "解释这个函数"`                  |
  | `cat 文件 \| codebuddy -p "查询"`   | 处理管道内容                             | `cat logs.txt \| codebuddy -p "分析日志"`      |
