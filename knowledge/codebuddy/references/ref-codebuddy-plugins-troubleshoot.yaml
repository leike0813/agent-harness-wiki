excerpt: |-
  ### 插件未加载
  **问题**：插件已安装但不工作
  **解决方案**：
  - 确认插件已启用：运行 `/plugin` 进入 "Installed" 标签页查看
  - 检查 `plugin.json` 格式是否正确
  - 运行 `/reload-plugins` 重新加载插件
  - 使用 `--debug` 模式查看加载日志
  ### 命令不可用
  **问题**：插件已安装但命令无法使用
  **解决方案**：
  - 确认命令文件放在插件根目录的 `commands/` 中，而不是 `.codebuddy-plugin/` 内
  - 检查命令文件是否存在且格式正确
  - 运行 `/reload-plugins` 刷新
