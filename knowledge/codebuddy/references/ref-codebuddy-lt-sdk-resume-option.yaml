excerpt: "## 恢复会话\n\n使用之前保存的 `session_id` 可以恢复会话，继续之前的对话。\n\n### 使用 resume 选项\n\n::: code-group\n\n```typescript [TypeScript - query API]\nimport { query } from '@tencent-ai/agent-sdk';\n\n// 使用之前保存的 session_id\nconst savedSessionId = 'abc123-xyz789';\n\nconst q = query({\n  prompt: '继续我们之前的工作',\n  options: {\n    model: 'deepseek-v3.1',\n    resume: savedSessionId  // 恢复指定会话\n  }\n});\n\nfor await (const message of q) {"
