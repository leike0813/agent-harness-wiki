excerpt: |-
  ### 自动委派
  CodeBuddy Code 根据以下因素主动委派任务：
  * 您请求中的任务描述
  * 子代理配置中的 `description` 字段
  * 当前上下文和可用工具
  > **提示**：为了鼓励更多主动的子代理使用，在您的 `description` 字段中包含"use PROACTIVELY"或"MUST BE USED"之类的短语。
  ### 显式调用
  通过在您的命令中提及特定子代理来请求它：
  ```
  > 使用 test-runner 子代理修复失败的测试
  > 让 code-reviewer 子代理检查我最近的更改
  > 请 debugger 子代理调查这个错误
  ```
