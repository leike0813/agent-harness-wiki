excerpt: |-
  | 场景 | 是否生效 |
  |---|---|
  | Web UI（`--serve` 模式打开浏览器） | ✅ |
  | IDE 插件中嵌入的 Web UI（VSCode / Fusion / JetBrains） | ✅ |
  | 终端 TUI（`codebuddy` 默认交互模式） | ❌ 自动文本降级 |
  | Print 模式（`-p`） | ❌ 自动文本降级 |
  终端模式下 widget 作者无需特殊处理，工具的 `content` 文本本来就是给非可视化场景兜底的。
