excerpt: '| `CODEBUDDY_DISABLE_TASK_REMINDERS` | 设置为 `1` 关闭长任务运行中的任务列表提醒（包括恢复会话中已保存的提醒）；默认开启。标准模式直连任务工具、PTC 模式 REPL 沙箱内的 `TaskCreate` / `TaskUpdate`（或旧版 `TodoWrite`）长期未更新时会收到隐藏提醒，不改变任务状态或强制执行顺序。Minimal 和沙箱未开放任务工具的模式不触发。用于对照实验与临时回滚 |'