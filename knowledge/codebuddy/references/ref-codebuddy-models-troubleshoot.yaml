  heading: "故障排查"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  ### 配置未生效
  1. 检查 JSON 格式是否正确
  2. 确认文件路径是否正确
  3. 查看日志输出确认配置是否被加载
  4. 确认环境变量中的 API 密钥是否已设置
  ### 模型未在列表中显示
  1. 检查模型 ID 是否在 `availableModels` 中列出
  2. 确认 `models` 配置是否正确
  3. 验证必填字段 （`id`, `name`, `provider`) 是否都已提供
  ### 热重载未触发
  - 配置文件变更有 1 秒防抖延迟
  - 确保文件确实被保存到磁盘
  - 检查文件监听是否正常启动 （查看调试日志）
