  heading: "配置文件"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  `settings.json` 文件是配置 CodeBuddy Code 的官方机制，支持分层设置：
  * **用户设置** 定义在 `~/.codebuddy/settings.json`，应用于所有项目
  * **项目设置** 保存在项目目录中：
    * `.codebuddy/settings.json` 用于检入源代码控制并与团队共享的设置
    * `.codebuddy/settings.local.json` 用于不检入的设置，适合个人偏好和实验。CodeBuddy Code 会自动配置 git 忽略此文件
  ### 完整配置示例
  ```json
  {
    "language": "简体中文",
    "permissions": {
      "allow": [
        "Bash(npm run lint)",
        "Bash(npm run test:*)",
        "Read(~/.zshrc)"
      ],
      "ask": [
        "Bash(git push:*)"
      ],
      "deny": [
        "Bash(curl:*)",
        "Read(./.env)",
        "Read(./.env.*)",
        "Read(./secrets/**)"
      ]
    },
    "env": {
      "NODE_ENV": "development",
      "DEBUG": "codebuddy:*"
    },
    "model": "gpt-5",
    "subagents": {
      "agents": {
        "Explore": { "model": "lite" },
        "Plan": { "model": "reasoning" }
