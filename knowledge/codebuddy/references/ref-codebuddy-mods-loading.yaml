excerpt: |-
  ### CLI 参数

  ```bash
  codebuddy --plugin-dir <dir> [--plugin-dir <dir2> ...]
  ```

  - `--plugin-dir` 可以重复，按声明顺序装载。
  - 目录须包含 `.codebuddy-plugin/plugin.json` 或 `.claude-plugin/plugin.json`（两者同存以前者优先）。
  - 用户手动装载的 Mod 全部落到 **`user` tier**。
  - 无需额外开关或环境变量。