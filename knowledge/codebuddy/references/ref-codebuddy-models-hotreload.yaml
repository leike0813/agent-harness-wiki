  heading: "热重载"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  配置文件支持热重载：
  - 文件变更会被自动检测
  - 使用 1 秒防抖延迟避免频繁重载
  - 配置更新后会自动同步到应用
  监听的文件：
  - `~/.codebuddy/models.json` （用户级）
  - `<workspace>/.codebuddy/models.json` （项目级）
