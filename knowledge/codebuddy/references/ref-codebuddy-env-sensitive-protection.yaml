excerpt: '| `CODEBUDDY_DISABLE_SENSITIVE_PROTECTION` | 设置为 `1`/`true`/`yes`/`on` 关闭本进程的敏感数据防护，效果同 `settings.json` 的 `sensitiveProtection.enabled: false`，但不改共享的设置文件；企业托管策略下发的值仍然优先。wb 的 `--features ''{"rollout":true}''` 即通过它传给 agent |'