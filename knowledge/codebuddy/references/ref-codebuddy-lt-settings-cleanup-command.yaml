excerpt: '## 本地数据清理命令


  使用 `codebuddy cleanup` 手动清理过期的本地数据。默认按本地聊天记录保留天数清理；未配置时保留 30 天。


  会清理的内容包括：过期会话记录、会话生成文件、traces、logs、diagnostics 和 cache。'
