  heading: "配置优先级"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  配置合并优先级从高到低：
  1. 项目级 models.json
  2. 用户级 models.json
  3. 内置默认配置
  项目级配置会覆盖用户级配置中的相同模型定义（基于 `id` 字段匹配）。`availableModels` 字段：项目级完全覆盖用户级，不进行合并。
