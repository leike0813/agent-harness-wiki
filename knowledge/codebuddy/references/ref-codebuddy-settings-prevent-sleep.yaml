excerpt: '| `daemon.preventSleep` | 防止系统自动休眠，默认 `true`，允许屏幕正常熄灭。Web UI「全局设置 → 高级」开关运行中即时生效；关闭后按系统设置休眠，唤醒检测和自动重连仍保留。仅用户级配置；环境变量 `CODEBUDDY_DAEMON_ALLOW_SLEEP=1/true` 优先强制允许休眠 | `{"preventSleep": false}` |'
