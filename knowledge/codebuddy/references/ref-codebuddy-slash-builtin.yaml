  heading: "内置斜杠命令 （Built-in Slash Commands)"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  这些命令用于管理您的 CodeBuddy Code 会话。以下是当前的支持情况：
  | 命令 | 参数 | CodeBuddy 支持情况 | 描述 |
  | --- | --- |:---:| --- |
  | `/help` | | ✅ 支持 | 显示帮助信息，并提供反馈渠道的指引。 |
  | `/clear` | | ✅ 支持 | 开启全新对话（旧对话可通过 `/resume` 恢复）。 |
  | `/login` | | ✅ 支持 | 登录到您的账号。 |
  | `/logout` | | ✅ 支持 | 退出当前的账号。 |
  | `/doctor` | | ✅ 支持 | 检查 CodeBuddy Code 的状态和环境。 |
  | `/status` | | ✅ 支持 | 显示当前仓库和会话的状态。 |
  | `/add-dir` | `<path>` | ✅ 支持 | 添加工作目录。指定要添加的目录路径。 |
  | `/agents` | | ✅ 支持 | 管理内置和自定义 AI 智能体；查看内置子代理的生效路由值及其来源，并将模型设置保存到 Global 或 Project 范围。具体场景模型可在 `/model` 中查看。 切换当前会话的主 Agent 模式请用 `/agent-mode`。 |
