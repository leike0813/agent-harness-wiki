  #### CODEBUDDY_API_KEY
  静态 API Key，适用于大部分场景。
  | 特性 | 说明 |
  |:-----|:-----|
  | 环境变量 | `CODEBUDDY_API_KEY` |
  | 认证类型 | API Key（X-Api-Key 请求头） |
  | 适用场景 | 个人开发、第三方模型服务 |
  > **⚠️ 注意：使用 API Key 时，必须同时配置 `CODEBUDDY_INTERNET_ENVIRONMENT` 环境变量！**
  >
  > | 版本 | 配置值 |
  > |:----|:------|
  > | 海外版 | 不设置（默认） |
  > | 中国版 | `internal` |
  > | iOA 版 | `ioa` |
  > | 专享版 | `cloudhosted` |
  > | 私有化部署 | `selfhosted` |
  ```bash
