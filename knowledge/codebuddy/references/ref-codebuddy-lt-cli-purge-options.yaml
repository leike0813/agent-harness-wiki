excerpt: '| 选项 | 说明 |

  | :--- | :--- |

  | `[path]` | 指定要清理的项目路径；省略时在交互式终端中选择项目 |

  | `--dry-run` | 只预览 purge plan，不执行删除 |

  | `-y`, `--yes` | 跳过最终确认，直接执行删除 |

  | `-i`, `--interactive` | 按清理类别逐项确认是否删除 |'
