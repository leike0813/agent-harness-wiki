excerpt: '| `CODEBUDDY_MAX_RETRIES` | 模型请求"生成开始前"失败（429 / 5xx（570-579 除外）/ 请求超时 / 锁超时）的最大退避重试次数（默认：8，上限：15，超限自动收敛）。重试采用 1s 起步、2 倍增长、单次封顶 32s 的指数退避 + 抖动；服务器给出 `retry-after`（秒数或 HTTP 日期）或错误体 `retry_policy.retry_after` 时按两者中更晚的时间等待，不会截短。重试严格发生在流式内容产出之前，不会重发已产出内容；已收到 200 后在流中报的错误按会话恢复处理，不计入此次数。额度耗尽类错误不重试（转由模型 fallback 处理）。连接级传输失败（响应头之前、非 DNS）另有独立的 3 次重试，不受此变量控制。错误体带模型网关 `retry_policy` 时以网关为准：`retry` 为 `false` 或 `"false"` 不重试；否则在上述状态范围内固定最多重试 8 次，覆盖本变量 |'
