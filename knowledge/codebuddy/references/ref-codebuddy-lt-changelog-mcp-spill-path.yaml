excerpt: '- **MCP 大响应处理**：MCP 工具响应超出 token 上限时不再直接报错中断会话，改为把完整内容保存到会话目录并返回读取指引，模型可按 offset/limit 分段读取。落盘路径形如 `~/.codebuddy/projects/<project-hash>/<session-id>/tool-results/mcp-<server>-<tool>-<timestamp>-<rand>.txt`（子代理场景为 `<parent-session>/subagents/<agent-id>/tool-results/…`）。含图片的响应、无会话上下文、或落盘失败时自动降级为截断模式并保留图片块；可通过环境变量 `CODEBUDDY_DISABLE_MCP_LARGE_OUTPUT_FILES=1` 始终走截断降级。'
