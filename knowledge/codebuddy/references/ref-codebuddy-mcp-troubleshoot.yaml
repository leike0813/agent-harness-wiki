excerpt: |-
  ### 常见问题
  #### 服务器连接失败
  1. 检查命令路径是否正确
  2. 验证参数和环境变量
  3. 确认网络连接（对于远程服务器）
  4. 查看服务器日志输出
  #### 工具不可用
  1. 确认服务器已成功连接
  2. 检查工具权限设置
  3. 验证工具兼容性
  #### 配置不生效
  1. 检查配置文件语法
  2. 确认作用域优先级
  3. 重启 CodeBuddy 应用
