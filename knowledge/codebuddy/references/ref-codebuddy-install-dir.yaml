  ## 📁 配置目录
  CodeBuddy Code 默认将配置文件存储在以下目录:
  | 平台 | 默认配置目录 |
  |------|-------------|
  | macOS / Linux | `~/.codebuddy` |
  | Windows | `%USERPROFILE%\.codebuddy` |
  ### 配置目录内容
  ```
  ~/.codebuddy/
  ├── settings.json      # 用户设置
  ├── .mcp.json          # MCP 服务器配置
  └── skills/            # 用户自定义 Skills
  ```
  ### 自定义配置目录
