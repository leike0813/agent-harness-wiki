  heading: "目录结构"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  Skills 通过在特定目录中创建 `SKILL.md` 文件来定义：
  1. **项目级 Skills**：`.codebuddy/skills/`（项目根目录下）
  2. **用户级 Skills**：`~/.codebuddy/skills/`（用户主目录下）
  每个 Skill 一个独立的目录，包含 `SKILL.md` 文件：
  ```
  .codebuddy/skills/
  ├── pdf/
  │   └── SKILL.md
  ├── data-analysis/
  │   └── SKILL.md
  └── code-review/
      └── SKILL.md
  ```
