  # Mods

  > **状态**：Beta。API 与运行时约束仍在演进；默认开启，无需任何环境变量，`--plugin-dir` 装载即可使用。
  > **与传统 Hooks 的关系**：不替换。传统 shell / prompt hooks（见 [`hooks.md`](./hooks.md)）继续可用；Mods 是并行的、类型化的中间件层，两者可同时启用。