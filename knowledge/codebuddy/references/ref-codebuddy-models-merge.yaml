excerpt: |-
  配置使用 `SmartMerge` 策略：
  - 相同 ID 的模型配置会被覆盖
  - 不同 ID 的模型会被追加
  - 项目级配置优先于用户级配置
  - `availableModels` 过滤在所有合并完成后执行
