  heading: "必需字段"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  如果包含清单，`name` 是唯一必需字段。
  | 字段 | 类型 | 描述 | 示例 |
  |------|------|------|------|
  | `name` | string | 唯一标识符（kebab-case，无空格） | `"deployment-tools"` |
  此名称用于组件命名空间。例如在 UI 中，插件 `plugin-dev` 的代理 `agent-creator` 将显示为 `plugin-dev:agent-creator`。
