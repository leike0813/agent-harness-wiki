excerpt: |-
  类型： `Array<string>`
  控制模型下拉列表中显示哪些模型。只有在此数组中列出的模型 ID 才会在 UI 中显示。
  - 如果未配置或为空数组，则显示所有模型
  - 配置后，只显示列出的模型 ID
  - 可以同时包含内置模型和自定义模型的 ID
