excerpt: '| `/fork` | `[name]` | ✅ 支持 | `/branch` 的别名；复制活跃对话历史并沿用会话设置，自动切换到新分支。含子代理历史的对话会提示暂不支持；可通过 `/resume` 返回原对话。 |

  | `/resume` | `[list \| session-id]` | ✅ 支持 | 恢复之前的会话。不带参数时打开交互式面板，`list` 列出所有会话，带 session-id 时直接切换到指定会话。 |'
