  heading: "声明产出的文件"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  Skill 生成交付物（pptx、pdf、xlsx 等）时，通常是跑一个脚本把文件做出来、再上传到对象存储拿到链接。这个链接默认只是脚本的一行普通输出：CodeBuddy Code 无从知道它是一份交付物，所以在被其他 Agent 通过 A2A 协议调用时，调用方收不到这份产物。
  脚本可以主动声明。每次执行 Bash 命令时，CodeBuddy Code 会为这次命令单独准备一个空文件，把它的路径放在环境变量 `$CODEBUDDY_ARTIFACTS` 里。脚本往这个文件追加一行 JSON，一行代表一个产物：
  ```bash
  echo '{"uri":"https://example.com/decks/q3.pptx","name":"Q3 业务回顾.pptx"}' >> "$CODEBUDDY_ARTIFACTS"
  ```
  命令结束后，CodeBuddy Code 读走这个文件并删除它。脚本不需要创建、清理或猜测这个路径，也不需要在多次调用之间做隔离——每次命令拿到的都是一个新文件。
  **声明只能走这个文件，标准输出不会被解析。** 早期版本曾约定在 stdout 打一行 `::codebuddy-artifact::` 标记，该写法已经移除：现在打这样一行只是普通输出，既不会产出 artifact，也不会有告警。仍在用旧写法的脚本请改成上面的 `>> "$CODEBUDDY_ARTIFACTS"`。
  之所以不从标准输出读，是因为它同时承载脚本自己说的话和它读出来转述的内容：`cat` 一个正好包含该标记的日志文件会被误当成真声明，而声明里如果写的是本地路径，文件内容就会被读出来发给调用方。带外文件没有这个顾虑——`cat` 写到 stdout，永远碰不到那个文件，所以本地路径只在这条通道里被接受。
