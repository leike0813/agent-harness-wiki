locator:
  kind: document_section
  heading: "配置作用域"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  - **user**：全局用户配置，应用于所有项目
  - **project**：项目级配置，应用于特定项目
  - **local**：本地配置，仅应用于当前会话或工作区
  对于同名服务（即在多个作用域有同名配置），生效的优先级为：`local > project > user`
