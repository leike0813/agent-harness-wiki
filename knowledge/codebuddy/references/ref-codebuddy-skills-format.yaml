  heading: "SKILL.md 格式"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  Skill 文件使用 Markdown 格式，支持 YAML Frontmatter 定义元数据：
  ```markdown
  ---
  name: pdf
  description: PDF 文档处理专家
  allowed-tools: Read, Write, Bash, WebFetch
  ---
  你是一个 PDF 文档处理专家，擅长：
  - 解析和提取 PDF 内容
  - 转换 PDF 为其他格式
  - 生成 PDF 报告
  当用户需要处理 PDF 相关任务时，请使用以下工作流：
  1. 首先检查 PDF 文件是否存在
  2. 使用适当的工具提取内容
  3. 根据需求进行处理
  4. 生成结果报告
  可用工具：
  - pdftotext：提取文本内容
  - pdfinfo：获取 PDF 信息
  ```
