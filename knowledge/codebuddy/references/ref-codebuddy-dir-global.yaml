schema_version: 2
record_kind: production
reference_id: ref-codebuddy-dir-global
harness_id: codebuddy
snapshot_id: snapshot-codebuddy-docs
locator:
  kind: document_section
  heading: "全局目录 `~/.codebuddy/`"
official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  ```
  ~/.codebuddy/
  ├── settings.json              # 用户级全局配置
  ├── settings.local.json        # 本地个人偏好（不共享）
  ├── CODEBUDDY.md               # 用户级记忆文件
  ├── mcp.json                   # 全局 MCP 服务器配置
  ├── statusline-command.sh      # 自定义状态行脚本（可选）
  │
  ├── agents/                    # 用户级自定义子代理（所有项目可用）
  ├── rules/                     # 用户级规则文件（所有项目可用）
  ├── skills/                    # 用户级技能（所有项目可用）
  │
  ├── projects/                  # 各项目的会话与子代理运行时数据
  ├── sessions/                  # 会话数据
  ├── plans/                     # 计划模式生成的计划文件
  │
  ├── logs/                      # 运行日志
  ├── traces/                    # 执行追踪数据（OpenTelemetry）
  ├── file-history/              # 文件变更历史
  ├── history.jsonl              # 对话历史
  ├── blobs/                     # 二进制资源（图片、截图等）
  ├── tasks/                     # 任务追踪数据
