excerpt: |-
  | 操作 | 重新加载 | 说明 |
  |------|---------|------|
  | 进程重启 | 是 | 缓存清空 |
  | 通过 /memory 编辑 | 是 | 自动清除缓存 |
  | /clear 命令 | 否 | 仅清除消息历史 |
