official_url: "https://cnb.cool/codebuddy/codebuddy-code"
excerpt: |-
  - **集中发现**：在一个地方浏览来自多个来源的插件
  - **版本管理**：自动跟踪和更新插件版本
  - **自动更新**：支持启用自动更新，定期同步市场内容
  - **团队分发**：在组织内共享必需的插件
  - **灵活来源**：支持 GitHub 仓库、Git URL、本地路径和 HTTP URL
  - **两步流程**：先添加市场，再安装具体插件
