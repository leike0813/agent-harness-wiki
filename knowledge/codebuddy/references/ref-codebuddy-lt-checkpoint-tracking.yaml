excerpt: 'CodeBuddy Code 会跟踪其文件编辑工具所做的所有更改：

  - 每个用户提示都会创建一个新的检查点

  - 检查点会跨会话持久保存，因此您可以在恢复的对话中访问它们

  - 检查点会随会话在 30 天后自动清理（可配置）'
