excerpt: '- **复制与导出**：模型输出、用户消息、频道来信、代码块、工具调用的参数与结果都提供一键复制；Markdown 表格可复制为 Markdown 或 TSV，Mermaid 图可复制源码或导出 SVG；右上角支持整轮对话导出为 Markdown / JSON（JSON 保留完整时间线）。输入 `/export` 可下载当前会话的 ZIP 归档，包含对话记录及可用的会话日志；共享工作区日志只收录含当前会话 ID 的行。归档可能包含提示词、本地路径和敏感信息，分享前请检查。复制类按钮在触屏与窄屏下常驻显示。'
