excerpt: '| `daemon.autoRestartOnUpdate` | daemon 自动安装新版本（或检测到磁盘上的 CLI 已被升级）后，是否在空闲时自动重启到新版本（默认 `true`）。关闭时保持待重启，可在 Web UI / Desktop 中手动重启；环境变量 `CODEBUDDY_DAEMON_AUTO_RESTART_DISABLED=1` 强制关闭。状态见 `GET /api/v1/info` 的 `autoUpdate`，立即检查用 `POST /api/v1/update/check` | `{"autoRestartOnUpdate": false}` |'