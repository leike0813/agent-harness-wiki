  ### 📦 使用包管理器安装
  #### Node.js 包管理器
  **前置要求:** Node.js 18.20 或更高版本
  选择你喜欢的包管理器执行以下命令:
  ::: code-group
  ```bash [npm]
  npm install -g @tencent-ai/codebuddy-code
  ```
  ```bash [pnpm]
  pnpm add -g @tencent-ai/codebuddy-code
  ```
  ```bash [yarn]
  yarn global add @tencent-ai/codebuddy-code
  ```
  ```bash [bun]
  bun install -g @tencent-ai/codebuddy-code
  ```
  :::
