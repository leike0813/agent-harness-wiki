excerpt: |-
  插件技能和代理的 Markdown 文件支持 LF、Windows CRLF 换行，以及带 UTF-8 BOM 的文件头。YAML Frontmatter 必须从文件开头开始，以各自独立一行的 `---` 包围；结束标记之后为正文。
  ### 1. Skills（技能）
  插件通过添加技能来扩展 CodeBuddy，创建 `/name` 快捷方式供用户或 AI 助手调用。
  **位置**：插件根目录的 `skills/` 或 `commands/` 目录
  **文件格式**：技能是包含 `SKILL.md` 的目录；命令是简单的 Markdown 文件
  **目录结构**:
  ```
  skills/
  ├── pdf-processor/
  │   ├── SKILL.md
  │   ├── reference.md （可选）
  │   └── scripts/ （可选）
  └── code-reviewer/
      └── SKILL.md
  ```
  **集成行为**:
  - 安装插件时自动发现技能和命令
  - AI 助手可根据任务上下文自动调用
  - 技能可以包含辅助文件和脚本
  详见 [Skills](skills.md)。
  ### 2. Agents（代理）
  插件可以提供专门的子代理用于特定任务，AI 助手可以在适当时自动调用。
  **位置**：插件根目录的 `agents/` 目录
  **格式**：描述代理能力的 Markdown 文件
  **Frontmatter 配置**:
  ```markdown
  ---
  name: agent-name
  description: 代理的专长和调用时机
  model: sonnet
  effort: medium
  maxTurns: 20
  disallowedTools: Write, Edit
  ---
  代理的详细系统提示词，描述其角色、专长和行为。
  ```
