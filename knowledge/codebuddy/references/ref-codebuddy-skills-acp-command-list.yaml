excerpt: 命令列表会包含当前可调用的项目级、用户级和插件 Skill，并在 Skill 加载完成或可见性配置变化后自动刷新。列表会过滤掉客户端专属命令（如 `/theme`、`/config`）和终端面板专属命令（如 `/stats`、`/rewind`），只推送适用于 ACP 模式的命令。`/clear`、`/compact` 等会话控制命令会下发，由 ACP 客户端触发后由服务端执行。
