locator:
  kind: document_section
  heading: "Local Agents (Workspace-Specific)"
official_url: "https://github.com/aws/amazon-q-developer-cli"
excerpt: |-
  Local agents are stored in the current working directory under:
  ```
  .amazonq/cli-agents/
  ```
  These agents are specific to the current workspace or project and are only available when running Q CLI from that directory or its subdirectories.
  **Example structure:**
  ```
  my-project/
  ├── .amazonq/
  │       └── cli-agents/
  │           ├── dev-agent.json
  │           └── aws-specialist.json
  └── src/
      └── main.py
  ```
