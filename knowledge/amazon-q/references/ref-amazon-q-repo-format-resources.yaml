locator:
  kind: document_section
  heading: Resources Field
official_url: "https://github.com/aws/amazon-q-developer-cli"
excerpt: |-
  The `resources` field gives an agent access to local resources. Currently, only file resources are supported, and all resource paths must start with `file://`.
  ```json
  {
    "resources": [
      "file://AmazonQ.md",
      "file://README.md",
      "file://.amazonq/rules/**/*.md"
    ]
  }
  ```
  Resources can include:
  - Specific files
  - Glob patterns for multiple files
  - Absolute or relative paths
