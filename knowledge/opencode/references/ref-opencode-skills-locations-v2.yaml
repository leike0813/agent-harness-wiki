excerpt: |-
  ## Discovery
  | Global                | `~/.config/opencode/skills`            |
  | Global compatibility  | `~/.claude/skills`, `~/.agents/skills` |
  | Project               | `.opencode/skills`                     |
  | Project compatibility | `.claude/skills`, `.agents/skills`     |
  For project sources, OpenCode searches from the current directory up to the project root.
  - Markdown files must be at the source root, such as `skills/review.md`.
  - Files named exactly `SKILL.md` can be nested in grouping directories, such as `skills/git-release/SKILL.md`.
  - A directory containing `SKILL.md` is one skill. OpenCode does not search inside it for more skills.
  - Hidden files and directories and `node_modules` are skipped.
  - Search stops six directories below the source root.
