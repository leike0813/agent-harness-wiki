excerpt: |-
  ## Loading
  At each model step, OpenCode lists permitted skills that have a description and do not set `opencode/autoinvoke` to `false`. The list includes only the ID, name, and description, not the full Markdown body.
  The model loads a skill by calling the `skill` tool with its exact ID:
  { "id": "git-release" }
  OpenCode then selects the current definition, checks the selected agent's `skill` permission, adds the Markdown body without frontmatter, and provides the base directory plus a sample of up to ten supporting file paths.
  To load a skill yourself, mention it in your prompt as `@skill-id`.
  Supporting file contents are not loaded automatically. The file sample covers directory-based `SKILL.md` skills; flat Markdown skills get no list.
