excerpt: |-
  You can customize the built-in agents or create your own through configuration. Agents can be configured in two ways:
  Configure agents in your `opencode.json` config file:
  {
    "$schema": "https://opencode.ai/config.json",
    "agent": {
      "build": { "mode": "primary", "model": "anthropic/claude-sonnet-4-20250514", "prompt": "{file:./prompts/build.txt}" },
      "code-reviewer": { "description": "Reviews code for best practices and potential issues", "mode": "subagent", "permission": { "edit": "deny" } }
    }
  }
