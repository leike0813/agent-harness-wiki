excerpt: |-
  | `name`                         | Display name; defaults to the path-derived ID                     |
  | `description`                  | Summary used to show the skill to the model                       |
  | `metadata.opencode/autoinvoke` | Set to `false` to omit the skill from the model's available list  |
  | `disable-model-invocation`     | Set to `true` for the same effect as `opencode/autoinvoke: false` |
  All frontmatter is optional at runtime. Skills without a description are not advertised.
  When both `disable-model-invocation` and `opencode/autoinvoke` are set, `opencode/autoinvoke` wins. V2 accepts portability fields such as `license` and `compatibility` but does not interpret them.
