excerpt: |-
  Use `client.app.log()` instead of `console.log` for structured logging:
  await client.app.log({
    body: {
      service: "my-plugin",
      level: "info",
      message: "Plugin initialized",
      extra: { foo: "bar" },
    },
  })
  Levels: `debug`, `info`, `warn`, `error`. See SDK documentation for details.
