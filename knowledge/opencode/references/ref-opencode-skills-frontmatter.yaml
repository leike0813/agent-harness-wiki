excerpt: |-
  Each `SKILL.md` must start with YAML frontmatter.
  Only these fields are recognized:
  - `name` (required)
  - `description` (required)
  - `license` (optional)
  - `compatibility` (optional)
  - `metadata` (optional, string-to-string map)
  Unknown frontmatter fields are ignored.
  `name` must be 1-64 characters, lowercase alphanumeric with single hyphen separators, not start or end with `-`, not contain consecutive `--`, and match the directory name that contains `SKILL.md`.
  `description` must be 1-1024 characters.
