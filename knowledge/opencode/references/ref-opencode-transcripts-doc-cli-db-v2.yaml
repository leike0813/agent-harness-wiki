  ### db

  Database tools.

  ```bash
  opencode db [query]
  ```

  #### Flags

  | Flag                                   | Description                    |
  | -------------------------------------- | ------------------------------ |
  | <nobr><code>{"--format"}</code></nobr> | Output format: `json` or `tsv` |

  ---

  #### path

  Print the database path.

  ```bash
  opencode db path
  ```
