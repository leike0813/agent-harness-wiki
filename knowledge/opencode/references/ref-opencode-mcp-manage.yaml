excerpt: |-
  Your MCPs are available as tools in OpenCode, alongside built-in tools. So you can manage them through the OpenCode config like any other tool.
  "tools": { "my-mcp-foo": false }
  We can also use a glob pattern to disable all matching MCPs.
  "tools": { "my-mcp*": false }
  Here we are using the glob pattern `my-mcp*` to disable all MCPs.
  If you have a large number of MCP servers you may want to only enable them per agent and disable them globally.
  The glob pattern uses simple regex globbing patterns: `*` matches zero or more of any character, `?` matches exactly one character, all other characters match literally.
  MCP server tools are registered with server name as prefix, so to disable all tools for a server simply use "mymcpservername_*": false.
