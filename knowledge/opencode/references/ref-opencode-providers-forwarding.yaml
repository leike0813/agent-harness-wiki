excerpt: |-
  Provider options can include `timeout`, `headerTimeout`, `chunkTimeout`, and `setCacheKey`:
  "provider": {
    "anthropic": {
      "options": { "timeout": 600000, "chunkTimeout": 30000, "setCacheKey": true }
    }
  }
  - timeout - Request timeout in milliseconds (default: 300000). Set to `false` to disable.
  - headerTimeout - Timeout in milliseconds to wait for response headers (default: 300000). This timer stops once headers arrive and does not limit the streamed response body.
  - chunkTimeout - Timeout in milliseconds between streamed response chunks (default: 300000). If no chunk arrives in time, the request is aborted.
  - setCacheKey - Ensure a cache key is always set for designated provider.
