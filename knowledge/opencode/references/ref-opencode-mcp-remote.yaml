excerpt: |-
  Add remote MCP servers by setting `type` to `"remote"`.
  "my-remote-mcp": {
    "type": "remote",
    "url": "https://my-mcp-server.com",
    "enabled": true,
    "headers": { "Authorization": "Bearer MY_API_KEY" }
  }
  The `url` is the URL of the remote MCP server and with the `headers` option you can pass in a list of headers.
  | `type` | must be `"remote"`. | `url` | URL of the remote MCP server. | `enabled` | Enable or disable the MCP server on startup. | `headers` | Headers to send with the request. | `oauth` | OAuth authentication configuration. | `timeout` | Timeout in ms for fetching tools from the MCP server. Defaults to 5000 (5 seconds). |
