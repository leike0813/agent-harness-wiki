  export function decision(
    policies: readonly ConfigPolicy.Info[],
    action: ConfigPolicy.Info["action"],
    resource: string,
  ) {
    return (
      policies.findLast((policy) => policy.action === action && Wildcard.match(resource, policy.resource))?.effect ??
      "allow"
    )
