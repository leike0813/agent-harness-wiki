excerpt: |-
  Control which skills agents can access using pattern-based permissions in `opencode.json`:
  | Permission | Behavior |
  | `allow` | Skill loads immediately |
  | `deny` | Skill hidden from agent, access rejected |
  | `ask` | User prompted for approval before loading |
  Patterns support wildcards: `internal-*` matches `internal-docs`, `internal-tools`, etc.
  Give specific agents different permissions than the global defaults, for custom agents in agent frontmatter or for built-in agents in `opencode.json`.
  Completely disable skills for agents that shouldn't use them: for custom agents `tools: skill: false`, for built-in agents `agent.plan.tools.skill: false`. When disabled, the available skills section is omitted entirely.
