  heading: Hook events
official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  TraeCode supports the following six types of hook events. For detailed information about input, output, and other details of each event, refer to  .
  | Event Name | Trigger Timing | Main Purpose |
  | --- | --- | --- |
  | SessionStart | After creating a session, before initiating the first chat. | Initialize the environment, inject environment variables, or supplement the context. |
  | UserPromptSubmit | After the user sends a query, before the agent begins processing. | Intercept unauthorized requests or attach context to the model. |
  | PreToolUse | After the agent initiates a tool call, before actual execution. | Validate, intercept, or modify tool parameters, or require user confirmation. |
  | PostToolUse | After the tool call has been executed.
