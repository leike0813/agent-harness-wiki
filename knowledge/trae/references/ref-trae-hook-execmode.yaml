  heading: Execution mode
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  The actual permissions and accessible scope of hook commands depend on the execution mode you configure:
  Run in Sandbox: Hook commands are automatically executed within the sandbox. File access and system permissions are restricted by the sandbox.
  Run Automatically Locally: Hook commands are automatically executed outside the sandbox and can access the local environment. This carries higher security risks. Exercise caution when selecting this option.
  For details on how to configure the execution mode for hook commands, refer to  .
