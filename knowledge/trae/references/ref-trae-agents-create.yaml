excerpt: |-
  You can build custom intelligent agents using two methods: intelligent generation and manual creation.
  Enter @ in the AI chat input box, then click the Create Agent button at the bottom of the floating panel.
  You enter the Create Agent panel.
  Choose a method to create an agent, including smart generation and manual creation.
  ### Smart generation (recommended)
  If you choose to create agents with smart generation, use the following steps:
  In the top-right corner of the Create Agent panel, click the Smart Generate button.
  In the Smart Generate Agent popup window, describe the agent's functionality, use cases, appropriate timing for use, and other relevant information. It is recommended to provide a comprehensive description so that the generated agent can better meet your requirements.
