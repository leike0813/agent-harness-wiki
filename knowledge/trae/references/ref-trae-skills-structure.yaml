  heading: Skill structure
official_url: "https://docs.trae.ai/ide/skills"
excerpt: |-
  A skill must include a SKILL.md file. Based on actual needs, you can add optional files like executable scripts, references such as templates and style guides, and more. For example:
  ```Plain Text
  skill-name/
  ├── SKILL.md               # (Required) Core instructions for the agent
  ├── examples/              # (Optional) Example input/output
      ├── input.md
      └── output.md
  ├── templates/             # (Optional) Reusable templates
      └── component.tsx
  └── resources/             # (Optional) References, scripts, materials, etc
      └── style-guide.md
  ```
