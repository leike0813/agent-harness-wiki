official_url: "https://docs.trae.ai/ide/ignore-files"
excerpt: |-
  To continuously improve our service and deliver a more native agentic coding experience, the "Indexing & Docs" feature in TRAE's settings canter will be discontinued for client versions released on or after October 22, 2026. Older versions of the TRAE client are currently not affected by this change.
  Once the feature is discontinued, you will no longer be able to access your existing indexes or documentation, and locally cached index data will be cleared (your source code will not be deleted). Please save any relevant data and configurations by October 22, 2026, if you wish to retain them.
  For future file-based Q&A, you may use the "Upload Attachment" feature in the input box.
