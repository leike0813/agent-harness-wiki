  heading: Edit / share / delete agents
official_url: "https://docs.trae.ai/ide/agent"
excerpt: |-
  You can manage custom agents in the following ways:
  Modify the configurations of your custom agents.
  Share custom agents directly to X via TraeCode, or copy their links to distribute through other channels.
  ::: Note
  Before sharing, it's recommended to remove any sensitive information from the prompt and MCP server configuration.
  :::
  Delete custom agents.
  From the custom agents list, click the Settings icon, choose the desired action from the menu, and follow the on-screen instructions.
  To share an agent, in addition to using the agent settings menu, you can also enter the agent's editing panel first and then click the Share button next to the agent's name to share it.
