locator:
  kind: document_section
  heading: Uninstall an extension
official_url: "https://docs.trae.ai/ide/manage-extensions"
excerpt: |-
  Open the extension store in TraeCode.
  In the Installed list, find the extension you want to uninstall.
  Move the cursor over the extension and click Uninstall.
  OR
  Click the extension to open its details window and click Uninstall.
