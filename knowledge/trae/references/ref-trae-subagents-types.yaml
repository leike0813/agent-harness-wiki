  heading: Subagent types
official_url: "https://docs.trae.ai/ide/subagents"
excerpt: |-
  | Type | Scope | Configuration file path |
  | --- | --- | --- |
  | User subagents | A user subagent applies to all projects on the current device. | macOS & Linux: ~/.trae-cn/agents/{my_agent}.md Windows: %userprofile%/.trae-cn/agents/{my_agent}.md |
  | Project subagents | A project subagent is stored within the current project's code repository and applies only to that project. | {project_folder}/.trae/agents/{my_agent}.md |
