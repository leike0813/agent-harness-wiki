locator:
  kind: document_section
  heading: Add MCP servers from the MCP marketplace
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  The MCP marketplace offers popular MCP servers from the community. You can add them to your project.
  In IDE mode, click the Settings icon in the upper-right corner to open the Settings window.
  OR
  In SOLO mode, click the Settings icon in the upper-right corner of the chat panel to open the Settings window.
  From the left navigation bar, select MCP to open the MCP window.
  In the upper-right corner of the MCP window, click Add > Add from Marketplace. If you are adding an MCP server for the first time, you can also click the Add from Marketplace button in the center of the window.
  This directs you to the MCP marketplace in TraeCode.
  Find your desired MCP server.
  Click the + button at the right.
  In the pop-up window, fill the JSON configuration information for that MCP server.
  ::: Note
