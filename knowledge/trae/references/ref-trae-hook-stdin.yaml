locator:
  kind: document_section
  heading: Common stdin fields
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  The stdin JSON for each hook event contains the following common fields:
  ```JSON
  {
    "session_id": "string",
    "cwd": "/path/to/workspace",
    "hook_event_name": "PreToolUse",
    "workspace_roots": ["/path/to/workspace"]
  }
  ```
  | Field | Type | Description |
  | --- | --- | --- |
  | session_id | string | The current session ID. |
  | cwd | string | The actual working directory of the current hook command. For more information, refer to . |
  | hook_event_name | string | The name of the current hook event. |
  | workspace_roots | string[] | If there are multiple workspaces, this field will contain the root directories of all workspaces. |
