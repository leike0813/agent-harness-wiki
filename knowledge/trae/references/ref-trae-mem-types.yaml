  heading: Memory types
official_url: "https://docs.trae.ai/ide/memories"
excerpt: |-
  TraeCode supports global memories and project memories. The two memory types are described below:
  | Memory Type | Scope | Storage Location |
  | --- | --- | --- |
  | Global memory | Applies to all local projects for the current user. | macOS & Linux: ~/.trae/memory/user_profile.md Windows: %userprofile%/.trae/memory/user_profile.md |
  | Project memory | Applies only to the current local project for the current user. | macOS & Linux: ~/.trae/memory/projects/{project_path}/project_memory.md Windows: %userprofile%/.trae/memory/projects/{project_path}/project_memory.md |
