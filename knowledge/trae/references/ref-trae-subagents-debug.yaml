locator:
  kind: document_section
  heading: "Subagent not invoked?"
official_url: "https://docs.trae.ai/ide/subagents"
excerpt: |-
  | Check item | How to troubleshoot |
  | --- | --- |
  | Feature switch | Go to Settings > Beta > Subagents, ensure that the Enable Subagents Directory switch is toggled on. |
  | File path | Ensure that the configuration files for user and project subagents are in the correct directories. |
  | Validity of name | Ensure that the value of the name field starts with a letter, contains only letters, numbers, and hyphens, ends with a letter or number, and is no longer than 50 characters. |
  | Presence of description | Files without the description field cannot be parsed correctly. |
  | Format of frontmatter | Ensure that the frontmatter is standard YAML: it starts and ends with --- and does not contain a BOM. |
