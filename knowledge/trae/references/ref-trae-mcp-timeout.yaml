locator:
  kind: document_section
  heading: Timeout configuration
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  The stdio MCP server supports timeout settings through the env field:
  ```JSON
  "env": {
      "START_MCP_TIMEOUT_MS": "60000",  // Startup timeout for the MCP server (in milliseconds)
      "RUN_MCP_TIMEOUT_MS": "60000"     // Timeout for calling an MCP server's tools (in milliseconds)
  }
  ```
  The HTTP MCP server supports timeout setting through the headers field:
  ```JSON
  "headers": {
      "START_MCP_TIMEOUT_MS": "60000",  // Startup timeout for the MCP server (in milliseconds)
      "RUN_MCP_TIMEOUT_MS": "60000"     // Timeout for invoking MCP server tools (in milliseconds)
  }
  ```
