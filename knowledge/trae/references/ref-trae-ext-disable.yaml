locator:
  kind: document_section
  heading: Disable an extension
official_url: "https://docs.trae.ai/ide/manage-extensions"
excerpt: |-
  Open the extension store in TraeCode.
  In the Installed list, find the extension you want to disable.
  Move the cursor over the extension and click Settings > Disable.
  OR
  Click the extension to open its details window and click Disable.
