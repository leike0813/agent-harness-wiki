  heading: Set rules for Git commit messages
official_url: "https://docs.trae.ai/ide/rules"
excerpt: |-
  TraeCode supports setting rules for AI-generated Git commit messages to ensure they meet project requirements. You only need to configure the scene: git_message field in the rule file.
  The scene: git_message field is compatible with existing fields such as alwaysApply, description, and globs. As long as the rule file contains this field, regardless of how other fields are configured, the AI will follow the rule in scene: git_message when generating Git commit messages.
  If multiple rule files in the project contain scene: git_message, the AI will follow the rules in all of these files.
  ### Method 1: Add rules to an existing file
  The steps for setting rules for AI-generated Git commit messages are as follows:
  In the current project, open an existing rule file.
