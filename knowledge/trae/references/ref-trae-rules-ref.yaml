  heading: Reference rules in a chat
official_url: "https://docs.trae.ai/ide/rules"
excerpt: |-
  For rules of the “Apply Manually” type, reference them in the chat input box using #Rule.
  ::: Note
  Among rule referencing methods, #Rule has the highest priority. For project rules with application mode of “Apply to Specific Files” or “Apply Intelligently”, if you mention these rules in the chat using #Rule, the AI will also use them in this chat.
  :::
