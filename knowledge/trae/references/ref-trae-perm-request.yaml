  heading: How agents request permissions
official_url: "https://docs.trae.ai/ide/permission-and-approval"
excerpt: |-
  When an agent performs an operation that exceeds the current permission scope or triggers a security rule requiring approval, TraeCode determines the approval method based on the current permission mode.
  Manual Approval
  In "Manual Approval" mode, if an agent accesses a file path outside the default permission scope or executes a dangerous command that hits a security rule, the agent displays an approval card in the chat flow for the user to confirm whether to allow the operation to proceed.
  Automatic Approval
  In "Automatic Approval" mode, except for dangerous commands, operations that would normally require user approval are automatically evaluated by LLM Guardian to determine whether to allow them.
  Custom
