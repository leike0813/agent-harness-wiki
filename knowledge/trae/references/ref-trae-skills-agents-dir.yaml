locator:
  kind: document_section
  heading: Use the .agents skill directory
official_url: "https://docs.trae.ai/ide/skills"
excerpt: |-
  The .agents skill directory (that is, .agents/skills/) is a convention-based directory specified by Agent Skills for storing skills. You can add this directory to your project, enabling the agent to automatically discover and load the skills within it at runtime.
  ### Important notes
  If a skill you create in TraeCode (located in the .trae/skills/ directory) has the same name as a skill in .agents/skills/, the system will prioritize the skill in the .trae/skills/ directory.
  ### Install skills in the .agents/skills/ directory
  You can use a skill named "find-skills" to quickly install the required skills in the .agents/skills/ directory.
