  heading: From the marketplace of VS Code
official_url: "https://docs.trae.ai/ide/manage-extensions"
excerpt: |-
  ::: Note
  The C/C++ extensions and other platform-specific extensions cannot be installed using this method. You need to manually download the VSIX package for the platform-specific extension you are using.
  :::
  If TraeCode's extension store does not provide the extension you want, you can install it from VS Code's marketplace to TraeCode.
  Go to VS Code's marketplace.
  Search for the extension you want. For example, Deno.
  Select your desired extension from the search results.
  This directs you to the extension's details screen.
  On the extension's details screen, click Version History.
  Extract the values of the following fields from the URL of the details screen and the version history information. Take the Deno extension as an example:
  itemName: The itemName field in URL query.
