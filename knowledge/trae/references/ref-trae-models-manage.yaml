  heading: Manage custom models
official_url: "https://docs.trae.ai/ide/models"
excerpt: |-
  After adding a custom model, you can edit, delete, enable, or disable it.
  | Operation | Description |
  | --- | --- |
  | Edit a model | Click the Edit icon, then modify the model's advanced configuration. |
  | Delete a model | Click the Delete icon, then confirm again in the pop-up window. After deletion, the current model will be removed from the list and can no longer be used. |
  | Enable/disable a model | After enabling, the custom model will appear in the model list of the chat input box; after disabling, the model will remain on the model management panel but will not appear in the model list of the chat input box. |
