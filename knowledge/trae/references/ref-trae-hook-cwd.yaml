  heading: Working directory
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  The working directories for executing global and project hook commands are as follows:
  | Hook Command Type | Working Directory |
  | --- | --- |
  | Global hook command | Single workspace: The root directory of this workspace. Multiple workspaces: The root directory of the first workspace. |
  | Project hook command | The root directory of the project where the configuration file of this hook is located. |
