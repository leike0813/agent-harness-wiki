locator:
  kind: document_section
  heading: Subagent override rules
official_url: "https://docs.trae.ai/ide/subagents"
excerpt: |-
  If multiple {my_agent}.md files define subagents with the same name, the following override rules apply:
  A project subagent overrides a user subagent with the same name.
  For multiple subagents with the same name of the same type, whether user subagents or project subagents, only the first loaded subagent takes effect. Later ones are ignored.
