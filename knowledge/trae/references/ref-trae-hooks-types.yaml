official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  TraeCode supports both global and project hooks:
  | Hook Type | Scope | Recommended Configuration |
  | --- | --- | --- |
  | Global hook | Applies to all workspaces under the current user on this device. | General security policies, unified context injection, or cross-project validation rules. |
  | Project hook | Applies only to the current project or workspace. | Scripts, tests, and formatting processes that are closely related to the specific project. |
  For the locations of two types of hooks, refer to  .
