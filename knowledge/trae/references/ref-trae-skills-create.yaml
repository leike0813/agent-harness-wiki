excerpt: |-
  ### Method 1: Automatically create skills via chat with AI
  You can directly create skills through chat. You only need to describe your requirements to the AI, and the AI will automatically generate the corresponding SKILL.md file for your skill.
  For example:
  ```Markdown
  Craete a new skill under the ./trae/skills directory
  The name of the skill is xxx
  This skill can do the following:
  - xxx
  - xxx
  - xxx
  ```
  ### Method 2: Manually create skills
  You can manually create skills by entering the skill name, description, and instructions.
  Go to Settings > Skills & Commands.
  In the Skills section, click the Create button, and select a skill type (Global / Project).
  The Create Skill window pops up.
  Set the Skill name, Description, and Instructions fields.
