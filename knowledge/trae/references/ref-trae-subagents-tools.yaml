  heading: Available tools
official_url: "https://docs.trae.ai/ide/subagents"
excerpt: |-
  Subagents can invoke the following tools:
  | Tool name | Functionality |
  | --- | --- |
  | Bash | Runs terminal commands. |
  | Edit | Edits or deletes files. |
  | Glob | Searches for files by filename pattern. |
  | Grep | Searches file contents using regular expressions. |
  | Read | Reads files or directories. |
  | Skill | Invokes skills. |
  | TodoWrite | Manages task lists. |
  | WebFetch | Fetches webpage content. |
  | WebSearch | Searches the web. |
  | Write | Creates or overwrites files. |
  | LSP | Checks syntax issues through the language server. |
  | mcp__<server_name>__<tool_name> | Limits the subagent to invoke a specified tool under a specified MCP server. This tool should be used together with the mcpServers field.
