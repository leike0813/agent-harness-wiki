  heading: MCP invocation rules
official_url: "https://docs.trae.ai/ide/custom-global-permission-configuration-reference"
excerpt: |-
  The customProfiles.defaultCustomProfile.approval.mcpRules field is used to configure approval and execution policies based on MCP server or MCP tool. It is suitable for fine-grained management of tool invocations from different MCP servers, such as allowing trusted tools, intercepting high-risk tools, or requiring user confirmation before invocation.
  This field is configured as key-value pairs, where the key is the MCP tool matching pattern and the value is the corresponding approval and execution policy.
  MCP tool matching pattern:
  | Format | Example | Description |
  | --- | --- | --- |
  | Exact match | mcpserver__mcptool | Matches the specified MCP tool in the specified MCP Server. |
  | Server wildcard | mcpserver__ or mcpserver | Matches all MCP tools in the specified MCP Server. |
