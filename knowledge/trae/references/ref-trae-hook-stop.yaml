excerpt: |-
  Trigger timing: When the agent completes output and is ready to end the current query. At this point, you can check whether the agent's output meets the requirements; if not, you can prevent the agent from ending the task and require it to continue processing.
  Purpose of hook: Prevent the agent from ending the current task and require it to continue processing.
