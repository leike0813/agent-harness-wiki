locator:
  kind: document_section
  heading: "How are subagents invoked?"
official_url: "https://docs.trae.ai/ide/subagents"
excerpt: |-
  The "Agent" invokes a subagent as follows:
  User sends a message: After receiving a user message, the "Agent" determines the current task type.
  Match the description: The "Agent" matches the user's intent against the description fields of all available subagents.
  Decide whether to invoke: If a subagent's description is highly relevant to the task, the "Agent" automatically delegates the task to that subagent.
  Execute the task: The subagent completes the task within its own context window using allowed tools and MCP servers.
  Return the result: The subagent returns the result to the "Agent", which summarizes it and presents it to the user.
