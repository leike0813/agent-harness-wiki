excerpt: |-
  After enabling the "Auto-Run" feature, the agent may execute external tools or commands without requiring your confirmation each time. Before enabling, assess the usage environment, MCP server source, command execution permissions, and data security risks, and use only in trusted environments.
  Automatically run MCP
  After enabling "Automatically Run MCP", the agent can run the associated MCP servers and its tools without manual confirmation.
  Note that:
  All external MCP server connections require your explicit authorization the first time.
  It is not recommended to enable this feature in unverified or untrusted environments.
  If an MCP server can access files, networks, databases, or other sensitive resources, ensure that its permission scope matches your security requirements.
