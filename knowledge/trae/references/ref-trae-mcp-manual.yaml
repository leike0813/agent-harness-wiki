  heading: Add MCP servers manually
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  If you do not find desired MCP servers in the marketplace or you want to use the MCP servers developed by yourself, you can add them manually.
  In IDE mode, click the Settings icon in the upper-right corner to open the Settings window.
  OR
  In SOLO mode, click the Settings icon in the upper-right corner of the chat panel to open the Settings window.
  From the left navigation bar, select MCP to open the MCP window.
  In the upper-right corner of the MCP window, click Add > Add Manually. If you are adding an MCP server for the first time, you can also click the Add Manually button in the center of the window.
  The Configure Manually window appears.
  Fill in the JSON configuration information for that MCP server. For more information, refer to the "MCP server configuration" section.
  ::: Note
