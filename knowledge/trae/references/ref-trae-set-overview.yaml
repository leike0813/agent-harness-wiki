excerpt: |-
  ### Account
  The account-related settings are as follows:
  | Type | Setting | Description |
  | --- | --- | --- |
  | Account information | - | Displays the current user's nickname and linked account information. Click the Manage Account button to go to the account management page, where you can modify your avatar and nickname. After clicking ···, the Export user data and Delete account options will appear, allowing you to export your usage data in TraeCode, including your avatar's original image, builder data, chat data, and IDE settings data, as well as to delete your current account. Click the View button next to the plan type to visit TRAE's official website and view usage. |
