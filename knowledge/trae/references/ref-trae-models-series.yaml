  heading: "Reference: TraeCode's built-in optimizations to different model series"
official_url: "https://docs.trae.ai/ide/models"
excerpt: |-
  When adding models from a specific series via custom configuration, you can select TraeCode's preset options for model series. TraeCode has optimized the prompts and hyperparameters for these series to improve model performance, refer to the following table for details.
  | Option | Description |
  | --- | --- |
  | GPT-5 series | Designed for integration with GPT-5 family models. Compared with the default configuration, this option offers the following advantages: Automatic protocol adaptation: The GPT-5 protocol requires the MaxCompletionTokens field to specify the maximum generation length (the default configuration uses MaxTokens). After selecting this series, TraeCode automatically converts the protocol fields, preventing request failures due to protocol mismatches.
