excerpt: |-
  The general settings are as follows:
  | Type | Setting | Description |
  | --- | --- | --- |
  | Basics | Theme | Used to set the interface theme. The available options in the dropdown list are Dark, Deep Blue, and Light. You can also select More Themes, then choose other themes in the pop-up panel. |
  |  | Language | Used to set the display language for button labels in the interface and other in-app text. The available options in the dropdown list are Chinese (Simplified) 简体中文, English, and 日本語. |
  | Preferences | Editor Settings | Used to configure editor-related parameters such as font, word-wrap, and window. Click the Go to Settings button to open the editor settings page, then complete the relevant settings. |
  |  | Shortcut Settings | Used to set the style for keyboard shortcuts.
