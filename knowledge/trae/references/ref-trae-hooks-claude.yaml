locator:
  kind: document_section
  heading: Import hooks from Claude Code
official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  TraeCode supports reading hook configurations from Claude Code. For information about the hook configuration file paths and hook execution rules for Claude Code, refer to  .
  Go to Settings > Hooks.
  In the Configuration section, select the Hook type to import: Global or Project.
  Toggle the Import Hook configuration in CLAUDE switch on.
  In the pop-up security warning panel, read the warning message. After confirming there is no risk, click the Enable button.
  ::: Note
  The input and output parameters for hook events with the same name may differ between TraeCode and Claude Code.
