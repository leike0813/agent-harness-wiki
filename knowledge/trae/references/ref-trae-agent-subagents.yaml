  heading: "Add Subagents to \"Agent\""
official_url: "https://docs.trae.ai/ide/built-in-agent"
excerpt: |-
  "Agent" supports invoking custom agents to complete modular tasks. After subagents are configured, "Agent" acts as the primary agent and delegates tasks to more suitable subagents when handling scenarios with long context or high complexity.
  "Agent" includes the built-in subagent "Search" by default, which is used to search and inspect files. "Search" helps "Agent" quickly locate the project structure, relevant code, configuration files, and documentation, so it can more accurately determine which tool or subagent to invoke next.
  Subagents are well suited for clearly scoped professional tasks, such as code review, security review, API analysis, documentation optimization, test supplementation, or development for a specific module.
