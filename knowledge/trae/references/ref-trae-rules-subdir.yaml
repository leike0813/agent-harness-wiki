locator:
  kind: document_section
  heading: About creating rules for subdirectories
official_url: "https://docs.trae.ai/ide/rules"
excerpt: |-
  In a large project, there are usually multiple folders, each representing a different module or technology stack. If all rules (including AGENTS.md) are configured in the project root directory, it is not only difficult to maintain but may also cause exclusive rules for one module to interfere with other modules.
  TraeCode supports reading the .trae/rules/ folder in any subdirectory of the project. To configure rules for a specific module, you can directly place the rule files in that module's folder. When you mention files in that directory in a chat, or when the AI reads files in that directory while dealing with tasks, the system will automatically apply the exclusive rules in that directory.
  Example structure:
  ```Plain Text
  my-project/
  ├── .trae/
