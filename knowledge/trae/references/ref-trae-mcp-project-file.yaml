  heading: Project-level MCP server
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  You can create an mcp.json file in the .trae/ directory under the project root and declare one or more MCP servers' configurations in it. When the corresponding capabilities are needed, TraeCode will automatically load the relevant MCP server configuration from this file.
  To enable project-level MCP:
  Go to Settings > MCP.
  Toggle the Enable Project MCP switch on.
  Confirm this operation in the popup.
