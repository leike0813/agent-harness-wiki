  heading: Set an execution mode for hook commands
official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  You can control the execution mode of hook commands.
  Go to Settings > Hooks.
  In the Execution Mode section, select an execution mode for hook commands. The available options are as follows:
  | Mode | Description |
  | --- | --- |
  | Run in Sandbox | Automatically execute hook commands in the sandbox. For more information about sandbox, refer to . |
  | Run Automatically Locally | Always automatically execute hook commands outside the sandbox. This mode involves risks; please choose carefully. |
