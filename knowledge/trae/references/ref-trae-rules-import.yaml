  heading: "Import AGENTS.md, CLAUDE.md, and CLAUDE.local.md"
official_url: "https://docs.trae.ai/ide/rules"
excerpt: |-
  In addition to TraeCode's native project rules, you can also reuse the following two types of rule files located in the project root directory. Both are project-level rules and apply only to the current project:
  AGENTS.md: A project rule file for AI. It uses clear, readable text to describe the instructions and conventions that must be followed within the project. AGENTS.md is a cross-tool convention. An AGENTS.md file created in TraeCode can be reused in other IDEs that support this convention, and vice versa.
  CLAUDE.md and CLAUDE.local.md: Claude Code project rule files. TraeCode is compatible with these files. When you migrate a project from Claude Code to TraeCode, these files are imported along with the project.
