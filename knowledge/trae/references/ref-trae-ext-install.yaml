  heading: Install an extension
official_url: "https://docs.trae.ai/ide/manage-extensions"
excerpt: |-
  You can install extensions from TraeCode's extension store or from the marketplace of VS Code, or you can directly install extensions by installing local .vsix files into TraeCode.
  ### From TraeCode's extension store
  In the left navigation bar, click the icon of extension store.
  The extension store appears on the left.
  Search for the extension you want to install and select it from the Available list.
  The details window of the selected extension appears. You can read its detailed introduction, changelog, and more.
  Click the Install button.
  TraeCode starts to install the extension. After installation, the extension appears in the Installed list.
  ### From the marketplace of VS Code
  ::: Note
