locator:
  kind: document_section
  heading: View hook logs
official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  You can view the complete execution logs of hooks.
  Go to Settings > Hooks.
  In the Execution Mode section, click the View Logs button.
  TraeCode will open the Output panel and display "Agent Hooks" logs.
  ::: Note
  After exiting TraeCode, the hook's execution logs for the current cycle will be cleared.
  :::
