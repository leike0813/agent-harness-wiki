  heading: Scene rules
official_url: "https://docs.trae.ai/ide/custom-permission-mode-configuration-reference"
excerpt: |-
  The sceneRules field is used to enable or disable approval for built-in risk scenarios. This applies to fixed security scenarios, including dangerous command detection, shell file protection, file deletion approval, and default approval for MCP tools. You can quickly enable or disable the protection policies for corresponding scenarios using scene rules.
  | Field | Type | Default Value | Description |
  | --- | --- | --- | --- |
  | commandAstDangerChecker | bool | true | Whether to enable command AST static analysis. When enabled, TraeCode detects dangerous commands (such as rm -rf /, chmod 777, and more) through syntax analysis, and triggers an approval process when such commands are detected.
