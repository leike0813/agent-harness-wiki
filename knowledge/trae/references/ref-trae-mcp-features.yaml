  heading: Supported MCP protocol features
official_url: "https://docs.trae.ai/ide/model-context-protocol"
excerpt: |-
  The MCP protocol features supported by TraeCode are as follows:
  | Category | Feature | Description |
  | --- | --- | --- |
  | Messages | Requests | Requests are sent from the client to the server, or from the server to the client, to initiate an operation. |
  |  | Responses | Responses are used to reply to requests and contain the result of the operation or error information. |
  | Lifecycle | Timeouts | Set timeout mechanisms for sent requests to prevent hanging connections and resource exhaustion. |
  | Transports | stdio | Exchange messages conforming to the JSON-RPC 2.0 specification directly between the client and server processes via standard input (stdin) and standard output (stdout). |
