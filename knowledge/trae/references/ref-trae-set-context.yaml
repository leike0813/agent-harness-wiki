  heading: Context
official_url: "https://docs.trae.ai/ide/ide-settings-overview"
excerpt: |-
  The context-related settings are as follows:
  | Setting | Description |
  | --- | --- |
  | Code Index Management | Used to build a global index for the code in the workspace. When initiating a #Workspace conversation, the system will automatically perform a global search and provide cross-file context relevant to the question, thereby delivering replies that are more pertinent to the project. For more information, refer to "Code index". |
  | Ignore Files | Set the list of files or folders to ignore when indexing the repository. These rules will supplement those already defined in the .gitignore file. For more information, refer to "Ignore files". |
  | Docs | Add frequently used document sets as context for AI reference. Documents can be added via URL or by uploading local files.
