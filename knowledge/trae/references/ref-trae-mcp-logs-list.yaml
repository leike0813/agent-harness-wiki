  heading: "Entry 1: MCP server list"
official_url: "https://docs.trae.ai/ide/check-mcp-server-logs"
excerpt: |-
  In the MCP server list, locate the target MCP Server, click the gear icon on the right, and then select Logs from the menu. TraeCode will open the Output panel to display logs related to the MCP server.
  If the MCP server encounters an error, hover the mouse over the corresponding MCP server, then click Logs in the error information panel that appears.
