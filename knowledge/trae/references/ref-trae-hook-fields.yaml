  heading: Hook fields
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  The descriptions of fields related to Hooks are as follows:
  Top-level structure
  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | version | number | No | The schema version of the configuration file. The default value is 1, and currently only 1 is supported. |
  | hooks | object | Yes | Mapping from hook event name to hook group. |
  Event layer (hooks.<EventName>)
  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | <EventName> | array | Yes | List of hook groups under a hook event. |
  Hook group layer
  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | matcher | string | No | Matching rules; supports regular expressions (such as Edit|Write, mcp.).
