  heading: "What is MCP?"
official_url: "https://docs.trae.ai/ide/model-context-protocol"
excerpt: |-
  The Model Context Protocol (MCP) is a protocol that allows large language models (LLMs) to access custom tools and services. In TraeCode, agents act as MCP clients and can make requests to MCP servers to utilize the tools they provide. You can add MCP servers yourself and integrate them into custom agents for use. For more information, refer to the MCP's official documentation.
  In TraeCode, MCP servers support three transport types: stdio, SSE, and Streamable HTTP.
