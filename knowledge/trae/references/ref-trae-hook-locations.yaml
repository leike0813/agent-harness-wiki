locator:
  kind: document_section
  heading: Locations of hook configuration file
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  TraeCode supports both global hooks and project hooks. The configuration file locations of these two types of hooks on different operating systems are as follows:
  | Hook Type | Operating System | Hook Configuration File Location | Scope of Effect |
  | --- | --- | --- | --- |
  | Global Hook | macOS & Linux | ~/.trae/hooks.json | Applies to all workspaces under the current user on this device. |
  |  | Windows | %userprofile%/.trae/hooks.json |  |
  | Project Hook | macOS & Linux | $PROJECT_FOLDER/.trae/hooks.json If the current workspace contains multiple projects, the configuration file is created in the first project by default. | Applies only to the current project or workspace. |
  |  | Windows |  |  |
  Additionally, TraeCode supports reading hook configurations from Claude Code.
