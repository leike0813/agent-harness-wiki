  kind: document_section
  heading: File system access permission
official_url: "https://docs.trae.ai/ide/custom-permission-mode-configuration-reference"
excerpt: |-
  The filesystem field is used to configure the default access policy for the file system. When the path accessed by the agent does not hit any rule in resourceAuthorization.filesystem, TraeCode will fall back to this default policy. This determines the agent's basic access scope to the local file system. To set higher or lower permissions for specific directories, configure path-level rules in resourceAuthorization.filesystem.
  The configurable field is as follows:
  | Field | Type | Description |
  | --- | --- | --- |
  | default | string | Default access policy for the file system. Values: read_only: Only read access is allowed by default; write operations require additional authorization. read_write: Both read and write access are allowed by default. |
