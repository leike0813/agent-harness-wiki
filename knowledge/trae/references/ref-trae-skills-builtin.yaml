excerpt: |-
  TraeCode provides the following built-in skills:
  | Skill Name | Description |
  | --- | --- |
  | TRAE-generate-mini-app | This skill is used to generate high-quality, runnable multi-platform mini app code based on the Taro framework. It is triggered when the user’s intent involves mini apps, Taro, WeChat Mini Programs, cross-platform mini apps, or any other mini app-related requirements. |
  | TRAE-debugger | This skill is used to debug complex issues that require runtime evidence collection. It starts a debugging server, collects logs over HTTP, and follows a systematic debugging workflow: hypothesis > instrumentation > reproduction > analysis > fix > verification.
