  heading: Create a hook
official_url: "https://docs.trae.ai/ide/automate-actions-with-hooks"
excerpt: |-
  You can create a hook configuration file in TraeCode and configure hook events and commands in the file. The steps are as follows:
  Go to Settings > Hooks.
  In the Configuration section, select the type of hook to create: Global or Project.
  In Configured Hooks, click the Create button.
  In the pop-up security warning panel, read the warning message. After confirming there is no risk, click the Enable button.
  Based on the hook type you selected, TraeCode will create a hooks.json file in the corresponding directory and enable the hook configuration by default.
  Configure hooks in the hooks.json file. For configuration format and field descriptions, refer to  .
  Save the configuration.
