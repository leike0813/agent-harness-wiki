  heading: Network target authorization
official_url: "https://docs.trae.ai/ide/custom-global-permission-configuration-reference"
excerpt: |-
  ::: Note
  Supported only on Windows and Linux.
  :::
  The resourceAuthorization.network is used to manage the agent's access policies for specific network targets. This configuration can be used to allow or block specific domain names, IP addresses, subnets, or ports.
  The configurable fields are as follows:
  | Field | Type | Default Value | Description |
  | --- | --- | --- | --- |
  | allow | string[] | [] | List of permitted network targets. Outbound requests matching this list will be allowed. |
  | deny | string[] | [] | List of denied network targets. Outbound requests matching this list will be denied. |
  The matching rules for network targets are as follows:
  The longer and more precise the network address, the higher its priority.
