official_url: "https://docs.trae.ai/ide/ignore-files"
excerpt: |-
  In IDE mode, click the Settings icon in the upper-right corner to open the Settings window.
  OR
  In SOLO mode, click the Settings icon in the upper-right corner of the chat panel to open the Settings window.
  In the left navigation panel, select Indexing & Docs.
  The codebase indexing and docs management panel appears.
  In the Ignore Files section, click the Edit icon.
  TraeCode automatically creates the .ignore file in the .trae/ folder and opens this file in the editor.
  In the .ignore file, add the files to be ignored and save the settings.
  Return to the codebase indexing and docs management panel.
  In the Code Index Management section, click the Build button.
  TraeCode re-indexes the current project, with the .ignore file included in the process.
