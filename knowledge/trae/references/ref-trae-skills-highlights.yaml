excerpt: |-
  Structured
  Each skill corresponds to a SKILL.md file, which describes in a structured manner the information required to complete a certain type of task, for example: task objectives and use cases; key constraints and cautions; recommended processes or steps; optional scripts, templates, or examples.
  Dynamic on-demand loading
  The agent does not read the full content of all skills at the start of a task. Before executing a task, the agent first scans the brief descriptions of all skills, and only loads the detailed content of a skill when it determines that the current task is highly relevant to that skill. This on-demand loading mechanism can effectively reduce token consumption in the context and prevent irrelevant information from interfering with the agent's decision-making.
