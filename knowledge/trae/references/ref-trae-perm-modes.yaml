  kind: document_section
  heading: Permission modes provided by TraeCode
official_url: "https://docs.trae.ai/ide/permission-and-approval"
excerpt: |-
  TraeCode offers three preset permission modes: manual approval, automatic approval, and full access.
  | Mode | Description |
  | --- | --- |
  | Manual Approval | Sandbox enabled; commands are executed in an isolated environment. Dangerous command interception and file protection are enabled. Operations requiring approval must be confirmed by the user one by one. |
  | Automatic Approval | Sandbox enabled; commands are executed in an isolated environment. Dangerous command interception and file protection are enabled. Operations requiring approval are automatically evaluated by TraeCode's built-in LLM Guardian to determine whether to allow them. Note: With the "Automatic Approval" mode enabled, if the user uses a custom model, this model will do the evaluation. |
