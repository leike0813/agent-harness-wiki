locator:
  kind: document_section
  heading: Configure an HTTP MCP server
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  The HTTP MCP server communicates with remote services via HTTP or HTTPS protocols. Its configuration involves the following fields:
  | Field | Required | Description |
  | --- | --- | --- |
  | url | Yes | The access address of the remote MCP server, which must be a valid HTTP or HTTPS URL. |
  | headers | No | Custom HTTP request headers, used to carry additional information in the request (such as authentication information and more). |
  Example:
  ```JSON
  {
    "mcpServers": {
      "mcp_name": {
        "url": "https://example.com/mcp",
        "headers": {
          "Authorization": "Bearer xxxx-xxxxxxx"
        }
      }
    }
  }
  ```
