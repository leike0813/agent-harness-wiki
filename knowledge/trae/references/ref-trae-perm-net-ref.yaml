  kind: document_section
  heading: Network access permission
official_url: "https://docs.trae.ai/ide/custom-permission-mode-configuration-reference"
excerpt: |-
  The network field is used to configure the default policy for outbound network requests. When the network address accessed by the agent does not match any rule in resourceAuthorization.network, TraeCode will fall back to this default policy. It determines the agent's basic network access scope. To allow or deny specific domain names, IP addresses, subnets, or ports, configure resource-level rules in resourceAuthorization.network.
  The configurable field is as follows:
  | Field | Type | Description |
  | --- | --- | --- |
  | default | string | Default policy for outbound network requests. Values: allow: Outbound network requests are allowed by default. deny: Outbound network requests are denied by default and require additional authorization. |
