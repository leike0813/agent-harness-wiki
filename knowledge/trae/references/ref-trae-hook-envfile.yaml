  heading: Environment variable file
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  The hook for the SessionStart event can write environment variables to the file that TRAE_ENV_FILE points to. The variables written will take effect in subsequent hook executions and RunCommand tool calls within the current session, but will not affect the processing of the current hook for the SessionStart event.
  The following three formats are supported:
  Bash:
  ```Bash
  export NODE_ENV=production
  export PATH="/usr/local/bin"
  ```
  PowerShell:
  ```PowerShell
  $env:NODE_ENV=production
  ```
  Dotenv:
  ```Bash
  NODE_ENV=production
  MY_VAR="hello world"
  ```
