locator:
  kind: document_section
  heading: Add a custom model
official_url: "https://docs.trae.ai/ide/models"
excerpt: |-
  If the built-in models do not meet your needs, you can add custom models from either of the following sources:
  Preset model provider: Select models from TraeCode's preset model providers and model lists, and add models by entering the API key as prompted on the interface.
  Custom configuration: By configuring the API format, request URL, model ID, and authentication information. This is suitable for adding models that are not preset by TraeCode.
  Use the following steps to add a custom model:
  Go to Settings > Models to enter the model management panel.
  Click the Add Model button.
  The Add Model window appears.
  Select a model provider preset by TraeCode or select the Custom Model option.
  Complete the basic model configuration.
