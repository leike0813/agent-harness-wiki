  heading: Set up the custom permission mode and global configurations
official_url: "https://docs.trae.ai/ide/permission-and-approval"
excerpt: |-
  Resource authorization, rules, and custom permission mode configurations are managed through the ~/.trae/permission/global.json file.
  ::: Note
  When using remote SSH or WSL to connect to a remote device, you need to configure custom settings for each device separately; local custom settings cannot be reused.
  :::
  The structure of this configuration file is as follows:
  ```JSON
  {
    "customProfiles": {
      "defaultCustomProfile": {
        "displayName": "",
        "shellSandbox": {
          "enable": true,
          "onRestrict": "request_permission_retry_sandbox"
        },
        "approval": {
          "reviewer": "user",
          "sceneRules": {
            "commandAstDangerChecker": true,
            "shellFileProtection": false,
            "deleteToolApproval": false,
