  heading: Exit codes
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  | Exit Code | Behavior |
  | --- | --- |
  | 0 | Normal exit. The content of stdout will be parsed as JSON or plain text depending on the hook event type. |
  | 2 | Blocking error. The content of stderr will be passed to the model's context as error information. The specific behavior of this error varies by hook event. For more information, refer to . |
  | Other | Non-blocking error. Such errors do not affect the agent's workflow. Their stderr and stdout outputs will be ignored. |
