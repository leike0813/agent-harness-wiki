  heading: Variable reference
official_url: "https://docs.trae.ai/ide/add-mcp-servers"
excerpt: |-
  You can configure MCP servers with variables. Currently, only ${workspaceFolder} is supported.
  When an MCP server starts, ${workspaceFolder} is automatically replaced with the actual root directory path of the current project. This can be used to construct command arguments or file paths related to the project path.
  ```JSON
  {
    "mcpServers": {
      "mcp_name": {
        "command": "node",
        "args": [
          "${workspaceFolder}/plugins/mcp.js"
        ]
      }
    }
  }
  ```
  In the example above, args contains ${workspaceFolder}, which will be resolved to the actual workspace path. This ensures that, regardless of where the project is stored, the MCP server can correctly locate and load the plugins/mcp.js script.
