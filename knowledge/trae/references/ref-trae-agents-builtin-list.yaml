  heading: Built-in agents
official_url: "https://docs.trae.ai/ide/agent-overview"
excerpt: |-
  TraeCode provides the following built-in agents:
  Chat: Chat can quickly respond to various technical inquiries and troubleshooting questions from you.
  Agent: "Agent" is a built-in agent in TraeCode, designed for automated project development. It can handle multi-step tasks such as requirement breakdown, solution design, code implementation, project refactoring, and issue fixing. Unlike a typical conversational agent that only answers questions, "Agent" first generates an actionable plan based on your goals and project context, then proceeds with development step by step after you confirm the plan. For more information, refer to Built-in "Agent".
