  heading: "Edit \"Agent\""
official_url: "https://docs.trae.ai/ide/built-in-agent"
excerpt: |-
  You can configure the subagents, MCP servers, and built-in tools that "Agent" can invoke.
  Go to Settings > Agent.
  In the Built-In Agents section, click the View Details icon on the far right of "Agent".
  This directs you to the "Agent" configuration panel.
  Select the tools, MCP servers, and subagents that "Agent" can invoke.
  ::: Note
  It is recommended that you configure only the capabilities required for the current task, to avoid unclear execution flows caused by too many tools.
  :::
  Save the edits.
