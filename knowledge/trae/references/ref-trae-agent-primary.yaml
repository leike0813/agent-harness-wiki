excerpt: "The main workflow of \"Agent\" is: analyze requirements > generate the PRD and technical solution > generate code > preview the result. During execution, it also adds the necessary steps based on task complexity, such as reading project files, confirming the scope of changes, organizing to-dos, invoking subagents, checking runtime results, or asking you to confirm key decisions."
