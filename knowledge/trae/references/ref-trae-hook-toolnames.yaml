locator:
  kind: document_section
  heading: Tools supported by PreToolUse and PostToolUse events
official_url: "https://docs.trae.ai/ide/hook-configuration-reference"
excerpt: |-
  In PreToolUse and PostToolUse events, you can use the matcher field to match tool_name.
  tool_name is a standardized tool name, with the following values:
  | Category | Tool Name | Description |
  | --- | --- | --- |
  | File read | Read | Read file content. |
  | File write | Write | Write content to file. |
  | File edit | Edit | Find and replace file content once. |
  | Search | Glob | Search based on file path pattern matching. |
  |  | Grep | Content search based on regular expressions. |
  |  | LS | List files and subdirectories in the directory. |
  | Terminal | RunCommand | Execute terminal command. |
  | Network | WebSearch | Web search. |
  |  | WebFetch | Fetch web page content. |
  | Interaction | AskUserQuestion | Ask the user a question. |
  | Skill | Skill | Load skills. |
