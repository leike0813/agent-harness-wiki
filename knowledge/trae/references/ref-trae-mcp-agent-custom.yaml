official_url: "https://docs.trae.ai/ide/use-mcp-servers-in-agents"
excerpt: |-
  You can add MCP servers to custom agents for use, enabling the agent to automatically utilize tools from the MCP servers to complete tasks.
  In the Tools - MCP section of the Create Agent panel, select the MCP servers and the tools within those MCP servers for the agent to use.
