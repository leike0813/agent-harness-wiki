excerpt: |-
  Trigger timing: After the user sends a query and before the agent begins processing.
  Purpose of hook: Intercept disallowed requests or append additional context to the model.
  stdin:
  ```JSON
  {
    "session_id": "...",
    "hook_event_name": "UserPromptSubmit",
    "prompt": "User prompt"
  }
  ```
  The dedicated fields for this event are as follows:
  | Field | Type | Description |
  | --- | --- | --- |
  | prompt | string | The text prompt submitted by the user. |
  stdout:
  Format 1: Plain text
  Directly output plain text content, which will be provided to the model as additional context.
