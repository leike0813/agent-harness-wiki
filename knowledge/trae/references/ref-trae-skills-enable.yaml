  heading: Enable/disable skills
official_url: "https://docs.trae.ai/ide/skills"
excerpt: |-
  After creating a skill, you can enable or disable it by toggling its switch.
  After disabling skills, TraeCode will create a skill-config.json file in the project's .trae/ directory. This file lists the disabled project skills. Disabled global skills will not appear in this file.
