  heading: Built-in resource access permissions
official_url: "https://docs.trae.ai/ide/permission-and-approval"
excerpt: |-
  In "Manual Approval" and "Automatic Approval" modes, TraeCode applies default file system access scopes and network access policies for agents.
  File system access permission
  By default, TraeCode allows agents to access the following directories and grants read-only or read-write permissions based on directory type.
  | Permission Type | Directory Type | Directory List |
  | --- | --- | --- |
  | Read-only | Protected directories in the project directory | .vscode |
  |  | Root directory | / (Default policy: all directories not explicitly declared as writable are read-only) |
  | Read-write | Project directory | Project files and directories except for .trae, .vscode, and .git. |
  |  | Temporary directories | macOS: /tmp, /var/folders, TMPDIR environment variable paths.
