  heading: Skills versus other features
official_url: "https://docs.trae.ai/ide/skills"
excerpt: |-
  Skills vs. Rules
  Rules are loaded in full: once a chat starts, all rules are injected into and continuously occupy the context window. Skills, by contrast, are loaded on demand and are only injected into the context when they are actually called, significantly reducing token consumption.
  Skills vs. MCP Servers
  Skills describe how TraeCode should accomplish a task, while MCP servers provide the tools that TraeCode can invoke.
  For example, TraeCode can obtain automated testing capabilities—such as page interactions—through the Playwright MCP server.
