  heading: Import agents
official_url: "https://docs.trae.ai/ide/agent"
excerpt: |-
  You can import the agents shared by others into TraeCode and reuse their configurations.
  Click the link shared by others.
  Follow the on-screen instructions to open TraeCode.
  TraeCode pops up a window displaying the information of the agent that the shared link is for.
  Click the Get Now button.
  TraeCode imports this shared agent and directs you to the agent's editing panel.
