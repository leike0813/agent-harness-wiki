official_url: "https://docs.trae.ai/ide/agent"
excerpt: |-
  To manually create an agent, configure the following parameters in sequence, and then click the Create button at the bottom of the panel to finish creating.
  | Parameter | Description |
  | --- | --- |
  | Avatar | (Optional) Upload an image as the avatar of the agent. |
  | Name | Enter a name for the agent. |
  | Prompt | Write a prompt for the agent to standardize and guide the agent in completing tasks. You can specify the agent's persona, tone of response, workflow, timing for using tools, the rules that need to be followed, and more. |
  | Callable by other agents | Once enabled, this agent can be called by other agents to accomplish a modular task. When called, the agent has an independent context.
