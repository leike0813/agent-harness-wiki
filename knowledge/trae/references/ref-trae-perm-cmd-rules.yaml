excerpt: |-
  customProfiles.defaultCustomProfile.approval.commandRules is used to configure approval and execution policies based on command content. It is suitable for finer control over specific Shell commands, such as directly allowing common commands, blocking high-risk commands, or requiring user confirmation before execution.
  ::: Note
  The priority of customProfiles.defaultCustomProfile.approval.commandRules is higher than commandAstDangerChecker in the custom permission mode configuration. If a command matches both the global rule and the AST danger detection, the global rule takes precedence.
  :::
  This field is configured as key-value pairs, where the key is the command matching pattern and the value is the corresponding approval and execution policy.
