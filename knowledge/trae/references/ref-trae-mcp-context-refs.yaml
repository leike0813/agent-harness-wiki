  kind: document_section
  heading: The model cannot fully read the response content from MCP server
official_url: "https://docs.trae.ai/ide/troubleshoot-mcp-server-related-issues"
excerpt: |-
  An MCP server executes successfully, but in the next round of chat, the model either cannot read any response content from the MCP server or can only read part of the content.
  Cause:
  Due to the limitation of the model's context window size, TRAE dynamically trims the response content from the MCP server to ensure that the overall context can be processed normally by the model. …
  Current chat context usage
  The available context for MCP server response content is affected by the context already introduced in the current chat, such as referenced content like @File, @Folder, and more.
