  heading: Publish for Everyone
official_url: "https://ampcode.com/docs/markdown/customize/global-plugins-and-skills"
excerpt: |-
  Workspace plugins and skills load for every workspace member. Workspace admins manage them. Test a
  large change in your personal plugins or skills before publishing it to the workspace.
  An admin can ask Amp to copy a tested shared item into the matching workspace repository:
  ```prompt
  Copy Thorsten's plain-writing plugin into our workspace plugins.
  ```
  ```prompt
  Copy the shared release-notes skill into our workspace skills: <shared-skill-url>
  ```
  Amp prepares a reviewable change in the workspace repository and asks before pushing it. The push
  publishes the change for the workspace. New threads load the published plugin version automatically.
  Existing threads do not automatically reload plugins after a push.
