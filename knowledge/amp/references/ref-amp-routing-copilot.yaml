official_url: "https://ampcode.com/docs/markdown/customize/model-routing"
excerpt: |-
  Choose **Add → GitHub Copilot** in personal Model Routing, ask Puck to connect your Copilot
  subscription, or run `amp config model-providers add-github-copilot-subscription`. Complete
  GitHub device authorization in your browser to approve **Amp for Copilot**. The dialog also accepts a GitHub user token or a fine-grained personal access
  token with Copilot access. Amp encrypts this credential and does not put it in orb environments.
  Amp renews expiring device-login tokens automatically. Reconnect if GitHub revokes your authorization or your manual token expires.
