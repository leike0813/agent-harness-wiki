  heading: Work With the Repositories Directly
official_url: "https://ampcode.com/docs/markdown/customize/global-plugins-and-skills"
excerpt: |-
  Ask Amp to manage hosted plugins and skills unless you need direct Git access. These commands list
  the repositories available to you and whether you can write to them:
  ```bash
  amp plugins repositories
  amp skills repositories
  ```
  Clone a repository with its short name:
  ```bash
  amp clone user-plugins
  amp clone user-skills
  amp clone workspace-plugins
  amp clone workspace-skills
  ```
  Each repository is versioned with Git. Commit and push changes to publish them.
  Repository owners can require signed commits in the repository's advanced settings.
  Hosted skills have [repository limits](/docs/customize/skills#hosted-repository-limits), including
  a limit on the number of skills that Amp loads from each repository.
