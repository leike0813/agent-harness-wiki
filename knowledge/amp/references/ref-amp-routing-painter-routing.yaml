excerpt: |-
  Your existing connection order, model mappings, and workspace policy decide which connection
  serves `google/gemini-3.1-flash-image`. If another connection takes priority, move the AI Studio
  connection above it or exclude this model from the higher connection. If the selected connection
  is not AI Studio, or the request fails, Painter reports an error instead of using Amp credits.
