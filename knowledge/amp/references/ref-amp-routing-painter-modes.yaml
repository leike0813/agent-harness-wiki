excerpt: |-
  If Google Painter is enabled for your account, open [Mode Dial](/settings/dial) in your personal
  settings and choose **Tune Modes → Painter**. Select **Nano Banana 2** instead of **Auto · Amp**
  and click **Save**. The choice applies to your web and CLI threads. Amp remains the default and
  uses Amp credits.
  Gemini requires an active **Google AI Studio** API key connection. Google bills image generation
  to the API project, separately from any Gemini consumer subscription.
