excerpt: |-
  Amp is a coding agent and development environment built for the frontier. Multi-Model: GPT-5.6, Claude Fable 5.1, fast models. Amp uses them all, for what each model is
  best at. Orbs: Machines that Amp creates per thread, with your code, tools, and plugins already set
  up. Send a prompt, close your laptop, and the agent keeps working. Everywhere: Start an orb from your iPhone, check on it from your Mac, and follow up in
  the TUI. The apps notify you when a thread is ready for your next message. Opinionated: You’re always using the good parts of Amp. If we don’t use and love a feature,
  we kill it. On the Frontier: Amp goes where the models take it. No backward compatibility, no legacy
  features. Threads: You can save and share your interactions with Amp.
