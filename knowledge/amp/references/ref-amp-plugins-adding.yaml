excerpt: |-
  Adding Plugins
  For most plugins, import a shared plugin into your personal plugins. Personal plugins are available
  everywhere you use Amp. Paste the plugin's share URL into a thread and ask Amp to import it:
  ```prompt
  Import this shared plugin into my personal plugins:
  ```
  Workspace admins can import a shared plugin into workspace plugins to make it available to everyone
  in the workspace. See [Global Plugin Repositories](#personal-workspace-plugins) below.
  For a plugin tied to one project, put its file or directory in `.amp/plugins/`.
  To install a single-file plugin from a URL for all projects on your machine, run:
  ```bash
  amp plugins add
  ```
  Add `--target workspace` to install it in the current project's `.amp/plugins/` directory instead.
