locator:
  kind: document_section
  heading: Choose the Mode Before the First Message
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  A thread keeps the mode you chose when you sent its first message. You cannot change the mode
  later in that thread. To work in a different mode, start a new thread.
  The mode is fixed for two reasons. First, most models get confused when they continue a
  conversation that another model started, and in our experience the results were never good.
  Second, each mode has its own system prompt and tool definitions. Switching mid-thread would
  mean rewriting them, which invalidates the prompt cache and makes the thread more expensive.
  In the CLI, press <kbd>Ctrl+S</kbd> before your first message to turn the Dial. You can also open
  the command palette with <kbd>Ctrl+O</kbd> and type `mode`. After the first message,
  <kbd>Ctrl+S</kbd> shows the thread's mode and its models but does not change them.
