official_url: "https://ampcode.com/docs/markdown/customize/agents-md"
excerpt: |-
  Amp includes `AGENTS.md` files automatically:
  - `AGENTS.md` files in the current working directory (or editor workspace roots) _and_ parent directories (up to `$HOME`) are always included.
  - Subtree `AGENTS.md` files are included when the agent reads a file in the subtree.
  - System-wide guidance files, as well as both `$HOME/.config/amp/AGENTS.md` and `$HOME/.config/AGENTS.md`, are always included if they exist.
  To add personal guidance to top-level agents from the web app, open Settings , select Advanced , and edit Global AGENTS.md .
  Workspace admins can add guidance for every workspace member. Open Workspace Settings , select Advanced , and edit Global AGENTS.md . Amp includes workspace guidance before personal and repository guidance.
