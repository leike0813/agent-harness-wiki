excerpt: |-
  A connection is one credential plus its settings. There are four kinds:

  - **API keys** for a single provider, such as Anthropic, Google AI Studio, Meta AI, OpenAI, or
    xAI. Usage bills to your account with that provider.
  - **Subscriptions**, such as a ChatGPT or 𝕏 Premium+/SuperGrok subscription. You sign in through
    your browser, and usage counts against the plan's limits. See
    [Use a ChatGPT Subscription](/docs/the-dial#use-a-chatgpt-subscription). Sign in with ChatGPT
    also signs you in to Amp, so each ChatGPT account can connect to only one Amp account. To use
    one ChatGPT account from several Amp accounts, choose **Connect Through Codex** on each of them
    instead.
