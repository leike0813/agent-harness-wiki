excerpt: |-
  - **Cloud platforms**, such as [Amazon Bedrock](/docs/model-routing/amazon-bedrock) and
    [Google Cloud Agent Platform (Vertex)](/docs/model-routing/google-cloud-agent-platform).
    Usage bills to your cloud account. Follow the linked guides to set up a connection.
  - **AI model routers and gateways**, such as OpenRouter, Vercel AI Gateway, Cloudflare AI Gateway,
    Ollama Cloud, OpenCode Go, and any OpenAI- or Anthropic-compatible endpoint through a Custom URL
    connection. These can serve models from many providers through one credential. They are
    available to all users on every tier.
