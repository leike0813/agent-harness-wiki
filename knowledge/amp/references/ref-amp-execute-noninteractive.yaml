  heading: Non-Interactive Environments
official_url: "https://ampcode.com/docs/markdown/cli/execute-mode"
excerpt: |-
  For non-interactive environments, such as scripts and CI/CD pipelines, set your
  [access token](/settings/security#access-token) in an environment variable:
  ```bash
  export AMP_API_KEY=your-access-token-here
  ```
  Use an access token from Settings, which starts with `sgamp_`. The CLI rejects the short-lived
  session token that `amp login` stores, because it expires within an hour and cannot be refreshed
  from an environment variable.
