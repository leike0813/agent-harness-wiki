excerpt: |-
  From the CLI, pass `--headers` to `add` or `update` with JSON `[name, value]` pairs, and
  `--secret-headers` with comma-separated names of secret headers, the same as
  [model routing](/docs/customize/model-routing). Without `--secret-headers`, stored headers keep
  their setting and new headers are secret when they look like credentials. On `update`,
  `--headers` replaces every stored header
