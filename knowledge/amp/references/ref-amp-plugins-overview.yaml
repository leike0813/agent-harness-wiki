  heading: Plugins
official_url: "https://ampcode.com/docs/markdown/customize/plugins"
excerpt: |-
  Plugins are TypeScript or JavaScript modules that add tools, commands, and event-driven behavior to
  Amp. A plugin can be a single file or a directory with supporting files. Plugins run code in your
  environment, so only load plugins you trust.
  Plugins can:
  - **Handle events** — `amp.on(...)` for tool calls, tool results, and agent lifecycle events
  - **Add tools** — `amp.registerTool(...)` for custom tools the agent can call
  - **Bundle skills** — `await amp.registerSkill(...)` to register skill directories
  - **Add commands** — `amp.registerCommand(...)` for command palette actions
  - **Show UI** — `ctx.ui.notify(...)`, `ctx.ui.confirm(...)`, `ctx.ui.input(...)`, and `ctx.ui.select(...)`
  - **Classify with AI** — `amp.ai.ask(...)` for thread-scoped yes/no decisions
