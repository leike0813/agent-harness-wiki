excerpt: |-
  Each connection has a **Check Access** button that verifies the credential with the provider.
  From the CLI, `amp config model-providers test <connection-id>` does the same, and
  `amp config model-providers check-access --provider-model <provider/model>` runs one short
  inference and reports which connection actually served it.
