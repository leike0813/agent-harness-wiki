locator:
  kind: document_section
  heading: Remote Server IDs and Overrides
official_url: "https://ampcode.com/docs/markdown/customize/mcp"
excerpt: |-
  Each remote server has an ID, initially generated from its name. This ID is only used to decide
  which servers override each other across settings.
  IDs must be unique within your
  personal settings, within each workspace, and within each project. Across these settings, project
  servers override workspace servers with the same ID, and workspace servers override personal
  servers with the same ID. Disabled servers do not override others. Tool discovery also requires
  cached tools; a server with no cached tools does not hide another server's tools.
  Workload identity servers are an exception. They take precedence before fetching tools within
  the thread, so a failed connection does not silently select a less specific server.
  Renaming a server does not change its ID.
