  heading: Use Claude Code on a Runner
official_url: "https://ampcode.com/docs/markdown/cli/runners"
excerpt: |-
  Threads in [Claude Code mode](/docs/the-dial#use-your-claude-subscription) run the `claude`
  program on the runner's machine. Install Claude Code 2.1.276 or later there and sign in with
  your Claude Pro or Max plan, as the user who runs `amp --no-tui`. Run the runner as a regular user, because Claude
  Code does not run as root. Then check that `command -v claude` prints a path in the shell you
  start the runner from. See [Claude Code on Runners](/docs/the-dial#claude-code-on-runners) for
  the full steps.