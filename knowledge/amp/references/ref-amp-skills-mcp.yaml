  heading: MCP Servers in Skills
official_url: "https://ampcode.com/docs/markdown/customize/skills"
excerpt: |-
  A skill can define MCP servers in a sibling `mcp.json` file or in the `mcpServers` field of its
  `SKILL.md` frontmatter. If both are present, Amp uses `mcpServers` and ignores `mcp.json`.
  Amp connects to skill MCP servers when it discovers the skill. Amp hides tools from a server
  defined only by a skill until the skill is loaded. If a server with the same name is also supplied
  by a CLI flag or direct configuration, that source takes precedence and its tools remain visible.
  **Example `mcp.json` for a local command-based server:**
  ```json
  {
  	"chrome-devtools": {
  		"command": "npx",
  		"args": ["-y", "chrome-devtools-mcp@latest"],
  		"includeTools": ["navigate_*", "take_screenshot", "click", "fill*"]
  	}
  }
  ```
