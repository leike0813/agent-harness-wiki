  heading: MCP Servers in Orbs
official_url: "https://ampcode.com/docs/markdown/customize/mcp"
excerpt: |-
  The orb asks in a dialog in your thread: **Allow Once** runs the server in this orb only,
  **Always Allow for Me** also runs it in your later orbs, and **Always Allow for Workspace**
  (workspace admins only) runs it in the orbs of every workspace member. Amp stores the "Always"
  choices with your account and asks again when the server's configuration changes. They apply
  only in orbs, never to the CLI on your own machine. A
  [multiplayer](/docs/collaborate/multiplayer) thread offers only **Allow Once**, because anyone
  who can prompt it could otherwise approve servers for your later orbs. Review and remove them
  under **Allowed Repository MCP Servers** in your
  [Integrations & MCP settings](/settings/integrations), or in the workspace's settings for
  workspace approvals.
