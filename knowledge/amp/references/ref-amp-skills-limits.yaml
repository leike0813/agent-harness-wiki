  heading: Hosted repository limits
official_url: "https://ampcode.com/docs/markdown/customize/skills"
excerpt: |-
  Each personal or workspace skills repository has a limit of 200 skills. The limit applies to each
  repository separately, not to the combined list of skills in a thread.
  If a Git push puts more than 200 skills in a repository, Amp selects only the first 200 skill
  directories in alphabetical order. The remaining skills are not available, even after a reload or
  in a new thread. A successful push does not mean that every skill can be loaded. Skill imports and
  writes through the API reject additions that would exceed the limit.
  The following limits also apply. Amp checks these after selecting the first 200 skill directories,
  so fewer than 200 skills can be available.
  | Resource                              | Limit  |
  | ------------------------------------- | ------ |
