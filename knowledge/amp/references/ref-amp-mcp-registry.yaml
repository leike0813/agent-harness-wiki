  heading: MCP Registry Allowlist
official_url: "https://ampcode.com/docs/markdown/enterprise/mcp-registry-allowlist"
excerpt: |-
  Enterprise workspace admins can enforce an MCP registry so that only approved MCP servers are available to
  workspace members. If the registry is unreachable, all MCP servers are blocked.
  The registry protocol and schema are defined at
  [registry.modelcontextprotocol.io](https://registry.modelcontextprotocol.io/docs#/operations/list-servers-v0.1).
  ## Package Matching
  For local stdio servers, Amp matches the package name and registry type. Registry approval applies to the
  package name, not a specific version. A tag, fixed version, version range, or Python extra still matches the
  same approved package.
  Amp supports npm packages run with `npx`, `npm exec`, `npm x`, `pnx`, `pnpx`, `pnpm dlx`, `bunx`, `bun x`, or
  `yarn dlx`.
