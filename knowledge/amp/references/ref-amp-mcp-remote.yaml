excerpt: |-
  Remote MCP Definitions
  Remote MCP definitions are available across Amp clients without a local settings file. Store one
  definition in your personal settings, a workspace, or a project:
  ```shell-session
  $ amp mcp remote --personal add Linear https://mcp.linear.app/mcp
  $ amp mcp remote --workspace acme add Linear https://mcp.linear.app/mcp
  $ amp mcp remote --project acme/app add Linear https://mcp.linear.app/mcp
  ```
  To share an existing personal definition, open its menu in personal MCP settings and select
   Copy to Workspace . Amp pre-fills the server URL, name, authentication type,
  and OAuth client ID. When you save, Amp securely copies its stored bearer token or OAuth client
  secret on the server. The credential never appears in the page URL or form. Existing OAuth
