  heading: Models Amp Does Not Know
official_url: "https://ampcode.com/docs/markdown/customize/model-routing"
excerpt: |-
  Amp offers the model in the Mode Dial only
  when it knows the model's token limits. For a Custom URL connection, Amp reads them from the
  endpoint's `/models` response or from [models.dev](https://models.dev). Many proxies list only
  model IDs, so a new model may not appear.

  In that case, open the connection in [Model Routing](/settings/model-routing) and click **Model
  Metadata Overrides**. Add the same model ID you used in the mapping, set **Input Tokens** and
  **Output Tokens**, and set **Tools** to **Yes**. The model then appears in the Mode
  Dial. Overrides apply only to that connection, and Amp uses the token limits for inference on it.
  Set overrides in the web settings. The CLI keeps existing overrides when you edit a connection
  but cannot set them.
