excerpt: |-
  Amp's most important keyboard shortcut is <kbd>Ctrl+O</kbd> to open the command palette:
  ![The Amp CLI command palette showing available commands](https://static.ampcode.com/docs/cli-command-palette.png)
  Other shortcuts worth remembering:
  - <kbd>Ctrl+G</kbd> opens the current prompt in your editor. This requires `$EDITOR`.
  - <kbd>Ctrl+V</kbd> pastes an image from the clipboard, even on macOS (not <kbd>Cmd+V</kbd>).
  - <kbd>Ctrl+S</kbd> turns the [Dial](/docs/the-dial) before a thread's first message. After that, it
    shows the thread's mode, which cannot change.
  - <kbd>Ctrl+R</kbd> opens your prompt history.
  - <kbd>↑</kbd> and <kbd>↓</kbd> move to queued and previous messages so you can edit them.
  - <kbd>Alt+T</kbd> expands thinking and tool blocks.
