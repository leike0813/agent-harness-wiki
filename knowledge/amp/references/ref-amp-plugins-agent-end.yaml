  import type { PluginAPI } from '@ampcode/plugin'
  const marker = '[plugin:tests-requested]'
  export default function (amp: PluginAPI) {
  	amp.on('agent.end', (event) => {
  		if (!event.message.toLowerCase().includes('verify')) {
