excerpt: |-
  Librarian
  Amp can search remote codebases with the use of the
  [Librarian subagent](/docs/models-and-subagents).
  The Librarian can search and read all public code on GitHub as well as your private GitHub
  repositories.
  Tell Amp to summon the Librarian when you need to do cross-repository research, or, for example,
  when you want it to read the code of the frameworks and libraries you're using.
  The Librarian's answers are typically longer and more detailed as we built it to provide in-depth
  explanations.
  The Librarian will only search code on the default branch of the repository.
  You might need to prompt the main agent explicitly to use the Librarian. Here are some examples:
  ```prompt
  Explain how new versions of our documentation are deployed when we release. Search our docs and
