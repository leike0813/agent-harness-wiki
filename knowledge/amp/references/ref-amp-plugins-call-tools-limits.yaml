  heading: Call Tools Directly
official_url: "https://ampcode.com/docs/markdown/customize/plugins"
excerpt: |-
  Calls do not add messages to the transcript or start an agent turn. They have a five-minute
  deadline, including time spent waiting for approval. If the connection is lost, Amp does not
  retry the call: it reports that the outcome is unknown. Check whether a write took effect before
  retrying it. An event handler that calls tools can trigger more tool events; restrict it to the
  tools it needs to avoid recursion.
