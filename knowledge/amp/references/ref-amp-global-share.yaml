  heading: Share With Your Workspace
official_url: "https://ampcode.com/docs/markdown/customize/global-plugins-and-skills"
excerpt: |-
  You can share a personal plugin or skill without publishing it for everyone:
  1. Open **Personal Settings**, then open **Plugins** or **Skills**.
  2. Select the item and choose **Share**.
  3. Make it available to your workspace.
  4. Copy its share URL.
  Send the URL directly or paste it into Slack. Teammates can inspect the shared page, import the item
  into their personal plugins or skills, and change their copy without changing yours.
  ![Sharing a personal skill with a workspace](https://static.ampcode.com/docs/global-skills-share.png)
