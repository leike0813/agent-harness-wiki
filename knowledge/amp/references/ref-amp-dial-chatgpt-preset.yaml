  heading: Use a ChatGPT Subscription
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  Linking does not change which models the modes use on its own. Some roles, such as the `low` main
  agent and the `high` Oracle, run models your subscription does not serve, and those keep billing
  to Amp credits. When you link or reactivate the subscription, Amp offers to apply the
  **ChatGPT Only** preset in one click. You can also open [Tune Modes](#tune-the-modes), press the
  preset at the bottom, and save.
