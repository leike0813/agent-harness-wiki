excerpt: |-
  You can still change one thing. If you set the model or the effort of such a role, the role uses
  your setting and keeps following the preset for everything else. The other roles are not
  affected. Press **Preset** on the role to drop your setting, or **Auto** to stop that role
  following the preset. Press the preset at the bottom again to stop following it: the roles you
  did not change return to Auto, and the roles you changed keep your model or effort as ordinary
  pins.
