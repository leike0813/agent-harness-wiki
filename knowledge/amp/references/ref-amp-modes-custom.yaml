excerpt: |-
  Plugins can define custom modes and custom subagents. A custom mode appears in the mode picker. A
  custom subagent can be exposed as a tool that the main agent calls for a specific kind of work.
  See [Define a Custom Agent Mode](/docs/customize/plugins#define-a-custom-agent-mode) and
  [Define a Custom Subagent](/docs/customize/plugins#define-a-custom-subagent) for examples.
  <h2 id="fable-byok">Enable Claude Fable With BYOK</h2>
  Anthropic requires data retention for Claude Fable models, including Claude Fable 5.1. If you use
  your own Anthropic API key with Amp, enable data retention for the workspace that owns the key:
  1. Sign in to the [Claude Console](https://platform.claude.com) as an organization admin.
  2. Go to **Settings > Workspaces**.
