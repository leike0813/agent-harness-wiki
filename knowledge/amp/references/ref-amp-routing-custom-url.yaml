official_url: "https://ampcode.com/docs/markdown/customize/model-routing"
excerpt: |-
  A Custom URL connection speaks one of four API formats. Enter the base URL, and Amp appends the
  API path for the format:
  - `chat-completions` (OpenAI Chat Completions API, the default) sends requests to
    `<base URL>/chat/completions`.
  - `responses` (OpenAI Responses API) sends requests to `<base URL>/responses`.
  - `anthropic-messages` (Anthropic Messages API) sends requests to `<base URL>/v1/messages`. A
    base URL that already ends in `/v1` is accepted and not doubled.
  - `google-genai` (Google Generative AI) sends native Gemini requests to
    `<base URL>/models/<model>:streamGenerateContent?alt=sse`. Use
    `https://generativelanguage.googleapis.com/v1beta` for an AI Studio key. For a Vertex API key,
    use `https://aiplatform.googleapis.com/v1`; Amp sends those requests to
