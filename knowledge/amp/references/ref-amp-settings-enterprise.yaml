  heading: Enterprise Managed Settings
official_url: "https://ampcode.com/docs/markdown/cli/settings"
excerpt: |-
  Workspace administrators can provide managed settings in two ways.
  You can add one JSON document in Workspace Settings, on the Managed Settings page. This document
  uses the same `amp.` keys as `managed-settings.json`. Each save creates a new revision that records
  the author and time. Administrators can view the revision history and compare any two revisions.
  The workspace document is available to workspaces on any plan that restrict members to a single
  workspace.
  You cannot set these keys in the workspace document:
  - `amp.url` could make the client unable to reach the server that provides the settings.
  - `amp.proxy` could make the client unable to reach the server that provides the settings.
