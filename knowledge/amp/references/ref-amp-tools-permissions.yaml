excerpt: |-
  Permissions
  Amp does not ask for approval before running tools.
  Use a [custom plugin](/docs/customize/plugins#example-plugin-permissions) to control tool use.
  Workspace admins can distribute it as a
  [global workspace plugin](/docs/customize/global-plugins-and-skills#publish-for-everyone).
