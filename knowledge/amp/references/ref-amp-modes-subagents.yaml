  heading: Specialist Subagents
official_url: "https://ampcode.com/docs/markdown/models-and-subagents"
excerpt: |-
  Amp can delegate focused work to specialist subagents. Each subagent has its own context window and
  access to tools like file editing and terminal commands.
  - **Search** retrieves relevant code quickly.
  - **[Oracle](/docs/tools#oracle)** handles difficult reasoning and planning questions.
  - **[Librarian](/docs/tools#librarian)** researches external codebases and large bodies of source material.
  - **Read Thread** reads and summarizes other Amp threads.
  Subagents are most useful for multi-step tasks that can be broken into independent parts,
  operations producing extensive output not needed after completion, parallel work across different
  code areas, and keeping the main thread's context clean while coordinating complex work.
