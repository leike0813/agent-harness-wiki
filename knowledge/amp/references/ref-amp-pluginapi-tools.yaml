  heading: PluginTools
official_url: "https://ampcode.com/docs/markdown/plugin-api"
excerpt: |-
  Call a tool in the current thread without asking a model. Use a built-in or plugin tool
  	 * name, or an MCP `module.function` name from tool_search. Local MCP tools also accept
  	 * their `mcp__server__tool` names. Normal permissions and confirmations still apply.
  	 * Returns the tool's result (the full CallToolResult for MCP). Rejects on execution
  	 * failure, including MCP isError responses. Requires a connected thread.
  	 * Subagent tools and durable waits are not supported. Calls are not added to the
  	 * transcript and are never automatically retried after a lost connection.
