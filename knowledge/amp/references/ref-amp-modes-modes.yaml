excerpt: |-
  [The Dial](/docs/the-dial) gives you four built-in modes: `low`, `medium`, `high`, and `ultra`. Each
  mode combines a model, reasoning effort, system prompt, tools, and oracle for a particular level of
  difficulty.
  Choose a mode based on the task rather than the model name. See [The Dial](/docs/the-dial) for help
  choosing one.
