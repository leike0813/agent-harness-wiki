excerpt: |-
  You can add additional tools using
  [MCP (Model Context Protocol)](https://modelcontextprotocol.io) servers, which can be either local
  or remote.
  Amp has two ways to configure these servers:
  - Local MCP configuration is stored in `amp.mcpServers`. A URL entry is still local configuration,
    even when the URL points to another machine.
  - Remote MCP definitions are stored by ampcode.com. You can manage them in MCP server settings or
    with `amp mcp remote`.
  For most use cases, we recommend [bundling MCP servers in skills](/docs/customize/skills) via
  `mcp.json` instead of adding them to your user settings. This keeps the tool list clean and loads
  MCP tools only when needed.
