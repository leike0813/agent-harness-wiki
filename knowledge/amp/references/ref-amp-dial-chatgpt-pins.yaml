excerpt: |-
  If you linked your subscription before September 28, 2026, Amp already saved these pins for you, except for roles you or your
  workspace had pinned.

  If you deactivate or delete the subscription, Amp offers to return the roles it served to Auto,
  so they follow Amp's default models instead of billing their pinned models to Amp credits.
