excerpt: |-
  - **`amp.tools.disable`**
   **Type:** `array`, **Default:** `[]`
   Disable specific tools by name. Use `builtin:toolname` to disable only the built-in tool with that
   name while allowing an MCP server to provide a tool by the same name. Glob patterns using `*` are
   supported.
