  heading: Skill Repositories
official_url: "https://ampcode.com/docs/markdown/customize/skills"
excerpt: |-
  Personal skills are available everywhere you use Amp. Workspace admins manage workspace skills,
  which are available to everyone in the workspace. Amp stores each scope in its own Git repository.
  The simplest way to manage these skills is to ask Amp in a thread. For example:
  ```prompt
  Create a personal skill for writing my release notes
  ```
  ```prompt
  Create a workspace skill for deploying our staging environment
  ```
  ```prompt
  Import this shared skill into my workspace skills: <shared-skill-url>
  ```
  ```prompt
  Update the imported release-notes skill in my workspace skills
  ```
  Amp finds the right repository and prepares the change in a checkout. It reviews and commits the
  change, then asks before pushing. A push publishes the skill. New threads load it automatically,
