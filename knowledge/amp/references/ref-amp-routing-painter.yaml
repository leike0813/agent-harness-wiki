excerpt: |-
  If Google Painter is enabled for your account, the **Painter** section in your personal
  [Model Routing](/settings/model-routing) settings lets you choose **Gemini 3.1 Flash Image
  (Nano Banana 2)** instead of **Amp (Default)**. The choice applies to your web and CLI threads
  and saves immediately. Amp remains the default and uses Amp credits.

  Gemini requires an active **Google AI Studio** API key connection. Google bills image generation
  to the API project, separately from any Gemini consumer subscription. Workspace token fees still
  apply where applicable. A ChatGPT or Gemini subscription does not supply this API access.
