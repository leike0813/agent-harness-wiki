excerpt: |-
  Oracle
  Amp has access to a powerful "second opinion" model that's better suited for complex reasoning or
  analysis tasks, at the cost of being slightly slower, slightly more expensive, and less suited to
  day-to-day code editing tasks than the main agent's model.
  This model is available to Amp's main agent through a tool called `oracle`. The oracle's routing
  depends on the agent mode, your Tune Modes pins, workspace restrictions, and model availability.
  The oracle runs with extra-high reasoning. In `high` mode, the main agent uses GPT-6 Astra with
  medium reasoning and the oracle uses Claude Fable 5.1. In `low` and `ultra` modes, the oracle uses
  GPT-6 Astra; in `medium`, GPT-5.6 Sol. The **ChatGPT Only** preset in Tune Modes pins the `high`
