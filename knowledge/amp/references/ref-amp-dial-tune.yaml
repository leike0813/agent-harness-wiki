  heading: Tune the Modes
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  Open **Tune Modes** and turn the dial to a builtin mode. You can pin a model for each of its three
  roles:
  - **Main Agent** runs the conversation.
  - **Oracle** handles the second opinions requested through the `oracle` tool.
  - **Subagents** covers every other subagent: Task workers, codebase search, thread reading, the
    Librarian, code review checks, and media analysis (for models that can read images).
