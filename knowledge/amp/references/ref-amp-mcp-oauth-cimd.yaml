  heading: OAuth for Local MCP Configuration
official_url: "https://ampcode.com/docs/markdown/customize/mcp"
excerpt: |-
  Many MCP servers, like [Linear](https://linear.app/changelog/2025-05-01-mcp), need no setup to
  sign in. When you start the Amp TUI after adding a URL entry to `amp.mcpServers`, Amp opens the
  server's sign-in page in your browser. Amp supports Client ID Metadata Documents (CIMD), and it
  falls back to dynamic client registration for servers that do not support CIMD.
