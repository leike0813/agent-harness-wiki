excerpt: |-
  Workspace MCP Server Trust
  MCP servers in workspace settings (`.amp/settings.json`) require explicit approval before they can
  run. This prevents untrusted code from executing automatically when you open a project.
  When a workspace MCP server is awaiting approval, you'll see `awaiting approval` in
  `amp mcp doctor` output. To approve:
  ```shell-session
  $ amp mcp approve my-server
  ```
  In the CLI, you'll be prompted to approve workspace servers when they're first detected.
  MCP servers in your global settings (`~/.config/amp/settings.json`) or passed via `--mcp-config` do
  not require approval.
