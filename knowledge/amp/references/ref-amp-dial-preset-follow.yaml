excerpt: |-
  Each of these roles follows the preset instead of holding its own copy of the model. When Amp
  changes the preset, for example to a newer OpenAI model, the roles change with it and you do not
  need to apply the preset again. A role that follows the preset shows the preset's name in Tune
  Modes.
