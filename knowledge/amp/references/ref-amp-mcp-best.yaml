excerpt: |-
  MCP Best Practices
  Too many available tools can reduce model performance, so for best results, be selective:
  - [Bundle MCP servers in skills](/docs/customize/skills) instead of adding them globally—tools
   stay hidden until the skill loads.
  - Use MCP servers that expose a small number of high-level tools with high-quality descriptions.
  - [Disable MCP tools you aren't using](/docs/cli/settings), or consider using CLI tools instead.
