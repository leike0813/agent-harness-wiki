excerpt: |-
  Global Plugin Repositories
  Personal and workspace plugins live in global plugin repositories. Your personal plugin repository
  applies only to you. Workspace admins manage the workspace repository, whose plugins apply to
  everyone in the workspace. The simplest way to manage either is to ask Amp in a thread.
  Amp finds the right repository, makes the requested change, commits it, and asks before pushing. A
  push publishes the change. Amp can then reload the plugin in the current thread without restarting.
  To share a personal plugin, open Plugins in [Personal Settings](/settings/plugins),
  select the plugin, choose Share , make it available to the workspace, and copy
  its URL. Send the URL directly or paste it into Slack, where it unfurls with details about the
  plugin.
