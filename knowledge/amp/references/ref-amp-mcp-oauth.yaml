excerpt: |-
  OAuth for Local MCP Configuration
  Some MCP servers like [Linear](https://linear.app/changelog/2025-05-01-mcp) support automatic OAuth
  client registration. When you start the Amp TUI after adding a URL entry to `amp.mcpServers`, Amp
  will automatically start the OAuth flow in your browser. The `amp mcp oauth` commands manage this
  local OAuth state. Use `amp mcp remote login` and `amp mcp remote logout` for remote MCP definitions
  stored by ampcode.com.
  On a runner started with `amp --no-tui`, a server that needs OAuth asks for sign-in in a dialog in an
  attached thread on ampcode.com. If no thread is attached yet, the runner asks once a thread
  attaches. If you open the sign-in link in a browser on the runner's machine, sign-in finishes on its
  own.
