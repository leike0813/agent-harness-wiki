  heading: Amp Workload Identity
official_url: "https://ampcode.com/docs/markdown/customize/mcp"
excerpt: |-
  Amp discovers tools separately in each thread and does not save these tool lists in the shared
  settings cache. Settings cannot test the connection because they have no thread identity.
  No OAuth sign-in or stored credential is needed. Amp checks access before issuing each token.
  Disabling the server or removing access prevents new tokens; already issued tokens can remain
  valid for up to five minutes.
