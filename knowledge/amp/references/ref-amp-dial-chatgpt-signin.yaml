  heading: Use a ChatGPT Subscription
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  When you [sign in with ChatGPT](/settings/model-routing?add=chatgpt) and allow token sharing, OpenAI model usage
  is billed to your ChatGPT subscription instead of Amp credits. This includes the GPT-6 Astra main
  agent in `high` and the GPT-6 Astra Oracle in every mode that routes to it.

  From the CLI, run `amp config model-providers add-chatgpt-subscription` (or `amp add-chatgpt-sub`)
  to open the same sign-in flow in your browser. Existing legacy ChatGPT connections keep working;
  you do not need to reconnect them.
