excerpt: |-
  Supporting models handle jobs that do not need the main agent. These include analyzing images,
  PDFs, audio, and video; generating or editing images; naming threads; and compacting the context of
  long conversations.
  This routing lets Amp use a frontier model where deep reasoning matters and a faster specialist
  where speed matters more.
