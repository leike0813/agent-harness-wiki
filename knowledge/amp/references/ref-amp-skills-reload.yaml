  heading: Viewing and Reloading Skills
official_url: "https://ampcode.com/docs/markdown/customize/skills"
excerpt: |-
  You can ask Amp:
  ```prompt
  List the skills available in this thread and where each one came from
  ```
  ```prompt
  Reload my skills
  ```
  For direct inspection, run `amp skills list`, add `--json` for machine-readable output, or open the
  interactive CLI command palette with <kbd>Ctrl+O</kbd> and run `skills: list`. The `reload_skills`
  tool rescans local directories and fetches the latest personal and workspace skills. Running
  `amp skills list` in another shell does not reload an existing session.
