  heading: Terminal Access
official_url: "https://ampcode.com/docs/markdown/cli/remote-control"
excerpt: |-
  If the web Terminal says terminal access is disabled, restart the CLI with
  `--remote-control-terminal`:
  ```shell-session
  $ amp --remote-control-terminal
  ```
  Then reload the thread page. Use `--no-remote-control-terminal` to explicitly disable access. When
  neither flag is provided, `AMP_REMOTE_CONTROL_TERMINAL=1` enables access and
  `AMP_REMOTE_CONTROL_TERMINAL=0` disables it. An explicit CLI flag takes precedence over the
  environment variable.
