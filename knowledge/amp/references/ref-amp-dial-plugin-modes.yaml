  heading: Plugin Modes on the Dial
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  Use a plugin mode for work you repeat, e.g., a security review with your team's checks. The agent
  has its own instructions and tools, so you do not need to repeat those instructions each time you
  select it.
  Ask Amp to create a personal plugin agent, or follow
  [Define a Custom Agent Mode](/docs/customize/plugins#define-a-custom-agent-mode). A plugin agent can
  extend `low`, `medium`, `high`, or `ultra` and add instructions to that mode's prompt. It inherits
  the mode's tools and, unless you specify another model, its model and effort.
  Keep the plugin in your [personal plugins](/docs/customize/plugins#personal-workspace-plugins) to use it
  across projects, or have a workspace admin publish it as a workspace plugin. The mode is then
  available in the mode picker right away.
