  heading: Build Your Dial
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  Open **Build Dial** to choose two to four modes and their order. The catalog includes builtin modes
  and the plugin agents available to you. You do not need to change your dial to use Tune Modes.
  <div class="docs-media-stage">
    <img class="docs-transparent-media" width="1852" height="1394" style="aspect-ratio: 1852/1394" src="https://static.ampcode.com/docs/build-your-own-dial-build-dial-20260910.png" alt="Build Dial with Medium, High, and the Grok 4.6 plugin mode in three slots, one vacant slot, and a catalog of available modes" />
  </div>
  1. Drag a mode onto a slot, or click it to add it to the next free slot. Remove a mode to free a slot.
  2. Drag modes on the dial to reorder them, or select one and use the arrow keys.
  3. Hold the save button to apply your dial.
