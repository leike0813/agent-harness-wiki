  kind: document_section
  heading: Use Modes That Are Not on Your Dial
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  The dial has at most four slots, but you can start a thread in any mode you have access to. Keep
  the standard `low`, `medium`, `high`, and `ultra` on the dial and pick everything else from the
  full list when you need it.
  In the web app, open the mode picker when you create a thread. The **Amp Modes** tab shows your
  dial. The **Raw Models** tab shows every other mode, e.g., a plugin mode you installed or a mode
  that always runs one specific model. Typing in the picker searches all modes at once, so you can
  type a mode's name without switching tabs.
