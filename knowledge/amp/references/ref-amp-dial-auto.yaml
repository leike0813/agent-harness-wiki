  heading: Automatic Models and Reasoning Effort
official_url: "https://ampcode.com/docs/markdown/the-dial"
excerpt: |-
  A model set to **Auto** follows Amp's model choices as they change. You can pin only the Oracle
  and leave the other roles on Auto. Subagents on Auto can each use a different model, while pinning
  that role selects one model for all of them.
  Reasoning effort controls how much thinking the model does before it answers. You can pin effort
  without pinning a model, or keep effort on Auto while choosing a model. Only supported effort
  levels are available, and models without an effort control have no adjustable levels.
  If a pinned model becomes unavailable or your workspace restricts it, Amp falls back to automatic
  model selection. If an effort level is not supported by the model, Amp uses the closest supported
  level.
