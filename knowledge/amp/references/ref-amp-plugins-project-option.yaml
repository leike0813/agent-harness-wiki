  heading: Use a Built-in Agent
official_url: "https://ampcode.com/docs/markdown/customize/plugins"
excerpt: |-
  By default, Amp picks the project whose Git remote matches the plugin's working directory, which
  in an Orb is its repository checkout. When several projects use the same repository, that may not
  be the one you want. To choose the project yourself, pass `project` with any ref that
  `amp --project` accepts, such as `'acme/research'`. The new thread then gets that project's
  repository, secrets, and workspace. Don't take `project` from
  untrusted input such as a webhook payload. Whoever controls it could run threads in any project
  you can access, with that project's secrets.