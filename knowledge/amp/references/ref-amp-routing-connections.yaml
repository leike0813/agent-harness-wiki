excerpt: |-
  A connection is one credential plus its settings. There are three kinds:
  - **API keys** for a single provider, such as Anthropic, Google AI Studio, Meta AI, OpenAI, or
    xAI. Usage bills to your account with that provider. Create a Gemini API key in
    [Google AI Studio](https://aistudio.google.com/apikey), importing your Google Cloud project first
    if it does not appear. This connects to the Gemini API, not Vertex. The separate Google Cloud
    Agent Platform connection uses workload identity for Vertex instead of an API key.
  - **Subscriptions**, such as a ChatGPT or 𝕏 Premium+/SuperGrok subscription. You sign in through
    your browser, and usage counts against the plan's limits. See
    [Use a ChatGPT Subscription](/docs/the-dial#use-a-chatgpt-subscription).
