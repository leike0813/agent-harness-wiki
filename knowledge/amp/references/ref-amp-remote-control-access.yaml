  heading: Workspace Access
official_url: "https://ampcode.com/docs/markdown/cli/remote-control"
excerpt: |-
  Workspace admins manage **Cross-Client Access** in Member Settings. The setting is visible
  for Enterprise workspaces, including self-serve Enterprise, or when access was already disabled.
  Access is enabled by default, and this name change does not alter existing saved values.
  When access is disabled, members cannot send messages to CLI threads from the web, and they
  cannot start new threads on their runners from outside the CLI: the web command palette hides
  runners, and the `create_thread` tool, Puck, and automations cannot target a runner.
