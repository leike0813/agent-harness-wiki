excerpt: |-
  Plugin Locations and Precedence
  Amp loads plugins from these sources:
  - **Personal plugins.** Manage them in [Personal Settings](/settings/plugins). They apply everywhere
   you use Amp.
  - **Workspace plugins.** Workspace admins manage them in [Workspace Settings](/workspace/plugins).
   They apply to everyone in the workspace.
  - **Project plugins.** Put files or directories in `.amp/plugins/` at the project root. They apply
   when you run Amp in that project.
  - **System plugins.** If `XDG_CONFIG_HOME` is set, put files or directories in
   `$XDG_CONFIG_HOME/amp/plugins/`. Otherwise, use `~/.config/amp/plugins/` on macOS and Linux or
   `%USERPROFILE%\.config\amp\plugins\` on Windows. They apply to your projects on that machine.
