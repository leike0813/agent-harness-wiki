official_url: "https://ampcode.com/docs/markdown/customize/model-routing"
excerpt: |-
  Workspace admins can turn on **Block Amp-Billed Inference** in
  [Workspace Model Routing](/workspace/model-routing#block-amp-billed-inference) to stop step 3 of
  the order above. Members then use models only through connections: their own subscriptions and
  API keys, or the workspace's. A request that no connection serves fails with a message that says
  the workspace requires a connection and where to add one, instead of using Amp credits. The
  setting is off by default.

  It covers the agent's model requests in the workspace's threads, including:

  - Members who have not connected a subscription or API key. Amp asks them to connect one when
    nothing they can use serves any built-in mode.
