excerpt: |-
  [Plugins](/docs/customize/plugins#define-a-custom-agent-mode) can add custom agent modes with their
  own model, prompt, tools, and display settings. Custom modes are always available in the mode
  picker, whether or not they are on your dial. See
  [Use Modes That Are Not on Your Dial](#use-modes-that-are-not-on-your-dial).
