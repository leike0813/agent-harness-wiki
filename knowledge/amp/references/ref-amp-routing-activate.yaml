  heading: Activate and Deactivate
official_url: "https://ampcode.com/docs/markdown/customize/model-routing"
excerpt: |-
  Inactive connections are skipped during routing but keep their settings, so you can switch a
  connection off and on without re-entering its key. Expand the connection in Model Routing and use
  **Activate** or **Deactivate**, or:
  ```shell-session
  amp config model-providers activate <connection-id>
  amp config model-providers deactivate <connection-id>
  ```
  Multiple API keys for the same provider can be active at once. Model mappings and priority
  determine which key serves each model. AI model routers and Custom URL connections can also be
  active together.
  Subscriptions allow only one active connection of each subscription type per user. For example,
  activating a ChatGPT subscription deactivates your other active ChatGPT subscription, but leaves
  your OpenAI API keys active.
