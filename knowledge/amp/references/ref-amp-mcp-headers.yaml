  heading: Remote MCP Definitions
official_url: "https://ampcode.com/docs/markdown/customize/mcp"
excerpt: |-
  Some servers need more headers on every request, such as an organization ID. Add them under
  Headers when you add or edit a definition in
  [MCP server settings](/settings/mcp-servers). Amp sends them with every authentication type. Mark
  a header Secret when its value is a credential. Amp checks it for you when
  the name or value looks like one, such as `X-Api-Key` or `Bearer …`. Amp encrypts secret values
  and never shows them again; leave one blank to keep it. A saved secret header stays secret; to
  make it non-secret, remove it and add it again. When you change the server URL, enter each secret
  value again. Other header values stay visible in settings.
