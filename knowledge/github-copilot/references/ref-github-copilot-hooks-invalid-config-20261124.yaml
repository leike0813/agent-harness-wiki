official_url: https://docs.github.com/en/copilot/reference/hooks-reference.md
excerpt: '> If a hook configuration file loaded from a directory (for example, `.github/hooks/`) contains a malformed hook item, only that item is dropped and logged—valid sibling hooks in the same file still load. Structural errors (invalid JSON, a bad `version`, or a non-array event list) still reject the entire file. Hooks defined inline in `settings.json` remain strict: any item-level validation error rejects the whole `hooks` field. Other configuration files always load independently. The CLI prints `! Invalid hook configuration in FILE: REASON` for each skipped file or entry when repository hooks load at startup or after `/cd` into a repository.'
