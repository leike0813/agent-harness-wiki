  heading: "Denying a tool"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli.md"
excerpt: |-
  Use `--deny-tool` to prevent Copilot from using a specific tool.

  * For example:

    ```shell
    copilot --deny-tool='shell(git push)'
    ```

  This option takes precedence over the `--allow-all-tools` and `--allow-tool` options.
