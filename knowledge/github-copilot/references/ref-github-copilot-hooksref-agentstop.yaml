  heading: "`agentStop` / `Stop`"
official_url: "https://docs.github.com/en/copilot/reference/hooks-reference.md"
excerpt: |-
  **camelCase input:**

  ```typescript
  {
      sessionId: string;
      timestamp: number;
      cwd: string;
      transcriptPath: string;
      stopReason: "end_turn";
      stop_hook_active: boolean; // true when this turn was already forced to continue by a prior "block" decision from this hook
  }
  ```

  **VS Code compatible input:**

  ```typescript
  {
      hook_event_name: "Stop";
      session_id: string;
      timestamp: string;      // ISO 8601 timestamp
      cwd: string;
      transcript_path: string;
      stop_reason: "end_turn";
      stop_hook_active: boolean;
  }
  ```
