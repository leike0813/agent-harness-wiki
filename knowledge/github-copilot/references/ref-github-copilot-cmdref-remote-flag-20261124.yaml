excerpt: '| `--remote`                                   | Not supported for interactive startup or with `-p`. Use `/remote on` during an interactive session instead. The flag remains supported for legacy SDK server startup with `--server` or `--headless`. See [Steering a GitHub Copilot CLI session from another device](/en/copilot/how-tos/copilot-cli/use-copilot-cli/steer-remotely).                                                                                                                                                                                                                                                                                    |                                           |'
