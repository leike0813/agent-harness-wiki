  heading: "Plan-then-autopilot"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: "Plan-then-autopilot lets a session start in plan mode and automatically continue into autopilot mode once the plan is ready, without waiting for a human to approve the transition. Enable it with `--plan --mode autopilot`, or with the `COPILOT_PLAN_THEN_AUTOPILOT` environment variable for harnesses that can only inject environment variables and not command-line options. If both are set, the explicit options take precedence and the CLI displays a warning that the environment variable was ignored."
