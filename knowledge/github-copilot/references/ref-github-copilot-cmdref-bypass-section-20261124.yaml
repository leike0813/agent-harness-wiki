  heading: Restricting the allow-all options
official_url: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md
excerpt: 'When the value of `permissions.disableBypassPermissionsMode` is `disable`, the command line options that grant all permissions have no effect. These options are: `--allow-all-tools`, `--allow-all-paths`, `--allow-all-urls`, `--allow-all`, and `--yolo`.


  The restriction also applies during an interactive session. Slash commands that would turn on the allow-all mode are still available but are refused with an explanatory message.


  | Command                                                                          | Result with `disable` |

  | -------------------------------------------------------------------------------- | --------------------- |

  | `/permissions allow-all`                                                         | Refused               |'
