excerpt: Alternatively, to reduce approval prompts without granting blanket permissions, enter `/permissions assisted` in an interactive session. With assisted permissions, a large language model assesses eligible permission requests and automatically approves those it judges to be safe. Existing permissions and enterprise rules still apply, and requests that still need your approval are put to you. For more information, see [Allowing safe commands to run without manual approval](/en/copilot/concepts/customizations/allowing-safe-commands).
