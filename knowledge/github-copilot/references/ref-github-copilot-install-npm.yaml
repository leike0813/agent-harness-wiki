locator:
  kind: document_section
  heading: "Installing with npm (all platforms)"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/install-copilot-cli.md"
excerpt: |-
  Prerequisite: Node.js 22 or later.

  ```shell copy
  npm install -g @github/copilot
  ```

  > \[!NOTE]
  > If you have `ignore-scripts=true` in your `~/.npmrc` file, you must use the command:
  >
  > ```shell copy
  > npm_config_ignore_scripts=false npm install -g @github/copilot
  > ```

  To install the prerelease version:

  ```shell copy
  npm install -g @github/copilot@prerelease
  ```
