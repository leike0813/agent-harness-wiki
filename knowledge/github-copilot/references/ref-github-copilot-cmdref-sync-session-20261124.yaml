excerpt: '| `--sync-session[=on\|off]`                   | Enable or disable read-only session history syncing for this run. Without a value, enables syncing. Does not enable remote control. If omitted, uses your settings and the default behavior. Syncing is refused when your organization''s cloud session storage policy is off or can''t be determined.                                                                                                                                                                                                                                                                                                                      |                                           |'
