  heading: Parent-domain URL approvals
official_url: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md
excerpt: 'URL approval prompts can offer a parent-domain scope, such as `https://*.example.com`, in addition to the exact origin. This approves every subdomain of the registrable domain, such as `api.example.com` and `flow.example.com`, for the rest of the session.


  The scope has these restrictions:


  * Approval applies only to the current session and is never saved to settings.

  * The scheme and any non-default port must match.

  * Hosts under a separately owned suffix, such as `s3.amazonaws.com`, are not covered by approving `*.amazonaws.com`. This keeps an approval for \*.amazonaws.com from extending to buckets under s3.amazonaws.com, which may belong to other tenants.'
