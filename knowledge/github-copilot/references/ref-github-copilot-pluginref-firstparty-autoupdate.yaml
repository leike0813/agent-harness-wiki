official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-plugin-reference.md"
excerpt: |-
  First-party plugins—those installed from the built-in `awesome-copilot` marketplace—automatically update at the start of each session in a trusted working directory. Disable this behavior with the `autoUpdate` setting (set to `false`) or the `COPILOT_AUTO_UPDATE=false` environment variable. Auto-update is also skipped by default in CI.
