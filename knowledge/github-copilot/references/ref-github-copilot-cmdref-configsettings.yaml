excerpt: |-
  For detailed information about configuration file settings—including the full list of user settings, repository settings, local settings, and how they cascade—see [GitHub Copilot CLI configuration directory](/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference#configuration-file-settings).

  > \[!NOTE]
  > User settings were previously stored in `~/.copilot/config.json`. Existing user-editable settings in that location are automatically migrated to `~/.copilot/settings.json` on startup.
