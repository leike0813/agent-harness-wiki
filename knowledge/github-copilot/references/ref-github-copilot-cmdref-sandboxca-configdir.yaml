  heading: "Using `copilot sandbox ca`"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: |-
  Run these commands as the user who runs Copilot CLI, not elevated, as `SYSTEM`, or as `root`, because the certificate authority is stored in that user's Copilot CLI home directory. Run `copilot sandbox ca trust --help` for unattended setup guidance. `--config-dir` (or `COPILOT_HOME`) targets a non-default Copilot CLI home for these commands, the same as the rest of the CLI.
