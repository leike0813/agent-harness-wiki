locator:
  kind: document_section
  heading: "Using the `lsp-setup` skill to add a language server"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/add-lsp-servers.md"
excerpt: |-
  The `lsp-setup` skill from the "Awesome GitHub Copilot" repository automates the installation and configuration of a selection of popular languages.

  1. Go to the "Awesome GitHub Copilot" download site and search for "lsp":

     <https://awesome-copilot.github.com/skills/?q=lsp>.

  2. Download the `lsp-setup` skill.

  3. Unzip the downloaded `.zip` file to create a directory called `lsp-setup`.

  4. Move the `lsp-setup` directory into either:

     * Your personal skills directory: `~/.copilot/skills/`.
     * A project skills directory: `.github/skills/` in a Git repository.

  5. Start Copilot CLI, or if you are currently in a CLI session enter `/skills reload`.

  6. Enter the prompt:

     ```copilot copy
     setup lsp
     ```
