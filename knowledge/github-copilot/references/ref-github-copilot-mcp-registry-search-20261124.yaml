excerpt: 'You can discover and install MCP servers directly from the [GitHub MCP Registry](https://github.com/mcp) using the `/mcp search` command in interactive mode. This lets you browse available servers, view their details, and install them without manually filling out the configuration form.


  If your organization has configured a custom MCP registry URL, `/mcp search` connects to that registry instead of the default GitHub registry.'
