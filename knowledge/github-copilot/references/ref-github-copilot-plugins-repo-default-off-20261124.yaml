official_url: https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/plugins-finding-installing.md
excerpt: "Repository defaults are optional. To turn off a plugin enabled by repository settings, add a `false` entry to `enabledPlugins` in `.github/copilot/settings.local.json`:\n\n```json copy\n{\n  \"enabledPlugins\": {\n    \"PLUGIN-NAME@MARKETPLACE-NAME\": false\n  }\n}\n```\n\nReplace the identifier with the plugin's name and marketplace name. Save the file and start a new session. To turn the plugin back on, set the entry to `true`."
