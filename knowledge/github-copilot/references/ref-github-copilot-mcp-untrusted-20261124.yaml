excerpt: '> [!NOTE]

  > Project-level MCP servers are loaded only after you confirm folder trust on first launch. They are skipped in untrusted directories. Prompt mode warns when workspace MCP configuration is skipped because the folder is not trusted. For more information on folder trust, see [GitHub Copilot CLI](/en/copilot/concepts/copilot-surfaces/copilot-cli#trusted-directories).'
