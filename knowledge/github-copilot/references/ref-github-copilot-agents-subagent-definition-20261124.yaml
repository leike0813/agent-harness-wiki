  heading: Custom agents and subagents
official_url: https://docs.github.com/en/copilot/concepts/customizations/custom-agents.md
excerpt: 'A custom agent is a **definition of a specialist**. A subagent is **an agent doing delegated work** in a separate context window. The main agent can delegate to a built-in agent or run a specialist using a custom agent profile.


  Separate context lets a subagent focus on its assigned task without adding every intermediate detail to the main conversation. Independent tasks can also run in parallel. These are benefits of delegation, not properties that require you to create a custom profile.'
