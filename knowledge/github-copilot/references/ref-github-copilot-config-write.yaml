  heading: "Allowing or denying `'write'` tools"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli.md"
excerpt: |-
  Use `'write'` to allow or deny tools—other than shell commands—permission to modify files.

  * For example, to allow Copilot to edit files without your individual approval, use:

    ```shell
    copilot --allow-tool='write'
    ```
