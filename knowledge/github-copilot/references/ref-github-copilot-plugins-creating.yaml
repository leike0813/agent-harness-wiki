  heading: "Creating a plugin"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/plugins-creating.md"
excerpt: |-
  1. Create a directory for your plugin.

  2. Choose a plugin format, then add a `plugin.json` manifest file to the root of the directory.

     To create an Agent Plugins 1.0 plugin, include the canonical `$schema`:

     **Example Agent Plugins 1.0 `plugin.json` file**

     ```json copy
     {
       "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
       "name": "my-dev-tools",
       "description": "React development utilities",
       "version": "1.2.0",
       "author": {
         "name": "Jane Doe",
         "email": "jane@example.com"
       },
       "license": "MIT",
       "keywords": ["react", "frontend"]
     }
     ```
