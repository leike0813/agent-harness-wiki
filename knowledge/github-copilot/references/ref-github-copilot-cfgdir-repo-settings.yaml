  heading: "Repository settings (`.github/copilot/settings.json`)"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference.md"
excerpt: |-
  Repository settings apply to everyone who works in the repository. They are committed to the repository and shared with collaborators.

  > \[!NOTE]
  > The plugin-related keys in the repository configuration file (`enabledPlugins` and `extraKnownMarketplaces`) are also read by Copilot cloud agent, not only Copilot CLI. This lets you enable the same plugins for both clients from a single file. For more information about plugins, see [About GitHub Copilot plugins](/en/copilot/concepts/agents/about-plugins).

  Only the keys listed in the following table are supported at the repository level. Any other keys—including keys that are valid in the user configuration file—are silently ignored. Each supported key has a directional merge policy that keeps the override fail-closed and safe.
