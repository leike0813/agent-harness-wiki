excerpt: 'Connect an external service once to give Copilot access to its tools and context. You can then use the connection across supported Copilot surfaces without repeating setup or signing in separately in each one. GitHub handles MCP server configuration and authentication for you.


  If your organization or enterprise provides your Copilot subscription, an administrator may need to update its policies to allow connectors. See [Copilot connectors](/en/copilot/concepts/customizations/copilot-connectors).


  1. In an interactive CLI session, enter `/mcp` to open the MCP server dashboard.

  2. Use the <kbd>←</kbd> and <kbd>→</kbd> keys to switch to the **Connectors** view.

  3. Select a connector, press <kbd>Enter</kbd>, then select **Connect**.'
