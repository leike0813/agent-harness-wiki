excerpt: 'The CLI automatically configures `github-mcp-server` when authentication is available, unless you disable it or supply your own configuration. Other servers depend on your account, platform, CLI version, and enabled plugins. They are not all available or enabled by default.


  Your account''s Copilot MCP policy also applies to trusted first-party servers, even though they are exempt from managed server allowlists and denylists. If that policy disables MCP, the built-in GitHub MCP server does not start.'
