excerpt: 'Plugins can be available, installed, or enabled. Adding a marketplace makes its plugins available to browse. Installing a plugin adds it to a surface, and enabling it makes its components available in sessions on that surface. Shared configuration can set a default or enforce whether a plugin is enabled:


  | Configuration source             | Effect                                                                                                      | Can a member turn the plugin off?                 |

  | -------------------------------- | ----------------------------------------------------------------------------------------------------------- | ------------------------------------------------- |'
