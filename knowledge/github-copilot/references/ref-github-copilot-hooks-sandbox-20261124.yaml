excerpt: When the session sandbox is enabled, command hooks from the repository, your user settings, and plugins run inside it, under the same sandbox policy rules as the agent's shell commands. A hook can also read the directory it was loaded from, so a plugin can run the scripts it ships, and a plugin hook can write to its data directory (`$COPILOT_PLUGIN_DATA`).
