excerpt: 'A SQLite database used by the CLI for cross-session data such as checkpoint indexing and search. This file is automatically managed and should not be edited.


  If you delete this file, you can rebuild it using the `/chronicle reindex` command. Reindexing also syncs your session data to your account.'
