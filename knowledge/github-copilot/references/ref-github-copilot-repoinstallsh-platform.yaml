schema_version: 2
record_kind: production
reference_id: ref-github-copilot-repoinstallsh-platform
harness_id: github-copilot
snapshot_id: snapshot-github-copilot-repo
locator:
  kind: file_lines
  file: "install.sh"
  start: 15
  end: 32
official_url: "https://github.com/github/copilot-cli"
excerpt: |-
  OS="$(uname -s || echo "")"
  case "$OS" in
    Darwin*) PLATFORM="darwin" ;;
    Linux*) PLATFORM="linux" ;;
    CYGWIN*|MINGW*|MSYS*)
      if command -v winget >/dev/null 2>&1; then
        echo "Windows detected. Installing via winget..."
        winget install GitHub.Copilot
        exit $?
      else
        echo "Error: Windows detected but winget not found. Please see https://gh.io/install-copilot-readme" >&2
        exit 1
      fi
      ;;
    *) echo "Error: Unsupported operating system $OS" >&2 ; exit 1 ;;
  esac

  # Detect architecture
