excerpt: '| `defaultMode`                                  | `"interactive"` \| `"plan"` \| `"autopilot"`                                            | `"interactive"`                      | The agent mode that new interactive sessions start in. The `--mode`, `--autopilot`, and `--plan` options take precedence. Resumed sessions keep their own mode, and the setting is ignored for `-p`/`--prompt`, `--server`, and `--acp` runs.'
