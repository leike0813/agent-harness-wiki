excerpt: '| `permissions.disableBypassPermissionsMode`     | `string`                                                                                | —                                    | Set to `"disable"` to block all allow-all options (`--allow-all-tools`, `--allow-all-paths`, `--allow-all-urls`, `--allow-all`, `--yolo`). This setting does not block assisted permissions, which are controlled separately. Other values are treated as an alias of `"disable"` and a warning is written to the log. See [GitHub Copilot CLI command reference](/en/copilot/reference/copilot-cli-reference/cli-command-reference#restricting-the-allow-all-options).'
