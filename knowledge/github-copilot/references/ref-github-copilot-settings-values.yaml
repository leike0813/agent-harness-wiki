  heading: "Viewing valid values for a setting"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/customize-copilot/change-settings.md"
excerpt: |-
  To display the valid values that are available for a setting, enter `/settings KEY` with no value. For example, to see the valid values for `theme`:

  ```copilot copy
  /settings theme
  ```
