excerpt: |-
  For help within the CLI, enter:

  ```copilot
  /help
  ```

  To view usage statistics, enter:

  ```copilot
  /usage
  ```

  To submit private feedback to GitHub about Copilot CLI, raise a bug report, or submit a feature request, enter:

  ```copilot
  /feedback
  ```
