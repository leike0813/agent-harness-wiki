  heading: "Command-line commands"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: |-
  | Command | Purpose |
  | `copilot` | Launch the interactive user interface. |
  | `copilot app` | Open the GitHub Copilot app in the current directory, deep-linking straight to a new session. Falls back to opening the app's download page in a browser if the deep link can't be handled, or prints the URL to open manually if no browser is available. |
  | `copilot completion SHELL` | Print a shell script for the chosen shell that can be used to enable tab completion for Copilot CLI. Supported shells: `bash`, `zsh`, `fish`. See [Using `copilot completion`](#using-copilot-completion). |
  | `copilot help [TOPIC]` | Display help information. Help topics include: `billing`, `config`, `commands`, `environment`, `logging`, `monitoring`, `permissions`, `providers`, and `sandbox`. |
