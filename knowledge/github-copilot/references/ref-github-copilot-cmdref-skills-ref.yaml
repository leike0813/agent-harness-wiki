official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: |-
  Skills are Markdown files that extend what the CLI can do. Each skill lives in its own directory containing a `SKILL.md` file. When invoked (via `/SKILL-NAME` or automatically by the agent), the skill's content is injected into the conversation.

  ### Skill frontmatter fields

  | Field | Type | Required | Description |
  | `name` | string | Yes | Unique identifier for the skill. Must start with a letter or number and contain only letters, numbers, hyphens, underscores, dots, colons, and spaces. Max 64 characters. Colons allow namespaced names (for example, `my-plugin:search`). |
  | `description` | string | Yes | What the skill does and when to use it. Max 1024 characters. |
