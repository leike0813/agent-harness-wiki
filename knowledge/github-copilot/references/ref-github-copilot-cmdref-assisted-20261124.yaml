excerpt: '| `--assisted-approval`                        | Turn on assisted permissions for the run, so that a safety review can approve eligible permission requests. Only valid for non-interactive runs—that is, runs that use `-p` or `--prompt`, and runs in an environment with no terminal attached. When successfully enabled, takes precedence over `--allow-all-tools`, but does not affect `--allow-all-paths` or `--allow-all-urls` (env: `COPILOT_ASSISTED_APPROVAL`). See [Allowing safe commands to run without manual approval](/en/copilot/concepts/customizations/allowing-safe-commands).                                                                         |                                           |'
