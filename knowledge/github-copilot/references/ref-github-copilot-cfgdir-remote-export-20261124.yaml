excerpt: '| `remoteExport`                                 | `boolean`                                                                               | `true`                               | Sync session history to your account when session sync is available. Set to `false` to opt out by default. Enabling remote control with `remoteSessions: true` also enables export, regardless of this setting. Syncing history does not itself enable remote control. Use `--sync-session=on` or `--sync-session=off` to override history syncing for a run. Syncing is refused when your organization''s cloud session storage policy is off or can''t be determined.'
