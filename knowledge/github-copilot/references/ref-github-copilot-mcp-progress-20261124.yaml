excerpt: 'An MCP tool call that keeps emitting progress notifications is canceled once it has run for ten times the server''s `timeout`. Increase `timeout` for tools that need to run longer.


  ### Tool snapshot caching


  Copilot CLI persists a snapshot of each local server''s tool list so tools are available immediately on startup while live discovery completes in the background. Live discovery always runs and replaces the snapshot once it finishes.


  Set `disableToolCache: true` on a server to force live discovery for that server only, or set the `COPILOT_MCP_TOOL_CACHE=false` environment variable to disable snapshot loading and persistence for the entire process. Both opt-outs leave existing cache files untouched.


