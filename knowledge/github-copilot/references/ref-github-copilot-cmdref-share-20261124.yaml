excerpt: '| `/share [link\|off\|file\|html\|gist\|research] [...]`, `/export [...]`                                                                                                                                           | Share the current session. With no subcommand, opens a sharing menu without sharing or exporting anything. `link` shares the session and prints a shareable GitHub link. `off` or `link off` stops link sharing. `file [session\|research] [PATH]` exports to a Markdown file. `html [session\|research] [PATH]` exports to an HTML file. `gist [session\|research]` creates a GitHub gist. `research [PATH]` exports the research report.'
