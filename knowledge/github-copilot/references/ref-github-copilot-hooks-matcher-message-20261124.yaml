  heading: Matcher filtering
official_url: https://docs.github.com/en/copilot/reference/hooks-reference.md
excerpt: 'Several events accept an optional `matcher` regex on each hook entry that filters which invocations the hook fires for. It is compiled as `^(?:PATTERN)$` and must match the full value. Invalid regexes cause the hook entry to be skipped, and the CLI prints `! Invalid hook configuration in FILE: REASON`.'
