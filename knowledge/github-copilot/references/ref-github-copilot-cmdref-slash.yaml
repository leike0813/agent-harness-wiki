  heading: "Slash commands in the interactive interface"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: |-
  These are the slash commands you can use from within an interactive CLI session. A subset of these slash commands is available to clients that use the CLI via its ACP server. For more information, see [Copilot CLI ACP server](/en/copilot/reference/copilot-cli-reference/acp-server).

  | Command | Purpose | |
  | `/add-dir PATH` | Allow file access to a directory and load its `.github/skills` and `.github/agents` as trusted configurations. | |
  | `/after [DELAY PROMPT]`, `/after` | Schedule a non-recurring prompt, skill, or schedulable slash command for the current session (for example, `/after 30m remind me the time` or `/after 1h /chronicle standup`). With no arguments the schedule manager is displayed. Only available in experimental mode. | |
