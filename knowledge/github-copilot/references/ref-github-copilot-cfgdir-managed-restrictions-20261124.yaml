excerpt: 'For `strictPluginOnlyCustomization`, restrictions are combined across native MDM, administrator-deployed `managed-settings.json` files, server-managed settings, and policy-helper settings. A category restricted by any source stays restricted. Setting the key to `false` or a narrower array in another source cannot remove that restriction.


  Long-running sessions re-fetch and re-apply managed settings hourly, so policy changes—for example, an organization enabling `permissions.disableBypassPermissionsMode`—take effect without restarting the session.


  ### MDM managed settings sources


  Copilot CLI reads managed settings from platform-specific MDM or file-based locations.


  | Platform | Source type  | Location                                                           |'
