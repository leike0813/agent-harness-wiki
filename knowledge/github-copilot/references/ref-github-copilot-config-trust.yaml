  heading: "Setting trusted directories"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli.md"
excerpt: |-
  Trusted directories control where Copilot CLI can read, modify, and execute files. Trusting a directory has security implications, see [Security considerations](/en/copilot/concepts/agents/copilot-cli/about-copilot-cli#security-considerations).

  ### Choosing to trust a directory

  When you start a GitHub Copilot CLI session, you'll be asked to confirm that you trust the files in, and below, the directory from which you launched the CLI.

  You can choose to trust the current directory for:

  * The currently running session only
  * This and future sessions
