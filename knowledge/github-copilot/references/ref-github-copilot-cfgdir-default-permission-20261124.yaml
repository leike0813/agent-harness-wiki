excerpt: '| `defaultPermissionMode`                        | `"manual"` \| `"assisted"` \| `"allow-all"`                                             | Varies                               | Your preferred permission mode for new interactive sessions. A managed `permissions.defaultMode` takes precedence over this preference. If neither default is set, sessions can start in manual or assisted mode. Set `"manual"` to prompt for requests that aren''t already allowed, `"assisted"` to use model review for eligible requests, or `"allow-all"` to grant broad permissions equivalent to `--allow-all`. Deny rules and enterprise restrictions still apply. See [Allowing safe commands to run without manual approval](/en/copilot/concepts/customizations/allowing-safe-commands).'
