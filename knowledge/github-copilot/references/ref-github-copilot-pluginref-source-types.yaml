  kind: document_section
  heading: "Plugin source types"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-plugin-reference.md"
excerpt: |-
  The `source` field on a plugin entry accepts a relative path string, or an object describing a GitHub repository or Git URL source:

  ```json
  {
      "source": {
          "source": "github",
          "repo": "owner/repo",
          "ref": "v1.0.0",
          "path": "plugins/my-plugin"
      }
  }
  ```

  Both the `github` and `url` source types accept an optional `sha` field to pin installs to an exact commit, in addition to (or instead of) `ref`:

  ```json
  {
      "source": {
          "source": "github",
          "repo": "owner/repo",
          "sha": "a94a8fe5ccb19ba61c4c0873d391e987982fbbd3",
          "path": "plugins/my-plugin"
      }
  }
  ```

  `sha` must be a full 40-character commit SHA. Pin to a `sha` for reproducible installs that are immune to force-pushes or tag/branch moves.
