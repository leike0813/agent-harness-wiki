  heading: "Tools"
official_url: "https://docs.github.com/en/copilot/reference/custom-agents-configuration.md"
excerpt: |-
  The custom agent `tools` property controls which tools are available to your agent, including those from MCP servers.

  Your custom agent will have access to MCP server tools that have been configured in both its agent profile and/or the repository settings. For more information on configuring shared repository MCP servers on GitHub, see [Configure MCP servers for your repository](/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers).

  You can configure `tools` using the following approaches:

  * **Enable all available tools**: Omit the `tools` property entirely or use `tools: ["*"]` to enable all available tools. This will include all MCP server tools configured in the agent profile and/or repository settings.
