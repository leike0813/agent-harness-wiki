excerpt: |-
  If `settings.json` fails to read, parse, or validate, Copilot CLI ignores the invalid values and shows a startup warning on the timeline directing you to the **Problems** tab of the `/settings` command. Open that tab to see the specific error, then fix the reported issue to restore the affected settings.
