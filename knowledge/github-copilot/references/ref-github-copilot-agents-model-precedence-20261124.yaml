excerpt: '| `--model=MODEL`                              | Set the AI model you want to use. Pass `auto` as the value to let Copilot pick the best available model automatically. An explicit `--model` takes precedence over a custom agent''s `model` unless the agent sets `model-policy: required`. See [About GitHub Copilot auto model selection](/en/copilot/concepts/models/auto-model-selection).                                                                                                                                                                                                                                                                            |                                           |'
