  heading: Session approvals on resume
official_url: https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md
excerpt: 'When you resume a session with `copilot --resume`, the CLI restores approvals you granted for the rest of that session for commands, tools, URLs, parent-domain scopes, and file paths. It also restores session denials, so requests covered by these decisions do not prompt again.


  Directory approvals and approvals granted automatically by the safety review or a policy are not restored. Current managed policy still applies.'
