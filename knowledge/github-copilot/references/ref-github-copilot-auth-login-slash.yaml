locator:
  kind: document_section
  heading: "Authenticate with `/login`"
official_url: "https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli.md"
excerpt: |-
  1. From Copilot CLI, run `/login`.

     ```bash copy
     /login
     ```

  2. Select the account you want to authenticate with. For GitHub Enterprise Cloud with data residency, enter the hostname of your instance

     ```text
     What account do you want to log into?
      1. GitHub.com
      2. GitHub Enterprise Cloud with data residency (*.ghe.com)
     ```

  3. Choose how you want to sign in. The recommended option is listed first, and depends on your environment: the browser flow on a local terminal, or the device code flow in a remote or headless environment. The following example shows the prompt in a local terminal:

     ```text
     How do you want to sign in?
      1. Sign in with your browser (recommended)
      2. Sign in with a device code
     ```

  4. Complete the flow you selected.
