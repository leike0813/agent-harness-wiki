  heading: "Custom instructions imports"
official_url: "https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference.md"
excerpt: "Instruction files support `@path` imports. Prefix a line with `@` followed by a path to inline the contents of another file. Paths can be relative to the instruction file's directory or absolute. Imports are resolved recursively, up to a depth limit, with cycle and size guards. This is supported in `AGENTS.md`, `CLAUDE.md`, and `.github/copilot-instructions.md`."
