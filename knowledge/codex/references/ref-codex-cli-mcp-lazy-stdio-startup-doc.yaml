excerpt: 'By default, Codex can wait until the first tool call to start an optional stdio server if it already has a usable tool list for that server. A required stdio server can also start on first use if you set `startup_readiness = "catalog"`. Without a cached tool list, Codex starts the server when the thread starts. Set `features.mcp_lazy_stdio_startup = false` to start these servers with the thread.'
