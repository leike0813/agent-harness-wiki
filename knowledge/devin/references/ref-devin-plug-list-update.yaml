  heading: Managing plugins
official_url: "https://docs.devin.ai/cli/extensibility/plugins/overview.md"
excerpt: |-
  `devin plugins list` only shows plugins already installed on this machine; it
  doesn't pull new enterprise or organization plugins. Run `devin plugins update`
  to fetch them (starting a session does this too). Only plugins set to
  **Required for everyone** in Customize install automatically; one that's
  **Offered to members** needs `devin plugins install <source>`.
