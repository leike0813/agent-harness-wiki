  | - | - | - | - |
  | `model` | string | `"swe-1-6-fast"` | Default AI model |
  | `subagent_model` | string | unset | Model for subagents, used instead of your team's [default subagent model](https://docs.devin.ai/cli/subagents.md#which-model-does-a-subagent-use). Must be a model your team allows |
  | `pinned_models` | string\[] | `[]` | [Pinned models](https://docs.devin.ai/cli/models.md#pinned-models), in the order `Alt+N` cycles through them. Edit with `Alt+P` in `/model` |
  | `show_history_on_continue` | boolean | `true` | Show previous messages when resuming a session |
