excerpt: 'Diagnose the local Devin configuration. It reports which [custom subagent](/cli/subagents#custom-subagents) profiles loaded, flags any `AGENT.md` definition whose frontmatter could not be parsed (such definitions are skipped at runtime), and warns about frontmatter keys Devin ignores. The command exits with a non-zero status if any check fails.


  ```bash theme={null}

  devin doctor

  devin doctor --json   # Machine-readable output'
