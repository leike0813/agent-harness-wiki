excerpt: |-
  Show the current working directory above the input in local sessions. When enabled, the row above the input box displays your prettified CWD (e.g. `~/projects/my-app`).

  | Value | Behavior |
  | - | - |
  | `true` | Show CWD path above the input (default) |
  | `false` | Hidden |
