  heading: local_tools_bypass_permissions (user only)
official_url: "https://docs.devin.ai/cli/reference/configuration/config-file.md"
excerpt: |-
  Start every [Local Hands](https://docs.devin.ai/work-with-devin/local-hands.md) connection, such as `devin connect`, with **Bypass local permissions** on. Tool calls from the cloud session then run without a per-call prompt. `deny` and `ask` rules still apply, and so do the [calls that always ask](https://docs.devin.ai/work-with-devin/local-hands.md#calls-that-always-ask). When you turn bypass on or off from the cloud session, the CLI updates this setting.

  | Value | Behavior |
  | - | - |
  | `false` | Ask before each local tool call (default) |
  | `true` | Start each connection in bypass |
