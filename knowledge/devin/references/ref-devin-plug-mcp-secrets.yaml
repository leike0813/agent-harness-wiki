excerpt: |-
  * **MCP servers** — plugins can provide optional
    [MCP servers](https://docs.devin.ai/cli/extensibility/mcp/overview.md) that start with the session.
    Their tools are available to Devin. In the CLI, authenticate a plugin's
    OAuth server with [`devin mcp login`](https://docs.devin.ai/cli/extensibility/mcp/configuration#troubleshooting);
    cloud sessions use the connection made in the web app (see
    [MCPs](https://docs.devin.ai/product-guides/plugins.md#mcps)). A plugin MCP config may set an
    OAuth client ID and scopes, but never a client secret — a server config
    carrying one is rejected at activation. Use `${NAME}` placeholders for
    credentials; do not put secrets in the plugin.
