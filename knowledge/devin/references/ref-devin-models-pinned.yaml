official_url: "https://docs.devin.ai/cli/models.md"
excerpt: |-
  Pin the models you switch between most often so you can cycle through them without opening the picker.

  1. Run `/model` and highlight a model.
  2. Press `Alt+P` (macOS: `Opt+P`) to pin or unpin it. Pinned models are listed first under a **Pinned** header.
  3. From the input, press `Alt+N` (macOS: `Opt+N`) to switch to the next pinned model. Pins that are disabled for your team, hidden, or no longer available are skipped.

  Pins are stored as model IDs in `agent.pinned_models` in your [config file](https://docs.devin.ai/cli/reference/configuration/config-file.md#agent), in the order you cycle through them:
