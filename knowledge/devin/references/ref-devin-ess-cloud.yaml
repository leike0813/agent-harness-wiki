official_url: "https://docs.devin.ai/cli/essential-commands.md"
excerpt: |-
  Run Devin in the cloud instead of on your machine, and steer it from the same terminal. See [Cloud CLI](/cli/cloud) and [SSH](/cli/ssh).
  ```bash theme={null}
  devin --cloud                                      # Start a cloud session
  devin --cloud -r https://app.devin.ai/sessions/…   # Resume a cloud session by URL
  devin ssh <session-id-or-url>                      # SSH into the session's VM
  ```
  Inside a session, `/cloud` switches a fresh local session to the cloud, `/open` opens the cloud session in the web app (`/open desktop` for Devin Desktop), `/handoff` moves work between local and cloud, and `/archive` archives it.
