excerpt: |-
  * **Hooks** — a `hooks.json` at the plugin root registers
    [lifecycle hooks](https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks.md) wherever the
    plugin is installed: cloud Devin sessions, the CLI, and Devin Desktop. Cloud
    sessions run command hooks only (prompt hooks are skipped) and don't fire
    `SessionEnd`. Plugin hooks are currently **best effort and fail open** — if
    a hook fails to load or run, the session continues without it — so don't
    rely on them for crucial guardrails yet.
