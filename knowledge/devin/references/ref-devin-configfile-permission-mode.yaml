  heading: permission_mode (user only)
official_url: "https://docs.devin.ai/cli/reference/configuration/config-file.md"
excerpt: |-
  The [permission mode](https://docs.devin.ai/cli/reference/permissions.md) new local sessions start in: `"normal"` (the default), `"accept-edits"`, `"smart"`, or `"dangerous"`. `--permission-mode` overrides it for one launch, and `/clear` reads it so a new conversation keeps the configured mode.

  ```json theme={null}
  {
    "permission_mode": "accept-edits"
  }
  ```
