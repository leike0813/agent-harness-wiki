  heading: "5. Evolve and govern"
official_url: "https://docs.devin.ai/cli/extensibility/plugins/quickstart.md"
excerpt: |-
  * Merging to your marketplace repo's default branch **is** the release — new sessions pick it up automatically, and **Reindex plugins** in Customize refreshes what the page shows. See [how updates roll out](/product-guides/plugins#how-updates-roll-out); pin to a `sha` when you want to control updates.
  * Teams add plugins by PR to the marketplace repo; CI validates the layout.
  * To lock the account down to your approved set only, add `"forbiddenPlugins": ["*"]` to the managed manifest (**Plugin settings → Edit manifest** in Customize) and list every approved plugin (including the meta-plugin's dependencies — transitive deps aren't exempt) in `requiredPlugins`/`optionalPlugins`. Full semantics: [dependencies and governance](/cli/extensibility/plugins/overview#dependencies).
