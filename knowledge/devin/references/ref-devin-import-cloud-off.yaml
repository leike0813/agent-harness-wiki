  heading: Devin Cloud
official_url: "https://docs.devin.ai/cli/reference/configuration/read-config-from.md"
excerpt: |-
  * MCP servers from Devin Cloud are not listed or connected. MCP servers from your local `mcp_config.json` files and from other tools are unaffected.
  * Your personal Devin Cloud plugins do not load. Plugins your organization or enterprise requires still load, and plugins it forbids stay blocked.
  * `devin plugins install` no longer adds to your personal Devin Cloud plugins. Pass `--local` to install on the current machine instead.
  * Signing in, models, and cloud sessions are unaffected. This option only controls which configuration is loaded.
