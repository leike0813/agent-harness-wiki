locator:
  kind: document_section
  heading: "4. Distribute it to everyone"
official_url: "https://docs.devin.ai/cli/extensibility/plugins/quickstart.md"
excerpt: |-
  An org or enterprise admin installs the repo from [**Customize → Plugins**](https://app.devin.ai/customize): **Add plugin → From repository**, enter `your-org/your-marketplace`, and pick the organization or enterprise scope. That adds one required plugin to the scope's managed manifest:
  ```json theme={null}
  {
    "requiredPlugins": ["your-org/your-marketplace"]
  }
  ```
  Everyone in scope gets the baseline automatically in cloud sessions, the CLI, and Devin Desktop. A private repo works as-is: cloud fetches through your Git integration; CLI users fetch with their own git credentials, so they need access to the repo too. See the [Plugins guide](/product-guides/plugins) for scopes, indexing, and MCP connections.
