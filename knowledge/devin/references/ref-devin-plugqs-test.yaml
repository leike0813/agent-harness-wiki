official_url: "https://docs.devin.ai/cli/extensibility/plugins/quickstart.md"
excerpt: |-
  ```bash theme={null}
  node scripts/validate-template.mjs      # structural validation (also runs in CI)
  devin plugins install --local .         # install the meta-plugin from your checkout, on this machine only
  devin plugins list                      # see everything it pulled in
  ```
  Local installs are linked, so edits apply on your next session — iterate on a skill, then start a session and invoke it as `/<plugin>:<skill>`. (Without `--local`, `install` adds the plugin to your personal plugins in Devin Cloud, which is what you want once it's pushed to a repo.)
