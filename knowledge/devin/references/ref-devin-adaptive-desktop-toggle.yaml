  heading: Enterprise availability
official_url: "https://docs.devin.ai/cli/adaptive.md"
excerpt: |-
  For enterprise organizations, Adaptive is disabled by default. An admin must enable the Adaptive setting on the enterprise settings page. Team members can then select Adaptive in the model picker.

  * **Devin Desktop**: Go to **Settings > Devin Desktop > Models**. In the **Model routing** section, turn on **Adaptive**.
