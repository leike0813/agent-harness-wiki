official_url: "https://docs.devin.ai/cli/extensibility/mcp/configuration.md"
excerpt: |-
  | `oauthScopes` | string\[] | No | OAuth scopes to request when the server's 401 challenge names none. |
  | `disabled` | boolean | No | Set to `true` to skip this server (see [Enabling and disabling servers](#enabling-and-disabling-servers)) |
  | `disabledTools` | string\[] | No | Tool names on this server to hide from the agent. Also accepted on stdio servers. |

  The same `mcpServers` shape is used by plugins in Devin cloud; the field reference and setups are at [Plugin MCP servers](https://docs.devin.ai/product-guides/plugin-mcp-setups.md).
