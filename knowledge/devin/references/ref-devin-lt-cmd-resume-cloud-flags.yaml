excerpt: '| `--cloud` | | | Drive [Devin Cloud sessions](/cli/cloud) instead of the local agent. Requires a Devin account. |

  | `--continue` | `-c` | | Resume the most recent session in the current directory |

  | `--resume <SESSION_ID>` | `-r` | | Resume a specific session by ID. With `--cloud`, accepts a cloud session ID or URL. |'
