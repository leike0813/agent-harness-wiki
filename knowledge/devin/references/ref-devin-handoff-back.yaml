  heading: Hand off back to local
official_url: "https://docs.devin.ai/cli/handoff.md"
excerpt: |-
  `/handoff` also works the other way. In a [cloud session](/cli/cloud) — started with `devin --cloud` or resumed with `devin --cloud --resume <url>` — `/handoff` fetches the session's pull request branch, switches your checkout to it, and starts a local session on that code, so you can finish the last mile on your machine.
  <Note>
    Not using the Devin CLI? You can hand off from Claude Code, Codex, Cursor, or any coding agent — and from plain shell scripts — with the open-source [Devin Handoff](https://github.com/club-cog/devin-handoff) plugin. See [Hand off to Devin](/work-with-devin/devin-handoff) for setup and usage across every agent.
  </Note>
