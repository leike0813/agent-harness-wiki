official_url: "https://docs.mistral.ai/vibe/code/cli/agents.md"
excerpt: "Create custom agents in `~/.vibe/agents/` (user-level) or `./.vibe/agents/` (project-level) by adding a `.toml` file. Every agent must declare its kind via `agent_type`: `agent_type = \"agent\"` is user-facing, selectable via `vibe --agent <name>` or `Shift+Tab`; `agent_type = \"subagent\"` is delegation-only, spawned by the model through the `task` tool. The `safety` field changes the input border color only and does not enforce permissions."
