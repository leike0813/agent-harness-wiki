locator:
  kind: document_section
  heading: "Example: block destructive shell commands"
official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "`./.vibe/hooks.toml`: [[hooks]] name = \"deny-rm-rf\" type = \"pre_tool\" match = \"bash\" command = \"python ./.vibe/hooks/guard-bash.py\" strict = true description = \"Reject rm -rf and other destructive shell commands.\" The script reads the hook payload from stdin (`payload.get(\"tool_input\", {}).get(\"command\", \"\")`), prints a JSON object with `decision: \"deny\"` and `reason` for the blocked case, and exits 0 with empty stdout for the passthrough case. With `strict = true`, any script crash or malformed JSON output also denies the call instead of degrading to a warning."
