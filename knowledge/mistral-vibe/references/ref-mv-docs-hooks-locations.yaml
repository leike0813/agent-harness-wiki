  heading: Configuration file locations
official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "Hooks are declared in `hooks.toml`. The CLI looks in this order: 1. `./.vibe/hooks.toml` in the working directory (**project-level**, loaded first, **trusted folders only**). 2. `~/.vibe/hooks.toml` in your home directory (**user-level**, loaded second). When the same `name` appears in both files, the **project entry wins**. Subagents inherit the parent's hook configuration, so policies apply transitively."
