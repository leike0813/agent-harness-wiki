  - Experimental: with `experimental_enable_remote_plugins`, the plugins that are on in your Mistral plugin library are downloaded to `~/.vibe/remote-plugins` and load in sessions. A synced plugin is read-only: a copy changed on disk is downloaded again. A local plugin named like one in your library is not loaded and is reported until you rename it
