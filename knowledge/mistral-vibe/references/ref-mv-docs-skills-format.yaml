official_url: "https://docs.mistral.ai/vibe/code/cli/skills.md"
excerpt: "A skill is a **directory containing a `SKILL.md` file**. The file starts with YAML frontmatter and continues with the skill instructions in Markdown. Common frontmatter fields: **`name`**: used to invoke the skill. **`description`**: shown in the skill list. **`user-invocable`**: when `true`, exposes the skill as a slash command in the CLI and the VS Code extension. **`allowed-tools`**: restricts which tools the skill can call."
