  kind: document_section
  heading: Give the API key to the CLI
official_url: "https://docs.mistral.ai/vibe/code/cli/api-keys-profiles.md"
excerpt: "The CLI supports **three ways** to provide your key, listed in order of precedence (highest first). 1. Interactive setup (`vibe --setup`); the setup flow saves your key to `~/.vibe/.env` for future sessions. 2. Environment variable: `export MISTRAL_API_KEY=\"your_mistral_api_key\"`. 3. `.env` file: the CLI loads `~/.vibe/.env` automatically on startup. Environment variables take precedence over values stored in `~/.vibe/.env`."
