  heading: Trusted folders
official_url: "https://docs.mistral.ai/vibe/code/safety-approvals-permissions.md"
excerpt: "A project can ship its own Vibe configuration (like agents, skills, MCP servers, and tool permissions) in a `.vibe/` directory at the repository root. Because that configuration **changes how Vibe behaves**, Vibe will only load it from directories **you have explicitly trusted**. Trustable content includes a `.vibe/` directory, an `.agents/` directory, or an `AGENTS.md` file. Trusted directories are remembered in `~/.vibe/trusted_folders.toml`. If you decline or have not yet trusted a directory, project-level configuration is ignored and Vibe prints a warning."
