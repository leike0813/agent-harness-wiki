official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "Fires after every assistant turn that ends without pending tool calls. **Receives** no extra fields. **Can return**: `decision: \"deny\"` + `reason` — `reason` is injected as a new user message asking the agent to retry. Capped at **3 retries per hook per user turn**; further denies become terminal warnings. `system_message` — UI-only."
