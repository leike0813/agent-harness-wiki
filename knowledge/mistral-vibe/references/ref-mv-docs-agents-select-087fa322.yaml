official_url: "https://docs.mistral.ai/vibe/code/cli/agents.md"
excerpt: "Pick an agent at launch: `vibe --agent plan`, `vibe --agent auto-approve`. In interactive sessions, switch agents on the fly with `Shift+Tab`. Set the default interactive agent in `config.toml`: `default_agent = \"plan\"`. This applies to **interactive sessions only**. In programmatic mode (`--prompt`), the CLI falls back to `auto-approve` if `--agent` is not provided. The page documents no `--auto-approve` or `--yolo` launch flag; `yolo` appears only as an agent-file `safety` field value."