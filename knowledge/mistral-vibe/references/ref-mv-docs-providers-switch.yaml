  heading: Switch between accounts or providers
official_url: "https://docs.mistral.ai/vibe/code/cli/api-keys-profiles.md"
excerpt: "The CLI supports multiple providers and models through **presets** in `config.toml`. Define a provider preset and a model preset: [[providers]] name = \"openrouter\" api_base = \"https://openrouter.ai/api/v1\" api_key_env_var = \"OPENROUTER_API_KEY\" api_style = \"openai\" backend = \"generic\"; [[models]] name = \"mistralai/devstral-2512:free\" provider = \"openrouter\" alias = \"devstral-openrouter\". Set the active model: `active_model = \"devstral-openrouter\"`. Then export the matching API key."
