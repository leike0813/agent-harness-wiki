  heading: Hook contract
official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "Every hook is spawned with a UTF-8 JSON object on `stdin` containing the session context: `session_id`, `parent_session_id`, `transcript_path`, `cwd`, and `hook_event_name`. Hooks respond through their **exit code** and **stdout**. Exit `0`, empty `stdout` = passthrough. Exit `0`, valid JSON object on `stdout` = structured response. Exit `0`, non-conforming `stdout` = hook failure. Non-zero exit, timeout, or spawn failure = hook failure. Universal fields: `system_message`, `decision` (`\"allow\"`|\"deny\", default \"allow\"), `reason`, `hook_specific_output`."
