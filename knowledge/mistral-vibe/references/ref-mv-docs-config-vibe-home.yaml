  heading: Vibe home directory
official_url: "https://docs.mistral.ai/vibe/code/cli/configuration.md"
excerpt: "By default, the CLI stores its configuration and state in `~/.vibe/`. Override the location with the `VIBE_HOME` environment variable: export VIBE_HOME=\"/path/to/custom/vibe/home\". `VIBE_HOME` affects the location of: `config.toml`, `.env`, `agents/`, `prompts/`, `skills/`, `tools/`, `logs/`."
