locator:
  kind: document_section
  heading: Top-level keys
official_url: "https://docs.mistral.ai/vibe/code/cli/configuration-reference.md"
excerpt: |-
  | `default_agent` | string |  | Default interactive agent, for example `"plan"`. Ignored in programmatic mode, which falls back to `auto-approve`. |
  | `active_model` | string |  | Model alias currently in use. |
  | `allowed_models` | array<string> |  | Allow-list of model name patterns (exact, glob, or `re:` regex), matched against the model names sent to the inference API, not their aliases. |
  | `log_interactions` | boolean | `true` | Enables session logging. |
  | `skill_paths` | array<string> |  | Extra directories to discover skills from. |
  | `enabled_skills` | array<string> |  | Allow-list of skill name patterns; when non-empty, only matching skills load. |
  | `disabled_skills` | array<string> |  | Deny-list of skill name patterns, applied when `enabled_skills` is empty. |
