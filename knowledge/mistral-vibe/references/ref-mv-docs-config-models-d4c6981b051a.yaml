excerpt: "One `[[models]]` table per model preset. | `name` | string | Required | Model ID, for example `mistral-medium-latest` | `provider` | string | Required | References a `[[providers]]` `name` | `alias` | string | `name` | Local alias used by `active_model`. Defaults to `name` when omitted | `display_name` | string | `alias` | Label shown in the model picker. Falls back to `alias` when unset | `temperature` | number | `0.2` | Sampling temperature. The section is a field table only: it names no catalogue of available Mistral model IDs, and contains no statement about replacing `-latest` with a date suffix to pin a version."