official_url: "https://docs.mistral.ai/vibe/code/cli/agents.md"
excerpt: "| `default` | General-purpose agent. Asks for approval before running tools. | `plan` | Read-only agent for exploration and planning. Auto-approves safe read tools. | `accept-edits` | Auto-approves file edits in the working directory. | `auto-approve` | Auto-approves all tool execution. | `lean` | Specialized agent for the Lean 4 proof assistant. The CLI also ships with a built-in subagent named `explore`, used by the model for read-only codebase exploration. You cannot select subagents directly with `--agent`."
