excerpt: "From a CLI session: `/mcp`. Pass a server name to list its tools: `/mcp fetch_server`. `vibe mcp add mistralai --url https://api.mistral.ai/mcp --transport streamable-http --api-key-env MISTRAL_API_KEY`; `vibe mcp remove mistralai`. `/connectors` is an alias for `/mcp`."
