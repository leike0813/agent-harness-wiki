  heading: "`post_tool`"
official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "Fires per tool call **if and only if the tool body actually ran**. It does not fire when the tool never executed: `pre_tool` denial, user denial at the approval prompt, permission set to `NEVER`, or cancellation before the body started. **Receives** `tool_status` (`success`, `failure`, or `cancelled`), `tool_output`, `tool_output_text`, `tool_error`, `duration_ms`. **Can return**: `decision: \"deny\"` + `reason` (replaces `tool_output_text`); `hook_specific_output.additional_context` (appended to `tool_output_text`)."
