official_url: "https://docs.mistral.ai/vibe/code/cli/agents.md"
excerpt: "Subagents run independently and return **text-only results** to the parent agent. The model can spawn them through the `task` tool when it wants to delegate exploration or background work. Subagents cannot ask the user questions. By default, the built-in subagents do not write files, but a custom subagent can if its `enabled_tools` and per-tool permissions allow it."
