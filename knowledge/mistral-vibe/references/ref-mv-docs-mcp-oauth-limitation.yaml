official_url: "https://docs.mistral.ai/vibe/code/cli/mcp-servers.md"
excerpt: "**Known limitation:** the CLI does not yet support MCP servers that require OAuth authentication. Use the `stdio` or `http` transport with an API key or other static credential. Supported transports: `http` (server is reachable over standard HTTP), `streamable-http` (HTTP and streaming responses), `stdio` (local process you start from a command)."
