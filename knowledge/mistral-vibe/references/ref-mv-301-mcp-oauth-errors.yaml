  class MCPOAuthPortInUse(MCPOAuthError):
      def __init__(self, *, port: int, server_alias: str) -> None:
          self.port = port
          self.server_alias = server_alias
          super().__init__(self._fmt())

      def _fmt(self) -> str:
          return (
