  heading: Per-tool permissions
official_url: "https://docs.mistral.ai/vibe/code/safety-approvals-permissions.md"
excerpt: "Beyond agent modes, you can lock down or open up individual tools in `config.toml`. This applies to built-in tools (`read_file`, `write_file`, `bash`, `grep`, etc.) as well as MCP tools and connector tools. Toggle tools globally using exact names, globs, or regex patterns: enabled_tools = [\"read_file\", \"grep\", \"task\"]; disabled_tools = [\"bash\"]. Set when Vibe should ask before using a tool, or always allow it: [tools.read_file] permission = \"always\"; [tools.bash] permission = \"ask\". For the `bash` tool you can also allow or block specific commands: allow = [\"git status\", \"pnpm test\"], deny = [\"rm -rf *\"]."
