  heading: Declare a hook
official_url: "https://docs.mistral.ai/vibe/code/cli/hooks.md"
excerpt: "Each hook is a `[[hooks]]` table. | `name` | yes | Unique identifier. Used to deduplicate between project and user files. | `type` | yes | One of `pre_tool`, `post_tool`, `post_agent`. | `command` | yes | Shell command to spawn. Receives the hook payload on `stdin`. | `match` | `pre_tool` / `post_tool` | Tool-name matcher: fnmatch glob, or regex with the `re:` prefix. Case-insensitive. | `timeout` | no | Seconds before the hook is killed. Default: `60`. | `strict` | tool hooks only | failures become denials or text clears. | `description` | no | Free text shown in diagnostics."
