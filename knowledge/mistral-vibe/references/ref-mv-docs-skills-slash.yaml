excerpt: "Skills are the recommended way to add your own slash commands. Set `user-invocable: true` in the frontmatter and the skill name becomes available with `/skill-name` autocompletion in the CLI prompt. Pair custom skills with `allowed-tools` to keep their access scoped to what the workflow needs."
