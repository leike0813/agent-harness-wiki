locator:
  kind: document_section
  heading: "Per-tool permissions (`[tools.<tool_name>]`)"
official_url: "https://docs.mistral.ai/vibe/code/cli/configuration-reference.md"
excerpt: |-
  `<tool_name>` is a built-in tool (`read_file`, `bash`, etc.) or an MCP tool named `{server_name}_{tool_name}`. One block per tool.
  | `permission` | string |  | `"always"` to auto-allow the tool, `"ask"` to prompt before use |
  | `allow` | array<string> |  | `bash` only. Command allow-list |
  | `deny` | array<string> |  | `bash` only. Command deny-list |
