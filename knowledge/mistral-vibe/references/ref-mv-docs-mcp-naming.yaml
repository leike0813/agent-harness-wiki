official_url: "https://docs.mistral.ai/vibe/code/cli/mcp-servers.md"
excerpt: "MCP tools are exposed under the pattern `{server_name}_{tool_name}`. Configure permissions per tool just like built-in tools: [tools.fetch_server_get] permission = \"always\". You can also restrict which MCP tools are active using `enabled_tools` and `disabled_tools`. Filters support **exact names**, **glob patterns**, and **regex** with the `re:` prefix."
