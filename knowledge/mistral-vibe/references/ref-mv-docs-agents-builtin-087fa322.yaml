excerpt: "Built-in agent table rows, in order: `default`, `plan`, `accept-edits`, `smart-approve` (Classifies each tool call, runs the ones it judges safe, and asks for approval before risky ones), `auto-approve` (Use only in a trusted, sandboxed environment), `lean`. Plus: \"The CLI also ships with a built-in subagent named `explore`, used by the model for read-only codebase exploration. You cannot select subagents directly with `--agent`.\""