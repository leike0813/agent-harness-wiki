  heading: Admin-managed configuration
official_url: "https://docs.mistral.ai/vibe/code/cli/configuration.md"
excerpt: "Your Organization can distribute a Vibe Code CLI configuration to all users. Admin-managed settings take precedence over command-line flags, environment variables, and the project and user `config.toml` files. When admin config is active: Admin-managed fields are read-only in `/config`. The CLI fetches admin config at the start of each session and keeps it in memory. It never writes admin config to your local `config.toml`."
