  ## Data directory, configuration, and proxy
    <AccordionGroup>
      <Accordion title="Where does the CLI store configuration and sessions?">
        The default data root is `~/.minimax`, and the configuration file is `<data-dir>/config.yaml`. The directory also stores sessions, logs, plugins, skills, and other runtime data. Set `MINIMAX_DATA_DIR` to choose another directory; `MAVIS_DATA_DIR` is a compatibility fallback, and `MINIMAX_DATA_DIR` wins when both are set.
        ```bash theme={null}
        export MINIMAX_DATA_DIR=/path/to/mcode-data
        ```
      </Accordion>
