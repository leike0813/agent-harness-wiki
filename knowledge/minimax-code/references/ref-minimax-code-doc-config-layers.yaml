  heading: Configuration layers
official_url: "https://agent.minimax.io/docs/cli/configuration.md"
excerpt: |-
  ## Configuration layers
    | Layer | Entry point | Scope |
    | - | - | - |
    | Current run | CLI options such as `mcode exec --model ...` | Overrides one process or task |
    | Runtime config | `<data-dir>/config.yaml` | Stores default model, permission mode, and MiniMax source |
    | Provider credentials | `mcode provider ...` | Stores provider metadata and credential references |
    | Project rules | `AGENTS.md` in the workspace | Describes project conventions and validation |
    Command-line overrides apply only to the current run and do not silently rewrite global configuration.
