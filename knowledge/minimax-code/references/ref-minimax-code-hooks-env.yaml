  function safeHookEnvironment(): NodeJS.ProcessEnv {
    const inherited = [
      'PATH',
      'HOME',
      'LANG',
      'TERM',
      'SHELL',
      'USER',
      'TMPDIR',
      'TEMP',
      'TMP',
      'PATHEXT',
      'SystemRoot',
      'ComSpec',
      'USERPROFILE',
      'HOMEDRIVE',
      'HOMEPATH',
      'APPDATA',
      'LOCALAPPDATA',
    ];
    return Object.fromEntries(
      inherited.flatMap((name) => {
        const value = process.env[name];
        return value === undefined ? [] : [[name, value]];
      }),
    );
