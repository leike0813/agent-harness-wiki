excerpt: |-
  ## Data directory
    The default data root is `~/.minimax`. It stores configuration, sessions, logs, plugins, skills, and other runtime data. Choose another directory with:
    ```bash theme={null}
    export MINIMAX_DATA_DIR=/path/to/mcode-data
    ```
    `MAVIS_DATA_DIR` is a compatibility fallback; `MINIMAX_DATA_DIR` wins when both are set. The configuration file is:
    ```text theme={null}
    <data-dir>/config.yaml
