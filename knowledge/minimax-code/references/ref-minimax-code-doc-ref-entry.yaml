excerpt: |-
  ## Global entry point
    ```text theme={null}
    mcode [options] [prompt]
    ```
    | Option | Purpose |
    | - | - |
    | `--version` | Print the CLI version |
    | `--help` | Print help |
    | `--session [id]` | Open a session; omit the ID to browse sessions |
    | `-c, --continue` | Continue the latest session in the current workspace |
