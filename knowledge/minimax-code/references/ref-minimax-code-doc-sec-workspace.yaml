excerpt: |-
  ## Workspace and data directory
    The default data root is `~/.minimax`; use `MINIMAX_DATA_DIR` to select another directory:
    ```bash theme={null}
    export MINIMAX_DATA_DIR=/path/to/mcode-data
    ```
    Use separate data directories on remote hosts, shared machines, and CI runners so accounts do not share sessions, logs, or provider configuration.
