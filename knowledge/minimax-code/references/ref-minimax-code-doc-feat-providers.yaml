  ## Providers and models
    The CLI supports MiniMax Token Plan, MiniMax API Key, and custom providers using compatible Anthropic or OpenAI API shapes.
    ### MiniMax credential source
    ```bash theme={null}
    mcode provider list
    mcode provider use token-plan
    mcode provider use api-key
    ```
