excerpt: |-
  ## Recommended safety baseline
    ### Interactive development
    * Use Ask or Auto by default.
    * Check paths and commands before deletion, bulk writes, or external requests.
    * Run `mcode init .` in an unfamiliar repository and review its `AGENTS.md`.
    * Use `/status`, `/doctor`, and `/context` to inspect account, configuration, and context state.
    * Inspect the diff and run relevant tests before accepting the result.
    ### CI and batch jobs
