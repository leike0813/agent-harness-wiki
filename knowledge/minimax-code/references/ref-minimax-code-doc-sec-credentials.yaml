excerpt: |-
  ## Protect credentials
    Provider API keys are read from environment variables:
    ```bash theme={null}
    export MCODE_PROVIDER_API_KEY="..."
    mcode provider set-minimax-key
    ```
    Do not put keys in a repository, `AGENTS.md`, prompts, screenshots, or CI logs. Login callback URLs can contain temporary credentials and must not be shared or committed. `mcode provider list` shows only managed-login or masked-key status.
