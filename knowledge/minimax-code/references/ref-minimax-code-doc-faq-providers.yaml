  ## Providers and API keys
    <AccordionGroup>
      <Accordion title="How do I use a MiniMax API key?">
        Set the key and then run `mcode provider set-minimax-key`:
        ```bash theme={null}
        export MCODE_PROVIDER_API_KEY="your MiniMax API key"
        mcode provider set-minimax-key
        ```
        The default variable is `MCODE_PROVIDER_API_KEY`; use `--api-key-env <name>` for another variable. The CLI reads the key but does not print it.
