excerpt: |-
  ## Sign-in and MiniMax credentials
    ```bash theme={null}
    mcode login
    mcode login --region global
    mcode logout
    ```
    The default region is mainland China; pass `--region global` for a Global account.
    Running `mcode logout` or `/logout` in the TUI clears the local sign-in state, prints a complete browser sign-out link, and tries to open the page for the current account region and environment. On a remote or headless machine, copy the link from the terminal into your own browser. Command completion does not wait for the browser or page result.
