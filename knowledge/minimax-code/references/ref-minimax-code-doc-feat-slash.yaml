excerpt: |-
  ### Slash command reference
    Type `/` to open autocomplete. Contextual commands appear only when the relevant session or run state exists.
    | Category | Command | Purpose |
    | - | - | - |
    | Session | `/new` (alias `/clear`) | Create a new session |
    | Session | `/sessions [query]` (alias `/resume`) | Search, resume, and manage sessions |
    | Session | `/goal <objective-or-action>` | Start or manage the current goal |
    | Session | `/plan [action]` | Switch or inspect Plan Mode; action is `on`, `off`, `status`, or `view` |
    | Session | `/parent` | Return from a child agent session to its parent |
    | Session | `/fork` | Fork the current session |
