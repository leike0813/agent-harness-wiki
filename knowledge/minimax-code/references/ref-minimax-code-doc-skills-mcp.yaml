  ## Skills and MCP
    In the TUI:
    ```text theme={null}
    /skills [filter]
    /mcp [filter]
    ```
    `/skills` searches available skills and `/mcp` searches MCP configuration. Available entries depend on the data directory, project, and host. Run `/doctor` to inspect configuration and `/status` to inspect runtime state.
    Starting with 0.4.5, models that support web search use a built-in search tool without requiring a separate search MCP server. User-configured MCP servers are unaffected.
