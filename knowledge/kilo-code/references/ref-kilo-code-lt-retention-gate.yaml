excerpt: "  export function shouldRun(\n    active: Policy,\n    input: { force?: boolean },\n    state: State | null,\n    now: number,\n  ): { ok: boolean; reason?: \"disabled\" | \"recent\" } {\n    if (!active.enabled) return { ok: false, reason: \"disabled\" }\n    if (!input.force && state && now - state.at < MIN_SPACING_MS) return { ok: false, reason: \"recent\" }\n    return { ok: true }\n  }"
