locator:
  kind: document_section
  heading: Environment Variables
official_url: "https://github.com/Kilo-Org/kilocode"
excerpt: |-
  Use `{env:VARIABLE_NAME}` syntax in config files to reference environment variables:
  ```json
  {
    "provider": {
      "openai": {
        "options": {
          "apiKey": "{env:OPENAI_API_KEY}"
        }
      }
    }
  }
  ```
  {% callout type="warning" title="Only works in trusted config" %}
  `{env:VAR}` (and `{file:...}`) references are resolved **only** in trusted config: your global config (`~/.config/kilo`), a config passed via `KILO_CONFIG` / `KILO_CONFIG_CONTENT`, or organization/MDM-managed config. A project-level `kilo.json` / `opencode.json` committed to a repository **cannot** use `{env:VAR}` — the reference is ignored and a warning is logged. This prevents a malicious repository from exfiltrating your secrets to an attacker-controlled `baseURL` simply by being opened.
