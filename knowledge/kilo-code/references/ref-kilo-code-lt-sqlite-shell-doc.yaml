excerpt: '### Use the SQLite shell


  Install the `sqlite3` command-line tool, then open the selected database in read-only mode:


  ```bash

  sqlite3 -readonly "$(kilo db path)"

  ```


  Useful commands inside the shell include:


  ```sql

  .tables

  .schema session

  .schema message

  .schema part

  ```'
