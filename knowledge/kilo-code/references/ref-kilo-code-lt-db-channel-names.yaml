excerpt: "  // kilocode_change start - kilo-branded dev-channel db name, falling back to a pre-existing opencode-named db\n  const safe = InstallationChannel.replace(/[^a-zA-Z0-9._-]/g, \"-\")\n  const next = join(Global.Path.data, `kilo-${safe}.db`)\n  const prev = join(Global.Path.data, `opencode-${safe}.db`)\n  if (!existsSync(next) && existsSync(prev)) return prev\n  return next\n  // kilocode_change end\n}"
