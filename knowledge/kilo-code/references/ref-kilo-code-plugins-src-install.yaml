  export async function installPlugin(spec: string, dep: InstallDeps = defaultInstallDeps): Promise<InstallResult> {
    const target = await dep.resolve(spec).then(
      (item) => ({
        ok: true as const,
        item,
      }),
      (error: unknown) => ({
        ok: false as const,
        error,
      }),
    )
    if (!target.ok) {
      return {
        ok: false,
        code: "install_failed",
        error: target.error,
      }
    }
    return {
      ok: true,
      target: target.item,
    }
  }
