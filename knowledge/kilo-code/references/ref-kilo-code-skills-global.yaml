excerpt: |-
  ### Global Skills (User-Level)
  Global skills are located in the `.kilo` directory within your Home directory:
  - Mac and Linux: `~/.kilo/skills/`
  - Windows: `\Users\<yourUser>\.kilo\skills\`
  ```
  ~/.kilo/
  └── skills/                    # Generic skills (all modes)
      ├── my-skill/
      │   └── SKILL.md
      └── another-skill/
          └── SKILL.md
  ```
