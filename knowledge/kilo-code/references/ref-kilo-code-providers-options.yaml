locator:
  kind: document_section
  heading: Provider-Level Options
official_url: "https://github.com/Kilo-Org/kilocode"
excerpt: |-
  You can also set options that apply to all models from a provider:
  ```jsonc
  {
    "provider": {
      "openai": {
        "options": {
          "apiKey": "{env:OPENAI_API_KEY}",
          "baseURL": "https://my-proxy.example.com/v1",
          "timeout": 300000,
        },
      },
    },
  }
  ```
  | Option | Type | Description |
  |---|---|---|
  | `apiKey` | `string` | API key (supports `{env:VAR}` and `{file:...}` syntax in trusted config — see note below) |
  | `baseURL` | `string` | Override the provider's base API URL |
  | `timeout` | `number \| false` | Request timeout in milliseconds, covering both the wait for response headers and the wait for the first byte of the response body. Defaults to `300000` (5 minutes); set to `false` to disable.
