excerpt: '`--search` performs a SQLite `LIKE` substring search on the title. It does not inspect messages. Use the returned session ID to resume or export a session:


  ```bash

  kilo --session ses_123

  kilo run --session ses_123 "Summarize where we stopped"

  kilo export ses_123 > session.json

  ```'
