excerpt: |-
  ### 方式1：自动触发
  用自然语言描述任务，模型会根据 description 自动识别意图并选择合适的自定义智能体：
  ```themes
  帮我审查这个接口的实现
  ```
  模型将自动识别并调用 code-review 智能体。
  ### 方式2：手动触发
  输入 /agent-name 手动触发指定的智能体：
  ```themes
  /code-review
  ```
