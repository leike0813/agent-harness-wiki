  heading: "模型上下文协议（Model Context Protocol）"
official_url: "https://docs.qoder.cn/user-guide/guide-for-using-mcp.md"
excerpt: |-
  MCP (Model Context Protocol)是一种开放标准协议，旨在为大语言模型（LLM）提供标准化的外部工具和上下文集成方式。借助 MCP 标准化接口的支持，Qoder CN 能够灵活扩展与不同数据源或外部系统的连接，使其智能体的能力和场景得到拓展，有效满足用户对于个性化扩展的诉求。
  您可以选择连接现有的MCP服务或自行开发专属的 MCP 服务，例如魔搭社区 MCP 市场、Higress MCP 市场等热门市场，已经提供了丰富的 MCP 服务，您可以自行探索发现更多符合您需求的解决方案，加速项目开发与创新。
