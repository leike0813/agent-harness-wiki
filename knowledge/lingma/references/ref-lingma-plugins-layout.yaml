locator:
  kind: document_section
  heading: "目录结构"
official_url: "https://docs.qoder.cn/qoder-plugins.md"
excerpt: |-
  ```plaintext
  my-plugin/
  ├── .qoder-plugin/
  │   └── plugin.json         # 插件清单（必需）
  ├── skills/                 # 技能
  │   ├── skill-a/
  │   │   └── SKILL.md
  │   └── skill-b/
  │       └── SKILL.md
  ├── rules/                  # 规则（.md 文件）
  ├── agents/                 # 子代理（.md 文件）
  ├── commands/               # 斜杠命令（.md 文件）
  ├── hooks/
  │   └── hooks.json          # 钩子配置
  ├── mcp.json                # MCP 服务器配置
  ├── qoder.md                # 项目指令文件（可选）
  ├── CONNECTORS.md           # Connector 依赖说明（可选）
  └── README.md               # 插件说明文档（可选）
  ```
  除 `.qoder-plugin/` 以外，所有目录均为可选，按需创建。`plugin.json` 中可显式声明路径覆盖默认约定。
