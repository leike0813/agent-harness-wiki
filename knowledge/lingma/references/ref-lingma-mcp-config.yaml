excerpt: |-
  <h5><b>1.进入 MCP 服务页面</b></h5> 在右上角头像处进入<b>个人设置</b>，单击 <b>MCP 服务</b>。 <div> <div> </div> <div> <strong>说明 </strong> MCP 添加后，可跨本地工程和 IDE 使用。 </div> </div>
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/2972876471/p951118.png)
  <h5><b>2.添加服务</b></h5> <h6><b>方式一：通过 MCP 广场完成添加</b></h6> <div> <div> </div> <div> <strong>重要 </strong> Qoder CN IDE暂不支持搜索MCP广场内容。 </div> </div> <ol> <li> 单击<b>MCP 广场 </b>标签，可以看到推荐的 MCP 服务列表以及魔搭社区提供的全部 MCP 服务。 </li> <li> 在 <b>MCP 广场 </b>中，浏览或搜索所需 MCP 服务，单击 <b>安装</b> 完成一键自动安装。 </li> </ol> <div> <div> </div> <div> <strong>说明 </strong> 部分 MCP Server 在运行使用时需要额外提供环境变量，例如 <b>API\_KEY</b> 或 <b>ACCESS\_TOKEN</b>。 </div> </div> <ol> <li> 安装完成后，返回我的服务页面，即可看到新安装的服务。图标显示为，表示连接成功可正常使用。展开详情，可以看到 MCP 提供的工具列表。 </li> </ol> <div> <div> </div> <div> <strong>说明 </strong
