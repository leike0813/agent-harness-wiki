excerpt: |-
  ### 1. 如何配置网络代理？
  Qoder CN 支持 HTTP、HTTPS、Socks5 网络代理配置，可在插件设置页进行配置，具体操作参考：[网络代理配置](/user-guide/network-proxy-configuration)。
  ### 2.如何测试网络连通性？
  可以尝试在 Terminal 中输入以下命令，如果返回 pong，则大概率可连通至 Qoder CN 服务端。
  ```bash
  curl https://lingma-api.tongyi.aliyun.com/algo/api/v1/ping
  curl -I https://qoder.console.aliyun.com
  ```
  ### 3. 遇到网络问题如何排查？
  为了更好地帮助你解决问题，请按照以下步骤操作并提供相关信息：
  1. 请进入"Qoder CN 设置" > "网络" > 运行诊断，并将完整的诊断结果发送给我们。
  2. 你当前是否正在使用 VPN、代理或企业网络？如果是，请尝试关闭这些服务或将网络切换至其他连接。
  3. 尝试在聊天界面中选择不同分级的模型，观察响应速度是否有改善。
  4. 如果以上操作后问题仍然存在，请进一步提供以下信息以便我们深入调查：
  - 发生延迟的具体示例提示及对应的时间戳；
  - 打开"帮助">"切换开发者工具"> 查看控制台错误日志并截图发送；
  - 此问题是在所有项目中都出现，还是仅限于某个特定的工作区？
  - 此问题在相同网络下的其他用户是否能复现？
  以上信息通过"问题上报"功能进行反馈。
