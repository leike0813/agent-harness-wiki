  heading: "什么是 Qoder CN 系列"
official_url: "https://docs.qoder.cn/product-overview/introduction-of-qodercn.md"
excerpt: |-
  Qoder CN 是阿里云推出的 AI 智能体产品系列，覆盖软件开发与日常办公多元场景，包含面向软件开发和创意构建的一体化 AI 工作空间 Qoder CN、面向编码场景的 Qoder CN IDE 与 Qoder CN JetBrains 插件、面向日常工作的 QoderWork CN（桌面应用）、Qoder CN CLI（终端原生形态）、QoderWake CN（数字员工）、Qoder Cloud Agents（云端 Agent 平台）等子产品。系列基于国内主流大模型与国内部署，满足金融、政务等行业对数据安全与合规的高要求。
  <Note>
    Qoder CN 系列原名“智能编码助手通义灵码”（Lingma），已于 2026 年 5 月 20 日正式更名。如您在其他渠道看到“通义灵码”相关内容，与本产品为同一产品。
  </Note>
  ## Qoder CN 产品家族特点
  - <b>国产大模型、国内部署：</b>底层支持 GLM、DeepSeek、Kimi、MiniMax 等国内主流大模型，全链路在国内云上部署，符合国内数据安全与合规要求。
  - <b>适合金融、政务等行业：</b>面向银行、保险、政务等对数据安全与合规要求高的客户群体，提供专属版、私域知识增强、专属 VPC 部署等企业级方案。
  - <b>阿里云一方产品：</b>由阿里云统一研发与运维，享受阿里云一方品的服务保障与生态协同能力。
  ## 一体化 AI 工作空间
  <b>Qoder CN：</b>面向软件开发和创意构建的桌面应用。它将对话、项目上下文、任务执行、知识、自动化和扩展能力集中在一个工作空间中，让你可以用自然语言描述目标，并在执行过程中查看操作、文件改动和阶段结果，最终获得可检查、可验证的交付结果。
