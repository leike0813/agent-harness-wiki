locator:
  kind: document_section
  heading: "工具一览"
official_url: "https://docs.qoder.cn/user-guide/tools.md"
excerpt: |-
  按类别列出的内置工具：
  | 类别   | 显示名称         | 工具 ID                 | 说明                          |
  | ---- | ------------ | --------------------- | --------------------------- |
  | 检索   | 检索仓库         | search\_codebase      | 通过语义检索的方式进行当前工程的检索          |
  | 检索   | 搜索文件         | search\_file          | 检索当前工程内的文件                  |
  | 检索   | 搜索代码         | grep\_code            | 检索当前工程内的代码                  |
  | 检索   | 检索符号         | search\_symbol        | 检索当前工程内的符号                  |
  | 检索   | 查看目录         | list\_dir             | 检索和查看当前工程内的工程目录             |
  | 检索   | 网络检索         | web\_search           | 检索互联网，无需 API key            |
  | 检索   | 获取网页内容       | fetch\_content        | 获取 URL 地址中的网页内容             |
  | 检索   | 检索记忆         | search\_memory        | 检索当前已生成的记忆内容                |
