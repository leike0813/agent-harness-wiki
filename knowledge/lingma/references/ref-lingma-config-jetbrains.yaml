excerpt: |-
  使用 Qoder CN 时，可以在 JetBrains IDE 中使用默认快捷键使用 Qoder CN 相关功能。同时，您也可以重新修改命令的快捷键。有关在 JetBrains IDE 中重新绑定快捷键的详细信息，可参阅 JetBrains 文档，如可以查看[IntelliJ IDEA](https://www.jetbrains.com/help/idea/mastering-keyboard-shortcuts.html#choose-keymap)文档。
  ### 准备工作
  如果需要在 JetBrains IDE 中使用 Qoder CN，必须完成 Qoder CN 安装及阿里云账号登录。 有关详细信息，可查看[安装指南](/user-guide/installation-guide)。
  ### 查看快捷键
  | 操作          | macOS        | Windows     |
  | ----------- | ------------ | ----------- |
  | 打开/关闭智能问答窗口 | ⌘ ⇧ L        | Ctl Shift L |
  | 接受行间代码建议    | Tab          | Tab         |
  | 废弃行间代码建议    | esc          | esc         |
  | 查看上一个行间推荐结果 | ⌥(option) \[ | Alt \[      |
  | 查看下一个行间推荐结果 | ⌥(option) ]  | Alt ]       |
  | 手动触发行间代码建议  | ⌥(option) P  | Alt P       |
