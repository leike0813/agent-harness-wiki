  heading: "Qoder CN JetBrains 插件更新日志"
official_url: "https://docs.qoder.cn/product-overview/changelogs-jetbrains.md"
excerpt: |-
  - 新增会话引导消息与排队状态通知，优化消息队列展示，提升对话交互体验
  - 在 TODO 注释处新增装订线图标，可直接交给 Qoder 修复
  - 新增长对话的按需加载，向上滚动即可加载更早的历史消息
  - 在底部工具栏新增开关，可控制是否将选中文本自动注入上下文
  - 新增清理操作，可通过 Tools > Qoder > Qoder Cleanup 一键清理过时的 Qoder 相关文件
  - 任务暂停待恢复时新增专属确认面板，后续操作更清晰
  - 被企业策略拦截的 MCP 服务展示禁用状态，提示更清晰
  - 优化历史会话浏览时的稳定性与加载性能
