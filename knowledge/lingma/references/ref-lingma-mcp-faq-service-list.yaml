excerpt: |-
  ### 4. MCP 服务列表无法正常加载
  服务列表持续显示加载中。
  - 重新启动 IDE。
  - 如果问题仍未解决，可尝试手动启动 Qoder CN 服务：
  <Tabs>
    <Tab title="Windows">
      进入目录：.lingma/bin/x.x.x/CPU架构_64_系统/，执行命令：`Lingma.exe start`
    </Tab>
    <Tab title="macOS">
      m1 芯片：/.lingma/bin/x.x.x/aarch64_darwin/Qoder CN；intel 芯片：/.lingma/bin/x.x.x/x86_64_darwin/Qoder CN，执行命令：`Qoder CN start`。等待启动成功后，重新单击登录按钮。
    </Tab>
  </Tabs>