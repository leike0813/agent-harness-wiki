excerpt: |-
  ### 查看自定义指令
  Qoder CN 管理员、组织内全局管理员（专属版）进入 Qoder CN 控制台，单击左侧扩展管理模块，即可看到已创建的自定义指令、Qoder CN 官方指令信息。
  扩展管理页面顶部提供<b>搜索框</b>和<b>新建指令</b>按钮，可通过<b>全部</b>、<b>自定义指令</b>、<b>官方指令</b>页签分类筛选。每条指令以卡片形式展示名称、功能描述、用户数及启用/关闭状态。
  单击指令卡片，即可进入指令详情页面，查看指令的基本信息、可见成员范围、对话配置等信息。同时还可以查看指令的使用数据。
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/6667853471/p849950.png)
  ### 创建自定义指令
  扩展管理中，单击新建指令，即进入新建自定义指令页面：
  #### 第一步：基本信息填写
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/6667853471/p849951.png)
  - 指令名称：指令的显示名称，1～64个字符，中文、英文、数字等均可；
  - 指令名称（英文）：指令的英文名称，1～64个字符，必须为大小写字母、数字、下划线、空格，此名称为开发者在 Qoder CN 中问答窗口使用/唤起指令时看到的名称，请确保规范性、可读性
  - 指令描述：200个字符以内即可，描述指令的使用场景、作用等；
  - 指令图标：指令的识别图标，提供了颜色、图标选择，可自由组合；
  - 指令可见范围：
    - 公开·企业内已授权开发者：选择后，企业内已授权使用 Qoder CN 的开发者均可使用该指令；
