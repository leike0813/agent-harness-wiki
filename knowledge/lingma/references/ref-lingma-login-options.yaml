  heading: "登录选项为什么发生了变化？"
official_url: "https://docs.qoder.cn/product-overview/qoder-cn-ide-jetbrains.md"
excerpt: |-
  在智能编码助手通义灵码（原灵码）的基础上， Qoder CN 产品系列又提供了QoderWork CN、Qoder CN CLI、QoderWake CN、Qoder CN Cloud Agents 等子产品。
  <b>2026 年 6 月 20 日起，Qoder CN（全家桶）逐步实现一个账号一份订阅解锁所有产品的能力，个人体验版、专业版、高级版、旗舰版，以及企业团队版和企业专属版均已支持。</b>
  升级后的账号体系统一使用「Qoder CN 账号」登录，因此 IDE 插件的登录页新增了一个入口：
  | **登录选项**                                                                       | **使用说明**                                                                                                                      |
  | ------------------------------------------------------------------------------ | ----------------------------------------------------------------------------------------------------------------------------- |
