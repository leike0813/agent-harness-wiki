  kind: document_section
  heading: "1. 下载与运行脚本"
official_url: "https://docs.qoder.cn/support/troubleshooting-guide.md"
excerpt: |-
  请根据您的操作系统，下载并运行对应的诊断工具：
  <Tabs>
    <Tab title="Windows环境">
      1. <b>下载脚本：</b>点击下载windows\_lingma.bat。
      2. <b>执行脚本：</b>找到文件，右键单击并选择“以管理员身份运行”。
      3. <b>查看结果：</b>脚本执行完毕后，会自动打开生成的日志文件。日志路径会显示在命令行窗口中，通常位于脚本同级目录下，名为“Qoder CN\_Log\_日期时间.txt”。
    </Tab>
    <Tab title="Linux/macOS环境">
      1. <b>下载脚本：</b>点击下载linuxormac\_lingma\_cn.sh。
      2. <b>执行脚本：</b>打开终端（Terminal），进入脚本所在目录，执行以下命令。
      3. 授予脚本执行权限。
         ```bash
         chmod +x Linuxormac_lingma_cn.sh
         ```
      4. 运行脚本。
         ```bash
         ./Linuxormac_lingma_cn.sh
         ```
      5. <b>查看结果：</b>脚本执行完毕后，会生成日志文件。日志文件通常位于脚本同级目录下，名为"Qoder CN\_Log\_日期时间.txt"。
    </Tab>
  </Tabs>
