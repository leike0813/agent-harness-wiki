  heading: "终端命令执行"
official_url: "https://docs.qoder.cn/user-guide/agent.md"
excerpt: |-
  智能体模式可根据当前需求自主决策进行终端命令编写与执行，为保障命令执行的确定性，默认每次执行命令前需要开发者进行确认：
  - 单击<b>运行</b>按钮，智能体会将命令发送到 IDE 的 Terminal 窗口进行运行；
  - 单击<b>取消</b>按钮，将跳过此次命令执行，智能体将根据开发者的反馈继续进行下一步规划。
  对于需要后台运行的命令，将会出现“后台运行”的标记，智能体将继续后续任务，并且会在需要的时候主动检查或获取终端输出结果。
  <Note>
    终端命令运行时，时常会遇到一些异常情况，如果您遇到了，可以参考[终端执行异常说明](/support/description-of-terminal-execution-exception)进行解决。
  </Note>
  当然，开发者可以在插件设置中，配置自动执行的命令允许列表，配置好的命令，可以无需确认自动执行。如需添加多个命令，可以使用英文逗号分隔。
  具体配置路径为插件 <b>Chat</b> 设置页面的 <b>Auto-Run</b> 区域，在 <b>Terminal in Agent Mode</b> 下方的输入框中添加允许自动运行的命令。
