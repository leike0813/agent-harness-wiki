excerpt: |-
  ### PreToolUse

  - <b>触发</b>：工具调用执行前
  - <b>可阻断</b>：是（exit 2 拒绝本次工具调用）
  - <b>匹配字段</b>：tool\_name
  - <b>额外字段</b>：tool\_name、tool\_input

  ### PostToolUse

  - <b>触发</b>：工具调用成功后
  - <b>可阻断</b>：否
  - <b>匹配字段</b>：tool\_name
  - <b>额外字段</b>：tool\_name、tool\_input、tool\_response
