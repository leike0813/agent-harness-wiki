  heading: "模型参数配置"
official_url: "https://docs.qoder.cn/user-guide/model-selector.md"
excerpt: |-
  点击模型选择器底部的**模型管理**，在**默认**分类中配置模型参数。不同模型支持的参数和可选范围不同。
  #### 上下文窗口
  上下文窗口决定模型一次处理请求时可使用的上下文大小。在对应模型的**上下文窗口**列中拖动滑块，选择该模型支持的大小。
  #### 思考强度
  思考强度用于调整模型的推理深度。对支持的模型，打开**思考强度**下拉菜单选择档位。例如，Qwen3.8-Max 提供**关闭思考**、**低**、**中**和**极高**。
  显示**不支持**或固定思考状态的模型，没有相同的可调选项。请以所选模型显示的控件为准。
  #### 保存设置
  修改后点击**保存设置**。这些偏好对所有任务生效；正在生成的回复保持当前设置，下一轮开始使用新设置。点击**取消**可放弃修改。
