locator:
  kind: document_section
  heading: "11. JetBrains 插件更新后，本地服务连不上或修复失败怎么办？"
official_url: "https://docs.qoder.cn/support/faq.md"
excerpt: |-
  如果修复未完成，请根据提示处理：

  - **旧服务无法停止或提示权限不足**：保存工作并退出当前 IDE。如果电脑上还开着 IntelliJ IDEA、PyCharm、GoLand 等其他 JetBrains IDE，或同一 IDE 的其他项目窗口，也请一并退出。然后只启动一个 IDE、打开一个项目，再次运行修复。
  - **安装失败**：检查磁盘剩余空间，以及插件设置中 **本地存储路径** 的读写权限。
  - **版本不一致**：将共用该服务的 IDE 中的对应插件更新到同一版本，按提示重启 IDE。
