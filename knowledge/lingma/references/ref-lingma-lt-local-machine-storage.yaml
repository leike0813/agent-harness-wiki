  heading: "Qoder CN 插件常见问题（JetBrains / VS Code）"
official_url: "https://docs.qoder.cn/support/faq.md"
excerpt: |-
  1. 在编辑器中使用 Ctrl/Cmd + Shift + P 打开命令面板，搜索并进入 User Settings（Open User Settings (JSON)）。
  2. 在打开的 settings.json 中查找是否存在配置项：Lingma.LocalMachineStoragePath。
  3. 若存在：
  4. 检查该配置项对应的路径是否真实存在且可访问，并按需修正为有效路径；或
  5. 直接删除该配置项。
  6. 保存配置后，重启/重新加载窗口，再次启动 Qoder CN，确认是否恢复正常。
