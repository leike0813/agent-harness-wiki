  heading: "管理自定义模型"
official_url: "https://docs.qoder.cn/user-guide/custom-model.md"
excerpt: |-
  在<b>模型</b>面板中，可对自定义模型执行以下操作：
  | <b>操作</b> | <b>说明</b>      |
  | --------- | -------------- |
  | 编辑        | 修改模型名称别名       |
  | 删除        | 移除模型，删除后不可继续使用 |
  | 启用/禁用     | 控制模型是否显示在选择列表中 |
