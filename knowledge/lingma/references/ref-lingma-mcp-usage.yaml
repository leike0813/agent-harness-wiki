  kind: document_section
  heading: "使用 MCP 工具"
official_url: "https://docs.qoder.cn/user-guide/guide-for-using-mcp.md"
excerpt: |-
  Qoder CN 会根据用户输入的提示词，结合 MCP 工具的名字及描述，自动判断所需调用的 MCP 工具，并将工具返回的结果输入下一步的处理流程中。
  <h4><b>1. 输入提示词</b></h4> 在 IDE 的对话框中切换为<b>智能体</b>模式，并在对话框中输入如下提示词。
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/2972876471/p951039.png)
  <h4><b>2. 执行工具</b></h4> 当<span>Qoder CN</span>需要调用 MCP 工具时，系统会出现提示，等您确认后将继续操作。
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/2972876471/p951041.png)
  <h4><b>3. 查看工具执行结果</b></h4> 工具执行完成后，<span>Qoder CN</span>的交互窗口将显示执行结果。您可以展开查看 MCP 工具的详细输入与输出信息，便于进一步分析和操作。
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/2542676471/p951042.png)
  <h4><b>4. 代码审查与采纳</b></h4> 问答交互完成后，您可审查并采纳最终的代码生成。
  ![img](https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/2542676471/p951067.png)
