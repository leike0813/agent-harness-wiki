  heading: "配置下发"
official_url: "https://docs.qoder.cn/user-guide/extensions-management.md"
excerpt: |-
  下发配置作用于集合中的单个内容。Qoder CN 和 QoderWork CN 都支持管理员下发。
  下发范围：未下发（不通过管理员下发；如果集合对成员可见，成员仍可自助安装）、全员下发（下发给组织内所有成员）、分组下发（下发给指定成员分组）。
  下发策略：客户端可配置（成员可在客户端中查看并配置该内容）、强制开启（内容在客户端中展示，并保持启用）、静默启用（内容在客户端中不展示，但由后台启用）。
  市场可见范围与下发范围是两个不同概念：前者控制集合（成员是否能在 QoderWork CN 客户端市场中发现该集合），后者控制单个内容（成员是否会收到管理员下发的内容）。