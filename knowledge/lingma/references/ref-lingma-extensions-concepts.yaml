excerpt: |-
  扩展与市场用于管理组织认可的插件和技能。管理员可以通过专属市场按集合组织能力，控制成员可见范围，并按需下发给 Qoder CN 或 QoderWork CN 成员。
  <Info>
    仅适用 Enterprise
  </Info>
  | **概念** | **说明** |
  | 技能（Skill） | 面向特定任务的可复用能力，例如代码审查、测试生成、API 文档生成 |
  | 插件（Plugin） | 可安装的能力包，可包含技能、命令、MCP 服务器等能力；在 QoderWork CN 客户端市场中展示为专家套件 |
  | 专属市场 | 组织成员发现和安装企业认可能力的入口，英文名称为 Private Marketplace |
  | 集合 | 专属市场中的管理单元，用于组织同一类插件或技能 |
  | 下发 | 管理员将集合中的单个插件或技能推送给成员 |