  heading: "档位选择"
official_url: "https://docs.qoder.cn/user-guide/model-selector.md"
excerpt: |-
  | 模型           | 说明                     | 适用场景                      | Credits 用量参考系数 |
  | ------------ | ---------------------- | ------------------------- | -------------- |
  | **Auto**     | 智能选择适合的模型，平衡性能与成本      | 日常任务、不需要指定具体模型的场景         | 0.5×           |
  | **Fast（快速）** | 快速高效，响应更快、Credits 消耗更低 | 需快速交付的业务代码、修 bug、加功能等日常任务 | 0.8×           |

  一般任务可以从 **Auto** 开始；目标清楚、需快速交付时可选择 **Fast**；对模型有明确偏好或需要特定能力时，可以直接指定模型。
