  heading: "规则类型"
official_url: "https://docs.qoder.cn/user-guide/rules.md"
excerpt: |-
  根据引入和触发方式的不同，我们将规则分为以下4个类型，以灵活适配各类业务场景。
  | <b>类型</b>                     | <b>触发方式</b>                                                       | <b>适用场景</b>                                                       |
  | ----------------------------- | ----------------------------------------------------------------- | ----------------------------------------------------------------- |
  | <b>手动引入（Manual）</b>           | 在智能会话或行间会话中通过#rule（VS Code）或@rule（Qoder CN IDE/JetBrains）手动引入才生效。 | 按需执行一次性或特定的工作流、自定义提示词等。                                           |
  | <b>模型决策（Model Decision）</b>   | 在智能会话中使用智能体模式时，或在智能问答开启工具使用后，模型将根据用户定义规则的描述内容，自主决策是否应用该规则。        | 由模型自主决策，仅在特定场景下生效的规则，例如生成单测时生效，或生成注释时生效等。                         |
