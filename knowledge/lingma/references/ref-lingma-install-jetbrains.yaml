excerpt: |-
  本安装步骤适用于 macOS、Windows 或 Linux 的 JetBrains IDEs 中安装 Qoder CN。
  ### 步骤 1：准备工作
  - 操作系统：Windows 7 及以上、macOS、Linux；
  - 下载并安装兼容的 JetBrains IDEs 2020.3 及以上版本，Qoder CN 与以下 IDE 兼容：
    - IntelliJ IDEA（旗舰版、社区版、教育版）
    - Android Studio
    - CLion
    - GoLand
    - PhpStorm
    - PyCharm（专业版、社区版、教育版）
    - Rider
    - RubyMine
    - RustRover
    - WebStorm
    - ...
  更多详细信息，请参阅[JetBrains IDE](https://www.jetbrains.com/products/)工具查找器。
  ### 步骤 2：在 JetBrains IDEs 中安装 Qoder CN
  Tips：以在 IntelliJ IDEA 中安装 Qoder CN 为例。
  <Note>
    分享一款 IDEA 的主题，JetBrains IDEs 的 [New UI](https://www.jetbrains.com/idea/new-ui/)，使用该主题需要将 IDEA 升级到最新版，打开设置后，在 Appearance & Behavior 中即可看到 New UI 的配置入口。
  </Note>
  #### 方法 1：从插件市场安装
  1. 打开 IntelliJ IDEA 设置窗口，在插件市场中搜索 Qoder CN，找到 Qoder CN 后单击安装。
  2. 安装完成后，请重启 IntelliJ IDEA。
