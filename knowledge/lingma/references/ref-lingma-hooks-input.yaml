excerpt: |-
  Hook 脚本通过 stdin 接收 JSON 数据。所有事件都包含以下通用字段：
  | <b>字段</b>         | <b>说明</b>       |
  | ----------------- | --------------- |
  | session\_id       | 当前会话 ID         |
  | cwd               | 当前工作目录          |
  | hook\_event\_name | 触发的事件名称         |
  | transcript\_path  | 会话上下文 JSON 文件路径 |
  不同事件会在此基础上附加额外字段（见下文事件参考）。用 jq 解析输入：
  ```python
  #!/bin/bash
  input=$(cat)
  tool_name=$(echo "$input" | jq -r '.tool_name')
  ```
