  matcher 用于过滤 Hook 的触发范围，不同事件匹配不同的字段（见各事件说明）。
  <table style={{width:"100%",tableLayout:"fixed"}}> <thead> <tr><td><p><b>写法</b></p></td><td><p><b>含义</b></p></td><td><p><b>示例</b></p></td></tr> </thead> <tbody> <tr><td><p>不填或 "\*"</p></td><td><p>匹配所有</p></td><td><p>所有工具都会触发</p></td></tr> <tr><td><p>精确值</p></td><td><p>精确匹配</p></td><td><p>"Bash" 只在 Bash 工具时触发</p></td></tr> <tr><td><p>| 分隔</p></td><td><p>匹配多个值</p></td><td><p>"Write | Edit" 在 Write 或 Edit 时触发</p></td></tr> <tr><td><p>正则表达式</p></td><td><p>正则匹配</p></td><td><p>"mcp\_\_.\*" 匹配所有 MCP 工具</p></td></tr> </tbody> </table>
