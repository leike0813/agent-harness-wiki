official_url: "https://docs.qoder.cn/user-guide/hooks.md"
excerpt: |-
  Hook 脚本通过 stdin 接收 JSON 数据。所有事件都包含以下通用字段：

  | <b>字段</b>         | <b>说明</b>       |
  | ----------------- | --------------- |
  | session\_id       | 当前会话 ID         |
  | cwd               | 当前工作目录          |
  | hook\_event\_name | 触发的事件名称         |
  | transcript\_path  | 会话上下文 JSON 文件路径 |
