  kind: document_section
  heading: "添加自定义模型"
official_url: "https://docs.qoder.cn/user-guide/custom-model.md"
excerpt: |-
  1. <b>进入 Qoder CN 设置</b>点击 IDE 左上角 Qoder CN，选择首选项-> Qoder CN 设置，打开 Qoder CN 设置面板。
  2. <b>进入模型面板</b>在左侧导航栏中选择<b>模型</b>。模型管理页面显示已配置的自定义模型列表，每个模型卡片包含模型名称、标签及来源信息，并提供编辑、删除和启用/禁用开关。单击右上角 <b>+ 添加</b> 按钮可添加新的自定义模型。
  3. <b>添加模型</b>点击<b>添加</b>，选择服务商按需选择所需的模型，并填写您的 API 密钥。点击<b>获取 API 密钥</b>可跳转至对应服务商的密钥管理页面。
  4. <b>验证连接</b>点击<b>添加</b>，系统将自动验证连接状态。
  5. <b>使用模型</b>配置完成后，您可以在对话框中选择配置的模型开始使用。
