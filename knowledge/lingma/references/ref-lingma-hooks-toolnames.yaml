locator:
  kind: document_section
  heading: "工具名映射"
official_url: "https://docs.qoder.cn/user-guide/hooks.md"
excerpt: |-
  Qoder CN 支持两套工具名——原生工具名与兼容工具名。配置 Hook 时可使用任意一套，运行时会统一映射后执行匹配。例如 matcher: "Bash" 和 matcher: "run\_in\_terminal" 等价。
  | <b>原生名</b>                  | <b>兼容名</b> | <b>说明</b>   |
  | --------------------------- | ---------- | ----------- |
  | run\_in\_terminal           | Bash       | 执行 shell 命令 |
  | read\_file                  | Read       | 读取文件内容      |
  | create\_file                | Write      | 创建 / 写入文件   |
  | search\_replace             | Edit       | 编辑文件        |
  | delete\_file                | -          | 删除文件        |
  | grep\_code                  | Grep       | 搜索文件内容      |
  | search\_file                | Glob       | 文件名匹配       |
  | list\_dir                   | LS         | 列出目录        |
  | task                        | Task       | 启动子任务 / 子代理 |
