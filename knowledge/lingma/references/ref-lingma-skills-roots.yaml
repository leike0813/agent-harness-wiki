  heading: "创建技能（Skills）"
official_url: "https://docs.qoder.cn/user-guide/skills.md"
excerpt: |-
  提供了不同的创建技能（Skills）的方式：
  同名时，项目级 Skill 覆盖用户级 Skill。
  #### 方式1：手动创建
  手动将目标 Skill 文件拷贝到下述路径后，重启 IDE，即可在对话框内通过 / 查看已加载的 Skills 列表。
  | <b>位置</b> | <b>路径</b>                                | <b>作用域</b> |
  | --------- | ---------------------------------------- | ---------- |
  | 用户级       | \~/.lingma/skills/\{skill-name}/SKILL.md | 当前用户的所有项目  |
  | 项目级       | .lingma/skills/\{skill-name}/SKILL.md    | 仅当前项目      |
  #### 方式2：通过内置技能自动创建
  create-skill 是 Qoder 内置的技能创建助手。它通过交互式对话,引导你逐步创建符合规范的 SKILL.md 文件。<b>使用方式</b>:
  ```themes
  /create-skill <技能描述,例如:将 Word 文档转换为 PDF>
  ```
  如果你不熟悉 SKILL.md 文件的编写规范,建议优先使用 /create-skill 来生成初始模板,然后根据实际需求进行调整优化。
  <b>适用场景</b>: 快速创建自定义技能,无需了解技能文件的详细格式。
