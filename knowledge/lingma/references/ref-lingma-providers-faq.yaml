excerpt: |-
  ### 1. 使用自定义模型是否消耗 Qoder CN 额度？
  不消耗。自定义模型的费用由服务商 API 账户直接结算，不占用 Qoder CN 额度。
  ### 2. 如何获取 API 密钥？
  各服务商密钥获取地址：
  - <b>GLM</b>：[<b>open.bigmodel.cn</b>](https://open.bigmodel.cn/)
  - <b>Kimi</b>：[<b>platform.moonshot.cn</b>](https://platform.moonshot.cn/)
  - <b>MiniMax</b>：[<b>platform.minimaxi.com</b>](https://platform.minimaxi.com/)
  - <b>Bailian</b>：[<b>bailian.console.aliyun.com</b>](https://bailian.console.aliyun.com/)
  ### 3. 添加模型失败如何处理？
  请检查以下事项：
  1. API 密钥是否正确，无多余空格
  2. API 密钥是否已过期或被禁用
  3. 服务商账户余额是否充足
  4. 网络连接是否正常
  ### 4. 是否支持添加同一服务商的多个模型？
  支持。可为同一服务商添加不同版本的模型，或使用不同的 API 密钥。
