excerpt: |-
  ### 11. JetBrains 插件更新后，本地服务连不上或修复失败怎么办？

  1. 如果 IDE 提示重启以完成插件更新，请保存工作并重启当前 IDE。
  2. 重新打开项目后，如果 Qoder 仍然连不上，在插件工具窗口中打开 **问题上报 > 自助排查 > 一键修复本地服务**。
  3. 结束正在进行的 Qoder 任务，点击 **开始修复**。修复期间，共用该服务的其他 IDE 会暂时断开。
  4. 看到“本地服务已修复并启动”后，回到对话窗口，重新发送之前失败的问题。如果提示当前服务仍可用，也可以先继续工作，稍后再修复。
