  ## 项目指令文件（qoder.md）

  `qoder.md` 是插件级别的项目指令文件，定义 Agent 人设、工作流编排和护栏规则。当用户整体调起插件时，它作为核心 system prompt 注入，赋予 AI 统一的角色认知和任务编排能力。

  文件名为 `qoder.md`。
