  kind: document_section
  heading: "上传插件或技能"
official_url: "https://docs.qoder.cn/user-guide/extensions-management.md"
excerpt: |-
  管理员可以将企业自有的插件或技能上传到当前集合。上传内容的类型必须与集合的内容类型一致。
  插件：ZIP 根目录需要包含 `.qoder-plugin/` 目录。
  技能：ZIP 根目录需要包含 `SKILL.md` 文件。
  上传后，内容会出现在当前集合中。管理员可以继续配置分类、查看版本信息，或设置下发。
  将内容从集合中移出时，只会移除它与当前集合的关系，不会删除原始插件或技能包。