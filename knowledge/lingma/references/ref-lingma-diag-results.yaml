excerpt: |-
  以下内容适用于所有操作系统（Windows、macOS、Linux）。根据脚本生成的日志文件，您可以按照下表进行问题排查：
  <table style={{width:"100%",tableLayout:"fixed"}}> <thead> <tr><td><p><b>问题类型</b></p></td><td><p><b>问题项</b></p></td><td><p><b>解决方式</b></p></td></tr> </thead> <tbody> <tr><td><p>网络</p></td><td><p>检查代理设置</p></td><td><p>脚本会查询代理是否启用。通过查看"\[网络连接测试]"部分，确认是否符合预期。如果有代理，则需要在设置中给 Qoder CN 手动[配置网络代理](/user-guide/network-proxy-configuration)。</p></td></tr> <tr><td rowspan="5"><p>Qoder CN 服务状态</p></td><td><p>Qoder CN 进程存在性</p></td><td><p>脚本首先验证 Qoder CN 进程是否存在（Windows 为 Lingma.exe，macOS 和 Linux 为 lingma）。若报错，请检查安装路径是否正确，并尝试删除 .lingma 目录重启 IDE，重新生成 .lingma 目录。</p></td></tr> <tr><td><p>版本与启动测试</p></td><td><p>查看"\[Lingma 版本信息]"部分，确认 Qoder CN 版本信息并且可以连接到公网服务器。如果报 failed，请根据报错中的 URL 在设置中配置代理访问公网。</p></td></tr> <tr><td><p>进程启动但登录仍然没有反应</p></td><td
