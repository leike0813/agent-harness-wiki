  heading: "配置网络代理"
official_url: "https://docs.qoder.cn/user-guide/network-proxy-configuration.md"
excerpt: |-
  公司网络通常使用 HTTP 代理服务器在网络流量发送到目标位置之前进行拦截，以便检测可疑流量或者限制进入公司内网络的内容。如果你使用的公司网络，你可能需要将 Qoder CN 配置为通过网络代理进行连接。
  打开 Qoder CN 的设置，即可看到配置网络代理的入口，如下所述：
  在 VS Code 中，代理设置位于插件设置的 <b>Lingma: Http Proxy Settings</b>（选择 <b>manual</b>）和 <b>Lingma: Http Proxy Configuration URL</b> 输入框；在 JetBrains IDEs 中，代理设置位于插件设置的 <b>HTTP Proxy Settings</b> 区域，选择 <b>Manual proxy configuration</b> 后在 <b>Proxy Configuration URL</b> 输入框中填写代理地址。
  在个人设置中选择左侧导航栏的<b>高级</b>页签，即可在右侧<b>网络代理</b>区块中看到<b>网络代理设置</b>项，通过其右侧下拉框选择代理模式。
  - 使用系统全局配置：默认选择为自动获取使用电脑操作系统配置的全局环境变量中的网络代理；
  - 手动配置网络代理：选择手动配置后，可在输入框中输入需要配置的网络代理，目前支持 HTTP、HTTPS、Socks5 的网络协议，请确保填写完整的网络代理配置；
  - 无需网络代理：选择手动配置后，不填写网络代理 URL 即为不进行任何网络代理。
  <Warning>
    确保输入完整的网络代理 URL，如：`https://127.0.0.xxx:8080` 。
  </Warning>
