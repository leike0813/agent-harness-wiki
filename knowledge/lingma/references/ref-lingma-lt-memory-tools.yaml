excerpt: |-
  ## 记忆工具

  在智能体模式下，当您让 Qoder CN 记住某些内容，或需要保存重要上下文时，Qoder CN 会创建或更新记忆。可通过检索工具下的<b>检索记忆</b>工具查询已保存的记忆。

  ### 创建或更新记忆

  | 属性    | 值              |
  | ----- | -------------- |
  | 显示名称  | 创建或更新记忆        |
  | 工具 ID | update\_memory |

  存储工程相关的信息、偏好或上下文，Qoder CN 会在多个会话中记住。
