  ### 1. 环境变量或参数填写错误，导致工具执行失败
  | <ul><li><b>排查步骤：</b></li></ul>如果 MCP 工具调用出现异常或返回结果不符合预期，建议您首先展开工具调用详情，查看具体的错误信息，并据此进行分析与排查。部分 MCP 服务（如 Mastergo 和 Figma）的 API\_KEY 或 TOKEN 等关键认证信息包含在“参数（args）”中。<br />因此，在通过 MCP 广场安装后，仍需手动配置这些参数。 |   |
  | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | - |
  | <ul><li><b>解决方案：</b></li></ul><ol><li>进入<b>我的服务</b>页面。</li><li>找到对应 MCP 服务，单击<b>编辑。</b></li><li>在服务配置中，查看<b>参数（args）</b>部分。</li><li>替换其中需要更新或填写的变量内容，确保其准确无误，重新连接服务后再尝试调用。</li></ol>                |   |
