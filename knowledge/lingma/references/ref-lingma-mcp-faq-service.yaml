excerpt: |-
  ### 1. 缺少 npx 命令所需环境
  - <b>异常信息：failed to start command: exec: "npx": executable file not found in \$PATH</b>
  - <b>解决方案：</b>下载并安装 Node.js。
  <Warning>
    <b>Node.js 版本须在 v18 及以上，npm 版本须在 v8 及以上。版本过低可能导致工具调用失败</b>
  </Warning>
  - 您可以访问 [Node.js 官网](https://nodejs.org/)，下载并安装 Node.js 18 或更高版本，也可以选择通过以下方式完成：
    安装验证步骤
    <Tabs>
      <Tab title="Windows 系统">
        1.下载并安装，使用 [nvm-windows](https://github.com/coreybutler/nvm-windows) 管理多版本：
        ```powershell
        nvm install 22.14.0  # 安装指定版本
        nvm use 22.14.0
        ```
        2.安装完成后，在终端中运行以下命令确认是否安装成功。
        ```
        node -v
        npx -v
        ```
        3.安装成功后，终端将显示已安装的 Node.js 版本号。
      </Tab>
      <Tab title="Mac 系统">
        下载并安装，使用 brew 安装（需先[安装 brew](https://mac.install.guide/homebrew/3)）。
        ```bash
        # 1. 更新并安装brew
        brew update
