  heading: "规则设置和使用"
official_url: "https://docs.qoder.cn/user-guide/rules.md"
excerpt: |-
  在不同的IDE中，其配置界面的入口和操作方式略有差异。下面为您分别介绍如何在VS Code、JetBrains、Visual Studio和 Qoder CN IDE中设置和使用项目专属规则。
  <Note>
    当规则和记忆存在冲突时，将优先遵循规则执行。
  </Note>
  ### 设置规则
  <Tabs>
    <Tab title="Qoder CN IDE">
      1. 在 Qoder CN IDE 的右上角，单击用户图标<img src="https://help-static-aliyun-doc.aliyuncs.com/assets/img/zh-CN/0456958571/p1005348.png" className="!inline !align-text-bottom" style={{height:"1.4em",display:"inline",verticalAlign:"text-bottom",margin:"0 2px"}} />或使用键盘快捷键（⌘ ⇧ ,（macOS）或Ctrl shift ,（Windows）），然后选择<b>个人设置</b>。
      2. 在左侧导航栏中，单击<b>规则</b>。
      3. 单击<b>“添加”</b>。
      4. 在顶部的搜索栏中，输入唯一的规则名称，然后按<b>Enter</b>。
      5. 选择规则类型：
      - <b>手动引入：</b>仅通过@rule手动引入才生效。
      - <b>模型决策</b>：输入期望规则生效的场景描述。
      - <b>指定文件生效</b>：提供以逗号分隔的文件路径通配符。例如 *.md、 src/*.java。
      - <b>始终生效：</b>在智能会话与行间会话的所有请求中均生效。
      6. 关闭窗口以保存更改。
    </Tab>
