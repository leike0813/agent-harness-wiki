  heading: "支持的事件"
official_url: "https://docs.qoder.cn/user-guide/hooks.md"
excerpt: |-
  当前通义 Qoder CN IDE 支持以下五种 Hook 事件：
  | <b>事件名称</b>        | <b>触发时机</b>             | <b>可阻断</b> |
  | ------------------ | ----------------------- | ---------- |
  | UserPromptSubmit   | 用户提交 Prompt 后、Agent 处理前 | 是          |
  | PreToolUse         | 工具调用执行前                 | 是          |
  | PostToolUse        | 工具调用成功后                 | 否          |
  | PostToolUseFailure | 工具调用失败后                 | 否          |
  | Stop               | Agent 完成响应时             | 否          |
