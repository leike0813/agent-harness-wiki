  heading: "专属市场"
official_url: "https://docs.qoder.cn/user-guide/extensions-management.md"
excerpt: |-
  专属市场以集合为单位进行管理。集合可以适用于 Qoder CN、QoderWork CN，或同时适用于两者。
  对接专属市场时，目前仅 QoderWork CN 支持在客户端市场中展示；Qoder CN 和 QoderWork CN 都支持管理员下发。当前专属市场支持 QoderWork CN 的技能市场和专家套件市场，其中专家套件市场展示的是插件内容。
  集合的内容类型决定它在 QoderWork CN 中进入哪个市场：技能进入技能市场，插件进入专家套件市场。
  上传内容的类型必须与集合的内容类型一致：插件 ZIP 根目录需要包含 `.qoder-plugin/` 目录，技能 ZIP 根目录需要包含 `SKILL.md` 文件。