  heading: Importing Claude Code Skills
official_url: "https://forgecode.dev/docs/skills/"
excerpt: |-
  Skills are fully compatible with Claude Code. The SKILL.md format is identical — no conversion needed.
  If you already have skills in a Claude Code project, copy them straight into ForgeCode:
  cp -r .claude/skills .forge/skills
  They work without any changes.
