excerpt: |-
  ForgeCode looks in two places:
  LocationScopeUse when
  ~/forge/agents/Global — all projectsGeneral-purpose agents you'll reuse everywhere
  .forge/agents/Project — current repo onlyAgents specific to one codebase or team
  Project agents take priority. If both locations have an agent with the same id, the project one wins.
