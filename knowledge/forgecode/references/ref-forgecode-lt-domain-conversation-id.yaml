excerpt: "#[derive(Debug, Default, Display, Serialize, Deserialize, Clone, PartialEq, Eq, Hash)]\n#[serde(transparent)]\npub struct ConversationId(Uuid);\n\nimpl Copy for ConversationId {}\n\nimpl ConversationId {\n    pub fn generate() -> Self {\n        Self(Uuid::new_v4())\n    }\n\n    pub fn into_string(&self) -> String {\n        self.0.to_string()\n    }\n\n    pub fn parse(value: impl ToString) -> Result<Self> {\n        Ok(Self(\n            Uuid::parse_str(&value.to_string()).map_err(Error::ConversationId)?,\n        ))\n    }\n}"
