excerpt: "    pub fn related_conversation_ids(&self) -> Vec<ConversationId> {\n        self.context\n            .as_ref()\n            .map(|ctx| {\n                ctx.messages\n                    .iter()\n                    .filter_map(|msg| msg.as_tool_result())\n                    .flat_map(|result| &result.output.values)\n                    .filter_map(|value| {\n                        if let crate::ToolValue::AI { conversation_id, .. } = value {\n                            Some(conversation_id)\n                        } else {\n                            None\n                        }\n                    })\n                    .copied()\n                    .collect()\n            })\n            .unwrap_or_default()\n    }"
