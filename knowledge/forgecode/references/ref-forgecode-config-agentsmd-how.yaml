  heading: How It Works
official_url: "https://forgecode.dev/docs/custom-rules/"
excerpt: |-
  When you start an AI agent session:
  - Loading: The system searches for AGENTS.md files in three locations in order of priority:
  - Base path (~/forge) - highest priority
  - Git root directory (if available) - medium priority
  - Current working directory (pwd) - lowest priority
  - Injection: All guidelines from the found file become part of the AI's system prompt
  - Application: AI applies all guidelines to every response in the session
