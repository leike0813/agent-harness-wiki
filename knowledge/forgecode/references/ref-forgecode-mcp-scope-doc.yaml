locator:
  kind: document_section
  heading: Scope and precedence
official_url: "https://forgecode.dev/docs/mcp-integration/"
excerpt: |-
  MCP configuration can exist in two places:
  - Local scope: .mcp.json in the current project
  - User scope: global ForgeCode config directory
  Local scope wins over user scope when both define the same server.
  Note
  Find your resolved configuration path by running /info in ForgeCode Shell.
