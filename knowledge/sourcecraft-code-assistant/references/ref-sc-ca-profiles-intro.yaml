  _Model configuration profiles_ allow you to create and switch between different Code Assistant sets of settings.
  {% note warning %}
  The `default` configuration profile includes a powerful coding model by Yandex. Its use is limited by the [service plan](https://sourcecraft.dev/portal/docs/en/sourcecraft/pricing.md#ca-plans) you select.
  {% endnote %}
  Having multiple configuration profiles allows you to quickly switch between different AI providers, models, and settings without having to reconfigure each time you want to modify your setup.
