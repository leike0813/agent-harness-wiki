  heading: Using .codeassistantignore to manage file access in SourceCraft Code Assistant
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/codeassistantignore.md"
excerpt: "Code Assistant continuously monitors `.codeassistantignore`. Any changes you make are uploaded automatically, ensuring Code Assistant always uses the most up-to-date rules. The `.codeassistantignore` file itself is always ignored by default, which prevents Code Assistant from changing its own access rules."