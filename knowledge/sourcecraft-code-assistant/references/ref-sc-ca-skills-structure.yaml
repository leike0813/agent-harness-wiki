official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/skills.md"
excerpt: |-
  ```text
  ~/.codeassistant/skills/          # Global skills (high priority)
  ├── pdf-processing/
  │   ├── SKILL.md                  # Required file
  │   ├── extract.py                # Optional: auxiliary scripts
  │   └── templates/                # Optional: related files
  │       └── output-template.md
  └── api-docs-generator/
      └── SKILL.md
  ~/.agents/skills/                 # Global cross-agent skills
  └── shared-workflow/
      └── SKILL.md
  .codeassistant/skills/            # Project skills (override global ones)
  └── custom-pdf-workflow/
      └── SKILL.md
  .agents/skills/                   # Cross-agent project skills
  └── team-shared-skill/
      └── SKILL.md
  ```
