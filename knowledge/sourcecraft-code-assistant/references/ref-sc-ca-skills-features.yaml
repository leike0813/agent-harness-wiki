excerpt: |-
  #|
  || **Feature** | **Description** ||
  || Task-specific expertise | Create detailed instructions for specialized workflows, including data processing, documentation generation, code migration patterns, etc. ||
  || Related resources | Helpful scripts, templates, or reference files stored together with the instructions. ||
  || [Mode](https://sourcecraft.dev/portal/docs/en/code-assistant/operations/chat-prompts.md) dependencies | Configure a skill to only trigger in certain modes, e.g., to perform code refactoring only in `Code` mode. ||
  || Team use | Store skills in the `.codeassistant/skills/` project directory to implement consistent team workflows. ||
  || Personal library | Store skills in a global library in `~/.codeassistant/skills/` to make them available in all projects. ||
