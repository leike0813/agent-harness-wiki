  heading: "Network timeout {#network-timeout}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/mcp/using-mcp-in-ca.md"
excerpt: |-
  To set the maximum time to wait for a response after invoking a tool on an MCP server:
  1. Expand the drop-down list ![image](../../../../_assets/console-icons/chevron-right.svg) next to the MCP server.
  1. Set the time in the **Network Timeout** field. The default value is 60 seconds, but you can set a value between 30 and 300 seconds.
