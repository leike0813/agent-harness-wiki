  heading: "Switching between profiles {#switch-profiles}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/api-configuration-profiles.md"
excerpt: |-
  You can switch between profiles in the following ways:
  * In the Code Assistant settings:
    1. In the chat's top panel, click ![image](../../../_assets/console-icons/gear.svg) **Settings**.
    1. Under **Profile**, select the required profile.
  * In the chat's bottom menu, open the drop-down list of model configuration profiles ![image](../../../_assets/console-icons/chevron-up.svg) and select the profile.
