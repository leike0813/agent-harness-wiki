  heading: "Creating a profile {#create-profile}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/api-configuration-profiles.md"
excerpt: |-
  1. In the chat's top panel, click ![image](../../../_assets/console-icons/gear.svg) **Settings**.
  1. Click ![image](../../../_assets/console-icons/plus.svg) next to the **Profile** selector.
  1. Enter a name for the new profile and click **Create Profile**.
  1. Configure the profile settings:
      * Select an **API Provider**.
      * Enter the **API Key**.
        {% note info %}
        API keys are securely stored in VSCode Secret Storage and are never exposed in plain text.
        {% endnote %}
      * Select a **Model**.
      * Set the **Rate limit** for this profile. The default value is 0 (disabled), which is suitable for most users. If needed, you can set a minimum time (in seconds) between API requests for a specific profile to manage costs or avoid provider limits.
