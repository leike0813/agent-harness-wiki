  heading: "Override priority {#override-priority}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/skills.md"
excerpt: |-
  If skills with identical names are located in multiple directories, the precedence is, from highest to lowest priority, as follows. `.codeassistant/` paths always take precedence over `.agents/` paths at the same project level:
  1. Mode-specific skills for the `.codeassistant` project, e.g., `.codeassistant/skills-code/my-skill/`, highest priority.
  1. General `.codeassistant` project skills, e.g., `.codeassistant/skills/my-skill/`.
  1. Mode-specific skills for the `.agents` project, e.g., `.agents/skills-code/my-skill/`.
  1. General `.agents` project skills, e.g., `.agents/skills/my-skill/`.
  1. Mode-specific global `.codeassistant` skills, e.g., `~/.codeassistant/skills-code/my-skill/`.
  1. General global `.codeassistant` skills, e.g., `~/.codeassistant/skills/my-skill/`.
  1.
