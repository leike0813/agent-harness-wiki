  heading: "Log out of the SourceCraft profile {#logout}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/index.md"
excerpt: |-
  To log out of your SourceCraft profile in the Code Assistant plugin:
  {% list tabs group=ide %}
  - Visual Studio Code {#vscode}
    In Visual Studio Code, there are two ways to log out of your profile:
    * In the editor’s bottom panel, click ![image](../_assets/code-assistant/vsc-icon-small.svg) and select **Logout** from the list that opens.
    * In the top search bar, enter `>SourceCraft Code Assistant`. From the list that appears, select **SourceCraft Code Assistant: Logout**.
  - JetBrains IDE {#jb}
    In the top right corner of the editor, click ![magnifier](../_assets/console-icons/magnifier.svg), enter `SourceCraft Code Assistant` in the window that opens, and select **SourceCraft Code Assistant: Logout**.
    ![image](../_assets/code-assistant/jb-logout-screen.png)
  {% endlist %}
