official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/checkpoints.md"
excerpt: |-
  You can see checkpoints directly in the chat history:
  * The task's first checkpoint (![image](../../../_assets/console-icons/code-commit.svg) **Initial Checkpoint**) captures the initial state of your project.
  * Before modifying files, the system creates current checkpoints (![image](../../../_assets/console-icons/code-commit.svg) **Checkpoint**), allowing you to roll back easily.

  Each checkpoint allows you to [view](#viewing-differences) the differences between the current project state and the previous checkpoint, and [restore](#restoring-checkpoints) the project to that earlier state.