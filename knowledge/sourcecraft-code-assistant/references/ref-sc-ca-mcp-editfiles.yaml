excerpt: |-
  You can edit both global and project-specific MCP configuration files directly from the MCP settings menu in Code Assistant:
  1. Click ![image](../../../../_assets/console-icons/ellipsis.svg) in the chat's top panel and select MCP servers.
  1. Select the appropriate option:
      * ![image](../../../../_assets/console-icons/pencil.svg) **Edit Global MCP**: Opens the global file named `mcp_settings.json`.
      * ![image](../../../../_assets/console-icons/pencil.svg) **Edit Project MCP**: Opens the project file named `.codeassistant/mcp.json`. If there is no such file, Code Assistant will create it automatically.
      Both files use JSON format with an `mcpServers` object containing named server configurations:
