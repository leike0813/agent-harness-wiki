official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/mcp/using-mcp-in-ca.md"
excerpt: |-
  [Auto-approval](https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/auto-approving-actions.md) of MCP tools works for each tool individually and is disabled by default. To set up auto-approval:
  1. On the ![image](../../../../_assets/console-icons/check-double.svg) **Auto-approve** panel, enable ![image](../../../../_assets/console-icons/toggle-on.svg) MCP.
  1. Expand the required MCP server and select the **Auto-Run** option for specific tools.
  Once enabled, Code Assistant will automatically approve the use of this tool without asking.
  {% note info %}
  The global **MCP** setting in the ![image](../../../../_assets/console-icons/check-double.svg) **Auto-approve** panel takes precedence: if it is disabled, no MCP tools will be automatically approved.
  {% endnote %}
