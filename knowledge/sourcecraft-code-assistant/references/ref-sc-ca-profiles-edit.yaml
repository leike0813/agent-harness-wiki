  heading: "Editing and deleting profiles {#edit-profiles}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/api-configuration-profiles.md"
excerpt: |-
  1. In the chat's top panel, click ![image](../../../_assets/console-icons/gear.svg) **Settings**.
  1. Under **Profile**, select the required profile.
  1. Edit your profile settings.
      To delete a profile, click ![image](../../../_assets/console-icons/trash-bin.svg) next to it.
      To rename a profile, click ![image](../../../_assets/console-icons/pencil.svg) next to it.
      {% note info %}
      You cannot delete a single profile.
      {% endnote %}
