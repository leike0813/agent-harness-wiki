excerpt: |-
  Code Assistant automatically detects skills in the following situations:
  * At startup: It indexes all skills by reading and parsing each `SKILL.md` file.
  * During development: It regularly scans `SKILL.md` files for changes.
  * When filtering by mode: Only skills relevant to the current mode remain available.
  You do not need to register or configure skills: simply create a [directory structure](#directory-structure).
