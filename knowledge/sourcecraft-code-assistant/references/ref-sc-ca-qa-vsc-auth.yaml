excerpt: |-
  Error message:
  ```text
  crypto is not defined
  ```
  This is an error returned by the internal IDE library used for authentication in SourceCraft. To resolve this error, [upgrade](https://code.visualstudio.com/docs/setup/setup-overview#_update-cadence) your Visual Studio Code version.
  {% cut "Below is an example of a Visual Studio Code build with the plugin support." %}
  ```text
  Version: 1.92.2 (system setup)
  Commit: fee1edb8d6d72a0ddff41e5f71a671c23ed924b9
  Date: 2024-08-14T17:29:30.058Z
  Electron: 30.1.2
  ElectronBuildId: 9870757
  Chromium: 124.0.6367.243
  Node.js: 20.14.0
  V8: 12.4.254.20-electron.0
  OS: Windows_NT x64 10.0.19045
  ```
  {% endcut %}
  See also [How to find out your IDE version](https://code.visualstudio.com/docs/setup/setup-overview#_how-do-i-know-which-version-im-running).
