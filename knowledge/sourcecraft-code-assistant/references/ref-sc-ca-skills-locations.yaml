  heading: "Select the location {#step-1}"
official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/skills.md"
excerpt: |-
  Here are the possible types of skills:
  * Global: Available in all projects.
  * Project skills: Workspace-specific skills.
  {% list tabs %}
  - Global skills
    ```bash
    # Linux/macOS: Specific for Code Assistant (high priority).
    ~/.codeassistant/skills/<skill_name>/SKILL.md
    # Linux/macOS: Cross-agent (shared with other agentic tools).
    ~/.agents/skills/<skill_name>/SKILL.md
    # Windows
    %USERPROFILE%\.codeassistant\skills\<skill_name>\SKILL.md
    %USERPROFILE%\.agents\skills\<skill_name>\SKILL.md
    ```
  - Project skills
    ```bash
    # Specific for Code Assistant (high priority).
    <project_root>/.codeassistant/skills/<skill_name>/SKILL.md
    # Cross-agent (shared with other agentic tools).
    <project_root>/.agents/skills/<skill_name>/SKILL.md
    ```
  {% endlist %}
