excerpt: |-
  1. Click the **Auto-approve** panel in the chat ![image](../../../_assets/console-icons/wrench.svg) toolbar.
  1. Select which actions Code Assistant can perform without requesting permission.
  1. Use the ![image](../../../_assets/console-icons/check.svg) toggle to the left of **Auto-approve** to quickly enable or disable permissions.
  ### API request limit {#api-request-limit}
  In the ![image](../../../_assets/console-icons/check-double.svg) **Auto-approve** settings, use the **Max Requests** input field to set the maximum number of API requests Code Assistant can execute automatically.
  This helps prevent excessive API usage and unforeseen costs, e.g., when using high-priced models, testing new workflows, or running Code Assistant autonomously for extended periods.
