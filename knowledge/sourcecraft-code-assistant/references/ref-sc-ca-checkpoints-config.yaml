excerpt: |-
  To enable checkpoints:
  1. In the chat's top panel, click ![image](../../../_assets/console-icons/gear.svg) **Settings**.
  1. On the left-hand panel, navigate to ![image](../../../_assets/console-icons/code-trunk.svg) **Checkpoints**.
  1. Select **Enable automatic checkpoints**.
