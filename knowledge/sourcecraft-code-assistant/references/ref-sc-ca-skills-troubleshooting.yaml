  #### Code Assistant fails to use the skill even when the request matches the description {#skill-not-loading}
  1. The `name` metadata field must exactly match the directory name:
     ```markdown
     # Incorrect: the directory name is `pdf-processing`
     ---
     name: pdf_processing
     ---
     # Correct
     ---
     name: pdf-processing
     ---
     ```
  1. The `name` and `description` metadata fields are required.
