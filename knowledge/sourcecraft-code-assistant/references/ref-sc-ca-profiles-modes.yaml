excerpt: |-
  In the chat's top panel, click ![image](../../../_assets/console-icons/ellipsis.svg) and select **Modes**. You can explicitly link a specific configuration profile with a specific [mode](https://sourcecraft.dev/portal/docs/en/code-assistant/operations/chat-prompts.md). This system also automatically memorizes which profile you last used with each mode, streamlining your workflow.
