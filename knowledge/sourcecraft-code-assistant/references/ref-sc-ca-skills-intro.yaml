  {% note tip %}
  This page is about skills in the Code Assistant plugin. To learn about skills in the SourceCraft interface, see [AI skills in SourceCraft](https://sourcecraft.dev/portal/docs/en/sourcecraft/concepts/ai-skills.md).
  {% endnote %}
  <!-- source: en/_includes/code-assistant/only-in-vscode.md -->
  {% note warning %}
  This feature is only available in Visual Studio Code.
  {% endnote %}
  <!-- endsource: en/_includes/code-assistant/only-in-vscode.md -->
  _Skills_ are task-specific instructions that Code Assistant loads only when your request matches the skill's purpose. Unlike [custom rules](https://sourcecraft.dev/portal/docs/en/code-assistant/operations/chat-rules.md), which apply to all requests, skills activate only when relevant.
