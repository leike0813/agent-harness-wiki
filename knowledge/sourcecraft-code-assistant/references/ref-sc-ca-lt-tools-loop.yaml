official_url: "https://sourcecraft.dev/portal/docs/en/code-assistant/operations/agent/how-tools-work.md"
excerpt: |-
  In the chat interface, describe what you would like to do in natural language. Code Assistant will then:
  1. Select the most appropriate tool based on your prompt.
  1. Suggest the tool and its parameters for your approval.
  1. Apply the approved tool and show you the results.
  1. Repeat this process until your task is complete.