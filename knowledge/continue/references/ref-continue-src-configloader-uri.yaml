  function getUriFromSource(source: ConfigSource): string | null {
    switch (source.type) {
      case "cli-flag":
        return isFilePath(source.path)
          ? `file://${source.path}`
          : `slug://${source.path}`;
      case "saved-uri":
        return source.uri;
      case "local-config-yaml":
        return `file://${path.join(env.continueHome, "config.yaml")}`;
      default:
        return null;
    }
  }
