  heading: "Legacy Configuration Methods (Deprecated)"
official_url: "https://github.com/continuedev/continue"
excerpt: |-
  <Info>
    View the `config.json` migration guide [here](/reference/yaml-migration)
  </Info>
  - [`config.json`](/reference) - The original configuration format which is stored in a file at the same location as `config.yaml`
  - `.continuerc.json` - Workspace-level configuration
  - `config.ts` - Advanced configuration (probably unnecessary) - a TypeScript file in your home directory that can be used to programmatically modify (_merged_) the `config.json` schema:
    - `~/.continue/config.ts` (MacOS / Linux)
    - `%USERPROFILE%\.continue\config.ts` (Windows)
  ### How to Use `.continuerc.json` for Workspace Configuration
  The format of `.continuerc.json` is the same as `config.json`, plus one _additional_ property `mergeBehavior`, which can be set to either "merge" or "overwrite".
