excerpt: |2-
  *   **Hooks**: `~/.gemini/config/hooks.json` for all workspaces, or `<workspace>/.agents/hooks.json` for one workspace. `/hooks` adds, edits, and turns hooks on or off, and saves new hooks to the global file. Hooks don’t go in `settings.json`: the CLI keeps a `hooks` key there but never loads it.
