  heading: "CLI skill locations"
official_url: https://antigravity.google/docs/skills.md
excerpt: |-
  The Antigravity CLI features full support for local and global agent skills:

  | Location | Scope |
  | --- | --- |
  | `<workspace-root>/.agents/skills/<skill-folder>/` | Workspace-specific |
  | `~/.gemini/config/skills/<skill-folder>/` | Global (all workspaces, shared with the Antigravity App) |
  | `~/.gemini/config/plugins/<plugin-folder>/skills/` | Plugin-provided skills |

  Antigravity also reads `.agents/skills/` in each parent folder up to the repository root. The Antigravity CLI also loads skills from `~/.gemini/antigravity-cli/skills/` and `~/.gemini/skills/`, which the Antigravity App doesn’t read.
