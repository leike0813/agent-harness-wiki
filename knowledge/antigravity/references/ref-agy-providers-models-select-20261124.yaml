official_url: https://antigravity.google/docs/models.md
excerpt: |-
  You can select which reasoning model you want to use from the model selector menu under the conversation prompt box:

  Most adjustable Gemini models offer `Low`, `Medium` (default), and `High` thinking levels. **Gemini 4 Neon** and **Gemini 4 Hydrogen** add a fourth level labeled **`Extra`** in the model selector, which sets the **Extra High** reasoning budget (`xhigh` in the [Antigravity CLI](/docs/cli/commands/effort), such as `--model gemini-4-neon-xhigh` or `--effort xhigh`) when a task needs maximum reasoning depth.
