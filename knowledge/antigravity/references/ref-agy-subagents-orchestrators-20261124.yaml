  heading: "Multi-agent orchestrators"
official_url: https://antigravity.google/docs/subagents.md
excerpt: |-
  When a task calls for structured coordination beyond single-task subagent delegation, Antigravity provides three multi-agent orchestrators:

  *   **Boost (`/boost`)**: Best when the problem is **hard rather than broad** (tough bugs, race conditions, algorithms). Runs an iterative pipeline where workers implement, challenge, fix, and re-verify solutions.
  *   **Swarm (`/swarm`)**: Best when the task is **broad and divides cleanly** across independent files, packages, or investigation tracks. Splits work across named workers and a verifier on a shared live message board.
