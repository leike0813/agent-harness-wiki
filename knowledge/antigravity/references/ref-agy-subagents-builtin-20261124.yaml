  heading: "Built-in subagents"
official_url: https://antigravity.google/docs/subagents.md
excerpt: |-
  Antigravity comes pre-packaged with several specialized subagents out of the box:

  *   **`research`**: Optimized for codebase research, file navigation, and structural exploration.
  *   **`browser`**: Opens and interacts with web pages for UI playtesting, visual screenshots, and console or network inspection. On personal Google Accounts in the Antigravity App (`v2.30.0+`), the main agent can launch single or parallel `browser` subagents automatically in the built-in browser, or you can invoke `/browser` directly; in the Antigravity CLI and on business or enterprise accounts, invoke `/browser` to connect to Google Chrome.
  *   **`self`**: A direct clone of the calling agent, sharing identical system instructions and toolsets.
