excerpt: |-
  The `/migrate-workflows` command is available only in the Antigravity App 2.12.0 and later, not in the Antigravity CLI or the Antigravity IDE. To migrate without the Antigravity App, follow the manual migration guide.

  1.  Open the Antigravity App 2.12.0 or later.
  2.  Run the migration command:

      ```prompt
      /migrate-workflows
      ```

  3.  The agent performs the following actions:
      *   Scans both global (`~/.gemini/config/global_workflows/` and `~/.gemini/config/workflows/`) and workspace-level (`.agents/workflows/`) directories.
      *   Scaffolds `~/.gemini/config/skills/<name>/SKILL.md` (for global workflows) or `.agents/skills/<name>/SKILL.md` (for workspace workflows) with compliant metadata.
