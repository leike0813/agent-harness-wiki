  heading: "`customModelsConfig` and `gcp`"
official_url: https://antigravity.google/docs/settings.md
excerpt: |-
  *   **`customModelsConfig`**: Adds models to `/model` when you use a [Gemini API key](/docs/install#using-a-gemini-api-key). The CLI reads it only when `modelProvider` is `"gemini"` and `GEMINI_API_KEY` is set, and ignores it when you sign in with a Google Account. Each entry under `customModels` needs a `modelName` in the form `gemini-api://<base_url>/models/<model>`, and can set a `label` for `/model`.
  *   **`gcp`**: Saved by the **Use a Google Cloud project** sign-in option: `project` is the project ID, and `location` is `global`, `us`, or `eu`. The CLI uses them to fill in the next sign-in, so you don’t need to edit them.
