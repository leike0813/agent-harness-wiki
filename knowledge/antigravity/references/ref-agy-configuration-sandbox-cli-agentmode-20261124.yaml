excerpt: |2-
  *   **`agentMode`** (string, default: `"auto"` where available in `v1.5.7+`, otherwise `""` for `default` mode): Setting `"agentMode": "auto"` enables the terminal sandbox automatically so commands run inside the sandbox by default, and automatically evaluates commands that need to run outside the sandbox so safe, reversible commands run without prompting while risky or irreversible commands pause for approval.
