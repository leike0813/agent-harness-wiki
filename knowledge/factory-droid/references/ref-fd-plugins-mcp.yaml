  heading: MCP servers
official_url: "https://docs.factory.com/harness/plugins.md"
excerpt: |-
  Plugin MCP servers use `mcp.json` at the plugin root:
  ```json
  {
    "mcpServers": {
      "my-api": {
        "command": "npx",
        "args": ["-y", "@example/mcp-server"],
        "env": {
          "API_KEY": "${MY_API_KEY}"
        }
      }
    }
  }
  ```
