  heading: Dynamic credentials with apiKeyHelper
official_url: "https://docs.factory.com/model-independence/byok.md"
excerpt: |-
  When you add or change a custom model in **org-managed settings**, it cannot use a static `apiKey`. Use an environment variable reference such as `${PROVIDER_API_KEY}`, `apiKeyHelper`, a keyless endpoint, or a Bedrock model instead. Existing static-key models keep working while unchanged. To change one, including rotating its key, replace the static key with one of these options.
