official_url: "https://docs.factory.com/harness/hooks.md"
excerpt: |-
  Standalone `hooks.json` files are keyed directly by event name. Each event contains matcher groups, and each group contains one or more shell commands.
  ```json title="~/.factory/hooks.json"
  {
    "PreToolUse": [
      {
        "matcher": "Execute",
        "commandRegex": "^git ",
        "hooks": [
          {
            "type": "command",
            "command": "/usr/local/bin/audit-git-command.sh",
            "timeout": 30
          }
        ]
      }
    ]
  }
  ```
  When you declare hooks inside `settings.json` instead, wrap the same event map in a
  top-level `hooks` key:
  ```json title="~/.factory/settings.json"
  {
    "hooks": {
      "PreToolUse": [
        {
          "matcher": "Execute",
          "commandRegex": "^git ",
          "hooks": [
            {
              "type": "command",
