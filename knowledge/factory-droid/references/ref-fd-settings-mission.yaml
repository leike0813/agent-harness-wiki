excerpt: |-
  Configure [Missions](/missions/overview), multi-agent orchestration runs.
  The six mission model and reasoning fields can also be set as organization defaults in [Enterprise Controls](/enterprise/hierarchical-settings-and-org-control#mission-defaults). They resolve independently with [session-default precedence](/enterprise/hierarchical-settings-and-org-control#how-precedence-works-hard-controls-vs-session-defaults), so more-local settings can override org defaults within the organization's model policy. The `skipScrutiny` and `skipUserTesting` toggles remain user-managed and are not accepted in org-managed settings.
  <PropertyList>
    <Property name='missionModelSettings.workerModel' type='string' defaultValue='Inherits'>
      Default model used by mission worker subagents. Accepts any
