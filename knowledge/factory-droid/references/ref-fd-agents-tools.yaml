locator:
  kind: document_section
  heading: Tool categories
official_url: "https://docs.factory.com/harness/subagents.md"
excerpt: |-
  Use a category name as the `tools` value (for example `tools: read-only`) or list individual tool IDs in an array.
  | Category | Tool IDs | Purpose |
  | :------- | :------- | :------ |
  | `read-only` | `Read`, `LS`, `Grep`, `Glob` | Analysis and file exploration |
  | `edit` | `Create`, `Edit`, `ApplyPatch` | Code generation and modification |
  | `execute` | `Execute` | Shell command execution |
  | `web` | `WebSearch`, `FetchUrl` | Internet research and content |
  | `mcp` | Dynamically populated | Model Context Protocol tools |
  Arrays must use valid IDs from this table or exact registered MCP tool IDs. Unknown IDs cause a validation error.
  <Note>
    When `Edit` is enabled with an OpenAI model, `ApplyPatch` is added automatically for compatibility.
