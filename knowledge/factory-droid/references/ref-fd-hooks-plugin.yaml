  heading: Plugin hooks
official_url: "https://docs.factory.com/harness/hooks.md"
excerpt: |-
  Installed plugins can provide hooks. Droid loads hooks from `hooks/hooks.json` in the plugin root and merges them with user, project, and managed hooks when the plugin is enabled.
  ```text
  my-plugin/
  ├── .factory-plugin/
  │   └── plugin.json
  ├── hooks/
  │   ├── hooks.json
  │   └── format.sh
  └── ...
  ```
  ```json
  {
    "PostToolUse": [
      {
        "matcher": "Create|Edit|ApplyPatch",
        "hooks": [
          {
            "type": "command",
            "command": "${DROID_PLUGIN_ROOT}/hooks/format.sh",
            "timeout": 30
          }
        ]
      }
    ]
  }
  ```
  Plugin hook commands may use `${DROID_PLUGIN_ROOT}`, `$DROID_PLUGIN_ROOT`, `${CLAUDE_PLUGIN_ROOT}`, or `$CLAUDE_PLUGIN_ROOT`. Droid expands those variables to the installed plugin cache path when loading plugin hooks.
