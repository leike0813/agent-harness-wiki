excerpt: |-
  <ResponseField name="customModels" type="object[]">
    Org-provisioned custom model definitions. Entries accept every field in [Supported fields](/model-independence/byok#supported-fields), including `apiKeyHelper`, `reasoningEffort`, `baseModelId`, and `useInRouter`; the most common are listed below.
    <ResponseField name="id" type="string">
      Unique identifier for this custom model entry. If supplied, use the `custom:` prefix (e.g. `custom:my-internal-model-v1`).
    </ResponseField>
    <ResponseField name="baseUrl" type="string">
      Base URL of the model API endpoint. Required unless the model has a `bedrock` block.
    </ResponseField>
    <ResponseField name="displayName" type="string">
      Human-readable name shown in the model picker.
    </ResponseField>
