  heading: If org policy can't be loaded
official_url: "https://docs.factory.com/enterprise/internal-plugin-marketplaces.md"
excerpt: |-
  Droid applies org plugin policy only after it loads org settings, from Factory or from a [system-managed settings file](/enterprise/hierarchical-settings-and-org-control#system-managed-settings-file). Until a load succeeds, adding or updating marketplaces and installing or updating plugins fails with `Unable to resolve plugin settings; no changes were made.`, and automatic plugin sync waits. A copy of org settings saved on the machine doesn't count. Plugins that are already installed keep loading.
