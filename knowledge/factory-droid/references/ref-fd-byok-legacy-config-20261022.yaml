excerpt: |-
  **Legacy `config.json`**: When Droid starts, it copies custom models from `~/.factory/config.json` (snake_case fields such as `custom_models` and `base_url`) into `settings.json` and leaves `config.json` unchanged. Make later changes in `settings.json`; Droid ignores edits to models it has already copied.
