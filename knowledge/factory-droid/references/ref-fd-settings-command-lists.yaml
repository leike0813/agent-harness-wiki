  <Note>
    These settings are **deprecated, not removed**. Existing lists remain respected for
    backward compatibility; immediate migration is not required. Use `permissionRules`
    for new policies. Review [coexistence and migration](/autonomy-and-safety/permission-rules#migrate-legacy-command-lists)
    before replacing existing entries.
  </Note>
  <PropertyList>
