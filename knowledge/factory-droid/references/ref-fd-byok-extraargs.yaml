  heading: Using extraArgs
official_url: "https://docs.factory.com/model-independence/byok.md"
excerpt: |-
  Pass provider-specific parameters like temperature or top_p by adding an `extraArgs` object:
  ```json
  {
    "extraArgs": {
      "temperature": 0.7,
      "top_p": 0.9
    }
  }
  ```
