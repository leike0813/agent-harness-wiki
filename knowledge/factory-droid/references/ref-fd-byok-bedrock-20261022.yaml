excerpt: |-
  To route a custom model through AWS Bedrock, add a `bedrock` object and set `provider` to match the Bedrock API: `anthropic` for InvokeModel on Bedrock Runtime or Messages on Bedrock Mantle, `bedrock-converse` for Converse, or `openai` for Bedrock's OpenAI-compatible endpoint. Bedrock models don't use `apiKey` or `baseUrl`.
