  heading: Per-droid server selection
official_url: "https://docs.factory.com/harness/mcp.md"
excerpt: |-
  [Custom droids](/harness/subagents) can choose which configured MCP servers they may use through the `mcpServers` field in their frontmatter. This scopes a subagent to specific servers (for example `mcpServers: ["linear", "github"]`) instead of inheriting every server in the session. For finer-grained control, a droid's `tools` list can name exact registered MCP tool IDs. See [Selecting MCP servers](/harness/subagents#selecting-mcp-servers) for details.
