  heading: Session contents sync
official_url: "https://docs.factory.com/enterprise/hierarchical-settings-and-org-control.md"
excerpt: |-
  **Session Contents Sync**, in the **Session Features** section of Enterprise Controls, decides whether Factory stores session contents, such as messages, for your organization. It sets `cloudSessionSync`. Factory always stores session metadata, such as session IDs, timestamps, the machine, and tags.
