excerpt: |-
  Use the interactive UI for browsing and one-off work:
  ```text
  /plugins
  ```
  | Tab | Purpose |
  | :-- | :------ |
  | Available | Install plugins from registered marketplaces. Plugin IDs installed in any scope do not appear here. |
  | Installed | Enable or disable a plugin with Space where policy allows, and open its details or available actions. Org-scoped installs expose only their details. |
  | Marketplaces | Add or update a marketplace, and toggle its auto-update. Only user-added marketplaces can be deleted here. Remove org or project entries from the settings that declare them. |
