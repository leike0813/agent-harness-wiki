  heading: Add a custom model
official_url: "https://docs.factory.com/model-independence/byok.md"
excerpt: |-
  - **CLI:** run `/settings` and open **Custom models**, or run `/model` and select **Manage custom models**. Choose **Add model**, pick a provider, fill in the fields, and select **Save changes**.
  - **Desktop app:** open **Settings** > **Custom Models** and click **Add Model**. Fill in the **Form** view, or switch to **JSON** to edit the model object directly.
  - **Settings file:** add an entry to `customModels` in `~/.factory/settings.json`, as described below.

  Both editors save to `~/.factory/settings.json` and list only your personal models, not organization or project models. Saved models appear under **Custom Models** in `/model`, labeled with their `displayName`.
