official_url: "https://docs.factory.com/harness/plugins.md"
excerpt: |-
  An output style lives at `output-styles/<name>.md` and becomes an option under
  `/settings` → **Output style**:
  ```markdown title="output-styles/review-summary.md"
  ---
  name: Review Summary
  description: Format review results for the team
  ---
  Group findings by severity and include file references.
  ```
  The frontmatter is optional. Output style bodies also support the plugin-root variables
  described under [Hooks](#hooks).
  Output styles apply only to interactive Droid CLI sessions. See
  [Output styles](/droid-cli/output-styles) for validation, trust, and fallback behavior.
