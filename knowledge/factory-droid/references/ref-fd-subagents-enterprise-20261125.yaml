excerpt: |-
  - **`allowSubagentModelOverrides`** (**Let Users Override Task Models** in Enterprise Controls) turns the org's tier models into defaults. Users can then pick their own model in `/settings` or the desktop app, choose **Org default** to use the org's model, or choose **Inherit** to use the spawning session's model. It requires a Droid CLI and desktop app version that supports the setting; older versions keep the tiers locked.
