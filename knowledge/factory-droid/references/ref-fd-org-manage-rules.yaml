  heading: Manage permission rules
official_url: "https://docs.factory.com/enterprise/hierarchical-settings-and-org-control.md"
excerpt: |-
  Use the **Permission Rules** section of Enterprise Controls to configure organization
  command policy. It replaces the deprecated command allowlist, denylist, and blocklist
  settings, which remain respected for backward compatibility.
  1. Select **Manage rules**, then add a rule or select an existing one.
  2. Choose **Allow**, **Ask for approval**, or **Block**. Enter the ordered tokens under **Command starts with**, with alternatives where needed.
  3. Add at least one **Should match** and one **Should not match** example. A passing example means the matching expectation passed, not that the command is allowed. Examples are never executed.
  4. Select **Done** to return to the pending Enterprise Controls draft.
  5. Use **Review Changes** and save to apply the policy.
