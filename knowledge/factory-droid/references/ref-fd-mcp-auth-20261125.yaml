  heading: Manage servers from the CLI
official_url: "https://docs.factory.com/harness/mcp.md"
excerpt: |-
  `droid mcp auth` checks each enabled **http** or **sse** server that uses OAuth and is allowed by your organization's MCP policy, then opens the browser sign-in for each server that needs authentication, one at a time. If the browser does not open, it prints the authorization URL. In an interactive terminal, press Esc to skip the current server; press Ctrl+C to stop. The command exits with code `1` when any server fails to authenticate and `0` otherwise, so a script can run it before starting a session.
