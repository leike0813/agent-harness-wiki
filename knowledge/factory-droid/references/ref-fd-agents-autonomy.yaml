  heading: Autonomy level
official_url: "https://docs.factory.com/harness/subagents.md"
excerpt: |-
  Subagents run at an autonomy level, just like the main session (`Off`, `Low`, `Medium`, `High`; see [Autonomy Levels](/autonomy-and-safety/auto-run)). Control it with the **Subagent autonomy level** setting in `/settings` under **Subagents**.
  | Value | Behavior |
  | :---- | :------- |
  | `inherit` (default) | The subagent runs at the parent session's current autonomy level. |
  | `off` | Read tools and commands allowed by [command policy](/autonomy-and-safety/permission-rules). |
  | `low` | File edits plus low-risk commands and MCP tools. |
  | `medium` | Adds reversible workspace changes (installs, local commits, builds). |
  | `high` | Adds high-risk actions unless safety checks require approval. |
