excerpt: |-
  <Property name='reasoningEffort' type='string'>
    Default reasoning effort for a model Droid doesn't recognize. Setting it
    also offers `off`, `low`, `medium`, and `high` in the model selector. When
    `model` or `baseModelId` matches a built-in model, that model's levels and
    default apply instead.
  </Property>
  <Property name='enableThinking' type='boolean'>
    For `anthropic` and `bedrock-converse` models, set to `true` to turn on
    extended thinking.
  </Property>
  <Property name='thinkingMaxTokens' type='number'>
    Token budget for extended thinking on `anthropic` and `bedrock-converse`
    models.
  </Property>
