  heading: Pre-installing plugins
official_url: "https://docs.factory.com/enterprise/internal-plugin-marketplaces.md"
excerpt: |-
  For critical capabilities that everyone needs, set `enabledPlugins` in org-managed settings, alongside `extraKnownMarketplaces` as shown in [Org-level configuration](#org-level-configuration). These plugins:
  - Are installed automatically with `org` scope during startup
  - Can finish installing after the session becomes usable when a source is slow
  - Follow the org settings for their version, so `/plugins` offers an org-scoped plugin no update or uninstall action, only its details
  Move a relative-path org plugin by changing the marketplace pin in org-managed settings. For external Git or npm plugins, update the source entry in the marketplace manifest, then advance the marketplace pin so clients receive that change.
