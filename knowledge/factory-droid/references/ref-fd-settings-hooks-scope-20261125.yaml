  heading: Hooks
official_url: "https://docs.factory.com/droid-cli/settings.md"
excerpt: |-
  - **`false`** (default): this level does not turn hooks off. A higher-precedence level, an org `hooksDisabled: true`, or the org's `allowManagedHooksOnly` can still keep hooks from running.
  - **`true`** at the deciding member level: user and project hooks, and the hooks of plugins the org did not enable, do not run. Org-managed hooks and the hooks of org-enabled plugins still run unless the org sets `hooksDisabled: true`.
