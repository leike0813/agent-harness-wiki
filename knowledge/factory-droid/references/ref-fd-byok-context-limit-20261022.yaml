excerpt: |-
  <Property name='maxContextLimit' type='number'>
    The model's context window, in input tokens. Droid compacts the conversation
    to stay within it and won't send a message too large to fit. A larger value
    doesn't make Droid compact later, though: compaction still starts at your
    compaction token limit, 250,000 by default, as it does for built-in models with
    large windows.
  </Property>
