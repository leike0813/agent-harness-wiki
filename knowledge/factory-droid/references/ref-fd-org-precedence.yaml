  heading: "How precedence works: hard controls vs session defaults"
official_url: "https://docs.factory.com/enterprise/hierarchical-settings-and-org-control.md"
excerpt: |-
  This is the single most important distinction on this page. Managed settings resolve through **two precedence systems** at once, and they run in opposite directions. For the user-facing perspective on how personal preferences interact with these controls, see [App settings](/factory-app/settings).
  <ComparisonTable label='Hard controls vs session defaults'>
  | | **Hard controls** | **Session defaults** |
  | :--- | :--- | :--- |
  | **Who wins** | Highest level present. Org (priority 1) is authoritative. | Most-local level. Runtime > Folder > Project > User > Org > Dynamic > BuiltIn. |
  | **What lower levels can do** | Extend where the schema allows accumulation (union arrays, add new locked keys); never weaken, remove, or re-enable.
