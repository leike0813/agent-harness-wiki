excerpt: |-
  Droid provides two plugin paths, each under a `DROID_` and a `CLAUDE_` name:

  | Variable | Value |
  | :------- | :---- |
  | `DROID_PLUGIN_ROOT`, `CLAUDE_PLUGIN_ROOT` | The installed plugin directory. |
  | `DROID_PLUGIN_DATA`, `CLAUDE_PLUGIN_DATA` | A persistent data directory for the plugin, kept across plugin updates. |

  In skill, droid, and output-style bodies, Droid substitutes both the braced and the bare form, such as `${DROID_PLUGIN_ROOT}` and `$DROID_PLUGIN_ROOT`. In an MCP server's `command`, `args`, and `url` it does too; in `env` and `headers` values, it resolves them when the server connects.
