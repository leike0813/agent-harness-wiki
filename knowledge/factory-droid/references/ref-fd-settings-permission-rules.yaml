  heading: Permission rules
official_url: "https://docs.factory.com/droid-cli/settings.md"
excerpt: |-
  Use `permissionRules` to allow, require approval for, or block shell commands. Rules
  match exact, ordered argument tokens and include examples that verify their behavior.
  They replace the deprecated command lists, which remain respected for backward
  compatibility.
  ```json
  {
    "permissionRules": {
      "version": 1,
      "rules": [
        {
          "id": "user/git-push",
          "decision": "ask",
          "match": { "prefix": ["git", "push"] },
          "tests": {
            "match": ["git push origin main"],
            "noMatch": ["git status"]
          }
        }
      ]
    }
  }
  ```
  Run `droid rules check` after editing settings. See [Permission rules](/autonomy-and-safety/permission-rules)
  for availability, matching, source precedence, and migration. For the organization
