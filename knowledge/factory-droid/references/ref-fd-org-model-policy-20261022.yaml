excerpt: |-
  <ResponseField name="allowCustomModels" type="boolean">
    Whether users may add their own custom models (user BYOK). Set to `false` to disable user-supplied keys entirely.
  </ResponseField>
  <ResponseField name="allowedBaseUrls" type="string[]">
    Base URLs that custom models are allowed to connect to. Use this to force all custom-model traffic through an approved LLM gateway. Bedrock models are matched against `bedrock.bedrockBaseUrl`, or else `https://bedrock-runtime.<region>.amazonaws.com`, so allow that URL for each region in use. A Bedrock model whose region comes only from an AWS profile is not allowed.
  </ResponseField>
