  heading: Plugins and marketplaces
official_url: "https://docs.factory.com/enterprise/hierarchical-settings-and-org-control.md"
excerpt: |-
  For setup and rollout, see [Internal Plugin Marketplaces](/enterprise/internal-plugin-marketplaces) and [Plugins](/harness/plugins).
  <ResponseField name="enabledPlugins" type="object">
    Map of plugin name in `plugin@marketplace` format to `true` (enabled) or `false` (disabled). Plugins set to `true` are automatically installed on CLI startup once their marketplace is available. By default, entries merge additively across org, project, and user settings.
  </ResponseField>
  <ResponseField name="strictEnabledPlugins" type="boolean">
    When `true`, the `enabledPlugins` maps at this level and higher levels become the exhaustive plugin allowlist.
