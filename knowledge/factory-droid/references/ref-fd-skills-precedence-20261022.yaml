  heading: Resolution precedence
official_url: "https://docs.factory.com/harness/skills.md"
excerpt: |-
  When multiple sources provide the same sanitized skill name, Droid keeps one effective
  version and shows the others as overridden. Outside mission and automation sessions, the
  main user-facing precedence is:

  1. Folder-specific and project skills.
  2. Project plugin skills.
  3. Personal skills.
  4. User plugin skills.
  5. Built-in skills.

  Skills from organization plugins rank above every source in this list, including mission
  and automation skills. In a mission session, mission skills rank above project skills. In
  an automation's sessions, the automation's own skills override every source in the list.
