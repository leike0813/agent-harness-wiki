excerpt: |-
  Droid reloads hooks when settings files change, with no restart needed. A change to the hooks that run posts a notice in the session (on stderr for `droid exec`, or as a `hook_settings_changed` event in stream-json) that lists up to 10 changes and counts the rest; changes that land within half a second of each other share one notice. Use `/hooks` to inspect the active configuration.
