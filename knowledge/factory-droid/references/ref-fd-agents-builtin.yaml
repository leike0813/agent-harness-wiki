  heading: Built-in droids
official_url: "https://docs.factory.com/harness/subagents.md"
excerpt: |-
  Two droids ship with Droid and need no definition. Use them directly as `subagent_type` values.
  | Droid | Tools | Default complexity | Use for |
  | :---- | :---- | :----------------- | :------ |
  | `worker` | All tools | `medium` | General-purpose, multi-step tasks including edits and commands. |
  | `explorer` | Read-only | `light` | Fast codebase exploration, search, and structure questions. |
  When you invoke a built-in droid without setting `complexity`, it uses its default tier above.
  <Note>
    A few additional built-in droids (for example `scrutiny-feature-reviewer` and `user-testing-flow-validator`) are written to `~/.factory/droids/` for use within [Missions](/missions/overview) validation and are not meant for general delegation.
  </Note>
