excerpt: |-
  Lets users override the org's `subagentModelSettings`. Absent or `false` locks each tier the org sets, so users see the row as managed by the org. `true` makes the org's tier models session defaults: users can pick their own model, choose **Org default** to use the org's model, or choose **Inherit** to use the spawning session's model. Droid reads this field only from org-managed settings.
