excerpt: |-
  Use the exact name `mcp__<server>__<tool>` for one MCP tool. A regular expression is tested against the Droid name of an MCP tool, `<server>___<tool>`, so `mcp__.*` does not select MCP tools by their Claude Code names; use `<server>___.*` to select every tool from one server. A server name with no tool part, such as `mcp__memory`, contains only exact-name characters, so it matches nothing; Droid reports it at load with the fix.
