excerpt: |-
  A `github` source object, `{ "source": "github", "repo": "org/plugin" }`, also works in `plugins[].source` and clones that repository at its `ref` or `sha`, or its default branch. An unpinned entry naming the marketplace's own repository reads the marketplace checkout instead.
