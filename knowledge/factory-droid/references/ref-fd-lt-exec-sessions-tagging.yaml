excerpt: 'Forking lets you branch off an existing session without disturbing the original; the new run starts from the forked session''s history and is assigned a fresh session ID.


  ```bash

  # Continue a session in-place

  droid exec --session-id <session-id> "next steps"


  # Branch off a session into a new run

  droid exec --fork <session-id> --auto low "try an alternative refactor"

  ```'
