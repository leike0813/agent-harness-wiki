  heading: System-managed settings file
official_url: "https://docs.factory.com/enterprise/hierarchical-settings-and-org-control.md"
excerpt: |-
  If the file is absent, Droid falls back to the existing org-settings flow (Factory App / managed-settings endpoint). If the file is present but unreadable, malformed, or fails schema validation, Droid logs the failure and does not fall back. It treats org policy as unavailable, so plugin and marketplace changes are refused until the file is fixed. A broken admin deployment is **not** silently bypassed.
