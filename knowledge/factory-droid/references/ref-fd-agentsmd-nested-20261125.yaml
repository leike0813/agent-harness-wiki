official_url: "https://docs.factory.com/harness/agents-md.md"
excerpt: |-
  If Droid starts at `repository/`, it loads the root guidance. As Droid works in other directories, including other repositories, it picks up their guidance, so one session can work across several repositories and follow each one's rules.

  Reading, editing, listing, or searching files in a directory triggers discovery; shell commands run through `Execute` do not. For example, editing `apps/web/src/page.tsx` loads `apps/web/AGENTS.md`, and in a session started in `~/code/web`, reading a file in `~/code/api` loads `~/code/api/AGENTS.md`.
