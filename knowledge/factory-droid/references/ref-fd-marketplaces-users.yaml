excerpt: |-
  Users manage plugins via the `/plugins` UI:
  1. Run `/plugins` to open the plugin manager
  2. The Available tab shows plugins from all registered marketplaces including the org marketplace, minus the ones already installed
  3. Org-enabled plugins are installed automatically during startup
  For CLI access:
  ```bash
  droid plugin install frontend-standards@acme-corp-plugins
  droid plugin update frontend-standards@acme-corp-plugins
  ```
  Organization marketplaces are labeled in Marketplaces, and managed installs are labeled in Installed. Available identifies each plugin's source marketplace.
  <LabeledDivider label='Catalog management' />
