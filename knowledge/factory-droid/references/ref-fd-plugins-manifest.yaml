  heading: Plugin manifest
official_url: "https://docs.factory.com/harness/plugins.md"
excerpt: |-
  Create `.factory-plugin/plugin.json`:
  ```json
  {
    "name": "my-plugin",
    "description": "A helpful plugin description",
    "version": "1.0.0",
    "author": {
      "name": "Your Team"
    },
    "homepage": "https://github.com/your-org/my-plugin",
    "repository": "https://github.com/your-org/my-plugin",
    "license": "MIT",
    "keywords": ["review", "security"]
  }
  ```
  | Field | Purpose |
  | :---- | :------ |
  | `name` | Source metadata for ecosystem compatibility. Installed identity comes from the marketplace entry. |
  | `description` | Source-level summary for anyone reading the plugin. |
  | `version` | Release metadata. Git-based installation still tracks the installed commit hash. |
