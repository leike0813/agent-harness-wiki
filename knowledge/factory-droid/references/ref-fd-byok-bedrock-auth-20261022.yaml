excerpt: |-
  `authMethod` selects where Droid gets credentials:

  | `authMethod` | Credentials come from |
  | --- | --- |
  | `aws-credentials` | The standard AWS credential chain: environment variables, `~/.aws` files, SSO, or `awsProfile`. Add `awsAuthRefresh` to run a login command when no credentials are available. |
  | `credentials-command` | The required `awsCredentialExport` command, which runs when no valid AWS credentials are already available. |
  | `environment-api-key` | A Bedrock API key in the `AWS_BEARER_TOKEN_BEDROCK` environment variable. Don't put the key in settings. |
