excerpt: |-
  <Property name='useInRouter' type='boolean'>
    Set to `true` to let Auto Model use this model in place of the built-in
    model named by `baseModelId`. Requires your organization to allow BYOK in
    Auto Model (`modelPolicy.allowFactoryRouterByok`).
  </Property>
