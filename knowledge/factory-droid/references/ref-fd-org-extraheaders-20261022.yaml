  <ResponseField name="extraHeaders" type="object">
    Additional HTTP headers to send with each request. Map of header name to value. For org-managed models, headers named like credentials, and `Cookie`, must use a whole `${VAR_NAME}` reference, and literal values that look like secrets are rejected.
  </ResponseField>
