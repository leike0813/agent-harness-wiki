  heading: "How a skill gets its command name"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  If the `name` you write already starts with the plugin's own prefix, Claude Code doesn't add the prefix again on v2.1.246 or later.
  For example, `name: my-plugin:fancy` still becomes `/my-plugin:fancy`. From v2.1.216 through v2.1.245, Claude Code doubled the prefix when the `name` already carried it.
