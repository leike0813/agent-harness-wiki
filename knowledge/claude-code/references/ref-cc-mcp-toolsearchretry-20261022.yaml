  heading: "Tool search through an LLM gateway"
official_url: https://code.claude.com/docs/en/mcp.md
excerpt: >-
  On v2.1.305 or later, Claude Code can [retry a request without tool search](/docs/en/llm-gateway-protocol#retry-without-tool-search) after a `400` or `422` whose cause it doesn't recognize.
  When the retry works, nothing shows on screen and you don't need to do anything: MCP tools load upfront instead. Claude Code tries tool search again later, at the cost of another rejected request.
  To skip those requests, set `ENABLE_TOOL_SEARCH=false`.
