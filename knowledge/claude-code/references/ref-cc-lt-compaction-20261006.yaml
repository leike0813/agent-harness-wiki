excerpt: >-
  [Auto-compaction](/docs/en/how-claude-code-works#when-context-fills-up) carries
  invoked skills forward within a token budget. When the conversation is summarized to
  free context, Claude Code re-attaches the most recent invocation of each skill after
  the summary, keeping the first 5,000 tokens of each. Re-attached skills share a
  combined budget of 25,000 tokens. Claude Code fills this budget starting from the most
  recently invoked skill, so older skills can be dropped entirely after compaction if you
  have invoked many in one session.
