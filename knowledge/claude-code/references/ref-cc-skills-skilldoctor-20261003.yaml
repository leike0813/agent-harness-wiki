  heading: "Find unused skills"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  The report covers the skills in your session other than bundled skills and enterprise skills. It flags skills in the listing that have never been invoked and says where to turn them off.
  Of the skills it tells you where to turn off, start with the ones that have the highest context cost. The report also lists plugins you haven't used recently.
