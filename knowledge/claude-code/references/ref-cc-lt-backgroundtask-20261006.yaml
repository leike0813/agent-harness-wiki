  heading: "Automatic backgrounding of long tool calls"
official_url: https://code.claude.com/docs/en/mcp.md
excerpt: >-
  An MCP tool call in the main conversation that is still running after two minutes moves
  to a background task instead of blocking the session. Claude receives the task ID
  immediately and keeps working, and the result arrives as a task notification when the
  call settles. Automatic backgrounding requires Claude Code v2.1.212 or later.
