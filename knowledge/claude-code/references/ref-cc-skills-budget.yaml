  heading: "Skill descriptions are cut short"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  Claude Code loads a listing of skill names and descriptions into context so Claude knows what's available. The listing always contains every skill name, but if you have many skills, Claude Code drops some descriptions to fit the listing's character budget, which removes the keywords Claude needs to match your request.
