  heading: "Use skills in Cowork and cloud sessions"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  [Cowork](https://claude.com/product/cowork) sessions and [cloud sessions](/docs/en/cloud-environments#what-carries-over-from-your-setup), including [routines](/docs/en/routines), don't read `~/.claude/skills/` on your machine.
  Both interactive and scheduled Cowork sessions load the skills enabled for your claude.ai account, synced at session start; manage them from **Customize** in the Desktop app sidebar or from the skills settings on claude.ai.
  Cloud sessions additionally load project skills committed to the cloned repository's `.claude/skills/`.
