official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  **Skill folder as a plugin**: add a `.claude-plugin/plugin.json` to a skill folder and it loads as a [plugin](/docs/en/plugins/loading#plugins-shared-through-a-repository) named `<name>@skills-dir`, so it can bundle agents, hooks, and MCP servers.
  In a project's `.claude/skills/`, this requires accepting the workspace trust dialog first.
