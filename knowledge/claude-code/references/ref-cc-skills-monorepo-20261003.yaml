  heading: "Load skills in monorepos and subdirectories"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  In a session running in a linked [git worktree](/docs/en/worktrees), Claude Code searches parent directories only up to the worktree root.
  On Claude Code v2.1.277 or later, when the worktree checkout has no `.claude/skills` directory at its root, Claude Code loads the main checkout's project skills instead.
  See [What worktrees share with the main checkout](/docs/en/worktrees#what-worktrees-share-with-the-main-checkout).
