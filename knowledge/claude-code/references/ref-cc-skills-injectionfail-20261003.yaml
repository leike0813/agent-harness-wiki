  heading: "When an injected command fails"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  A failed command aborts the entire skill invocation, not just its own placeholder. Claude never sees the skill content for that invocation. The abort shows `Shell command failed for pattern "..."`.
  The error message includes the command's output under `[stderr]`.
