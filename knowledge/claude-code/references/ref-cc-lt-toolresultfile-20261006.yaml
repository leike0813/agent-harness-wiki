excerpt: >-
  **Over the limit**: when a successful result with no image content exceeds the token
  limit, Claude Code saves it to a file and replaces it in the conversation with a
  message that names the file path, so Claude reads the file when it needs the content.
  The file goes in the session's `tool-results` directory under
  [`~/.claude/projects/`](/docs/en/claude-directory#cleaned-up-automatically).
