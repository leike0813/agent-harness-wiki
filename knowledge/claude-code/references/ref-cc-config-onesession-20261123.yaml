  heading: "Change a setting for one session"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  **`--settings`**: pass a key as JSON, inline or as a path to a file. Claude Code applies it above your user, project, and local files and below managed settings.
  With `--settings`, you can't set [`Managed` or `Global config`](https://code.claude.com/docs/en/settings-reference#scopes) keys or some user settings keys, such as [`prependPlugins`](https://code.claude.com/docs/en/settings-reference#prependplugins).
