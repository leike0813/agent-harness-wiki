  heading: "Settings in cloud sessions"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  * **Shared project settings with several repositories**: in an Anthropic-hosted environment, a session with several repositories starts above the clones and reads only the `enabledPlugins` and `extraKnownMarketplaces` keys from each repository's `.claude/settings.json`, not permission rules, hooks, `env`, or other keys.
  The marketplaces a repository declares still [aren't added in a cloud session](https://code.claude.com/docs/en/cloud-environments.md#what-carries-over-from-your-setup).
  For a self-hosted environment, see [which repository's settings apply](https://code.claude.com/docs/en/self-hosted-environments-configuration.md#repository-settings-in-sessions-with-several-repositories).
