  heading: "Load skills from a directory outside the project"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  The `permissions.additionalDirectories` setting in `settings.json` grants file access only and loads none of these.
  Claude Code watches `.claude/skills/` in a directory you pass with `--add-dir` at launch, as [Edit a skill during a session](#live-change-detection) describes.
  It doesn't watch the added directory's `.claude/commands/` or `.claude/agents/`, so restart the session after changing a file there.
