  heading: "Control who invokes a skill"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  **`disable-model-invocation: true`**: Claude can't invoke the skill on its own. Use this for workflows with
  side effects or that you want to control timing, like `/commit`, `/deploy`, or `/send-slack-message`. You
  don't want Claude deciding to deploy because your code looks ready.
