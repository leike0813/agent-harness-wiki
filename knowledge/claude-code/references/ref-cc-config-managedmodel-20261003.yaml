  heading: "Settings precedence"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  A managed `model` sets the model each session starts with, and you can still switch with `/model`; the lock is [`availableModels`](/docs/en/settings-reference#availablemodels), which constrains `/model`, `--model`, and the `model` key in your own files.
