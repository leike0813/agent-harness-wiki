  heading: "Broken settings in a `-p` run"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: |-
  A `-p` run shows no dialog. Unless [a managed settings document can't be parsed](https://code.claude.com/docs/en/errors.md#managed-settings-document-could-not-be-parsed), Claude Code skips a broken user, project, or local file or its broken values and continues with the rest.

  With the default `text` [output format](https://code.claude.com/docs/en/headless.md#get-structured-output), stderr lists what didn't load or was skipped:
