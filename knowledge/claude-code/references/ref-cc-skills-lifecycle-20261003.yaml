  heading: "Skill content lifecycle"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  When Claude re-invokes a skill whose rendered content is identical to the copy already in context, Claude Code adds a short note that the skill is already loaded rather than a second copy of the content.
  When the rendered content differs, because the arguments changed or a [dynamic context](#inject-dynamic-context) command produced new output, Claude Code appends the full content again.
