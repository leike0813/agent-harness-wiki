  heading: "Where synced skills load"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  In your terminal, Claude Code syncs those skills in sessions where you sign in with your claude.ai account.
  When the session starts, Claude Code downloads your account's skills into `~/.claude/skills/synced/` in the background, then checks claude.ai for changes about every 10 minutes while the session runs.
  When a check finds that a skill was added, edited, or turned off on claude.ai, Claude Code adds, updates, or removes it in the running session without a restart. Syncing in terminal sessions requires Claude Code v2.1.273 or later.
