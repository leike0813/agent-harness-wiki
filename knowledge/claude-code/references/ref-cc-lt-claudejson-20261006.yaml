  heading: "Find or create your settings files"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  Claude Code also keeps a fifth file, [`~/.claude.json`](/docs/en/claude-directory#ce-claude-json),
  that it writes for itself; you don't need to edit it. It holds your sign-in session,
  [MCP server](/docs/en/mcp) configurations, per-project state such as trust decisions,
  and the [global config keys](/docs/en/settings-reference#global-config-settings)
  that `/config` writes for you.
