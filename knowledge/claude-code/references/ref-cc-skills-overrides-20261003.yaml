  heading: "Override skill visibility from settings"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  `"off"` also hides the skill from the command lists advertised to [Remote Control](/docs/en/remote-control) clients and to [Agent SDK](/docs/en/agent-sdk/skills#discover-available-commands) callers, in addition to the terminal `/` menu.
  Invoking a hidden skill by its full name returns the `skillOverrides` error instead of running it.
