excerpt: >-
  If you deny `ToolSearch` or leave it out of [`--tools`](/docs/en/cli-reference#cli-flags), MCP tools load upfront instead, but a request can still carry a placeholder `defer_loading` entry.
  If a gateway rejects that entry, see [Tool search through an LLM gateway](#tool-search-through-a-gateway).
