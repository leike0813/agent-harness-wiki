  heading: "Pre-approve tools for a skill"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  Workspace trust doesn't gate this field. Claude Code applies a project skill's `allowed-tools` even in a `-p` run in a folder you've never trusted.
  A skill can grant itself broad tool access, so review the `allowed-tools` of skills checked into a repository before you run Claude Code there.
