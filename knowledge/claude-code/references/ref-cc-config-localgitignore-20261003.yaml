locator:
  kind: document_section
  heading: "Keep personal settings out of a repository"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  The first time Claude Code writes the file in a git repository that doesn't already ignore it, it adds `**/.claude/settings.local.json` to your global git excludes file, so the file stays out of your commits in every repository.
  That file is `core.excludesFile` when your global git config sets it to an absolute or `~`-prefixed path; otherwise it's `$XDG_CONFIG_HOME/git/ignore`, or `~/.config/git/ignore` when `XDG_CONFIG_HOME` is unset.
  If you created the file by hand and Claude Code hasn't written to it yet, add it to `.gitignore` yourself.
