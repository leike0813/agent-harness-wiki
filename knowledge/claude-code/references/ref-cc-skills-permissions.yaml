  heading: "Restrict Claude's skill access"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  By default, Claude can invoke any skill that doesn't have `disable-model-invocation: true` set. Skills that define `allowed-tools` grant Claude access to those tools without per-use approval during the turn that invokes the skill; the grant clears when you send your next message.
