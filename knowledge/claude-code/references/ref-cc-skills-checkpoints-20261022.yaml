  heading: "Run skills in a subagent"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  A forked skill that runs in the background applies its edits outside your session's [checkpoints](/docs/en/checkpointing#subagent-edits-not-restored).
  After one, `/rewind` restores only the files Claude had already edited in your conversation. The skill's edits to other files stay, so use git to revert them.
