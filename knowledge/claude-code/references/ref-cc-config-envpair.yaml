locator:
  kind: document_section
  heading: "Settings precedence"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  Environment variables aren't a level in this stack. When a behavior has both a shell variable and a settings key, which one applies is decided per pair, not by level: `ANTHROPIC_MODEL` exported in your shell applies over the `model` key from any file, while `ANTHROPIC_DEFAULT_MODEL` applies only when no file sets `model`.
