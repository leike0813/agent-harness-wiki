  heading: "Troubleshoot a setting that doesn't apply"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  **The file can't set that value.** [`permissions.defaultMode`](/docs/en/settings-reference#permissions-defaultmode) values `auto` and `bypassPermissions` don't take effect from project or local settings; set them in user or managed settings instead, or pass `--permission-mode` for one session.
  Before v2.1.257, `bypassPermissions` took effect from any file.
