locator:
  kind: document_section
  heading: "A change you made in Claude Code is lost in new sessions"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  If you can't write to that file, for example because another tool generates it or links it to a read-only copy, the change applies to the current session and is gone in the next one.
  Set the key in the tool that generates the file, or replace the file with one you can write to.
