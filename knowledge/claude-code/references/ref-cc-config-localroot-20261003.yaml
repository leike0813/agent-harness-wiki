locator:
  kind: document_section
  heading: "Where Claude Code keeps the local file in a git repository"
official_url: https://code.claude.com/docs/en/settings.md
excerpt: >-
  When Claude asks permission to run a Bash command and you choose "Yes, and don't ask again", Claude Code saves that approval as an `allow` rule in `.claude/settings.local.json`.
  If you start Claude Code in a subdirectory of a git repository, it reads and writes that file at the repository root and applies the approval across the whole repository.
  In a [worktree](/docs/en/worktrees), it uses the file at the main checkout's root.
