excerpt: >-
  **Character limit for text results**: for a tool that doesn't declare
  [`anthropic/maxResultSizeChars`](#raise-the-limit-for-a-specific-tool), Claude Code
  saves a successful result with no image content to a file once it's longer than
  50,000 characters, whatever its token count. Setting `MAX_MCP_OUTPUT_TOKENS` doesn't
  change this threshold
