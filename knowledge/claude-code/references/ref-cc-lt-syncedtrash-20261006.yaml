  heading: "Where synced skills load"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  If your organization turns Skills off on claude.ai, Claude Code removes the downloaded
  skills and they stop loading. The removed skills move to `~/.claude/skills/.trash/`,
  where you can recover the files until the
  [retention sweep](/docs/en/claude-directory#cleaned-up-automatically) deletes them.
  Once your organization turns Skills back on, Claude Code downloads the skills you
  enabled at the next sync.
