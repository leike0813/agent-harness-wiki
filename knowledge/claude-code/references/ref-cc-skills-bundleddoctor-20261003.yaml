  heading: "Bundled skills"
official_url: https://code.claude.com/docs/en/skills.md
excerpt: >-
  The [`/doctor`](/docs/en/commands#all-commands) setup checkup stays typable when `disableBundledSkills` is on, in Claude Code v2.1.205 and later.
  To hide it, set the `DISABLE_DOCTOR_COMMAND` environment variable or a [`skillOverrides`](#override-skill-visibility-from-settings) entry of `"doctor": "off"`.
  Before v2.1.205, `/doctor` was a built-in command rather than a bundled skill.
