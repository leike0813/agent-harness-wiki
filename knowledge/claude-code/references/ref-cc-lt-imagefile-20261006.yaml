  heading: "Images in tool results"
official_url: https://code.claude.com/docs/en/mcp.md
excerpt: >-
  When an MCP tool returns a PNG, JPEG, GIF, or WebP image, Claude sees the image inline
  in the conversation. The inline copy may be scaled down or compressed to fit the
  model's image size limits. Claude Code also saves the original bytes to a file in the
  session's `tool-results` directory under
  [`~/.claude/projects/`](/docs/en/claude-directory#cleaned-up-automatically) and gives
  Claude the path. Claude can then crop, convert, or reuse the full-resolution file with
  tools such as Bash.
