  kind: document_section
  heading: "Credential variables that read as empty"
official_url: https://code.claude.com/docs/en/mcp.md
excerpt: >-
  In a remote server's `url` and `headers`, Claude Code reads credential variables from your environment as empty rather than expanding them. This keeps a project's `.mcp.json` or a plugin from sending your Claude Code or cloud provider credentials to a server it names.
