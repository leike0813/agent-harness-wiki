  heading: "Automatic backgrounding of long tool calls"
official_url: https://code.claude.com/docs/en/mcp.md
excerpt: >-
  Set the [`CLAUDE_CODE_MCP_AUTO_BACKGROUND_MS`](/docs/en/env-vars) environment variable in milliseconds to change the threshold, or set it to `0` to turn automatic backgrounding off.
  Setting `CLAUDE_CODE_DISABLE_BACKGROUND_TASKS` to `1` also turns it off, along with all other background task features.
