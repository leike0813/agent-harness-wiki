excerpt: |-
  Chat mode is Lovable's conversation mode, designed for discussing your project without changing its code. It is the **Chat** option in the [project chat](/features/projects/chat), described in the mode picker as **Ask anything, explore ideas**. Lovable starts with the project you have open and reads its code, files, and data to answer. You can ask how the app works, talk through a change, compare options, or ask Lovable to outline an approach in prose. Nothing you discuss changes your code.
  Each Chat mode message is priced as a chat message, on the work Lovable does to answer it, typically a fraction of a credit. Your workspace's daily chat allowance covers it first. See [How Chat mode messages are priced](#how-chat-mode-messages-are-priced).
