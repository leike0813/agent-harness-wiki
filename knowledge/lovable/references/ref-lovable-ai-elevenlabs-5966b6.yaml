  heading: Enable ElevenLabs for your workspace
official_url: "https://docs.lovable.dev/features/ai.md"
excerpt: |-
  ElevenLabs is an optional provider for [text to speech](https://docs.lovable.dev/features/ai-text-to-speech.md#use-an-elevenlabs-voice) and [music](https://docs.lovable.dev/features/ai-music.md#stream-a-track-with-eleven-music-v2). ElevenLabs is disabled by default and unavailable when your workspace has [EU inference](https://docs.lovable.dev/features/eu-inference.md) enabled. You do not need an ElevenLabs account or API key.

  Workspace admins and owners can enable ElevenLabs in either of these places:

  * **In the project chat**: when you ask for speech or music, Lovable shows a card to enable ElevenLabs for the workspace. Select **Enable ElevenLabs**.
  * **In Connectors**: open [Connectors](https://lovable.dev/dashboard?connectors), select **AI**, enable **ElevenLabs**
