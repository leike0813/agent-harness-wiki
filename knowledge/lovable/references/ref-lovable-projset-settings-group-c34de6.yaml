excerpt: "**More menu**: Select **More** in the project toolbar, then **Settings** to open the [general settings](#general-settings) inside the editor. [Secrets](#secrets), [Logs](#logs), [Instructions](#instructions), [Memory](#memory), and [Git](#git) are grouped under **Settings**. See [The More menu](https://docs.lovable.dev/features/projects/editor.md#the-more-menu)."
