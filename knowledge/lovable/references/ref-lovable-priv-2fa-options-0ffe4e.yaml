  heading: Require two-factor authentication
official_url: "https://docs.lovable.dev/features/privacy-and-security-settings.md"
excerpt: |-
  **Available on:** Enterprise\
  **Default:** Off

  Choose who must have [two-factor authentication (2FA)](https://docs.lovable.dev/introduction/two-factor-authentication-2-fa.md) set up on their Lovable account to use this workspace:

  * **Off**: nobody needs 2FA.
  * **External collaborators**: only [external collaborators](https://docs.lovable.dev/features/people.md#external-collaborators) need 2FA.
  * **Everyone**: workspace members and external collaborators need 2FA.
