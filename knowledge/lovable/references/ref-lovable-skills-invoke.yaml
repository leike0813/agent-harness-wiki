  heading: Invoke a skill directly
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  Type `/` in the chat input to open the **Skills** list, choose a skill, and then continue typing your request. You can also open the same list from the **+** button next to the chat input, under **Add context → Skills**. The skill appears as a tag in your message, telling Lovable which instructions to apply.
  Think of the skill as the **how** and your prompt as the **what**.
  For example, with a `launch-checklist` skill in your workspace, you could send:
  ```text wrap theme={null}
  /launch-checklist Review the app for launch blockers before Friday’s release.
  ```
  The **Skills** list filters as you type. On desktop, a panel next to the list shows the skill’s instructions, or its description for skills built by Lovable, so you can confirm you are choosing the right one.
