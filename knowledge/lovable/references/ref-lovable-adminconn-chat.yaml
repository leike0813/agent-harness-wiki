  heading: Chat connector controls
official_url: "https://docs.lovable.dev/integrations/admin-controls.md"
excerpt: |-
  [Chat connectors (MCP servers)](/integrations/chat-connectors) are personal connections, so there is no access list to manage. As with the other types, admins decide which chat connectors are available, in two places. These settings apply in [Chats](/features/chats) as in projects.
  * **Connectors → Admin settings → Chat connectors** enables or disables individual chat connectors for the workspace. The table also includes a **Custom MCP** row ("Allow members to connect their own MCP servers") that governs all [custom MCP servers](/integrations/custom-mcp) as a group. Individual custom MCP servers that members have connected do not appear in the table.
