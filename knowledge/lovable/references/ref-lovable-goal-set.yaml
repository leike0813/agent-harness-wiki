  heading: Set a goal
official_url: "https://docs.lovable.dev/features/goal-runs.md"
excerpt: |-
  You set a goal in the message itself, with the `/goal` command. **Goal** is listed with the [skills built by Lovable](/features/skills#custom-and-built-in-skills), and you add it the same way you add a skill:
  <Steps>
    <Step title="Add the command to your message">
      Type `/goal` anywhere in your message, or type `/` and pick **Goal** from the **Skills** list. The same list is in the [**Chat actions** menu](/features/projects/chat#chat-actions), the **+** button next to the chat input, under **Add context → Skills**. The command appears as a **Goal** tag in your message, and a banner above the chat input confirms the goal: "Lovable will work until your goal is achieved.
