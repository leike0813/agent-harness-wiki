  heading: Managing chat connectors in your workspace
official_url: "https://docs.lovable.dev/integrations/chat-connectors.md"
excerpt: |-
  Chat connections are personal, so you review or revoke your own connections anytime in [**Connectors**](https://lovable.dev/dashboard?connectors), which you can also reach from inside a project, as described in [Where to find connectors](/integrations/introduction#where-to-find-connectors).
  Chat connectors, including custom MCP servers, are enabled by default on all plans, including Enterprise. The [**Lovable static IPs**](/integrations/custom-mcp#lovable-static-ips) connection option for custom MCP servers is the exception: it requires an Enterprise plan.
  On Business and Enterprise plans, workspace admins and owners can turn chat connectors off for the whole workspace or disable individual ones.
