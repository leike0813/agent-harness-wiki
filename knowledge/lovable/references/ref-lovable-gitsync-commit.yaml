  heading: Commit attribution
official_url: "https://docs.lovable.dev/integrations/git-sync-overview.md"
excerpt: |-
  Commits that Lovable pushes are not authored by the workspace member who triggered them. On GitHub they come from the Lovable GitHub app. On GitLab and Bitbucket, Lovable pushes them through the account that authorized the workspace connection. For how each platform still credits the member behind a change, see commit attribution for [GitHub](/integrations/github#commit-attribution), [GitLab](/integrations/gitlab#commit-attribution), and [Bitbucket](/integrations/bitbucket#commit-attribution).
  To record who triggered each change, a workspace owner or admin can enable **Include member email addresses in commits** in [**Workspace settings → Git → Commit attribution**](https://lovable.dev/settings/git). The setting is available on the Business and Enterprise plans and is disabled by default.
