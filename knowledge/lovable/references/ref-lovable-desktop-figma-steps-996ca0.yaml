excerpt: |-
  Connecting Figma requires a **Dev or Full seat** in an eligible Figma plan. Check the [Figma MCP requirements](https://docs.lovable.dev/integrations/figma.md#figma-mcp) before you start.

  **1. Enable MCP in Figma Desktop**

  Open a Design file in the Figma desktop app. In Figma, press `Cmd+K` on macOS or `Ctrl+K` on Windows to open the **Actions** menu. Search for `MCP` and select **Enable desktop MCP server**. Figma shows a confirmation when the server starts.
