  heading: "Enabling the built-in backend (Cloud)"
official_url: "https://docs.lovable.dev/features/cloud.md"
excerpt: |-
  By default, the built-in backend (Cloud) is enabled for your workspace. When a feature you ask for requires backend functionality (for example, authentication or file storage), Lovable enables Cloud automatically or asks for your approval in the project chat first, depending on the **Enable Cloud** permission described below.
  Lovable can't turn Cloud on from inside a [draft](/features/drafts). Ask in the main version of your project instead, then continue in the draft once Cloud is on.
  <Note>
    On some Enterprise workspaces, the built-in backend (Cloud) is disabled at the workspace level, and projects show "Lovable Cloud has been disabled by your workspace admin". This setting is not self-serve; contact your Lovable account team to change it.
  </Note>
