  heading: Deleting inactive projects
official_url: "https://docs.lovable.dev/features/privacy-and-security-settings.md"
excerpt: |-
  When auto-delete is enabled (**Delete inactive projects after**), Lovable deletes an inactive project when the grace period you choose (7, 14, or 30 days) passes. While the deletion is scheduled, the project shows an in-project banner with the deletion date.

  The project owner gets a warning email when the grace period starts, 5 days before the deletion date, and 1 day before it. When the owner is no longer a workspace member, the workspace admins and owners get the emails instead.

  Before the deadline you can cancel the deletion at any time by:

  * editing the project, or sending it a message, or
  * clicking **Postpone** on the in-project banner, or
  * opening the link in the warning email and clicking **Postpone deletion** on the page it opens.
