  heading: Create and manage API keys
official_url: "https://docs.lovable.dev/features/api-keys.md"
excerpt: |-
  Workspace API keys authenticate requests to the [Lovable API](/integrations/lovable-api). Manage them under **Workspace access tokens** on the **API keys & OAuth** settings page. You also use one to set up the [Lovable API connector](/integrations/lovable-api-connector), which lets an app you build with Lovable call the API. Each key belongs to one workspace and can only access that workspace's projects and data. The public API manages and deploys existing projects, and its current endpoints, including deployment builds, do not consume AI build credits.
