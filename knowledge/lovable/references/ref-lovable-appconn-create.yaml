excerpt: |-
  Creating a connection takes a few minutes and only needs to happen once per tool:
  <Steps>
    <Step title="Select the connector">
      Open [**Connectors**](https://lovable.dev/dashboard?connectors) and select the tool you want to connect. See [Where to find connectors](/integrations/introduction#where-to-find-connectors) for every place you can open the catalog.
    </Step>
    <Step title="Add a connection">
      Click **Add connection**. If the connector supports more than one connection type, choose **App + chat connector**. The form is split into collapsible sections, **Details**, **Configure connection**, and **Sharing**. Lovable fills in a name for the connection under **Details**, which you can change. A collapsed section shows a summary of what you chose.
    </Step>
