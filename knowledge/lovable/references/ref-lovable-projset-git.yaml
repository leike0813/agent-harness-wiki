official_url: "https://docs.lovable.dev/features/projects/settings.md"
excerpt: "The **Git** tab is where you connect your project to a [GitHub](/integrations/github), [GitLab](/integrations/gitlab), or [Bitbucket](/integrations/bitbucket) repository and manage the connection. The sync is two-way: Lovable pushes every change it makes to the repository, and commits you push to the synced branch flow back into Lovable. That gives you a full copy of your code outside Lovable and lets developers on your team work with their own tools. See [Git sync](/integrations/git-sync-overview) for how the sync works."
