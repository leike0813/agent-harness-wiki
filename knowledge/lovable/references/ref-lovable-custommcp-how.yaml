  kind: document_section
  heading: How to connect a custom MCP server
official_url: "https://docs.lovable.dev/integrations/custom-mcp.md"
excerpt: |-
  To connect a custom MCP server, you need the server's URL and, depending on the server, its credentials:
  <Note>
    If your workspace has an [MCP registry](/integrations/mcp-registries), you can browse it and select **Connect** next to a server instead. This opens the same form with the server's URL already filled in, so you can skip straight to authentication. Servers connected from a registry always use a direct connection. To use [Lovable static IPs](#lovable-static-ips), add the server by URL as described below.
  </Note>
  <Steps>
    <Step title="Open the custom MCP form">
      Open [**Connectors**](https://lovable.dev/dashboard?connectors), select the **+** button in the top right of the catalog, and choose **MCP server**.
