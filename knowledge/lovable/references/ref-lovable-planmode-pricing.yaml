  heading: How Plan mode messages are priced
official_url: "https://docs.lovable.dev/features/plan-mode.md"
excerpt: |-
  A Plan mode message costs **one credit, plus the cost of any subagent research** Lovable runs while planning. The one credit covers the planning work itself, so it is the same whether the message ends in a plan, a clarifying question, or an answer. Skipping a plan does not add a charge. Sending feedback on the plan is a new Plan mode message, priced the same way.
  <Tip>
    **Chat mode is the cheaper way to ask.** A Plan mode message costs one credit before any research. A [Chat mode](/features/chat-mode) message is priced on the work it needs, typically a fraction of a credit, and your workspace's daily chat allowance covers it first. Ask your questions, compare options, and settle what you want in Chat mode, then switch to Plan mode when you want the plan.
  </Tip>
