official_url: "https://docs.lovable.dev/integrations/security.md"
excerpt: |-
  Most app + chat connectors route through a **secure gateway** between your Lovable app and the third-party service. This includes [custom connectors your workspace creates](/integrations/create-connector): their requests go through the same gateway and leave from the same IP ranges as built-in connectors. If you need to confirm whether a specific connector routes through the gateway, contact Lovable support.
  The gateway provides the following capabilities:
  * **Authentication is handled automatically.** The gateway manages OAuth and refreshes expiring tokens when a request needs them. If access is revoked or a refresh token is no longer valid, reconnect the account.
