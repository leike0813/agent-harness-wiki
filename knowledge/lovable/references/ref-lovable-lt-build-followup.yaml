  heading: "Send follow-ups mid-build"
official_url: "https://docs.lovable.dev/features/agent-mode.md"
excerpt: "Lovable working on a request doesn't block you. Send a follow-up, a correction, or a new idea at any time to steer the work, and Lovable picks it up at its next natural stopping point without losing completed work. Some messages, like **Try to fix** and inline text edits from the preview toolbar, run as their own request after the current one. See [Send follow-ups while Lovable works](/features/projects/chat#send-follow-ups-while-lovable-works) for details."
