  heading: Work with project context
official_url: "https://docs.lovable.dev/features/chat-mode.md"
excerpt: |-
  Lovable answers from your project, so you do not need to describe your app before you ask about it. In Chat mode, Lovable can read:
  * Your project's code and files
  * Your app's data, when [Lovable Cloud](/features/cloud) is connected
  * The conversation so far, including changes made in Build mode
  * Other projects in your workspace that you reference
  * Your connected tools, such as Slack, Notion, or Linear
  To reference a specific file, type `@` and select it, or use **Reference file in chat** in the [code editor](/features/code-mode). To add another project as context, type `@` and select it, or ask for it by name. [Cross-project referencing](/features/cross-project-referencing) is read-only and follows your workspace permissions.
