official_url: "https://docs.lovable.dev/features/plan-mode.md"
excerpt: |-
  Plan mode is Lovable's planning mode, designed to turn a change you have in mind into a structured plan you review and approve before any code is written. It is the **Plan** option in the [project chat](/features/projects/chat), described in the mode picker as **Detailed spec for complex builds**. Lovable investigates your project across multiple steps, inspecting files, logs, and other relevant context, then writes the plan. You inspect, edit, and refine it, and Lovable builds only what you approve.
  Lovable often asks clarifying questions to understand your goals and constraints before it proposes a plan. When there is a clear implementation to propose, the plan opens in the **Plan view**.
  Plan mode never modifies your code.
