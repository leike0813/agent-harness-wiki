excerpt: "The **Domains** tab is where you manage the web addresses of your published app. You can connect a domain you already own, buy a new domain directly through Lovable, and choose a primary domain that all your project's other addresses redirect to. You can also buy and connect a domain by asking Lovable in the project chat. You can set a primary domain only in this tab. Custom domains are available on paid plans. See [Set up a custom domain](/features/custom-domain), or follow [Launch your site on a custom domain](/tips-tricks/launch-on-a-custom-domain) for the full path from publishing to a live site on your domain."
