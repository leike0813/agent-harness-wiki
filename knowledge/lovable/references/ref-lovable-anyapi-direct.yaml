  heading: "Alternative: connect the service directly"
official_url: "https://docs.lovable.dev/integrations/any-api.md"
excerpt: |-
  If you would rather not create a connector, Lovable can write the integration into your app. Your app then owns the key and the request code, and the connector gateway is not involved.
  Lovable stores the API key, client secret, or access token as a [secret](/features/secrets) and writes server-side code that reads it, so visitors to your app cannot see it. In newer apps on [TanStack Start](/features/upgrade-to-tanstack-start) (created from May 13, 2026, or June 22, 2026 on Enterprise plans), Lovable writes a server function. In older React + Vite apps, it writes an Edge Function in Cloud.
  Keys that a provider designs for browser use, such as a Google Maps Platform browser key, are the exception. They belong in your app's frontend code, and you restrict them to your domains.
