excerpt: "Secrets store sensitive values such as API keys, tokens, and credentials without exposing them in code. They are encrypted, injected into your Edge Functions automatically, and never reach the browser. Each secret belongs to one project and is read while your app runs. Workspace-wide values your projects need while they build, such as npm tokens for private packages, are [build secrets](/features/build-secrets), available on Enterprise plans."
