  heading: Restrict a key to an IP allowlist
official_url: "https://docs.lovable.dev/features/api-keys.md"
excerpt: "An entry is an IPv4 or IPv6 address, or an address range in CIDR notation, such as `203.0.113.0/24` or `2001:db8::/48`. Lovable rejects ranges wider than /8 for IPv4 or /32 for IPv6. Every list must include at least one IPv4 entry. A server with both an IPv4 and an IPv6 address can still send requests over IPv4, so a list with only IPv6 entries can block them."
