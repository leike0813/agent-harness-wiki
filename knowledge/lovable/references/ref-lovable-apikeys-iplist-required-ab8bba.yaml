locator:
  kind: document_section
  heading: Require an IP allowlist on every key
official_url: "https://docs.lovable.dev/features/api-keys.md"
excerpt: |-
  With the requirement enabled:

  * Every new key needs an allowlist before you can create it.
  * You cannot save an empty allowlist on a key.
  * Existing keys without an allowlist stop working. Requests that use them fail with `403 ip_allowlist_required`. Lovable does not revoke these keys, so a key works again after you add an allowlist with **Edit IP allowlist**.
