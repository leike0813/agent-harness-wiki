  heading: Built-in backend
official_url: "https://docs.lovable.dev/features/cloud.md"
excerpt: |-
  The built-in backend utilizes Supabase's open-source foundation, which means you get a production-ready environment from day one, without needing to set up Supabase separately: a database, real-time updates, user authentication, and storage, with none of the manual setup steps. Across the docs, this is called the **built-in backend**, as opposed to an external backend you connect yourself, such as [Supabase](/integrations/supabase). You also see it called Cloud in parts of the product, such as your Cloud credit usage and the **Enable Cloud** permission.
