excerpt: |-
  Standardize how projects are created and ensure consistency across teams.
  ### Knowledge
  Define workspace-level instructions and context that Lovable uses across all projects. This is useful for coding standards, architecture rules, preferred libraries, and other conventions that should stay consistent.
  Only workspace owners and admins can manage workspace knowledge. Project knowledge can add project-specific context and override workspace-level guidance when needed.
  See [Workspace and project knowledge](/features/knowledge).
  ### Skills
  Define reusable, on-demand instructions that Lovable can apply across projects in your workspace.
