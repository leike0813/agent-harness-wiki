  <AccordionGroup>
    <Accordion title="What is the difference between the Lovable MCP server and chat connectors?">
      [Chat connectors](/integrations/chat-connectors) let the **Lovable agent** connect to your external tools, such as Notion, Linear, or Miro, while you build. The Lovable MCP server is the reverse. It lets **your external client**, such as ChatGPT, Claude, Claude Code, Cursor, or VS Code, connect to Lovable and manage your projects from there.
    </Accordion>
    <Accordion title="Which plans can use the Lovable MCP server?">
      All plans. On Enterprise workspaces, a workspace admin or owner must first enable [Third-party MCP clients](/features/privacy-and-security-settings#third-party-mcp-clients) in **Workspace settings → Security → Privacy & security**.
    </Accordion>
