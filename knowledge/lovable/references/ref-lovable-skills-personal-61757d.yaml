  heading: Personal skills
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  Personal skills are your own, and each workspace you belong to has a separate set. Lovable applies them in every project you open in that workspace. Your teammates never see them, you do not need to be an admin, and they are available on all plans.

  You find them in [Account settings → Personal skills](https://lovable.dev/settings/personal-skills). Choose the workspace at the top of the page before you add anything. A skill you add in one workspace does not appear in your other workspaces, and a workspace you join starts with none.
