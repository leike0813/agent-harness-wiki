excerpt: |-
  An MCP client without a preconfigured Lovable connection can use a [custom OAuth client](/features/oauth-clients) if it supports custom OAuth credentials. Register its callback URL, then configure it with the client ID and secret. Each user signs in to Lovable and authorizes the client to act on their behalf. Workspace **owners and admins on all plans** can register OAuth clients. Adding the sensitive project and workspace scopes used by MCP tools requires **Business or Enterprise**.

  Hosted clients that rely on automatic registration still need Lovable to approve their web callback address. If that flow fails, ask the provider to contact [Lovable support](https://lovable.dev/support) to request approval, or contact support yourself.
