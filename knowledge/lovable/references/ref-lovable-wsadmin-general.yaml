  heading: General workspace settings
official_url: "https://docs.lovable.dev/features/workspace-admin-settings.md"
excerpt: |-
  Manage the core identity of your workspace, default usage limits that apply to all members unless overridden, and workspace-level publishing options.
  | **Setting** | **Description** |
  | :- | :- |
  | **Avatar** | A workspace icon shown next to the workspace name across the app, including the workspace switcher. |
  | **Name** | Your workspace display name (maximum 50 characters) shown throughout the interface. Useful for distinguishing teams or business units. |
  | **Workspace handle** | A unique public identifier used in workspace-related URLs, such as profile pages and shared projects.<br />*Note: Changing the handle may break existing links.* |
  | **Default monthly member credit limit** | The maximum number of build credits each member can use per calendar month (UTC).
