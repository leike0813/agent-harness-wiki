  heading: Anatomy of a skill
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  Each skill has three required parts.
  * **Name**: a short, permanent identifier for the skill, between 1 and 64 characters. Use lowercase letters, numbers, and hyphens only, for example, `launch-checklist`, `release-notes`, or `support-reply`. Names cannot start or end with a hyphen, and cannot contain consecutive hyphens. The name `goal` is reserved for the built-in [Goal](/features/goal-runs) command. The name cannot be changed after creation. To rename a skill, delete it and create a new one.
  * **Description**: a short sentence that tells Lovable when to use the skill. Start with “Use when...” and describe the trigger as concretely as possible. The description is the main signal Lovable uses to decide whether to load the skill for a message.
