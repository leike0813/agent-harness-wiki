excerpt: "**Keep forever**: Keep this project out of your workspace's [inactive projects](https://docs.lovable.dev/features/privacy-and-security-settings.md#inactive-projects) cleanup. A project kept forever is never marked inactive and never deleted for inactivity. Disabled by default and available on Enterprise only. See [Keeping a project forever](https://docs.lovable.dev/features/privacy-and-security-settings.md#keeping-a-project-forever)."
