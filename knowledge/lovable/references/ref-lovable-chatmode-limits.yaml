locator:
  kind: document_section
  heading: What Chat mode does not do
official_url: "https://docs.lovable.dev/features/chat-mode.md"
excerpt: |-
  Chat mode never changes your project's code or data. While Chat mode is active, Lovable does not:
  * Create or edit project files
  * Change data in your app's database or run database migrations
  * Generate or edit images and videos
  * Enable Lovable Cloud, user authentication, or email sending for your project
  * Publish your app
  * Create a plan in the Plan view
  Chat mode can outline an approach in the conversation, with the steps in build order, the parts of the app involved, and the trade-offs, but it does not create an editable plan in the Plan view. Switch to [Plan mode](/features/plan-mode) when you want a structured plan to review and approve. For the other actions, Lovable proposes switching to Build mode. See [Switch to Plan or Build](#switch-to-plan-or-build).
  <Note>
