  heading: "Browse plan versions"
official_url: "https://docs.lovable.dev/features/plan-mode.md"
excerpt: "Lovable keeps every revision in the current round of planning as a version. Use the undo and redo arrows above the plan to step through the versions and compare them. While you view an earlier version, a banner such as **Viewing version 2 of 3** appears. You can read that version, but you cannot edit it or select part of it to request changes. Select **Back to latest** to return to the latest version."
