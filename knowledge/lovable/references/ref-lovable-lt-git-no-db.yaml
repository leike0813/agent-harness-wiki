excerpt: "    No. The repository contains your project's code, including the database migration files that define its structure, but never the data inside your database. Lovable does not run migration files that you add through Git. See [Backend files in your commits](#backend-files-in-your-commits). To export data, see [Export Lovable Cloud data](/features/advanced-settings#export-lovable-cloud-data)."
