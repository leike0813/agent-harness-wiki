  heading: The project's database
official_url: "https://docs.lovable.dev/integrations/lovable-mcp-server.md"
excerpt: |-
  These tools act on the project's built-in database. A project that uses your own [Supabase](/integrations/supabase) project is managed in Supabase instead.

  | Tool | Description |
  | - | - |
  | `get_database_status` | Check whether the project's database is enabled |
  | `enable_database` | Provision the project's database (takes 30 to 60 seconds) |
