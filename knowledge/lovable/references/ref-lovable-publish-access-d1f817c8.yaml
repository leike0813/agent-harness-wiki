  heading: Who can see your published app
official_url: "https://docs.lovable.dev/features/publish.md"
excerpt: |-
  ### Free and Pro plans
  The picker has two options:
  * **Public**: Anyone with the URL can visit your published app. This is the default.
  * **Invite only**: Only people you add can visit your published app, after logging in.
  ### Business and Enterprise plans
  The picker has three options:
  * **Public**: Anyone with the URL can visit your published app. This is external publishing.
  * **Workspace** (shown with your workspace name): Only workspace members can visit the published app after logging in.
  * **Custom**: You compose the exact audience: the whole workspace, [groups](/features/groups), individual members, and people outside your workspace invited by email.