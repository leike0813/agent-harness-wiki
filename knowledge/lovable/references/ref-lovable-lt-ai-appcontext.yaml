  heading: "Let Lovable debug and improve your AI features"
official_url: "https://docs.lovable.dev/features/ai.md"
excerpt: "Give Lovable visibility into your app's AI calls so it can help you make them better. When this is on, Lovable keeps the full request and response for each AI call, so the agent (and you) can open a request to see exactly what was sent and returned. The agent can use this to debug failures, refine your prompts and knowledge, and reduce cost and latency. Secrets are removed automatically, and details are kept for 90 days.\n\nIt is on by default on Free and Pro. On Business and Enterprise it is off by default; enable it from the prompt on **More → AI**, or from the **AI app context** setting in [project settings](/features/projects/settings). Changing it requires permission to edit the project."
