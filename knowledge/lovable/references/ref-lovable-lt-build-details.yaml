excerpt: "For a closer look, click the activity card while Lovable works, or **Details** on a finished change. The **Details view** opens where the preview usually appears. Its **Timeline** tab lists every step Lovable took, including tool calls, and its **Changes** tab shows the resulting file changes. Click **Hide details** to return to the preview."
