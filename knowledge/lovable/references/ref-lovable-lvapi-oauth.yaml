  heading: Connect users' accounts with OAuth
official_url: "https://docs.lovable.dev/integrations/lovable-api.md"
excerpt: |-
  Use [Log in with Lovable](/features/oauth-clients) when your app needs individual users to sign in with Lovable and authorize access to their profile, projects, or workspaces. Workspace **owners and admins on all plans** can register and manage OAuth clients. Non-sensitive scopes are available on all plans. Sensitive project and workspace scopes require **Business or Enterprise**.

  Open **Workspace settings → API keys & OAuth → Log in with Lovable** to register a client. Choose its redirect URLs and scopes, then configure your integration with the client ID and secret. Clients with only sign-in and profile scopes do not need verification. Clients with sensitive project or workspace scopes show an unverified app warning until Lovable verifies them.
