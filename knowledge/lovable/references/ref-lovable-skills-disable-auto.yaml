  kind: document_section
  heading: Enable or disable automatic use
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  Every custom workspace skill has **Automatic use** enabled by default. When automatic use is enabled, Lovable can apply the skill automatically whenever the task matches, and you can also invoke it manually with a slash command (`/skill-name`).
  When automatic use is disabled, Lovable does not apply the skill on its own in any project, even when the task matches. The skill stays available to the workspace. It still appears in the **Skills** list when you type `/`, and you can invoke it manually with a slash command.
  Workspace owners and admins can enable or disable automatic use for a skill from **Workspace settings → Skills**, or from **Project settings → Skills** while working in a project. The setting applies across the entire workspace.
