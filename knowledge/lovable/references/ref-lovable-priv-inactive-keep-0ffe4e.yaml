  heading: Keeping a project forever
official_url: "https://docs.lovable.dev/features/privacy-and-security-settings.md"
excerpt: |-
  Some projects should never count as inactive, for example a documentation site or a reference app you keep for later. Project editors enable **Keep forever** in **Project settings → General → Lifecycle**, or click **Keep it** on the in-project banner. A project kept forever is never marked inactive, never gets deletion warnings, and is never deleted for inactivity.

  Keeping a project forever when it is already marked inactive removes the mark and cancels its scheduled deletion.
