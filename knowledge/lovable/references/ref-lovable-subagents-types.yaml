  heading: Subagent types
official_url: "https://docs.lovable.dev/features/subagents.md"
excerpt: |-
  Lovable has two kinds of subagents you may see appear in the activity card in the project chat. Both investigate focused questions. The difference is the kind of result Lovable needs.
  * **Generic subagents** are useful when Lovable needs the findings in a specific shape, such as a comparison, checklist, summary, review, or recommendation. Their card title describes the task they are working on, such as `Check how notifications are implemented`
  * **Explore** is useful when the answer needs traceable evidence, such as when you ask how something works, where something is handled, or why something behaves a certain way. Explore uses the most capable model available and follows a structured research process.
