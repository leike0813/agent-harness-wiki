  heading: Region selection
official_url: "https://docs.lovable.dev/features/cloud.md"
excerpt: |-
  Projects can be hosted in three regions:
  * Americas
  * Europe
  * Asia Pacific
  You can set a preferred default region for new Cloud projects under **Where project data is stored** in the same permissions view. If no preferred region is set, Lovable automatically preselects the region closest to your current location, and you can change it before confirming.
  Choosing a region closer to your users results in:
  * Lower latency
  * Faster database responses
  * Region-based data hosting
  * Better overall backend performance
  <Note>
    After Cloud is enabled, you cannot change the selected region, and you cannot move existing projects between regions.
  </Note>
  To see which region an existing project is hosted in, go to **More → Cloud → Overview → Advanced settings** and check the **Database location** row.
