excerpt: |-
  Controls sensitive data detection and storage exposure rules.
  ### Sensitive data scanning
  **Available on:** Enterprise\
  **Default:** Disabled
  When enabled, Lovable scans workspace content for personally identifiable information (PII). This is the **workspace-level main switch for sensitive data protection features**, including on-demand scans (chat history, built-in databases, and storage), chat send protection for new messages and attached files, and block publishing with PII findings.
  It also adds a **Sensitive data** tab to projects where recorded PII findings can be reviewed.
  See [Sensitive data scanning](/features/sensitive-data-scanning) for more information.
  ### Chat send protection
  **Available on:** Enterprise (only visible when **Sensitive data scanning** is enabled)\
