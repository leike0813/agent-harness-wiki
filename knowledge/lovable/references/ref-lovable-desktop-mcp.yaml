official_url: "https://docs.lovable.dev/integrations/desktop-app.md"
excerpt: |-
  The desktop app supports both **remote MCP servers** and **local MCP servers**.
  **Remote MCP servers** work the same as in the web app. Open **Connectors** and select a chat connector to connect cloud-based tools like Notion, Linear, or Jira. See [Chat connectors](/integrations/chat-connectors) for the full list and setup instructions.
  <Tip>
    For quick access to connectors from any location, use the [**command palette**](https://docs.lovable.dev/introduction/project-search-and-find#command-palette) (Cmd+K on Mac, Ctrl+K on Windows/Linux) and search for connectors.
  </Tip>
  **Local MCP servers** connect to tools running directly on your machine. The most common examples are **Figma Desktop** and **Paper**, which expose a local MCP server when running on your computer.
