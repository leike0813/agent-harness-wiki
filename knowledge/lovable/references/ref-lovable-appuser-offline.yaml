  heading: Offline access
official_url: "https://docs.lovable.dev/integrations/app-user-connectors.md"
excerpt: |-
  **Offline access** controls whether your app receives a connection key for each user who connects.
  * When it is enabled, your app receives an opaque connection key per user and can act for that user later, including when they are not signed in, for example in background operations.
  * When it is disabled, no key is issued. Your app can only act while the member is signed in through [workspace identity reuse](/features/lovable-workspace-identity-reuse). Apps published outside the workspace need it enabled.
  On Free and Pro plans, offline access is always enabled. On Business and Enterprise plans, it is disabled by default, and you enable it under **Advanced settings** when you set up the client. After the client is linked to a project, you can no longer disable it.
