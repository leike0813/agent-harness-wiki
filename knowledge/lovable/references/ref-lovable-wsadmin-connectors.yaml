official_url: "https://docs.lovable.dev/features/workspace-admin-settings.md"
excerpt: |-
  Manage how your workspace connects to external tools, services, and APIs. Admins and owners control who can create connections and clients for each connector from **Connectors → Admin settings**, which is also how connectors are made available or disabled. Who can use an individual connection is chosen by whoever creates it.
  Availability defaults differ by plan: app + chat connectors are available by default on Free, Pro, and Business plans, and effectively disabled at first on Enterprise plans, where **Who can create connections and clients** defaults to **No one** until an admin changes it. Connection access is enforced while building and collaborating in Lovable, but not after publishing.
