  heading: Restrict a key to an IP allowlist
official_url: "https://docs.lovable.dev/features/api-keys.md"
excerpt: |-
  When the list has at least one entry, the **⋯** menu next to the allowlist's **Add** button shows these actions:

  * **Edit direct IPs as text**: edit the addresses and ranges on the list as text, one entry per line, to change many entries at once. Click **List view** to return to the list with your changes.
  * **Export direct IPs as CSV**: download the addresses and ranges on the list as a CSV file, for example to reuse it on another key with **Upload CSV**.
