  heading: Choosing a model
official_url: "https://docs.lovable.dev/features/ai.md"
excerpt: |-
  Not sure which to use? Describe what you want, and Lovable picks a model for you. This table shows where to start and when you might switch.
  | Use case | Start with | Switch when |
  | - | - | - |
  | Chat and assistant features | Gemini 3.8 Flash | You need deeper reasoning or longer context. |
  | High-volume, simple text tasks | Gemini 3.1 Flash Lite or GPT-5 Nano | Accuracy matters more than cost. |
  | Image generation and editing | GPT Image 2 | You want faster results (GPT Image 2.5 Flare), the highest image quality (GPT Image 2.5 Sunburst), lower-cost drafts, or a Gemini image model. |
  | Video generation | Gemini Omni 1.1 Flash | You want the highest visual quality (Veo 3.1), or you need the same prompt to produce a near-identical clip each time (any Veo model). |
