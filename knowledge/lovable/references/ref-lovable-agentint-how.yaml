  heading: How it works
official_url: "https://docs.lovable.dev/features/agent-integrations.md"
excerpt: |-
  Start setup by asking Lovable in chat to add agent integrations or by selecting **Enable agent integrations** under **More → Agent integrations**. You can set up the integration before publishing the app.
  Lovable then:
  1. Generates an MCP server for the app.
  2. Proposes a set of tools based on what the app does.
  3. Asks who should be able to call the tools: signed-in users or anyone.
  4. Sets up authentication to match your answer.
  The proposed tools are a starting point: you can ask Lovable to add, remove, rename, or change them at any time.
  Before anything goes live, you review the tools and access setup, then publish your app. Lovable gives you an MCP link to share with your users.
