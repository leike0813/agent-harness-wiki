  heading: Who can see your published app
official_url: "https://docs.lovable.dev/features/publish.md"
excerpt: |-
  * **Custom**: You compose the exact audience: the whole workspace, [groups](/features/groups), individual members, people in your [organization](/features/organizations), and people outside your workspace invited by email. See [Invite people outside your workspace](#invite-people-outside-your-workspace).
  * Your organization (Enterprise workspaces in an [organization](/features/organizations), shown with the organization's name): Members of every workspace in the organization can visit the published app after logging in. See [Publish to your organization](#publish-to-your-organization).
