locator:
  kind: document_section
  heading: "Keep Lovable and your work on separate branches"
official_url: "https://docs.lovable.dev/integrations/git-sync-overview.md"
excerpt: "Do not force-push, rebase, or squash commits that are already on the synced branch. Lovable keeps its own copy of that branch. When you rewrite its history, the next sync saves a backup of Lovable's copy and then replaces it with yours. The project owner can [restore the backup](#restore-lovable-work-after-a-push-replaces-it). To undo a change, add a commit that reverts it."
