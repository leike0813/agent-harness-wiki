excerpt: "| **Delete workspace** | Permanently deletes the workspace, all its projects, all member access, and cancels the workspace subscription. Only workspace owners can delete a workspace. Lovable support can restore the workspace within a 60-day grace period. See [Delete a workspace](/introduction/delete-workspace) for more information. |"
