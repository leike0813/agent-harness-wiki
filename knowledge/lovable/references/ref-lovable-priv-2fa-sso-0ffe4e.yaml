excerpt: When [Enforce SSO](https://docs.lovable.dev/features/business/sso.md) is enabled, you can choose **External collaborators** but not **Everyone**. Members log in through your identity provider, so Lovable does not ask them for a second factor. If **Require two-factor authentication** is set to **Everyone**, change it to **External collaborators** or **Off** before you enforce SSO.
