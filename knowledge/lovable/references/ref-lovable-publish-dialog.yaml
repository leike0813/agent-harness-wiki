excerpt: |-
  The [quick start](#quick-start-publish-your-first-project) covers the defaults. This section walks through every option in the dialog, which shows everything on one page: your website URL, who can see the website, and a security check.
  <Steps>
    <Step title="Open the Publish dialog">
      In your project, click the **Publish** button in the top-right corner. By default, editors and above can [publish projects](#who-can-publish-projects).
      When the publish dialog opens, Lovable automatically runs a [Quick scan](/features/security#quick-scan) in the background. The scan takes about 10 seconds and checks your database access rules, including row-level security (RLS) policy mistakes, your dependencies, and MCP server exposure.
    </Step>
