  heading: Types of skills
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  Skills come in three types. They differ in who manages them and who can use them.

  | Skill type | Managed by | Who can use it |
  | - | - | - |
  | **Custom workspace skills** | Workspace owners and admins, in **Workspace settings → Skills** | Workspace owner, admin, or editor |
  | **Skills built by Lovable** | Lovable, nothing for you to set up | Workspace owner, admin, or editor |
  | **Personal skills** | You, in **Account settings → Personal skills** | Only you, in the workspace you add them to |
