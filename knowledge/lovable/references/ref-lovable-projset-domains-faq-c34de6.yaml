excerpt: "In the editor, select **More** in the [project toolbar](https://docs.lovable.dev/features/projects/editor.md#project-toolbar), then **Domains**. **Domains** lists your published app's web addresses and is where you connect a custom domain and choose your primary domain. Custom domains are available on paid plans. See [Set up a custom domain](https://docs.lovable.dev/features/custom-domain)."
