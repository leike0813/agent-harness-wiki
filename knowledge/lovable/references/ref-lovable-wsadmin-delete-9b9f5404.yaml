excerpt: |-
  | **Recently deleted projects** | Lists the deleted projects you can restore. Shown only while you have a deleted project you can restore. You can restore projects you own, and workspace owners can restore any deleted project in the workspace. See [Restore a deleted project](/features/projects/delete-project#restore-a-deleted-project) for more information. |
  | **Delete workspace** | Deletes the workspace, all its projects, and all member access, and cancels the workspace subscription. Only workspace owners can delete a workspace. On Free, Pro, and Business plans, owners can restore it within 60 days from [Account settings → Account → Recently deleted workspaces](https://lovable.dev/settings/account). See [Delete a workspace](/introduction/delete-workspace) for more information. |
