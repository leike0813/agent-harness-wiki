excerpt: |-
  **Available on:** Enterprise\
  **Default:** Enabled when a workspace becomes Enterprise. Disabled on workspaces that were already Enterprise.

  The **Connector requests** policy lets workspace editors ask for a connector that is disabled in your workspace, or that only workspace admins and owners can connect. Requests appear in the [Action center](https://docs.lovable.dev/features/action-center.md#connector-requests). The policy is a single switch, with no **Configure** button.
