locator:
  kind: document_section
  heading: "Restore Lovable work after a push replaces it"
official_url: "https://docs.lovable.dev/integrations/git-sync-overview.md"
excerpt: "* **Restore Lovable work** brings the saved commits back to the project. Lovable then syncs them to your repository. When the repository has no newer commits, the work goes to the synced branch. Otherwise it goes to a `lovable-sync` branch, and Lovable shows a **Merge on GitHub**, **Merge on GitLab**, or **Merge on Bitbucket** link to open a pull or merge request for it. Merge that branch with a merge commit, not a squash or rebase.\n* **Keep repository version** closes the notice and leaves the project as the push left it. Lovable does not offer this restore again."
