  heading: What a goal costs
official_url: "https://docs.lovable.dev/features/goal-runs.md"
excerpt: |-
  A goal is billed on the work Lovable does, and it costs noticeably more than a regular Build mode message, for two reasons: the same work uses more credits, and a goal involves more work, because Lovable keeps working until the goal is achieved. You are charged for all of that work, from start to finish.
  [Credit check-ins](/introduction/credits-and-usage#build-costs) still apply: the work pauses when it crosses your check-in level, and choosing **Finish up** ends the goal early, with Lovable finishing the work in progress and stopping. The **stop button** stops the work at any time, and you are only charged for the work completed up to that point. Check your credit balance before you set a large goal.
