excerpt: "Workspace admins and owners find projects kept forever in [Security insights](https://docs.lovable.dev/features/security-insights.md): filter **Inactive status → Kept forever**, or show the **Kept forever since** column, which the CSV export includes as well. Admins and owners can also keep a project forever from there: expand its row or open its details, then click **Keep forever** (**Stop keeping forever** undoes it). Each change is recorded in the [audit log](https://docs.lovable.dev/features/audit-logs.md) as **Project abandonment protection updated**."
