excerpt: |-
  Open **Workspace settings → API keys & OAuth** to manage credentials for external integrations. Both sections require the workspace **owner or admin** role.

  | Section | Purpose | Plans |
  | - | - | - |
  | **Workspace access tokens** | Create API keys for management operations in this workspace. Choose scopes, expiration, credit limits, and IP restrictions, or revoke a key. | **Business and Enterprise** |
  | **Log in with Lovable** | Register OAuth clients so users can authorize your app to access their Lovable accounts. Manage scopes, client secrets, and verification for sensitive scopes. | **All plans**. Sensitive scopes require **Business or Enterprise**. |

  See [Manage workspace API keys](/features/api-keys) and [Connect apps to Lovable with OAuth](/features/oauth-clients).
