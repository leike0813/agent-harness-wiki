excerpt: "Most app + chat connectors route through a **secure gateway** between your Lovable app and the third-party service. The gateway handles authentication automatically, keeps credentials out of your project, applies a per-project usage limit, and sends outbound traffic from a stable set of IP ranges. See [Integration security](/integrations/security#gateway-connectors) for the full details, and [Connector data flow](/integrations/security#connector-data-flow) for how data moves between your app and the third-party service."
