locator:
  kind: document_section
  heading: "Who can publish projects?"
official_url: "https://docs.lovable.dev/features/publish.md"
excerpt: |-
  By default, **editors and above** can publish projects on all plans.
  On **Enterprise plans**, admins and owners can restrict who is allowed to publish externally to the web. Go to [**Workspace settings → Security → Privacy & security → Who can publish externally**](https://lovable.dev/settings/privacy-security) and select:
  * **Editors and above** (the default)
  * **Admins and owners**
  * **Owners only**
  Only a workspace owner can select **Owners only** or change away from it.
