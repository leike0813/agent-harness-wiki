locator:
  kind: document_section
  heading: Limitations
official_url: "https://docs.lovable.dev/features/build-secrets.md"
excerpt: |-
  * Build secrets apply to the whole workspace. You cannot scope one to a single project or override it per project.
  * Build secrets are available only while a project builds. Your published app cannot read them at runtime, so runtime keys belong in [project secrets](/features/secrets).
  * Lovable cannot add, read, or change build secrets. A workspace owner or admin manages them in workspace settings.
