excerpt: |-
  Workspace owners and admins can also add [MCP registries](/integrations/mcp-registries), browsable directories of MCP servers that members connect from without entering URLs. Registries are managed in the **MCP registries** section, which appears both at the bottom of the [**Connectors**](https://lovable.dev/dashboard?connectors) page and in workspace settings under [**Workspace settings → Customization → Connector settings**](https://lovable.dev/settings/connectors). You can add one with **Add registry** in that section, or from the **+** button in the catalog header followed by **MCP registry**. Registries are only available while **Remote MCP connectors** is enabled.
