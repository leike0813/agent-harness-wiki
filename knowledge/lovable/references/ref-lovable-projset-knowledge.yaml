  heading: Knowledge tab
official_url: "https://docs.lovable.dev/features/projects/settings.md"
excerpt: |-
  The Knowledge tab is where you write your project's instructions and guidelines. Lovable follows them in every request, so use this tab to describe your product, audience, and preferences once instead of repeating them in the project chat. Anyone with edit access can update project knowledge, and the same tab shows your workspace-wide knowledge. The **Knowledge** section under **More** shows this project's knowledge only. See [Knowledge](/features/knowledge).
  Open the Knowledge tab from any of these places:
  * **Workspace settings → Knowledge**, under **Customization** in the workspace settings sidebar
  * **Project → Knowledge** in the **Chat actions** menu in the editor
  * **More → Workspace settings → Knowledge** in the project toolbar
