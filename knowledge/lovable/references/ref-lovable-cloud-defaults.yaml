harness_id: lovable
snapshot_id: snapshot-lovable-docs-cloud
locator:
  kind: document_section
  heading: Tool settings and defaults
official_url: "https://docs.lovable.dev/features/cloud.md"
excerpt: |-
  | Setting | Description | Default behavior |
  | - | - | - |
  | Enable Cloud | Create and connect a Cloud project to add backend features (database, auth, storage). Required to use Cloud tools. | Always allow |
  | Where project data is stored | Select the default region (Closest to me, Americas, Europe, or Asia Pacific) where new projects' data is stored. If Cloud is auto-enabled using Always allow, this region is used automatically. | Region closest to your location |
  | Read database | Allow Lovable to read your database. | Always allow |
  | Read analytics | Query logs to investigate issues and behavior. | Always allow |
  | Run security checks | Run automated security checks on your database. Not a full audit. | Always allow |
