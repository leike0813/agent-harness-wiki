  heading: Workspace-level default hosting region
official_url: "https://docs.lovable.dev/features/cloud.md"
excerpt: |-
  On **Business** and **Enterprise** workspaces, admins can set a required default region for every new project from [Privacy & security](https://lovable.dev/settings/privacy-security) (**Workspace settings → Security → Privacy & security → Default hosting region**). When a default hosting region is set, workspace members cannot choose a different region when creating a project. The setting applies only to new projects. Existing projects keep the region they were created in.
  **Country-specific regions** (for example, Germany, Japan, or United States East) can be enabled for Enterprise workspaces on request, subject to available capacity in that region. Contact your Lovable account team to discuss your requirements.
