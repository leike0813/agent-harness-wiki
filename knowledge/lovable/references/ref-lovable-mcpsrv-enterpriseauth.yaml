  <Note>
    On Lovable **Business and Enterprise**, an admin can enable [enterprise-managed authentication](/features/enterprise-managed-auth) so that members use Lovable from Claude through Okta without a separate Lovable sign-in. Claude requires a **Team or Enterprise** plan.
  </Note>

  The steps below connect your own Lovable account using OAuth. When you connect for the first time, your client opens a browser window to authenticate with your Lovable account and authorize access.
