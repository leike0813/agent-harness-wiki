locator:
  kind: document_section
  heading: "Which connection type do I need?"
official_url: "https://docs.lovable.dev/integrations/introduction.md"
excerpt: |-
  Use this table to pick the right connection type for what you're building:
  | Use | If you want to |
  | - | - |
  | [App + chat connector](/integrations/app-connectors) | Give your published app a capability every visitor shares, like posting to your team's Slack or reading a Google Sheet. Lovable can use the connection in the project chat and in [Chats](/features/chats) too. |
  | [Chat connector (MCP server)](/integrations/chat-connectors) | Let Lovable read your own Notion docs, Linear tickets, or Miro boards in the project chat and in [Chats](/features/chats), without sharing your account with anyone or your app. |
