  heading: "How this differs from Lovable's other MCP features"
official_url: "https://docs.lovable.dev/features/agent-integrations.md"
excerpt: |-
  Lovable uses MCP in three different ways, each connecting a different system for a different purpose. Agent integrations let AI assistants use the published app you built. They do not let an assistant edit the Lovable project itself. That is the Lovable MCP server, a separate feature.
  | Feature | Direction | What it does |
  | - | - | - |
  | **Agent integrations** (this page) | AI assistants use your app | Your users' assistants call the actions you expose in your published app |
  | [Lovable MCP server](/integrations/lovable-mcp-server) | AI tools build in Lovable | External AI tools create, edit, and manage your Lovable projects |
