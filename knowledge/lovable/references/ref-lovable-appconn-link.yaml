locator:
  kind: document_section
  heading: Link a connection to a project
official_url: "https://docs.lovable.dev/integrations/app-connectors.md"
excerpt: |-
  A connection does nothing on its own. Linking it to a project securely shares the credentials with that project, so Lovable and your published app can call the tool.
  You link a connection by asking Lovable in the project chat. Describe what you want the app to do, for example:
  ```text wrap theme={null}
  Connect Slack to this project and post a message to #new-signups whenever someone creates an account.
  ```
  Lovable links an existing connection you have access to, or walks you through creating one first, and then builds the feature. A connection you create from the project chat is private to you unless it uses the **Managed by Lovable** option. You can share it later from the connection's settings.
  Linking follows the connection's access rules.
