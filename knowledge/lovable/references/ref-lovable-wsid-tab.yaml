excerpt: |-
  | Section | What it does | Details |
  | :- | :- | :- |
  | **Verified domains** | Prove ownership of your company's email domains. Required for everything below. | [Verify a domain for your workspace](/features/verified-domains) |
  | **SSO providers** | Connect one SAML or OIDC identity provider, such as Okta, Auth0, or Microsoft Entra ID. | [Set up workspace single sign-on (SSO)](/features/business/sso) |
  | **Enforce SSO** | Require all workspace members to log in through your identity provider, and set the session duration. | [Set up workspace single sign-on (SSO)](/features/business/sso) |
  | **User provisioning** | Control how users with verified-domain emails join the workspace automatically. | This page, below |
