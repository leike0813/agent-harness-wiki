excerpt: |-
  ### Lifecycle

  * **Abandonment protection**: Keep this project out of your workspace's [abandoned projects](/features/privacy-and-security-settings#abandoned-projects) cleanup. A protected project is never marked abandoned and never deleted for inactivity. Disabled by default, Enterprise only, and changing it requires edit access to the project. See [Protecting a project from cleanup](/features/privacy-and-security-settings#protecting-a-project-from-cleanup).
