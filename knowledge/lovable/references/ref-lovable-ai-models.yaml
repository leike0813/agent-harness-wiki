  heading: Supported models for AI features in your app
official_url: "https://docs.lovable.dev/features/ai.md"
excerpt: |-
  <Note>
    These models are available for AI features inside the apps you build, such as chatbots, image and video generation, semantic search, voice, and typed decisions. They are not the models Lovable uses to write, edit, or reason about your code.
  </Note>
  When you ask Lovable to add or update an AI feature, you can name a supported model or describe what you want and let Lovable pick the right one. Each model links to its official source for technical details.
  Models marked **(deprecated)** keep working in apps that already use them, but Lovable does not use them when it builds new AI features. If you ask for a deprecated model, Lovable recommends a supported model instead. In **Connectors** → **AI**, deprecated models show a **Deprecated** badge.
  <Note>
