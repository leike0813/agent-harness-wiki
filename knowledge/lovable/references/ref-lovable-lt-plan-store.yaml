  heading: "Plans and persistence"
official_url: "https://docs.lovable.dev/features/plan-mode.md"
excerpt: "While you are working on a plan, it lives in `.lovable/plan.md`. When you approve it, Lovable moves that file into the `.lovable/plan/` folder as a dated file named after the plan, and `.lovable/plan.md` starts fresh for your next plan.\n\nYou can inspect both the current plan and the archived ones like any other project file.\n\n**Previous plans are not lost**. Approved plans stay in the `.lovable/plan/` folder, and every plan remains available in your **project chat history**, where it can be reopened in the Plan view for reference or comparison."
