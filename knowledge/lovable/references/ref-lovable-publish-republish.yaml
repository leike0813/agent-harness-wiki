  heading: Republish to make new changes live
official_url: "https://docs.lovable.dev/features/publish.md"
excerpt: |-
  Each time you publish, Lovable deploys a snapshot of your project to a live URL. Only the current version is deployed, and later changes are not automatically pushed live: when you keep working on a published project, republish to update your live app. To deploy new changes, click **Publish**, then **Publish changes**.
  Accepting a [draft](/features/drafts) is not publishing. When you accept a draft, its edits join your project's unpublished changes, and visitors see them only after you publish the project.
  When your published project has changes that are newer than the live version, a small dot appears on the **Publish** button. It tells you at a glance that you have updates to deploy, without opening the dialog. The dot clears once you publish.
