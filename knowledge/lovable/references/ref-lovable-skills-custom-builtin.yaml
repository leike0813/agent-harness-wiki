official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  The Skills page is split into two sections: **Workspace skills** and **Skills built by Lovable**.
  **Workspace skills** are custom skills added by your team. They are shared with every project in the workspace and follow the [permission rules](#role-based-access-for-skills) below. Skills you build in the project chat, write manually, import from GitHub, or upload as a ZIP appear here.
  **Skills built by Lovable** are maintained by Lovable and available in every workspace without setup. They cover common tasks, such as accessibility checks, redesigns, SEO reviews, skill creation, and video creation. **Goal**, which [sets a message as a goal](/features/goal-runs), is listed here too. You can use them when relevant, but you cannot edit, delete, or download them.
