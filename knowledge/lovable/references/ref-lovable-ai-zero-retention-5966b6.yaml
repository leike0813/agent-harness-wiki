excerpt: "Enterprise workspaces use only zero-data-retention models, which the provider does not store, unless a workspace admin enables [Extended-retention models](https://docs.lovable.dev/features/privacy-and-security-settings.md#extended-retention-models). The Claude models, GPT-6.1 Terra, Gemini Omni 1.1 Flash, and the ByteDance and TopazLabs models are not zero-data-retention models, so on Enterprise plans your app can use them only after an admin enables that setting and accepts its current terms."
