  ## Publishing policies

  **Available on:** Enterprise

  [Workspace policies](/features/workspace-policies) block publishing when a policy applies, or require an admin or owner to approve it. Requests appear in the [Action center](/features/action-center). Each policy has a switch, and all but **Block publishing from unverified domains** have a **Configure** button. A policy applies immediately to every way an app can be published.

