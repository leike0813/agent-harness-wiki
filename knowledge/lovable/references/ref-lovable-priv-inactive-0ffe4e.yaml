excerpt: |-
  **Available on:** Enterprise\
  **Default:** Marked inactive after 60 days; auto-delete off

  Automatically identify projects with no recent activity, published and unpublished, and optionally delete them after a grace period. Configure both controls from [Workspace settings → Security → Privacy & security → Security](https://lovable.dev/settings/privacy-security#security-automation), under **Inactive projects**.
