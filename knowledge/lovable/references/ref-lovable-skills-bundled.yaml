  heading: Bundled files
official_url: "https://docs.lovable.dev/features/skills.md"
excerpt: |-
  A skill can also include bundled files. These are optional extra files that travel with the skill. Use bundled files for longer references, templates, or small scripts that the instructions point to, such as `reference.md`.
  Bundled files appear in the **Bundled files** list when you expand the skill, and they are included when you download or import the skill. Skills authored in the project chat usually do not need bundled files. They are most common for skills imported from GitHub or a ZIP.
  Each bundled file can be up to **1 MB**. A skill can include up to **200 files** and up to **10 MB** total across all files.
