excerpt: |-
  > Lovable databases support a fixed set of PostgreSQL extensions. `query_database` refuses a `CREATE EXTENSION` statement for any other extension and returns this error with the list of supported extensions. Remove the statement and build the feature with plain SQL instead. See [Supported PostgreSQL extensions](/features/database#supported-postgresql-extensions).
