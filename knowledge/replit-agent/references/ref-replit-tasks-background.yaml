locator:
  kind: document_section
  heading: How background tasks work
official_url: "https://docs.replit.com/core-concepts/agent/task-system.md"
excerpt: |-
  Once accepted, tasks start running in isolated copies of your project. Starter does not support background tasks. Core runs 1 at a time, Pro supports up to 10, and Enterprise supports up to 64. Your main version stays untouched until you choose to apply changes.
  Agent handles conflict resolution automatically when applying changes from multiple tasks.
