  The Model selector offers the following models in Power Mode and Max Mode:
  | Model | Power Mode | Max Mode |
  | - | :-: | :-: |
  | GPT-6 Sol | ✓ | |
  | GPT-6 Luna Fast | ✓ | |
  | Claude Sonnet 5 | ✓ | |
  | Claude Sonnet 4.6 | ✓ | |
  | GPT-6 Astra | | ✓ |
  | Claude Fable 5.1 | | ✓ |
  | Claude Opus 5.5 | | ✓ |
  | Claude Opus 4.8 | | ✓ |
  | Claude Opus 5 | | ✓ |
  | Claude Opus 5 Fast | | ✓ |
  | Kimi K3 | | ✓ |
  <Note>
    Free Mode does not have a selectable model list. The list in your Model
    selector is the source of truth for your account. Model selection is rolling
    out, and the available models can vary by rollout, organization settings, and
    authorization. The **Fast** model variants require a Pro or Enterprise plan.
