excerpt: |-
  Checkpoints appear in multiple locations throughout the Project Editor:
  **Agent tab**: View all Agent-created checkpoints with descriptions and rollback options
  **Git pane**: See checkpoints as Git commits with full version control integration
  **History view**: In Agent chat, click the history icon <img class="icon-svg" src="https://mintcdn.com/replit/rJldsgYVucXB_6kW/images/icons/history.svg?fit=max&auto=format&n=rJldsgYVucXB_6kW&q=85&s=d2f027e7ef50dca743e80ed026c3f0ca" alt="history icon" width="24" height="24" data-path="images/icons/history.svg" /> to access a complete timeline of all checkpoints and their progression
