locator:
  kind: document_section
  heading: Enable intelligent model routing
official_url: "https://docs.replit.com/chat/auto-mode.md"
excerpt: |-
  1. In the prompt box, select **Agent Mode**. The menu shows the available modes: **Free**, **Power**, and **Max**.
  2. Select **Power** or **Max**, then find the **Primary model** section. Its label changes with the selected mode, such as **Primary Max model**.
  3. If the primary model is already **Auto**, intelligent model routing is enabled. If a specific model is selected, open the primary model menu and select **Automatically choose**.
  Free Mode always uses intelligent model routing and cannot select a model manually.
