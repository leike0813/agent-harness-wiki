  heading: Limitations
official_url: "https://docs.replit.com/features/collaboration/enterprise-model-controls.md"
excerpt: |-
  * Model policies apply to Workspaces. You cannot set a different policy for a user group in the same Workspace.
  * Intelligent Model Routing does not override account or Workspace policies. It cannot select a disabled provider or model.
  * The **Fast mode models** toggle in **Agent modes and model providers** controls access to fast model variants across every Workspace on the account. Provider policies and Intelligent Model Routing do not change that setting.
