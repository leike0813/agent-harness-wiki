  kind: document_section
  heading: Secrets versus configurations
official_url: "https://docs.replit.com/core-concepts/project-editor/app-setup/secrets.md"
excerpt: |-
  The **Secrets** tool has separate sections for secrets and configurations. Both let your project's code read values as environment variables without hard-coding them.
  | Type | Use for | Examples |
  | - | - | - |
  | **Secrets** | Sensitive information that must remain private | API keys, authentication tokens, and database connection strings |
  | **Configurations** | Non-sensitive settings | Log levels, feature flags, and public service URLs |
  Configurations are useful when a setting differs between testing on Replit and running your published project.
  Use a secret whenever a value contains credentials or other sensitive data.
