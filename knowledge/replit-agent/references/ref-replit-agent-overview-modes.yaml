official_url: "https://docs.replit.com/features/agent/overview.md"
excerpt: |-
  * **Free Mode**: No-cost everyday Agent work within your plan's allowance. The Core and Pro allowances reset every five hours and have weekly limits. The Starter tier keeps its existing limits. Check **Settings → Usage** to see your usage.
  * **Auto**: Automatic model selection for paid work in Power or Max on Core and Pro.
  * **Power**: A paid, mid-tier mode with powerful models at an affordable price.
  * **Max**: A paid, top-tier mode with the best frontier models for the most demanding work.
