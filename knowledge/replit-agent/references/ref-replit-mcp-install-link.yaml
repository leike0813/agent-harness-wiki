locator:
  kind: document_section
  heading: Share your own install link
official_url: "https://docs.replit.com/features/mcp/overview.md"
excerpt: |-
  Install links add your MCP server to Replit with a single click. Generate one with the form on [Connect via MCP](/build/connect-via-mcp#share-an-install-link), or build it yourself: base64-encode a JSON payload and append it to `https://replit.com/integrations?mcp=`.
  ```json theme={null}
  {
    "displayName": "My MCP Server",
    "baseUrl": "https://example.com/mcp",
    "headers": [{ "key": "Authorization", "value": "Bearer your-token" }]
  }
  ```
  * **displayName** — the name shown during installation
  * **baseUrl** — your MCP server's HTTPS endpoint
  * **headers** — optional authentication headers
