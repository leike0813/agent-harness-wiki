locator:
  kind: document_section
  heading: Create a custom connector
official_url: "https://docs.replit.com/features/integrations/custom-connectors.md"
excerpt: |-
  Select **Integrations** in the sidebar of your workspace. Open
      **Add custom**, then select **Add custom connector**.
  For an API that uses a bearer token, select **Bearer token** and enter the
      token without the `Bearer` prefix. Replit adds the prefix when sending a
      request.
