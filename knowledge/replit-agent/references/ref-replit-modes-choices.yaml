excerpt: |-
  > Learn how to choose between Free Mode, Power Mode, and Max Mode for your Agent builds.
  export const FreeModePlanAvailability = `Free Mode is available on the Starter, Core, and Pro plans. Your Free Mode limits depend on your plan, and Core and Pro include an allowance that refreshes every ${FreeModeAllowanceRefreshPeriod}.`;
  Agent modes let you control the balance between cost and capability when using Agent. Use the Agent settings dropdown to choose **Free Mode**, **Power Mode**, or **Max Mode**. Free Mode always uses intelligent model routing. In Power or Max, Core and Pro builders can select **Auto** to let Replit choose a model for each task. They can also use the [Model selector](/features/agent/model-selector) to choose a model manually.
