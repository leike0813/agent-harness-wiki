  heading: Manage account secrets
official_url: "https://docs.replit.com/core-concepts/project-editor/app-setup/secrets.md"
excerpt: |-
  Account secrets let you reuse credentials across your projects. Manage them in **Account Settings > Account Secrets**.
  To link account secrets to a project you own:
  1. Open the project's **Secrets** tool.
  2. Select the chain-link icon labeled **Link Account Secrets** in the header.
  3. Select the checkboxes beside the secrets you want to use.
  4. Select **Link to this App**.
  Linked secrets stay in sync with your account secrets. To remove a link, open the linked secret's options menu and select **Unlink**.
