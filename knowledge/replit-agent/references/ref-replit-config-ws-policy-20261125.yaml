  heading: Account policies and Workspace exceptions
official_url: "https://docs.replit.com/features/collaboration/workspace-settings.md"
excerpt: |-
  As an account admin, open **Settings → Advanced** to manage supported settings
  in one of three ways:

  * **Account-wide policy**: Apply a shared rule across Workspaces.
  * **Workspace exception**: Choose a different value for a specific Workspace.
  * **Workspace managed**: Let each Workspace's admins choose the value.

  An exception changes one Workspace's setting without changing the account-wide
  rule. Unlike an exception, delegation lets Workspace admins choose the value
  themselves.
