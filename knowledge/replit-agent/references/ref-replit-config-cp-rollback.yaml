  heading: How rollbacks work
official_url: "https://docs.replit.com/features/version-control/checkpoints-and-rollbacks.md"
excerpt: |-
  **Rollback** functionality allows you to restore your Replit App to any previous checkpoint state with a single click. This is far more powerful than traditional Git revert operations.
  <Frame>
    <img src="https://mintcdn.com/replit/0UCOQvZyQpUEM03B/images/replitai/checkpoint-rollback.png?fit=max&auto=format&n=0UCOQvZyQpUEM03B&q=85&s=f9594eb28458309b2759e8698b8535ce" alt="Checkpoint rollback interface showing rollback options" width="3154" height="2366" data-path="images/replitai/checkpoint-rollback.png" />
  </Frame>
  Rollbacks are designed to be safe and predictable:
  * **Non-destructive preview**: Some interfaces allow you to preview checkpoint states before rolling back
  * **Clear boundaries**: Each checkpoint represents a logical development milestone
