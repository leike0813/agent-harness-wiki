  heading: Connector and connection scope
official_url: "https://docs.replit.com/replitai/managing-connectors.md"
excerpt: |-
  Connector management is workspace-wide on Core and Pro, and organization-wide on Enterprise. Either way, each connection has its own owner and its own access scope.
  The **Scope** column on the **Integrations** page uses these values:
  * **Personal**: One member owns the connection.
  * **Workspace**: The workspace owns the connection. [Workspace access controls](/teams/identity-and-access-management/groups-and-permissions) can further limit who can use it.
  * **Workspace / Personal**: The integration has both workspace-owned and member-owned connections.
  * **Project**: The connection is tied to one project.
  * **Replit-managed**: Replit provides the integration without a workspace-owned or member-owned connection.
