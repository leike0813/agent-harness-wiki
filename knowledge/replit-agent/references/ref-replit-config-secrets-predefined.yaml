  heading: Predefined environment variables
official_url: "https://docs.replit.com/core-concepts/project-editor/app-setup/secrets.md"
excerpt: |-
  Replit automatically sets the following environment variables that you can access from your project's code:
  | Environment Variable | Description |
  | - | - |
  | `REPLIT_DOMAINS` | Comma-separated list of all domains associated with your Replit project |
  | `REPLIT_USER` | Username of the current editor, which may vary in Multiplayer sessions |
  | `REPLIT_DEPLOYMENT` | Set to `1` if the code is running in a published project, unset otherwise |
  | `REPLIT_DEV_DOMAIN` | Development URL on the `replit.dev` domain, which is different from the Deployment URL |
  These are not listed in the Secrets tool, but your project's code can read them like any other environment variable.
