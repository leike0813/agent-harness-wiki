  heading: Managing secrets visibility
official_url: "https://docs.replit.com/core-concepts/project-editor/app-setup/secrets.md"
excerpt: |-
  Secrets visibility depends on your access to a Replit project and whether you authored it.
  You can use one of the options to share your Replit project:
  * **Multiplayer**: Invite Replit users to collaborate in real-time
  * **Cover page**: Show a preview of your Replit project with the option to remix it
  * **Remix**: Make your individual or organization's Replit project public so others can create their version
  The following table shows secret name and value visibility in the different scenarios:
  | Access Method | Who | Can See Names | Can See Values |
  | - | - | - | - |
  | Multiplayer | Multiplayer collaborator | ✓ | ✓ |
  | Multiplayer | Organization member (Owner role) | ✓ | ✓ |
  | Multiplayer | Organization member (Non-owner) | ✓ | |
  | Cover Page | Any visitor | | |
