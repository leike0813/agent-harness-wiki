excerpt: |-
  Intelligent model routing is useful when you want Replit to handle model selection as the work changes. A focused request can use a lower-cost model, while a complex task may need a more capable model.
  In Power Mode or Max Mode, builders on Core and Pro can select an available model manually instead.
