  heading: Choose a model manually
official_url: "https://docs.replit.com/features/agent/model-selector.md"
excerpt: |-
  Builders on Core and Pro can choose an available model in Power Mode or Max Mode.
  1. In the prompt box, select **Agent Mode**. The menu shows the available modes: **Free**, **Power**, and **Max**.
  2. Select **Power** or **Max**, then find the **Primary model** section.
  3. Open the primary model menu, then choose a model from the list.
  <Frame caption="Power Mode selected in the Agent modes popover, with the Primary model list and Effort slider.">
