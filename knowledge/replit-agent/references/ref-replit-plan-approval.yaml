  heading: "2. Task approval and building"
official_url: "https://docs.replit.com/features/agent/plan-mode.md"
excerpt: |-
  When Agent creates a task plan:
  * **Review** the proposed plan
  * Select **Revise** to keep refining it, or **Cancel** to discard it
  * Select **Build here** to approve the plan and implement it in the current Agent session
  * Select **Build in background** to approve the plan and run it as a separate task
  After approval, Agent begins implementing the plan. Track progress in the current session or the background task.
  By default, background tasks wait for you to review and apply their changes. You can enable **Automatically apply changes** in the background build options.
  <Note>
    Before your project's first checkpoint, the approval button is **Start building** instead of the two build options.
  </Note>
  Plan mode usage follows the same effort-based pricing as other Agent interactions.
