excerpt: |-
  Secrets are available for all deployment types except Static Deployments.
  Open the **Secrets** tool from your project's tools pane:
  1. Open your project in the Project Editor.
  2. Select **Tools** at the top to open the tools pane.
  3. Find the **Setup** section and select **Secrets**.
