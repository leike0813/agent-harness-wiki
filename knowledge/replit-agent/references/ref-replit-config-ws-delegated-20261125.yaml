  heading: Manage delegated controls
official_url: "https://docs.replit.com/features/collaboration/workspace-settings.md"
excerpt: |-
  As a Workspace admin, open **Settings → Workspace settings** to manage supported
  controls that your account admin has delegated.

  * Change editable controls for your Workspace.
  * Controls labeled **Set by account policy** are locked at the Workspace level.
  * Ask an account admin to change a locked policy or configure a Workspace exception.
