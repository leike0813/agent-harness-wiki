excerpt: |-
  ### View session transcript
  To access the full transcript of the current session, including all previous prompts and the agent output, use the `Ctrl+O` shortcut. By default, Junie opens a continuously updated `transcript.md` file stored next to the session's `events.jsonl` file. Subagent transcripts are stored in the session's `subagents` folder ... Use `/settings` and change Show transcript to Terminal to open the built-in Transcript view instead.
