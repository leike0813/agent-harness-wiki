excerpt: |-
  ## Triggering events
  Junie fires `SessionStart`, `UserPromptSubmit`, `PreToolUse`, `Stop`, `PermissionRequest`, `StopFailure`, and `SessionEnd`.
  Hooks are currently triggered from the interactive TUI host (SessionStart, UserPromptSubmit, PreToolUse, Stop, StopFailure, SessionEnd, PermissionRequest) and the batch host (SessionStart, PreToolUse, Stop, StopFailure, SessionEnd). ACP and server hosts do not yet invoke any hooks.
