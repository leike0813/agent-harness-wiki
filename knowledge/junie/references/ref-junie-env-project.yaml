excerpt: |-
  ### Project and task
  JUNIE_TASK / --task — Task description in plain English.
  JUNIE_PROMPT / --prompt — Initial prompt for interactive mode.
  JUNIE_SYSTEM_PROMPT / --system-prompt — Process-local user guidelines added to the top-level issue agent alongside guidelines loaded from files such as `AGENTS.md`.
  JUNIE_PROJECT / -p, --project — Path to the project directory. Defaults to the current working directory.
