  heading: Managed launcher options
official_url: "https://junie.jetbrains.com/docs/parameters.html"
excerpt: |-
  ### Managed launcher options
  --channel=<name> — Run a build from the specified channel for this invocation without changing the default channel. Supported values: `release`, `eap`, `nightly`, and `experimental`.
  --use-version=<build> — Run a specific installed build.
  --force, -f — Reinstall the latest build of the current channel when used with `junie update`.
