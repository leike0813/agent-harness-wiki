excerpt: |-
  ## Select a proxy as the active provider
  If neither `config.json`, `--model`, nor a saved `/model` pick names a model, Junie picks the default from the models the proxy offers: the global default when the proxy serves it, otherwise the model behind the `opus`, `gpt` or `gemini-flash` alias for an `Anthropic`, `OpenAI` or `Google` proxy, otherwise the first non-deprecated model, then the first model in the list. Combined with `available-models`, this lets a gateway declare what it serves without choosing the default itself.
