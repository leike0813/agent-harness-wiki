  heading: Matcher entry fields
official_url: "https://junie.jetbrains.com/docs/junie-cli-hooks.html"
excerpt: |-
  ### Matcher entry fields
  | `matcher` | No | A regular expression matched against the event-specific value: the source for `SessionStart` (e.g. `startup`, `resume`, `clear`, `compact`), the reason for `SessionEnd`, or the tool name for `PermissionRequest` and `PreToolUse`. `UserPromptSubmit` and `Stop` do not support matchers — entries always run on every event. If omitted, the entry runs for every value. |
  | `hooks` | Yes | A list of hook commands to run when the matcher matches. |
