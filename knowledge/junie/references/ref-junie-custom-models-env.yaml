excerpt: |-
  ### Environment variables
  Use the `${VAR_NAME}` syntax in the `apiKey` field and inside `extraHeaders` values. Junie resolves each reference against the corresponding environment variable when it loads the profile.
  A reference must match `${NAME}`, where `NAME` starts with a letter or underscore. If a referenced environment variable is not set, the profile fails to load and Junie reports an error identifying the missing variable.
