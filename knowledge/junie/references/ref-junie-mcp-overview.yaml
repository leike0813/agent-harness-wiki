excerpt: |-
  ## Add and configure MCP servers
  You can connect Junie CLI to external tools via Model Context Protocol (MCP). Junie CLI uses the same MCP JSON configuration as Junie in JetBrains IDEs.
  The `/mcp` slash command shows the list of configured MCP servers and the MCP Installation Assistant.
  In ACP (Agent Client Protocol) clients, `/mcp` is a read-only listing: it shows local MCP servers (with runtime status and source) and any MCP servers the client passed at session init. To change local servers from ACP, edit `.junie/mcp/mcp.json`/`~/.junie/mcp/mcp.json`.
