excerpt: |-
  ### How Junie CLI uses subagents
  Junie CLI invokes subagents automatically, informing the user which subagent has started working on the task.
  The main agent discovers all available subagents, selects the relevant subagent by matching its `name` and `description` to the task at hand, runs it as a subtask, and brings the result back into the main session.
