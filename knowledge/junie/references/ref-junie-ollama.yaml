excerpt: |-
  ## Ollama
  Junie CLI can connect to a local Ollama server, automatically discover the models it serves, and make them available in the model picker.
  1. In an active Junie session, run the `/account` command.
  2. Open Custom models and endpoints.
  3. Select Ollama.
  4. Confirm or edit the Base URL. The default is `http://localhost:11434`.
  Junie probes the endpoint and adds every discovered model to the picker.
