  heading: Version control options
official_url: "https://junie.jetbrains.com/docs/parameters.html"
excerpt: |-
  ### Version control options
  --merge — Start a merge-conflicts resolution task between the current branch and the specified branch or commit.
  --rebase — Start a rebase-conflicts resolution task for the specified branch or commit.
  --review — Start a code review task. Can be combined with a task description.
