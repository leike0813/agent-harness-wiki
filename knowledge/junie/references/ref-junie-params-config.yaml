  heading: Configuration file options
official_url: "https://junie.jetbrains.com/docs/parameters.html"
excerpt: |-
  ### Configuration file options
  --config-location — Add an extra `config.json` file location. Can be specified multiple times.
  --config-default-locations — Enable or disable loading configuration from the default locations: `~/.junie/config.json` and `<project>/.junie/config.json`. Defaults to `true`.
