  heading: Add an MCP server from JSON configuration
official_url: "https://junie.jetbrains.com/docs/junie-cli-mcp-configuration.html"
excerpt: |-
  ### Add an MCP server from JSON configuration
  { "mcpServers": {
    "Context7": { "command": "npx", "args": ["-y", "@upstash/context7-mcp"], "env": { "ENV_VAR": "value" } },
    "RemoteServer": { "url": "https://mcp.example.com/v1", "headers": { "Authorization": "Bearer token" } }
  } }
  Manually added configurations are imported to the list of MCP servers and enabled by default.
