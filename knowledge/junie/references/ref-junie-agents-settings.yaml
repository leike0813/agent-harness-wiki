  heading: Configure subagent usage
official_url: "https://junie.jetbrains.com/docs/junie-cli-subagents.html"
excerpt: |-
  ### Configure subagent usage
  Use `/settings` → Subagents to choose the subagents model selection policy. The setting is saved in `~/.junie/settings.json` and applies to new sessions.
  | Mode | Behavior |
  | SameModelOnly | Junie CLI may use subagents only for independent work that can run in parallel and reduce elapsed time. Subagents always use the same model as the main agent. |
  | Auto | ... may choose cheaper capable model tiers for suitable delegated work ... This is the default mode. |
  The Subagents setting appears only when subagents are enabled in the current environment.
