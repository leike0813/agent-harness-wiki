excerpt: |-
  ## About the Ingrazzio proxy
  Ingrazzio is JetBrains' internal proxy protocol that Junie uses to communicate with LLM providers. The production Ingrazzio endpoint is `https://ingrazzio-cloud-prod.labs.jb.gg`.
  When Junie connects through an Ingrazzio proxy, it uses the base URL to access several sub-endpoints: LLM chat, web search (`/search`), URL extraction (`/extract`), and authentication (`/auth/test` and `/auth/reset`).
