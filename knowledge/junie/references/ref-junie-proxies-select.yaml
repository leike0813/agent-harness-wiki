excerpt: |-
  ## Select a proxy as the active provider
  To make Junie use a configured proxy, set the `provider` field to the proxy name. You can also override the provider at runtime with the `--provider` CLI flag: `junie --provider corp-proxy`.
  When a proxy is selected as the provider, Junie does not use JetBrains AI authentication.
