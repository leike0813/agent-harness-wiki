excerpt: |-
  ### PermissionRequest
  Junie fires `PermissionRequest` whenever it is about to show a permission dialog asking the user to approve a sensitive action. Hooks can suppress the dialog by automatically allowing or denying the action.
  A hook that exits successfully (exit code 0) without a blocking decision automatically approves the action — the permission dialog is skipped. A hook that blocks (exit code 2 or `decision: "block"`/`decision: "deny"`) automatically denies the action.
