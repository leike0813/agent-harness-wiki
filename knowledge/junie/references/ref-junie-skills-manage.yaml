excerpt: |-
  ### Manage skills with `/skills`
  - In the interactive TUI, `/skills` opens a management screen.
  - In ACP clients, `/skills` (with no arguments) re-scans the skill directories and prints a listing grouped into Enabled (each shown with the `/<skill-name>` command you can use to invoke it), Disabled, and Errors (skill folders that failed to load, with the reason).
  /skills <skill-name> enable / /skills <skill-name> disable
  Disabling a skill is persistent — the choice is remembered across sessions.
