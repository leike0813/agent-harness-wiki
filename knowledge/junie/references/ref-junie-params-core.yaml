excerpt: |-
  ### Core options
  --model — Specify the model to be used by Junie CLI.
  --project, -p — Specify the path to the project directory where Junie will run.
  --effort — Set the model reasoning effort level. Possible values: `low`, `medium`, `high`.
  --provider — Select the BYOK provider to use.
  --guidelines-filename — Name or path of a custom guidelines file.
  --task / --prompt / --resume / --plan / --brave
