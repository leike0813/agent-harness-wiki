excerpt: |-
  ### Troubleshooting
  - Junie selects skills based on task relevance. If a skill isn't being used, it may not match the current task, or its description may be too vague or generic.
  - Check for name conflicts: if a project-level and a user-level skills have the same name, the user-level skill will be skipped.
  - Verify the SKILL.md file format is followed: proper YAML formatting (no tabs, correct indentation), the YAML frontmatter starts with `---`, contains at least the `name` field, and ends with `---`.
