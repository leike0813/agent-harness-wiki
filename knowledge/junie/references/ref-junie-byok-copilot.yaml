excerpt: |-
  ## GitHub Copilot
  Unlike other BYOK providers that require an API key, GitHub Copilot authenticates through the GitHub Copilot CLI installed on your machine — Junie CLI reuses its sign-in and resolves the available models and endpoint from it.
  - GitHub Copilot CLI version `1.0.65` or newer.
  - The Copilot CLI must be signed in with a GitHub account that has an active GitHub Copilot subscription.
  - The models you want to use must be explicitly enabled in your GitHub Copilot settings.
