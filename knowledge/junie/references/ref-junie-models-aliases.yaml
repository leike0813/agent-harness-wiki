excerpt: |-
  ## Model selection
  JUNIE_MODEL / --model — LLM model to use. If not specified, Junie uses the `Default` model — a dynamically set option with the best price-quality ratio.
  JUNIE_LLM_PROVIDER / --provider — Possible values: `openai`, `anthropic`, `google`, `xai`, `openrouter`, `copilot`, `litellm`.
  JUNIE_EFFORT / --effort — Possible values: `minimal`, `low`, `medium`, `high`, `xhigh`, `max`.
  Model aliases include `sonnet`, `opus`, `gpt`, `gpt-codex`, `gemini-pro`, `gemini-flash`, `grok`.
