official_url: "https://junie.jetbrains.com/docs/junie-cli.html"
excerpt: |-
  ### Action Allowlist
  When Junie CLI stops for user approval, you can select the → Always allow option to add the indicated command to the Action Allowlist. Once on the Action Allowlist, the command will always be executed without user approval in the future Junie CLI runs.
  The full list of allowed commands and command patterns is stored in the `~/.junie/allowlist.json` file. You can also edit this file manually to add or remove allowed or restricted commands and patterns.
