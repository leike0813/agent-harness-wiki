excerpt: |-
  ## How Junie uses models internally
  Junie also uses a separate model for certain internal tasks such as summarizing context, classifying and routing tasks, extracting information for memory, filtering capabilities, and other helper tasks. Junie automatically picks an alternative from the same provider. If your primary model is from Anthropic, the helper model will typically be Claude Haiku; if it's from Google, it will be Gemini Flash.
