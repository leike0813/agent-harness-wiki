excerpt: |-
  ## Enable ACP mode in Junie CLI
  To run Junie CLI in ACP mode, use the `--acp` flag:
  junie --acp true
  When Junie CLI is connected to a JetBrains IDE for the same project, you can also use the `/ide` command to inspect the current JetBrains IDE connection state.
