  heading: Install an extension
official_url: "https://junie.jetbrains.com/docs/junie-cli-extensions.html"
excerpt: |-
  ## Install an extension
  1. Run `/extensions` to open the extensions screen.
  2. Browse the catalog of available extensions across all registered marketplaces, or use search.
  3. Select an extension and choose the installation scope:
     - Project scope: The reference is stored in `.junie/extensions.json` at the root of the project.
     - User scope: The reference is stored in `~/.junie/extensions/extensions.json`.
  Extension content (skills, agents, commands, MCP configs, guidelines, hooks) is downloaded once into the user-level cache directory `~/.junie/extensions/<marketplace>/<extension>/`.
  Newly installed extensions become available within the running session — there is no need to restart Junie CLI.
