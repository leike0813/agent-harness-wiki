  heading: SessionEnd
official_url: https://junie.jetbrains.com/docs/junie-cli-hooks.html
excerpt: 'In the interactive TUI, switching away from a session — via /new, a /history selection, or any other session switch — does not end the outgoing session: it continues running in the background and its SessionEnd hook is not fired on the switch. SessionEnd is dispatched only when the session actually terminates (prompt_input_exit, logout, or other for batch).'
