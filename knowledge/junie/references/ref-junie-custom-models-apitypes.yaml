excerpt: |-
  ### Supported API types
  The `apiType` field controls which request format Junie uses when calling the endpoint.
  | `OpenAICompletion` | OpenAI Chat Completions API (`/v1/chat/completions`). |
  | `OpenAIResponses` | OpenAI Responses API (`/v1/responses`). |
  | `Google` | Google Gemini API format. |
  | `Anthropic` | Anthropic Messages API format. |
