excerpt: |-
  ### Add an MCP server
  4. Select the server connection type:
     - Local: run on your machine (Docker, npx, or binary).
       Junie CLI starts an MCP server instance locally, e.g. using the npx command or via Docker.
  In a trusted project, configured local servers start from the project root. In an untrusted project, user-scope servers can still start. Junie CLI runs them from an isolated directory or Junie Home outside the project. Relative paths in local server commands resolve from the server's working directory.
