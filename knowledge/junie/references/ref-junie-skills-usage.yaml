excerpt: |-
  ### How Junie CLI uses skills
  Junie CLI invokes agent skills automatically. It scans the skill folders and selects the skills that are relevant to the current task.
  You can also invoke a skill explicitly:
  - As a slash command: every enabled skill is advertised as a `/<skill-name>` command.
  - As a prompt reference: type `$<skill-name>` inside your prompt to reference a skill.
  Disabled skills are excluded from automatic selection, from the `/<skill-name>` commands, and from the `$` suggestions, and their instructions are not added to Junie's context.
