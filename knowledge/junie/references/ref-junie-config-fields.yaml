locator:
  kind: document_section
  heading: Supported configuration fields
official_url: "https://junie.jetbrains.com/docs/junie-cli-configuration.html"
excerpt: |-
  ### Supported configuration fields
  Fields include `model`, `effort`, `provider`, `brave`, `flags`, `mcp-locations`, `mcp-default-locations`, `skill-locations`, `skill-default-locations`, `command-locations`, `command-default-locations`, `agent-locations`, `agent-default-locations`, `model-locations`, `model-default-locations`, `auto-update`, `guidelines-location`, `byok`, `proxies`, `hooks`.
  Relative paths in `config.json` are resolved relative to the folder that contains that configuration file.
