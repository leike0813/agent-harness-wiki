locator:
  kind: document_section
  heading: Where extensions are stored
official_url: "https://junie.jetbrains.com/docs/junie-cli-extensions.html"
excerpt: |-
  ## Where extensions are stored
  | `~/.junie/extensions/` | Base directory for cached extension content. |
  | `~/.junie/extensions/extensions.json` | User-scope configuration. |
  | `~/.junie/extensions/marketplaces.json` | Registry for registered marketplace repositories and their sync status. |
  | `.junie/extensions.json` | Project-scope configuration; can be committed to VCS. |
  The legacy `url` field is kept populated for git sources so older Junie versions can still downgrade-read the config.
  --extensions-default-location overrides the default extensions directory (`~/.junie/extensions`), also via JUNIE_EXTENSIONS_DEFAULT_LOCATION.
