excerpt: |-
  ## Use arguments in the command prompt
  You can use special keywords `$argumentName` in the prompt text to pass parameter values when invoking the custom slash command. For example `/explain file=src/main.kt`.
  To also accept free-form text, add `allowPromptArgument: true` to the command's YAML frontmatter. This exposes an additional `$prompt` argument.
