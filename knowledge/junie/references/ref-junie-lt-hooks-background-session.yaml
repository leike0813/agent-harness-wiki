excerpt: 'On /new or any other interactive session switch, the outgoing session is not terminated — it continues running in the background, so its SessionEnd hook is not dispatched on the switch. Only the incoming session''s SessionStart hook fires (with source: clear for a fresh /new, source: resume for a cold-loaded resumed id).'
