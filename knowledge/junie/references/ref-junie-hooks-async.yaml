  heading: Run hooks in the background
official_url: "https://junie.jetbrains.com/docs/junie-cli-hooks.html"
excerpt: |-
  ## Run hooks in the background
  By default, a hook blocks the triggering action until it completes. For long-running tasks set `"async": true` on the hook command to run it in the background while the agent keeps working.
  - `decision`, `permissionDecision`, and `continue` in the hook's output have no effect ... They are logged and ignored.
  - `systemMessage` is shown in the TUI ...
  - `additionalContext` is queued in memory and prepended to the agent prompt on the next user submit.
