excerpt: |-
  ## Add commands to Action Allowlist
  You can manually add or remove allowed commands by editing the `~/.junie/allowlist.json` file.
  There are five types of actions that can be allowed with the `allowlist.json` file:
  - `fileEditing`
  - `executables`
  - `mcpTools`: usage of Model Context Protocol (MCP) tools.
  - `readOutsideProject`
  - `readSecretFile`
  { "defaultBehavior": "ask", "allowReadonlyCommands": true, "rules": { "executables": { "rules": [ { "prefix": "git", "action": "allow" } ] } } }
