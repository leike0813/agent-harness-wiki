excerpt: |-
  ### System options
  --acp — Enable Agent Client Protocol (ACP) mode for IDE/editor integrations.
  -c, --cache-dir — Specify a custom path to the directory where Junie CLI will store caches.
  --agent-mode — Set the initial agent mode (`classic` or `chat`) for newly created sessions.
  -h, --help / --version
