excerpt: |-
  ## LLM providers
  Junie supports four types of LLM providers:
  - Junie — models accessed through a JetBrains AI subscription, by means of a Junie login or a JetBrains AI API key.
  - BYOK (Bring Your Own Key) — models accessed using your own API key from a third-party provider such as OpenAI, Anthropic, Google, xAI, OpenRouter, or GitHub Copilot.
  - Custom — models defined in a custom profile JSON file.
  - Proxy — models accessed through a custom proxy endpoint configured in `config.json`.
  When a model is available through multiple providers, Junie prefers the Junie provider by default. Use `--provider` to override this behavior.
