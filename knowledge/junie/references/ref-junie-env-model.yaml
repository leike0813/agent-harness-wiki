  heading: Model selection
official_url: "https://junie.jetbrains.com/docs/environment-variables.html"
excerpt: |-
  ### Model selection
  JUNIE_MODEL / --model — LLM model to use. If not specified, Junie uses the `Default` model.
  JUNIE_LLM_PROVIDER / --provider — BYOK provider to use. Possible values: `openai`, `anthropic`, `google`, `xai`, `openrouter`, `copilot`, `litellm`.
  JUNIE_EFFORT / --effort — Reasoning effort level for models that support it.
