official_url: "https://junie.jetbrains.com/docs/custom-proxies.html"
excerpt: |-
  ## Limitations
  - The `Ingrazzio`, `Bedrock`, `OpenAI`, `Google`, and `Anthropic` proxy kinds are currently supported. The `JetBrainsAI` and `OpenRouter` kinds are reserved for future use and fail when selected as the active provider.
  - Proxy configuration is only available through `config.json`. There are no dedicated CLI flags for defining proxy entries.
