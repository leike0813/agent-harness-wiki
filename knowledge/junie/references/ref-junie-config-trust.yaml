excerpt: |-
  ### Project trust
  Interactive Junie CLI sessions ask for a trust decision before loading project configuration from a project that has no valid stored trust marker:
  1. Keep untrusted — continue with isolated temporary project Junie storage.
  2. Trust this project — trust only the canonical project directory.
  3. Trust all projects in `<parent>`.
  An untrusted project remains the workspace for ordinary file operations, but Junie does not implicitly load project configuration, MCP servers, hooks, extensions, models, plans, demos, custom agents or commands, skills, root or project Junie guidelines, project memory, or automatic migration/onboarding sources.
