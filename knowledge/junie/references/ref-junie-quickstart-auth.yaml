excerpt: |-
  ### Step 3: Authenticate
  On the Junie welcome screen, select one of the available authentication options:
  - Continue with JetBrains account ... you'll be redirected to the Junie login page in your browser.
  - Use a Junie API key ... you'll be prompted to provide an access token. To generate your `JUNIE_API_KEY` access token, go to junie.jetbrains.com/cli.
  - Use your own API key (OpenAI, Anthropic, Google, xAI, OpenRouter, GitHub Copilot)
  - Use custom models and endpoints
