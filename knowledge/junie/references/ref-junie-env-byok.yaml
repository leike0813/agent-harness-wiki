  heading: Provider API keys
official_url: "https://junie.jetbrains.com/docs/environment-variables.html"
excerpt: |-
  ### Provider API keys
  Use these variables to authenticate directly with a specific LLM provider (BYOK). Only the key for the provider of your selected model is required.
  JUNIE_ANTHROPIC_API_KEY / --anthropic-api-key
  JUNIE_OPENAI_API_KEY / --openai-api-key
  JUNIE_GOOGLE_API_KEY / --google-api-key
  JUNIE_GROK_API_KEY / --grok-api-key
  JUNIE_META_API_KEY / --meta-api-key
  JUNIE_OPENROUTER_API_KEY / --openrouter-api-key
  JUNIE_LITELLM_URL / --litellm-url
  JUNIE_LITELLM_API_KEY / --litellm-api-key
