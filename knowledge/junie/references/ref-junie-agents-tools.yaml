excerpt: |-
  ### Supported tool groups
  Built-in tool group labels:
  | `Read` | Read-only file viewing actions (open/scroll). |
  | `Bash` | Running shell commands in the local environment. |
  | `Glob` | Searching for files by path pattern. |
  | `Grep` | Searching for text by regular expression. |
  | `Write` | Creating new files. |
  | `Edit` | Modifying existing files. |
  | `WebSearch` | Searching the web. |
  | `AskUserQuestion` | Asking the user for input or a choice. |
  If the `tools` field is present and non-empty, only the specified groups are allowed, with the rest being banned by default.
