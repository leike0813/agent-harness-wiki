official_url: "https://junie.jetbrains.com/docs/custom-llm-models.html"
excerpt: |-
  ### Top-level parameters
  | `id` | Yes | The model identifier as expected by the API endpoint (for example, `gpt-4o` or `qwen3-coder:latest`). |
  | `baseUrl` | Yes | The full URL of the LLM API endpoint. |
  | `displayName` | No | A human-friendly name shown for this profile. Defaults to the profile identifier (the filename). |
  | `providerName` | No | A provider label shown next to this profile's model name. |
  | `apiType` | Yes | The API format to use when communicating with the endpoint. |
  | `apiKey` | No | The API key for authenticating with the endpoint. Supports environment variable references. |
  | `extraHeaders` | No | A key-value map of additional HTTP headers. |
  | `extraBody` | No | A JSON object merged into the body of every request. |
