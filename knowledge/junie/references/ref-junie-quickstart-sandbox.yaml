excerpt: |-
  ### Sandbox mode
  Sandbox mode wraps every agent-issued terminal command in an OS-level sandbox (sandbox-runtime, `srt`) ... Enable it at launch with `junie --sandbox`, or toggle it mid-session with the `/sandbox` slash command. ... The policy is stored in `~/.junie/sandbox.json` ... Only the global `~/.junie/sandbox.json` is used; a project-local `.junie/sandbox.json` is ignored (with a warning).
