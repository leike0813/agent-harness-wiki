  heading: Supported proxy kinds
official_url: "https://junie.jetbrains.com/docs/custom-proxies.html"
excerpt: |-
  ## Supported proxy kinds
  | `Ingrazzio` | Supported | Junie's native proxy protocol. This is the default when `kind` is omitted. |
  | `Bedrock` | Supported | Anthropic models served through an AWS Bedrock-compatible gateway. |
  | `OpenAI` | Supported | OpenAI-compatible API. |
  | `Google` | Supported | Google Gemini-compatible API. |
  | `Anthropic` | Supported | Anthropic-compatible API. |
  | `JetBrainsAI` | Not supported | Reserved for future use. |
  | `OpenRouter` | Not supported | Reserved for future use. |
