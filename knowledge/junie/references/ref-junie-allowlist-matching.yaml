excerpt: |-
  ## How commands are matched
  A rule allows a terminal command only when every command it runs is allowed:
  - Chained commands: each part of a command like `cd ./src && ls` is checked separately.
  - Nested commands: commands inside a substitution are checked too, at any nesting depth.
  - Multi-line commands: a command that spans several lines always asks for approval.
  Rules are evaluated top to bottom, with the first match taking precedence.
