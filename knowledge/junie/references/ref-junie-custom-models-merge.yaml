  heading: Merging logic
official_url: "https://junie.jetbrains.com/docs/custom-llm-models.html"
excerpt: |-
  ### Merging logic
  - Simple fields (`id`, `baseUrl`, `apiKey`, `apiType`, `temperature`, `maxContextLength`) are replaced by the override value when present.
  - Headers (`extraHeaders`) are merged: headers defined in the override are added to the top-level headers.
  - Body fields (`extraBody`) are merged recursively.
