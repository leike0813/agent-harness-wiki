  heading: Configure a proxy
official_url: "https://junie.jetbrains.com/docs/custom-proxies.html"
excerpt: |-
  ## Configure a proxy
  Add a `proxies` array to your `config.json`. Each entry describes a named proxy endpoint:
  { "proxies": [ { "name": "my-proxy", "kind": "Ingrazzio", "api-url": "https://ingrazzio-cloud-prod.labs.jb.gg", "headers": [ "Authorization: Bearer <your-token>" ] } ] }
  When using a custom proxy, JBA authentication is bypassed — you must supply any required credentials through the proxy's `headers` field.
