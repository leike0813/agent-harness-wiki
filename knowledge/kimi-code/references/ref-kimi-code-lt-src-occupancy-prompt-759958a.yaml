  export function showSessionOccupancyPrompt(
    host: SessionOccupancyHost,
    prompt: SessionOccupancyPrompt,
  ): void {
    if (prompt.retried) {
      showSessionTakeover(host, prompt);
    } else {
      showSessionOccupied(host, prompt);
    }
  }
