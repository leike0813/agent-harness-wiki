excerpt: |-
  private async openWorkdir(
    environment: (EnvironmentBinding & { readonly cwd: string }) | undefined,
    workDir: string,
  ): Promise<WorkdirWithMcp> {
    const mcp = await this.acquireMcp();
    try {
      const workdir = await this.connectWorkdir(environment, workDir);
      return {
        ...workdir,
        mcp: mcp.service,
        dispose: () => {
          mcp.dispose();
          workdir.dispose();
        },
      };
    } catch (error) {
      mcp.dispose();
      throw error;
    }
  }
