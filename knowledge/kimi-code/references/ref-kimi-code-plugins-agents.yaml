  heading: Plugin Agents
official_url: "https://github.com/MoonshotAI/kimi-code"
excerpt: |-
  A plugin can ship custom agents: declare one or more `./` directories in the manifest's `agents` field (or simply place an `agents/` directory under the plugin root). The agent files inside use the same format as [custom agents](./agents.md#custom-agents) and, while the plugin is enabled, are discovered automatically and can be delegated to as sub-agents by the main Agent.
  ```text
  my-plugin/
    kimi.plugin.json
    agents/
      reviewer.md
  ```
  Plugin agents rank below every other file source: on a name collision, user-level, extra, project-level, and `--agent-file` agents all win over the plugin-provided one, and replacing a built-in agent still requires an explicit `override: true` in the frontmatter.
