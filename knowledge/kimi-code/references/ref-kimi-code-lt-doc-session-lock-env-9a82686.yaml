excerpt: |-
  | `KIMI_CODE_SESSION_LOCK` | Whether this process takes the cross-process session lock that stops two Kimi Code processes from writing the same session at once. Unset keeps it on. A lock recorded under a different hostname is reclaimed automatically. When sharing a session directory across machines or containers, allow only one instance to write or turn this setting off; turning it off brings back pre-lock behavior, so concurrent writers can interleave the session history | Truthy: `1`/`true`/`yes`/`on`; falsy: `0`/`false`/`no`/`off`; any other value is ignored |
