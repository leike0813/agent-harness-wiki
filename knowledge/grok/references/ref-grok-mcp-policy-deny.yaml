excerpt: "**Deny wins.** A server that matches `deniedMcpServers` is blocked even if it also matches `allowedMcpServers`. If `allowedMcpServers` is present, every unlisted server is blocked; a present but empty list (`allowed_mcp_servers = []`) blocks every server the file binds, so do not ship it as a scaffold. A deny-only file blocks the listed servers and leaves the rest alone (an empty deny list is harmless). Across layers, a server must pass **every** restricted source."
