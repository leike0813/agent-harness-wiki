schema_version: 2
record_kind: production
reference_id: ref-grok-providers-enterprise
harness_id: grok
snapshot_id: snapshot-grok-repo
locator:
  kind: document_section
  heading: Enterprise deployment
official_url: "https://github.com/xai-org/grok-build"
excerpt: |-
  A complete config for enterprise use:
  ```toml
  [cli]
  auto_update = false
  [auth]
  auth_provider_command = "/usr/local/bin/my-company-auth-provider"
  auth_provider_label = "Acme Corp"
  auth_token_ttl = 3600
  [models]
  default = "company-grok"
  [model.company-grok]
  model = "grok-4.6"
  base_url = "https://grok-proxy.acme.com/"
  name = "Grok 4.6 (Proxy)"
  context_window = 128000
  [features]
  telemetry = false
  ```
  ---
