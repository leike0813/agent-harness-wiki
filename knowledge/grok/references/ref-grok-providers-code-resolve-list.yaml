  pub fn resolve_models_list_url(&self) -> String {
          if let Some(ref url) = self.models_list_url {
              return url.clone();
          }
          let base = self
              .models_base_url
              .clone()
              .unwrap_or_else(|| self.proxy_url());
          format!("{}/models", base)
      }
  }
