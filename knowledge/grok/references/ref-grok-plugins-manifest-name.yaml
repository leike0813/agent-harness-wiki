excerpt: |-
  /// Regex pattern for valid plugin names: lowercase alphanumeric and hyphens.
  fn is_valid_plugin_name(name: &str) -> bool {
      !name.is_empty()
          && name.len() <= MAX_PLUGIN_NAME_LEN
          && name
              .bytes()
              .all(|b| b.is_ascii_lowercase() || b.is_ascii_digit() || b == b'-')
          && !name.starts_with('-')
          && !name.ends_with('-')
  }
