locator:
  kind: document_section
  heading: "Fleet allowlist (`requirements.toml`)"
official_url: "https://github.com/xai-org/grok-build"
excerpt: |-
  Enterprise hosts can pin the **selectable** set — not only the default — in signed `requirements.toml`. That list **replaces** any user `allowed_models` (it is not a union), so `/model`, `Ctrl+M`, and `-m` cannot offer models outside it.
  ```toml
  [models]
  default = "grok-4.5"
  allowed_models = ["grok-4.5", "grok-4*"]
  ```
  A fleet pin matches the **model id** (not a user-chosen catalog key), so a local `[model.<name>]` entry cannot widen the set. User-config `allowed_models` still matches catalog key or model id. Omit the key to leave user config standing. An empty array is unrestricted. A present-but-unreadable pin fail-closes (nothing selectable).
