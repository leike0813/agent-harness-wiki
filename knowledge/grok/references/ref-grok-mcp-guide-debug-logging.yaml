  ### Debug Logging
  ```bash
  RUST_LOG=debug GROK_LOG_FILE=/tmp/grok.log grok
  tail -f /tmp/grok.log
  ```
  Look for log entries containing `mcp` to trace server startup, tool discovery, and tool call execution.
