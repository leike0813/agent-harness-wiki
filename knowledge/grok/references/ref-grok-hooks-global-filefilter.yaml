  /// Discovery filename filter: `*.json`, not hidden, not editor temps.
  pub fn is_direct_hook_json_name(name: &str) -> bool {
      if !name.ends_with(".json") || name.len() <= 5 {
          return false;
      }
      if name.starts_with('.') {
          return false;
      }
      if name.ends_with('~') || name.ends_with(".swp") || name.ends_with(".swo") {
          return false;
      }
      true
  }
