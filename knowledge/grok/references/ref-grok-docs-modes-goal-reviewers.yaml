excerpt: |-
  * **When the goal looks done**, a panel of reviewer subagents checks the work against the evidence. The goal is marked complete only when most of them agree.
  * **If the reviewers find gaps**, Grok keeps working on them. If it gets stuck on the same gaps, it pauses and shows you what's missing.
