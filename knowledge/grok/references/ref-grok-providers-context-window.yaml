  heading: Context Window
official_url: "https://github.com/xai-org/grok-build"
excerpt: "The `context_window` value tells Grok when to trigger auto-compaction. When you override a known model, Grok inherits that model's context window. When you define a new model and omit `context_window`, Grok defaults to 200,000 tokens, so set it explicitly to match your provider."
