  heading: Legacy Shape and Template Variables
official_url: "https://github.com/autohandai/code-cli"
excerpt: |-
  The original event-keyed shape is still accepted: any key under `hooks` other than `enabled` and `hooks` is treated as an event name whose value is a command string, an array of command strings, or an array of definition objects. Legacy names such as `on_file_change`, `before_tool_call`, and `on_session_end` map onto the lifecycle events, and `{{file}}`-style placeholders in any command are replaced before it runs.
