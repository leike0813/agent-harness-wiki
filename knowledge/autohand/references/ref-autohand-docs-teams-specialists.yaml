  heading: Add specialists from the sub-agent catalog
official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/agent-teams.md"
excerpt: |-
  If the right teammate is not installed, Autohand can search the default [awesome-sub-agents catalog](https://github.com/autohandai/awesome-sub-agents), propose an exact match, and add the approved definition to the team in the same session.
  **Availability:** Catalog discovery and installation require Autohand Code `0.9.3` or newer. Run `autohand --version` to check.
  Describe the expertise you need instead of guessing catalog names:
  ```bash
  autohand -p "Bring a team of UI design, security review, and API design specialists. \
  Search the sub-agent catalog for missing roles, install exact matches, \
  create the team, and delegate the work."
  ```
  Autohand searches by role, category, tools, and use case.
