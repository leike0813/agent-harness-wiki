locator:
  kind: document_section
  heading: Use the same lifecycle inside a session
official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/extensions/cli-extensions.md"
excerpt: |-
  ```text
  /extensions list
  /extensions show autohand.code-health
  /extensions validate ./path/to/extension --json
  /extensions install ./path/to/extension --scope project --link --trust
  /extensions doctor
  /extensions disable autohand.code-health
  /extensions enable autohand.code-health
  /extensions remove autohand.code-health --yes
  ```
  The slash command calls the same extension service as the top-level CLI. Successful mutations refresh declarative and runtime registrations in the active session, so stale tools, agents, skills, commands, UI, hooks, providers, and policy do not survive disable or removal.
