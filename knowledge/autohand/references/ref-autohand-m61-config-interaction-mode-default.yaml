excerpt: "| `defaultInteractionMode`    | `\"default\"`, `\"plan\"`, `\"automode\"` or `\"yolo\"` | `\"automode\"` | Mode an interactive terminal session starts in. Auto mode runs without approval prompts; set `\"default\"` to be asked before risky actions. `--plan`, `--yolo`, `--restricted`, `--dry-run`, `--unrestricted`, `--yes` and a `restricted` or `external` `permissions.mode` take precedence, and command, RPC and ACP runs are never switched to auto mode |"
