excerpt: "export async function withFileLock<T>(\n  lockPath: string,\n  operation: () => Promise<T>,\n  options: FileLockOptions = {},\n): Promise<T> {\n  const lease = await acquireFileLock(lockPath, options);\n  if (!lease) {\n    throw new FileLockTimeoutError(lockPath);\n  }\n  try {\n    return await operation();\n  } finally {\n    await lease.release();\n  }\n}"
