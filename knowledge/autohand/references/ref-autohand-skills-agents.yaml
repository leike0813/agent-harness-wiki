  heading: Skills in Sub-Agents and Teammates
official_url: "https://github.com/autohandai/code-cli"
excerpt: "Skills are not limited to the lead session. Every delegated sub-agent and every teammate process receives the skills registry, sees declared skills in its system prompt, and can list, inspect, activate, and deactivate skills with the `skill` tool. Activation state is per agent, so activating a skill inside a reviewer does not change the lead's prompt. Agent definitions name their starting skills with a `skills:` frontmatter line; see [Skills per Agent](teams-with-agents.md#skills-per-agent)."
