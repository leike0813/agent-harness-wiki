  heading: Definition options
official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/hooks-and-events.md"
excerpt: |-
  Every definition accepts `description`, `enabled`, `timeout` (milliseconds, default 5000), `async`, a regex `matcher`, and a `filter` with `tool` and `path` arrays. Use them to scope a hook and to keep slow work off the agent's critical path.
  ```json
  {
    "hooks": {
      "hooks": [
        {
          "event": "file-modified",
          "command": "npm test -- --findRelatedTests {{file}}",
          "filter": {
            "path": [
              "src/**/*"
            ]
          },
          "timeout": 30000
        },
        {
          "event": "file-modified",
          "command": "npm run build",
          "filter": {
            "path": [
              "src/**/*"
            ]
          },
          "async": true
        }
      ]
    }
  }
  ```
