excerpt: |-
  | Exit code | Meaning |
  |---|---|
  | 0 | Success. A JSON response on stdout is parsed if present. |
  | 2 | Blocking error. Execution stops and the stderr message is reported. |
  | Other | Non-blocking error. Logged, but execution continues. |
