official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/extensions/extension-api.md"
excerpt: |-
  ```text
  company.release-helper/
    autohand.extension.json
    README.md
    src/
      extension.ts
    dist/
      extension.mjs
    tools/
      release-range.json
    agents/
      release-planner.md
    skills/
      release-workflow/
        SKILL.md
  ```
  Only files declared in `autohand.extension.json` contribute capabilities. Source, README, license, tests, fixtures, and bundled dependencies may live beside them, but Autohand neither discovers undeclared capabilities nor compiles TypeScript or installs dependencies during extension installation.
