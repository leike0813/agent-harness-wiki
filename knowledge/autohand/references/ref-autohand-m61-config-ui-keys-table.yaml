excerpt: "| `toolOutput`                 | `\"compact\"` or `\"full\"` | `\"compact\"` | How tool results appear in the interactive transcript. `compact` shows the first 3 lines of a result (the last 5 of a failure) followed by `+ N lines (ctrl+o to expand)`; press Ctrl+O or click above the composer to open the latest result, and again to close it. Diffs also use a preview. Expanded results stay within a portion of the terminal; use Page Up/Page Down to read the remaining rows while keeping the composer available. `full` prints results as before. The model, hooks, RPC and ACP clients always receive the complete output, and `--prompt` runs always print it |"
