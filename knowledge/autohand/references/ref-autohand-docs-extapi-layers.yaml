excerpt: "The **declarative safe layer** loads reviewed data contracts for tools, agents, and Agent Skills without importing package code. Add a trusted runtime only when the extension needs native slash commands, Ink UI, status or help content, keybindings, CLI flags, hooks, providers, or permission policy. Runtime installation requires `--trust` and executes compiled JavaScript inside the Autohand process."
