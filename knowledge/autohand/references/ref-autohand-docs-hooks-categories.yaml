excerpt: |-
  Autohand Code emits events across the whole session. The most common categories are listed below; the [Hooks Reference](https://docs.autohand.ai/working-with-autohand-code/hooks#events) lists every event.
  | Category | Example events | Use case |
  |---|---|---|
  | Session | session-start, session-end, pre-clear | Initialize context and send wrap-up notifications. |
  | Prompt and turn | pre-prompt, stop | Screen instructions and monitor token usage per turn. |
  | Tool | pre-tool, post-tool | Log tool usage, gate shell commands, and validate results. |
  | File | file-modified | Run linters, formatters, and related tests. |
  | Permission and notification | permission-request, permission-denied, notification | Automate approval decisions and surface system alerts. |
