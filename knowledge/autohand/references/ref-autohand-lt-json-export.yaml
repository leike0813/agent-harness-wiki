excerpt: "export function exportToJson(\n  metadata: SessionMetadata,\n  messages: SessionMessage[],\n  pretty = true\n): string {\n  const data = {\n    metadata,\n    messages,\n    exportedAt: new Date().toISOString(),\n    version: '1.0',\n  };\n\n  return pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data);\n}"
