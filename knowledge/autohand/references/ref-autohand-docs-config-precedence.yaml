excerpt: "Explicit CLI flags control the current process. For persistent settings, the project overlay is merged over the selected user config, then supported environment variables override API and provider fields. A feature-specific runtime flag such as `--no-idle-logout`, `--offline`, or `--no-browser` applies last for that run."
