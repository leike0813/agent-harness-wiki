  heading: Inspect and manage installed packages
official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/extensions/cli-extensions.md"
excerpt: |-
  ```bash
  autohand extensions list
  autohand extensions list --scope project --json
  autohand extensions show autohand.code-health
  autohand extensions doctor
  autohand extensions disable autohand.code-health
  autohand extensions enable autohand.code-health
  autohand extensions remove autohand.code-health --yes
  ```
  `show` reports id, version, description, scope, state, linked/copied status, trust, package root, and active tools, agents, skills, and runtime entrypoints. `doctor` reports invalid state, manifests, contributions, package directories, unreadable roots, name conflicts, missing trust, and runtime activation failures.
  Removal prompts in a top-level interactive terminal. Non-interactive removal must include `--yes`. The `remove` command also accepts the `uninstall` alias.
