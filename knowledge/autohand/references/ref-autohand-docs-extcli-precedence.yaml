locator:
  kind: document_section
  heading: Precedence and failure behavior
official_url: "https://docs.autohand.ai/docs-md/working-with-autohand-code/extensions/cli-extensions.md"
excerpt: |-
  1.  Built-in tools, agents, skills, commands, providers, CLI flags, and reserved keybindings cannot be replaced.
  2.  Existing standalone meta-tools and user or external agents remain ahead of declarative extension contributions.
  3.  A project package replaces the same user extension id as one whole package.
  4.  Package ids and contribution names are processed deterministically.
  5.  Invalid, incompatible, unsafe, or conflicting packages contribute nothing and appear in `doctor`.
  6.  Disabled packages remain inspectable but contribute no declarative or runtime capabilities.
  One broken extension does not stop Autohand Code from starting. Discovery fails closed at the package boundary, so a partially valid extension never partially activates.
