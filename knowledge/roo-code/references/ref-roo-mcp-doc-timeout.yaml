official_url: "https://github.com/RooCodeInc/Roo-Code"
excerpt: |-
  To set the maximum time to wait for a response after a tool call to the MCP server:
  1. Click the `Network Timeout` pulldown at the bottom of the individual MCP server's config box and change the time. Default is 60 seconds (1 minute) but it can be set between 1 second and 3600 seconds (1 hour).
  <img src="/img/using-mcp-in-roo/using-mcp-in-roo-6.png" alt="Network Timeout pulldown" width="400" />
