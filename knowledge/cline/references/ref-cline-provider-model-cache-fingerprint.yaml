  function fingerprint(value: string): string {
  	let hash = 2166136261;
  	for (let i = 0; i < value.length; i += 1) {
  		hash ^= value.charCodeAt(i);
  		hash +=
  			(hash << 1) + (hash << 4) + (hash << 7) + (hash << 8) + (hash << 24);
  	}
  	return (hash >>> 0).toString(16);
  }
