  function getWorkspaceSkillDirectories(workspacePath?: string): string[] {
  	if (!workspacePath) {
  		return [];
  	}
  	return [
  		DEPRECATED_CONFIG_DIR,
  		CLINE_CONFIG_DIR,
  		CLAUDE_CONFIG_DIR,
  		LEGACY_AGENT_SKILLS_CONFIG_DIR,
  	].map((dir) => join(workspacePath, dir, SKILLS_CONFIG_DIRECTORY_NAME));
  }