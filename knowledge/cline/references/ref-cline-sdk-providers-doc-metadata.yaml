  heading: Model Metadata
official_url: "https://github.com/cline/cline"
excerpt: |-
  Models expose metadata for selection and cost calculations:
  ```typescript
  interface ModelInfo {
    id: string
    name?: string
    contextWindow?: number
    maxTokens?: number
    pricing?: {
      input?: number
      output?: number
      cacheCreation?: number
      cacheRead?: number
    }
    capabilities?: Record<string, unknown>
  }
  ```
