  heading: Open your workspace settings
official_url: "https://support.bolt.new/settings/workspace-settings.md"
excerpt: |-
  You can open your workspace settings from the Bolt homepage or from inside a project.
  1. In the left sidebar, click **your avatar**, then click **Settings**.
     <Frame>
       <img className="block mx-auto" src="https://res.cloudinary.com/dlq2nawz5/image/upload/f_auto,q_auto/v1784311265/settings-button_av0zpc.png" alt="The Bolt homepage with the account selection menu expanded and the Settings button highlighted." />
     </Frame>
  2. In the left navigation menu, find your workspace settings. For individual accounts, they're under the label `Workspace`. For team accounts, they're under the team name, like `exampleco`.
