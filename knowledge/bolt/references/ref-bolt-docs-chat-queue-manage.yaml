  heading: Manage queued prompts
official_url: "https://support.bolt.new/building/chat-tools.md"
excerpt: |-
  * **Edit a queued prompt**: Hover over the prompt, then click **Edit message** (pencil icon). Bolt won't process the prompt while you're editing, but other queued prompts continue in order.
  * **Reorder queued prompts**: Click and drag a queued prompt (using the grip icon) to a new position in the list to change the order Bolt works through them.
  * **Delete a queued prompt**: Hover over the prompt, then click **Remove from queue** (trash can icon). You can only delete prompts you queued yourself. Collaborators can't delete each other's prompts.
