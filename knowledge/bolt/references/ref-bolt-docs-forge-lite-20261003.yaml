locator:
  kind: document_section
  heading: "What's included with Lite"
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  Lite doesn't include the following features:

  * Building with the [Standard and Max agents](/building/using-bolt/agents). Lite only gives you access to Forge.
  * [Generating AI images](/building/images#generate-ai-images).
  * Running a [security scan](/building/security) of your project.
  * Managing your database connection through [Supabase](/integrations/supabase). Lite only supports Bolt's built-in database.
  * Connecting a [custom domain](/cloud/domains/connect).
  * Buying extra usage if you run out early.
  * Removing the **Made in Bolt** badge from your site.
