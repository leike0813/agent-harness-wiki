  heading: Queue prompts
official_url: "https://support.bolt.new/building/chat-tools.md"
excerpt: |-
  You can send prompts while Bolt is building. Bolt adds them to a queue and works through them in order once the current prompt finishes. Each prompt starts with the finished result of the one before it, so Bolt is always building on your latest changes.
  You can queue up to 20 prompts, but you'll only see the first 5 in the chat at a time. Scroll the list to see the rest. Each queued prompt keeps the [agent](/building/using-bolt/agents) you chose for it.
  ### Manage queued prompts
  * **Edit a queued prompt**: Hover over the prompt, then click **Edit message** (pencil icon). Bolt won't process the prompt while you're editing, but other queued prompts continue in order.
