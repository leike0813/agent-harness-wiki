  heading: Pause the queue
official_url: "https://support.bolt.new/building/chat-tools.md"
excerpt: |-
  Click **Pause** at any time to stop the queue from advancing. Bolt finishes the prompt it's currently processing, but it won't automatically start the next queued prompt. Click **Resume** when you're ready for Bolt to continue.
  If you click **Stop** on the prompt Bolt is currently processing, this also pauses the whole queue until you resume it.
  Any new prompts you send while others are queued are added to the bottom of the list. If you need Bolt to work on a prompt immediately, pause the queue, drag that prompt to the top of the list, then resume. There's no way to send a prompt that bypasses the queue.
