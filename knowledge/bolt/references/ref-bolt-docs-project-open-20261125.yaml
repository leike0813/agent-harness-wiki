excerpt: |-
  * **From inside a project**: At the top left of the screen, click your project name, then click **All project settings**.

    This opens the General settings page. You can navigate to other project settings using the left sidebar.

  **On mobile:** From inside your project, tap your project's name, and then tap **Project settings**. To open the General settings page, tap **All project settings**.
