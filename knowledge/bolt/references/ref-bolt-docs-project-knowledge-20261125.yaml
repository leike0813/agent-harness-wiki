excerpt: |-
  To add project knowledge:

  1. [Open your project settings](#open-your-project-settings), then in the left sidebar, click **Knowledge**.

  2. In the **Project instructions** field, type your instructions. For example: `Don't use Bolt Database. This app uses my existing API at https://api.example.com.`

     If the field already has text, like instructions from the starter template Bolt used for your project, add yours on a new line.

  3. Click **Save prompt**.

     A `Project prompt updated` message appears.

  Bolt includes your changes starting with the next prompt you send. Viewers can see project knowledge, but only [Editors and Co-owners](https://support.bolt.new/collaboration/sharing.md#access-by-role) can change it.
