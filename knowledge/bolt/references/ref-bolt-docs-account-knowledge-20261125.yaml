excerpt: |-
  Add background instructions for Bolt to follow **across all of your projects**, like goals, style expectations, terminology, constraints, and workflow habits. Bolt includes account knowledge with every prompt you send, so you don't need to repeat these details in each prompt.

  To add account knowledge:

  1. [Open your account settings](#open-your-account-settings), then in the left sidebar, click **Knowledge**.
  2. In the **Global instructions** field, type your instructions.
  3. Click **Save prompt**.

     A `System prompt updated` message appears.

  Bolt includes your changes starting with the next prompt you send.
