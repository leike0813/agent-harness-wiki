excerpt: "Use **Select** to target a specific element in your app's preview. The element is added to the chatbox to focus your prompt on that part of the interface. You can also test changes to UI text, formatting, spacing, and other changes in the preview before sending them for Bolt to code. To learn more about editing UI elements, see [Make visual edits](/building/visual-edits)."
