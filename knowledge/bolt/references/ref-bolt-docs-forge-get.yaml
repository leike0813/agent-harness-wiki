  heading: Get Bolt Forge
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  You can get access to Forge in two ways:
  * It's [included at no extra cost](#get-forge-automatically-as-part-of-your-pro-plan) with every individual Pro plan.
  * You can [join the waitlist](#join-the-waitlist-to-get-access-through-bolt-lite) to get access through Bolt Lite, a new standalone plan that costs \$9 a month.
  <Info>
    Forge isn't available on Teams or Enterprise plans.
  </Info>
  ### Get Forge automatically as part of your Pro plan
  If you're on an individual Pro plan, or if you sign up for one during the Forge preview, Bolt Forge is included at no additional cost until the preview ends.
  To start using Forge, select **Bolt Forge** in the agent picker and accept the terms before sending a prompt. To learn how to switch agents, see [Choose an agent](/building/using-bolt/agents).
