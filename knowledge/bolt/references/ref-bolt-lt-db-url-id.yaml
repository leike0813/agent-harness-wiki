excerpt: "export async function getUrlId(db: IDBDatabase, id: string): Promise<string> {\n  const idList = await getUrlIds(db);\n\n  if (!idList.includes(id)) {\n    return id;\n  } else {\n    let i = 2;\n\n    while (idList.includes(`${id}-${i}`)) {\n      i++;\n    }\n\n    return `${id}-${i}`;\n  }\n}"
