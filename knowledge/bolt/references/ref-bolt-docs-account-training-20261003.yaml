excerpt: |-
  Controls whether Bolt can use your projects and chats to train AI models. Default is *on*, except for accounts based in the EU, UK, or Switzerland, where it's off by default.

  This setting applies to content you create in Bolt on or after October 7, 2026, including older content you submit to one of Bolt's AI features (for example, by prompting Bolt in an existing project) on or after that date.

  Turning this setting off doesn't affect your plan. You can turn it off or back on whenever you want.

  To learn more about how Bolt handles your data, see the [Privacy Policy](https://stackblitz.com/privacy-policy).
