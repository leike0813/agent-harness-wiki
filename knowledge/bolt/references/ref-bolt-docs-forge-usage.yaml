  heading: Track your Forge usage
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  Your Forge usage shows as a percentage bar on the Subscription & Tokens page in your settings. Your usage allocation resets to 100% once a month, on your Forge renewal date (the day of the month you signed up for Forge).
  There's no daily limit to your Forge usage.
  If you're on a Pro plan:
  * Every individual Pro plan gets the same Forge allowance, regardless of which Pro tier you're on.
  * Bolt Forge usage is separate from your Standard and Max usage. Building with Forge doesn't affect your regular usage, and building with Standard or Max doesn't affect your Forge usage.
  To check your remaining Forge usage:
  1. Log in to Bolt.
  2. On the Bolt homepage, in the sidebar, click your profile icon in the bottom-left, then click **Subscription**.
