  heading: Display token usage in chat
official_url: "https://support.bolt.new/settings/account-settings.md"
excerpt: |-
  Controls whether your remaining token balance shows in your project's chat. Default is *off*.

  When this setting is off, Bolt still shows your remaining balance in chat when you're running low on tokens, and you can dismiss that message.

  Bolt shows only your remaining token balance, not how many tokens each prompt used. To see what one prompt used, compare your balance before and after Bolt responds to it.
