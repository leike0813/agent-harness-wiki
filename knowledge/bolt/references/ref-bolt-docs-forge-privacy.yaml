  heading: Data privacy with Forge models
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  When you use Bolt Forge, your prompts, code, project files, configuration, tool calls, edit histories, and any fix traces Bolt creates are de-identified, then stored and used by Bolt's partners to train open-source AI models. The first time you switch to Forge, you have to agree to this.
  Sessions from the EEA, UK, and Switzerland aren't used for training or included in datasets.
  If you stop using Forge, switching to a different agent only stops new data from being collected going forward. Data already collected isn't automatically removed. To request removal, email [privacy@stackblitz.com](mailto:privacy@stackblitz.com).
