  heading: Open your workspace settings
official_url: "https://support.bolt.new/settings/workspace-settings.md"
excerpt: |-
  You can open your workspace settings from the Bolt homepage or from inside a project.

  * **From the Bolt homepage**: In the sidebar, click your account or workspace name, then click **Settings** (gear icon).

    For individual accounts, workspace settings appear in the left sidebar under the label `Workspace`. For team accounts, they're under the team name, like `exampleco`.

  * **From inside a project**: In the top menu, click your profile icon, then click **Settings**. Navigate to other workspace settings using the left sidebar.
