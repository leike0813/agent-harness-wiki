  heading: Use dictation
official_url: "https://support.bolt.new/building/chat-tools.md"
excerpt: |-
  To talk to Bolt instead of typing, start dictation from the chatbox or use a keyboard or mouse shortcut. You can also combine dictation with typing in the same prompt.
  <Note>
    To record your prompt, Bolt needs access to your microphone. If your browser asks for permission, click **Allow**.
  </Note>
  You can use dictation in three ways:
  * In the chatbox, click **Dictate** (microphone icon). When you're done, click **Stop recording** or press `ENTER`.
  * On your keyboard, press and hold `CTRL`+`SHIFT`+`D` while you talk. When you're done, release the keys.
  * With your mouse, right-click and hold while you talk. When you're done, release the mouse button.
  While you're recording, the chatbox shows that Bolt is listening, and a sound level meter moves as you speak.
