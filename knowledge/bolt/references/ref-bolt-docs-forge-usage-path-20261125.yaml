  heading: Track your Forge usage
official_url: "https://support.bolt.new/account/bolt-forge.md"
excerpt: |-
  To check your remaining Forge usage:

  1. Log in to Bolt.
  2. On the Bolt homepage, in the sidebar, click your account or workspace name, then click **Subscription** (credit card icon).
  3. In the left sidebar, click **Billing & usage**, then check your Forge usage bar.
