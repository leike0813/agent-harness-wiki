excerpt: |-
  ### Manage members

  Manage your team members and their roles. To learn more about related tasks, see [Manage your team](https://support.bolt.new/teams/manage-team.md).

  Team members who aren't admins see this page as **Team**, where they can view the members of the team.

  ### Team settings

  > [!NOTE]
  >
  > The Team settings page is only available to team admins.

  Control team-wide settings such as the default member role, publishing, integrations, and data exports. To learn more, see [Team settings](https://support.bolt.new/settings/team-settings.md).
