schema_version: 2
record_kind: production
reference_id: ref-bolt-repo-bindings
harness_id: bolt
snapshot_id: snapshot-bolt-repo
locator:
  kind: file_lines
  file: bindings.sh
  start: 1
  end: 16
official_url: "https://github.com/stackblitz/bolt.new"
excerpt: |-
  #!/bin/bash
  bindings=""
  while IFS= read -r line || [ -n "$line" ]; do
    if [[ ! "$line" =~ ^# ]] && [[ -n "$line" ]]; then
      name=$(echo "$line" | cut -d '=' -f 1)
      value=$(echo "$line" | cut -d '=' -f 2-)
      value=$(echo $value | sed 's/^"\(.*\)"$/\1/')
      bindings+="--binding ${name}=${value} "
    fi
  done < .env.local
  bindings=$(echo $bindings | sed 's/[[:space:]]*$//')
  echo $bindings
