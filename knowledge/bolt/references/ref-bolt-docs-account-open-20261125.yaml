  heading: Open your account settings
official_url: "https://support.bolt.new/settings/account-settings.md"
excerpt: |-
  You can open your account settings from the Bolt homepage or from inside a project.

  * **From the Bolt homepage**: In the sidebar, click your account or workspace name, then click **Account settings**.

    On a personal workspace, **Settings** (gear icon) in the same dropdown also opens account settings. On a team workspace, use **Account settings**, because **Settings** (gear icon) opens team settings instead.

  * **From inside a project**: In the top menu, click your profile icon, then click **Settings**.

    This opens the General settings page. Navigate to other account settings using the left sidebar.
