  kind: document_section
  heading: "What is Bolt Forge?"
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  Forge is an [agent](/building/using-bolt/agents), similar to Bolt's existing Standard and Max agents. When using Forge, you can select from leading open-source AI models, including:
  * GLM 5.3
  * GLM 5.3 Flash
  * Kimi K3
  * DeepSeek v4 Pro
  <Note>
    Kimi K3 and DeepSeek v4 Pro use your Forge usage faster than GLM 5.3 and GLM 5.3 Flash.
    If you're not sure which model to use, we recommend GLM 5.3 Flash. It's fast, smart, and token-efficient, so it's a good choice for most tasks.
    Usage estimates for Forge (up to 50x more, compared with Standard) are based on GLM 5.3 Flash, so your usage adds up faster if you build with a different model.
  </Note>
  New open-source models are added to Forge as they become available.
