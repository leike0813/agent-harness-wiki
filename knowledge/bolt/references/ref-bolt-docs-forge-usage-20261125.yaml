  heading: Track your Forge usage
official_url: "https://support.bolt.new/account/bolt-forge.md"
excerpt: |-
  Your Forge usage shows as a percentage bar on the Billing & usage page in your settings. Your usage allocation resets to 100% once a month, on your Forge renewal date (the day of the month you signed up for Forge).

  There's no daily limit to your Forge usage.
