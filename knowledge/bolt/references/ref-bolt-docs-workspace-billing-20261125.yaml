excerpt: |-
  Review your token usage and billing details in one place, including current usage, remaining balance, and the date your tokens refresh. You can also [upgrade your plan](https://support.bolt.new/account/billing.md#upgrade-your-free-plan-to-a-paid-plan) or adjust your billing settings.

  If you have a paid plan, the **Billing details** section lets you update your payment method, view your billing history, change your plan, and cancel or resume your subscription.

  On a team account, team admins also see the team's next invoice, the next token refill, and a **Token consumption** table that shows each member's token balance. Team members who aren't admins see a **Usage** page that shows their own token usage.
