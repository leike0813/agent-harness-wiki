  heading: Switch to a Forge model
official_url: "https://support.bolt.new/account-and-subscription/bolt-forge.md"
excerpt: |-
  Forge appears as an option in the agent picker. You can [choose an agent](/building/using-bolt/agents) from the chatbox, either on the home page or within a project.
  <Note>
    Forge's open-source models are experimental and can be less reliable than Standard or Max.
    If your project is important, we recommend you [duplicate it](/building/using-bolt/projects-files#duplicate-a-project) before editing it using Forge, so you have something to go back to if needed.
    For Pro users, we also recommend using Standard or Max for complex work.
  </Note>
  To switch to a Forge model and send a prompt:
  1. In the agent picker, click **Bolt Forge**, then click the model you want to use.
  2. Enter and send your prompt.
