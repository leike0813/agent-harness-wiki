excerpt: |-
  Add background instructions for Bolt to follow in all projects created in the team. Bolt includes team knowledge with every prompt sent in the team's projects. Only team admins can change team knowledge.

  To add team knowledge:

  1. [Open your workspace settings](#open-your-workspace-settings), then in the left sidebar under your team name, click **Knowledge**.
  2. In the text field, type your instructions.
  3. Click **Save prompt**.

     A `Team prompt updated` message appears.

  Bolt includes your changes starting with the next prompt sent in the team.
