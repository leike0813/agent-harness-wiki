  heading: Standard compliance
official_url: "https://commandcode.ai/docs/skills"
excerpt: |-
  Command Code fully implements the Agent Skills open standard. Skills you create are:
    * **Portable** : Work with any agent that supports the standard
    * **Versionable** : Track changes with Git
    * **Shareable** : Publish for your team or community
    * **Auditable** : Plain text files anyone can read
  Validation follows the standard strictly - including the rule that a skill's `name` must match its directory name. Skills that break a rule are skipped with a categorized warning (visible in `/skills` and `cmd skills list --debug`) rather than failing the session, and a missing or empty `description` always prevents loading.
