excerpt: "`~/.commandcode/projects/{project}/config.json` holds machine-written state for each project you use Command Code in - currently taste onboarding progress (`tasteOnboarding`: completed/skipped flags, learned and skipped sessions, last learning date). It lives in your home directory, not the repository, and Command Code manages it entirely - you never need to edit it."
