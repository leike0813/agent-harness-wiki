  heading: Invoking a skill
official_url: "https://commandcode.ai/docs/skills"
excerpt: |-
  Command Code supports three ways to use a skill in a conversation. Pick whichever matches the task at hand.
  Type `/skill-name` at the start of your prompt to run that skill for the current turn:
  `# In Command Code session /pr-desc update the description based on new changes `
  Every skill also answers to the namespaced form `/skill:<name>`, which never resolves to anything but a skill:
  `# In Command Code session /skill:changelog # the changelog skill, not the built-in /changelog /skill changelog # same thing, space instead of colon /skill: # browse every skill in the menu `
  Reach for it when a skill's name is taken by a built-in or custom command - see What happens on a collision.
