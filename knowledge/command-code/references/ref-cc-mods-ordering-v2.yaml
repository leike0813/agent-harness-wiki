locator:
  kind: document_section
  heading: Ordering guarantees mod authors can rely on
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  - Every hook receives `ModContext` (`{emit, signal, cwd, session?}`) as its LAST argument. ...
  - `beforeToolCall` completes (for every mod) **before** `tool_running` is emitted. Its `input` rewrites chain across mods, but the `tool_queued` event fired with the ORIGINAL input ...
  - `afterToolCall` completes **before** `tool_completed` / `tool_errored` is emitted ...
  - `afterToolCall`'s `modState` is committed right after the batch's tool-result message is appended - BEFORE `onTurnEnd` runs ...
  - `shouldStopAfterTurn` is evaluated **after** the turn commits ...
  - Mods run in **registration order** ... the built-ins come first and caller mods last ...
  - Hooks **never throw** upward: the runner catches per-mod, per-hook. ... Every catch site ALSO emits a `mod_error {modId, hook, error}` ...
