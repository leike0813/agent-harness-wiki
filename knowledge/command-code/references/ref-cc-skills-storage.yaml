  heading: Storage locations
official_url: "https://commandcode.ai/docs/skills"
excerpt: |-
  Command Code fully implements the Agent Skills open standard with two storage locations:
  Stored in `~/.commandcode/skills/` and available across **all your projects**.
  Perfect for:
    * General development workflows
    * Exploratory workflows
    * Cross-project best practices
  Stored in `.commandcode/skills/` within your project and **only available in that project**.
  Perfect for:
    * Project-specific patterns
    * Team conventions
    * Architecture guidelines
    * Domain-specific workflows
  Note
  Learn more about how to create user-level and project-level skills in the Create skills section below.
  Command Code also discovers skills from `.agents/skills/` (project) and `~/.agents/skills/` (user).
