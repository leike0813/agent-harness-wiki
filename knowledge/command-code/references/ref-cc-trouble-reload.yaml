locator:
  kind: document_section
  heading: "A command, mod, or skill I installed isn't loading"
official_url: "https://commandcode.ai/docs/troubleshooting/common-issues"
excerpt: |-
  **Problem:** You added a new skill, mod, or keybinding on disk, but the running session doesn't see it.
  **Solution:** Run `/reload` to reload the current session. It picks up newly installed skills, mods, and keybindings without restarting Command Code.
