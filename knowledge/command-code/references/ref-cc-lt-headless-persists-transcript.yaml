excerpt: |-
  Each headless run persists its transcript to disk, so you can chain follow-up queries that keep prior context. Headless sessions are tagged separately and stay <strong>hidden</strong> from the interactive <code>/resume</code> menu and from interactive <code>--continue</code> - automation never pollutes your interactive history.</p>
