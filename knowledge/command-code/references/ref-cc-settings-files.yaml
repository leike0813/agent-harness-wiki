locator:
  kind: document_section
  heading: The files at a glance
official_url: "https://commandcode.ai/docs/settings"
excerpt: |-
  `USER ~/.commandcode/ ├── config.json your preferences ├── settings.json hooks, permissions, MCP ├── auth.json credentials · don't edit ├── providers.json custom BYOK providers ├── keybindings.json key overrides ├── mcp.json user-scope MCP servers ├── cron/jobs.json scheduled jobs · managed └── projects/{project}/ ├── config.json per-project state  └── mcp.json local MCP servers  PROJECT <project>/ ├── .commandcode/ │ ├── settings.json commit this │ └── settings.local.json gitignore this └── .mcp.json commit this `
  No file is created just by launching Command Code. Files appear the first time something is written - your first model or theme change creates `config.json`, and approving a command for a project creates `settings.local.json`. Until then, built-in defaults apply.
