  heading: Packaging and install
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  A mod starts life as a loose file in `~/.commandcode/mods/`. When it should be shared - with a team, or the world - it becomes a **package** : an npm package, a git repo, or a local directory that `cmd mods add` installs and Command Code loads on every session.
  `cmd mods add cmd-mod-hi # bare name = npm package cmd mods add @team/review-mod@1.2.0 # scoped npm name, pinned (npm: prefix optional) cmd mods add owner/repo@v1 # GitHub shorthand (any git host via git:<host>/…) cmd mods add ./tools/local-mod # local path, referenced in place cmd mods add -g owner/repo # user scope instead of project cmd mods list # alias: cmd mods ls cmd mods update # reinstall missing, reconcile pinned refs (alias: up) cmd mods remove owner/repo # alias: cmd mods rm cmd mods remove fun-stuff # by the name `mods
