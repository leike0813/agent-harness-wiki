  heading: CLI flags
official_url: "https://commandcode.ai/docs/reference/cli"
excerpt: |-
  Customize Command Code's behavior with the following flags.
  **Option**| **Description**| **Example**
  ---|---|---
  `cmd`| Start interactive session| `cmd`
  `cmd "message"`| Start with initial message| `cmd "fix login redirect"`
  `-r`, `--resume [name]`| Resume a session by id or name, or pick from history (`--sessions` is an alias)| `cmd --resume`
  `-c`, `--continue`| Continue the most recent session in the current directory| `cmd --continue`
  `--session <path|id>`| Resume a session by transcript path (`.jsonl`) or a unique session-id prefix| `cmd --session 01hx`
  `--fork-session`| With `--resume`/`--continue`, fork the session into a new one (original left untouched)| `cmd --resume --fork-session`
