  heading: Trust and safety
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  - **There is no sandbox.** A mod is code that runs with your permissions, so only install packages you trust.
  - **Inspect before you trust.** `cmd mods inspect <path>` reads a mod's source without importing it, and lists the hooks it registers, what it adds, and what it can reach: processes, the network, the filesystem, the environment, permission answers, and transcript rewrites. It only reads the text, so code the mod imports or builds at runtime can reach further, and the report says so.
  - **Kill switches.** `cmd --safe-mode` loads only built-in mods for one session (no installed mods, no `--mod`). `{"mods": {"disableAll": true}}` in any settings file does the same for every session until you remove it.
  - **Project mods need workspace trust**, like project skills.
