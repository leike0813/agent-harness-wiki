  heading: "Install, remove, list, update, open"
official_url: "https://commandcode.ai/docs/mods"
excerpt: "`cmd mods add cmd-mod-hi # bare name = npm package cmd mods add @team/review-mod@1.2.0 # scoped npm name, pinned (npm: prefix optional) cmd mods add owner/repo@v1 # GitHub shorthand (any git host via git:<host>/…) cmd mods add ./tools/local-mod # local path, referenced in place cmd mods add -g owner/repo # user scope instead of project cmd mods list # alias: cmd mods ls cmd mods update # reinstall missing, reconcile pinned refs (alias: up) cmd mods remove owner/repo # alias: cmd mods rm cmd mods remove fun-stuff # by the name `mods list` prints cmd mods enable <name> # enable a mod; -g for user level cmd mods disable <name> # disable a mod; -g for user level cmd mods open # open the mods dir (project); --user for ~ `"
