  heading: Authentication with MCP servers
official_url: "https://commandcode.ai/docs/troubleshooting/common-issues"
excerpt: |-
  **Problem:** OAuth or token issues with an MCP server
  **Solutions:**
    1. Re-authenticate:
  `cmd mcp auth <server> `
    2. Clear and retry:
  `cmd mcp auth --clear <server> cmd mcp auth <server> `
    3. Check token status:
  `cmd mcp auth --status <server> `
  See the full MCP documentation for more details.
