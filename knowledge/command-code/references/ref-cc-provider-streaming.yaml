official_url: "https://commandcode.ai/docs/provider"
excerpt: |-
  Streaming is supported and can be received by setting `stream: true`.
  OpenAI (v1/chat/completions)OpenAI (v1/responses)Anthropic (/messages)
  `curl https://api.commandcode.ai/provider/v1/chat/completions \ -H "Authorization: Bearer <CMD_API_KEY>" \ -H "Content-Type: application/json" \ --no-buffer \ -d '{  "model": "deepseek/deepseek-v4-flash",  "messages": [{"role": "user", "content": "Count to 5."}],  "stream": true,  "stream_options": {"include_usage": true}  }' `
  Every endpoint emits token usage at the end of every stream. Chat Completions clients see a final `usage` chunk. Responses clients see usage on the terminal `response.completed` event. Anthropic clients see usage in the `message_delta` event. No opt-in required.
