  heading: Extra locations
official_url: "https://commandcode.ai/docs/skills"
excerpt: |-
  Beyond the standard directories, you can point Command Code at any skills folder - a directory of skills, or a single skill directory containing `SKILL.md`.
  **In settings** \- add a `skills` array to `settings.json` (user-global `~/.commandcode/settings.json`, project `.commandcode/settings.json`, or `.commandcode/settings.local.json`):
  `{ "skills": [ "~/team/shared-skills", "./vendor/skills", "/opt/company/skills" ] } `
  `~/` expands to your home directory; relative paths resolve against the project root (the git root, or the working directory outside a repo). Settings layers overwrite the array whole - the highest layer that defines `skills` wins.
