excerpt: |-
  Which model do sub-tasks use when I am on a BYOK model?
  Your BYOK session model, for everything. Compaction and summarization, sub-agents, title generation: all the side tasks default to the session model while a BYOK model is active, so nothing silently falls back to Command Code (or bills your plan) mid-session.
  Where are my API keys stored?
  Keys pasted in `/connect` live in `~/.commandcode/auth.json` (written `0600`), each under its provider's id, beside your Command Code login and subscription tokens. Logging out of Command Code strips only the account fields. Provider keys survive. Update a key any time with `r` on the provider's card in the /connect menu.
