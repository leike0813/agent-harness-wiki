  heading: "Your original log is never rewritten"
official_url: "https://commandcode.ai/docs/context"
excerpt: |-
  Compaction changes what is <strong>sent to the model</strong>, not what is <strong>stored</strong>. The session log is append-only: a compaction is recorded as its own entry in the session tree, pointing at the summary and the first kept message. Your full history remains on disk - checkpoint restore, <code>/rewind</code>, and session forking still see everything.</p>
