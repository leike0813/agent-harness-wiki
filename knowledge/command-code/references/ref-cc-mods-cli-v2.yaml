  heading: Manage mods from the CLI
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  `cmd mods add cmd-mod-hi # npm package (a bare name means npm)`
  `cmd mods add owner/repo@v1 # GitHub repo (other hosts: git:<host>/…)`
  `cmd mods list # list installed mods (alias: ls)`
  `cmd mods update # install anything missing, refresh pinned refs (alias: up)`
  `cmd mods remove owner/repo # remove by source (alias: rm)`
  `cmd mods open # this project's mods folder; --user for yours`
  `cmd mods inspect ./some-mod # what a mod hooks and reaches, without running it`
  `cmd mods list` prints one line per mod: its name, its scope, and where it comes from. Project mods come first, then user mods, then mods from packages. Built-in mods are not listed.
