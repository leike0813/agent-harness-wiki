  heading: Registration methods
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  Call these while the mod's factory runs. Each one returns a `Disposable`.
  Method| Signature
  `cmd.hooks`| `(hooks: ModHooks) => Disposable`
  `cmd.addTool`| `(tool: ToolModule) => Disposable`
  `cmd.addCommand`| `(command: {name; description?; argumentHint?; handler}) => Disposable`
  `cmd.addProvider`| `(module: ProviderModule) => Disposable`
  `cmd.addRenderer`| `(customType: string, (data) => readonly string[]) => Disposable`
  `cmd.addShortcut`| `(keys: string, {description?; handler}) => Disposable`
  `cmd.addSkillsPath`| `(path: string) => Disposable`
  `cmd.on`| `(event: AgentEventType | 'session_start' | 'session_shutdown', handler) => Disposable`
  `cmd.addAgent`| `(definition: {name; description; systemPrompt; tools?; disallowedTools?; model?; maxTurns?}) => Disposable`
