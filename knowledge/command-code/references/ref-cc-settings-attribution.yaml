official_url: "https://commandcode.ai/docs/settings"
excerpt: |-
  Controls the `Co-authored-by: CommandCodeBot <noreply@commandcode.ai>` trailer appended to commits. Configure it with:
  `{ "attribution": { "commit": "Co-authored-by: My Bot <bot@example.com>" } } `
    * **commit** : a non-empty value replaces the default trailer. It must be a single-line `Co-authored-by: Name <email>` trailer (max 200 characters); values that are not a co-author trailer are ignored. Empty string `""` turns the trailer off entirely.
    * **Precedence** : `settings.local.json` > project `settings.json` > user `settings.json`.
  Examples for valid/invalid `commit` values:
    1. allowed `"Co-authored-by: My Bot <bot@example.com>"`
    2. allowed `"Co-authored-by: dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>"`
    3.
