  heading: Built-in mods
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  Command Code's own features ride this exact API. First-party providers (`provider-anthropic` / `provider-copilot` / `provider-openai`), the update notice, and the harness-side titling and taste-learning triggers are **built-in mods**: compiled-in factories registered on the same host before any discovered mod. Some built-ins are **opt-in** and disabled by default; `cmd mods list --builtin` marks them `disabled by default`. Built-in mods always win a name collision against a discovered mod of the same name (the loader shadows the file with a warning), and they are compiled in - never jiti-loaded from a writable path, so they are not supply-chain surface.
