excerpt: |-
  **Option**| **Description**| **Example**
  ---|---|---
  `--effort <level>`| Set reasoning effort for this session only (`low`, `medium`, `high`, … - depends on the model). Not saved: use `/effort` or `--config effort=<level>` to change the default| `cmd --effort high`
  `--config <key=value>`| Set any setting headlessly - the CLI form of `/config`. Repeatable; invalid keys/values exit non-zero| `cmd --config theme=dark --config compact-mode=fast`
