  heading: How it behaves
official_url: "https://commandcode.ai/docs/import"
excerpt: |-
  **Additive.** `/import` never overwrites your existing Command Code configuration. Anything already present is left exactly as it is and reported as skipped.
  **Idempotent.** Running `/import` again is safe: nothing duplicates, nothing gets clobbered.
  **Fault-isolated.** Each item imports independently, and each source is scanned independently. One unreadable skill, one malformed MCP entry, or one source whose config format has changed can't take the rest of the run down; the failure is reported and everything else still goes through.
  Every item ends in one of four states, and the summary tells you which:
  Status| Meaning
  ---|---
  `imported`| Copied (or converted and copied) into your Command Code config
  `skipped-existing`| You already have something at that target path
