  heading: Background runs
official_url: "https://commandcode.ai/docs/agents"
excerpt: "A run can be detached. When it's started in the background (or the agent sets `background: true`), the `agent` tool returns right away with an `agent_id` and the main session keeps going. The result is collected later with the `agent_output` tool, which can `wait` for it, check `status`, or `kill` the run."
