  heading: Headless behavior at a glance
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  | `notify` | notice feed row | notice feed row | printed notice |
  | `toast` | line above the prompt, clears itself | app toast, clears itself | notice row |
  | `confirm` | modal | question in the composer | resolves `false` |
  | `select` / `input` | modal | question in the composer | resolves `undefined` |
  | `setStatus` | footer segment under the input | status row under the composer | stored, rendered nowhere |
  | `widget` | band above / below the prompt | band above / below the composer | stored, drawn nowhere |
  | `pane` | bordered panel above the prompt | card above the composer | stored, drawn nowhere |
  | `override` | redraws the spinner / tool / message / command rows | not drawn | stored, drawn nowhere |
  | `addShortcut` | dispatched after host bindings | never fires | never fires |
