  heading: Turn a mod into a package
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  List what the package contains in `package.json`. Entries can be exact paths, folders, or globs, relative to the package root. Entries that point outside the root are ignored.
  {
  	"name": "@team/review-mod",
  	"description": "Blocks risky diffs and adds a /review command.",
  	"keywords": ["cmd-mod", "cmd-mod-tool", "cmd-mod-command"],
  	"repository": "https://github.com/team/review-mod",
  	"commandcode": {
  		"mods": ["./src/review.ts", "src/checks/*.ts"],
  		"skills": ["./skills"]
  	}
  }
  Without `commandcode.mods`, Command Code looks for a `mods/` folder, then a root `index.ts`.
  `commandcode.skills` lists skill folders the package ships next to its mods. ... A mod can add skills from code too, with `cmd.addSkillsPath`.
