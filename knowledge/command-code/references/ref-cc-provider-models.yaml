excerpt: "OpenAI and open models answer on `/v1/chat/completions`, and most of them on `/v1/responses` as well. Claude models answer on `/v1/messages` only. Each model in the models list https://api.commandcode.ai/provider/v1/models carries a `supported_endpoints` field with the routes that serve it, so check there before you pick an endpoint."
