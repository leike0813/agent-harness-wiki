  heading: Footer status segments
official_url: "https://commandcode.ai/docs/mods"
excerpt: |-
  `cmd.ui.setStatus(text | null)` - a persistent per-mod segment on the TUI's status row (under the input). One segment per mod: a new call replaces the text, `null` (or whitespace-only text) clears it, and the returned `Disposable` clears it too - but only while it still owns the segment. Segments from multiple mods render after the row's built-in items in load order. Headless: stored, rendered nowhere.
  `cmd.ui.capabilities.status` / `cmd.ui.capabilities.surface` - whether this host renders footer segments, and widgets / panes / toasts (true in the interactive TUI and the desktop app, false headless). Use them to pick a surface instead of shipping a permanent fallback.
