  heading: Where Codex loads local skills
official_url: https://learn.chatgpt.com/docs/build-skills.md
excerpt: "Codex reads skills from repository, user, admin, and system locations. For repositories, Codex scans `.agents/skills` in every directory from your current working directory up to the repository root. If two skills share the same `name`, Codex doesn't merge them; both can appear in skill selectors."
