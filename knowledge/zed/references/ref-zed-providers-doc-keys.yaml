  heading: "API Keys and Environment Variables {#api-keys}"
official_url: "https://zed.dev/docs/ai/use-api-access.md"
excerpt: |-
  Most API-access providers can be configured on the **Settings → AI → LLM Providers** page with <code class="hljs">agent: open settings</code>. Keys saved through Zed are stored in the system keychain, not in `settings.json`.
  Zed also reads provider-specific environment variables. Non-empty [environment variables](../environment.md) take precedence over keychain values. If a key comes from an environment variable, unset the variable and restart Zed to stop using it.
  | Provider          | Environment variable                                  |
  | ----------------- | ----------------------------------------------------- |
  | Anthropic         | `ANTHROPIC_API_KEY`                                   |
  | OpenAI            | `OPENAI_API_KEY`                                      |
