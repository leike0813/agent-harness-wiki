excerpt: |-
  Creating an extension is not the only way to use MCP servers in Zed.
  You can connect both local and remote MCP servers from **[Settings → AI → MCP Servers](./agent-settings.md)** (also accessible via the <code class="hljs">agent: open settings</code> action, then selecting `MCP Servers`). Click `Add Server` in the page header, then choose `Add Local Server` or `Add Remote Server`. Your specified configuration will create entries in your settings file (which you can open with <code class="hljs">zed: open settings file</code>) similar to the ones below:
  ```json
  {
    "context_servers": {
      "local-mcp-server": {
        "command": "some-command",
        "args": ["arg-1", "arg-2"],
        "env": {}
      },
      "remote-mcp-server": {
        "url": "https://example.com/mcp",
