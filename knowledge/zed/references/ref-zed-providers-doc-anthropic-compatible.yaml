  heading: "Anthropic-Compatible Endpoints {#anthropic-compatible}"
official_url: "https://zed.dev/docs/ai/use-api-access.md"
excerpt: |-
  Use an Anthropic-compatible endpoint when a service implements Anthropic's [Messages API](https://docs.anthropic.com/en/api/messages) (`/v1/messages`) and gives you a custom base URL, model ID, and API key.
  You can add a custom Anthropic-compatible provider from Agent Settings with <code class="hljs">agent: open settings</code>. Look for `Add Provider` in the [LLM Providers](./llm-providers.md) section, choose `Anthropic`, and fill in the provider name, API URL, model ID, and context window.
  You can also configure the provider in your settings file:
  ```json
  {
    "language_models": {
      "anthropic_compatible": {
        "Some Provider": {
          "api_url": "https://api.someprovider.com",
          "custom_headers": {
            "X-Some-Header": "some-value"
          },
