  heading: Theme
official_url: "https://zed.dev/docs/reference/all-settings.md"
excerpt: |-
  - Description: The theme setting can be specified in two forms - either as the name of a theme or as an object containing the `mode`, `dark`, and `light` themes for the Zed UI.
  - Setting: `theme`
  - Default: `One Dark`
  ### Theme Object
  - Description: Specify the theme using an object that includes the `mode`, `dark`, and `light` themes.
  - Setting: `theme`
  - Default:
  ```json
  {
    "theme": {
      "mode": "system",
      "dark": "One Dark",
      "light": "One Light"
    }
  }
  ```
  ### Mode
  - Description: Specify theme mode.
  - Setting: `mode`
  - Default: `system`
  **Options**
  1. Set the theme to dark mode
  ```json
  {
    "theme": {
      "mode": "dark",
      "dark": "One Dark",
      "light": "One Light"
    }
  }
  ```
