  heading: "Install from the ACP Registry {#registry}"
official_url: "https://zed.dev/docs/ai/external-agents.md"
excerpt: |-
  The ACP Registry is the primary way to install common External Agents in Zed.
  Open the registry with <code class="hljs">zed: acp registry</code>, or open [Agent Settings](./agent-settings.md) with <code class="hljs">agent: open settings</code>, go to the **External Agents** page, click `Add Agent`, and choose `Install from Registry`.
  After installation, the agent appears in the new-thread menu in the Agent Panel and Threads Sidebar.
