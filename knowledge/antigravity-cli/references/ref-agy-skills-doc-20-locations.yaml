excerpt: |-
  Antigravity 2.0 loads skills from two primary locations:

  | Location | Scope |
  | :-- | :-- |
  | `<workspace-root>/.agents/skills/<skill-folder>/` | Workspace-specific |
  | `~/.gemini/config/skills/<skill-folder>/` | Global (all workspaces) |
