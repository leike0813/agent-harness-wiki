  heading: 'MCP Permissions and Access Control'
official_url: https://antigravity.google/docs/mcp.md
excerpt: |-
  By default, unconfigured MCP tools run in **Ask** mode, requiring your approval before execution. You can allow specific tools or entire servers in your policy configuration:

  *   `mcp(server/tool)`: Matches a specific tool on a specific server.
  *   `mcp(server/*)`: Matches all tools on a specified server.
  *   `mcp(*)`: Global wildcard matching any MCP tool across all connected servers.
