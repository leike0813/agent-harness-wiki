excerpt: "<!-- Generated by scripts/gen-config-catalog.ts — do not edit by hand.\n     Run `pnpm run gen-config-catalog` to regenerate. -->\n\n# Plugin Config Catalog\n\nEvery `config:` block a `cordis.yml` entry can set: for each loadable harness package, the verbatim config declaration (JSDoc included) its `apply` function or service constructor receives, with every referenced type pasted alongside (package-local types) or linked (everything else). The paste is the plugin's full declared config type — a field the runtime schema deliberately excludes is a runtime-only seam (its own JSDoc says so) and is not settable from `cordis.yml`"
