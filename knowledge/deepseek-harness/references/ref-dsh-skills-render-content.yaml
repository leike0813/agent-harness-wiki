excerpt: "export function renderSkillContent(skill: Pick<SkillDefinition, 'name' | 'provider' | 'resourceBase' | 'content'>): string {\n  const resourceHint = renderResourceHint(skill)\n  return [\n    `<skill_content name=\"${escapeAttr(skill.name)}\">`,\n    '<skill_resources>',\n    ...resourceHint,\n    '</skill_resources>',\n    '',\n    '<skill_instructions>',\n    skill.content,\n    '</skill_instructions>',\n    '</skill_content>',\n  ].join('\\n')\n}"
