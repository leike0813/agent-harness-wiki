excerpt: '`SessionLocation` is not a consumer-facing query: log access goes through a session handle''s `read`. It survives only as refusal diagnostics, letting a `SessionFormatUnsupportedError` name the raw log a build refused to interpret. JSONL supplies the absolute transcript path inside its project/session directory; a backend without one artifact per session supplies nothing.'
