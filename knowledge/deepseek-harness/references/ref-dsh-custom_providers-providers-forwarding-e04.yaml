excerpt: "Two account for most of it. A model that declares reasoning has its system prompt sent as `role: \"developer\"`, which many gateways reject outright, and the output cap is sent as `max_completion_tokens`, which a server that only knows `max_tokens` refuses. The form has no field for either; correct them on the route in `$DSH_HOME/profiles/<profile>/cordis.patch.yml`:"
