  ## Enabling or Disabling MCP Servers
  Disabling your MCP Servers here will remove all MCP related logic and definitions from your system prompt, reducing your token usage. This will prevent Zoo Code from connecting to any MCP servers, and the `use_mcp_tool` and `access_mcp_resource` tools will not be available. Check this off if you don't intend to use MCP Servers. This is on by default.
  1. Click the <Codicon name="server" /> icon in the top navigation of the Zoo Code pane
  2. Check/Uncheck `Enable MCP Servers`
    <img src="/img/using-mcp-in-roo/using-mcp-in-roo-2.png" alt="Enable MCP Servers toggle" width="400" />
