excerpt: |-
  Zoo Code provides several useful commands accessible via the VS Code Command Palette (`Ctrl/Cmd + Shift + P`). These commands offer alternative ways to manage your settings and storage.
  ### Set Custom Storage Path
  **Command:** `roo-cline.setCustomStoragePath`
  Opens a dialog to set a custom storage directory for Zoo Code data. By default, Zoo Code stores task history, settings, and other data in the standard VS Code extension storage location. This command allows you to choose an alternative location.
  **Use cases:**
  - **Team Collaboration**: Store Zoo Code data in a shared network folder so team members can access the same task history and settings
  - **Drive Management**: Keep data on a specific drive (e.g., a larger secondary drive instead of your primary SSD)
