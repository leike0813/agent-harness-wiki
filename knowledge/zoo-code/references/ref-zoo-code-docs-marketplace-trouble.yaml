excerpt: |-
  ### Installation Errors
  - **Invalid YAML/JSON**: The configuration file (`.roomodes`, `.roo/mcp.json`, etc.) has a syntax error. To prevent data loss, Zoo Code will not modify a corrupted configuration file. Please fix the syntax error before installing or removing items.
  - **File Not Found**: Rare error - Zoo Code automatically creates necessary configuration files.
  ### Item Not Working
  If an installed item isn't working:
  1. **Check the configuration file**: Verify the item was added correctly.
  2. **Restart VS Code**: New configurations sometimes require a restart.
  3. **Check prerequisites**: Review the item's description for any requirements.
  4. **Check Zoo Code logs**: Look for error messages in the Zoo Code output panel.
