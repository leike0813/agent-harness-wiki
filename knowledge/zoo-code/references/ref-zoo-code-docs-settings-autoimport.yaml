excerpt: |-
  Automatically import your Zoo Code settings from a file every time you start VS Code. This is a practical way to sync your configuration across multiple machines or standardize settings for your entire team.
  ### Key Features
  - **Effortless Sync**: Keep your settings consistent across different workspaces and devices.
  - **Team Standardization**: Share a single configuration file to ensure your whole team uses the same settings.
  - **Flexible Pathing**: Works with absolute paths, or paths relative to your home directory (e.g., `~/Documents/roo-settings.json`).
  - **Silent & Safe**: If the file isn't found or contains errors, Zoo Code starts up normally without blocking your workflow.
