excerpt: |-
  The marketplace offers two types of items:
  ### MCPs (Model Context Protocol)
  MCPs allow Zoo Code to connect to and interact with various AI models, APIs, and other external tools. By installing an MCP, you can configure Zoo Code to use different language models (like those from OpenAI, Anthropic, or others) or to integrate with other services. Learn more about [What is MCP?](/features/mcp/what-is-mcp) and [how to use MCP in Zoo Code](/features/mcp/using-mcp-in-roo).
  <img src="/img/marketplace/marketplace-1.png" alt="MCP tab showing available MCPs with install and remove buttons" width="500" />
  ### Modes
  Modes are custom sets of instructions and rules that tailor Zoo Code's behavior for specific tasks.
