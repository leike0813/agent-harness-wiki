  heading: How It Works
official_url: "https://github.com/Zoo-Code-Org/Zoo-Code-Docs"
excerpt: |-
  1.  When in the [`🪃 Orchestrator`](/basic-usage/using-modes#orchestrator-mode-aka-boomerang-mode) mode (aka Boomerang Mode), Zoo analyzes a complex task and suggests breaking it down into a subtask[^1].
  2.  The parent task (in Orchestrator mode) pauses, and the new subtask begins in a different, specialized mode[^2].
  3.  When the subtask's goal is achieved, Zoo signals completion.
  4.  The parent task resumes with only the summary[^3] of the subtask. The parent uses this summary to continue the main workflow.
  ---
