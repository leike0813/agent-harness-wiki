    locator: "SAFETY.md, Experimental status and Sandbox limitations @ da00f7f5358f2949383b35c14f548bc20187d80c"
    excerpt: "DeepSeek Harness is experimental developer-preview software. It has not undergone a security audit and must not be treated as secure or production-ready.\n\nThe project can execute model-generated code and commands, load third-party plugins, and access the network, processes, credentials, and files made available to it. ...\n\n## Sandbox limitations\n\nSandboxing, approval prompts, and permission controls can reduce risk, but they do not guarantee isolation or prevent damage. Even correctly enforced restrictions cannot protect resources that the project is allowed to access."
