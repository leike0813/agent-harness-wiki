    locator: "libs/code/README.md @ c9b2ce194e422d2a61b9faf3732da15d90623c13"
    excerpt: "The fastest way to start using Deep Agents. deepagents-code is a pre-built coding agent in your terminal — similar to Claude Code or Cursor — powered by any LLM that supports tool calling. One install command and you're up and running, no code required. By default, dcode trusts the directory you run it in; human-in-the-loop approval gates model-requested tool calls, but project artifacts are read before any approval prompt."
