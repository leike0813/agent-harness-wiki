    locator: "apps/desktop/README.md, Electron shell and port description @ da00f7f5358f2949383b35c14f548bc20187d80c"
    excerpt: "The desktop application is an Electron shell around the complete dsh Web application. An Electron RunAsNode child starts the shared profile runner, and Electron immediately loads the packaged Web entry at `dsh-app://app/`. ... Desktop listens on an OS-assigned port by default, so it cannot collide with Web's `3080` or a reserved port; a `webserver.config.port` patch can override it."
