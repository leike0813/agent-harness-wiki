  - reference_id: cat-deepseek-harness-readme
    harness_id: deepseek-harness
    official_url: "https://github.com/deepseek-ai/deepseek-harness/blob/da00f7f5358f2949383b35c14f548bc20187d80c/README.md"
    captured_at: "2026-10-03T01:47:14Z"
    snapshot:
