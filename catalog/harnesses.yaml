    locator: "README.md @ c9b2ce194e422d2a61b9faf3732da15d90623c13"
    excerpt: "The batteries-included agent harness. Deep Agents is an open source agent harness — an opinionated agent that runs out of the box. Extend, override, or replace any piece. Principles: Opinionated — defaults tuned for long-horizon, multi-step work; Extensible — override or replace any piece without forking; Model-agnostic — works with any LLM that supports tool calling; Production-ready — built on LangGraph (streaming, persistence, checkpointing) with first-class tracing, evaluation, and deployment via LangSmith."
