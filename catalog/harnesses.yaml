      archive_path: "archive/catalog/deepseek-harness/readme.md"
    locator: "README.md, first description and developer preview notice @ da00f7f5358f2949383b35c14f548bc20187d80c"
    excerpt: "DeepSeek Harness (`dsh`) is an open-source agent harness developed by [DeepSeek AI](https://deepseek.com).\n\nIt is built on an **everything-is-a-plugin** architecture and powered by [Cordis](https://github.com/cordiverse/cordis), whose design is described in [_A Programming Paradigm for Spatiotemporal Composability_](https://arxiv.org/abs/2608.25512).\n\nDocumentation: [https://deepseek-harness.github.io/deepseek-harness/](https://deepseek-harness.github.io/deepseek-harness/)\n\n## Developer preview\n\nDeepSeek Harness is in _developer preview_ and iterating rapidly. **THERE WILL BE COMPATIBILITY-BREAKING CHANGES.**"
  - reference_id: cat-deepseek-harness-entry-modes
    harness_id: deepseek-harness
    official_url: "https://github.com/deepseek-ai/deepseek-harness/blob/da00f7f5358f2949383b35c14f548bc20187d80c/apps/cli/README.md"
    captured_at: "2026-10-03T01:47:14Z"
    snapshot:
      kind: git_commit
      sha256: "4888e4e05d413915aaf013d6dea00278b251adbf16045d0048ac2242851a03c7"
      revision: "da00f7f5358f2949383b35c14f548bc20187d80c"
      archive_path: "archive/catalog/deepseek-harness/cli-readme.md"
    locator: "apps/cli/README.md, launcher description and Entry modes table @ da00f7f5358f2949383b35c14f548bc20187d80c"
    excerpt: "The `dsh` command is the sole supported Node application launcher: profiles are ordered stacks of plugin-bundle patch layers under the user's own overrides. SDK and ACP are profiles, not separate public bins. The Python runtime wheel packages this same command; the SDK defaults to `sdk`, and the minimal example selects `sdk-minimal`. ...\n\n| `dsh --profile acp` | Serve automation clients over ACP stdio until disconnect. |\n| `dsh --profile headless \"job\"` | Run one fresh persisted session, print the final answer, and exit. |\n| `dsh --profile sdk` | Serve SDK clients over JSON-RPC stdio until shutdown or disconnect. |\n| `dsh --profile sdk-minimal` | Serve SDK clients with the standalone minimal agent tree. |\n| `dsh web` | Boot the Web profile. |"
